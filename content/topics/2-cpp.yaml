topics:
  - slug: c-vs-cpp
    title: "C vs C++: what's the difference?"
    lang: cpp
    description: How C++ builds on C with classes, references, RAII, templates and the standard library, and when each language is used.
    modules: [cpp-basics]
    body: |
      C++ started as "C with classes" and most C code is also valid C++, with a few differences (C++ needs a cast on `malloc`'s result, for example). What C++ adds:

      - **Classes** with constructors and destructors, so objects clean up after themselves (RAII).
      - **References**, a safer alternative to many pointer uses.
      - **The standard library**: `std::string`, `std::vector`, `std::map`, algorithms and smart pointers, so you rarely manage memory by hand.
      - **Templates** for generic code, and **exceptions** for error handling.

      C is still the language of operating system kernels, embedded firmware and libraries that every other language calls. C++ dominates games, browsers, databases, trading systems and high-performance applications. Learning C first makes C++'s features make sense, which is why this course does it in that order.
    example: |
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> names{"Ada", "Linus"};
          names.push_back("Bjarne");
          for (const auto &n : names) std::cout << n << " ";
          std::cout << "\n";
          return 0;
      }

  - slug: cpp-references
    title: References in C++
    lang: cpp
    description: What a C++ reference is, pass by reference vs pass by value, const references, and references vs pointers.
    modules: [cpp-refs]
    body: |
      A reference is another name for an existing object: `int &r = x;` means using `r` is using `x`. Unlike a pointer, a reference must be bound when it's created, can't be null, and can't be re-pointed.

      References shine as parameters:

      - `void f(int &x)` lets the function change the caller's variable.
      - `void f(const std::string &s)` avoids copying a big object while promising not to change it. This is the everyday way to pass objects you only read.

      Never return a reference to a local variable: the local is destroyed when the function returns.
    visual: references
    example: |
      #include <iostream>
      #include <string>

      void shout(std::string &s) { s += "!"; }
      std::size_t len(const std::string &s) { return s.size(); }

      int main() {
          std::string msg = "hello";
          shout(msg);
          std::cout << msg << " " << len(msg) << "\n";
          return 0;
      }

  - slug: cpp-classes
    title: Classes and objects in C++
    lang: cpp
    description: Member variables and functions, public and private, constructors, initializer lists and const member functions.
    modules: [cpp-classes]
    body: |
      A class bundles data with the functions that work on it. Keep the data `private` and expose `public` member functions, so the class can guarantee its **invariants** (rules that are always true, like "balance is never negative").

      A **constructor** sets up a new object; use the member initializer list (`: balance_(start)`) to initialize fields. Mark member functions that don't change the object `const`, so they can be called on const objects.

      Inside a member function, `this` points at the object it was called on.
    visual: class-object
    example: |
      #include <iostream>

      class Counter {
      public:
          explicit Counter(int start) : count_(start) {}
          void increment() { ++count_; }
          int value() const { return count_; }

      private:
          int count_;
      };

      int main() {
          Counter c(10);
          c.increment();
          c.increment();
          std::cout << c.value() << "\n";
          return 0;
      }

  - slug: raii
    title: RAII and destructors in C++
    lang: cpp
    description: Resource Acquisition Is Initialization explained, how destructors free resources automatically, and the rule of zero.
    modules: [cpp-raii]
    body: |
      **RAII** ties a resource to an object's lifetime: the constructor acquires it and the destructor releases it. Because destructors run automatically when an object goes out of scope, including on early returns and exceptions, cleanup can't be forgotten.

      The standard library is built on it: `std::vector` frees its memory, `std::fstream` closes its file, `std::lock_guard` unlocks its mutex, and `std::unique_ptr` deletes its object.

      Objects are destroyed in **reverse** order of creation. Following the **rule of zero**, most classes should hold RAII members and write no destructor or copy operations at all.
    visual: destructors
    example: |
      #include <iostream>

      struct Guard {
          const char *name;
          explicit Guard(const char *n) : name(n) { std::cout << "acquire " << name << "\n"; }
          ~Guard() { std::cout << "release " << name << "\n"; }
      };

      int main() {
          Guard a("file");
          {
              Guard b("lock");
          }
          std::cout << "done\n";
          return 0;
      }

  - slug: operator-overloading
    title: Operator overloading in C++
    lang: cpp
    description: Make your types work with +, ==, <<, [] and more, with the conventions that keep overloaded operators unsurprising.
    modules: [cpp-operators]
    body: |
      You can define what operators mean for your own types, so a `Vec2` can be added with `+` and printed with `<<`.

      Guidelines:

      - Only overload an operator when its meaning is obvious (math types, containers, comparisons).
      - Implement `+=` as a member and `+` in terms of it.
      - `operator<<` for printing takes `std::ostream &` and returns it, so calls can chain.
      - In C++20, `bool operator==(const T &) const = default;` and `auto operator<=>(const T &) const = default;` generate comparisons for you.
    example: |
      #include <iostream>

      struct Vec2 {
          int x, y;
          Vec2 &operator+=(const Vec2 &o) { x += o.x; y += o.y; return *this; }
          bool operator==(const Vec2 &) const = default;
      };
      Vec2 operator+(Vec2 a, const Vec2 &b) { return a += b; }
      std::ostream &operator<<(std::ostream &os, const Vec2 &v) { return os << "(" << v.x << ", " << v.y << ")"; }

      int main() {
          Vec2 a{1, 2}, b{3, 4};
          std::cout << a + b << " " << (a == Vec2{1, 2}) << "\n";
          return 0;
      }

  - slug: std-vector
    title: std::vector in C++
    lang: cpp
    description: How to use std::vector, the dynamic array of C++, plus size vs capacity, reserve, and iterator invalidation.
    modules: [cpp-vector]
    body: |
      `std::vector<T>` is a resizable array that manages its own memory. It's the default container in C++: fast to iterate, indexable in O(1), and `push_back` is amortized O(1).

      - `v.size()` is how many elements there are; `v.capacity()` is how many fit before it must grow.
      - When it grows, it moves everything to a bigger block, which invalidates pointers and iterators into it. `reserve(n)` avoids repeated growth when you know the size.
      - `v[i]` doesn't check bounds; `v.at(i)` does.
      - Loop with `for (const auto &x : v)`.
    visual: vector-growth
    example: |
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v;
          v.reserve(4);
          for (int i = 1; i <= 4; i++) v.push_back(i * i);
          int sum = 0;
          for (int x : v) sum += x;
          std::cout << v.size() << " " << sum << "\n";
          return 0;
      }

  - slug: std-map
    title: std::map and std::unordered_map
    lang: cpp
    description: Key-value lookups in C++, the difference between map and unordered_map, and the operator[] insertion trap.
    modules: [cpp-containers]
    body: |
      Both store key-value pairs with unique keys:

      | Property | `std::map` | `std::unordered_map` |
      |---|---|---|
      | Built on | balanced tree | hash table |
      | Lookup | O(log n) | O(1) on average |
      | Order | sorted by key | none |

      Use `unordered_map` for fast lookups and `map` when you need keys in order. Watch out: `m[key]` **inserts** a default value if the key is missing. To check without inserting, use `m.contains(key)` (C++20) or `m.find(key)`.
    example: |
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, int> ages{{"Linus", 55}, {"Ada", 36}};
          ages["Grace"] = 85;
          for (const auto &[name, age] : ages) std::cout << name << "=" << age << " ";
          std::cout << "\n" << ages.contains("Alan") << " " << ages.size() << "\n";
          return 0;
      }

  - slug: lambdas
    title: Lambdas in C++
    lang: cpp
    description: Writing lambda functions in C++, capture by value and by reference, and using lambdas with STL algorithms.
    modules: [cpp-algorithms]
    body: |
      A lambda is an unnamed function you can write inline: `[capture](parameters) { body }`.

      The capture list decides which outside variables it can use:

      - `[x]` copies `x` when the lambda is created.
      - `[&x]` refers to the real `x` (it must outlive the lambda).
      - `[=]` and `[&]` capture everything used, by copy or by reference.

      Lambdas are most useful as arguments to algorithms like `std::sort`, `std::count_if` and `std::transform`.
    example: |
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> v{5, 12, 7, 20, 3};
          int limit = 6;
          auto big = std::count_if(v.begin(), v.end(), [limit](int x) { return x > limit; });
          std::sort(v.begin(), v.end(), [](int a, int b) { return a > b; });
          std::cout << big << " " << v.front() << "\n";
          return 0;
      }

  - slug: stl-algorithms
    title: STL algorithms in C++
    lang: cpp
    description: sort, find, count_if, accumulate, transform and friends, and why algorithms beat hand-written loops.
    modules: [cpp-algorithms, cpp-stl]
    body: |
      `<algorithm>` and `<numeric>` hold dozens of tested building blocks that work on any range:

      - `std::sort`, `std::stable_sort`
      - `std::find`, `std::find_if`, `std::count_if`, `std::any_of`
      - `std::accumulate` (sum or fold), `std::transform` (map)
      - `std::lower_bound` (binary search on sorted data)
      - `std::erase_if` (C++20) to remove matching elements

      Using a named algorithm says what the code does, and avoids off-by-one mistakes. C++20 ranges let you pass the container directly: `std::ranges::sort(v)`.
    example: |
      #include <algorithm>
      #include <iostream>
      #include <numeric>
      #include <vector>

      int main() {
          std::vector<int> v{4, 8, 15, 16, 23, 42};
          int total = std::accumulate(v.begin(), v.end(), 0);
          bool has_odd = std::any_of(v.begin(), v.end(), [](int x) { return x % 2 != 0; });
          std::erase_if(v, [](int x) { return x > 20; });
          std::cout << total << " " << has_odd << " " << v.size() << "\n";
          return 0;
      }

  - slug: smart-pointers
    title: "Smart pointers: unique_ptr, shared_ptr and weak_ptr"
    lang: cpp
    description: How C++ smart pointers own heap objects and free them automatically, and when to use each one.
    modules: [cpp-smart]
    body: |
      Smart pointers own a heap object and delete it for you:

      - `std::unique_ptr<T>`: exactly one owner. Can't be copied, only moved. Zero overhead. **The default choice.** Make one with `std::make_unique<T>(args)`.
      - `std::shared_ptr<T>`: shared ownership with a reference count; the last owner deletes it. Use only when ownership is genuinely shared.
      - `std::weak_ptr<T>`: watches a shared object without keeping it alive, to break reference cycles.

      With smart pointers and containers, modern C++ code almost never calls `new` or `delete` directly.
    visual: unique-ptr
    example: |
      #include <iostream>
      #include <memory>
      #include <string>

      struct Enemy {
          std::string name;
          explicit Enemy(std::string n) : name(std::move(n)) {}
          ~Enemy() { std::cout << name << " removed\n"; }
      };

      int main() {
          auto boss = std::make_unique<Enemy>("Boss");
          std::unique_ptr<Enemy> owner = std::move(boss);
          std::cout << (boss == nullptr) << " " << owner->name << "\n";
          return 0;
      }

  - slug: move-semantics
    title: Move semantics and std::move
    lang: cpp
    description: What moving means in C++, rvalue references, what std::move really does, and the rule of five.
    modules: [cpp-move]
    body: |
      Copying a `std::vector` of a million elements copies a million elements. **Moving** it just hands over the internal buffer pointer, and in practice leaves the source empty. That's why returning big objects by value is cheap in modern C++.

      A class supports moving with a **move constructor** `T(T &&other) noexcept` and **move assignment**. `std::move(x)` doesn't move anything itself: it's a cast that says "you may steal from x". After a move, only assign to or destroy the source.

      Mark move operations `noexcept`, or `std::vector` will copy instead of move when it grows (for any type that can be copied).
    visual: move-vector
    example: |
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      int main() {
          std::string big(1000, 'x');
          std::vector<std::string> v;
          v.push_back(std::move(big));
          std::cout << v[0].size() << " " << big.empty() << "\n";
          return 0;
      }

  - slug: templates
    title: Templates in C++
    lang: cpp
    description: Function and class templates in C++, type deduction, and constraining templates with C++20 concepts.
    modules: [cpp-templates, cpp-generic]
    body: |
      A template is a blueprint the compiler fills in for each type you use it with. `std::vector<int>` and `std::vector<std::string>` are two different classes generated from one template.

      Function templates usually deduce their types from the arguments: `max_of(3, 7)` uses `T = int`.

      C++20 **concepts** state what a template needs, such as `template <std::integral T>`, which gives far clearer error messages than the old walls of template errors.
    example: |
      #include <concepts>
      #include <iostream>
      #include <string>

      template <typename T>
      T max_of(T a, T b) { return a < b ? b : a; }

      template <std::integral T>
      bool is_even(T n) { return n % 2 == 0; }

      int main() {
          std::cout << max_of(3, 7) << " " << max_of(std::string("fig"), std::string("apple")) << " " << is_even(10) << "\n";
          return 0;
      }

  - slug: virtual-functions
    title: Inheritance and virtual functions in C++
    lang: cpp
    description: Base and derived classes, virtual functions and override, abstract classes, and why virtual destructors matter.
    modules: [cpp-oop]
    body: |
      A derived class inherits from a base class and can **override** its `virtual` functions. Calling a virtual function through a base pointer or reference runs the version for the object's real type: that's **runtime polymorphism**.

      - Write `override` on overrides so the compiler catches signature mistakes.
      - A pure virtual function (`= 0`) makes the class abstract: an interface that can't be instantiated.
      - Give a polymorphic base class a `virtual` destructor, or deleting through a base pointer is undefined behavior.
      - Pass polymorphic objects by reference or pointer; passing by value **slices** off the derived part.
    visual: virtual-dispatch
    example: |
      #include <iostream>
      #include <memory>
      #include <vector>

      struct Shape {
          virtual double area() const = 0;
          virtual ~Shape() = default;
      };
      struct Rect : Shape {
          double w, h;
          Rect(double w_, double h_) : w(w_), h(h_) {}
          double area() const override { return w * h; }
      };
      struct Circle : Shape {
          double r;
          explicit Circle(double r_) : r(r_) {}
          double area() const override { return 3.14 * r * r; }
      };

      int main() {
          std::vector<std::unique_ptr<Shape>> shapes;
          shapes.push_back(std::make_unique<Rect>(2, 3));
          shapes.push_back(std::make_unique<Circle>(1));
          double total = 0;
          for (const auto &s : shapes) total += s->area();
          std::cout << total << "\n";
          return 0;
      }

  - slug: modern-cpp
    title: "Modern C++: C++17 and C++20 features"
    lang: cpp
    description: The modern C++ features worth knowing, from auto and structured bindings to std::optional, concepts and ranges.
    modules: [cpp-modern]
    body: |
      Modern C++ (C++11 onward, and especially C++17 and C++20) is much friendlier than older styles:

      - `auto` type deduction and range-based `for`
      - **structured bindings**: `auto [key, value] = pair;`
      - `std::optional<T>` for "a value or nothing"
      - `std::variant` for "one of these types"
      - `std::string_view` and `std::span` for non-owning views
      - C++20: **concepts**, **ranges**, `<=>` comparisons, `std::format`

      Together with smart pointers and RAII, these let you write code that is both fast and hard to misuse.
    example: |
      #include <iostream>
      #include <map>
      #include <optional>
      #include <string>

      std::optional<int> find_age(const std::map<std::string, int> &m, const std::string &name) {
          auto it = m.find(name);
          if (it == m.end()) return std::nullopt;
          return it->second;
      }

      int main() {
          std::map<std::string, int> ages{{"Ada", 36}};
          auto a = find_age(ages, "Ada");
          auto b = find_age(ages, "Bob");
          std::cout << a.value_or(-1) << " " << b.has_value() << "\n";
          return 0;
      }

  - slug: error-handling
    title: Error handling in C and C++
    lang: cpp
    description: Return codes, errno, exceptions, std::optional and std::expected, and how to choose between them.
    modules: [cpp-errors]
    body: |
      There are several ways to report that something failed:

      - **Return codes** (C style): return -1 or `NULL` and set `errno`. Simple, but easy to ignore.
      - **Exceptions** (`throw` / `try` / `catch`): errors can't be silently ignored, and RAII cleans up as the stack unwinds. Standard C++ uses them for truly exceptional failures.
      - **`std::optional<T>`**: "a value or nothing", when the reason doesn't matter.
      - **`std::expected<T, E>`** (C++23): a value or an error explaining why.

      Whatever you pick, be consistent within a codebase, and never let a failure pass silently.
    example: |
      #include <charconv>
      #include <iostream>
      #include <optional>
      #include <string_view>

      std::optional<int> parse_int(std::string_view s) {
          int value = 0;
          auto [end, ec] = std::from_chars(s.data(), s.data() + s.size(), value);
          if (ec != std::errc() || end != s.data() + s.size()) return std::nullopt;
          return value;
      }

      int main() {
          std::cout << parse_int("42").value_or(-1) << " " << parse_int("4x2").has_value() << "\n";
          return 0;
      }

  - slug: threads-and-mutexes
    title: "Threads, mutexes and data races in C++"
    lang: cpp
    description: Start threads with std::thread, protect shared data with std::mutex and lock_guard, and understand data races, atomics and deadlock.
    modules: [cpp-concurrency]
    native: true
    body: |
      A **thread** is an independent path of execution inside your program. All threads share the program's memory, which is what makes them fast to coordinate and also what makes them dangerous.

      - `std::thread t(f);` starts running `f` right away. `t.join()` waits for it to finish. Every `std::thread` must be joined (or detached) before it's destroyed, or the program terminates. C++20's `std::jthread` joins automatically.
      - A **data race** is two threads touching the same memory at the same time, at least one writing, with nothing to synchronize them. It's undefined behavior, and even `counter++` races, because it's a separate load, add and store.
      - A `std::mutex` lets one thread at a time into a **critical section**. Lock it with `std::lock_guard`, which unlocks automatically at the end of the scope.
      - `std::atomic<int>` makes single operations like `++` and `fetch_add` indivisible, with no mutex needed.
      - Two threads locking two mutexes in opposite orders can **deadlock**. Lock several at once with `std::scoped_lock`, or always lock in one agreed order.

      The browser compiler on this site has no threads, so this example was compiled with `g++ -std=c++20 -pthread` and run on Linux. Build with `-fsanitize=thread` while developing: ThreadSanitizer reports data races and lock-order problems as they happen.
    example: |
      #include <iostream>
      #include <mutex>
      #include <thread>
      #include <vector>

      int main() {
          long long total = 0;
          std::mutex m;
          std::vector<std::thread> workers;
          for (int t = 0; t < 4; t++) {
              workers.emplace_back([&total, &m, t] {
                  long long mine = 0;                      // work on private data...
                  for (int i = 1; i <= 1000; i++) mine += i * (t + 1);
                  std::lock_guard<std::mutex> lock(m);     // ...then lock once to combine
                  total += mine;
              });
          }
          for (auto& w : workers) w.join();
          std::cout << "total " << total << "\n";
          return 0;
      }

  - slug: memory-ordering
    title: "C++ memory ordering: relaxed, acquire and release"
    lang: cpp
    description: What std::memory_order means, why compilers and processors reorder memory accesses, and how release and acquire publish data safely between threads.
    modules: [cpp-concurrency]
    native: true
    body: |
      Compilers and processors reorder memory accesses to go faster. Inside one thread you can never tell, but another thread can see your writes in a different order than you made them. Every atomic operation takes a **memory order** that says which reorderings are forbidden around it.

      - `memory_order_seq_cst` (the default): all threads agree on one order of every such operation. The easiest to reason about, and the right choice unless profiling says otherwise.
      - `memory_order_release` on a store: no read or write **before** it in this thread can move after it.
      - `memory_order_acquire` on a load: nothing read or written **after** it can move before it.
      - When an acquire load reads the value a release store wrote, everything the writing thread did before the store is visible to the reading thread after the load. That's how one thread **publishes** ordinary data to another.
      - `memory_order_relaxed`: the operation is still indivisible, but it orders nothing else. Fine for a statistics counter read after `join()`, wrong for a "the data is ready" flag.

      Code with orderings that are too weak often works on x86, which reorders very little, and then fails on ARM phones and servers. Test on ARM and run ThreadSanitizer (`-fsanitize=thread`), which understands orderings. The browser compiler on this site has no threads, so this example was compiled with `g++ -std=c++20 -pthread` and run on Linux.
    example: |
      #include <atomic>
      #include <iostream>
      #include <numeric>
      #include <thread>
      #include <vector>

      std::vector<int> data;              // ordinary data, published by `ready`
      std::atomic<bool> ready{false};
      std::atomic<int> hits{0};           // a plain counter: relaxed is enough

      int main() {
          std::thread producer([] {
              for (int i = 1; i <= 100; i++) data.push_back(i);
              ready.store(true, std::memory_order_release);
          });
          std::vector<std::thread> readers;
          for (int t = 0; t < 4; t++)
              readers.emplace_back([] {
                  while (!ready.load(std::memory_order_acquire)) {
                  }
                  for (int i = 0; i < 1000; i++) hits.fetch_add(1, std::memory_order_relaxed);
                  if (std::accumulate(data.begin(), data.end(), 0) != 5050) std::cout << "torn read!\n";
              });
          producer.join();
          for (auto& r : readers) r.join();
          std::cout << "sum " << std::accumulate(data.begin(), data.end(), 0) << ", hits " << hits.load() << "\n";
          return 0;
      }

  - slug: sfinae-enable-if
    title: SFINAE and std::enable_if explained
    lang: cpp
    description: What "substitution failure is not an error" means, how std::enable_if and std::void_t switch template overloads on and off, and how C++20 concepts replace them.
    modules: [cpp-generic]
    body: |
      When the compiler tries a function template during overload resolution, it substitutes the deduced types into the template's declaration. If that produces something invalid, it doesn't report an error: it quietly drops that candidate and tries the others. That rule is **SFINAE**, "substitution failure is not an error", and before C++20 it was the standard way to constrain templates.

      - `std::enable_if_t<condition, T>` means `T` when the condition is true and names no type at all when it's false, which removes the overload.
      - The **detection idiom** asks "does this expression compile for T?": a specialization using `std::void_t<decltype(expr)>` applies only when `expr` is valid.
      - Only the declaration counts. An error inside a function's body is still a hard error.

      In C++20, **concepts** say the same thing directly (`template <std::integral T>`, `requires`), with far clearer error messages. Write concepts in new code, and recognize `enable_if` and `void_t` in the many libraries written before them.
    example: |
      #include <iostream>
      #include <string>
      #include <type_traits>
      #include <utility>
      #include <vector>

      template <typename T>
      std::enable_if_t<std::is_integral_v<T>, std::string> kind(T) { return "integer"; }

      template <typename T>
      std::enable_if_t<std::is_floating_point_v<T>, std::string> kind(T) { return "floating point"; }

      // Detection idiom: does T have a size() member?
      template <typename T, typename = void>
      struct has_size : std::false_type {};
      template <typename T>
      struct has_size<T, std::void_t<decltype(std::declval<const T&>().size())>> : std::true_type {};

      int main() {
          std::cout << kind(7) << ", " << kind(0.5) << ", " << kind('x') << "\n";
          std::cout << std::boolalpha << has_size<std::vector<int>>::value << " " << has_size<double>::value << "\n";
          return 0;
      }

  - slug: crtp
    title: "CRTP: the curiously recurring template pattern"
    lang: cpp
    description: How a base class template that takes its derived class as a parameter gives static polymorphism, mixins and per-type counters without virtual functions.
    modules: [cpp-generic]
    body: |
      In the **Curiously Recurring Template Pattern**, a class inherits from a template instantiated with itself: `struct Version : Ordered<Version>`. Inside the base, the derived type is known at compile time, so the base can call the derived class's functions with a `static_cast`, with no virtual functions and no vtable. The compiler sees the exact function and can inline it.

      - **Mixins**: write a feature once in the base and add it to any class. The example derives `>`, `<=` and `>=` from a single `<`.
      - **Per-type bookkeeping**: static data in `Base<X>` is separate for every `X`, because each instantiation is a different class.
      - **Static interfaces** in performance-critical libraries, where virtual calls in tight loops would cost too much.

      The price: `Base<A>` and `Base<B>` are unrelated types, so you can't keep an `A` and a `B` in one container. When you need that, use virtual functions or type erasure. C++20's `<=>` now covers the comparison case, and C++23's "deducing this" covers many others, but CRTP is everywhere in existing code.
    example: |
      #include <iostream>

      template <typename D>
      struct Ordered {
          friend bool operator>(const D& a, const D& b) { return b < a; }
          friend bool operator<=(const D& a, const D& b) { return !(b < a); }
          friend bool operator>=(const D& a, const D& b) { return !(a < b); }
      };

      struct Version : Ordered<Version> {
          int major, minor;
          Version(int ma, int mi) : major(ma), minor(mi) {}
          friend bool operator<(const Version& a, const Version& b) {
              return a.major != b.major ? a.major < b.major : a.minor < b.minor;
          }
      };

      int main() {
          Version a{1, 4}, b{2, 0};
          std::cout << (b > a) << (a >= b) << (a <= a) << "\n";
          return 0;
      }

  - slug: type-erasure
    title: "Type erasure in C++: how std::function works"
    lang: cpp
    description: How std::function, std::any and friends hold unrelated types behind one value type, and how to write your own with a hidden interface and a template model.
    modules: [cpp-patterns]
    body: |
      `std::function<int(int)>` can hold a function pointer, a lambda with captures or any object with a matching `operator()`, although none of them share a base class. That's **type erasure**: the wrapper forgets the concrete type but still knows how to call, copy and destroy what's inside.

      The standard recipe has three parts, all hidden inside the wrapper:

      - a private abstract **concept** class with the operations you need, plus `clone()` for copying;
      - a class template **model** that derives from it and forwards each call to the stored object;
      - a templated constructor that creates the right model for whatever you pass, and a `std::unique_ptr` to it.

      The wrapper behaves like a value: you can copy it and store it in a `std::vector` directly, and any type with the right functions works, including types written long before the wrapper. `std::function`, `std::any` and `std::shared_ptr`'s deleter all work this way; libraries add a small-buffer optimization to avoid the heap allocation for small objects.
    example: |
      #include <iostream>
      #include <memory>
      #include <string>
      #include <utility>
      #include <vector>

      class Printable {
      public:
          template <typename T>
          Printable(T value) : self_(std::make_unique<Model<T>>(std::move(value))) {}
          Printable(const Printable& other) : self_(other.self_->clone()) {}
          std::string text() const { return self_->text(); }

      private:
          struct Concept {
              virtual ~Concept() = default;
              virtual std::string text() const = 0;
              virtual std::unique_ptr<Concept> clone() const = 0;
          };
          template <typename T>
          struct Model : Concept {
              T value;
              explicit Model(T v) : value(std::move(v)) {}
              std::string text() const override { return value.text(); }
              std::unique_ptr<Concept> clone() const override { return std::make_unique<Model>(*this); }
          };
          std::unique_ptr<Concept> self_;
      };

      struct Player { std::string name; std::string text() const { return "player " + name; } };
      struct Score { int points; std::string text() const { return std::to_string(points) + " pts"; } };

      int main() {
          std::vector<Printable> feed{Player{"ada"}, Score{250}};
          std::vector<Printable> copy = feed;              // deep copies
          for (const auto& p : copy) std::cout << p.text() << "\n";
          return 0;
      }

  - slug: cpu-caches
    title: CPU caches and data-oriented design in C++
    lang: cpp
    description: Why memory access patterns decide how fast code runs, what cache lines are, and how contiguous containers and structs of arrays speed up hot loops.
    modules: [cpp-performance]
    body: |
      A processor can add two numbers in well under a nanosecond, but fetching a value from main memory takes around 100. Small, fast **caches** close to each core hide that gap, and they move memory in fixed blocks called **cache lines**: 64 bytes on x86 and most ARM chips. Read one `int` and its neighbors come along for free; processors also **prefetch** the next lines when you walk memory in order.

      - **Contiguous containers win.** A `std::vector` keeps elements side by side; a `std::list` or `std::map` scatters nodes across the heap, so walking one is a chain of cache misses. A vector often beats a list even where Big-O favors the list.
      - **Loop in storage order.** A 2D array is stored row by row, so the inner loop should walk along a row. Summing a large grid column by column can be ten times slower or more than row by row.
      - **Struct of arrays** (one array per field) beats an array of structs when hot loops touch only a few fields of many objects, because every byte loaded is used. That's the core idea of **data-oriented design**.
      - **False sharing**: two threads writing different variables in the same cache line slow each other down. Give such data its own line with `alignas(64)`.

      Caches make performance hard to guess, so measure before and after with a profiler.
    example: |
      #include <iostream>
      #include <set>

      int main() {
          // Which 64-byte cache lines do the reads touch? Row by row vs column by column,
          // over an 8 x 16 grid of 4-byte ints stored row by row.
          const int rows = 8, cols = 16, line = 64;
          std::set<int> first4_row, first4_col;
          for (int k = 0; k < 4; k++) {
              first4_row.insert((0 * cols + k) * 4 / line);   // walk along row 0
              first4_col.insert((k * cols + 0) * 4 / line);   // walk down column 0
          }
          std::cout << "4 reads along a row touch " << first4_row.size() << " line(s)\n";
          std::cout << "4 reads down a column touch " << first4_col.size() << " line(s)\n";
          std::cout << "the whole grid is " << rows * cols * 4 / line << " lines\n";
          return 0;
      }
