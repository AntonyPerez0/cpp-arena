  - title: "Review: integer math"
    id: cpp-review-5
    text: |
      Numeric code gets reviewed for four things: **overflow**, **division by zero**, **signed/unsigned mix-ups**, and **empty input**. None of them shows up with small, friendly test values, which is exactly why reviewers try unfriendly ones.

      ### The four checks

      - **Overflow**: can an intermediate result exceed the type's range? An `int` holds about ±2.1 billion. `a * 100` overflows once `a` is just over 21 million. Signed overflow is undefined behavior, not just a wrong number. Do the math in a wider type (`long long`) **before** the operation, not after.
      - **Division by zero**: is the divisor ever 0? For `int` it's undefined behavior (often a crash); for `double` it gives `inf` or `nan`.
      - **Unsigned wraparound**: `size_t` can't be negative. `v.size() - n` with `n > v.size()` wraps to a gigantic number.
      - **Empty input**: what does the function return for no data? The spec usually says.

      ```cpp run
      #include <cstdint>
      #include <iostream>
      #include <vector>

      // Percentage of bytes used, rounded down; 0 for a zero-size disk.
      int percent_used(std::int64_t used, std::int64_t total) {
          if (total == 0) return 0;                            // division by zero
          return static_cast<int>(used * 100 / total);         // 64-bit math: no overflow
      }

      // Sum of the first n readings (all of them if fewer).
      long long first_n(const std::vector<int>& r, std::size_t n) {
          long long sum = 0;                                   // wide accumulator
          for (std::size_t i = 0; i < n && i < r.size(); i++) sum += r[i];
          return sum;
      }

      int main() {
          std::cout << percent_used(3'000'000'000LL, 4'000'000'000LL) << "\n";
          std::cout << percent_used(0, 0) << "\n";
          std::cout << first_n({2'000'000'000, 2'000'000'000}, 5) << "\n";
          std::cout << first_n({}, 3) << "\n";
      }
      ```

      ```output
      75
      0
      4000000000
      0
      ```

      Every line handles one of the four checks: the zero guard, 64-bit multiplication, a `long long` sum that can hold two billion plus two billion, and a loop bound that respects both `n` and the real size.

      ### Where the conversion goes

      `static_cast<long long>(a) * 100` widens **before** multiplying. `static_cast<long long>(a * 100)` multiplies in `int` first, overflows, and only then widens the already wrong value. The same applies to sums: the accumulator's type must be wide from the start.

      **Your turn:** this pull request adds stats for the match history page. The specification:

      - `win_rate(wins, games)`: whole-number percentage, rounded down; 0 when there are no games. It must work for career totals in the billions.
      - `average(scores)`: the mean as a double; 0.0 for no scores. Scores can be large.
      - `last_n_total(scores, n)`: the sum of the last `n` scores (all of them if there are fewer than n).

      There are four bugs.
    seed: |
      #include <vector>

      int win_rate(int wins, int games) {
          return wins * 100 / games;
      }

      double average(const std::vector<int>& scores) {
          int sum = 0;
          for (int s : scores) sum += s;
          return static_cast<double>(sum) / scores.size();
      }

      long long last_n_total(const std::vector<int>& scores, std::size_t n) {
          long long total = 0;
          for (std::size_t i = scores.size() - n; i < scores.size(); i++) total += scores[i];
          return total;
      }
    solution: |
      #include <vector>

      int win_rate(int wins, int games) {
          if (games <= 0) return 0;
          return static_cast<int>(static_cast<long long>(wins) * 100 / games);
      }

      double average(const std::vector<int>& scores) {
          if (scores.empty()) return 0.0;
          long long sum = 0;
          for (int s : scores) sum += s;
          return static_cast<double>(sum) / static_cast<double>(scores.size());
      }

      long long last_n_total(const std::vector<int>& scores, std::size_t n) {
          long long total = 0;
          std::size_t start = n >= scores.size() ? 0 : scores.size() - n;
          for (std::size_t i = start; i < scores.size(); i++) total += scores[i];
          return total;
      }
    harness: |
      int main() {
          CHECK_EQ("simple rate", win_rate(3, 4), 75);
          CHECK_EQ("no games", win_rate(0, 0), 0);
          CHECK_EQ("career totals don't overflow", win_rate(1500000000, 2000000000), 75);
          CHECK_EQ("average", average({1, 2, 3, 4}), 2.5);
          CHECK_EQ("empty average", average({}), 0.0);
          CHECK_EQ("big scores", average({2000000000, 2000000000}), 2000000000.0);
          CHECK_EQ("last 2", last_n_total({5, 6, 7}, 2), 13LL);
          CHECK_EQ("n larger than size", last_n_total({5, 6, 7}, 10), 18LL);
          CHECK_EQ("empty scores", last_n_total({}, 3), 0LL);
      }
    hints:
      - "win_rate: guard `games <= 0`, and do the multiplication in `long long`: 1.5 billion × 100 doesn't fit in an int."
      - "average: an empty vector divides by zero, and an `int` sum overflows for big scores. Use a long long sum and check empty first."
      - "last_n_total: `scores.size() - n` is unsigned, so it wraps to a huge number when n is bigger than the size. Clamp the start index."
