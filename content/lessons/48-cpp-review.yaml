          /* A valid tag is non-empty and, lowercased, made only of letters.
             A tag reading "end" (in any case) stops the count early.
             Returns how many of the n tags are valid, or -1 if a tag is NULL. */
          int count_valid(const char** tags, int n) {
              int valid = 0;
              for (int i = 0; i < n; i++) {
                  if (!tags[i]) return -1;
                  std::size_t len = std::strlen(tags[i]);
                  char* copy = static_cast<char*>(xmalloc(len + 1));
                  std::memcpy(copy, tags[i], len + 1);
                  if (len == 0) continue;
                  bool ok = true;
                  for (std::size_t j = 0; j < len; j++) {
                      copy[j] = (char)std::tolower((unsigned char)copy[j]);
                      if (copy[j] < 'a' || copy[j] > 'z') ok = false;
                  }
                  if (std::strcmp(copy, "end") == 0) return valid;
                  if (ok) valid++;
                  xfree(copy);
              }
              return valid;
          }
