                  char* copy = static_cast<char*>(xmalloc(len + 1));
                  std::memcpy(copy, tags[i], len + 1);
                  bool ok = true;
                  for (std::size_t j = 0; j < len; j++) {
                      copy[j] = (char)std::tolower((unsigned char)copy[j]);
                      if (copy[j] < 'a' || copy[j] > 'z') ok = false;
                  }
                  bool stop = std::strcmp(copy, "end") == 0;
                  if (!stop && ok) valid++;
                  xfree(copy);
                  if (stop) return valid;
              }
              return valid;
          }
        harness: |
          int main() {
              const char* a[] = {"Rush", "b1", "MID"};
              CHECK_EQ("two valid", count_valid(a, 3), 2);
              CHECK_EQ("no leak", live_allocations, 0);
              const char* b[] = {"", "eco", ""};
              CHECK_EQ("empty tags don't count", count_valid(b, 3), 1);
              CHECK_EQ("no leak with empty tags", live_allocations, 0);
              const char* d[] = {"eco", "END", "force"};
              CHECK_EQ("stops at end", count_valid(d, 3), 1);
              CHECK_EQ("no leak when stopping early", live_allocations, 0);
              const char* c[] = {"ok", nullptr, "later"};
              CHECK_EQ("a NULL tag", count_valid(c, 3), -1);
              CHECK_EQ("no leak on the error path", live_allocations, 0);
          }
        hints:
