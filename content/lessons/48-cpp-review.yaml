              Player* first = r.add("karrigan");
              for (int i = 0; i < 5000; i++) r.add("player" + std::to_string(i));
              first->score = 42;
              CHECK_EQ("the first pointer still works", first->name, std::string("karrigan"));
              CHECK_EQ("size", r.size(), 5001);
          }
        hints:
