      - task: |
          This pull request adds `Buffer`, which owns a heap array through a raw pointer but has only a destructor. Copying one makes two objects that both delete the same array. Fix it by following the **rule of three**: add a copy constructor and a copy assignment operator that copy the data into new memory.
        seed: |
          #include <algorithm>
          #include <cstddef>

          class Buffer {
          public:
              static inline int live = 0;
              explicit Buffer(std::size_t n) : data_(new int[n]()), size_(n) { live++; }
              ~Buffer() {
                  delete[] data_;
                  live--;
              }
              int& operator[](std::size_t i) { return data_[i]; }
              std::size_t size() const { return size_; }

          private:
              int* data_;
              std::size_t size_;
          };
        solution: |
          #include <algorithm>
          #include <cstddef>

          class Buffer {
          public:
              static inline int live = 0;
              explicit Buffer(std::size_t n) : data_(new int[n]()), size_(n) { live++; }
              Buffer(const Buffer& o) : data_(new int[o.size_]), size_(o.size_) {
                  std::copy(o.data_, o.data_ + size_, data_);
                  live++;
              }
              Buffer& operator=(const Buffer& o) {
                  if (this != &o) {
                      int* fresh = new int[o.size_];
                      std::copy(o.data_, o.data_ + o.size_, fresh);
                      delete[] data_;
                      data_ = fresh;
                      size_ = o.size_;
                  }
                  return *this;
              }
              ~Buffer() {
                  delete[] data_;
                  live--;
              }
              int& operator[](std::size_t i) { return data_[i]; }
              std::size_t size() const { return size_; }

          private:
              int* data_;
              std::size_t size_;
          };
        harness: |
          int main() {
              {
                  Buffer a(3);
                  a[0] = 7;
                  Buffer b = a;
                  b[0] = 9;
                  CHECK_EQ("copies are independent", a[0], 7);
                  Buffer c(1);
                  c = a;
                  CHECK("assignment copies the size and data", c.size() == 3 && c[0] == 7);
                  Buffer& same = c;
                  c = same;
                  CHECK_EQ("self-assignment is safe", c[0], 7);
              }
              CHECK_EQ("every buffer destroyed once", Buffer::live, 0);
          }
        hints:
          - "The copy constructor allocates its own array and copies the elements across."
          - "In assignment, allocate and copy first, then delete the old array, so a failed allocation leaves the object unchanged."
      - task: |
          This pull request adds a `Meters` type with three design problems. Its constructor allows **implicit** conversion from `double`, so passing a bare number compiles by accident. `value()` isn't `const`, so it can't be called on a `const Meters`. And `operator+` **changes** its left operand. Fix all three: make the constructor `explicit`, make `value()` `const`, and make `+` a function that returns a new object.
        seed: |
          class Meters {
          public:
              Meters(double v) : v_(v) {}
              double value() { return v_; }
              Meters operator+(const Meters& o) {
                  v_ += o.v_;
                  return *this;
              }

          private:
              double v_;
          };
        solution: |
          class Meters {
          public:
              explicit Meters(double v) : v_(v) {}
              double value() const { return v_; }
              Meters operator+(const Meters& o) const { return Meters(v_ + o.v_); }

          private:
              double v_;
          };
        harness: |
          #include <type_traits>
          double length_of(const Meters& m) { return m.value(); }
          int main() {
              CHECK("no implicit conversion from double", !(std::is_convertible_v<double, Meters>));
              const Meters a(2.5), b(4.0);
              CHECK("value() works on a const object", length_of(a) == 2.5);
              Meters c = a + b;
              CHECK("sum", c.value() == 6.5);
              CHECK("the left operand is unchanged", a.value() == 2.5);
          }
        hints:
          - "`explicit` stops a `double` from turning into `Meters` without anyone writing `Meters(...)`."
          - "A `const` member function promises not to change the object, and `a + b` shouldn't change either operand."
