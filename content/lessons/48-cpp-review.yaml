      - task: |
          This pull request counts the valid tags in a list. Each tag is copied into a buffer from `xmalloc` so it can be lowercased, but two paths forget to free that buffer. Fix both leaks so `live_allocations` ends where it started.
        seed: |
          #include <cctype>
          #include <cstdlib>
          #include <cstring>

          static int live_allocations = 0;
          void* xmalloc(std::size_t n) { void* p = std::malloc(n > 0 ? n : 1); if (p) live_allocations++; return p; }
