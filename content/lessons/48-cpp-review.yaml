          std::string longest(const std::vector<std::string>& v) {
              if (v.empty()) return "none";
              const std::string* best = &v[0];
              for (const auto& s : v)
                  if (s.size() > best->size()) best = &s;
              return *best;
          }

          // Each call returns the next number: 1, 2, 3, ...
          std::function<int()> make_counter() {
