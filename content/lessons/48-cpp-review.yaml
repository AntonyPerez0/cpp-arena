id: cpp-review
title: "Capstone: code review"
lang: cpp
phase: "Capstone: Code Review"
summary: Review realistic pull requests the way a senior engineer would. Each step hides several real bugs (off-by-one errors, dangling references, leaks on error paths, invalidated iterators, integer overflow and broken class design) for you to find and fix.
steps:
  - title: "Review: pagination"
    id: cpp-review-1
    text: |
      Reading other people's code critically is half of a professional developer's job. Before code is merged, a teammate **reviews** it: they read the change line by line, looking for bugs the author missed. The tests in these steps are the reviewer's edge cases. Your job is to find what breaks and fix it.

      ### How to review

      For every line, ask: **what inputs break this?** Try the edge cases in your head:

      - empty input, one element, exactly full
      - the first and the last item
      - zero, negative numbers, huge numbers
      - values right at a boundary (the spec's "1-based", "inclusive", "at most")

      Then compare the code with the **spec**, word by word. Many bugs are code that works, but does something slightly different from what was asked.

      ### A worked review

      This function should return the last `n` messages of a chat (fewer if there aren't that many). Here's the fixed version, with comments on what the review caught:

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      std::vector<std::string> last_n(const std::vector<std::string>& msgs, int n) {
          std::vector<std::string> out;
          if (n <= 0) return out;                          // caught: negative n
          // caught: msgs.size() - n underflowed (size_t is unsigned) when n > size
          std::size_t start = msgs.size() > (std::size_t)n ? msgs.size() - n : 0;
          for (std::size_t i = start; i < msgs.size(); i++) out.push_back(msgs[i]);
          return out;
      }

      int main() {
          std::vector<std::string> chat = {"hi", "gg", "wp", "rematch?"};
          for (int n : {2, 10, 0, -1}) {
              std::cout << n << ":";
              for (const auto& m : last_n(chat, n)) std::cout << " " << m;
              std::cout << "\n";
          }
          std::cout << "empty: " << last_n({}, 3).size() << "\n";
      }
      ```

      ```output
      2: wp rematch?
      10: hi gg wp rematch?
      0:
      -1:
      empty: 0
      ```

      The original version passed the author's one test (`n = 2`) and crashed on the other four.

      ### For this pull request

      Check the arithmetic for "page 1 is the first page" with a concrete example: with 10 items, 3 per page, page 1 is items 0 to 2 and page 4 holds just item 9. Then ask what happens for page 5, and for page 0.

      A teammate opened this pull request for the leaderboard API. The spec says:

      - `page` is **1-based** (page 1 is the first page)
      - pages past the end return an empty list, never crash
      - `page < 1` or `per_page < 1` returns an empty list

      The tests here are the reviewer's edge cases. **Your turn:** find and fix the bugs. There are three.
    seed: |
      #include <string>
      #include <vector>

      std::vector<std::string> page_of(const std::vector<std::string>& items, int page, int per_page) {
          std::vector<std::string> out;
          int start = page * per_page;
          int end = start + per_page;
          for (int i = start; i < end; i++) out.push_back(items[i]);
          return out;
      }
    solution: |
      #include <string>
      #include <vector>

      std::vector<std::string> page_of(const std::vector<std::string>& items, int page, int per_page) {
          std::vector<std::string> out;
          if (page < 1 || per_page < 1) return out;
          long long start = static_cast<long long>(page - 1) * per_page;
          long long end = start + per_page;
          long long size = static_cast<long long>(items.size());
          if (end > size) end = size;
          for (long long i = start; i < end; i++) out.push_back(items[i]);
          return out;
      }
    harness: |
      int main() {
          std::vector<std::string> v = {"a", "b", "c", "d", "e"};
          CHECK_EQ("page 1", page_of(v, 1, 2), (std::vector<std::string>{"a", "b"}));
          CHECK_EQ("page 2", page_of(v, 2, 2), (std::vector<std::string>{"c", "d"}));
          CHECK_EQ("last partial page", page_of(v, 3, 2), (std::vector<std::string>{"e"}));
          CHECK("past the end is empty", page_of(v, 4, 2).empty());
          CHECK("page 0 is invalid", page_of(v, 0, 2).empty());
          CHECK("per_page 0 is invalid", page_of(v, 1, 0).empty());
          CHECK("huge page number doesn't overflow", page_of(v, 2000000000, 2000000000).empty());
          CHECK("empty list", page_of({}, 1, 10).empty());
      }
    hints:
      - "Bug 1: page is 1-based, so page 1 must start at index 0: `(page - 1) * per_page`."
      - "Bug 2: the last page can be partial, and pages past the end are empty. Clamp `end` to `items.size()`."
      - "Bug 3: invalid arguments. Reject `page < 1 || per_page < 1` up front. And `page * per_page` can overflow an int: compute it in `long long`."
    more:
      - task: |
          This pull request adds a hand-written binary search. It hangs on some inputs, misses the last element and can overflow on huge arrays. Fix the three bugs so `find(v, x)` returns the index of `x` in the sorted vector, or -1.
        seed: |
          #include <vector>

          int find(const std::vector<int>& v, int x) {
              int lo = 0, hi = (int)v.size();
              while (lo < hi - 1) {
                  int mid = (lo + hi) / 2;
                  if (v[mid] == x) return mid;
                  if (v[mid] < x) lo = mid;
                  else hi = mid;
              }
              return -1;
          }
        solution: |
          #include <vector>

          int find(const std::vector<int>& v, int x) {
              int lo = 0, hi = (int)v.size();
              while (lo < hi) {
                  int mid = lo + (hi - lo) / 2;
                  if (v[mid] == x) return mid;
                  if (v[mid] < x) lo = mid + 1;
                  else hi = mid;
              }
              return -1;
          }
        harness: |
          int main() {
              std::vector<int> v = {1, 3, 5, 7, 9};
              CHECK_EQ("middle", find(v, 5), 2);
              CHECK_EQ("first", find(v, 1), 0);
              CHECK_EQ("last", find(v, 9), 4);
              CHECK_EQ("missing", find(v, 4), -1);
              CHECK_EQ("above everything", find(v, 100), -1);
              CHECK_EQ("one element", find({7}, 7), 0);
              CHECK_EQ("empty", find({}, 7), -1);
          }
        hints:
          - "With `lo = mid`, a range of two elements can stay the same forever. Everything at `mid` or below is ruled out, so move past it."
          - "`(lo + hi) / 2` can overflow when both are near the int limit; `lo + (hi - lo) / 2` can't."
      - task: |
          This pull request adds `truncate(s, max)` for showing long player names. The specification: strings of at most `max` characters are returned unchanged; longer ones are cut so that, **with** `...` added, the result is exactly `max` characters; when `max` is less than 3 there's no room for dots, so just cut to `max`. Fix the two bugs.
        seed: |
          #include <string>

          std::string truncate(const std::string& s, std::size_t max) {
              if (s.size() < max) return s;
              return s.substr(0, max - 3) + "...";
          }
        solution: |
          #include <string>

          std::string truncate(const std::string& s, std::size_t max) {
              if (s.size() <= max) return s;
              if (max < 3) return s.substr(0, max);
              return s.substr(0, max - 3) + "...";
          }
        harness: |
          int main() {
              CHECK_EQ("short name", truncate("ropz", 10), std::string("ropz"));
              CHECK_EQ("exactly max", truncate("broky", 5), std::string("broky"));
              CHECK_EQ("cut with dots", truncate("karrigan", 6), std::string("kar..."));
              CHECK_EQ("max 2 has no room for dots", truncate("frozen", 2), std::string("fr"));
              CHECK_EQ("max 0", truncate("rain", 0), std::string(""));
              CHECK_EQ("max 3", truncate("twistzz", 3), std::string("..."));
          }
        hints:
          - "A string of exactly `max` characters already fits."
          - "`max - 3` on a `std::size_t` wraps around to a huge number when `max < 3`."

  - title: "Review: dangling references"
    id: cpp-review-2
    text: |
      `std::string_view` and references are cheap **views** of data owned by someone else. The classic review catch is a view that **outlives** what it points at. It compiles cleanly, often seems to work in testing (the freed memory still holds the old bytes for a while), and then prints garbage in production.

      Red flags to look for:

      - returning a `string_view` or a reference to a **local** or a **temporary**
      - storing a `string_view` member initialized from a temporary `std::string`
      - keeping a reference into a container that later grows

      ### Who owns the characters?

      For every view, find the `std::string` (or literal) that owns its characters, and check that the owner lives **at least as long** as the view.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <string_view>
      #include <utility>

      std::string_view first_word(std::string_view s) {      // fine: points into the caller's text
          return s.substr(0, s.find(' '));
      }

      struct Label {
          std::string text;                                   // owns its characters
          explicit Label(std::string t) : text(std::move(t)) {}
      };

      Label make_label(int n) {
          return Label("item " + std::to_string(n));          // the temporary is moved into the member
      }

      int main() {
          std::string line = "hello big world";
          std::cout << first_word(line) << "\n";              // line outlives the view: safe

          Label l = make_label(7);
          std::cout << l.text << "\n";
      }
      ```

      ```output
      hello
      item 7
      ```

      - `first_word` is safe because it returns a view into the **caller's** string, which is still alive when the view is used.
      - `Label` stores a `std::string`, not a view. The temporary `"item " + ...` would die at the end of the statement, so a `string_view` member would dangle; an owning member takes the characters with it.

      The rule of thumb: views for **parameters**, owning strings for **members** and for **return values built inside the function**.

      **Your turn:** this pull request adds a greeting helper and a `Tag` type. Both have lifetime bugs. Fix them by making each owner hold its own `std::string`. (The checks inspect the types too, since dangling-view bugs can seem to work by luck.)
    seed: |
      #include <string>
      #include <string_view>

      std::string_view greeting(const std::string& name) {
          std::string text = "gl hf, " + name;
          return text;
      }

      class Tag {
      public:
          explicit Tag(const std::string& label) : label_(label) {}
          std::string_view label() const { return label_; }

      private:
          std::string_view label_;
      };

      Tag make_tag(int round) {
          return Tag("round " + std::to_string(round));
      }
    solution: |
      #include <string>
      #include <string_view>

      std::string greeting(const std::string& name) {
          std::string text = "gl hf, " + name;
          return text;
      }

      class Tag {
      public:
          explicit Tag(const std::string& label) : label_(label) {}
          std::string_view label() const { return label_; }

      private:
          std::string label_;
      };

      Tag make_tag(int round) {
          return Tag("round " + std::to_string(round));
      }
    harness: |
      #include <type_traits>
      int main() {
          static_assert(std::is_same_v<decltype(greeting(std::string())), std::string>, "greeting must return an owning std::string");
          CHECK_EQ("greeting", std::string(greeting("ropz")), std::string("gl hf, ropz"));
          Tag t = make_tag(16);
          std::string filler(100, 'x');
          CHECK_EQ("tag outlives the temporary", std::string(t.label()), std::string("round 16"));
          CHECK("Tag owns its text", sizeof(Tag) == sizeof(std::string));
      }
    hints:
      - "`greeting` returns a view of the local `text`, which is destroyed at the closing brace. Return `std::string` instead."
      - "`Tag` stores a view of the temporary string built in `make_tag`. Make the member a `std::string`; the accessor can still return a view of it."
