          #include <string>

          struct Player {
              std::string name;
              int score = 0;
          };

          class Registry {
          public:
              Player* add(const std::string& name) {
                  players_.push_back({name, 0});
                  return &players_.back();
              }
              int size() const { return (int)players_.size(); }

          private:
