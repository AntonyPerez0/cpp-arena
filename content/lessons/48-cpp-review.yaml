  - title: "Review: modifying while iterating"
    id: cpp-review-4
    text: |
      Another classic: changing a container **while looping over it**.

      - erasing index `i` shifts the next element into position `i`, and then `i++` **skips** it
      - `push_back` during a range-for can reallocate, invalidating the loop's hidden iterators
      - a reference taken before a `push_back` can dangle afterwards

      ### Spotting the skip

      Run the erase loop by hand on an input with two matches **next to each other**, like `{a, X, X, b}` where X should be removed:

      ```
      i = 1: erase X  -> {a, X, b}   then i++ -> i = 2
      i = 2: b                       the second X, now at index 1, was never checked
      ```

      The safe patterns: only increment when nothing was erased, use `std::erase_if`, or build a new vector of the items you keep.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> queue = {"ok", "spam", "spam", "ok", "spam"};
          for (std::size_t i = 0; i < queue.size(); ) {
              if (queue[i] == "spam") queue.erase(queue.begin() + i);   // don't advance
              else i++;                                                  // advance only when keeping
          }
          for (const auto& m : queue) std::cout << m << " ";
          std::cout << "(" << queue.size() << ")\n";

          std::vector<int> v = {1, 2, 3};
          int first = v.front();                // a copy, not a reference: safe after growth
          for (int i = 0; i < 100; i++) v.push_back(i);
          std::cout << first << "\n";
      }
      ```

      ```output
      ok ok (2)
      1
      ```

      ### Adding while looping

      A range-for over `roster` that calls `roster.push_back` is undefined behavior: the loop's hidden iterators point into the old buffer after a reallocation. If you need to add a number of items, compute the count first, then add them in a separate plain loop that doesn't iterate over the container.

      ### The dangling reference

      `const std::string& captain = roster.front();` refers to an element **inside** the vector. After `push_back` reallocates, it refers to freed memory. Copy the value (`std::string captain = ...`) when you need it to survive changes to the container.

      **Your turn:** this pull request enforces bans and fills the roster back up with substitutes. Fix it so that every banned player is removed (including when two are adjacent), one substitute is added per removed player, and `captain` returns the right name. There are three bugs.
    seed: |
      #include <set>
      #include <string>
      #include <vector>

      // Removes banned players, then appends one substitute per removal.
      void apply_bans(std::vector<std::string>& roster, const std::set<std::string>& banned, const std::string& sub) {
          int removed = 0;
          for (std::size_t i = 0; i < roster.size(); i++) {
              if (banned.count(roster[i])) {
                  roster.erase(roster.begin() + i);
                  removed++;
              }
          }
          for (const auto& p : roster) {
              if (removed > 0 && p != sub) {
                  roster.push_back(sub);
                  removed--;
              }
          }
      }

      // Returns the first player's name after adding a new player at the end.
      std::string captain_after_signing(std::vector<std::string>& roster, const std::string& signing) {
          const std::string& captain = roster.front();
          roster.push_back(signing);
          return captain;
      }
    solution: |
      #include <set>
      #include <string>
      #include <vector>

      // Removes banned players, then appends one substitute per removal.
      void apply_bans(std::vector<std::string>& roster, const std::set<std::string>& banned, const std::string& sub) {
          std::size_t removed = std::erase_if(roster, [&](const std::string& p) { return banned.count(p) > 0; });
          for (std::size_t i = 0; i < removed; i++) roster.push_back(sub);
      }

      // Returns the first player's name after adding a new player at the end.
      std::string captain_after_signing(std::vector<std::string>& roster, const std::string& signing) {
          std::string captain = roster.front();
          roster.push_back(signing);
          return captain;
      }
    forbid:
      - pattern: "const\\s+std::string\\s*&\\s*captain\\s*="
        message: "`captain` is a reference into the vector, and push_back can reallocate and leave it dangling. Copy the name first."
    harness: |
      int main() {
          std::vector<std::string> r = {"a", "cheat1", "cheat2", "b", "cheat3"};
          apply_bans(r, {"cheat1", "cheat2", "cheat3"}, "sub");
          CHECK_EQ("adjacent bans both removed, one sub each", r, (std::vector<std::string>{"a", "b", "sub", "sub", "sub"}));
          std::vector<std::string> clean = {"x", "y"};
          apply_bans(clean, {"z"}, "sub");
          CHECK_EQ("nothing banned", clean, (std::vector<std::string>{"x", "y"}));
          std::vector<std::string> all = {"c1", "c2"};
          apply_bans(all, {"c1", "c2"}, "sub");
          CHECK_EQ("everyone banned", all, (std::vector<std::string>{"sub", "sub"}));
          std::vector<std::string> team = {"karrigan", "ropz"};
          team.shrink_to_fit();
          CHECK_EQ("captain survives reallocation", captain_after_signing(team, "jks"), std::string("karrigan"));
      }
    hints:
      - "Bug 1: after `erase(begin() + i)`, the next player moves into slot i and `i++` skips them. `std::erase_if` (C++20) removes all matches correctly and returns how many."
      - "Bug 2: the second loop push_backs into `roster` while range-for iterates it. Just loop `removed` times instead."
      - "Bug 3: `captain` is a reference into the vector, and push_back may reallocate. Copy the string instead."
