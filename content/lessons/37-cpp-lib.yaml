          std::string report(const std::vector<std::pair<std::string, std::chrono::milliseconds>>& tasks) {

          }
        solution: |
          #include <chrono>
          #include <format>
          #include <string>
          #include <utility>
          #include <vector>

          std::string report(const std::vector<std::pair<std::string, std::chrono::milliseconds>>& tasks) {
              std::string out;
              std::chrono::milliseconds total{0};
              auto line = [&](const std::string& name, std::chrono::milliseconds t) {
                  out += std::format("{:<10}{:>7.3f}s\n", name, std::chrono::duration<double>(t).count());
              };
              for (const auto& [name, t] : tasks) {
                  line(name, t);
                  total += t;
              }
              line("total", total);
              return out;
          }
        harness: |
          int main() {
              using namespace std::chrono_literals;
              CHECK_EQ("two tasks", report({{"compile", 1250ms}, {"test", 30s}}),
                       std::string("compile     1.250s\ntest       30.000s\ntotal      31.250s\n"));
              CHECK_EQ("no tasks", report({}), std::string("total       0.000s\n"));
          }
        hints:
          - "`std::chrono::duration<double>(t).count()` is the time in seconds as a `double`."
          - "`{:>7.3f}` right-aligns in 7 characters with 3 decimals."
