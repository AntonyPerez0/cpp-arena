          Write `std::string report(const std::vector<std::pair<std::string, std::chrono::milliseconds>>& tasks)`: one line per task, the name left-aligned in 10 characters and the time in seconds with 3 decimals right-aligned in 7, then `s`, and finally a `total` line in the same layout. Every line ends in `\n`.
        seed: |
