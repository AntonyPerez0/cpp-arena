      #include <string>
      #include <utility>
      #include <vector>

      std::vector<std::string> top_fraggers(const std::vector<std::pair<std::string, int>>& players, int min_kills) {

      }
    solution: |
      #include <ranges>
      #include <string>
      #include <utility>
      #include <vector>

      std::vector<std::string> top_fraggers(const std::vector<std::pair<std::string, int>>& players, int min_kills) {
          std::vector<std::string> out;
          auto names = players
              | std::views::filter([min_kills](const auto& p) { return p.second >= min_kills; })
              | std::views::transform([](const auto& p) { return p.first; });
          for (const auto& n : names) out.push_back(n);
          return out;
      }
    require:
      - pattern: "views::filter"
        message: Use `std::views::filter`.
      - pattern: "views::transform"
        message: Use `std::views::transform`.
    harness: |
      int main() {
          using V = std::vector<std::string>;
          std::vector<std::pair<std::string, int>> p = {{"a", 30}, {"b", 12}, {"c", 25}, {"d", 25}};
          CHECK_EQ(">= 25", top_fraggers(p, 25), V{"a", "c", "d"});
          CHECK_EQ(">= 100", top_fraggers(p, 100), V{});
          CHECK_EQ(">= 0", top_fraggers(p, 0), V{"a", "b", "c", "d"});
      }
    hints:
      - "`players | std::views::filter(...) | std::views::transform(...)` makes a lazy view."
      - The filter lambda captures `min_kills`; the transform lambda returns `p.first`. Then loop over the view and push_back.
    more:
      - task: |
          Write `std::vector<int> even_squares(const std::vector<int>& v, int n)` returning the squares of the first `n` even numbers, using `views::filter`, `views::transform` and `views::take`.
        seed: |
