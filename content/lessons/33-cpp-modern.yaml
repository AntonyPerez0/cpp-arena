              shift_to_zero(v);
              CHECK_EQ("vector", v, (std::vector<int>{2, 0, 6}));
              int a[] = {-2, 4};
              shift_to_zero(a);
              CHECK("C array", a[0] == 0 && a[1] == 6);
              std::array<int, 4> s = {7, 7, 8, 9};
              shift_to_zero(std::span(s).subspan(2));
              CHECK("only the subspan changes", s[0] == 7 && s[1] == 7 && s[2] == 0 && s[3] == 1);
              std::vector<int> e;
