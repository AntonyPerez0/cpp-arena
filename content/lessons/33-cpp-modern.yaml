      - task: |
          Write `int count_pattern(std::span<const int> xs, std::span<const int> pat)` that counts where `pat` appears in `xs`, overlaps included. Compare each window `xs.subspan(i, pat.size())` with `pat` using `std::ranges::equal`. An empty pattern counts 0.
        seed: |
