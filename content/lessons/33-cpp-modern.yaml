        solution: |
          int bonus(char grade) {
              int total = 0;
              switch (grade) {
                  case 'S':
                      total += 50;
                      [[fallthrough]];
                  case 'A':
                      total += 30;
                      [[fallthrough]];
                  case 'B':
                      total += 20;
                      break;
                  default:
                      break;
              }
              return total;
          }
        require:
          - pattern: "\\[\\[fallthrough\\]\\]"
            message: "Mark each intended fall-through with `[[fallthrough]];`."
          - pattern: "switch"
            message: "Use a `switch`."
        harness: |
          int main() {
              CHECK_EQ("S", bonus('S'), 100);
              CHECK_EQ("A", bonus('A'), 50);
              CHECK_EQ("B", bonus('B'), 20);
              CHECK_EQ("C", bonus('C'), 0);
          }
        hints:
          - "Leave out `break` where you want to continue into the next case, and write `[[fallthrough]];` there instead."
