id: c-structs
title: Structs, enums and typedef
lang: c
phase: "C: Memory"
summary: Group related data into your own types. Struct members, arrays of structs, pointers with ->, enums and typedef.
steps:
  - title: Define a struct
    id: c-structs-1
    text: |
      Real data comes in groups. A player has a name, kills and deaths; a point has an x and a y. Keeping them in separate variables means passing three arguments everywhere and hoping they stay in sync. A **struct** bundles related variables into **one new type**.

      ```c run
      #include <stdio.h>

      struct Book {
          const char *title;
          int year;
          double price;
      };

      int main(void) {
          struct Book b = {"The C Programming Language", 1978, 45.0};
          printf("%s (%d)\n", b.title, b.year);
          b.price = b.price * 0.8;
          printf("sale price %.2f\n", b.price);
          return 0;
      }
      ```

      ```output
      The C Programming Language (1978)
      sale price 36.00
      ```

      ### The parts

      - `struct Book { ... };` **defines the type**: a blueprint listing the **members** (also called fields). Note the semicolon after the closing brace; forgetting it gives a confusing error on the next line.
      - `struct Book b` creates a **variable** of that type. The type's full name includes the word `struct`.
      - `{"...", 1978, 45.0}` initializes the members **in the order they're declared**. You can also name them: `{.year = 1978, .title = "...", .price = 45.0}`, which is clearer and survives reordering.
      - `b.title` uses the **dot operator** to reach one member. Each member is a normal variable you can read and assign.

      ### In memory

      A struct's members are stored together, in declaration order, as one block. The compiler may add a few bytes of **padding** between members so each is aligned for fast access, which is why `sizeof(struct Book)` can be larger than the sum of its members.

      **Your turn:** complete the struct and print the weapon's name and damage.
    fill: |
      #include <stdio.h>

      [[struct]] Weapon {
          const char *name;
          int damage;
      };

      int main(void) {
          struct Weapon w = {"deagle", 53};
          printf("%s does %d\n", w[[.]]name, w.[[damage]]);
          return 0;
      }
    hints:
      - Types you define with members use the `struct` keyword.
      - "Members are accessed with a dot: `w.name`, `w.damage`."
    tests:
      - expect: "deagle does 53"

  - title: Structs in functions
    id: c-structs-2
    text: |
      A struct is a value, like an `int`. You can pass it to a function, return it from one, and assign one struct to another with `=`, which copies **every member**.

      ```c run
      #include <stdio.h>

      struct Rect {
          double w;
          double h;
      };

      double area(struct Rect r) {
          return r.w * r.h;
      }

      struct Rect scaled(struct Rect r, double k) {
          r.w *= k;
          r.h *= k;
          return r;
      }

      int main(void) {
          struct Rect a = {2.0, 3.0};
          struct Rect b = scaled(a, 2.0);
          printf("%.1f %.1f\n", area(a), area(b));
          return 0;
      }
      ```

      ```output
      6.0 24.0
      ```

      ### Copies again

      Passing a struct copies it, just like an `int`. `scaled` changes its own copy `r` and returns it; `a` in `main` is untouched. That's often exactly what you want for small structs like points or rectangles: functions that take values and return new values are easy to reason about.

      For large structs, copying every member on every call costs time, and a function that needs to **modify** the caller's struct can't do it through a copy. Both problems are solved with pointers, which is the next step.

      ### Guarding a division

      A ratio like kills per death needs care when the bottom is 0: dividing an int by zero is undefined behavior and usually crashes, and dividing a double by zero gives infinity (or "not a number" for 0.0 / 0.0). Check for the special case first and return the fallback the task asks for. Remember to convert to `double` before dividing, or the fraction is lost.

      **Your turn:** write `double kd(struct Player p)` that returns kills divided by deaths as a double. If deaths is 0, return the kills.
    seed: |
      struct Player {
          const char *name;
          int kills;
          int deaths;
      };

      double kd(struct Player p) {

      }
    solution: |
      struct Player {
          const char *name;
          int kills;
          int deaths;
      };

      double kd(struct Player p) {
          if (p.deaths == 0) return p.kills;
          return (double)p.kills / p.deaths;
      }
    harness: |
      int main(void) {
          struct Player a = {"a", 20, 10};
          struct Player b = {"b", 7, 0};
          struct Player c = {"c", 15, 20};
          CHECK_DBL("20/10", kd(a), 2.0);
          CHECK_DBL("7/0 -> 7", kd(b), 7.0);
          CHECK_DBL("15/20", kd(c), 0.75);
          return 0;
      }
    hints:
      - Guard `p.deaths == 0` first.
      - "Cast to avoid integer division: `(double)p.kills / p.deaths`."

  - title: Pointers to structs and ->
    id: c-structs-3
    text: |
      To let a function **change** a struct, or to avoid copying a big one, pass a **pointer** to it. You'd then write `(*p).kills` to reach a member (the parentheses are needed because `.` binds tighter than `*`). That's so common that C has a shortcut: **`p->kills`** means exactly `(*p).kills`.

      ```c run
      #include <stdio.h>

      struct Account {
          const char *owner;
          int balance;
      };

      int withdraw(struct Account *a, int amount) {
          if (amount > a->balance) {
              return 0;
          }
          a->balance -= amount;
          return 1;
      }

      int main(void) {
          struct Account acc = {"Ada", 100};
          int ok1 = withdraw(&acc, 30);
          int ok2 = withdraw(&acc, 500);
          printf("%d %d balance %d\n", ok1, ok2, acc.balance);
          return 0;
      }
      ```

      ```output
      1 0 balance 70
      ```

      ### Dot or arrow?

      - A struct **variable**: use `.` (`acc.balance`).
      - A **pointer** to a struct: use `->` (`a->balance`).

      The compiler tells you if you mix them up: `member reference type 'struct Account *' is a pointer; did you mean to use '->'?` means you used `.` on a pointer.

      ### Conventions

      - Pass `struct X *` when the function modifies the struct.
      - Pass `const struct X *` when it only reads a large struct. You get the speed of a pointer and the safety of a copy: the compiler rejects any attempt to modify through it.
      - Small structs (a couple of numbers) are fine to pass by value.

      Use the **Watch it run** link to see the pointer's arrow lead back to the struct in `main`.

      **Your turn:** write `void record_round(struct Player *p, int kills, int died)` that adds `kills` to `p->kills` and adds 1 to `p->deaths` if `died` is non-zero.
    seed: |
      struct Player {
          const char *name;
          int kills;
          int deaths;
      };

      void record_round(struct Player *p, int kills, int died) {

      }
    solution: |
      struct Player {
          const char *name;
          int kills;
          int deaths;
      };

      void record_round(struct Player *p, int kills, int died) {
          p->kills += kills;
          if (died) p->deaths++;
      }
    harness: |
      int main(void) {
          struct Player p = {"you", 0, 0};
          record_round(&p, 2, 1);
          record_round(&p, 0, 1);
          record_round(&p, 3, 0);
          CHECK_INT("kills after 3 rounds", p.kills, 5);
          CHECK_INT("deaths after 3 rounds", p.deaths, 2);
          return 0;
      }
    hints:
      - "`p->kills += kills;`"
      - "`if (died) p->deaths++;`"

  - title: Arrays of structs
    id: c-structs-4
    text: |
      An array of structs is like a table: each element is one row, and the members are the columns. This is how a lot of real data is organized: a list of players, products, students or events.

      ```c run
      #include <stdio.h>

      struct City {
          char name[20];
          int population;
      };

      int main(void) {
          struct City cities[3];
          int n;
          scanf("%d", &n);
          for (int i = 0; i < n; i++) {
              scanf("%19s %d", cities[i].name, &cities[i].population);
          }
          int smallest = 0;
          for (int i = 1; i < n; i++) {
              if (cities[i].population < cities[smallest].population) {
                  smallest = i;
              }
          }
          printf("smallest: %s\n", cities[smallest].name);
          return 0;
      }
      ```

      ```input
      3
      Lyon 516000
      Nice 342000
      Lille 236000
      ```

      ```output
      smallest: Lille
      ```

      ### Reading the syntax

      `cities[i].name` means: element `i` of the array, then its `name` member. When reading input, `name` is a char array so it needs no `&`, while `population` is an int so it needs `&cities[i].population`.

      ### Track the index, not the value

      The loop remembers **which** element is best (`smallest`, an index), not just the best number. That way you can print any member of the winning row afterwards. Start with element 0 as the best and compare the rest against it.

      ### Ties

      With `<` (strictly less), a later element only replaces the current best if it's **strictly** better, so the **first** of several equal values wins. With `<=`, the last one would win. Choosing the right comparison is how you control tie-breaking.

      **Your turn:** the input is `n` followed by `n` lines of `name kills`. Print the name of the player with the most kills (the first one wins ties).

      ```
      3
      ropz 18
      broky 25
      rain 25
      ```
      prints `MVP: broky`.
    seed: |
      #include <stdio.h>

      struct Player {
          char name[32];
          int kills;
      };

      int main(void) {
          struct Player team[10];
          int n;
          scanf("%d", &n);

          return 0;
      }
    solution: |
      #include <stdio.h>

      struct Player {
          char name[32];
          int kills;
      };

      int main(void) {
          struct Player team[10];
          int n;
          scanf("%d", &n);
          for (int i = 0; i < n; i++) {
              scanf("%31s %d", team[i].name, &team[i].kills);
          }
          int best = 0;
          for (int i = 1; i < n; i++) {
              if (team[i].kills > team[best].kills) best = i;
          }
          printf("MVP: %s\n", team[best].name);
          return 0;
      }
    hints:
      - "Read each row with `scanf(\"%31s %d\", team[i].name, &team[i].kills);` (no & for the char array)."
      - Track the index of the best so far, and only replace it on a strictly greater kill count.
    tests:
      - stdin: "3\nropz 18\nbroky 25\nrain 25\n"
      - stdin: "1\nsolo 0\n"
      - stdin: "4\na 1\nb 2\nc 9\nd 3\n"
        hidden: true

  - title: enum
    id: c-structs-5
    text: |
      Many values come from a small, fixed set: a traffic light is red, yellow or green; a player is on one of two sides. You could use plain ints (0, 1, 2), but then the code is full of magic numbers. An **enum** gives each value a name:

      ```c run
      #include <stdio.h>

      enum Light { RED, YELLOW, GREEN };

      const char *action(enum Light l) {
          switch (l) {
              case RED:
                  return "stop";
              case YELLOW:
                  return "slow down";
              case GREEN:
                  return "go";
          }
          return "?";
      }

      int main(void) {
          enum Light now = YELLOW;
          printf("%s\n", action(now));
          printf("%d %d\n", RED, GREEN);
          return 0;
      }
      ```

      ```output
      slow down
      0 2
      ```

      ### How enums work

      The names are integer constants. By default the first is 0 and each next one is one more, so `RED` is 0, `YELLOW` 1, `GREEN` 2. You can set values explicitly: `enum Http { OK = 200, NOT_FOUND = 404 };`.

      `if (l == GREEN)` reads far better than `if (l == 2)`, and if the list changes, the names still mean the right thing.

      ### Enums and switch

      `switch` over an enum is a natural pairing. Compilers can even warn (`-Wswitch`) when a `switch` forgets one of the enum's values, which catches bugs when a new value is added later.

      ### Returning strings

      The function returns `const char *` pointing at string literals. Literals live for the whole program, so returning them is safe (unlike returning a local array). The `const` is there because literals must not be modified.

      C doesn't stop you from storing any int in an enum variable, which is why a final fallback like `return "?"` is good practice.

      **Your turn:** write `const char *weapon_name(enum Weapon w)` that returns `"rifle"`, `"pistol"`, `"knife"` for the three enum values and `"?"` otherwise.
    seed: |
      enum Weapon { RIFLE, PISTOL, KNIFE };

      const char *weapon_name(enum Weapon w) {

      }
    solution: |
      enum Weapon { RIFLE, PISTOL, KNIFE };

      const char *weapon_name(enum Weapon w) {
          switch (w) {
              case RIFLE: return "rifle";
              case PISTOL: return "pistol";
              case KNIFE: return "knife";
          }
          return "?";
      }
    harness: |
      int main(void) {
          CHECK_STR("RIFLE", weapon_name(RIFLE), "rifle");
          CHECK_STR("PISTOL", weapon_name(PISTOL), "pistol");
          CHECK_STR("KNIFE", weapon_name(KNIFE), "knife");
          CHECK_INT("KNIFE has value 2", KNIFE, 2);
          CHECK_STR("unknown value", weapon_name((enum Weapon)7), "?");
          return 0;
      }
    hints:
      - "`switch (w) { case RIFLE: return \"rifle\"; ... }`"
      - Return `"?"` after the switch for anything unmatched.

  - title: typedef
    id: c-structs-6
    text: |
      Writing `struct Player` every time gets tiresome. `typedef` creates a new name (an alias) for an existing type:

      ```c
      typedef unsigned long long u64;   // u64 now means unsigned long long
      ```

      It's most often used with structs, so the type can be named with one word:

      ```c run
      #include <stdio.h>

      typedef struct {
          int r, g, b;
      } Color;

      Color mix(Color a, Color b) {
          Color out = {(a.r + b.r) / 2, (a.g + b.g) / 2, (a.b + b.b) / 2};
          return out;
      }

      int main(void) {
          Color red = {255, 0, 0};
          Color blue = {0, 0, 255};
          Color purple = mix(red, blue);
          printf("%d %d %d\n", purple.r, purple.g, purple.b);
          return 0;
      }
      ```

      ```output
      127 0 127
      ```

      ### Reading it

      `typedef struct { ... } Color;` defines an unnamed struct and names it `Color` in one go. After that, `Color` works like `int` or `double`: in declarations, parameters and return types.

      Notice `int r, g, b;`: several members of the same type can share one declaration.

      ### Returning a new struct

      `mix` builds a new `Color` from its inputs and returns it, leaving the inputs unchanged. Small value types like colors, points and vectors are usually written this way, and it's exactly how math-style code works in C and C++. You'll see this style again with operator overloading in C++, where `a + b` can be defined for your own types.

      ### Style

      Some C codebases (the Linux kernel, for example) avoid typedefs for structs, preferring the explicit `struct x`. Others use them everywhere. Follow the style of the code you're working in.

      **Your turn:** complete the typedef and write `Vec2 add(Vec2 a, Vec2 b)` returning the component-wise sum.
    seed: |
      typedef struct {
          double x, y;
      } Vec2;

      Vec2 add(Vec2 a, Vec2 b) {

      }
    solution: |
      typedef struct {
          double x, y;
      } Vec2;

      Vec2 add(Vec2 a, Vec2 b) {
          Vec2 r = {a.x + b.x, a.y + b.y};
          return r;
      }
    harness: |
      int main(void) {
          Vec2 a = {1, 2}, b = {3.5, -4};
          Vec2 c = add(a, b);
          CHECK_DBL("x", c.x, 4.5);
          CHECK_DBL("y", c.y, -2.0);
          Vec2 z = add(c, (Vec2){0, 0});
          CHECK_DBL("adding zero keeps x", z.x, 4.5);
          return 0;
      }
    hints:
      - "Build the result: `Vec2 r = {a.x + b.x, a.y + b.y};` and return it."
