      - task: |
          Write `find WORD FILE...`, a small version of `grep`. For every line that contains `WORD`, print `FILE: LINE`. Follow grep's exit codes:

          - **0** if at least one line matched
          - **1** if nothing matched
          - **2** on an error: fewer than two arguments (print `usage: find WORD FILE...` to stderr), or a file that can't be opened (print `find: cannot open FILE` to stderr, skip it, and still search the others)

          Lines are at most 255 characters long.
        seed: |
          #include <stdio.h>
          #include <string.h>

          int main(int argc, char **argv) {

              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <string.h>

          int main(int argc, char **argv) {
              if (argc < 3) {
                  fprintf(stderr, "usage: find WORD FILE...\n");
                  return 2;
              }
              const char *word = argv[1];
              int matched = 0, error = 0;
              char line[256];
              for (int i = 2; i < argc; i++) {
                  FILE *f = fopen(argv[i], "r");
                  if (f == NULL) {
                      fprintf(stderr, "find: cannot open %s\n", argv[i]);
                      error = 1;
                      continue;
                  }
                  while (fgets(line, sizeof line, f) != NULL) {
                      line[strcspn(line, "\n")] = '\0';
                      if (strstr(line, word) != NULL) {
                          printf("%s: %s\n", argv[i], line);
                          matched = 1;
                      }
                  }
                  fclose(f);
              }
              if (error) return 2;
              return matched ? 0 : 1;
          }
        require:
          - pattern: "stderr"
            message: Print the error messages to `stderr` with `fprintf(stderr, ...)`.
          - pattern: "strstr\\s*\\("
            message: Look for the word inside each line with `strstr`.
        hints:
          - Keep two flags while you loop over the files, one for "something matched" and one for "an error happened".
          - "Decide the exit code at the end: 2 if there was an error, otherwise 0 or 1 depending on the matches."
        tests:
          - args: [ "kill", "a.log", "b.log" ]
            files:
              a.log: "round 1\nropz kill rain\n"
              b.log: "rain kill broky\nbomb planted\n"
          - args: [ "defuse", "a.log" ]
            files:
              a.log: "round 1\nplant\n"
            exit: 1
            allowEmpty: true
          - args: [ "plant", "missing.log", "a.log" ]
            files:
              a.log: "round 1\nplant\n"
            exit: 2
          - args: [ "x" ]
            exit: 2
            allowEmpty: true
            hidden: true
