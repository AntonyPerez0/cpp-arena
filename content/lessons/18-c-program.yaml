id: c-program
title: Organizing programs
lang: c
phase: "C: Real-World C"
summary: How real C programs are split into files. Headers and include guards, static and extern, const-correct APIs, command-line arguments, exit codes and stderr.
steps:
  - title: Headers and include guards
    id: c-program-1
    text: |
      Real C programs are thousands or millions of lines, split across many files. Understanding how those files fit together is essential for working on any real codebase.

      ### Modules: a header and a source file

      Each module usually has two files:

      - A **header** (`score.h`) with **declarations**: type definitions, function prototypes and constants. It's the module's public interface: what other code may use.
      - A **source file** (`score.c`) with the **definitions**: the actual function bodies. It `#include`s its own header.

      Other files `#include "score.h"` (quotes for your own headers, angle brackets for system headers) and can then call its functions.

      ### How it's built

      The compiler turns each `.c` file into an **object file** separately, knowing only what its includes declared. Then the **linker** joins all the object files, connecting each call to the matching definition. If a definition is missing, the linker reports an error like `undefined reference to 'kd_ratio'` (or `undefined symbol: kd_ratio`); if something is defined twice, `multiple definition` (or `duplicate symbol`).

      ### Include guards

      `#include` pastes a file's text. Headers often end up included more than once (`main.c` includes `a.h` and `b.h`, and both include `score.h`), and defining the same struct twice is an error. An **include guard** makes repeat inclusions disappear:

      ```c run
      #include <stdio.h>

      #ifndef GREETING_H
      #define GREETING_H
      #define GREETING "hi"
      typedef struct { int times; } Repeat;
      #endif

      #ifndef GREETING_H
      #define GREETING_H
      #define GREETING "hi"
      typedef struct { int times; } Repeat;
      #endif

      int main(void) {
          Repeat r = {2};
          for (int i = 0; i < r.times; i++) printf("%s\n", GREETING);
          return 0;
      }
      ```

      ```output
      hi
      hi
      ```

      The first time, `GREETING_H` isn't defined, so everything up to `#endif` is kept, and `GREETING_H` gets defined. The second time, `#ifndef GREETING_H` is false and the preprocessor skips the whole block. Many compilers also accept `#pragma once` at the top of a header for the same effect.

      The editor here holds a single file, so this program pastes the "header" in **twice** to simulate a double include. **Your turn:** complete the guard so it compiles.
    fill: |
      #include <stdio.h>

      /* ---- score.h (first include) ---- */
      [[#ifndef]] SCORE_H
      [[#define]] SCORE_H
      typedef struct { int kills, deaths; } Score;
      double kd_ratio(Score s);
      [[#endif]]

      /* ---- score.h (included again by another header) ---- */
      #ifndef SCORE_H
      #define SCORE_H
      typedef struct { int kills, deaths; } Score;
      double kd_ratio(Score s);
      #endif

      /* ---- score.c ---- */
      double kd_ratio(Score s) {
          return s.deaths == 0 ? s.kills : (double)s.kills / s.deaths;
      }

      /* ---- main.c ---- */
      int main(void) {
          Score s = {30, 12};
          printf("%.2f\n", kd_ratio(s));
          return 0;
      }
    hints:
      - "The guard is `#ifndef NAME`, then `#define NAME`, then the contents, then `#endif`."
    tests:
      - expect: "2.50"
    more:
      - task: |
          Here `weapon.h` is pasted twice, as if two other headers both included it. Fill in the guard's macro name in all four blanks so the second copy is skipped. The program prints `awp 4750`.
        fill: |
          #include <stdio.h>

          /* ---- weapon.h (first include) ---- */
          #ifndef [[WEAPON_H]]
          #define [[WEAPON_H]]
          struct Weapon { const char *name; int price; };
          #endif

          /* ---- weapon.h (included again) ---- */
          #ifndef [[WEAPON_H]]
          #define [[WEAPON_H]]
          struct Weapon { const char *name; int price; };
          #endif

          /* ---- main.c ---- */
          int main(void) {
              struct Weapon w = {"awp", 4750};
              printf("%s %d\n", w.name, w.price);
              return 0;
          }
        hints:
          - Every copy must use the **same** name, usually the file name in capitals, `WEAPON_H`.
          - "The first time, `WEAPON_H` isn't defined yet, so the code is kept and the name gets defined. The second time, `#ifndef` is false and the copy is skipped."
        tests:
          - expect: "awp 4750"
      - task: |
          `vec.h` is pasted twice again, but this time it has no guard, so the compiler complains that `struct Vec` is defined twice. Press **Check** to see the error, then add an include guard named `VEC_H` around **both** copies.
        seed: |
          #include <stdio.h>

          /* ---- vec.h (first include) ---- */
          struct Vec { int x, y; };
          int vec_len2(struct Vec v);

          /* ---- vec.h (included again by another header) ---- */
          struct Vec { int x, y; };
          int vec_len2(struct Vec v);

          /* ---- vec.c ---- */
          int vec_len2(struct Vec v) {
              return v.x * v.x + v.y * v.y;
          }

          /* ---- main.c ---- */
          int main(void) {
              struct Vec v = {3, 4};
              printf("%d\n", vec_len2(v));
              return 0;
          }
        solution: |
          #include <stdio.h>

          /* ---- vec.h (first include) ---- */
          #ifndef VEC_H
          #define VEC_H
          struct Vec { int x, y; };
          int vec_len2(struct Vec v);
          #endif

          /* ---- vec.h (included again by another header) ---- */
          #ifndef VEC_H
          #define VEC_H
          struct Vec { int x, y; };
          int vec_len2(struct Vec v);
          #endif

          /* ---- vec.c ---- */
          int vec_len2(struct Vec v) {
              return v.x * v.x + v.y * v.y;
          }

          /* ---- main.c ---- */
          int main(void) {
              struct Vec v = {3, 4};
              printf("%d\n", vec_len2(v));
              return 0;
          }
        require:
          - pattern: "#ifndef\\s+VEC_H[\\s\\S]*#ifndef\\s+VEC_H"
            message: Put an `#ifndef VEC_H` / `#define VEC_H` / `#endif` guard around both copies of the header.
        hints:
          - "A real header gets its guard once, in the file itself. Here each pasted copy stands for the same file, so each copy needs the same three lines: `#ifndef VEC_H`, `#define VEC_H`, and `#endif` at the end."
        tests:
          - expect: "25"

  - title: static functions and variables
    id: c-program-2
    text: |
      `static` is one of C's most overloaded keywords. It has two jobs, and both are about keeping things hidden or contained.

      ### 1. On functions and globals: private to the file

      A function or global variable marked `static` has **internal linkage**: its name is only visible inside its own `.c` file. Other files can't call it, and two files can each have their own `static int helper(void)` without the linker complaining about a duplicate. Professional code marks **every** function that isn't part of the header's public interface as `static`. It keeps the public surface small and avoids name clashes across a big program.

      ### 2. On local variables: keeps its value between calls

      A `static` local variable is created **once**, when the program starts, and keeps its value from one call of the function to the next. Its initializer runs only once. A normal local is created fresh on every call.

      ```c run
      #include <stdio.h>

      static int square(int x) {
          return x * x;
      }

      int calls(void) {
          static int count = 0;
          int fresh = 0;
          count++;
          fresh++;
          printf("count %d, fresh %d\n", count, fresh);
          return count;
      }

      int main(void) {
          calls();
          calls();
          calls();
          printf("%d\n", square(calls()));
          return 0;
      }
      ```

      ```output
      count 1, fresh 1
      count 2, fresh 1
      count 3, fresh 1
      count 4, fresh 1
      16
      ```

      `count` remembers between calls; `fresh` starts over every time.

      Static locals are handy for counters, ID generators and caches, but use them sparingly: hidden state makes functions harder to test (calling twice gives different results) and isn't safe when several threads call the function at once.

      **Your turn:** write `int next_ticket(void)` that returns 1, 2, 3, ... on successive calls, using a static local. Also write a private `static` helper `pad3(int n)` returning `n % 1000`, and use it so tickets wrap back to 0 after 999.
    seed: |
      int next_ticket(void) {

      }
    solution: |
      static int pad3(int n) {
          return n % 1000;
      }

      int next_ticket(void) {
          static int last = 0;
          last = pad3(last + 1);
          return last;
      }
    require:
      - pattern: "static\\s+int\\s+pad3\\s*\\("
        message: "Define the helper as `static int pad3(int n)` so it's private to this file."
      - pattern: "static\\s+int\\s+\\w+\\s*=\\s*0\\s*;"
        message: "Keep the counter in a `static` local variable inside next_ticket."
    harness: |
      int main(void) {
          CHECK_INT("first call", next_ticket(), 1);
          CHECK_INT("second call", next_ticket(), 2);
          CHECK_INT("third call", next_ticket(), 3);
          for (int i = 4; i <= 998; i++) next_ticket();
          CHECK_INT("999th", next_ticket(), 999);
          CHECK_INT("wraps to 0", next_ticket(), 0);
          CHECK_INT("then 1 again", next_ticket(), 1);
          return 0;
      }
    hints:
      - "`static int pad3(int n) { return n % 1000; }` goes above next_ticket."
      - "Inside next_ticket: `static int last = 0; last = pad3(last + 1); return last;`"
    more:
      - task: |
          Write `int roll(void)`, a dice roll from 1 to 6 made with a simple random-number generator whose state lives in a `static` variable at file scope, so only this file can see it:

          ```
          state starts at 1
          each call: state = state * 1103515245 + 12345   (unsigned 32-bit, wrapping)
          result = ((state >> 16) & 0x7FFF) % 6 + 1
          ```

          The first four rolls are 3, 5, 4, 2.
        seed: |
          #include <stdint.h>

          int roll(void) {

          }
        solution: |
          #include <stdint.h>

          static uint32_t state = 1;

          int roll(void) {
              state = state * 1103515245u + 12345u;
              return (int)(((state >> 16) & 0x7FFFu) % 6u) + 1;
          }
        harness: |
          int main(void) {
              CHECK_INT("1st roll", roll(), 3);
              CHECK_INT("2nd roll", roll(), 5);
              CHECK_INT("3rd roll", roll(), 4);
              CHECK_INT("4th roll", roll(), 2);
              int ok = 1;
              for (int i = 0; i < 1000; i++) {
                  int r = roll();
                  if (r < 1 || r > 6) ok = 0;
              }
              CHECK("always 1 to 6", ok);
              return 0;
          }
        require:
          - pattern: "static\\s+(uint32_t|unsigned)"
            message: Keep the generator's state in a `static` variable.
        hints:
          - "Use `uint32_t` for the state, so the multiplication wraps at 32 bits exactly as the formula says."
          - A `static` variable outside any function keeps its value between calls, and other files can't touch it.
        tests: []
      - task: |
          Write `const char *next_map(void)`, which returns `"dust2"`, `"mirage"`, `"inferno"`, then starts again, and `void reset_maps(void)`, which makes the next call return `"dust2"` again. Both functions share the position, so it must be a `static` variable at **file** scope, not a static local.
        seed: |
          const char *next_map(void) {

          }

          void reset_maps(void) {

          }
        solution: |
          static const char *const maps[] = {"dust2", "mirage", "inferno"};
          static int pos = 0;

          const char *next_map(void) {
              const char *m = maps[pos];
              pos = (pos + 1) % 3;
              return m;
          }

          void reset_maps(void) {
              pos = 0;
          }
        harness: |
          int main(void) {
              CHECK_STR("1st", next_map(), "dust2");
              CHECK_STR("2nd", next_map(), "mirage");
              CHECK_STR("3rd", next_map(), "inferno");
              CHECK_STR("wraps around", next_map(), "dust2");
              next_map();
              reset_maps();
              CHECK_STR("after reset", next_map(), "dust2");
              CHECK_STR("and on from there", next_map(), "mirage");
              return 0;
          }
        require:
          - pattern: "^static\\s+int\\s+\\w+\\s*=\\s*0\\s*;"
            flags: m
            message: Keep the position in a file-scope `static int` (outside both functions) so both can use it.
        hints:
          - A static local inside `next_map` couldn't be reset by `reset_maps`. Declare `static int pos = 0;` above both functions.
          - Keep the map names in a static array too, and wrap the position with `% 3`.
        tests: []

  - title: extern and shared state
    id: c-program-3
    text: |
      A global variable defined in one file can be used from other files. The file that uses it needs a **declaration** saying "this variable exists, with this type, defined somewhere else". That's what `extern` is for:

      ```c
      /* config.h: the declaration, included wherever it's used */
      extern int max_rounds;

      /* config.c: the one definition, which actually creates the variable */
      int max_rounds = 30;
      ```

      ### Declaration vs definition

      This distinction runs through all of C:

      - A **declaration** tells the compiler a name and its type. There can be many.
      - A **definition** creates the thing (reserves memory for a variable, or provides a function's body). There must be **exactly one**.

      For functions, a prototype is a declaration and is implicitly `extern`. For variables, `extern int x;` is a declaration, while `int x = 5;` at file scope is a definition.

      ```c run
      #include <stdio.h>

      extern const char *app_name;
      extern int version;

      int main(void) {
          printf("%s v%d\n", app_name, version);
          return 0;
      }

      const char *app_name = "arena";
      int version = 3;
      ```

      ```output
      arena v3
      ```

      Here the declarations come first, so `main` can use the variables that are defined further down. In a real project the definitions would be in another file.

      ### A warning about globals

      Mutable globals are convenient and dangerous. Any code anywhere can change them, so bugs are hard to trace; tests interfere with each other; and threads race on them. Large codebases prefer passing a struct (like a `Config *`) to the functions that need it. Globals are at their best when they're `const`.

      **Your turn:** declare `max_rounds` with `extern` above `main` so it can be used before the definition that appears later in the file.
    fill: |
      #include <stdio.h>

      [[extern]] int max_rounds;

      int main(void) {
          printf("first to %d\n", max_rounds / 2 + 1);
          return 0;
      }

      /* ---- config.c ---- */
      int max_rounds = 24;
    hints:
      - "A declaration without a definition uses the `extern` keyword."
    tests:
      - expect: "first to 13"
    more:
      - task: |
          Declare the map pool and its size with `extern`, so `main` can use them before their definitions further down the file. The program prints `3 maps: dust2 ... nuke`.
        fill: |
          #include <stdio.h>

          [[extern]] const char *map_pool[];
          [[extern]] int pool_size;

          int main(void) {
              printf("%d maps: %s ... %s\n", pool_size, map_pool[0], map_pool[pool_size - 1]);
              return 0;
          }

          /* ---- maps.c ---- */
          const char *map_pool[] = {"dust2", "mirage", "nuke"};
          int pool_size = 3;
        hints:
          - "`extern` says \"this exists, it's defined somewhere else\". It doesn't create the variable."
        tests:
          - expect: "3 maps: dust2 ... nuke"
      - task: |
          `main` uses a counter and a function that are both defined further down, as if they were in `stats.c`. Add the two declarations `main` needs above it: the counter with `extern`, and the function with a prototype. The program prints `kills 3`.
        seed: |
          #include <stdio.h>

          // declare total_kills and add_kill here

          int main(void) {
              add_kill();
              add_kill();
              add_kill();
              printf("kills %d\n", total_kills);
              return 0;
          }

          /* ---- stats.c ---- */
          int total_kills = 0;

          void add_kill(void) {
              total_kills++;
          }
        solution: |
          #include <stdio.h>

          // declare total_kills and add_kill here
          extern int total_kills;
          void add_kill(void);

          int main(void) {
              add_kill();
              add_kill();
              add_kill();
              printf("kills %d\n", total_kills);
              return 0;
          }

          /* ---- stats.c ---- */
          int total_kills = 0;

          void add_kill(void) {
              total_kills++;
          }
        require:
          - pattern: "extern\\s+int\\s+total_kills\\s*;"
            message: "Declare the counter with `extern int total_kills;`."
          - pattern: "void\\s+add_kill\\s*\\(\\s*void\\s*\\)\\s*;"
            message: "Declare the function with a prototype, `void add_kill(void);`."
        hints:
          - In a real project these two lines would go in `stats.h`, and `main.c` would include it.
        tests:
          - expect: "kills 3"

  - title: const-correct interfaces
    id: c-program-4
    text: |
      In a header, each function signature is a **contract** with every caller. Pointer parameters raise one question above all: will this function modify what I pass in? `const` answers it in the signature itself:

      ```c
      size_t count_alive(const Player *team, size_t n);   /* only reads */
      void heal_all(Player *team, size_t n, int amount);  /* modifies */
      ```

      ### Why it matters

      - **Readers** can tell which functions have side effects without reading the bodies.
      - **Callers** holding `const` data (a read-only table, a string literal) should pass it only to functions that promise not to modify it. Without `const` on the parameter, the compiler warns that the call `discards qualifiers` (in C++ it's an outright error), and silencing it takes an ugly cast.
      - **The compiler** enforces the promise: a body that tries to write through a `const` pointer is an error.

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      typedef struct {
          const char *name;
          int stock;
      } Item;

      int total_stock(const Item *items, size_t n) {
          int sum = 0;
          for (size_t i = 0; i < n; i++) sum += items[i].stock;
          return sum;
      }

      void restock(Item *items, size_t n, int amount) {
          for (size_t i = 0; i < n; i++) items[i].stock += amount;
      }

      int main(void) {
          Item shop[] = {{"pen", 3}, {"cup", 0}};
          restock(shop, 2, 5);
          static const Item catalog[] = {{"lamp", 2}, {"desk", 1}};
          printf("%d %d\n", total_stock(shop, 2), total_stock(catalog, 2));
          return 0;
      }
      ```

      ```output
      13 3
      ```

      `total_stock` accepts both the modifiable `shop` and the read-only `catalog`, because it promises not to change either. `restock(catalog, ...)` gets a warning, and for good reason: it would write to data declared `const`, which is undefined behavior.

      ### Get it right early

      Adding `const` later is painful: once a function takes `const Item *`, every function it passes that pointer to must also take `const`, all the way down. That ripple is why experienced C programmers make parameters `const` from the start, whenever the function only reads.

      **Your turn:** fix the three signatures. The read-only ones need `const`; `heal_all` really does modify the team, so it must stay non-const.
    seed: |
      #include <stddef.h>
      #include <string.h>

      typedef struct {
          char name[16];
          int hp;
      } Player;

      size_t count_alive(Player *team, size_t n) {
          size_t alive = 0;
          for (size_t i = 0; i < n; i++)
              if (team[i].hp > 0) alive++;
          return alive;
      }

      int find_by_name(Player *team, size_t n, char *name) {
          for (size_t i = 0; i < n; i++)
              if (strcmp(team[i].name, name) == 0) return (int)i;
          return -1;
      }

      void heal_all(Player *team, size_t n, int amount) {
          for (size_t i = 0; i < n; i++)
              if (team[i].hp > 0) team[i].hp += amount;
      }
    solution: |
      #include <stddef.h>
      #include <string.h>

      typedef struct {
          char name[16];
          int hp;
      } Player;

      size_t count_alive(const Player *team, size_t n) {
          size_t alive = 0;
          for (size_t i = 0; i < n; i++)
              if (team[i].hp > 0) alive++;
          return alive;
      }

      int find_by_name(const Player *team, size_t n, const char *name) {
          for (size_t i = 0; i < n; i++)
              if (strcmp(team[i].name, name) == 0) return (int)i;
          return -1;
      }

      void heal_all(Player *team, size_t n, int amount) {
          for (size_t i = 0; i < n; i++)
              if (team[i].hp > 0) team[i].hp += amount;
      }
    require:
      - pattern: "count_alive\\s*\\(\\s*const\\s+Player\\s*\\*"
        message: "count_alive only reads the team: make it `const Player *team`."
      - pattern: "find_by_name\\s*\\(\\s*const\\s+Player\\s*\\*\\s*team\\s*,\\s*size_t\\s+n\\s*,\\s*const\\s+char\\s*\\*"
        message: "find_by_name only reads both the team and the name: make them `const Player *team` and `const char *name`."
    forbid:
      - pattern: "heal_all\\s*\\(\\s*const"
        message: "heal_all changes hp, so its team parameter can't be const."
    harness: |
      int main(void) {
          const Player pros[] = {{"ropz", 100}, {"rain", 0}, {"broky", 40}};
          CHECK_INT("count_alive works on const data", (int)count_alive(pros, 3), 2);
          CHECK_INT("find_by_name", find_by_name(pros, 3, "broky"), 2);
          CHECK_INT("missing name", find_by_name(pros, 3, "zywoo"), -1);
          Player team[] = {{"a", 10}, {"b", 0}};
          heal_all(team, 2, 5);
          CHECK("heal_all heals the living only", team[0].hp == 15 && team[1].hp == 0);
          return 0;
      }
    hints:
      - "Add `const` before `Player *team` in the two functions that only read it."
      - "find_by_name's `name` is also read-only: `const char *name`."
    more:
      - task: |
          Fix the two signatures. `total_hp` only reads the team, so it should take a `const Player *`. `rename_player` changes the player but only reads the new name, so the **name** should be `const char *` while the player stays non-const. The tests pass read-only data, so the wrong signatures don't compile.
        seed: |
          #include <stddef.h>
          #include <string.h>

          typedef struct {
              char name[16];
              int hp;
          } Player;

          int total_hp(Player *team, size_t n) {
              int total = 0;
              for (size_t i = 0; i < n; i++) total += team[i].hp;
              return total;
          }

          void rename_player(Player *p, char *name) {
              strncpy(p->name, name, sizeof p->name - 1);
              p->name[sizeof p->name - 1] = '\0';
          }
        solution: |
          #include <stddef.h>
          #include <string.h>

          typedef struct {
              char name[16];
              int hp;
          } Player;

          int total_hp(const Player *team, size_t n) {
              int total = 0;
              for (size_t i = 0; i < n; i++) total += team[i].hp;
              return total;
          }

          void rename_player(Player *p, const char *name) {
              strncpy(p->name, name, sizeof p->name - 1);
              p->name[sizeof p->name - 1] = '\0';
          }
        harness: |
          int main(void) {
              const Player pros[] = {{"ropz", 100}, {"rain", 40}};
              CHECK_INT("total_hp works on const data", total_hp(pros, 2), 140);
              Player p = {"old", 100};
              const char *new_name = "broky";
              rename_player(&p, new_name);
              CHECK_STR("renamed from a const string", p.name, "broky");
              return 0;
          }
        require:
          - pattern: "total_hp\\s*\\(\\s*const\\s+Player\\s*\\*"
            message: "`total_hp` only reads the team, so take a `const Player *`."
          - pattern: "rename_player\\s*\\(\\s*Player\\s*\\*\\s*\\w+\\s*,\\s*const\\s+char\\s*\\*"
            message: "`rename_player` should take `Player *p, const char *name`."
        hints:
          - "`const` goes on what the function only reads: the team in `total_hp`, the name in `rename_player`."
        tests: []
      - task: |
          Write both functions with the right `const`:

          - `longest_name(team, n)` only reads, and returns a pointer to the longest name **inside** the team array (the first on a tie), or `NULL` for an empty team. Since the team is const, the returned string must be const too.
          - `find_mut(team, n, name)` returns a pointer to the player with that name so the caller can **change** them, or `NULL`.
        seed: |
          #include <stddef.h>
          #include <string.h>

          typedef struct {
              char name[16];
              int hp;
          } Player;

          // write longest_name and find_mut here
        solution: |
          #include <stddef.h>
          #include <string.h>

          typedef struct {
              char name[16];
              int hp;
          } Player;

          // write longest_name and find_mut here
          const char *longest_name(const Player *team, size_t n) {
              const char *best = NULL;
              for (size_t i = 0; i < n; i++) {
                  if (best == NULL || strlen(team[i].name) > strlen(best)) best = team[i].name;
              }
              return best;
          }

          Player *find_mut(Player *team, size_t n, const char *name) {
              for (size_t i = 0; i < n; i++) {
                  if (strcmp(team[i].name, name) == 0) return &team[i];
              }
              return NULL;
          }
        harness: |
          int main(void) {
              const Player pros[] = {{"ropz", 100}, {"karrigan", 40}, {"broky", 60}, {"frozen12", 5}};
              const char *ln = longest_name(pros, 4);
              CHECK_STR("longest name", ln, "karrigan");
              CHECK("points into the array", ln == pros[1].name);
              CHECK("empty team gives NULL", longest_name(pros, 0) == NULL);
              Player team[] = {{"a", 10}, {"b", 20}};
              Player *b = find_mut(team, 2, "b");
              if (b) b->hp = 99;
              CHECK_INT("changed through the returned pointer", team[1].hp, 99);
              CHECK("missing name gives NULL", find_mut(team, 2, "z") == NULL);
              return 0;
          }
        require:
          - pattern: "const\\s+char\\s*\\*\\s*longest_name\\s*\\(\\s*const\\s+Player\\s*\\*"
            message: "`longest_name` reads a const team, so it takes `const Player *` and returns `const char *`."
          - pattern: "Player\\s*\\*\\s*find_mut\\s*\\(\\s*Player\\s*\\*\\s*\\w+\\s*,\\s*size_t\\s+\\w+\\s*,\\s*const\\s+char\\s*\\*"
            message: "`find_mut` returns a changeable player, so it takes and returns `Player *`, with a `const char *` name."
        hints:
          - "`const char *longest_name(const Player *team, size_t n)` and `Player *find_mut(Player *team, size_t n, const char *name)`."
          - A pointer into a const array must be const. Returning a non-const pointer to it would let the caller change read-only data.
        tests: []

  - title: Command-line arguments
    id: c-program-5
    text: |
      Command-line programs receive input as **arguments**: the words typed after the program's name, like `gcc -Wall main.c` or `git commit -m "fix"`. To receive them, declare `main` with two parameters:

      ```c
      int main(int argc, char **argv)
      ```

      - `argc` (argument count) is how many there are, **including** the program name itself.
      - `argv` (argument vector) is an array of strings: `argv[0]` is the program name, and `argv[1]` to `argv[argc - 1]` are the arguments. `argv[argc]` is `NULL`.

      So running `./sum 4 5 6` gives `argc == 4`, `argv[1]` is `"4"`, and `argv[3]` is `"6"`. They're always **strings**, even when they look like numbers.

      ### Converting to numbers safely

      `atoi("12abc")` returns 12 and `atoi("abc")` returns 0 with no way to tell something went wrong. `strtol` reports where it stopped:

      ```c run
      #include <stdio.h>
      #include <stdlib.h>

      int parse_int(const char *s, long *out) {
          char *end;
          long v = strtol(s, &end, 10);
          if (end == s || *end != '\0') {
              return 0;
          }
          *out = v;
          return 1;
      }

      int main(void) {
          const char *tests[] = {"42", "-7", "12abc", ""};
          for (int i = 0; i < 4; i++) {
              long v;
              if (parse_int(tests[i], &v)) printf("\"%s\" -> %ld\n", tests[i], v);
              else printf("\"%s\" is not a number\n", tests[i]);
          }
          return 0;
      }
      ```

      ```output
      "42" -> 42
      "-7" -> -7
      "12abc" is not a number
      "" is not a number
      ```

      After the call, `end` points at the first character `strtol` didn't use. If it's the start of the string, no digits were found; if it's not the terminator, junk followed the number. Only when it's at the `'\0'` was the whole argument a clean number.

      (The example tests fixed strings; in your program, loop over `argv[1]` to `argv[argc - 1]`.)

      **Your turn:** print the sum of all arguments. If any argument isn't a clean integer, print `bad number: ARG` and stop. The tests run your program with different arguments.
    seed: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(int argc, char **argv) {

          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(int argc, char **argv) {
          long total = 0;
          for (int i = 1; i < argc; i++) {
              char *end;
              long v = strtol(argv[i], &end, 10);
              if (end == argv[i] || *end != '\0') {
                  printf("bad number: %s\n", argv[i]);
                  return 0;
              }
              total += v;
          }
          printf("%ld\n", total);
          return 0;
      }
    require:
      - pattern: "argv"
        message: Read the numbers from `argv`.
    hints:
      - "Loop from `i = 1` (argv[0] is the program name) to `i < argc`."
      - "`long v = strtol(argv[i], &end, 10);` then check `end == argv[i] || *end != '\\0'` for junk."
    tests:
      - args: [ "4", "5", "6" ]
      - args: []
      - args: [ "10", "-3", "x7" ]
      - args: [ "100", "200" ]
        hidden: true
    more:
      - task: |
          Print how many arguments there are and the longest one (the first on a tie), like `3 args, longest: inferno`. With no arguments at all, print `no args`. Remember that `argv[0]` is the program's name, not an argument.
        seed: |
          #include <stdio.h>
          #include <string.h>

          int main(int argc, char **argv) {

              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <string.h>

          int main(int argc, char **argv) {
              if (argc < 2) {
                  printf("no args\n");
                  return 0;
              }
              const char *longest = argv[1];
              for (int i = 2; i < argc; i++) {
                  if (strlen(argv[i]) > strlen(longest)) longest = argv[i];
              }
              printf("%d args, longest: %s\n", argc - 1, longest);
              return 0;
          }
        require:
          - pattern: "argv"
            message: Read the arguments from `argv`.
        hints:
          - The arguments are `argv[1]` to `argv[argc - 1]`, so there are `argc - 1` of them.
        tests:
          - args: [ "dust2", "inferno", "nuke" ]
          - args: []
          - args: [ "aa", "bb" ]
            hidden: true
      - task: |
          Parse two options: `-n NAME` (default `anon`) and `-r ROUNDS` (default `30`), in any order, and print `NAME plays ROUNDS rounds`. Errors go to **stdout** here so the tests can see them, and exit with code 2:

          - an unknown option prints `unknown option: OPT`
          - an option without a value after it prints `missing value for OPT`
          - a rounds value that isn't a whole number prints `bad rounds: VALUE`
        seed: |
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          int main(int argc, char **argv) {
              const char *name = "anon";
              long rounds = 30;

              printf("%s plays %ld rounds\n", name, rounds);
              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          int main(int argc, char **argv) {
              const char *name = "anon";
              long rounds = 30;
              for (int i = 1; i < argc; i++) {
                  const char *opt = argv[i];
                  if (strcmp(opt, "-n") != 0 && strcmp(opt, "-r") != 0) {
                      printf("unknown option: %s\n", opt);
                      return 2;
                  }
                  if (i + 1 >= argc) {
                      printf("missing value for %s\n", opt);
                      return 2;
                  }
                  const char *value = argv[++i];
                  if (strcmp(opt, "-n") == 0) {
                      name = value;
                  } else {
                      char *end;
                      rounds = strtol(value, &end, 10);
                      if (end == value || *end != '\0') {
                          printf("bad rounds: %s\n", value);
                          return 2;
                      }
                  }
              }
              printf("%s plays %ld rounds\n", name, rounds);
              return 0;
          }
        require:
          - pattern: "argv"
            message: Read the options from `argv`.
        hints:
          - Loop with an index. When you see an option, its value is `argv[i + 1]`; check that `i + 1 < argc` first, then skip it with `i++`.
          - Parse the rounds with `strtol` and check the end pointer, as in this step.
        tests:
          - args: [ "-n", "ropz", "-r", "24" ]
          - args: []
          - args: [ "-r", "16" ]
          - args: [ "-x" ]
            exit: 2
          - args: [ "-n" ]
            exit: 2
            hidden: true
          - args: [ "-r", "ten" ]
            exit: 2
            hidden: true

  - title: Variadic functions
    id: c-program-7
    text: |
      `printf` takes one argument, or five, or twenty. Functions like that are **variadic**, and you can write your own with `<stdarg.h>`. The `...` in the parameter list stands for "any number of extra arguments":

      ```c run
      #include <stdarg.h>
      #include <stdio.h>

      /* Average of the `count` ints that follow. */
      double average(int count, ...) {
          va_list args;
          va_start(args, count);                    /* extras start after `count` */
          int total = 0;
          for (int i = 0; i < count; i++) {
              total += va_arg(args, int);           /* the next extra, read as an int */
          }
          va_end(args);
          return count > 0 ? (double)total / count : 0.0;
      }

      /* A printf-style logger: hand the format and the extras to vprintf. */
      void log_line(int line, const char *fmt, ...) {
          va_list args;
          va_start(args, fmt);
          printf("[line %d] ", line);
          vprintf(fmt, args);
          printf("\n");
          va_end(args);
      }

      #define LOG(...) log_line(__LINE__, __VA_ARGS__)

      int main(void) {
          printf("%.2f\n", average(3, 90, 72, 85));
          LOG("loaded %d maps in %.2f s", 7, 0.25);
          return 0;
      }
      ```

      ```output
      82.33
      [line 30] loaded 7 maps in 0.25 s
      ```

      ### How it works

      - A variadic function needs at least one named parameter before the `...`. `va_start(args, last_named)` starts reading after it, each `va_arg(args, type)` fetches the next extra argument as that type, and `va_end(args)` cleans up.
      - **The function can't tell how many extras there are, or their types.** Something must say: a count (like `average`), a format string (like `printf`, where each `%d` or `%s` means one more argument), or a special last value such as `NULL`. Reading more extras than were passed, or reading one as the wrong type, is undefined behavior.
      - Extras go through the **default argument promotions**: `char` and `short` arrive as `int`, and `float` arrives as `double`. So read them with `va_arg(args, int)` or `va_arg(args, double)`; `va_arg(args, float)` is a bug.
      - To pass the extras on to another function, use the `v` versions of the standard functions, which take a `va_list`: `vprintf`, `vfprintf`, `vsnprintf`. That's how every logging function is built.
      - `LOG(...)` is a **variadic macro**: `__VA_ARGS__` pastes whatever arguments it was given. `__LINE__` is the line number where the macro is used (30 here), and `__FILE__` gives the file name, which is why logging macros use them.

      ### Why printf format mistakes are dangerous

      This explains an earlier rule. `printf` finds out what each extra argument is **only** from the format string. Pass a `double` where the format says `%d` and `printf` reads the wrong bytes: undefined behavior. For `printf` itself, compilers check the format string against the arguments and warn, which is one more reason to read warnings. Your own variadic functions get no such check.

      **Your turn:** write `max_of(count, ...)`, returning the largest of `count` ints (`count` is at least 1), and `format_into(buf, size, fmt, ...)`, which works exactly like `snprintf`: it formats into `buf`, never writing more than `size` bytes, and returns what `snprintf` would.
    seed: |
      #include <stdarg.h>
      #include <stdio.h>

      int max_of(int count, ...) {

      }

      int format_into(char *buf, size_t size, const char *fmt, ...) {

      }
    solution: |
      #include <stdarg.h>
      #include <stdio.h>

      int max_of(int count, ...) {
          va_list args;
          va_start(args, count);
          int best = va_arg(args, int);
          for (int i = 1; i < count; i++) {
              int x = va_arg(args, int);
              if (x > best) best = x;
          }
          va_end(args);
          return best;
      }

      int format_into(char *buf, size_t size, const char *fmt, ...) {
          va_list args;
          va_start(args, fmt);
          int n = vsnprintf(buf, size, fmt, args);
          va_end(args);
          return n;
      }
    require:
      - pattern: "va_start"
        message: Read the extra arguments with va_start, va_arg and va_end.
      - pattern: "vsnprintf"
        message: format_into should pass its va_list on to vsnprintf.
    harness: |
      int main(void) {
          CHECK_INT("max of 3", max_of(3, 4, 9, 2), 9);
          CHECK_INT("max of 1", max_of(1, -5), -5);
          CHECK_INT("all negative", max_of(4, -8, -3, -9, -4), -3);
          CHECK_INT("max first", max_of(3, 10, 1, 2), 10);
          char buf[32];
          int n = format_into(buf, sizeof buf, "%s has %d hp", "ada", 90);
          CHECK_STR("formats like printf", buf, "ada has 90 hp");
          CHECK_INT("returns the length", n, 13);
          char small[6];
          int m = format_into(small, sizeof small, "%d-%d", 1234, 5678);
          CHECK_STR("truncates safely", small, "1234-");
          CHECK_INT("returns the full length it needed", m, 9);
          return 0;
      }
    hints:
      - "max_of: after `va_start(args, count)`, read the first value with `va_arg(args, int)` as the best so far, then loop over the other `count - 1`."
      - "format_into: `va_start(args, fmt)`, then `int n = vsnprintf(buf, size, fmt, args);`, then `va_end(args)` and return `n`."
      - "Always call `va_end` before returning."
    more:
      - task: |
          Write `int sum_all(int count, ...)`, which adds up `count` ints, and `double average_of(int count, ...)`, which averages `count` **doubles** (`count` is at least 1). Each reads its extra arguments with `va_arg` using the matching type.
        seed: |
          #include <stdarg.h>

          int sum_all(int count, ...) {

          }

          double average_of(int count, ...) {

          }
        solution: |
          #include <stdarg.h>

          int sum_all(int count, ...) {
              va_list args;
              va_start(args, count);
              int total = 0;
              for (int i = 0; i < count; i++) total += va_arg(args, int);
              va_end(args);
              return total;
          }

          double average_of(int count, ...) {
              va_list args;
              va_start(args, count);
              double total = 0;
              for (int i = 0; i < count; i++) total += va_arg(args, double);
              va_end(args);
              return total / count;
          }
        harness: |
          int main(void) {
              CHECK_INT("sum of 3", sum_all(3, 4, 9, 2), 15);
              CHECK_INT("sum of none", sum_all(0), 0);
              CHECK_INT("sum with negatives", sum_all(4, -1, -2, 10, 3), 10);
              CHECK_DBL("average of 2.5 and 3.5", average_of(2, 2.5, 3.5), 3.0);
              CHECK_DBL("average of one", average_of(1, 7.25), 7.25);
              CHECK_DBL("average of 1, 2, 4", average_of(3, 1.0, 2.0, 4.0), 7.0 / 3);
              return 0;
          }
        require:
          - pattern: "va_start"
            message: Read the extra arguments with `va_start`, `va_arg` and `va_end`.
        hints:
          - Every `va_start` needs a matching `va_end`.
          - "`va_arg(args, double)` for doubles. Passing ints where doubles are expected would read garbage, which is why the tests pass `7.0` style numbers."
        tests: []
      - task: |
          Write `int log_msg(char *buf, size_t size, const char *level, const char *fmt, ...)` that writes `[LEVEL] ` followed by the formatted message, like `[WARN] 3 players left`. It must never write more than `size` bytes, and it returns the total length it **wanted** to write, like `snprintf`.
        seed: |
          #include <stdarg.h>
          #include <stdio.h>

          int log_msg(char *buf, size_t size, const char *level, const char *fmt, ...) {

          }
        solution: |
          #include <stdarg.h>
          #include <stdio.h>

          int log_msg(char *buf, size_t size, const char *level, const char *fmt, ...) {
              int head = snprintf(buf, size, "[%s] ", level);
              if (head < 0) return head;
              size_t used = (size_t)head < size ? (size_t)head : size;
              va_list args;
              va_start(args, fmt);
              int body = vsnprintf(buf + used, size - used, fmt, args);
              va_end(args);
              if (body < 0) return body;
              return head + body;
          }
        harness: |
          int main(void) {
              char buf[64];
              int n = log_msg(buf, sizeof buf, "WARN", "%d players left", 3);
              CHECK_STR("formats the message", buf, "[WARN] 3 players left");
              CHECK_INT("returns the length", n, 21);
              log_msg(buf, sizeof buf, "INFO", "%s planted at %s", "ropz", "B");
              CHECK_STR("string arguments", buf, "[INFO] ropz planted at B");
              char small[10];
              int m = log_msg(small, sizeof small, "ERROR", "disk full");
              CHECK_STR("truncates safely", small, "[ERROR] d");
              CHECK_INT("returns the full length it needed", m, 17);
              char tiny[4];
              int k = log_msg(tiny, sizeof tiny, "ERROR", "x");
              CHECK_STR("even the prefix can be cut short", tiny, "[ER");
              CHECK_INT("full length when the prefix doesn't fit", k, 9);
              return 0;
          }
        require:
          - pattern: "vsnprintf"
            message: Format the message part with `vsnprintf`.
        hints:
          - Write the prefix with `snprintf` first. It returns the prefix length, which may be more than what fit.
          - Continue at `buf + used`, where `used` is the prefix length but at most `size`, and give `vsnprintf` the `size - used` bytes that are left. Return both lengths added together.
        tests: []

  - title: "Challenge: a real command-line tool"
    id: c-program-6
    text: |
      Command-line tools are glued together by scripts and other programs, and that only works because they all follow a few conventions. Writing tools that follow them is part of writing professional C.

      ### stdout and stderr

      A program has two output streams. **stdout** is for the program's actual results; **stderr** is for errors and diagnostics. They're kept separate so that `./tool > results.txt` saves only results, while errors still appear on the screen. Write errors with `fprintf(stderr, ...)`.

      ### Exit codes

      The value `main` returns (or passes to `exit()`) is the **exit code**. `0` means success; anything else means failure, and different numbers can signal different problems (by convention, 2 often means "used incorrectly"). Shell scripts check it: `if ./tool; then ...`, and CI systems fail a build when a step exits nonzero. `<stdlib.h>` names the basics `EXIT_SUCCESS` and `EXIT_FAILURE`.

      ```c run
      #include <stdio.h>
      #include <stdlib.h>

      int check_all(const int *values, int n) {
          int status = EXIT_SUCCESS;
          for (int i = 0; i < n; i++) {
              if (values[i] < 0) {
                  fprintf(stderr, "check: value %d is negative\n", i);
                  status = EXIT_FAILURE;
                  continue;
              }
              printf("value %d ok: %d\n", i, values[i]);
          }
          return status;
      }

      int main(void) {
          int v[] = {3, 8, 5};
          int status = check_all(v, 3);
          printf("done\n");
          return status;
      }
      ```

      ```output
      value 0 ok: 3
      value 1 ok: 8
      value 2 ok: 5
      done
      ```

      ### Keep going, but remember the failure

      A good tool processes everything it can: one missing file shouldn't stop the others from being counted. It reports each problem on stderr as it happens, remembers that something failed (the `status` variable), and returns the failure code **at the end**. Early exit is right only when continuing makes no sense, such as no arguments at all, where you print a **usage** message to stderr.

      The tests on this site check stdout and the exit code separately, just like a script would.

      **Your turn:** write `lines FILE...`, a tool that prints `COUNT NAME` for each file and a final `COUNT total` line. A file that can't be opened prints `lines: cannot open NAME` to **stderr**, is skipped, and makes the program exit with code **1** at the end (after the total). With no arguments at all, print `usage: lines FILE...` to stderr and exit with code **2**.
    seed: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(int argc, char **argv) {

          return EXIT_SUCCESS;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      static long count_lines(FILE *f) {
          long n = 0;
          int c;
          while ((c = fgetc(f)) != EOF)
              if (c == '\n') n++;
          return n;
      }

      int main(int argc, char **argv) {
          if (argc < 2) {
              fprintf(stderr, "usage: lines FILE...\n");
              return 2;
          }
          int status = EXIT_SUCCESS;
          long total = 0;
          for (int i = 1; i < argc; i++) {
              FILE *f = fopen(argv[i], "r");
              if (f == NULL) {
                  fprintf(stderr, "lines: cannot open %s\n", argv[i]);
                  status = EXIT_FAILURE;
                  continue;
              }
              long n = count_lines(f);
              fclose(f);
              printf("%ld %s\n", n, argv[i]);
              total += n;
          }
          printf("%ld total\n", total);
          return status;
      }
    require:
      - pattern: "stderr"
        message: "Error and usage messages go to stderr: `fprintf(stderr, ...)`."
    hints:
      - "No arguments: `fprintf(stderr, \"usage: lines FILE...\\n\"); return 2;`"
      - "Keep an `int status = EXIT_SUCCESS;`. When a file fails, print to stderr, set status to EXIT_FAILURE and `continue`."
      - "Print the total after the loop, then `return status;`"
    tests:
      - args: [ "a.txt", "b.txt" ]
        files:
          a.txt: "one\ntwo\n"
          b.txt: "x\ny\nz\n"
      - args: [ "a.txt", "missing.txt", "b.txt" ]
        files:
          a.txt: "one\n"
          b.txt: "1\n2\n"
        exit: 1
      - args: []
        exit: 2
        allowEmpty: true
      - args: [ "empty.txt" ]
        files:
          empty.txt: ""
        hidden: true
    more:
      - task: |
          Write `head N FILE`, which prints the first `N` lines of `FILE` (fewer if the file is shorter). Errors go to **stderr**:

          - wrong number of arguments: `usage: head N FILE`, exit code 2
          - `N` isn't a whole number of 0 or more: `head: bad count: N`, exit code 2
          - the file can't be opened: `head: cannot open FILE`, exit code 1
        seed: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(int argc, char **argv) {

              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <stdlib.h>

          int main(int argc, char **argv) {
              if (argc != 3) {
                  fprintf(stderr, "usage: head N FILE\n");
                  return 2;
              }
              char *end;
              long n = strtol(argv[1], &end, 10);
              if (end == argv[1] || *end != '\0' || n < 0) {
                  fprintf(stderr, "head: bad count: %s\n", argv[1]);
                  return 2;
              }
              FILE *f = fopen(argv[2], "r");
              if (f == NULL) {
                  fprintf(stderr, "head: cannot open %s\n", argv[2]);
                  return 1;
              }
              long lines = 0;
              int c;
              while (lines < n && (c = fgetc(f)) != EOF) {
                  putchar(c);
                  if (c == '\n') lines++;
              }
              fclose(f);
              return 0;
          }
        require:
          - pattern: "stderr"
            message: Print the error messages to `stderr` with `fprintf(stderr, ...)`.
        hints:
          - Check `argc` first, then parse `N` with `strtol`, then open the file.
