          int main() {
              CHECK_EQ("append succeeds", append_log("match.log", "round 2"), true);
              append_log("match.log", "round 3");
              CHECK_EQ("old lines kept", slurp("match.log"), std::string("round 1\nround 2\nround 3\n"));
              CHECK_EQ("unwritable path fails", append_log("no/such/dir/x.log", "x"), false);
