      - task: |
          Write `operator>>` for `Item` in the format `name:price` (like `awp:4750`), where the name is everything up to the colon. Skip leading whitespace first with `std::ws`, then read the name with `std::getline(in, name, ':')`. The provided `main` prints the total and the most expensive item.
        seed: |
