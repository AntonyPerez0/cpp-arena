        solution: |
          #include <fstream>
          #include <map>
          #include <string>

          std::map<std::string, int> load_config(const std::string& path) {
              std::map<std::string, int> cfg;
              std::ifstream in(path);
              std::string line;
              while (std::getline(in, line)) {
                  if (line.empty() || line[0] == '#') continue;
                  auto eq = line.find('=');
                  if (eq == std::string::npos) continue;
                  cfg[line.substr(0, eq)] = std::stoi(line.substr(eq + 1));
              }
              return cfg;
          }
