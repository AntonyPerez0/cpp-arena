        solution: |
          #include <iostream>
          #include <string>

          struct Item {
              std::string name;
              int price = 0;
          };

          // operator>> here
          std::istream& operator>>(std::istream& in, Item& item) {
              std::string name;
              int price;
              if (in >> std::ws && std::getline(in, name, ':') && in >> price) {
                  item = {name, price};
              } else {
                  in.setstate(std::ios::failbit);
              }
              return in;
          }

          int main() {
              Item it, best;
              long total = 0;
              int n = 0;
              while (std::cin >> it) {
                  total += it.price;
                  if (n == 0 || it.price > best.price) best = it;
                  n++;
              }
              if (n == 0) std::cout << "no items\n";
              else std::cout << n << " items, total " << total << ", top " << best.name << "\n";
          }
        hints:
          - "`in >> std::ws` skips the spaces and newlines between items, so the name doesn't start with one."
          - If the name read or the price read fails, the stream is already failed; `setstate(failbit)` just makes that explicit.
