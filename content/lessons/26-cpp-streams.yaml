          Each line is a CSV row `name,kills,deaths`. Print `name diff` with the kills minus the deaths. Skip lines that don't have all three fields as numbers. Read the name up to the comma with `std::getline(in, name, ',')`, then the numbers with `>>`, reading each comma into a `char`.
