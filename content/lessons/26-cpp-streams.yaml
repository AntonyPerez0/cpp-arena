          #include <string>

          struct Item {
              std::string name;
              int price = 0;
          };

          // operator>> here

          int main() {
              Item it, best;
              long total = 0;
              int n = 0;
              while (std::cin >> it) {
                  total += it.price;
                  if (n == 0 || it.price > best.price) best = it;
