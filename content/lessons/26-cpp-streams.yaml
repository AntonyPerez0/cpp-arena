        solution: |
          #include <iostream>
          #include <sstream>
          #include <string>

          int main() {
              std::string line;
              while (std::getline(std::cin, line)) {
                  std::istringstream in(line);
                  std::string name;
                  int kills, deaths;
                  char comma;
                  if (std::getline(in, name, ',') && in >> kills >> comma >> deaths && comma == ',') {
