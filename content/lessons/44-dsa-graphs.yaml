  - title: "Challenge: union-find"
    id: dsa-graphs-6
    text: |
      Some problems are about groups that keep **merging**: which computers can reach each other as cables are added, which accounts belong to the same person as links are found. Re-running a BFS after every merge would be slow. **Union-find** (also called disjoint set union) answers "are these two in the same group?" and "merge these two groups" in nearly O(1) each.

      Each group is stored as a tree through a `parent` array. The **root** of a tree identifies its group: `find(x)` follows parents up to the root. Two items are in the same group exactly when they have the same root, and merging two groups just points one root at the other.

      ```cpp run
      #include <iostream>
      #include <numeric>
      #include <vector>

      std::vector<int> parent;

      int find(int x) {
          while (parent[x] != x) x = parent[x];     // walk up to the root
          return x;
      }

      void unite(int a, int b) {
          parent[find(a)] = find(b);               // hang one root under the other
      }

      int main() {
          parent.resize(6);
          std::iota(parent.begin(), parent.end(), 0);   // everyone is their own group: 0 1 2 3 4 5
          unite(0, 1);
          unite(2, 3);
          unite(1, 3);                                  // joins {0,1} with {2,3}
          std::cout << (find(0) == find(2)) << (find(0) == find(4)) << "\n";

          int groups = 0;
          for (int i = 0; i < 6; i++) groups += (find(i) == i);   // count roots
          std::cout << groups << " groups\n";
      }
      ```

      ```output
      10
      3 groups
      ```

      The groups are `{0, 1, 2, 3}`, `{4}` and `{5}`.

      ### Making it fast

      This simple version can build long chains, making `find` O(n). Two tricks fix that:

      - **Union by size**: keep a `size` array, and always attach the **smaller** tree under the root of the larger one. Trees then stay shallow (height at most log n).
      - **Path compression**: during `find`, after locating the root, point every node you passed **directly** at it. The next `find` on any of them is a single step.

      ```cpp
      int find(int x) {
          int root = x;
          while (parent[root] != root) root = parent[root];
          while (parent[x] != root) {            // second pass: repoint the path
              int next = parent[x];
              parent[x] = root;
              x = next;
          }
          return root;
      }
      ```

      Together they make each operation effectively constant time. Keep a `groups_` counter that starts at `n` and drops by one on every successful merge, and read a set's size from its root.

      **Your turn:** write class `UnionFind`:

      - `explicit UnionFind(int n)`: n separate sets
      - `int find(int x)` with path compression
      - `bool unite(int a, int b)`: merge; returns false if already in the same set
      - `int groups() const`: number of separate sets
      - `int size_of(int x)`: size of x's set
    seed: |
      #include <numeric>
      #include <utility>
      #include <vector>

      class UnionFind {
      public:
          explicit UnionFind(int n);
          int find(int x);
          bool unite(int a, int b);
          int groups() const;
          int size_of(int x);

      private:

      };
    solution: |
      #include <numeric>
      #include <utility>
      #include <vector>

      class UnionFind {
      public:
          explicit UnionFind(int n);
          int find(int x);
          bool unite(int a, int b);
          int groups() const;
          int size_of(int x);

      private:
          std::vector<int> parent_, size_;
          int groups_;
      };

      UnionFind::UnionFind(int n) : parent_(n), size_(n, 1), groups_(n) {
          std::iota(parent_.begin(), parent_.end(), 0);
      }

      int UnionFind::find(int x) {
          int root = x;
          while (parent_[root] != root) root = parent_[root];
          while (parent_[x] != root) {
              int next = parent_[x];
              parent_[x] = root;
              x = next;
          }
          return root;
      }

      bool UnionFind::unite(int a, int b) {
          a = find(a);
          b = find(b);
          if (a == b) return false;
          if (size_[a] < size_[b]) std::swap(a, b);
          parent_[b] = a;
          size_[a] += size_[b];
          groups_--;
          return true;
      }

      int UnionFind::groups() const { return groups_; }

      int UnionFind::size_of(int x) { return size_[find(x)]; }
    harness: |
      int main() {
          UnionFind uf(6);
          CHECK_EQ("starts separate", uf.groups(), 6);
          CHECK_EQ("unite 0-1", uf.unite(0, 1), true);
          uf.unite(2, 3);
          uf.unite(1, 3);
          CHECK_EQ("already connected", uf.unite(0, 2), false);
          CHECK_EQ("groups", uf.groups(), 3);
          CHECK_EQ("size of 3", uf.size_of(3), 4);
          CHECK("same root", uf.find(0) == uf.find(3));
          CHECK("5 alone", uf.size_of(5) == 1);
          int n = 300000;
          UnionFind big(n);
          for (int i = 0; i + 1 < n; i++) big.unite(i, i + 1);
          CHECK_EQ("one big group", big.groups(), 1);
          long long checks = 0;
          for (int i = 0; i < n; i++) checks += big.find(i) == big.find(0);
          CHECK_EQ("300,000 finds", checks, 300000LL);
      }
    hints:
      - "Store `parent_` (initialized to 0..n-1 with std::iota), `size_` (all 1) and a group counter."
      - "find: walk up to the root, then walk again pointing every node on the path straight at the root."
      - "unite: find both roots; if equal return false. Attach the smaller root under the larger, add sizes, decrement groups."
