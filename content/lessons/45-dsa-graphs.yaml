    solution: |
      #include <numeric>
      #include <utility>
      #include <vector>

      class UnionFind {
      public:
          explicit UnionFind(int n);
          int find(int x);
          bool unite(int a, int b);
          int groups() const;
          int size_of(int x);

      private:
          std::vector<int> parent_, size_;
          int groups_;
      };

      UnionFind::UnionFind(int n) : parent_(n), size_(n, 1), groups_(n) {
          std::iota(parent_.begin(), parent_.end(), 0);
      }

      int UnionFind::find(int x) {
          int root = x;
          while (parent_[root] != root) root = parent_[root];
          while (parent_[x] != root) {
              int next = parent_[x];
              parent_[x] = root;
              x = next;
          }
          return root;
      }

      bool UnionFind::unite(int a, int b) {
          a = find(a);
          b = find(b);
          if (a == b) return false;
          if (size_[a] < size_[b]) std::swap(a, b);
          parent_[b] = a;
          size_[a] += size_[b];
          groups_--;
          return true;
      }

      int UnionFind::groups() const { return groups_; }

      int UnionFind::size_of(int x) { return size_[find(x)]; }
    harness: |
      int main() {
          UnionFind uf(6);
          CHECK_EQ("starts separate", uf.groups(), 6);
          CHECK_EQ("unite 0-1", uf.unite(0, 1), true);
          uf.unite(2, 3);
          uf.unite(1, 3);
          CHECK_EQ("already connected", uf.unite(0, 2), false);
          CHECK_EQ("groups", uf.groups(), 3);
          CHECK_EQ("size of 3", uf.size_of(3), 4);
          CHECK("same root", uf.find(0) == uf.find(3));
          CHECK("5 alone", uf.size_of(5) == 1);
          int n = 300000;
          UnionFind big(n);
          for (int i = 0; i + 1 < n; i++) big.unite(i, i + 1);
          CHECK_EQ("one big group", big.groups(), 1);
          long long checks = 0;
          for (int i = 0; i < n; i++) checks += big.find(i) == big.find(0);
          CHECK_EQ("300,000 finds", checks, 300000LL);
      }
    hints:
      - "Store `parent_` (initialized to 0..n-1 with std::iota), `size_` (all 1) and a group counter."
      - "find: walk up to the root, then walk again pointing every node on the path straight at the root."
      - "unite: find both roots; if equal return false. Attach the smaller root under the larger, add sizes, decrement groups."
