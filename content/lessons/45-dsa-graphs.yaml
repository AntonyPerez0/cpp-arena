          #include <utility>
          #include <vector>

          int min_terms(int n, const std::vector<std::pair<int, int>>& deps) {
              std::vector<std::vector<int>> out(n);
              std::vector<int> indeg(n, 0);
              for (auto [a, b] : deps) {
                  out[a].push_back(b);
                  indeg[b]++;
              }
              std::vector<int> level;
              for (int v = 0; v < n; v++)
                  if (indeg[v] == 0) level.push_back(v);
              int terms = 0, taken = 0;
              while (!level.empty()) {
                  terms++;
                  taken += (int)level.size();
                  std::vector<int> next;
                  for (int u : level)
                      for (int v : out[u])
                          if (--indeg[v] == 0) next.push_back(v);
                  level = std::move(next);
              }
              return taken == n ? terms : -1;
          }
