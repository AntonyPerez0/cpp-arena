                      int nr = r + dr[k], nc = c + dc[k];
                      if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
                      long long nd = d + cost[nr][nc];
                      if (best[nr][nc] == INF || nd < best[nr][nc]) {
                          best[nr][nc] = nd;
                          pq.push({nd, nr, nc});
                      }
                  }
              }
              return best[rows - 1][cols - 1];
