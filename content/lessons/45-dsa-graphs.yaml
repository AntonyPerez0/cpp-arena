        solution: |
          #include <string>
          #include <utility>
          #include <vector>

          int enclosed_cells(const std::vector<std::string>& grid) {
              int rows = (int)grid.size();
              if (rows == 0) return 0;
              int cols = (int)grid[0].size();
              std::vector<std::vector<char>> seen(rows, std::vector<char>(cols, 0));
              std::vector<std::pair<int, int>> stack;
              auto visit = [&](int r, int c) {
                  if (r < 0 || c < 0 || r >= rows || c >= cols) return;
                  if (grid[r][c] != '.' || seen[r][c]) return;
                  seen[r][c] = 1;
                  stack.push_back({r, c});
              };
              for (int r = 0; r < rows; r++) {
                  visit(r, 0);
                  visit(r, cols - 1);
              }
              for (int c = 0; c < cols; c++) {
                  visit(0, c);
                  visit(rows - 1, c);
              }
              while (!stack.empty()) {
                  auto [r, c] = stack.back();
                  stack.pop_back();
                  visit(r + 1, c);
                  visit(r - 1, c);
                  visit(r, c + 1);
                  visit(r, c - 1);
              }
              int count = 0;
              for (int r = 0; r < rows; r++)
                  for (int c = 0; c < cols; c++)
                      if (grid[r][c] == '.' && !seen[r][c]) count++;
              return count;
          }
