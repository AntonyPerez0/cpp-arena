          CHECK_EQ("diamond", build_order(4, {{0, 1}, {0, 2}, {1, 3}, {2, 3}}), (std::vector<int>{0, 1, 2, 3}));
          CHECK_EQ("tie-break", build_order(4, {{3, 0}, {2, 0}}), (std::vector<int>{1, 2, 3, 0}));
          CHECK("cycle gives empty", build_order(3, {{0, 1}, {1, 2}, {2, 0}}).empty());
      }
