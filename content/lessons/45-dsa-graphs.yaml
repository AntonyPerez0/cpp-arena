          struct Edge {
              int from, to;
              long long cost;
          };

          std::vector<int> route(int n, const std::vector<Edge>& edges, int src, int dst) {
              std::vector<std::vector<std::pair<int, long long>>> adj(n);
              for (const auto& e : edges) adj[e.from].push_back({e.to, e.cost});
              std::vector<long long> dist(n, -1);
              std::vector<int> prev(n, -1);
