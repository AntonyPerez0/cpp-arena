          long long cheapest_path(const std::vector<std::vector<int>>& cost) {
              int rows = (int)cost.size(), cols = (int)cost[0].size();
              const long long INF = -1;
              std::vector<std::vector<long long>> best(rows, std::vector<long long>(cols, INF));
