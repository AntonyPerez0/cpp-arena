          #include <algorithm>
          #include <string>
          #include <utility>
          #include <vector>

          int largest_island(std::vector<std::string> grid) {
              int rows = (int)grid.size(), best = 0;
              const int dr[] = {1, -1, 0, 0}, dc[] = {0, 0, 1, -1};
              for (int r = 0; r < rows; r++)
                  for (int c = 0; c < (int)grid[r].size(); c++) {
                      if (grid[r][c] != '#') continue;
                      int size = 0;
                      std::vector<std::pair<int, int>> stack = {{r, c}};
                      grid[r][c] = '.';
                      while (!stack.empty()) {
                          auto [cr, cc] = stack.back();
                          stack.pop_back();
                          size++;
