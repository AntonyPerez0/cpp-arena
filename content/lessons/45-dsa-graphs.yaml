      - task: |
          Write `int count_components(int n, const std::vector<std::pair<int, int>>& edges)` for an undirected graph using union-find: start with `n` groups and take one away for every edge that joins two different groups. Write a small `find` with path compression.
        seed: |
          #include <numeric>
          #include <utility>
          #include <vector>

          int count_components(int n, const std::vector<std::pair<int, int>>& edges) {

          }
        solution: |
          #include <numeric>
          #include <utility>
          #include <vector>

          static int find(std::vector<int>& parent, int x) {
              while (parent[x] != x) {
                  parent[x] = parent[parent[x]];
                  x = parent[x];
              }
              return x;
          }

          int count_components(int n, const std::vector<std::pair<int, int>>& edges) {
              std::vector<int> parent(n);
              std::iota(parent.begin(), parent.end(), 0);
              int groups = n;
              for (auto [a, b] : edges) {
                  int ra = find(parent, a), rb = find(parent, b);
                  if (ra != rb) {
                      parent[ra] = rb;
                      groups--;
                  }
              }
              return groups;
          }
        harness: |
          int main() {
              CHECK_EQ("two groups and a loner", count_components(5, {{0, 1}, {1, 2}, {3, 4}}), 2);
              CHECK_EQ("no edges", count_components(4, {}), 4);
              CHECK_EQ("a repeated edge changes nothing", count_components(3, {{0, 1}, {1, 0}}), 2);
              std::vector<std::pair<int, int>> e;
              for (int i = 0; i + 2 < 300000; i += 2) e.push_back({i, i + 2});
              CHECK_EQ("even and odd chains", count_components(300000, e), 150001);
          }
        hints:
          - "Path halving (`parent[x] = parent[parent[x]]` while walking up) keeps the trees flat without recursion."
      - task: |
          **Kruskal's algorithm** finds a minimum spanning tree: sort the edges by weight, then take each edge whose ends are in different union-find groups. Write `long long mst_weight(int n, std::vector<WEdge> edges)`, the total weight of the tree, or -1 if the graph isn't connected.
