        solution: |
          #include <algorithm>
          #include <numeric>
          #include <vector>

          struct WEdge {
              int a, b;
              long long w;
          };

          static int find(std::vector<int>& parent, int x) {
              while (parent[x] != x) {
                  parent[x] = parent[parent[x]];
                  x = parent[x];
              }
              return x;
          }

          long long mst_weight(int n, std::vector<WEdge> edges) {
              std::sort(edges.begin(), edges.end(), [](const WEdge& x, const WEdge& y) { return x.w < y.w; });
              std::vector<int> parent(n);
              std::iota(parent.begin(), parent.end(), 0);
              long long total = 0;
              int used = 0;
              for (const auto& e : edges) {
                  int ra = find(parent, e.a), rb = find(parent, e.b);
                  if (ra == rb) continue;
                  parent[ra] = rb;
                  total += e.w;
                  used++;
              }
              return used == n - 1 ? total : -1;
          }
        harness: |
          int main() {
              std::vector<WEdge> e = {{0, 1, 4}, {0, 2, 1}, {1, 2, 2}, {1, 3, 5}, {2, 3, 8}};
              CHECK_EQ("1 + 2 + 5", mst_weight(4, e), 8LL);
              CHECK_EQ("disconnected", mst_weight(3, {{0, 1, 1}}), -1LL);
              CHECK_EQ("one vertex", mst_weight(1, {}), 0LL);
              std::vector<WEdge> big;
              for (int i = 0; i + 1 < 100000; i++) {
                  big.push_back({i, i + 1, 10});
                  big.push_back({0, i + 1, 1000});
              }
              CHECK_EQ("100,000 vertices", mst_weight(100000, big), 999990LL);
          }
        hints:
          - "A tree on `n` vertices has exactly `n - 1` edges; if you took fewer, the graph wasn't connected."
