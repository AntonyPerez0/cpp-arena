      #include <queue>
      #include <utility>
      #include <vector>

      std::vector<int> build_order(int n, const std::vector<std::pair<int, int>>& deps) {

      }
    solution: |
      #include <functional>
      #include <queue>
      #include <utility>
      #include <vector>

      std::vector<int> build_order(int n, const std::vector<std::pair<int, int>>& deps) {
          std::vector<std::vector<int>> out(n);
          std::vector<int> indeg(n, 0);
          for (auto [a, b] : deps) {
              out[a].push_back(b);
              indeg[b]++;
          }
          std::priority_queue<int, std::vector<int>, std::greater<int>> ready;
          for (int v = 0; v < n; v++)
              if (indeg[v] == 0) ready.push(v);
          std::vector<int> order;
          while (!ready.empty()) {
              int v = ready.top();
              ready.pop();
              order.push_back(v);
              for (int w : out[v])
                  if (--indeg[w] == 0) ready.push(w);
          }
          if (static_cast<int>(order.size()) != n) return {};
          return order;
      }
    harness: |
