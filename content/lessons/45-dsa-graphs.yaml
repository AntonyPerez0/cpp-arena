          A lake is open water (`.`) that can't reach the edge of the map. Write `int enclosed_cells(const std::vector<std::string>& grid)`: flood fill from every `.` on the border, then count the `.` cells that were never reached. Moves go up, down, left and right; `#` is land.
        seed: |
