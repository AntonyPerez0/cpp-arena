          int count_reachable(const std::vector<std::string>& grid, int r, int c, int k) {
              int rows = (int)grid.size(), cols = (int)grid[0].size();
              std::vector<std::vector<int>> dist(rows, std::vector<int>(cols, -1));
              std::queue<std::pair<int, int>> q;
