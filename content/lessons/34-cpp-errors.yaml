id: cpp-errors
title: Handling errors
lang: cpp
phase: "C++: Modern and Advanced"
summary: How to report failure without crashing. assert for bugs, error codes and optional for expected failures, a Result type, and how exceptions fit in.
steps:
  - title: Bugs vs expected failures
    id: cpp-errors-1
    text: |
      Every real program meets failure. The first skill is telling apart two very different kinds:

      1. **Bugs**: a broken assumption in *your own* code. A function that requires a positive size gets a negative one; an index that "can't" be out of range is. Nothing sensible can happen next, and the fix is to change the code.
      2. **Expected failures**: things that go wrong in normal use. The user types letters where a number goes, a file is missing, a player isn't found. These aren't bugs, so the program must **handle** them and keep going.

      ### assert: tripwires for bugs

      `assert(condition)` from `<cassert>` checks something that must **always** be true. If it's false, the program stops immediately and prints the file, line and condition that failed, which points you straight at the bug.

      ```cpp run
      #include <cassert>
      #include <iostream>
      #include <vector>

      int middle(const std::vector<int>& sorted) {
          assert(!sorted.empty());          // callers must never pass an empty vector
          return sorted[sorted.size() / 2];
      }

      int main() {
          std::cout << middle({1, 3, 7, 9, 12}) << "\n";
          std::cout << middle({4}) << "\n";
          // middle({});  would stop the program with something like:
          //   main.cpp:6: int middle(...): Assertion `!sorted.empty()' failed.
      }
      ```

      ```output
      7
      4
      ```

      - Asserts are for **programmer** mistakes. Never use them to check user input: a user typing a bad value shouldn't crash the program.
      - Release builds often define `NDEBUG`, which removes every `assert`. So never put code with side effects inside one: in `assert(save_file() == 0)`, the file would never be saved in a release build. Call the function first, then assert on its result.

      ### Exceptions, and when code avoids them

      **Exceptions** (`throw`/`try`/`catch`) are standard C++'s general tool for failure: a `throw` unwinds the stack to the nearest matching `catch`, running destructors on the way (RAII again!).

      ```cpp
      try {
          int x = std::stoi("abc");   // throws std::invalid_argument
      } catch (const std::exception& e) {
          std::cout << e.what();
      }
      ```

      Exceptions work in this site's compiler, and the exceptions step later in this module has you throw and catch them. But many real codebases turn them off (`-fno-exceptions`) or avoid them by policy: games, embedded systems and some large companies (Google's C++ style guide, for example, doesn't use them), usually for predictable performance or binary size. So the next steps first cover the exception-free patterns they use: status codes, `std::optional` and a `Result` type. Knowing both styles, and when each fits, is what professionals need.

      **Your turn:** add an `assert` that `n` is positive. With a valid call the program prints `ok`.
    fill: |
      #include <[[cassert]]>
      #include <iostream>

      int average(int total, int n) {
          [[assert]](n > 0);
          return total / n;
      }

      int main() {
          std::cout << (average(90, 3) == 30 ? "ok" : "bad") << "\n";
      }
    hints:
      - "The header is `<cassert>` and the macro is `assert`."
    tests:
      - expect: "ok"
    more:
      - task: |
          `static_assert` checks at **compile time** and `assert` checks while the program runs. Complete both: the build must refuse machines with ints smaller than 4 bytes, and `at` must catch an index outside the vector. The program prints `15`.
        fill: |
          #include <cassert>
          #include <iostream>
          #include <vector>

          [[static_assert]](sizeof(int) >= 4, "this code needs 32-bit ints");

          int at(const std::vector<int>& v, int i) {
              assert(i >= 0 && i [[<]] (int)v.size());
              return v[i];
          }

          int main() {
              std::vector<int> v = {4, 8, 15};
              std::cout << at(v, 2) << "\n";
          }
        hints:
          - "`static_assert(condition, \"message\")` stops the build when the condition is false."
          - "Valid indexes go from 0 up to, but not including, the size."
        tests:
          - expect: "15"
      - task: |
          A handy trick: `assert(cond && "message")`. The string is always true, so it doesn't change the check, but it shows up in the failure report. Add the precondition that `whole` is positive, and the postcondition that the result is at most 100. The program prints `75`.
        fill: |
          #include <cassert>
          #include <iostream>

          int percent(int part, int whole) {
              assert(whole > 0 [[&&]] "whole must be positive");
              int p = part * 100 / whole;
              assert(p >= 0 && p <= [[100]] && "part must not exceed whole");
              return p;
          }

          int main() {
              std::cout << percent(3, 4) << "\n";
          }
        hints:
          - "Join the condition and the message with `&&`."
          - "A percentage of a part that fits inside the whole is between 0 and 100."
        tests:
          - expect: "75"

  - title: Status codes
    id: cpp-errors-2
    text: |
      The oldest approach, straight from C: the function **returns a status** (did it work?), and delivers the actual result through a **reference parameter**.

      ```cpp run
      #include <iostream>
      #include <string>

      [[nodiscard]] bool withdraw(int& balance, int amount) {
          if (amount <= 0 || amount > balance) return false;   // refuse, change nothing
          balance -= amount;
          return true;
      }

      int main() {
          int balance = 100;
          for (int amount : {30, 500, -5, 70}) {
              if (withdraw(balance, amount)) {
                  std::cout << "took " << amount << ", left " << balance << "\n";
              } else {
                  std::cout << "refused " << amount << "\n";
              }
          }
          // withdraw(balance, 10);   // warning: ignoring return value declared with 'nodiscard'
      }
      ```

      ```output
      took 30, left 70
      refused 500
      refused -5
      took 70, left 0
      ```

      ### How it works

      - The return value answers "did it work?". The **real** output (the new balance here) goes through the `int&` parameter.
      - On failure, the function changes **nothing**. Callers can rely on that: a failed withdrawal leaves the balance intact.
      - `[[nodiscard]]` makes the compiler warn if a caller ignores the result. Without it, `withdraw(balance, 500);` would silently fail, and the caller would carry on believing the money was taken.

      ### Strengths and weaknesses

      It's simple, fast and works everywhere, including C. But the caller must remember to check, the result has to be declared before the call, and a plain `bool` can't say **why** it failed. The next steps improve on each of those.

      ### Your task

      Division by zero is the failure case: return `false` and leave `out` alone. Otherwise store `a / b` in `out` and return `true`. Add `[[nodiscard]]` before the return type.

      **Your turn:** write `[[nodiscard]] bool divide(int a, int b, int& out)` that returns false for division by zero and otherwise stores `a / b` in `out`.
    seed: |
      bool divide(int a, int b, int& out) {

      }
    solution: |
      [[nodiscard]] bool divide(int a, int b, int& out) {
          if (b == 0) return false;
          out = a / b;
          return true;
      }
    harness: |
      int main() {
          int r = -1;
          CHECK("10 / 2 succeeds", divide(10, 2, r));
          CHECK_EQ("result", r, 5);
          r = 99;
          CHECK("5 / 0 fails", !divide(5, 0, r));
          CHECK_EQ("out unchanged on failure", r, 99);
      }
    hints:
      - "Return `false` first if `b == 0`."
      - "Otherwise `out = a / b; return true;`. Put `[[nodiscard]]` before the return type."
    more:
      - task: |
          An `enum class` makes a better status code than `bool`, because it says **why** something failed. Write `[[nodiscard]] BuyError buy(const std::string& item, int& money)`. Prices: `kit` 400 and `helmet` 350. Unknown items give `UnknownItem`, too little money gives `NotEnoughMoney`, and a purchase subtracts the price and returns `None`.
        seed: |
          #include <string>

          enum class BuyError { None, UnknownItem, NotEnoughMoney };

          BuyError buy(const std::string& item, int& money) {

          }
        solution: |
          #include <string>

          enum class BuyError { None, UnknownItem, NotEnoughMoney };

          [[nodiscard]] BuyError buy(const std::string& item, int& money) {
              int price;
              if (item == "kit") price = 400;
              else if (item == "helmet") price = 350;
              else return BuyError::UnknownItem;
              if (money < price) return BuyError::NotEnoughMoney;
              money -= price;
              return BuyError::None;
          }
        require:
          - pattern: "\\[\\[nodiscard\\]\\]"
            message: "Mark `buy` `[[nodiscard]]` so callers can't ignore a failure."
        harness: |
          int main() {
              int money = 700;
              CHECK("buy kit", buy("kit", money) == BuyError::None);
              CHECK_EQ("money after kit", money, 300);
              CHECK("helmet too expensive", buy("helmet", money) == BuyError::NotEnoughMoney);
              CHECK_EQ("money unchanged", money, 300);
              CHECK("unknown", buy("jetpack", money) == BuyError::UnknownItem);
              money = 350;
              CHECK("exact money", buy("helmet", money) == BuyError::None);
              CHECK_EQ("broke", money, 0);
          }
        hints:
          - "Return `BuyError::UnknownItem` early, then check the money, and only then change it."
      - task: |
          Write `[[nodiscard]] int parse_port(const std::string& s, int& out)` in the C style, returning a code: `0` success (store the port in `out`), `1` empty string, `2` a non-digit character, `3` outside 1 to 65535. Leave `out` alone on failure.
        seed: |
          #include <string>

          int parse_port(const std::string& s, int& out) {

          }
        solution: |
          #include <string>

          [[nodiscard]] int parse_port(const std::string& s, int& out) {
              if (s.empty()) return 1;
              long value = 0;
              for (char c : s) {
                  if (c < '0' || c > '9') return 2;
                  value = value * 10 + (c - '0');
                  if (value > 65535) return 3;
              }
              if (value < 1) return 3;
              out = (int)value;
              return 0;
          }
        require:
          - pattern: "\\[\\[nodiscard\\]\\]"
            message: "Mark `parse_port` `[[nodiscard]]`."
        harness: |
          int main() {
              int port = -1;
              CHECK_EQ("8080", parse_port("8080", port), 0);
              CHECK_EQ("stored", port, 8080);
              CHECK_EQ("empty", parse_port("", port), 1);
              CHECK_EQ("letters", parse_port("80a", port), 2);
              CHECK_EQ("minus sign", parse_port("-1", port), 2);
              CHECK_EQ("zero", parse_port("0", port), 3);
              CHECK_EQ("too big", parse_port("65536", port), 3);
              CHECK_EQ("huge", parse_port("99999999999999999999", port), 3);
              CHECK_EQ("unchanged after failures", port, 8080);
              CHECK_EQ("max", parse_port("65535", port), 0);
          }
        hints:
          - "Stop as soon as the value passes 65535, so a very long string can't overflow."
          - "Only write to `out` once every check has passed."

  - title: optional for "maybe"
    id: cpp-errors-3
    text: |
      When the only possible failure is "there's no result", `std::optional` says it right in the return type: the function returns **either** a value **or** nothing. There's no separate out-parameter, and the empty case is part of the type, so callers see it and check it (reading an empty optional with `*` is still a bug).

      ```cpp run
      #include <iostream>
      #include <map>
      #include <optional>
      #include <string>

      std::optional<std::string> phone_of(const std::map<std::string, std::string>& book, const std::string& name) {
          auto it = book.find(name);
          if (it == book.end()) return std::nullopt;
          return it->second;
      }

      int main() {
          std::map<std::string, std::string> book = {{"ada", "555-0101"}, {"alan", "555-0199"}};
          for (const char* who : {"alan", "grace"}) {
              auto p = phone_of(book, who);
              std::cout << who << ": " << p.value_or("unknown") << "\n";
          }
      }
      ```

      ```output
      alan: 555-0199
      grace: unknown
      ```

      ### Compared with a status code

      | Question | status code | `std::optional` |
      |---|---|---|
      | Result delivered | out-parameter | return value |
      | Caller forgets to check | wrong data used silently | the missing case is spelled out in the type, so it's hard to forget |
      | Says why it failed | no | no |

      ### Why not return -1?

      For an index, `-1` is the classic "not found" value, but the return type `std::size_t` is **unsigned**, so `-1` would become a huge number that looks like a valid index. `std::optional<std::size_t>` avoids the whole problem.

      For your search: loop over the indexes, return `i` on a match, and return `std::nullopt` after the loop.

      **Your turn:** write `std::optional<std::size_t> find_player(const std::vector<std::string>& team, const std::string& name)` returning the index or `std::nullopt`.
    seed: |
      #include <optional>
      #include <string>
      #include <vector>

      std::optional<std::size_t> find_player(const std::vector<std::string>& team, const std::string& name) {

      }
    solution: |
      #include <optional>
      #include <string>
      #include <vector>

      std::optional<std::size_t> find_player(const std::vector<std::string>& team, const std::string& name) {
          for (std::size_t i = 0; i < team.size(); i++) {
              if (team[i] == name) return i;
          }
          return std::nullopt;
      }
    harness: |
      int main() {
          std::vector<std::string> t = {"karrigan", "rain", "ropz", "broky", "frozen"};
          auto a = find_player(t, "ropz");
          CHECK("ropz found", a.has_value());
          CHECK_EQ("ropz index", *a, 2);
          CHECK("missing -> nullopt", !find_player(t, "s1mple"));
          CHECK("empty team", !find_player({}, "x"));
      }
    hints:
      - "Loop over the indexes and `return i;` on a match (it converts to optional)."
      - "After the loop, `return std::nullopt;`."
    more:
      - task: |
          Write `std::optional<std::string> team_of(const std::map<std::string, std::string>& roster, const std::string& player)` returning the player's team, or `std::nullopt` if the player isn't listed.
        seed: |
          #include <map>
          #include <optional>
          #include <string>

          std::optional<std::string> team_of(const std::map<std::string, std::string>& roster, const std::string& player) {

          }
        solution: |
          #include <map>
          #include <optional>
          #include <string>

          std::optional<std::string> team_of(const std::map<std::string, std::string>& roster, const std::string& player) {
              auto it = roster.find(player);
              if (it == roster.end()) return std::nullopt;
              return it->second;
          }
        harness: |
          #include <map>
          int main() {
              std::map<std::string, std::string> r = {{"ropz", "FaZe"}, {"b1t", "NaVi"}};
              CHECK_EQ("ropz", team_of(r, "ropz").value_or("?"), std::string("FaZe"));
              CHECK("missing", !team_of(r, "s1mple").has_value());
              CHECK_EQ("value_or", team_of(r, "zywoo").value_or("free agent"), std::string("free agent"));
          }
        hints:
          - "Use `find`, not `[]`: on a `const` map `[]` isn't allowed, and it would insert a missing key anyway."
      - task: |
          Write `std::optional<std::string> next_player(const std::vector<std::string>& team, const std::string& name)` returning the player after `name`, wrapping from the last back to the first. Return `std::nullopt` if `name` isn't in the team.
        seed: |
          #include <optional>
          #include <string>
          #include <vector>

          std::optional<std::string> next_player(const std::vector<std::string>& team, const std::string& name) {

          }
        solution: |
          #include <optional>
          #include <string>
          #include <vector>

          std::optional<std::string> next_player(const std::vector<std::string>& team, const std::string& name) {
              for (std::size_t i = 0; i < team.size(); i++) {
                  if (team[i] == name) return team[(i + 1) % team.size()];
              }
              return std::nullopt;
          }
        harness: |
          int main() {
              std::vector<std::string> t = {"karrigan", "rain", "ropz"};
              CHECK_EQ("after karrigan", next_player(t, "karrigan").value_or("?"), std::string("rain"));
              CHECK_EQ("wraps around", next_player(t, "ropz").value_or("?"), std::string("karrigan"));
              CHECK("missing", !next_player(t, "jks"));
              CHECK_EQ("alone", next_player({"solo"}, "solo").value_or("?"), std::string("solo"));
              CHECK("empty team", !next_player({}, "x"));
          }
        hints:
          - "The index after `i`, wrapping around, is `(i + 1) % team.size()`."

  - title: A Result type
    id: cpp-errors-4
    text: |
      `optional` says **that** something failed, but not **why**. When there are several ways to fail, the caller (and the user reading an error message) needs to know which one happened. A small **Result** type carries either a value or an error description. C++23 standardizes the idea as `std::expected<T, E>`; you'll often see hand-written versions like this one.

      ```cpp run
      #include <iostream>
      #include <optional>
      #include <string>

      struct AgeResult {
          std::optional<int> value;
          std::string error;
          bool ok() const { return value.has_value(); }
      };

      AgeResult parse_age(const std::string& s) {
          if (s.empty()) return {std::nullopt, "empty"};
          int v = 0;
          for (char c : s) {
              if (c < '0' || c > '9') return {std::nullopt, "not a number"};
              v = v * 10 + (c - '0');
              if (v > 150) return {std::nullopt, "unrealistic"};
          }
          return {v, ""};
      }

      int main() {
          for (const char* in : {"42", "", "4x", "999"}) {
              AgeResult r = parse_age(in);
              if (r.ok()) std::cout << "'" << in << "' -> " << *r.value << "\n";
              else std::cout << "'" << in << "' -> error: " << r.error << "\n";
          }
      }
      ```

      ```output
      '42' -> 42
      '' -> error: empty
      '4x' -> error: not a number
      '999' -> error: unrealistic
      ```

      ### How it works

      - Each failure returns immediately with its own message. The checks run **in order**, so decide which error wins when several apply. Here an empty string is reported as "empty", not "not a number".
      - `return {v, ""};` builds the struct from braces: first the optional, then the error.
      - `v > 150` is checked **inside** the loop, as soon as the number gets too big. Checking only at the end could overflow `int` on a very long string of digits first.

      ### Your task: money

      The same structure, in this order: check the leading `$` (also catches the empty string), then check there's at least one character after it, then check that every character after it is a digit while building the value, then compare with the cap. Checking the cap inside the loop protects you from overflow on inputs like `$99999999999`.

      **Your turn:** write `Result parse_money(const std::string& s)` for amounts like `"$2700"`:

      - no leading `$` gives error `"missing $"`
      - nothing after the `$`, or a non-digit character, gives `"not a number"`
      - more than 16000 gives `"over the cap"`
      - otherwise the value
    seed: |
      #include <optional>
      #include <string>

      struct Result {
          std::optional<int> value;
          std::string error;
          bool ok() const { return value.has_value(); }
      };

      Result parse_money(const std::string& s) {

      }
    solution: |
      #include <optional>
      #include <string>

      struct Result {
          std::optional<int> value;
          std::string error;
          bool ok() const { return value.has_value(); }
      };

      Result parse_money(const std::string& s) {
          if (s.empty() || s[0] != '$') return {std::nullopt, "missing $"};
          if (s.size() == 1) return {std::nullopt, "not a number"};
          long long v = 0;
          for (std::size_t i = 1; i < s.size(); i++) {
              if (s[i] < '0' || s[i] > '9') return {std::nullopt, "not a number"};
              if (v <= 16000) v = v * 10 + (s[i] - '0');
          }
          if (v > 16000) return {std::nullopt, "over the cap"};
          return {static_cast<int>(v), ""};
      }
    harness: |
      int main() {
          auto a = parse_money("$2700");
          CHECK("$2700 ok", a.ok() && *a.value == 2700);
          CHECK_EQ("2700 without $", parse_money("2700").error, std::string("missing $"));
          CHECK_EQ("$", parse_money("$").error, std::string("not a number"));
          CHECK_EQ("$12a", parse_money("$12a").error, std::string("not a number"));
          CHECK_EQ("$20000", parse_money("$20000").error, std::string("over the cap"));
          CHECK_EQ("$99999999999", parse_money("$99999999999").error, std::string("over the cap"));
          CHECK("$16000 ok", parse_money("$16000").ok());
          CHECK_EQ("empty", parse_money("").error, std::string("missing $"));
      }
    hints:
      - "Return a Result with braces: `return {std::nullopt, \"missing $\"};` or `return {value, \"\"};`."
      - Check the `$` first, then that there is at least one character after it, then parse digits.
      - Stop growing the number once it passes 16000, otherwise very long inputs overflow an int.
    more:
      - task: |
          Write `Result parse_time(const std::string& s)` for times like `"1:45"` (minutes, a colon, then two-digit seconds), returning the total in seconds:

          - no `:` gives `"missing :"`
          - empty minutes, seconds that aren't exactly two digits, or any non-digit gives `"not a number"`
          - seconds of 60 or more give `"seconds must be under 60"`
        seed: |
          #include <optional>
          #include <string>

          struct Result {
              std::optional<int> value;
              std::string error;
              bool ok() const { return value.has_value(); }
          };

          Result parse_time(const std::string& s) {

          }
        solution: |
          #include <optional>
          #include <string>

          struct Result {
              std::optional<int> value;
              std::string error;
              bool ok() const { return value.has_value(); }
          };

          static bool digits(const std::string& s) {
              if (s.empty()) return false;
              for (char c : s)
                  if (c < '0' || c > '9') return false;
              return true;
          }

          Result parse_time(const std::string& s) {
              auto colon = s.find(':');
              if (colon == std::string::npos) return {std::nullopt, "missing :"};
              std::string m = s.substr(0, colon), sec = s.substr(colon + 1);
              if (!digits(m) || m.size() > 4 || sec.size() != 2 || !digits(sec)) return {std::nullopt, "not a number"};
              int seconds = std::stoi(sec);
              if (seconds >= 60) return {std::nullopt, "seconds must be under 60"};
              return {std::stoi(m) * 60 + seconds, ""};
          }
        harness: |
          int main() {
              auto a = parse_time("1:45");
              CHECK("1:45 ok", a.ok() && *a.value == 105);
              CHECK("0:07", parse_time("0:07").value == 7);
              CHECK_EQ("no colon", parse_time("145").error, std::string("missing :"));
              CHECK_EQ("one-digit seconds", parse_time("1:5").error, std::string("not a number"));
              CHECK_EQ("empty minutes", parse_time(":30").error, std::string("not a number"));
              CHECK_EQ("letters", parse_time("a:30").error, std::string("not a number"));
              CHECK_EQ("60 seconds", parse_time("2:60").error, std::string("seconds must be under 60"));
              CHECK_EQ("empty", parse_time("").error, std::string("missing :"));
          }
        hints:
          - "Split at the colon, then check both parts before converting anything."
          - "`return {std::nullopt, \"missing :\"};` builds a failed Result; `return {105, \"\"};` a successful one."
      - task: |
          Make `Result` a **template** so it can carry any type. Write `template <typename T> struct Result` with `std::optional<T> value`, `std::string error`, `bool ok() const`, and two static helpers, `ok_with(T v)` and `fail(std::string e)`. Then write `Result<int> checked_div(int a, int b)`: `"division by zero"` for `b == 0`, otherwise `a / b`.
        seed: |
          #include <optional>
          #include <string>

          // template <typename T> struct Result here

          Result<int> checked_div(int a, int b) {

          }
        solution: |
          #include <optional>
          #include <string>
          #include <utility>

          // template <typename T> struct Result here
          template <typename T>
          struct Result {
              std::optional<T> value;
              std::string error;
              bool ok() const { return value.has_value(); }
              static Result ok_with(T v) { return Result{std::move(v), ""}; }
              static Result fail(std::string e) { return Result{std::nullopt, std::move(e)}; }
          };

          Result<int> checked_div(int a, int b) {
              if (b == 0) return Result<int>::fail("division by zero");
              return Result<int>::ok_with(a / b);
          }
        harness: |
          int main() {
              auto a = checked_div(17, 5);
              CHECK("17 / 5 ok", a.ok());
              CHECK_EQ("value", *a.value, 3);
              auto b = checked_div(1, 0);
              CHECK("1 / 0 fails", !b.ok());
              CHECK_EQ("error", b.error, std::string("division by zero"));
              auto s = Result<std::string>::ok_with("gg");
              CHECK_EQ("works for strings", *s.value, std::string("gg"));
              CHECK("fail has no value", !Result<double>::fail("x").ok());
          }
        hints:
          - "Inside the template, `Result` alone means `Result<T>`."
          - "`static Result fail(std::string e) { return Result{std::nullopt, e}; }`"

  - title: Passing errors up
    id: cpp-errors-5
    text: |
      Real programs are layers: `main` calls `load_config`, which calls `parse_line`, which calls `parse_int`. When the bottom layer fails, each layer above has two honest choices:

      1. **Handle it**: use a default, retry, skip the item, tell the user.
      2. **Pass it up** unchanged, usually with an early `return`.

      The one dishonest choice is **swallowing** it: returning a made-up value as if nothing went wrong. That's how bugs travel far from where they started.

      ```cpp run
      #include <iostream>
      #include <optional>
      #include <string_view>

      std::optional<int> digit(char c) {
          if (c < '0' || c > '9') return std::nullopt;
          return c - '0';
      }

      // Sum of the digits in a code like "4-7-1". Any bad character fails the whole thing.
      std::optional<int> checksum(std::string_view code) {
          int total = 0;
          for (std::size_t i = 0; i < code.size(); i += 2) {
              auto d = digit(code[i]);
              if (!d) return std::nullopt;             // pass the failure up
              total += *d;
              if (i + 1 < code.size() && code[i + 1] != '-') return std::nullopt;
          }
          return total;
      }

      int main() {
          for (std::string_view c : {"4-7-1", "4-x-1", "9"}) {
              auto sum = checksum(c);
              if (sum) std::cout << c << " -> " << *sum << "\n";
              else std::cout << c << " -> invalid\n";   // main handles it: tell the user
          }
      }
      ```

      ```output
      4-7-1 -> 12
      4-x-1 -> invalid
      9 -> 9
      ```

      ### Reading the layers

      - `digit` knows **what** failed but not what to do about it, so it just reports.
      - `checksum` can't produce a meaningful sum from a bad digit, so it passes the failure up with `return std::nullopt;` as soon as it sees one.
      - `main` is where a decision can be made: it tells the user.

      ### Your task: summing comma-separated values

      Split the view at each comma. A loop with `find(',')` works well:

      ```cpp
      while (true) {
          auto comma = s.find(',');
          std::string_view part = s.substr(0, comma);   // up to the comma, or everything
          // ... parse part, pass failure up ...
          if (comma == std::string_view::npos) break;
          s.remove_prefix(comma + 1);
      }
      ```

      An empty part (as in `"3,,4"` or `""`) fails in `parse_int`, which is correct: pass it up.

      **Your turn:** `parse_int` is written for you. Write `std::optional<int> sum_csv(std::string_view s)` that sums comma-separated integers like `"3,4,-2"`. If **any** part fails to parse, the whole sum fails.
    seed: |
