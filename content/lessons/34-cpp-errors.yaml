        solution: |
          #include <optional>
          #include <string_view>
          #include <vector>

          std::optional<int> parse_int(std::string_view s) {
              if (s.empty()) return std::nullopt;
              bool neg = s[0] == '-';
              if (neg) s.remove_prefix(1);
              if (s.empty() || s.size() > 9) return std::nullopt;
              int v = 0;
              for (char c : s) {
                  if (c < '0' || c > '9') return std::nullopt;
                  v = v * 10 + (c - '0');
              }
              return neg ? -v : v;
          }

          std::optional<int> eval_rpn(std::string_view expr) {
              std::vector<long long> stack;
              while (true) {
                  auto space = expr.find(' ');
                  std::string_view tok = expr.substr(0, space);
                  if (tok == "+" || tok == "-" || tok == "*") {
                      if (stack.size() < 2) return std::nullopt;
                      long long b = stack.back();
                      stack.pop_back();
                      long long a = stack.back();
                      stack.pop_back();
                      stack.push_back(tok == "+" ? a + b : tok == "-" ? a - b : a * b);
                  } else {
                      auto n = parse_int(tok);
                      if (!n) return std::nullopt;
                      stack.push_back(*n);
                  }
                  if (space == std::string_view::npos) break;
                  expr.remove_prefix(space + 1);
              }
              if (stack.size() != 1) return std::nullopt;
              return (int)stack.back();
          }
        harness: |
          int main() {
              CHECK_EQ("3 4 + 2 *", eval_rpn("3 4 + 2 *").value_or(-999), 14);
              CHECK_EQ("5 1 2 + 4 * + 3 -", eval_rpn("5 1 2 + 4 * + 3 -").value_or(-999), 14);
              CHECK_EQ("negative numbers", eval_rpn("-3 2 *").value_or(-999), -6);
              CHECK_EQ("single number", eval_rpn("42").value_or(-999), 42);
              CHECK("bad token", !eval_rpn("3 x +"));
              CHECK("not enough numbers", !eval_rpn("3 +"));
              CHECK("numbers left over", !eval_rpn("1 2"));
              CHECK("empty", !eval_rpn(""));
              CHECK("double space is an empty token", !eval_rpn("1  2 +"));
          }
