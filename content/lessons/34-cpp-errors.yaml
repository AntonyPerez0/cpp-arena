      std::string outcome(std::vector<int>& b, const std::vector<Transfer>& ts) {
          try {
              apply_all(b, ts);
              return "";
          } catch (const TransferError& e) {
              return e.what();
          }
      }

      int main() {
          std::vector<int> b = {100, 50, 0};
          CHECK_EQ("valid transfers don't throw", outcome(b, {{0, 2, 30}, {1, 2, 50}, {2, 0, 10}}), std::string(""));
          CHECK_EQ("and are all applied", b, (std::vector<int>{80, 0, 70}));
          std::vector<int> c = {100, 50, 0};
          CHECK_EQ("the third transfer overdraws", outcome(c, {{0, 1, 60}, {1, 2, 100}, {2, 0, 101}}), std::string("transfer 3: insufficient funds"));
          CHECK_EQ("so nothing changes", c, (std::vector<int>{100, 50, 0}));
          std::vector<int> d = {10, 10};
          CHECK_EQ("an unknown account", outcome(d, {{0, 1, 5}, {1, 7, 1}}), std::string("transfer 2: unknown account"));
          CHECK_EQ("changes nothing either", d, (std::vector<int>{10, 10}));
          std::vector<int> e = {5};
          CHECK_EQ("no transfers is fine", outcome(e, {}), std::string(""));
          std::vector<int> f = {0, 20};
          CHECK_EQ("money received earlier can be spent later", outcome(f, {{1, 0, 20}, {0, 1, 20}}), std::string(""));
          bool is_runtime_error = false;
          try {
              std::vector<int> g = {1};
              apply_all(g, {{0, 0, 2}});
          } catch (const std::runtime_error&) {
              is_runtime_error = true;
          }
          CHECK("TransferError is a std::runtime_error", is_runtime_error);
      }
