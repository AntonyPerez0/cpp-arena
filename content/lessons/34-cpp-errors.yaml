  - title: Exceptions
    id: cpp-errors-7
    text: |
      Exceptions are standard C++'s general tool for failure, and most professional codebases use them. Everything in this step runs in this site's compiler too.

      ### throw, try and catch

      ```cpp run
      #include <iostream>
      #include <stdexcept>
      #include <string>

      int parse_percent(const std::string& s) {
          int v = std::stoi(s);          // throws std::invalid_argument for "abc"
          if (v < 0 || v > 100) throw std::out_of_range("percent must be 0 to 100: " + s);
          return v;
      }

      int main() {
          for (std::string s : {"42", "150", "abc"}) {
              try {
                  std::cout << parse_percent(s) << "\n";
              } catch (const std::out_of_range& e) {
                  std::cout << "range error: " << e.what() << "\n";
              } catch (const std::exception& e) {
                  std::cout << "other error: " << e.what() << "\n";
              }
          }
      }
      ```

      ```output
      42
      range error: percent must be 0 to 100: 150
      other error: stoi
      ```

      - `throw` creates an exception object and abandons the current function immediately. Control jumps to the nearest enclosing `try` block that has a matching `catch`, skipping everything in between. `parse_percent` doesn't need an `if` to pass the failure up: that happens automatically.
      - `catch` clauses are tried **in order**, and a handler for a base class also catches every derived class. So list specific types first: `std::out_of_range` before `std::exception`, which is the base of all standard exceptions.
      - `e.what()` returns the message. The standard library's own messages differ between implementations: GCC's `std::stoi` just says `stoi` (the output above), while this site's library, libc++, says `stoi: no conversion`.
      - If nothing catches an exception, the program calls `std::terminate` and dies. A Linux build prints `terminate called after throwing an instance of 'std::runtime_error'` and the `what()` message, and this site shows the same.

      ### Stack unwinding runs destructors

      On the way from the `throw` to the `catch`, every local object in every abandoned function is destroyed, in reverse order. That's why RAII matters so much: cleanup happens even when a function is left by an exception.

      ```cpp run
      #include <iostream>
      #include <stdexcept>
      #include <string>

      struct Guard {
          std::string name;
          explicit Guard(std::string n) : name(n) { std::cout << "open " << name << "\n"; }
          ~Guard() { std::cout << "close " << name << "\n"; }
      };

      void load() {
          Guard file("config.txt");
          Guard lock("cache lock");
          throw std::runtime_error("disk read failed");
      }

      int main() {
          try {
              load();
          } catch (const std::exception& e) {
              std::cout << "caught: " << e.what() << "\n";
          }
      }
      ```

      ```output
      open config.txt
      open cache lock
      close cache lock
      close config.txt
      caught: disk read failed
      ```

      ### The rules professionals follow

      - **Throw by value, catch by `const&`.** Catching by value copies the exception and slices derived types down to the base.
      - **Derive your own types from the standard ones**, usually `std::runtime_error`, and add the details a handler needs: `struct ParseError : std::runtime_error { int line; ... };`.
      - **`throw;`** (with nothing after it) inside a `catch` re-throws the same exception, after logging or partial cleanup.
      - **Destructors must not throw.** They're `noexcept` by default; a destructor that throws during unwinding terminates the program.
      - **Mark moves and swaps `noexcept`** so containers can use them safely (the move semantics module showed why).
      - Exceptions cost almost nothing when nothing is thrown, with the compilers used for desktops and servers, but throwing one is slow. Use them for genuinely exceptional failures, not for ordinary control flow like "key not found".

      ### Exception safety

      When a function fails halfway, what state is left behind? The guarantees, from weakest to strongest:

      - **Basic**: nothing leaks and every object is still valid, but values may have changed.
      - **Strong**: all or nothing. If the operation fails, it's as if it never started.
      - **No-throw**: it can't fail (`noexcept`).

      The standard recipe for the strong guarantee works with or without exceptions: do all the work on a **copy**, and only when everything has succeeded, **swap** the copy into place. Swapping can't fail, so if anything throws along the way, the original is untouched.

      **Your turn:** write `TransferError`, an exception type derived from `std::runtime_error`, and `apply_all`, which applies a list of transfers between accounts in order, with the strong guarantee. If transfer number `k` (counting from 1) uses an account that doesn't exist, throw `TransferError("transfer k: unknown account")`; if it would make a balance negative, throw `TransferError("transfer k: insufficient funds")`. Either way `balances` must be left exactly as it was.
    seed: |
      #include <stdexcept>
      #include <string>
      #include <vector>

      struct Transfer {
          int from;
          int to;
          int amount;
      };

      // TransferError here

      void apply_all(std::vector<int>& balances, const std::vector<Transfer>& transfers) {

      }
    solution: |
      #include <stdexcept>
      #include <string>
      #include <vector>

      struct Transfer {
          int from;
          int to;
          int amount;
      };

      struct TransferError : std::runtime_error {
          using std::runtime_error::runtime_error;
      };

      void apply_all(std::vector<int>& balances, const std::vector<Transfer>& transfers) {
          std::vector<int> work = balances;
          int n = static_cast<int>(work.size());
          for (std::size_t i = 0; i < transfers.size(); i++) {
              const Transfer& t = transfers[i];
              std::string where = "transfer " + std::to_string(i + 1) + ": ";
              if (t.from < 0 || t.from >= n || t.to < 0 || t.to >= n) throw TransferError(where + "unknown account");
              if (work[t.from] < t.amount) throw TransferError(where + "insufficient funds");
              work[t.from] -= t.amount;
              work[t.to] += t.amount;
          }
          balances.swap(work);
      }
    require:
      - pattern: "\\bthrow\\b"
        message: Report a bad transfer by throwing a TransferError.
    harness: |
