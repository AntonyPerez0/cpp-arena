          - "`std::tolower(c) - 'a'` turns a letter into its index 0 to 25."
      - task: |
          Write `char winner(const std::array<std::array<char, 3>, 3>& b)` for a tic-tac-toe board holding `'X'`, `'O'` or `'.'`. Return the player with three in a row (a row, a column or a diagonal), or `'.'` when nobody has won.
        seed: |
          #include <array>

          char winner(const std::array<std::array<char, 3>, 3>& b) {

          }
        solution: |
          #include <array>

          static bool line(char a, char b, char c) {
              return a != '.' && a == b && b == c;
          }

          char winner(const std::array<std::array<char, 3>, 3>& b) {
              for (int i = 0; i < 3; i++) {
                  if (line(b[i][0], b[i][1], b[i][2])) return b[i][0];
                  if (line(b[0][i], b[1][i], b[2][i])) return b[0][i];
              }
              if (line(b[0][0], b[1][1], b[2][2])) return b[0][0];
              if (line(b[0][2], b[1][1], b[2][0])) return b[0][2];
              return '.';
          }
        harness: |
          #include <array>
          using Board = std::array<std::array<char, 3>, 3>;
          int main() {
              Board row = {{{'X', 'X', 'X'}, {'O', 'O', '.'}, {'.', '.', '.'}}};
              CHECK_EQ("row", winner(row), 'X');
              Board col = {{{'O', 'X', '.'}, {'O', 'X', '.'}, {'O', '.', 'X'}}};
              CHECK_EQ("column", winner(col), 'O');
              Board diag = {{{'.', '.', 'X'}, {'O', 'X', 'O'}, {'X', '.', '.'}}};
              CHECK_EQ("anti-diagonal", winner(diag), 'X');
              Board none = {{{'X', 'O', 'X'}, {'X', 'O', 'O'}, {'O', 'X', 'X'}}};
              CHECK_EQ("draw", winner(none), '.');
              Board empty = {{{'.', '.', '.'}, {'.', '.', '.'}, {'.', '.', '.'}}};
              CHECK_EQ("three empty cells are not a win", winner(empty), '.');
          }
        hints:
          - "A small helper `line(a, b, c)` that checks three cells saves repeating yourself eight times."
          - "Three `'.'` in a row is not a win, so check that the first cell isn't empty."

  - title: deque, the double-ended queue
    id: cpp-stl-3
    text: |
      `std::vector` is fast at the **back** but slow at the **front**: removing element 0 shifts every other element down. `std::deque` (a "double-ended queue", said "deck") is fast at **both ends**: `push_back`, `push_front`, `pop_back` and `pop_front` are all O(1). It still supports `d[i]` indexing.

      ```cpp run
      #include <deque>
      #include <iostream>
      #include <string>

      int main() {
          std::deque<std::string> history;
          const std::size_t limit = 3;
          for (const char* page : {"home", "news", "sports", "weather", "mail"}) {
              history.push_back(page);
              if (history.size() > limit) history.pop_front();   // forget the oldest
          }
          for (const auto& p : history) std::cout << p << " ";
          std::cout << "\n";

          history.push_front("start");
          std::cout << history.front() << " ... " << history.back() << " (" << history.size() << ")\n";
      }
      ```

      ```output
      sports weather mail 
      start ... mail (4)
      ```

      ### The sliding window pattern

      The example keeps only the most recent 3 pages: push the new one at the back, and if that makes it too big, pop the oldest from the front. That's a **sliding window**, and it's exactly what a moving average needs.

      To keep an average cheap, don't add up the whole window every time. Keep a **running sum** as a member:

      - when a value enters, `sum += value`,
      - when a value leaves from the front, `sum -= d.front()` before `pop_front()`.

      Then `average()` is just `sum / size`, in constant time. Remember to divide as `double`, and decide what an empty window returns (0 is a safe choice).

      `std::queue` is a restricted wrapper around a deque that only allows the queue operations.

      **Your turn:** write class `MovingAverage` that remembers only the last `n` values added and reports their average.
    seed: |
      #include <deque>

      class MovingAverage {
      public:
          explicit MovingAverage(int n);
          void add(int value);
          double average() const;

      private:

      };
    solution: |
      #include <deque>

      class MovingAverage {
      public:
          explicit MovingAverage(int n) : n_(n) {}
          void add(int value) {
              window_.push_back(value);
              sum_ += value;
              if (static_cast<int>(window_.size()) > n_) {
                  sum_ -= window_.front();
                  window_.pop_front();
              }
          }
          double average() const { return window_.empty() ? 0.0 : static_cast<double>(sum_) / window_.size(); }

      private:
          int n_;
          std::deque<int> window_;
          long sum_ = 0;
      };
    harness: |
      int main() {
          MovingAverage m(3);
          CHECK_EQ("empty average is 0", m.average(), 0.0);
          m.add(10);
          CHECK_EQ("one value", m.average(), 10.0);
          m.add(20);
          m.add(30);
          CHECK_EQ("three values", m.average(), 20.0);
          m.add(40);
          CHECK_EQ("oldest dropped: 20 30 40", m.average(), 30.0);
          m.add(-90);
          CHECK_EQ("30 40 -90", m.average(), -20.0 / 3.0);
      }
    hints:
      - "Keep a `std::deque<int> window_` and a running `sum_`."
      - "On add: push_back and add to the sum. If the window is now larger than n, subtract `front()` and `pop_front()`."
    more:
      - task: |
          Write class `UndoHistory` that keeps at most `capacity` actions. `push(action)` adds the newest; when that goes over capacity, the **oldest** is forgotten. `undo()` removes and returns the newest action, or `""` when there is none. `size()` returns how many are kept. Use a `std::deque`.
        seed: |
          #include <deque>
          #include <string>

          class UndoHistory {
          public:
              explicit UndoHistory(int capacity);
              void push(const std::string& action);
              std::string undo();
              int size() const;

          private:

          };
        solution: |
          #include <deque>
          #include <string>

          class UndoHistory {
          public:
              explicit UndoHistory(int capacity) : capacity_(capacity) {}
              void push(const std::string& action) {
                  actions_.push_back(action);
                  if (static_cast<int>(actions_.size()) > capacity_) actions_.pop_front();
              }
              std::string undo() {
                  if (actions_.empty()) return "";
                  std::string last = actions_.back();
                  actions_.pop_back();
                  return last;
              }
              int size() const { return static_cast<int>(actions_.size()); }

          private:
              int capacity_;
              std::deque<std::string> actions_;
          };
        require:
          - pattern: "deque"
            message: "Store the actions in a `std::deque`."
        harness: |
          int main() {
              UndoHistory h(3);
              CHECK_EQ("undo on empty", h.undo(), std::string(""));
              h.push("type a");
              h.push("type b");
              h.push("bold");
              h.push("delete");
              CHECK_EQ("capped at 3", h.size(), 3);
              CHECK_EQ("newest first", h.undo(), std::string("delete"));
              CHECK_EQ("then", h.undo(), std::string("bold"));
              CHECK_EQ("oldest kept", h.undo(), std::string("type b"));
              CHECK_EQ("type a was forgotten", h.undo(), std::string(""));
              CHECK_EQ("empty now", h.size(), 0);
          }
        hints:
          - "New actions go on the back. Forgetting the oldest is `pop_front`, undoing the newest is `pop_back`."
      - task: |
          Write `std::vector<int> window_max(const std::vector<int>& v, int k)` that returns the largest value of every window of `k` neighbours, left to right. Keep a `std::deque` of **indexes** whose values are in decreasing order: drop indexes from the back while their value is `<=` the new one, and drop the front once it slides out of the window. The front is then always the window's maximum.
        seed: |
          #include <deque>
          #include <vector>

          std::vector<int> window_max(const std::vector<int>& v, int k) {

          }
        solution: |
          #include <deque>
          #include <vector>

          std::vector<int> window_max(const std::vector<int>& v, int k) {
              std::vector<int> out;
              std::deque<int> idx;
              for (int i = 0; i < static_cast<int>(v.size()); i++) {
                  while (!idx.empty() && v[idx.back()] <= v[i]) idx.pop_back();
                  idx.push_back(i);
                  if (idx.front() <= i - k) idx.pop_front();
                  if (i >= k - 1) out.push_back(v[idx.front()]);
              }
              return out;
          }
        require:
          - pattern: "deque"
            message: "Keep the candidate indexes in a `std::deque`."
        harness: |
          int main() {
              CHECK_EQ("k = 3", window_max({1, 3, -1, -3, 5, 3, 6, 7}, 3), (std::vector<int>{3, 3, 5, 5, 6, 7}));
              CHECK_EQ("k = 1 is the input", window_max({4, 2, 9}, 1), (std::vector<int>{4, 2, 9}));
              CHECK_EQ("k = size", window_max({2, 8, 5}, 3), (std::vector<int>{8}));
              CHECK_EQ("decreasing", window_max({9, 7, 5, 3}, 2), (std::vector<int>{9, 7, 5}));
              CHECK_EQ("window bigger than input", window_max({1, 2}, 3), (std::vector<int>{}));
          }
        hints:
          - "A window is complete once `i >= k - 1`. Only then record the front's value."
          - "The front index is outside the window when `idx.front() <= i - k`."

  - title: priority_queue and top-k
    id: cpp-stl-4
    text: |
      `std::priority_queue` (from `<queue>`) is a **heap**: a structure that always knows its largest element. `push` and `pop` cost O(log n), and `top()` is always the maximum.

      ```cpp run
      #include <functional>
      #include <iostream>
      #include <queue>
      #include <vector>

      int main() {
          std::priority_queue<int> maxheap;
          for (int x : {5, 1, 8, 3, 9, 2}) maxheap.push(x);
          std::cout << "max-heap pops: ";
          while (!maxheap.empty()) {
              std::cout << maxheap.top() << " ";
              maxheap.pop();
          }

          std::priority_queue<int, std::vector<int>, std::greater<int>> minheap;
          for (int x : {5, 1, 8, 3, 9, 2}) minheap.push(x);
          std::cout << "\nmin-heap top: " << minheap.top() << "\n";
      }
      ```

      ```output
      max-heap pops: 9 8 5 3 2 1 
      min-heap top: 1
      ```

      The three template arguments of the min-heap are: element type, underlying container, comparison. `std::greater<int>` flips the order, so `top()` becomes the **smallest**.

      ### Top k with a min-heap

      To keep the **k largest** values from a big list, keep a min-heap that never holds more than k values:

      1. Push each value.
      2. If the heap now has more than k values, pop. The popped value is the **smallest** in the heap, so it can't be among the k largest.

      At the end, the heap holds the k largest values. Each step is O(log k), so the total is O(n log k), which beats sorting everything (O(n log n)) when k is small.

      The heap pops smallest first, so to return the values **largest first**, pop them all into a vector and then reverse it (or fill the vector from the back).

      ### Common mistakes

      - Using the default max-heap for top k. It pops the largest, which is the one you wanted to keep.
      - Calling `top()` or `pop()` on an empty heap. Handle `k == 0` and short inputs.

      **Your turn:** write `std::vector<int> top_k(const std::vector<int>& v, int k)` returning the k largest values, largest first, using a min-heap of size at most k.
    seed: |
      #include <functional>
      #include <queue>
      #include <vector>

      std::vector<int> top_k(const std::vector<int>& v, int k) {

      }
    solution: |
      #include <algorithm>
      #include <functional>
      #include <queue>
      #include <vector>

      std::vector<int> top_k(const std::vector<int>& v, int k) {
          std::priority_queue<int, std::vector<int>, std::greater<int>> heap;
          for (int x : v) {
              heap.push(x);
              if (static_cast<int>(heap.size()) > k) heap.pop();
          }
          std::vector<int> out;
          while (!heap.empty()) {
              out.push_back(heap.top());
              heap.pop();
          }
          std::reverse(out.begin(), out.end());
          return out;
      }
    require:
      - pattern: "priority_queue"
        message: "Use a `std::priority_queue` min-heap."
    forbid:
      - pattern: "std::sort|partial_sort|nth_element"
        message: "Solve it with the heap rather than sorting."
    harness: |
      int main() {
