      - task: |
          Write `template <typename It> int count_runs(It first, It last)` that counts the **runs**: groups of equal neighbours. `{1, 1, 2, 2, 2, 1}` has 3 runs. An empty range has 0. Only use `==`, `!=` and `++` on the iterators, so it works on any container.
        seed: |
          template <typename It>
          int count_runs(It first, It last) {

          }
        solution: |
          template <typename It>
          int count_runs(It first, It last) {
              if (first == last) return 0;
              int runs = 1;
              It prev = first;
              for (++first; first != last; ++first) {
                  if (!(*first == *prev)) runs++;
                  prev = first;
              }
              return runs;
          }
        harness: |
