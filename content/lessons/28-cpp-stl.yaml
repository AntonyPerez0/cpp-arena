          Write `int last_stone(const std::vector<int>& stones)`. Each turn, smash the **two heaviest** stones together: if they weigh the same both are destroyed, otherwise the lighter is destroyed and the heavier loses that much weight and goes back. Return the weight of the stone that is left, or 0 if none is. Use a `std::priority_queue`.
        seed: |
