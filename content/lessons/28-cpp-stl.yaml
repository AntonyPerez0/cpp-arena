              CHECK_EQ("z", c['z' - 'a'], 0);
              CHECK("empty string is all zeros", letter_counts("") == std::array<int, 26>{});
              CHECK("digits and spaces are skipped", letter_counts("1 2 3") == std::array<int, 26>{});
          }
        hints:
