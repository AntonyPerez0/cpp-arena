          #include <string>

          std::array<int, 26> letter_counts(const std::string& s) {

          }
        solution: |
          #include <array>
          #include <cctype>
          #include <string>

          std::array<int, 26> letter_counts(const std::string& s) {
              std::array<int, 26> counts{};
              for (char c : s) {
                  unsigned char u = (unsigned char)c;
                  if (std::isalpha(u)) counts[std::tolower(u) - 'a']++;
              }
              return counts;
