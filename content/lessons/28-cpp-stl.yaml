          #include <sstream>
          #include <string>
          #include <vector>

          class Commands {
          public:
              void add(const std::string& name, std::function<std::string(const std::vector<std::string>&)> fn) {
                  commands_[name] = fn;
              }
              std::string run(const std::string& line) const {
                  std::istringstream in(line);
                  std::string name;
                  if (!(in >> name)) return "";
                  std::vector<std::string> args;
                  std::string word;
                  while (in >> word) args.push_back(word);
                  auto it = commands_.find(name);
                  if (it == commands_.end()) return "unknown command: " + name;
                  return it->second(args);
              }

          private:
              std::map<std::string, std::function<std::string(const std::vector<std::string>&)>> commands_;
          };
        harness: |
          int main() {
              Commands c;
              c.add("echo", [](const std::vector<std::string>& a) {
                  std::string out;
                  for (const auto& w : a) out += (out.empty() ? "" : " ") + w;
                  return out;
              });
              c.add("count", [](const std::vector<std::string>& a) { return std::to_string(a.size()); });
              CHECK_EQ("echo", c.run("echo hello there"), std::string("hello there"));
              CHECK_EQ("count", c.run("count a b c"), std::string("3"));
              CHECK_EQ("no arguments", c.run("count"), std::string("0"));
              CHECK_EQ("extra spaces", c.run("  echo   gg  "), std::string("gg"));
              CHECK_EQ("unknown", c.run("jump high"), std::string("unknown command: jump"));
              CHECK_EQ("empty line", c.run(""), std::string(""));
              c.add("echo", [](const std::vector<std::string>&) { return std::string("replaced"); });
              CHECK_EQ("adding again replaces", c.run("echo x"), std::string("replaced"));
          }
        hints:
          - "A `std::map<std::string, std::function<...>>` maps each name to its handler."
          - "`std::istringstream` with `>>` splits on any amount of whitespace."
      - task: |
          Write `std::function<int(int)> compose(std::function<int(int)> f, std::function<int(int)> g)` returning a function that runs `f` first and then `g`, so `compose(f, g)(x)` is `g(f(x))`. Then write `std::function<int(int)> repeat_fn(std::function<int(int)> f, int n)` that applies `f` to its input `n` times (0 times returns the input unchanged).
        seed: |
          #include <functional>

          std::function<int(int)> compose(std::function<int(int)> f, std::function<int(int)> g) {

          }

          std::function<int(int)> repeat_fn(std::function<int(int)> f, int n) {

          }
        solution: |
          #include <functional>

          std::function<int(int)> compose(std::function<int(int)> f, std::function<int(int)> g) {
              return [f, g](int x) { return g(f(x)); };
          }

          std::function<int(int)> repeat_fn(std::function<int(int)> f, int n) {
              return [f, n](int x) {
                  for (int i = 0; i < n; i++) x = f(x);
                  return x;
              };
          }
        harness: |
          int main() {
              auto add3 = [](int x) { return x + 3; };
              auto twice = [](int x) { return x * 2; };
              CHECK_EQ("add 3 then double", compose(add3, twice)(1), 8);
              CHECK_EQ("double then add 3", compose(twice, add3)(1), 5);
              CHECK_EQ("double 3 times", repeat_fn(twice, 3)(5), 40);
              CHECK_EQ("0 times", repeat_fn(twice, 0)(7), 7);
              CHECK_EQ("compose with a repeat", compose(repeat_fn(add3, 2), twice)(0), 12);
          }
        hints:
          - "Return a lambda. It has to capture `f` and `g` **by copy**, because the parameters are gone once `compose` returns."
          - "Inside the returned lambda, `x` is a copy you can update in a loop."
