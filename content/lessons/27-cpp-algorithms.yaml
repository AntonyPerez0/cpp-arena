              std::vector<int> v = {3, 1, 3, 2, 1, 3};
              CHECK_EQ("removed", remove_duplicates(v), 3);
              CHECK_EQ("first copies in order", v, std::vector<int>{3, 1, 2});
              std::vector<int> u = {5, 6};
              CHECK_EQ("no duplicates", remove_duplicates(u), 0);
              CHECK_EQ("unchanged", u, std::vector<int>{5, 6});
          }
        hints:
          - "`seen.insert(x)` returns a pair whose `.second` is `false` when `x` was already in the set."
          - "The set has to be captured by reference (`[&seen]`) so the lambda can add to it."
