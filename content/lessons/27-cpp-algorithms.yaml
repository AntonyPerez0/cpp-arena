          #include <vector>

          int remove_short(std::vector<std::string>& words, std::size_t min_len) {
              return (int)std::erase_if(words, [min_len](const std::string& w) { return w.size() < min_len; });
          }
        require:
          - pattern: "erase_if"
            message: Use `std::erase_if`.
        harness: |
          int main() {
              std::vector<std::string> w = {"ak", "deagle", "p90", "famas"};
              CHECK_EQ("removed count", remove_short(w, 4), 2);
              CHECK_EQ("what is left", w, std::vector<std::string>{"deagle", "famas"});
              std::vector<std::string> none = {"long", "words"};
              CHECK_EQ("nothing to remove", remove_short(none, 2), 0);
              CHECK_EQ("unchanged", none, std::vector<std::string>{"long", "words"});
