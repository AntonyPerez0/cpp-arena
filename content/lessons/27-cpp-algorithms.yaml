        hints:
          - "`std::erase_if` already returns how many it removed."
      - task: |
          Write `int remove_duplicates(std::vector<int>& v)` that removes every value that already appeared **earlier**, keeping the first copy and the original order, and returns how many were removed. Use `std::erase_if` with a lambda that captures a `std::set<int>` of seen values **by reference**.
        seed: |
          #include <set>
          #include <vector>

          int remove_duplicates(std::vector<int>& v) {

          }
        solution: |
          #include <set>
          #include <vector>

          int remove_duplicates(std::vector<int>& v) {
              std::set<int> seen;
              return (int)std::erase_if(v, [&seen](int x) { return !seen.insert(x).second; });
          }
        require:
          - pattern: "erase_if"
            message: Use `std::erase_if`.
        harness: |
