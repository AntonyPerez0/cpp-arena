      - task: |
          Write `int *concat(const int *a, int na, const int *b, int nb)` that returns a new heap array with all of `a` followed by all of `b`. The caller frees it.
        seed: |
          #include <stdlib.h>

          int *concat(const int *a, int na, const int *b, int nb) {

          }
        solution: |
          #include <stdlib.h>

          int *concat(const int *a, int na, const int *b, int nb) {
              int *out = malloc((na + nb) * sizeof(int));
              if (out == NULL) return NULL;
              for (int i = 0; i < na; i++) out[i] = a[i];
              for (int i = 0; i < nb; i++) out[na + i] = b[i];
              return out;
          }
        harness: |
