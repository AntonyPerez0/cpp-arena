              free(c);
              int *d = concat(a, 0, b, 2);
              CHECK("empty first part", d != NULL && d[0] == 9 && d[1] == 8);
              free(d);
              int *e = concat(a, 3, b, 0);
              CHECK("empty second part", e != NULL && e[0] == 1 && e[2] == 3);
              free(e);
              return 0;
          }
