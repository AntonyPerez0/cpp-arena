        message: "`tmp` is never freed. That's a leak."
      - pattern: "strlen\\s*\\(\\s*b\\s*\\)\\s*\\+\\s*1|\\+\\s*2\\s*\\)"
        message: "The size for `out` has no room for the `'\\0'` terminator. Add `+ 1`."
    harness: |
