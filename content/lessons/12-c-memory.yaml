          `sum_squares(n)` should return `1*1 + 2*2 + ... + n*n`, but it has two memory bugs: the loop writes one element **past the end** of the buffer, and the buffer is never freed. Fix both.
        seed: |
          #include <stdlib.h>

          int sum_squares(int n) {
              int *sq = malloc(n * sizeof(int));
              if (sq == NULL) return -1;
              for (int i = 1; i <= n; i++) {
                  sq[i] = i * i;
              }
              int total = 0;
              for (int i = 1; i <= n; i++) {
                  total += sq[i];
              }
              return total;
          }
        solution: |
          #include <stdlib.h>

          int sum_squares(int n) {
              int *sq = malloc(n * sizeof(int));
              if (sq == NULL) return -1;
              for (int i = 0; i < n; i++) {
                  sq[i] = (i + 1) * (i + 1);
              }
              int total = 0;
              for (int i = 0; i < n; i++) {
                  total += sq[i];
              }
              free(sq);
              return total;
          }
