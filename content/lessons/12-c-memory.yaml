  - title: calloc and strdup-style copies
    id: c-memory-4
    text: |
      ### calloc

      `calloc(count, size)` allocates room for `count` elements of `size` bytes each, and **sets every byte to zero**. Use it when you want a clean starting state, like counters or a grid. Standard libraries also check that `count * size` doesn't overflow (returning `NULL` if it would), which `malloc(count * size)` can't do for you.

      ### Copying a string onto the heap

      A very common job: keep your own copy of a string, for example text that came from a temporary buffer. The recipe:

      1. Measure it with `strlen`.
      2. Allocate `strlen(s) + 1` bytes. The **+1** is for the `'\0'`, and forgetting it is one of the most common bugs in C.
      3. Copy the characters, including the terminator (`strcpy` or `memcpy` with the +1).

      ```c run
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>

      char *shout(const char *s) {
          size_t n = strlen(s);
          char *out = malloc(n + 2);
          if (out == NULL) {
              return NULL;
          }
          memcpy(out, s, n);
          out[n] = '!';
          out[n + 1] = '\0';
          return out;
      }

      int main(void) {
          char *msg = shout("hello");
          if (msg == NULL) {
              return 1;
          }
          printf("%s (%zu chars)\n", msg, strlen(msg));
          free(msg);
          int *counts = calloc(3, sizeof *counts);
          if (counts == NULL) {
              return 1;
          }
          printf("%d %d %d\n", counts[0], counts[1], counts[2]);
          free(counts);
          return 0;
      }
      ```

      ```output
      hello! (6 chars)
      0 0 0
      ```

      `shout` needs `n + 2` bytes: n characters, the `!`, and the terminator. Counting bytes carefully like this is everyday C.

      (Many systems have `strdup`, which does steps 1 to 3 for you. It's standard since C23, but writing it yourself is good practice.)

      **Your turn:** write `char *copy_string(const char *s)` that returns a new heap copy of `s`.
    seed: |
      #include <stdlib.h>
      #include <string.h>

      char *copy_string(const char *s) {

      }
    solution: |
      #include <stdlib.h>
      #include <string.h>

      char *copy_string(const char *s) {
          size_t n = strlen(s);
          char *c = malloc(n + 1);
          if (c == NULL) return NULL;
          memcpy(c, s, n + 1);
          return c;
      }
    harness: |
      int main(void) {
          char src[] = "clutch";
          char *c = copy_string(src);
          CHECK_STR("copy equals original", c, "clutch");
          CHECK("copy is a different address", c != src);
          src[0] = 'X';
          CHECK_STR("copy unaffected by changes to original", c, "clutch");
          free(c);
          char *e = copy_string("");
          CHECK_STR("empty string", e, "");
          free(e);
          return 0;
      }
    hints:
      - "Allocate `strlen(s) + 1` bytes."
      - Copy with `strcpy(c, s)` (or memcpy of n + 1 bytes) and return c.
    more:
      - task: |
          Write `char *reversed_copy(const char *s)` that returns a new heap string with the characters of `s` in reverse order. Don't change `s`.
        seed: |
          #include <stdlib.h>
          #include <string.h>

          char *reversed_copy(const char *s) {

          }
        solution: |
          #include <stdlib.h>
          #include <string.h>

          char *reversed_copy(const char *s) {
              size_t n = strlen(s);
              char *r = malloc(n + 1);
              if (r == NULL) return NULL;
              for (size_t i = 0; i < n; i++) r[i] = s[n - 1 - i];
              r[n] = '\0';
              return r;
          }
        harness: |
          int main(void) {
              char *r = reversed_copy("clutch");
              CHECK_STR("reversed \"clutch\"", r, "hctulc");
              free(r);
              const char *src = "ab";
              char *r2 = reversed_copy(src);
              CHECK_STR("reversed \"ab\"", r2, "ba");
              CHECK_STR("original unchanged", src, "ab");
              free(r2);
              char *e = reversed_copy("");
              CHECK_STR("empty string", e, "");
              free(e);
              return 0;
          }
        hints:
          - Allocate `strlen(s) + 1` bytes, the extra one for the terminator.
          - "Position `i` of the copy is `s[n - 1 - i]`. Don't forget `r[n] = '\\0';`."
        tests: []
      - task: |
          Write `char *repeat_string(const char *s, int times)` that returns a new heap string with `s` repeated `times` times. `repeat_string("gg", 3)` returns `"gggggg"`, and `times` 0 gives `""`.
        seed: |
          #include <stdlib.h>
          #include <string.h>

          char *repeat_string(const char *s, int times) {

          }
        solution: |
          #include <stdlib.h>
          #include <string.h>

          char *repeat_string(const char *s, int times) {
              size_t n = strlen(s);
              char *r = malloc(n * times + 1);
              if (r == NULL) return NULL;
              for (int t = 0; t < times; t++) memcpy(r + n * t, s, n);
              r[n * times] = '\0';
              return r;
          }
        harness: |
          int main(void) {
              char *a = repeat_string("gg", 3);
              CHECK_STR("\"gg\" 3 times", a, "gggggg");
              free(a);
              char *b = repeat_string("rush b ", 2);
              CHECK_STR("\"rush b \" 2 times", b, "rush b rush b ");
              free(b);
              char *c = repeat_string("x", 0);
              CHECK_STR("0 times", c, "");
              free(c);
              char *d = repeat_string("", 5);
              CHECK_STR("empty string 5 times", d, "");
              free(d);
              return 0;
          }
        hints:
          - The result has `strlen(s) * times` characters plus one for the terminator.
          - Copy `s` to position `n * t` for each `t`, with `memcpy` or a loop, then write the terminator at the end.
        tests: []

  - title: Growing with realloc
    id: c-memory-5
    text: |
      What if you don't know how many values are coming, not even at run time? The answer is a **growable array**: start with a small heap block, and when it fills up, make it bigger. `realloc` does the resizing.

      `realloc(ptr, new_size)` returns a pointer to a block of the new size that holds the old contents. It may grow the block where it is, or it may allocate a new block elsewhere, copy everything over, and free the old one. So:

      - **Always use the pointer `realloc` returns.** The old one may now be invalid.
      - If it fails, it returns `NULL` and the **old block is untouched**. So store the result in a temporary first. Writing `a = realloc(a, ...)` directly would overwrite your only pointer with `NULL` on failure, leaking the old block.

      ```c run
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int cap = 1, len = 0;
          char *text = malloc(cap);
          if (!text) return 1;
          const char *word = "growing";
          for (int i = 0; word[i] != '\0'; i++) {
              if (len + 1 >= cap) {
                  char *bigger = realloc(text, cap * 2);
                  if (!bigger) { free(text); return 1; }
                  text = bigger;
                  cap *= 2;
              }
              text[len++] = word[i];
          }
          text[len] = '\0';
          printf("%s, capacity %d\n", text, cap);
          free(text);
          return 0;
      }
      ```

      ```output
      growing, capacity 8
      ```

      ### Why double?

      Growing by one element each time would copy the whole array on every push, which gets very slow for big arrays. **Doubling** the capacity means copies become rarer as the array grows, so on average each push is cheap (this is called **amortized O(1)**). C++'s `std::vector` and almost every dynamic array in other languages work this way, growing by a constant factor (usually 1.5 or 2) each time.

      Keep two numbers: **length** (how many are used) and **capacity** (how many fit). Grow only when length reaches capacity.

      **Your turn:** read integers until the end of input (you don't know how many!) into a heap array that starts with capacity 2 and doubles when full. Print how many you read, the capacity at the end, and the last number:

      Input `5 6 7 8 9` prints `count 5 cap 8 last 9`.
    seed: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int cap = 2, count = 0;
          int *a = malloc(cap * sizeof(int));
          int x;
          while (scanf("%d", &x) == 1) {
              // grow if full, then store x

          }
          printf("count %d cap %d last %d\n", count, cap, a[count - 1]);
          free(a);
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <stdlib.h>

      int main(void) {
          int cap = 2, count = 0;
          int *a = malloc(cap * sizeof(int));
          int x;
          while (scanf("%d", &x) == 1) {
              // grow if full, then store x
              if (count == cap) {
                  cap *= 2;
                  int *tmp = realloc(a, cap * sizeof(int));
                  if (tmp == NULL) {
                      free(a);
                      return 1;
                  }
                  a = tmp;
              }
              a[count++] = x;
          }
          printf("count %d cap %d last %d\n", count, cap, a[count - 1]);
          free(a);
          return 0;
      }
