          int **g = make_grid(3, 4);
          CHECK("grid was allocated", g != NULL);
          int zero = 1;
          for (int r = 0; r < 3; r++)
              for (int c = 0; c < 4; c++)
                  if (g[r][c] != 0) zero = 0;
          CHECK("every cell starts at 0", zero);
          g[2][3] = 9;
          g[0][0] = 1;
          CHECK_INT("g[2][3] after writing", g[2][3], 9);
          CHECK_INT("rows are separate", g[1][3], 0);
          free_grid(g, 3);
          int **big = make_grid(100, 100);
          big[99][99] = 5;
          CHECK_INT("100 x 100 corner", big[99][99], 5);
          free_grid(big, 100);
          free_grid(NULL, 0);
          CHECK("free_grid(NULL, 0) is safe", 1);
          return 0;
      }
    hints:
      - "First `int **g = malloc(rows * sizeof *g);`, then a loop with `g[r] = calloc(cols, sizeof *g[r]);`."
      - "free_grid: `free(g[r])` for every row, then `free(g)`. Return early if g is NULL."
    more:
