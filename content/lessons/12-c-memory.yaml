      }
    solution: |
      #include <stdlib.h>
      #include <string.h>

      typedef struct {
          char *buf;
          size_t len;
          size_t cap;
      } Builder;

      int sb_init(Builder *b) {
          b->cap = 8;
          b->len = 0;
          b->buf = malloc(b->cap);
          if (b->buf == NULL) return -1;
          b->buf[0] = '\0';
          return 0;
      }

      int sb_append(Builder *b, const char *s) {
          size_t add = strlen(s);
          size_t need = b->len + add + 1;
          if (need > b->cap) {
              size_t cap = b->cap;
              while (cap < need) cap *= 2;
              char *tmp = realloc(b->buf, cap);
              if (tmp == NULL) return -1;
              b->buf = tmp;
              b->cap = cap;
          }
          memcpy(b->buf + b->len, s, add + 1);
          b->len += add;
          return 0;
      }

      const char *sb_str(const Builder *b) {
          return b->buf;
      }

      void sb_free(Builder *b) {
          free(b->buf);
          b->buf = NULL;
          b->len = 0;
          b->cap = 0;
      }
