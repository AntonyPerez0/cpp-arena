id: cpp-raii
title: Lifetime and RAII
lang: cpp
phase: "C++: A Better C"
summary: Destructors, object lifetime and RAII, the idea that makes C++ memory-safe in practice. Plus copying and the rule of three.
steps:
  - title: Destructors
    id: cpp-raii-1
    text: |
      A **destructor** runs automatically when an object's lifetime ends, for example when a local variable goes out of scope. It's named `~ClassName()`:

      ```cpp
      struct Noisy {
          Noisy()  { std::cout << "hello\n"; }
          ~Noisy() { std::cout << "bye\n"; }
      };

      int main() {
          Noisy n;              // prints hello
          std::cout << "work\n";
      }                         // prints bye here, automatically
      ```

      **Your turn:** complete the destructor so the program prints the three lines shown in the tests.
    fill: |
      #include <iostream>

      struct Round {
          Round() { std::cout << "round start\n"; }
          [[~Round]]() { std::cout << "[[round end]]\n"; }
      };

      int main() {
          Round r;
          std::cout << "playing\n";
      }
    hints:
      - "A destructor's name is `~` followed by the class name: `~Round`."
    tests:
      - expect: "round start\nplaying\nround end"

  - title: Order of destruction
    id: cpp-raii-2
    text: |
      Objects are destroyed in the **reverse order** of construction (last in, first out), and a `{ }` block ends the lifetime of everything declared inside it.

      **Your turn:** without changing the struct, reorder and group the lines in `main` so the output is exactly:

      ```
      + A
      + B
      - B
      + C
      - C
      - A
      ```
    seed: |
      #include <iostream>
      #include <string>

      struct Tag {
          std::string name;
          Tag(std::string n) : name(n) { std::cout << "+ " << name << "\n"; }
          ~Tag() { std::cout << "- " << name << "\n"; }
      };

      int main() {
          Tag a("A");
          Tag b("B");
          Tag c("C");
      }
    solution: |
      #include <iostream>
      #include <string>

      struct Tag {
          std::string name;
          Tag(std::string n) : name(n) { std::cout << "+ " << name << "\n"; }
          ~Tag() { std::cout << "- " << name << "\n"; }
      };

      int main() {
          Tag a("A");
          {
              Tag b("B");
          }
          {
              Tag c("C");
          }
      }
    require:
      - pattern: "\\{\\s*Tag\\s+\\w+\\s*\\("
        message: "Control the lifetimes with `{ }` blocks around the objects in main."
    hints:
      - "B must die before C is born. Put `Tag b(\"B\");` inside its own `{ }` block."
      - Do the same for C. A lives until the end of main.
    tests:
      - expect: "+ A\n+ B\n- B\n+ C\n- C\n- A"

  - title: RAII
    id: cpp-raii-3
    text: |
      **RAII** (Resource Acquisition Is Initialization) means: acquire a resource in a constructor, release it in the destructor. Since destructors always run, you can't forget to clean up, even on early `return`.

      ```cpp
      class IntArray {
      public:
          IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          ...
      };
      ```

      `new T[n]` / `delete[] p` are C++'s versions of `malloc`/`free` for arrays (`new T` / `delete p` for one object). The `()` after `new int[n]` zero-initializes the elements.

      **Your turn:** finish `IntArray`: the destructor, plus `int size() const`, `int& at(int i)` (returns a reference so callers can write through it) and `int sum() const`.
    seed: |
      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          // destructor, size, at, sum

      private:
          int* data_;
          int n_;
      };
    solution: |
      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          // destructor, size, at, sum
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray&) = delete;
          IntArray& operator=(const IntArray&) = delete;
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          int sum() const {
              int s = 0;
              for (int i = 0; i < n_; i++) s += data_[i];
              return s;
          }

      private:
          int* data_;
          int n_;
      };
    require:
      - pattern: "~IntArray\\s*\\(\\s*\\)\\s*\\{[^}]*delete\\s*\\[\\s*\\]"
        message: "The destructor must release the memory with `delete[] data_;`."
    harness: |
      int main() {
          IntArray a(5);
          CHECK_EQ("size", a.size(), 5);
          CHECK_EQ("zero initialized", a.sum(), 0);
          a.at(0) = 10;
          a.at(4) = 7;
          CHECK_EQ("at() writes through", a.at(4), 7);
          CHECK_EQ("sum", a.sum(), 17);
          for (int k = 0; k < 1000; k++) {
              IntArray tmp(1000);
              tmp.at(999) = k;
          }
          CHECK("1000 temporary arrays freed cleanly", true);
      }
    hints:
      - "`~IntArray() { delete[] data_; }`"
      - "`int& at(int i) { return data_[i]; }` returns a reference, so `a.at(0) = 10` works."

  - title: The copy problem
    id: cpp-raii-4
    text: |
      By default, copying an object copies each member. For `IntArray` that copies the **pointer**, so two objects share one array. When both destructors run, the array is deleted twice (a crash, or worse).

      Fix it by writing a **copy constructor** that makes a *deep copy*:

      ```cpp
      IntArray(const IntArray& other)
          : data_(new int[other.n_]), n_(other.n_) {
          for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
      }
      ```

      This is the **rule of three**: if a class needs a destructor, it almost always needs a copy constructor and copy assignment too.

      **Your turn:** add the deep-copy constructor. (Copy assignment is provided.)
    seed: |
      #include <algorithm>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          // copy constructor goes here

          IntArray& operator=(IntArray other) {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    solution: |
      #include <algorithm>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          // copy constructor goes here
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          IntArray& operator=(IntArray other) {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    harness: |
      int main() {
          IntArray a(3);
          a.at(0) = 1; a.at(1) = 2; a.at(2) = 3;
          IntArray b = a;
          CHECK("copy has its own memory", b.raw() != a.raw());
          CHECK_EQ("copy has same size", b.size(), 3);
          CHECK_EQ("copy has same values", b.at(2), 3);
          b.at(0) = 99;
          CHECK_EQ("changing the copy leaves the original alone", a.at(0), 1);
          IntArray c(1);
          c = a;
          CHECK_EQ("assignment copies values", c.at(1), 2);
      }
    hints:
      - "Signature: `IntArray(const IntArray& other)`."
      - "Allocate new memory of `other.n_` ints, then copy each element in a loop."

  - title: Non-copyable classes
    id: cpp-raii-5
    text: |
      Sometimes copying makes no sense (a file handle, a network socket, a unique game session). Say so explicitly with `= delete`, and the compiler rejects any attempt to copy:

      ```cpp
      class Session {
      public:
          Session(const Session&) = delete;
          Session& operator=(const Session&) = delete;
      };
      ```

      **Your turn:** make `Lock` non-copyable. The tests check it at compile time with `std::is_copy_constructible_v`.
    seed: |
      class Lock {
      public:
          Lock() = default;
          // forbid copying here

      };
    solution: |
      class Lock {
      public:
          Lock() = default;
          // forbid copying here
          Lock(const Lock&) = delete;
          Lock& operator=(const Lock&) = delete;
      };
    harness: |
      #include <type_traits>
      int main() {
          CHECK("Lock can be created", std::is_default_constructible_v<Lock>);
          CHECK("Lock cannot be copy-constructed", !std::is_copy_constructible_v<Lock>);
          CHECK("Lock cannot be copy-assigned", !std::is_copy_assignable_v<Lock>);
      }
    hints:
      - "`Lock(const Lock&) = delete;`"
      - "`Lock& operator=(const Lock&) = delete;`"

  - title: Copy assignment with copy-and-swap
    id: cpp-raii-6
    text: |
      Copy **assignment** (`a = b;` on an existing `a`) is harder than the copy constructor: `a` already owns memory that must be released, and `a = a;` must not destroy itself.

      The standard trick is **copy-and-swap**:

      ```cpp
      void swap(IntArray& other) noexcept {
          std::swap(data_, other.data_);
          std::swap(n_, other.n_);
      }
      IntArray& operator=(IntArray other) {   // by value: a copy is made here
          swap(other);                        // take the copy's guts
          return *this;                       // other's destructor frees our old data
      }
      ```

      Why professionals like it:

      - It reuses the copy constructor, so there's no duplicated copying code.
      - Self-assignment is automatically safe.
      - If the copy throws (runs out of memory), `*this` is untouched. That's called the **strong exception guarantee**.

      **Your turn:** write the member `swap` and the copy-and-swap `operator=`.
    seed: |
      #include <utility>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          // swap and operator= here

          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    solution: |
      #include <utility>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          // swap and operator= here
          void swap(IntArray& other) noexcept {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
          }
          IntArray& operator=(IntArray other) {
              swap(other);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    harness: |
      int main() {
          IntArray a(3);
          a.at(0) = 1; a.at(1) = 2; a.at(2) = 3;
          IntArray b(5);
          b = a;
          CHECK_EQ("size after assignment", b.size(), 3);
          CHECK_EQ("values after assignment", b.at(2), 3);
          CHECK("b has its own memory", b.raw() != a.raw());
          b.at(0) = 50;
          CHECK_EQ("a is unaffected", a.at(0), 1);
          IntArray& alias = a;
          a = alias;
          CHECK_EQ("self-assignment keeps values", a.at(1), 2);
          IntArray x(1), y(2);
          x.swap(y);
          CHECK("swap exchanges sizes", x.size() == 2 && y.size() == 1);
      }
    hints:
      - "`void swap(IntArray& other) noexcept` swaps both members with `std::swap`."
      - "`IntArray& operator=(IntArray other) { swap(other); return *this; }` (note: other is taken **by value**)."

  - title: The rule of zero
    id: cpp-raii-7
    text: |
      Everything in the last few steps (destructor, deep copy, copy-and-swap) is only needed because the class held a **raw owning pointer**. Replace it with a member that already manages itself, like `std::vector`, `std::string` or `std::unique_ptr`, and you write **none** of them. The compiler-generated versions just do the right thing, member by member.

      That's the **rule of zero**, and it's how most modern C++ classes are written. Writing your own destructor or copy operations is the exception, reserved for low-level resource wrappers.

      ```cpp
      class Loadout {
          std::vector<std::string> items_;   // copies, moves and frees itself
      public:
          void add(std::string item) { items_.push_back(std::move(item)); }
      };
      ```

      **Your turn:** write class `Inventory` with the rule of zero: `void add(const std::string& item)`, `int count() const`, `bool has(const std::string& item) const`, `void clear()`. No `new`, no `delete`, no destructor.
    seed: |
      #include <string>
      #include <vector>

      class Inventory {
      public:

      private:

      };
    solution: |
      #include <algorithm>
      #include <string>
      #include <vector>

      class Inventory {
      public:
          void add(const std::string& item) { items_.push_back(item); }
          int count() const { return static_cast<int>(items_.size()); }
          bool has(const std::string& item) const {
              return std::find(items_.begin(), items_.end(), item) != items_.end();
          }
          void clear() { items_.clear(); }

      private:
          std::vector<std::string> items_;
      };
    forbid:
      - pattern: "\\bnew\\b|\\bdelete\\b|~\\s*Inventory"
        message: "Rule of zero: let a `std::vector` own the items. No `new`, `delete` or destructor."
    harness: |
      int main() {
          Inventory a;
          a.add("ak47");
          a.add("deagle");
          CHECK_EQ("count", a.count(), 2);
          CHECK_EQ("has ak47", a.has("ak47"), true);
          CHECK_EQ("no awp", a.has("awp"), false);
          Inventory b = a;
          b.add("awp");
          CHECK_EQ("copy is independent", a.count(), 2);
          CHECK_EQ("copy got the new item", b.count(), 3);
          a = b;
          CHECK_EQ("assignment copies", a.has("awp"), true);
          a.clear();
          CHECK_EQ("clear empties it", a.count(), 0);
          CHECK_EQ("b is untouched by a.clear()", b.count(), 3);
      }
    hints:
      - "Keep a `std::vector<std::string> items_;` as the only data member."
      - "`has` can use `std::find(items_.begin(), items_.end(), item) != items_.end()` from `<algorithm>`."

  - title: "Challenge: a scope guard"
    id: cpp-raii-8
    text: |
      RAII isn't only for memory. Any "undo" action (close a file, unlock a mutex, roll back a transaction, restore a setting) can be tied to a destructor, so it runs however the scope is left: normal end, early `return`, or an exception.

      A **scope guard** holds a function and calls it in its destructor, unless you `dismiss()` it first (for example, because the operation succeeded and there's nothing to undo). Many large codebases have one; C++ proposals call it `scope_exit`.

      `std::function<void()>` can hold any callable that takes no arguments, including a lambda.

      **Your turn:** write class `ScopeGuard`:

      - `explicit ScopeGuard(std::function<void()> f)`
      - the destructor calls `f` unless dismissed
      - `void dismiss()`
      - it must not be copyable (two copies would run the action twice)
    seed: |
      #include <functional>
      #include <utility>

      class ScopeGuard {
      public:

      private:

      };
    solution: |
      #include <functional>
      #include <utility>

      class ScopeGuard {
      public:
          explicit ScopeGuard(std::function<void()> f) : f_(std::move(f)) {}
          ~ScopeGuard() {
              if (active_ && f_) f_();
          }
          ScopeGuard(const ScopeGuard&) = delete;
          ScopeGuard& operator=(const ScopeGuard&) = delete;
          void dismiss() { active_ = false; }

      private:
          std::function<void()> f_;
          bool active_ = true;
      };
    harness: |
      #include <type_traits>
      int early(int& log) {
          ScopeGuard g([&log] { log += 1; });
          if (log >= 0) return 5;
          return 6;
      }
      int main() {
          int runs = 0;
          {
              ScopeGuard g([&runs] { runs++; });
              CHECK_EQ("not run while in scope", runs, 0);
          }
          CHECK_EQ("runs at end of scope", runs, 1);
          {
              ScopeGuard g([&runs] { runs++; });
              g.dismiss();
          }
          CHECK_EQ("dismissed guard does not run", runs, 1);
          int log = 0;
          CHECK_EQ("early return still returns", early(log), 5);
          CHECK_EQ("runs on early return", log, 1);
          CHECK("not copyable", !std::is_copy_constructible_v<ScopeGuard>);
      }
    hints:
      - "Store the function in a `std::function<void()> f_;` and a `bool active_ = true;`."
      - "The destructor: `if (active_ && f_) f_();`. `dismiss()` sets active_ to false."
      - "Delete the copy constructor and copy assignment, like the Lock step."
