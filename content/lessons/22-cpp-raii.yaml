id: cpp-raii
title: Lifetime and RAII
lang: cpp
phase: "C++: A Better C"
summary: Destructors, object lifetime and RAII, the idea that makes C++ memory-safe in practice. Plus copying and the rule of three.
steps:
  - title: Destructors
    id: cpp-raii-1
    text: |
      In C, cleaning up (calling `free`, `fclose`, unlocking) was your job, on every path out of every function. Forget it once and you have a leak. C++ has a feature that changes everything: the **destructor**.

      A destructor is a member function named `~ClassName()` that runs **automatically** when an object's lifetime ends. For a local variable, that's when execution leaves the block (`{ }`) it was declared in, whatever the reason: reaching the end, `return`, or `break`.

      ```cpp run
      #include <iostream>
      #include <string>

      struct Timer {
          std::string name;
          explicit Timer(std::string n) : name(n) { std::cout << "start " << name << "\n"; }
          ~Timer() { std::cout << "stop " << name << "\n"; }
      };

      int work(int x) {
          Timer t("work");
          if (x < 0) {
              return -1;
          }
          std::cout << "working on " << x << "\n";
          return x * 2;
      }

      int main() {
          work(5);
          work(-1);
          std::cout << "done\n";
      }
      ```

      ```output
      start work
      working on 5
      stop work
      start work
      stop work
      done
      ```

      ### What to notice

      - The constructor runs when `t` is created; the destructor runs when `work` returns.
      - On the early `return -1`, the destructor **still** runs. You didn't write any cleanup at that `return`; the compiler inserted it.
      - A destructor takes no parameters and returns nothing, and you never call it yourself.

      This guarantee ("the destructor always runs when the object goes away") is the foundation of safe resource management in C++, which the next steps build on. The **Watch it run** link shows the output appearing as each object is created and destroyed.

      **Your turn:** complete the destructor so the program prints the three lines shown in the tests.
    fill: |
      #include <iostream>

      struct Round {
          Round() { std::cout << "round start\n"; }
          [[~Round]]() { std::cout << "[[round end]]\n"; }
      };

      int main() {
          Round r;
          std::cout << "playing\n";
      }
    hints:
      - "A destructor's name is `~` followed by the class name: `~Round`."
    tests:
      - expect: "round start\nplaying\nround end"

  - title: Order of destruction
    id: cpp-raii-2
    text: |
      When several objects live in the same scope, the order in which they're destroyed follows a simple rule: **reverse order of construction**. The last object created is the first destroyed, like a stack of plates.

      ```cpp run
      #include <iostream>
      #include <string>

      struct Step {
          std::string name;
          explicit Step(std::string n) : name(n) { std::cout << "open " << name << "\n"; }
          ~Step() { std::cout << "close " << name << "\n"; }
      };

      int main() {
          Step outer("database");
          {
              Step inner("transaction");
              std::cout << "  doing work\n";
          }
          Step last("log");
          std::cout << "end of main\n";
      }
      ```

      ```output
      open database
      open transaction
        doing work
      close transaction
      open log
      end of main
      close log
      close database
      ```

      ### Why reverse order?

      Later objects often **depend on** earlier ones: a transaction uses a database connection, so the transaction must be closed before the connection. Destroying in reverse order makes that correct automatically.

      ### Blocks control lifetime

      A `{ }` block ends the lifetime of everything declared inside it. The inner block above closes the transaction **before** `log` is even created. Adding a block is the standard way to end an object's life early, for example to release a lock as soon as the critical work is done.

      Members of a class are destroyed in reverse order of their **declaration**, after the class's own destructor body runs, following the same logic.

      **Your turn:** without changing the struct, reorder and group the lines in `main` so the output is exactly:

      ```
      + A
      + B
      - B
      + C
      - C
      - A
      ```
    seed: |
      #include <iostream>
      #include <string>

      struct Tag {
          std::string name;
          Tag(std::string n) : name(n) { std::cout << "+ " << name << "\n"; }
          ~Tag() { std::cout << "- " << name << "\n"; }
      };

      int main() {
          Tag a("A");
          Tag b("B");
          Tag c("C");
      }
    solution: |
      #include <iostream>
      #include <string>

      struct Tag {
          std::string name;
          Tag(std::string n) : name(n) { std::cout << "+ " << name << "\n"; }
          ~Tag() { std::cout << "- " << name << "\n"; }
      };

      int main() {
          Tag a("A");
          {
              Tag b("B");
          }
          {
              Tag c("C");
          }
      }
    require:
      - pattern: "\\{\\s*Tag\\s+\\w+\\s*\\("
        message: "Control the lifetimes with `{ }` blocks around the objects in main."
    hints:
      - "B must die before C is born. Put `Tag b(\"B\");` inside its own `{ }` block."
      - Do the same for C. A lives until the end of main.
    tests:
      - expect: "+ A\n+ B\n- B\n+ C\n- C\n- A"

  - title: RAII
    id: cpp-raii-3
    text: |
      **RAII** stands for "Resource Acquisition Is Initialization". It's an awkward name for the most important idea in C++:

      > Tie every resource to an object. Acquire it in the constructor, release it in the destructor.

      Because destructors always run when the object goes away, the resource is always released: on normal exit, early return, or an exception. You can't forget, and you can't get the order wrong. Memory, files, locks, network connections and database transactions are all managed this way.

      ### new and delete

      C++'s versions of `malloc` and `free`:

      - `new T(args)` creates one object on the heap and returns a pointer; `delete p` destroys it.
      - `new T[n]` creates an array; `delete[] p` destroys it. Mixing them up (`delete` on an array) is undefined behavior.
      - `new int[n]()`: the `()` zero-initializes the elements.

      Unlike `malloc`, `new` runs constructors and `delete` runs destructors.

      ```cpp run
      #include <iostream>

      class Buffer {
      public:
          explicit Buffer(int n) : data_(new double[n]()), n_(n) {
              std::cout << "allocated " << n_ << "\n";
          }
          ~Buffer() {
              delete[] data_;
              std::cout << "freed " << n_ << "\n";
          }
          double& at(int i) { return data_[i]; }
          int size() const { return n_; }

      private:
          double* data_;
          int n_;
      };

      int main() {
          Buffer b(3);
          b.at(0) = 1.5;
          b.at(2) = b.at(0) * 2;
          std::cout << b.at(0) + b.at(1) + b.at(2) << "\n";
      }
      ```

      ```output
      allocated 3
      4.5
      freed 3
      ```

      `main` never calls `delete`. The `Buffer` owns its array and frees it in its destructor.

      ### Returning a reference

      `double& at(int i)` returns a **reference** to the element, so `b.at(0) = 1.5` writes into the array. Returning `double` would return a copy, and the assignment would change the copy.

      **Your turn:** finish `IntArray`: the destructor, plus `int size() const`, `int& at(int i)` (returns a reference so callers can write through it) and `int sum() const`.
    seed: |
      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          // destructor, size, at, sum

      private:
          int* data_;
          int n_;
      };
    solution: |
      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          // destructor, size, at, sum
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray&) = delete;
          IntArray& operator=(const IntArray&) = delete;
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          int sum() const {
              int s = 0;
              for (int i = 0; i < n_; i++) s += data_[i];
              return s;
          }

      private:
          int* data_;
          int n_;
      };
    require:
      - pattern: "~IntArray\\s*\\(\\s*\\)\\s*\\{[^}]*delete\\s*\\[\\s*\\]"
        message: "The destructor must release the memory with `delete[] data_;`."
    harness: |
      int main() {
          IntArray a(5);
          CHECK_EQ("size", a.size(), 5);
          CHECK_EQ("zero initialized", a.sum(), 0);
          a.at(0) = 10;
          a.at(4) = 7;
          CHECK_EQ("at() writes through", a.at(4), 7);
          CHECK_EQ("sum", a.sum(), 17);
          for (int k = 0; k < 1000; k++) {
              IntArray tmp(1000);
              tmp.at(999) = k;
          }
          CHECK("1000 temporary arrays freed cleanly", true);
      }
    hints:
      - "`~IntArray() { delete[] data_; }`"
      - "`int& at(int i) { return data_[i]; }` returns a reference, so `a.at(0) = 10` works."

  - title: The copy problem
    id: cpp-raii-4
    text: |
      RAII classes have a hidden trap. When you copy an object, C++ by default copies each **member**. For a class holding a raw pointer, that copies the **pointer**, not the data it points to. Now two objects point at the same array:

      ```
      a.data_ ──┐
                ├──> [ 1 2 3 ]
      b.data_ ──┘
      ```

      Changing `b` changes `a`. Worse, when both are destroyed, both destructors `delete[]` the same array: a **double free**, which crashes or corrupts memory.

      ### The fix: a deep copy

      Write a **copy constructor**, the constructor that builds a new object from an existing one of the same type. It takes a `const` reference to the original and allocates **new** memory with the same contents:

      ```cpp run
      #include <iostream>
      #include <cstring>

      class Name {
      public:
          explicit Name(const char* s) : text_(new char[std::strlen(s) + 1]) { std::strcpy(text_, s); }
          Name(const Name& other) : text_(new char[std::strlen(other.text_) + 1]) {
              std::strcpy(text_, other.text_);
          }
          ~Name() { delete[] text_; }
          Name& operator=(const Name&) = delete;
          void upper_first() { text_[0] = text_[0] - 'a' + 'A'; }
          const char* c_str() const { return text_; }

      private:
          char* text_;
      };

      int main() {
          Name a("ada");
          Name b = a;
          b.upper_first();
          std::cout << a.c_str() << " " << b.c_str() << "\n";
      }
      ```

      ```output
      ada Ada
      ```

      `Name b = a;` calls the copy constructor, which gives `b` its own characters. Changing `b` doesn't affect `a`, and each destructor frees its own memory.

      ### The rule of three

      If a class needs a custom **destructor**, it almost certainly needs a custom **copy constructor** and **copy assignment operator** too, because all three deal with the same owned resource. (Here copy assignment is simply forbidden with `= delete`; the next steps cover both options.)

      **Your turn:** add the deep-copy constructor. (Copy assignment is provided.)
    seed: |
      #include <algorithm>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          // copy constructor goes here

          IntArray& operator=(IntArray other) {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    solution: |
      #include <algorithm>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          // copy constructor goes here
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          IntArray& operator=(IntArray other) {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    harness: |
      int main() {
          IntArray a(3);
          a.at(0) = 1; a.at(1) = 2; a.at(2) = 3;
          IntArray b = a;
          CHECK("copy has its own memory", b.raw() != a.raw());
          CHECK_EQ("copy has same size", b.size(), 3);
          CHECK_EQ("copy has same values", b.at(2), 3);
          b.at(0) = 99;
          CHECK_EQ("changing the copy leaves the original alone", a.at(0), 1);
          IntArray c(1);
          c = a;
          CHECK_EQ("assignment copies values", c.at(1), 2);
      }
    hints:
      - "Signature: `IntArray(const IntArray& other)`."
      - "Allocate new memory of `other.n_` ints, then copy each element in a loop."

  - title: Non-copyable classes
    id: cpp-raii-5
    text: |
      For some resources, copying makes no sense at all. What would it mean to copy an open network connection, a lock on a mutex, or a handle to a unique hardware device? Two objects would both think they own it and both try to release it.

      The right answer is to **forbid copying**. Write the copy operations and mark them `= delete`:

      ```cpp run
      #include <iostream>
      #include <type_traits>

      class Connection {
      public:
          explicit Connection(int id) : id_(id) { std::cout << "connect " << id_ << "\n"; }
          ~Connection() { std::cout << "disconnect " << id_ << "\n"; }
          Connection(const Connection&) = delete;
          Connection& operator=(const Connection&) = delete;
          int id() const { return id_; }

      private:
          int id_;
      };

      void use(const Connection& c) {
          std::cout << "using " << c.id() << "\n";
      }

      int main() {
          Connection c(7);
          use(c);
          std::cout << std::is_copy_constructible_v<Connection> << "\n";
      }
      ```

      ```output
      connect 7
      using 7
      0
      disconnect 7
      ```

      Now `Connection d = c;` is a compile error: `use of deleted function`. The mistake is caught before the program ever runs. Passing by reference (`const Connection&`) still works, because no copy is made.

      ### Two assignment operators

      There are two copy operations to delete:

      - The **copy constructor** `Connection(const Connection&)`, used for `Connection d = c;`.
      - The **copy assignment operator** `Connection& operator=(const Connection&)`, used for `d = c;` when `d` already exists.

      `std::is_copy_constructible_v<T>` (from `<type_traits>`) asks the compiler, at compile time, whether a type can be copied. It's how the tests on this step check your class.

      Non-copyable types can still be **moved** (handing over ownership), which is covered in the move semantics module. `std::unique_ptr` is the standard library's best-known non-copyable type.

      **Your turn:** make `Lock` non-copyable. The tests check it at compile time with `std::is_copy_constructible_v`.
    seed: |
      class Lock {
      public:
          Lock() = default;
          // forbid copying here

      };
    solution: |
      class Lock {
      public:
          Lock() = default;
          // forbid copying here
          Lock(const Lock&) = delete;
          Lock& operator=(const Lock&) = delete;
      };
    harness: |
      #include <type_traits>
      int main() {
          CHECK("Lock can be created", std::is_default_constructible_v<Lock>);
          CHECK("Lock cannot be copy-constructed", !std::is_copy_constructible_v<Lock>);
          CHECK("Lock cannot be copy-assigned", !std::is_copy_assignable_v<Lock>);
      }
    hints:
      - "`Lock(const Lock&) = delete;`"
      - "`Lock& operator=(const Lock&) = delete;`"

  - title: Copy assignment with copy-and-swap
    id: cpp-raii-6
    text: |
      **Copy assignment** (`a = b;` where `a` already exists) is trickier than the copy constructor, because `a` already owns a resource. A correct version must:

      1. Make a copy of `b`'s data.
      2. Release `a`'s old data.
      3. Handle **self-assignment** (`a = a;`), which a naive version breaks by freeing the data before copying it.
      4. Ideally, leave `a` unchanged if making the copy fails.

      The classic solution is **copy-and-swap**. Take the parameter **by value** (so the compiler makes the copy using your copy constructor), then **swap** your members with the copy's:

      ```cpp run
      #include <iostream>
      #include <utility>

      class Box {
      public:
          explicit Box(int v) : p_(new int(v)) {}
          Box(const Box& o) : p_(new int(*o.p_)) {}
          ~Box() { delete p_; }
          void swap(Box& o) noexcept { std::swap(p_, o.p_); }
          Box& operator=(Box other) {
              swap(other);
              return *this;
          }
          int get() const { return *p_; }

      private:
          int* p_;
      };

      int main() {
          Box a(1), b(2);
          a = b;
          a = a;
          Box c(3);
          c = a;
          std::cout << a.get() << " " << b.get() << " " << c.get() << "\n";
      }
      ```

      ```output
      2 2 2
      ```

      ### Why it works

      - The parameter `other` is already a fresh copy. If copying fails, it fails **before** anything in `*this` changed.
      - `swap` gives `*this` the new data and gives `other` the old data.
      - When `operator=` returns, `other` goes out of scope and its destructor frees the old data. No explicit `delete` needed.
      - Self-assignment is safe automatically: you copy first, then swap.

      `operator=` returns `*this` by reference, so assignments can chain (`a = b = c`). The `swap` member is marked `noexcept` because swapping two pointers can't fail, and the standard library relies on that promise.

      **Your turn:** write the member `swap` and the copy-and-swap `operator=`.
    seed: |
      #include <utility>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          // swap and operator= here

          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    solution: |
      #include <utility>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          // swap and operator= here
          void swap(IntArray& other) noexcept {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
          }
          IntArray& operator=(IntArray other) {
              swap(other);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    harness: |
      int main() {
          IntArray a(3);
          a.at(0) = 1; a.at(1) = 2; a.at(2) = 3;
          IntArray b(5);
          b = a;
          CHECK_EQ("size after assignment", b.size(), 3);
          CHECK_EQ("values after assignment", b.at(2), 3);
          CHECK("b has its own memory", b.raw() != a.raw());
          b.at(0) = 50;
          CHECK_EQ("a is unaffected", a.at(0), 1);
          IntArray& alias = a;
          a = alias;
          CHECK_EQ("self-assignment keeps values", a.at(1), 2);
          IntArray x(1), y(2);
          x.swap(y);
          CHECK("swap exchanges sizes", x.size() == 2 && y.size() == 1);
      }
    hints:
      - "`void swap(IntArray& other) noexcept` swaps both members with `std::swap`."
      - "`IntArray& operator=(IntArray other) { swap(other); return *this; }` (note: other is taken **by value**)."

  - title: The rule of zero
    id: cpp-raii-7
    text: |
      The last few steps showed how much careful code a class needs when it holds a **raw owning pointer**: a destructor, a deep-copying copy constructor, copy assignment, and (later) move operations. Getting all of them right is hard, and it's easy to forget one.

      The modern answer: **don't hold raw owning pointers**. Use members that already manage themselves:

      - `std::vector<T>` instead of `new T[n]`
      - `std::string` instead of `new char[n]`
      - `std::unique_ptr<T>` instead of `new T`

      Their own destructors, copies and moves are correct, and the compiler-generated versions for **your** class simply call theirs, member by member. So you write none of the special functions. This is the **rule of zero**, and it's how most classes in modern C++ are written.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      class Playlist {
      public:
          void add(const std::string& song) { songs_.push_back(song); }
          int count() const { return songs_.size(); }
          const std::string& first() const { return songs_.front(); }

      private:
          std::string name_ = "mix";
          std::vector<std::string> songs_;
      };

      int main() {
          Playlist a;
          a.add("intro");
          a.add("outro");
          Playlist b = a;
          b.add("bonus");
          std::cout << a.count() << " " << b.count() << " " << b.first() << "\n";
      }
      ```

      ```output
      2 3 intro
      ```

      Copying `a` into `b` makes a real, independent copy of the vector of strings, with no code from you. Destroying both frees everything correctly.

      ### When do you still write them?

      Only in low-level classes whose whole job is to wrap one resource (like the `IntArray` you just wrote, or a wrapper for a C library handle). Everything else composes those building blocks and follows the rule of zero.

      **Your turn:** write class `Inventory` with the rule of zero: `void add(const std::string& item)`, `int count() const`, `bool has(const std::string& item) const`, `void clear()`. No `new`, no `delete`, no destructor.
    seed: |
      #include <string>
      #include <vector>

      class Inventory {
      public:

      private:

      };
    solution: |
      #include <algorithm>
      #include <string>
      #include <vector>

      class Inventory {
      public:
          void add(const std::string& item) { items_.push_back(item); }
          int count() const { return static_cast<int>(items_.size()); }
          bool has(const std::string& item) const {
              return std::find(items_.begin(), items_.end(), item) != items_.end();
          }
          void clear() { items_.clear(); }

      private:
          std::vector<std::string> items_;
      };
    forbid:
      - pattern: "\\bnew\\b|\\bdelete\\b|~\\s*Inventory"
        message: "Rule of zero: let a `std::vector` own the items. No `new`, `delete` or destructor."
    harness: |
      int main() {
          Inventory a;
          a.add("ak47");
          a.add("deagle");
          CHECK_EQ("count", a.count(), 2);
          CHECK_EQ("has ak47", a.has("ak47"), true);
          CHECK_EQ("no awp", a.has("awp"), false);
          Inventory b = a;
          b.add("awp");
          CHECK_EQ("copy is independent", a.count(), 2);
          CHECK_EQ("copy got the new item", b.count(), 3);
          a = b;
          CHECK_EQ("assignment copies", a.has("awp"), true);
          a.clear();
          CHECK_EQ("clear empties it", a.count(), 0);
          CHECK_EQ("b is untouched by a.clear()", b.count(), 3);
      }
    hints:
      - "Keep a `std::vector<std::string> items_;` as the only data member."
      - "`has` can use `std::find(items_.begin(), items_.end(), item) != items_.end()` from `<algorithm>`."

  - title: "Challenge: a scope guard"
    id: cpp-raii-8
    text: |
      RAII isn't only about memory. **Any** action that must happen when you leave a scope can be tied to a destructor: closing a file, unlocking a mutex, rolling back a half-finished transaction, restoring a setting you changed temporarily, printing "done" in a log.

      A **scope guard** is a small, general-purpose RAII class: it holds a function and calls it from its destructor. Many large codebases have one (C++ proposals call it `scope_exit`).

      ### std::function and lambdas

      `std::function<void()>` (from `<functional>`) can store **any** callable that takes no arguments and returns nothing: a plain function, or a **lambda**. A lambda is an unnamed function written inline, with a **capture list** saying which outside variables it may use: `[&count]() { count++; }` captures `count` by reference. Lambdas get a full module later; this is enough to use them here.

      ```cpp run
      #include <functional>
      #include <iostream>

      class OnExit {
      public:
          explicit OnExit(std::function<void()> f) : f_(f) {}
          ~OnExit() { f_(); }
          OnExit(const OnExit&) = delete;
          OnExit& operator=(const OnExit&) = delete;

      private:
          std::function<void()> f_;
      };

      int main() {
          int depth = 0;
          {
              depth++;
              OnExit undo([&depth]() { depth--; });
              std::cout << "inside, depth " << depth << "\n";
          }
          std::cout << "after, depth " << depth << "\n";
      }
      ```

      ```output
      inside, depth 1
      after, depth 0
      ```

      ### Dismissing

      A scope guard is often used for **rollback**: set it up at the start of an operation, and if the operation completes successfully, call `dismiss()` so the undo doesn't run. On any early exit (an error return), the destructor still rolls things back. A `bool` member that `dismiss()` sets is enough; the destructor checks it before calling the function.

      A guard must not be copyable, or two copies would run the action twice.

      **Your turn:** write class `ScopeGuard`:

      - `explicit ScopeGuard(std::function<void()> f)`
      - the destructor calls `f` unless dismissed
      - `void dismiss()`
      - it must not be copyable (two copies would run the action twice)
    seed: |
      #include <functional>
      #include <utility>

      class ScopeGuard {
      public:

      private:

      };
    solution: |
      #include <functional>
      #include <utility>

      class ScopeGuard {
      public:
          explicit ScopeGuard(std::function<void()> f) : f_(std::move(f)) {}
          ~ScopeGuard() {
              if (active_ && f_) f_();
          }
          ScopeGuard(const ScopeGuard&) = delete;
          ScopeGuard& operator=(const ScopeGuard&) = delete;
          void dismiss() { active_ = false; }

      private:
          std::function<void()> f_;
          bool active_ = true;
      };
    harness: |
      #include <type_traits>
      int early(int& log) {
          ScopeGuard g([&log] { log += 1; });
          if (log >= 0) return 5;
          return 6;
      }
      int main() {
          int runs = 0;
          {
              ScopeGuard g([&runs] { runs++; });
              CHECK_EQ("not run while in scope", runs, 0);
          }
          CHECK_EQ("runs at end of scope", runs, 1);
          {
              ScopeGuard g([&runs] { runs++; });
              g.dismiss();
          }
          CHECK_EQ("dismissed guard does not run", runs, 1);
          int log = 0;
          CHECK_EQ("early return still returns", early(log), 5);
          CHECK_EQ("runs on early return", log, 1);
          CHECK("not copyable", !std::is_copy_constructible_v<ScopeGuard>);
      }
    hints:
      - "Store the function in a `std::function<void()> f_;` and a `bool active_ = true;`."
      - "The destructor: `if (active_ && f_) f_();`. `dismiss()` sets active_ to false."
      - "Delete the copy constructor and copy assignment, like the Lock step."
