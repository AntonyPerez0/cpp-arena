              CHECK("erase again fails", !s.erase(42));
              CHECK_EQ("size 99", s.size(), 99u);
              CHECK("neighbours in the same bucket survive", s.contains(58) && s.contains(26));
              CHECK("erase something never added", !s.erase(-5));
              CHECK("can insert it again", s.insert(42) && s.size() == 100);
