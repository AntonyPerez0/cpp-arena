id: dsa-hash
title: Hash tables
lang: cpp
phase: "Data Structures and Algorithms"
summary: Build the data structure behind unordered_map. Buckets and chaining, load factor and rehashing, a string-keyed map with erase, custom hashes for your own keys, and an LRU cache.
steps:
  - title: Buckets and chaining
    id: dsa-hash-1
    text: |
      You've used `std::unordered_map` and `std::unordered_set` for O(1) lookups. This module builds one yourself, so you know what's going on inside, why it's fast, and when it isn't.

      A **hash table** stores items in an array of **buckets**. A **hash function** turns a key into a number, and `hash % bucket_count` picks the bucket. To look up a key, you compute its bucket and search **only that bucket**. With a good hash and enough buckets, each bucket holds just a few items, so lookup is O(1) on average.

      Two keys can land in the same bucket: a **collision**. **Separate chaining** handles that by making each bucket a small list:

      ```
      bucket 0: [16] -> [48]
      bucket 1: [ ]
      bucket 2: [2] -> [34]
      ```

      ```cpp run
      #include <iostream>
      #include <list>
      #include <string>
      #include <vector>

      int main() {
          const std::size_t buckets = 5;
          std::vector<std::list<std::string>> table(buckets);

          auto bucket_of = [&](const std::string& word) {
              std::size_t h = 0;
              for (char c : word) h = h * 31 + (unsigned char)c;   // a simple string hash
              return h % buckets;
          };

          for (const char* w : {"cat", "dog", "owl", "bee", "ant", "yak"}) {
              table[bucket_of(w)].push_back(w);
          }
          for (std::size_t b = 0; b < buckets; b++) {
              std::cout << "bucket " << b << ":";
              for (const auto& w : table[b]) std::cout << " " << w;
              std::cout << "\n";
          }
          std::cout << "owl is in bucket " << bucket_of("owl") << "\n";
      }
      ```

      ```output
      bucket 0: bee yak
      bucket 1:
      bucket 2: cat
      bucket 3: owl ant
      bucket 4: dog
      owl is in bucket 3
      ```

      ### How it works

      - The hash function mixes every character into one number. Any function works as long as the **same key always gives the same hash**; a good one also spreads different keys evenly across the buckets.
      - `% buckets` turns that big number into a valid bucket index.
      - To look up `"owl"`, you hash it, go to its bucket, and search only that short list, never the whole table.
      - Two words sharing a bucket, like `bee` and `yak`, is fine: the list holds both, and lookups compare the actual keys. Bucket 1 being empty is fine too.

      For built-in types, `std::hash<T>{}(key)` gives you a ready-made hash. For `int` it's often just the value itself.

      ### Your task

      `IntSet` has 16 buckets, each a `std::list<int>`.

      - `insert`: find the bucket with `std::hash<int>{}(key) % buckets_.size()`. If the key is already in that list, return `false`; otherwise `push_back` it, increase `size_`, and return `true`.
      - `contains`: search the same bucket.

      `std::find(list.begin(), list.end(), key)` from `<algorithm>` searches a list for you.

      **Your turn:** write `IntSet` with 16 buckets (a `std::vector<std::list<int>>`): `bool insert(int)` (false if already present), `bool contains(int) const`, and `std::size_t size() const`.
    seed: |
      #include <functional>
      #include <list>
      #include <vector>

      class IntSet {
      public:
          bool insert(int key);
          bool contains(int key) const;
          std::size_t size() const { return size_; }

      private:
          std::vector<std::list<int>> buckets_ = std::vector<std::list<int>>(16);
          std::size_t size_ = 0;
      };
    solution: |
      #include <algorithm>
      #include <functional>
      #include <list>
      #include <vector>

      class IntSet {
      public:
          bool insert(int key);
          bool contains(int key) const;
          std::size_t size() const { return size_; }

      private:
          std::size_t bucket_of(int key) const { return std::hash<int>{}(key) % buckets_.size(); }
          std::vector<std::list<int>> buckets_ = std::vector<std::list<int>>(16);
          std::size_t size_ = 0;
      };

      bool IntSet::insert(int key) {
          auto& b = buckets_[bucket_of(key)];
          if (std::find(b.begin(), b.end(), key) != b.end()) return false;
          b.push_back(key);
          size_++;
          return true;
      }

      bool IntSet::contains(int key) const {
          const auto& b = buckets_[bucket_of(key)];
          return std::find(b.begin(), b.end(), key) != b.end();
      }
    forbid:
      - pattern: "unordered_set|unordered_map|std::set|std::map"
        message: Build it from buckets yourself on this step.
    harness: |
      int main() {
          IntSet s;
          CHECK_EQ("insert 5", s.insert(5), true);
          CHECK_EQ("insert 21 (same bucket as 5)", s.insert(21), true);
          CHECK_EQ("insert 5 again", s.insert(5), false);
          CHECK_EQ("contains 21", s.contains(21), true);
          CHECK_EQ("does not contain 37", s.contains(37), false);
          CHECK_EQ("negative keys", s.insert(-3) && s.contains(-3), true);
          CHECK_EQ("size", s.size(), 3u);
          for (int i = 0; i < 1000; i++) s.insert(i);
          CHECK_EQ("size after 1000 inserts", s.size(), 1001u);
      }
    hints:
      - "Write a helper: `std::size_t bucket_of(int key) const { return std::hash<int>{}(key) % buckets_.size(); }`"
      - "insert: search that bucket's list with `std::find`; if absent, push_back and grow size_."
      - "contains: same search, return whether it was found."
