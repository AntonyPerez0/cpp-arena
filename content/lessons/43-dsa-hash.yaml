      - task: |
          Write `RecentSearches`, which keeps the last `k` **different** searches, most recent first. `add(query)` puts the query at the front (moving it there if it's already in the list) and drops the oldest when there are more than `k`. Both operations must be O(1): a `std::list` for the order and an `std::unordered_map` from query to its list iterator.
