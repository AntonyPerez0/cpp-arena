              CHECK_EQ("empty chain", s.longest_chain(), 0u);
              for (int i = 0; i < 8; i++) s.insert(i);
              CHECK("8 of 16", s.load_factor() == 0.5);
              for (int i = 0; i < 100000; i++) s.insert(i);
              CHECK("growth keeps the load at most 0.75", s.load_factor() <= 0.75);
              CHECK("and the chains short", s.longest_chain() <= 8);
          }
        hints:
          - "Cast before dividing: `(double)size_ / buckets_.size()`."
      - task: |
          Make the open-addressing set grow. `GrowingProbeSet` starts with 8 slots; whenever an insert would make the table more than **half** full, first rebuild it with twice as many slots, re-inserting every key (their slots change, because the modulus changes). The test inserts 200,000 keys.
        seed: |
          #include <functional>
          #include <vector>

          class GrowingProbeSet {
          public:
              bool insert(int key);
              bool contains(int key) const;
              std::size_t size() const { return size_; }
              std::size_t capacity() const { return keys_.size(); }

          private:
              std::vector<int> keys_ = std::vector<int>(8);
              std::vector<char> used_ = std::vector<char>(8, 0);
              std::size_t size_ = 0;
          };
        solution: |
          #include <functional>
          #include <vector>

          class GrowingProbeSet {
          public:
              bool insert(int key) {
                  if (contains(key)) return false;
                  if ((size_ + 1) * 2 > keys_.size()) grow();
                  place(key);
                  size_++;
                  return true;
              }
              bool contains(int key) const { return used_[slot_for(key)] != 0; }
              std::size_t size() const { return size_; }
              std::size_t capacity() const { return keys_.size(); }

          private:
              std::size_t slot_for(int key) const {
                  std::size_t i = std::hash<int>{}(key) % keys_.size();
                  while (used_[i] && keys_[i] != key) i = (i + 1) % keys_.size();
                  return i;
              }
              void place(int key) {
                  std::size_t i = slot_for(key);
                  used_[i] = 1;
                  keys_[i] = key;
              }
              void grow() {
                  std::vector<int> old_keys = std::move(keys_);
                  std::vector<char> old_used = std::move(used_);
                  keys_.assign(old_keys.size() * 2, 0);
                  used_.assign(old_keys.size() * 2, 0);
                  for (std::size_t i = 0; i < old_keys.size(); i++)
                      if (old_used[i]) place(old_keys[i]);
              }
              std::vector<int> keys_ = std::vector<int>(8);
              std::vector<char> used_ = std::vector<char>(8, 0);
              std::size_t size_ = 0;
          };
        forbid:
          - pattern: "unordered_set|unordered_map|std::set|std::map|std::list"
            message: Keep the keys in the probing table itself.
        harness: |
          int main() {
              GrowingProbeSet s;
              for (int i = 0; i < 4; i++) s.insert(i);
              CHECK_EQ("4 keys fit in 8 slots", s.capacity(), 8u);
              s.insert(4);
              CHECK_EQ("the 5th doubles it", s.capacity(), 16u);
              CHECK("duplicate", !s.insert(4));
              for (int i = 0; i < 200000; i++) s.insert(i * 7);
              CHECK("at most half full", s.size() * 2 <= s.capacity());
              bool all = true;
              for (int i = 0; i < 200000; i++) all = all && s.contains(i * 7);
              CHECK("200,000 keys found after many rebuilds", all && s.contains(3) && !s.contains(-1));
          }
        hints:
          - "Move the old arrays out, allocate bigger empty ones, then put each old key back with the usual probing."
          - "Check for duplicates before growing, so a repeated key doesn't trigger a rebuild."

  - title: A string-keyed map with erase
    id: dsa-hash-3
    text: |
      A **map** is a set that carries a value with each key. The buckets store **key/value pairs** instead of bare keys, and every operation hashes the key, goes to one bucket, and works on that one short list.

      ```cpp run
      #include <functional>
      #include <iostream>
      #include <list>
      #include <string>
      #include <utility>
      #include <vector>

      int main() {
          using Bucket = std::list<std::pair<std::string, double>>;
          std::vector<Bucket> table(8);
          auto bucket_for = [&](const std::string& k) -> Bucket& {
              return table[std::hash<std::string>{}(k) % table.size()];
          };

          // put: overwrite if the key exists, else append
          auto put = [&](const std::string& k, double v) {
              for (auto& [key, val] : bucket_for(k)) {
                  if (key == k) { val = v; return; }
              }
              bucket_for(k).emplace_back(k, v);
          };
          // erase: find the pair's position in its list and remove it
          auto erase = [&](const std::string& k) {
              Bucket& b = bucket_for(k);
              for (auto it = b.begin(); it != b.end(); ++it) {
                  if (it->first == k) { b.erase(it); return true; }
              }
              return false;
          };

          put("gold", 1900.5);
          put("silver", 23.1);
          put("gold", 1950.0);                       // overwrite
          std::cout << erase("silver") << erase("copper") << "\n";
          for (const auto& b : table)
              for (const auto& [k, v] : b) std::cout << k << " = " << v << "\n";
      }
      ```

      ```output
      10
      gold = 1950
      ```

      ### How it works

      - `put` searches the key's bucket. If the key is already there, it **overwrites** the value through a reference (`auto& [key, val]`); otherwise it appends a new pair.
      - `erase` walks the bucket with an **iterator**, because `list::erase` needs one. It returns right after erasing, so the now-invalid iterator is never used again.
      - Iterating over the whole table visits every pair, in no meaningful order. That's why `unordered_map` has "unordered" in its name.

      ### Returning "maybe a value" as a pointer

      Your `get` returns `const int*`: a pointer to the value inside the table if the key exists, or `nullptr` if it doesn't. It avoids copying and signals "missing" without a separate flag, which is how many C-style APIs work. `&pair.second` gives the pointer. Remember to adjust `size_` in `put` (only for new keys) and in `erase`.

      `std::hash<std::string>` hashes strings for you. (Under the hood it runs something like the FNV or MurmurHash functions over the bytes.)

      **Your turn:** write `StrMap` (a fixed 64 buckets is fine here) with:

      - `void put(const std::string& key, int value)`: insert or overwrite
      - `const int* get(const std::string& key) const`: pointer to the value, or `nullptr`
      - `bool erase(const std::string& key)`
      - `std::size_t size() const`
