          #include <unordered_map>
          #include <utility>
          #include <vector>

          std::vector<std::pair<std::string, int>> top_words(const std::string& text, int k) {
              std::unordered_map<std::string, int> count;
              std::string w;
              for (char c : text + " ") {
                  if (c >= 'a' && c <= 'z') {
                      w += c;
                  } else if (!w.empty()) {
                      count[w]++;
                      w.clear();
                  }
              }
              std::vector<std::pair<std::string, int>> out(count.begin(), count.end());
