          class TtlCache {
          public:
              TtlCache(std::size_t capacity, long ttl) : capacity_(capacity), ttl_(ttl) {}
              std::optional<int> get(int key, long now);
              void put(int key, int value, long now);
              std::size_t size() const { return items_.size(); }

          private:
              struct Entry {
                  int key;
                  int value;
                  long stored;
              };
