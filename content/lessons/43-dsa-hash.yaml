      - task: |
          Give the LRU cache **expiry**. `put(key, value, now)` stores the value with its time, making it most recent. `get(key, now)` returns `std::nullopt` and removes the entry if it was stored at least `ttl` time units ago; otherwise it returns the value and makes it most recent. Over capacity, `put` evicts the least recently used entry. All O(1).
