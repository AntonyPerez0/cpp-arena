      - task: |
          **Open addressing** keeps keys in the table itself instead of in lists. Write `ProbeSet` with 64 slots: to insert or look up a key, start at `hash % 64` and step to the next slot (wrapping around) until you find the key or an empty slot. `insert` returns false for a key that's already there; assume the table never gets full.
        seed: |
          #include <functional>
          #include <vector>

          class ProbeSet {
          public:
              bool insert(int key);
              bool contains(int key) const;
              std::size_t size() const { return size_; }

          private:
              std::vector<int> keys_ = std::vector<int>(64);
              std::vector<char> used_ = std::vector<char>(64, 0);
              std::size_t size_ = 0;
          };
        solution: |
          #include <functional>
          #include <vector>

          class ProbeSet {
          public:
              bool insert(int key) {
                  std::size_t i = slot_for(key);
                  if (used_[i]) return false;
                  used_[i] = 1;
                  keys_[i] = key;
                  size_++;
                  return true;
              }
              bool contains(int key) const { return used_[slot_for(key)] != 0; }
              std::size_t size() const { return size_; }

          private:
              // The slot holding key, or the empty slot where it would go.
              std::size_t slot_for(int key) const {
                  std::size_t i = std::hash<int>{}(key) % keys_.size();
                  while (used_[i] && keys_[i] != key) i = (i + 1) % keys_.size();
                  return i;
              }
              std::vector<int> keys_ = std::vector<int>(64);
              std::vector<char> used_ = std::vector<char>(64, 0);
              std::size_t size_ = 0;
          };
        forbid:
          - pattern: "unordered_set|unordered_map|std::set|std::map|std::list"
            message: Keep the keys in the probing table itself.
        harness: |
          int main() {
              ProbeSet s;
              CHECK("insert 5", s.insert(5));
              CHECK("duplicate", !s.insert(5));
              CHECK("69 collides with 5 (69 % 64 == 5) and still fits", s.insert(69));
              CHECK("both found", s.contains(5) && s.contains(69));
              CHECK("133 also collides but was never added", !s.contains(133));
              for (int i = 100; i < 140; i++) s.insert(i);
              CHECK_EQ("size", s.size(), 42u);
              bool all = true;
              for (int i = 100; i < 140; i++) all = all && s.contains(i);
              CHECK("all 40 found", all);
              CHECK("63 wraps to the start of the table", s.insert(63) && s.insert(127 + 64) && s.contains(191));
          }
        hints:
          - "A private helper that returns the slot holding the key, or the first empty slot on its path, serves both `insert` and `contains`."

  - title: Load factor and rehashing
    id: dsa-hash-2
    text: |
      A hash table's speed depends on keeping the buckets short. With a fixed 16 buckets, a million keys means about 62,500 per bucket, and "O(1)" becomes a slow linear search.

      The **load factor** is `size / bucket_count`, the average number of keys per bucket. When it passes a threshold (0.75 is common; `std::unordered_map` uses 1.0), the table **rehashes**: it allocates about twice as many buckets and reinserts every key. Every key has to move, because its bucket, `hash % bucket_count`, depends on the bucket count.

      You can watch `std::unordered_set` do exactly this:

      ```cpp run
      #include <iostream>
      #include <unordered_set>

      int main() {
          std::unordered_set<int> s;
          std::size_t start = s.bucket_count();
          int rehashes = 0;
          std::size_t last = start;
          for (int i = 0; i < 1000; i++) {
              s.insert(i);
              if (s.bucket_count() != last) {
                  rehashes++;
                  last = s.bucket_count();
              }
          }
          std::cout << "grew several times: " << (rehashes >= 3) << "\n";
          std::cout << "at least one bucket per key: " << (s.bucket_count() >= s.size()) << "\n";
          std::cout << "load factor within the limit: " << (s.load_factor() <= s.max_load_factor()) << "\n";
      }
      ```

      ```output
      grew several times: 1
      at least one bucket per key: 1
      load factor within the limit: 1
      ```

      The exact bucket counts differ between standard library implementations (some use prime numbers, some powers of two), so the example checks the rules rather than printing the sizes. With GCC's library, the set grows to 13, 29, 59, 127 buckets and so on, roughly doubling each time, and never lets the load factor pass 1.0.

      ### Why growing keeps inserts O(1)

      A rehash costs O(n), since every key moves. But it only happens when the size doubles. Add up all the rehash work while inserting n keys: n/2 + n/4 + n/8 + ... which is less than n. Spread over n inserts, that's O(1) extra per insert: **O(1) amortized**, the same argument as `std::vector` growth.

      ### Your task

      After inserting, check `size_ > 0.75 * buckets_.size()`. If so:

      1. Create a new vector of lists with twice as many buckets.
      2. Move every key from every old bucket into its **new** bucket, computed with the **new** bucket count.
      3. Replace `buckets_` with the new vector.

      Since `bucket_of` uses `buckets_.size()`, compute the new bucket index directly with the new size while moving (or swap first and then reinsert from the old table).

      **Your turn:** extend `IntSet` so that after an insert makes `size > 0.75 * bucket_count`, it rehashes into twice as many buckets. The test inserts 200,000 keys, which is only fast if the table grows.
    seed: |
      #include <algorithm>
      #include <functional>
      #include <list>
      #include <vector>

      class IntSet {
      public:
          bool insert(int key) {
              auto& b = buckets_[bucket_of(key)];
              if (std::find(b.begin(), b.end(), key) != b.end()) return false;
              b.push_back(key);
              size_++;
              // grow here when the load factor passes 0.75
              return true;
          }
          bool contains(int key) const {
              const auto& b = buckets_[bucket_of(key)];
              return std::find(b.begin(), b.end(), key) != b.end();
          }
          std::size_t size() const { return size_; }
          std::size_t bucket_count() const { return buckets_.size(); }

      private:
          std::size_t bucket_of(int key) const { return std::hash<int>{}(key) % buckets_.size(); }
          std::vector<std::list<int>> buckets_ = std::vector<std::list<int>>(16);
          std::size_t size_ = 0;
      };
    solution: |
      #include <algorithm>
      #include <functional>
      #include <list>
      #include <vector>

      class IntSet {
      public:
          bool insert(int key) {
              auto& b = buckets_[bucket_of(key)];
              if (std::find(b.begin(), b.end(), key) != b.end()) return false;
              b.push_back(key);
              size_++;
              // grow here when the load factor passes 0.75
              if (size_ * 4 > buckets_.size() * 3) rehash(buckets_.size() * 2);
              return true;
          }
          bool contains(int key) const {
              const auto& b = buckets_[bucket_of(key)];
              return std::find(b.begin(), b.end(), key) != b.end();
          }
          std::size_t size() const { return size_; }
          std::size_t bucket_count() const { return buckets_.size(); }

      private:
          void rehash(std::size_t n) {
              std::vector<std::list<int>> old(n);
              old.swap(buckets_);
              for (auto& bucket : old)
                  for (int key : bucket) buckets_[bucket_of(key)].push_back(key);
          }
          std::size_t bucket_of(int key) const { return std::hash<int>{}(key) % buckets_.size(); }
          std::vector<std::list<int>> buckets_ = std::vector<std::list<int>>(16);
          std::size_t size_ = 0;
      };
