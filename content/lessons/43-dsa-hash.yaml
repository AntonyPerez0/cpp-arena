              long ttl_;
              std::list<Entry> items_;
              std::unordered_map<int, std::list<Entry>::iterator> where_;
          };
        solution: |
          #include <list>
          #include <optional>
          #include <unordered_map>

          class TtlCache {
          public:
              TtlCache(std::size_t capacity, long ttl) : capacity_(capacity), ttl_(ttl) {}
              std::optional<int> get(int key, long now) {
                  auto it = where_.find(key);
                  if (it == where_.end()) return std::nullopt;
                  if (now - it->second->stored >= ttl_) {
                      items_.erase(it->second);
                      where_.erase(it);
                      return std::nullopt;
                  }
                  items_.splice(items_.begin(), items_, it->second);
                  return it->second->value;
              }
              void put(int key, int value, long now) {
                  auto it = where_.find(key);
                  if (it != where_.end()) {
                      it->second->value = value;
                      it->second->stored = now;
                      items_.splice(items_.begin(), items_, it->second);
                      return;
                  }
                  items_.push_front({key, value, now});
                  where_[key] = items_.begin();
                  if (items_.size() > capacity_) {
                      where_.erase(items_.back().key);
                      items_.pop_back();
                  }
              }
              std::size_t size() const { return items_.size(); }

          private:
              struct Entry {
                  int key;
                  int value;
                  long stored;
              };
              std::size_t capacity_;
              long ttl_;
              std::list<Entry> items_;
              std::unordered_map<int, std::list<Entry>::iterator> where_;
          };
        harness: |
          int main() {
              TtlCache c(2, 10);
              c.put(1, 100, 0);
              CHECK_EQ("fresh", c.get(1, 9).value_or(-1), 100);
              CHECK("expired at 10", !c.get(1, 10));
              CHECK_EQ("expired entries are removed", c.size(), 0u);
              c.put(1, 100, 20);
              c.put(2, 200, 21);
              c.get(1, 22);
              c.put(3, 300, 23);
              CHECK("2 was least recently used", !c.get(2, 24));
              CHECK_EQ("1 stays", c.get(1, 24).value_or(-1), 100);
              c.put(1, 111, 25);
              CHECK_EQ("updating refreshes the time", c.get(1, 34).value_or(-1), 111);
          }
