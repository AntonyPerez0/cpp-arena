        solution: |
          #include <list>
          #include <string>
          #include <unordered_map>
          #include <vector>

          class RecentSearches {
          public:
              explicit RecentSearches(std::size_t k) : k_(k) {}
              void add(const std::string& query) {
                  auto it = where_.find(query);
                  if (it != where_.end()) {
                      order_.splice(order_.begin(), order_, it->second);
                      return;
                  }
                  order_.push_front(query);
                  where_[query] = order_.begin();
                  if (order_.size() > k_) {
                      where_.erase(order_.back());
                      order_.pop_back();
                  }
              }
              std::vector<std::string> items() const { return std::vector<std::string>(order_.begin(), order_.end()); }

          private:
              std::size_t k_;
              std::list<std::string> order_;
              std::unordered_map<std::string, std::list<std::string>::iterator> where_;
          };
