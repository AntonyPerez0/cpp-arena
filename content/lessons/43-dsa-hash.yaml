        solution: |
          #include <algorithm>
          #include <functional>
          #include <list>
          #include <vector>

          class IntSet {
          public:
              bool insert(int key) {
                  auto& b = buckets_[bucket_of(key)];
                  if (std::find(b.begin(), b.end(), key) != b.end()) return false;
                  b.push_back(key);
                  size_++;
                  if (size_ > buckets_.size() * 3 / 4) rehash(buckets_.size() * 2);
                  return true;
              }
              std::size_t size() const { return size_; }
              std::size_t bucket_count() const { return buckets_.size(); }
              double load_factor() const {
                  return (double)size_ / buckets_.size();
              }
              std::size_t longest_chain() const {
                  std::size_t best = 0;
                  for (const auto& b : buckets_) best = std::max(best, b.size());
                  return best;
              }

          private:
              void rehash(std::size_t n) {
                  std::vector<std::list<int>> old(n);
                  old.swap(buckets_);
                  for (auto& b : old)
                      for (int k : b) buckets_[bucket_of(k)].push_back(k);
              }
              std::size_t bucket_of(int key) const { return std::hash<int>{}(key) % buckets_.size(); }
              std::vector<std::list<int>> buckets_ = std::vector<std::list<int>>(16);
              std::size_t size_ = 0;
          };
        harness: |
