        solution: |
          #include <memory>
          #include <string>

          struct Weapon {
              std::string name;
              int price;
          };

          std::unique_ptr<Weapon> buy(const std::string& name, int& money) {
              int price;
              if (name == "ak47") price = 2700;
              else if (name == "awp") price = 4750;
              else if (name == "p250") price = 300;
              else return nullptr;
              if (money < price) return nullptr;
              money -= price;
              return std::make_unique<Weapon>(Weapon{name, price});
          }
