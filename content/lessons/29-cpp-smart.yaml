              std::vector<std::unique_ptr<Item>> items_;
          };
        solution: |
          #include <memory>
          #include <string>
          #include <vector>

          struct Item {
              std::string name;
              int value;
          };

          class Inventory {
          public:
              void add(std::unique_ptr<Item> item) { items_.push_back(std::move(item)); }
              int count() const { return (int)items_.size(); }
              std::unique_ptr<Item> take(const std::string& name) {
                  for (auto it = items_.begin(); it != items_.end(); ++it) {
                      if ((*it)->name == name) {
                          std::unique_ptr<Item> out = std::move(*it);
                          items_.erase(it);
                          return out;
                      }
                  }
                  return nullptr;
              }

          private:
              std::vector<std::unique_ptr<Item>> items_;
          };
        harness: |
          int main() {
              Inventory inv;
              inv.add(std::make_unique<Item>(Item{"helmet", 350}));
              inv.add(std::make_unique<Item>(Item{"kit", 400}));
              auto k = inv.take("kit");
              CHECK("got the kit", k != nullptr && k->value == 400);
              CHECK_EQ("one left", inv.count(), 1);
              CHECK("missing item", inv.take("zeus") == nullptr);
              CHECK_EQ("still one", inv.count(), 1);
              CHECK_EQ("take the helmet", inv.take("helmet")->name, std::string("helmet"));
              CHECK_EQ("empty now", inv.count(), 0);
          }
        hints:
          - "`std::unique_ptr<Item> out = std::move(*it);` moves the item out and leaves a null in the vector."
          - "Then `items_.erase(it);` removes the empty slot. Return right away, since `it` is no longer valid."
      - task: |
          A `Slot` holds at most one item. Write `std::unique_ptr<Item> equip(std::unique_ptr<Item> item)` that puts the new item in the slot and **returns the old one** (or `nullptr` if the slot was empty), and `std::string holding() const` returning the item's name or `"nothing"`.
        seed: |
          #include <memory>
          #include <string>

          struct Item {
              std::string name;
              int value;
          };

          class Slot {
          public:
              std::unique_ptr<Item> equip(std::unique_ptr<Item> item) {

              }
              std::string holding() const {

              }

          private:
              std::unique_ptr<Item> item_;
          };
        solution: |
          #include <memory>
          #include <string>
          #include <utility>

          struct Item {
              std::string name;
              int value;
          };

          class Slot {
          public:
              std::unique_ptr<Item> equip(std::unique_ptr<Item> item) {
                  return std::exchange(item_, std::move(item));
              }
              std::string holding() const {
                  return item_ ? item_->name : "nothing";
              }

          private:
              std::unique_ptr<Item> item_;
          };
        harness: |
          int main() {
              Slot s;
              CHECK_EQ("starts empty", s.holding(), std::string("nothing"));
              auto old = s.equip(std::make_unique<Item>(Item{"ak47", 2700}));
              CHECK("nothing was there", old == nullptr);
              CHECK_EQ("holding ak47", s.holding(), std::string("ak47"));
              old = s.equip(std::make_unique<Item>(Item{"awp", 4750}));
              CHECK("got the ak47 back", old != nullptr && old->name == "ak47");
              CHECK_EQ("holding awp", s.holding(), std::string("awp"));
              old = s.equip(nullptr);
              CHECK_EQ("unequip returns the awp", old->name, std::string("awp"));
              CHECK_EQ("empty again", s.holding(), std::string("nothing"));
          }
        hints:
          - "Move the old item into a local first, then move the new one in: `auto old = std::move(item_); item_ = std::move(item); return old;`"
          - "`std::exchange(item_, std::move(item))` from `<utility>` does both steps in one call."

  - title: Returning ownership
    id: cpp-smart-3
    text: |
      A function that **creates** an object on the heap should return a `unique_ptr`. Then the return type itself documents "you own this now", and the caller can't forget to delete it. In old C and C++ code, the same function would return a raw pointer and a comment saying "caller must free", which people forget.

      A `unique_ptr` can also be **empty**. Returning `nullptr` is a clean way to say "I couldn't make one".

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>

      struct Shape {
          std::string kind;
          double area;
      };

      std::unique_ptr<Shape> make_shape(const std::string& kind, double size) {
          if (kind == "square") return std::make_unique<Shape>(Shape{kind, size * size});
          if (kind == "circle") return std::make_unique<Shape>(Shape{kind, 3.14 * size * size});
          return nullptr;                           // unknown kind: nothing to own
      }

      int main() {
          for (const char* k : {"square", "hexagon", "circle"}) {
              auto s = make_shape(k, 2);
              if (s) {
                  std::cout << s->kind << " " << s->area << "\n";
              } else {
                  std::cout << "can't make a " << k << "\n";
              }
          }
      }
      ```

      ```output
      square 4
      can't make a hexagon
      circle 12.56
      ```

      ### How it works

      - Returning a `unique_ptr` by value moves it to the caller automatically. No `std::move` needed on `return`.
      - `return nullptr;` converts to an empty `unique_ptr`.
      - The caller must check `if (s)` before using `s->...`. Dereferencing an empty `unique_ptr` is undefined behavior, just like a null raw pointer.

      ### Building the string

      Your function returns a pointer to a new `std::string`. `std::make_unique<std::string>("bomb " + site)` constructs it from the concatenated text.

      **Your turn:** write `std::unique_ptr<std::string> make_callout(const std::string& site)` that returns a new string `"bomb " + site` for sites `A` and `B`, and `nullptr` for anything else.
    seed: |
      #include <memory>
      #include <string>

      std::unique_ptr<std::string> make_callout(const std::string& site) {

      }
    solution: |
      #include <memory>
      #include <string>

      std::unique_ptr<std::string> make_callout(const std::string& site) {
          if (site != "A" && site != "B") return nullptr;
          return std::make_unique<std::string>("bomb " + site);
      }
    harness: |
      int main() {
          auto a = make_callout("A");
          CHECK("A not null", a != nullptr);
          CHECK_EQ("A text", *a, std::string("bomb A"));
          auto b = make_callout("B");
          CHECK_EQ("B text", *b, std::string("bomb B"));
          CHECK("mid is null", make_callout("mid") == nullptr);
      }
    hints:
      - "Return `nullptr` for invalid sites."
      - "`return std::make_unique<std::string>(\"bomb \" + site);`"
