          #include <map>
          #include <memory>
          #include <string>

          class TextureCache {
          public:
              std::shared_ptr<std::string> get(const std::string& name) {
                  if (auto existing = cache_[name].lock()) return existing;
                  loads_++;
                  auto tex = std::make_shared<std::string>("texture:" + name);
                  cache_[name] = tex;
                  return tex;
              }
              int loads() const { return loads_; }

          private:
              int loads_ = 0;
              std::map<std::string, std::weak_ptr<std::string>> cache_;
          };
