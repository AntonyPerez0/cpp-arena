      - task: |
          Write `std::unique_ptr<Weapon> buy(const std::string& name, int& money)`. Prices: `ak47` 2700, `awp` 4750, `p250` 300. If the weapon exists and `money` covers it, subtract the price and return a new `Weapon`. Otherwise return `nullptr` and leave `money` alone.
