      - task: |
          A linked list can own its nodes with `unique_ptr`: each `Node` owns the next one, so deleting the head frees the whole chain. Write `std::unique_ptr<Node> build(const std::vector<int>& v)` that builds a list with the values in order (an empty vector gives `nullptr`), and `int sum(const Node* head)`.
        seed: |
          #include <memory>
          #include <vector>

          struct Node {
              int value;
              std::unique_ptr<Node> next;
          };

          std::unique_ptr<Node> build(const std::vector<int>& v) {

          }

          int sum(const Node* head) {

          }
        solution: |
          #include <memory>
          #include <vector>

          struct Node {
              int value;
              std::unique_ptr<Node> next;
          };

          std::unique_ptr<Node> build(const std::vector<int>& v) {
              std::unique_ptr<Node> head;
              for (auto it = v.rbegin(); it != v.rend(); ++it) {
                  head = std::make_unique<Node>(Node{*it, std::move(head)});
              }
              return head;
          }

          int sum(const Node* head) {
              int total = 0;
              for (const Node* n = head; n != nullptr; n = n->next.get()) total += n->value;
              return total;
          }
        harness: |
          int main() {
              auto list = build({4, 8, 15});
              CHECK_EQ("first", list->value, 4);
              CHECK_EQ("second", list->next->value, 8);
              CHECK_EQ("third", list->next->next->value, 15);
              CHECK("ends with nullptr", list->next->next->next == nullptr);
              CHECK_EQ("sum", sum(list.get()), 27);
              CHECK("empty vector", build({}) == nullptr);
              CHECK_EQ("sum of nothing", sum(nullptr), 0);
          }
        hints:
          - "Build from the **back**: each new node takes the current head as its `next`, then becomes the head."
          - "To walk the list without taking ownership, use raw pointers: `n = n->next.get()`."

  - title: shared_ptr
    id: cpp-smart-4
    text: |
      Sometimes there really isn't one owner. Several parts of a program need the same object, and it should live until the **last** of them is done with it. For that there's `std::shared_ptr<T>`.

      A `shared_ptr` keeps a **reference count** next to the object: how many `shared_ptr`s currently own it. Copying a `shared_ptr` adds one, destroying one subtracts one, and when the count reaches zero the object is deleted. `use_count()` shows the current count.

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>
      #include <vector>

      struct Texture {
          std::string file;
          ~Texture() { std::cout << "unload " << file << "\n"; }
      };

      int main() {
          std::vector<std::shared_ptr<Texture>> sprites;
          {
              auto grass = std::make_shared<Texture>(Texture{"grass.png"});
              std::cout << "count " << grass.use_count() << "\n";
              sprites.push_back(grass);
              sprites.push_back(grass);
              std::cout << "count " << grass.use_count() << "\n";
          }
          std::cout << "block done, count " << sprites[0].use_count() << "\n";
          sprites.clear();
          std::cout << "end of main\n";
      }
      ```

      ```output
      unload grass.png
      count 1
      count 3
      block done, count 2
      unload grass.png
      end of main
      ```

      ### Reading the output

      - The first `unload` line is the **temporary** `Texture{"grass.png"}` passed to `make_shared`. It's copied into the shared object and then destroyed. The real texture is only unloaded later.
      - The count goes 1, then 3 after two copies into the vector.
      - When the block ends, the local `grass` is gone, but the vector still holds two owners, so the texture stays loaded.
      - `sprites.clear()` destroys the last two owners, the count hits zero, and the texture is unloaded.

      ### When to use which

      Prefer `unique_ptr`. It's simpler and faster. `shared_ptr` needs a separate control block for the count (`make_shared` puts it in the same allocation as the object, which is one reason to prefer it) and an atomic update on every copy. Reach for it only when ownership is genuinely shared and there's no single obvious owner.

      **Your turn:** make the program print `1 2 3 2` by filling in the blanks.
    fill: |
      #include <iostream>
      #include <memory>

      int main() {
          auto map = std::[[make_shared]]<int>(2);
          std::cout << map.[[use_count]]() << " ";
          auto p1 = map;
          std::cout << map.use_count() << " ";
          {
              auto p2 = [[map]];
              std::cout << map.use_count() << " ";
          }
          std::cout << map.use_count() << "\n";
      }
    hints:
      - "`std::make_shared<int>(2)` creates it, `use_count()` reports the owners."
      - p2 is a third owner (a copy of map) until its block ends.
    tests:
      - expect: "1 2 3 2"
    more:
