      - task: |
          Write `int tick_all(std::vector<std::unique_ptr<Bomb>>& bombs)`. It lowers every bomb's `timer` by 1. A bomb whose timer reaches 0 explodes: `reset` its pointer and count it. Skip slots that are already empty. Return how many exploded on this tick.
        seed: |
          #include <memory>
          #include <string>
          #include <vector>

          struct Bomb {
              std::string site;
              int timer;
          };

          int tick_all(std::vector<std::unique_ptr<Bomb>>& bombs) {

          }
        solution: |
          #include <memory>
          #include <string>
          #include <vector>

          struct Bomb {
              std::string site;
              int timer;
          };

          int tick_all(std::vector<std::unique_ptr<Bomb>>& bombs) {
              int exploded = 0;
              for (auto& b : bombs) {
                  if (!b) continue;
                  b->timer--;
                  if (b->timer <= 0) {
                      b.reset();
                      exploded++;
                  }
              }
              return exploded;
          }
        harness: |
          int main() {
              std::vector<std::unique_ptr<Bomb>> v;
              v.push_back(std::make_unique<Bomb>(Bomb{"A", 1}));
              v.push_back(nullptr);
              v.push_back(std::make_unique<Bomb>(Bomb{"B", 2}));
              CHECK_EQ("first tick", tick_all(v), 1);
              CHECK("A exploded", v[0] == nullptr);
              CHECK_EQ("B is at 1", v[2]->timer, 1);
              CHECK_EQ("second tick", tick_all(v), 1);
              CHECK("B exploded", v[2] == nullptr);
              CHECK_EQ("nothing left", tick_all(v), 0);
          }
        hints:
          - "Loop by reference, `for (auto& b : bombs)`, because a `unique_ptr` can't be copied."
          - "`if (!b) continue;` skips empty slots before you touch `b->timer`."

  - title: Unique means unique
    id: cpp-smart-2
    text: |
      "Unique" means exactly one owner at a time. If you could copy a `unique_ptr`, two of them would both try to delete the same object: a double free. So copying is **deleted**: it's a compile error. What you can do is **move** it, which hands ownership over and leaves the source empty (`nullptr`, C++'s type-safe version of C's `NULL`).

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>
      #include <utility>
      #include <vector>

      struct Song {
          std::string title;
          int seconds;
      };

      int main() {
          auto a = std::make_unique<Song>(Song{"Intro", 95});
          // auto b = a;                  // error: use of deleted copy constructor
          auto b = std::move(a);          // ownership moves to b
          std::cout << (a ? "a owns it" : "a is empty") << ", b has " << b->title << "\n";

          std::vector<std::unique_ptr<Song>> playlist;
          playlist.push_back(std::move(b));
          playlist.push_back(std::make_unique<Song>(Song{"Outro", 130}));   // a temporary moves in by itself

          int total = 0;
          for (const auto& s : playlist) total += s->seconds;
          std::cout << playlist.size() << " songs, " << total << " seconds\n";
      }
      ```

      ```output
      a is empty, b has Intro
      2 songs, 225 seconds
      ```

      ### How it works

      - `std::move(a)` says "I'm giving this away". After it, `a` is null, and `if (a)` is false.
      - A `vector` of `unique_ptr` owns all its objects. When the vector is destroyed, each element deletes its object.
      - `push_back(std::make_unique<...>(...))` needs no `std::move`: a temporary is already about to disappear, so it's moved automatically.
      - Loop with `const auto&`. A plain `auto` would try to **copy** each `unique_ptr`, which doesn't compile.

      ### Taking ownership in a function

      A parameter of type `std::unique_ptr<T>` (by value) means "this function takes ownership". The caller must write `std::move(ptr)`, which makes the hand-over visible in the code. Inside the function, move it again to store it: `items_.push_back(std::move(item));`.

      **Your turn:** complete `Inventory::add`, which takes ownership of an item and stores it in the vector. Then `count()` and `total_value()`.
    seed: |
      #include <memory>
      #include <string>
      #include <vector>

      struct Item {
          std::string name;
          int value;
      };

      class Inventory {
      public:
          void add(std::unique_ptr<Item> item) {

          }
          int count() const {

          }
          int total_value() const {

          }

      private:
          std::vector<std::unique_ptr<Item>> items_;
      };
    solution: |
      #include <memory>
      #include <string>
      #include <vector>

      struct Item {
          std::string name;
          int value;
      };

      class Inventory {
      public:
          void add(std::unique_ptr<Item> item) {
              items_.push_back(std::move(item));
          }
          int count() const {
              return (int)items_.size();
          }
          int total_value() const {
              int t = 0;
              for (const auto& it : items_) t += it->value;
              return t;
          }

      private:
          std::vector<std::unique_ptr<Item>> items_;
      };
    harness: |
      int main() {
          Inventory inv;
          auto kit = std::make_unique<Item>(Item{"defuse kit", 400});
          inv.add(std::move(kit));
          CHECK("source is empty after the move", kit == nullptr);
          inv.add(std::make_unique<Item>(Item{"helmet", 350}));
          CHECK_EQ("count", inv.count(), 2);
          CHECK_EQ("total value", inv.total_value(), 750);
      }
    hints:
      - "A unique_ptr parameter can't be copied into the vector, so move it: `items_.push_back(std::move(item));`"
      - "Loop with `for (const auto& it : items_) t += it->value;`"
    more:
      - task: |
          Add `std::unique_ptr<Item> take(const std::string& name)` to `Inventory`: it finds the first item with that name, **moves it out** of the vector, erases the empty slot and returns it. Return `nullptr` when there is no such item.
        seed: |
          #include <memory>
          #include <string>
          #include <vector>

          struct Item {
              std::string name;
              int value;
          };

          class Inventory {
          public:
              void add(std::unique_ptr<Item> item) { items_.push_back(std::move(item)); }
              int count() const { return (int)items_.size(); }
              std::unique_ptr<Item> take(const std::string& name) {

