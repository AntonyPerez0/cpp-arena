        solution: |
          #include <stddef.h>

          struct Node {
              int value;
              struct Node *next;
          };

          int has_cycle(const struct Node *head) {
              const struct Node *slow = head, *fast = head;
              while (fast != NULL && fast->next != NULL) {
                  slow = slow->next;
                  fast = fast->next->next;
                  if (slow == fast) return 1;
              }
              return 0;
          }
