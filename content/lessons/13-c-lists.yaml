        solution: |
          #include <stdlib.h>

          struct Node {
              int value;
              struct Node *next;
          };

          void push_back(struct Node **head, int value) {
              struct Node *n = malloc(sizeof *n);
              n->value = value;
              n->next = NULL;
              if (*head == NULL) {
                  *head = n;
                  return;
              }
              struct Node *p = *head;
              while (p->next != NULL) p = p->next;
