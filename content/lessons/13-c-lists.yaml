          }
        solution: |
          #include <stdlib.h>

          struct Node {
              int value;
              struct Node *next;
          };

          int pop_front(struct Node **head) {
              struct Node *first = *head;
              int v = first->value;
              *head = first->next;
              free(first);
              return v;
          }
        harness: |
          struct Node *mk(int v, struct Node *next) {
              struct Node *n = malloc(sizeof *n);
              n->value = v;
              n->next = next;
              return n;
          }
          int main(void) {
              struct Node *head = mk(1, mk(2, mk(3, NULL)));
              CHECK_INT("pop -> 1", pop_front(&head), 1);
              CHECK_INT("new head is 2", head->value, 2);
              CHECK_INT("pop -> 2", pop_front(&head), 2);
              CHECK_INT("pop -> 3", pop_front(&head), 3);
              CHECK("list is empty after 3 pops", head == NULL);
              return 0;
          }
        hints:
