        solution: |
          typedef struct {
              int items[64];
              int top;
          } Stack;

          int push(Stack *s, int v) {
              if (s->top == 64) return 0;
              s->items[s->top++] = v;
              return 1;
          }

          int pop(Stack *s) {
              return s->items[--s->top];
          }

          int balanced(const char *s) {
              Stack st = {{0}, 0};
              for (; *s != '\0'; s++) {
                  char c = *s;
                  if (c == '(' || c == '[' || c == '{') {
                      if (!push(&st, c)) return 0;
                  } else if (c == ')' || c == ']' || c == '}') {
                      if (st.top == 0) return 0;
                      int open = pop(&st);
                      if ((c == ')' && open != '(') || (c == ']' && open != '[') || (c == '}' && open != '{')) return 0;
                  }
              }
              return st.top == 0;
          }
