              CHECK_INT("4 links back to 2", has_cycle(&a), 1);
              struct Node self = {7, NULL};
              self.next = &self;
              CHECK_INT("a node pointing at itself", has_cycle(&self), 1);
              CHECK_INT("empty list", has_cycle(NULL), 0);
              struct Node one = {1, NULL};
              CHECK_INT("single node", has_cycle(&one), 0);
              return 0;
          }
