              CHECK("ends with NULL", head->next->next->next == NULL);
              while (head) {
                  struct Node *next = head->next;
                  free(head);
                  head = next;
              }
              return 0;
          }
        hints:
          - The new node's `next` is `NULL`, because it will be last.
          - If `*head` is NULL, set `*head` to the new node. Otherwise walk to the node whose `next` is NULL and link it there.
