id: c-lists
title: Linked data structures
lang: c
phase: "C: Memory"
summary: Put structs, pointers and malloc together. Build a linked list and a stack from scratch.
steps:
  - title: A node that points to a node
    text: |
      A **linked list** is a chain of nodes. Each node holds a value and a pointer to the next node. The last node's `next` is `NULL`.

      ```c
      struct Node {
          int value;
          struct Node *next;
      };
      ```

      A struct can contain a pointer to its own type, even though it can't contain *itself*.

      **Your turn:** link three stack-allocated nodes together and walk the list.
    fill: |
      #include <stdio.h>
      #include <stddef.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int main(void) {
          struct Node c = {3, NULL};
          struct Node b = {2, [[&c]]};
          struct Node a = {1, &b};
          for (struct Node *p = &a; p != [[NULL]]; p = p[[->next]]) {
              printf("%d ", p->value);
          }
          printf("\n");
          return 0;
      }
    hints:
      - b's next should be the address of c, written `&c`.
      - The walk stops when p becomes `NULL`, and moves with `p = p->next`.
    tests:
      - expect: "1 2 3"

  - title: Push to the front
    text: |
      Real lists allocate nodes on the heap. Adding at the front is the easiest operation: the new node points at the old head, and becomes the new head.

      The function has to change the caller's head pointer, so it takes a **pointer to the head pointer**:

      ```c
      void push_front(struct Node **head, int value);
      ```

      **Your turn:** implement it.
    seed: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      void push_front(struct Node **head, int value) {

      }
    solution: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      void push_front(struct Node **head, int value) {
          struct Node *n = malloc(sizeof *n);
          n->value = value;
          n->next = *head;
          *head = n;
      }
    harness: |
      int main(void) {
          struct Node *head = NULL;
          push_front(&head, 3);
          push_front(&head, 2);
          push_front(&head, 1);
          CHECK("head not NULL", head != NULL);
          CHECK_INT("first", head->value, 1);
          CHECK_INT("second", head->next->value, 2);
          CHECK_INT("third", head->next->next->value, 3);
          CHECK("ends with NULL", head->next->next->next == NULL);
          return 0;
      }
    hints:
      - "Allocate a node: `struct Node *n = malloc(sizeof *n);`"
      - "Set `n->value`, point `n->next` at the current head (`*head`), then make `*head = n`."

  - title: Length and sum
    text: |
      **Your turn:** write two traversal functions:

      - `int list_length(const struct Node *head)`
      - `int list_sum(const struct Node *head)`
    seed: |
      struct Node {
          int value;
          struct Node *next;
      };

      int list_length(const struct Node *head) {

      }

      int list_sum(const struct Node *head) {

      }
    solution: |
      struct Node {
          int value;
          struct Node *next;
      };

      int list_length(const struct Node *head) {
          int n = 0;
          for (const struct Node *p = head; p; p = p->next) n++;
          return n;
      }

      int list_sum(const struct Node *head) {
          int s = 0;
          for (const struct Node *p = head; p; p = p->next) s += p->value;
          return s;
      }
    harness: |
      #include <stddef.h>
      int main(void) {
          struct Node c = {30, NULL}, b = {20, &c}, a = {10, &b};
          CHECK_INT("length of 3", list_length(&a), 3);
          CHECK_INT("sum of 10,20,30", list_sum(&a), 60);
          CHECK_INT("length of empty", list_length(NULL), 0);
          CHECK_INT("sum of empty", list_sum(NULL), 0);
          CHECK_INT("length from middle", list_length(&b), 2);
          return 0;
      }
    hints:
      - "Walk with `for (const struct Node *p = head; p != NULL; p = p->next)`."

  - title: Free the whole list
    text: |
      Every node was malloc'd, so every node must be freed. The trap: after `free(p)` you can't read `p->next` anymore. Save it first.

      ```c
      struct Node *next = p->next;
      free(p);
      p = next;
      ```

      **Your turn:** write `int free_list(struct Node *head)` that frees every node and returns how many it freed.
    seed: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int free_list(struct Node *head) {

      }
    solution: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int free_list(struct Node *head) {
          int n = 0;
          while (head != NULL) {
              struct Node *next = head->next;
              free(head);
              head = next;
              n++;
          }
          return n;
      }
    harness: |
      struct Node *mk(int v, struct Node *next) {
          struct Node *n = malloc(sizeof *n);
          n->value = v;
          n->next = next;
          return n;
      }
      int main(void) {
          struct Node *l = mk(1, mk(2, mk(3, mk(4, NULL))));
          CHECK_INT("freed 4 nodes", free_list(l), 4);
          CHECK_INT("empty list", free_list(NULL), 0);
          return 0;
      }
    hints:
      - Loop while head is not NULL.
      - "Save `head->next` in a variable before calling `free(head)`."

  - title: Reverse a linked list
    text: |
      A famous interview question. Walk the list once and flip every `next` pointer to point backwards. You'll need three pointers: `prev`, `cur`, and `next`.

      **Your turn:** write `struct Node *reverse(struct Node *head)` that returns the new head.
    seed: |
      #include <stddef.h>

      struct Node {
          int value;
          struct Node *next;
      };

      struct Node *reverse(struct Node *head) {

      }
    solution: |
      #include <stddef.h>

      struct Node {
          int value;
          struct Node *next;
      };

      struct Node *reverse(struct Node *head) {
          struct Node *prev = NULL;
          struct Node *cur = head;
          while (cur != NULL) {
              struct Node *next = cur->next;
              cur->next = prev;
              prev = cur;
              cur = next;
          }
          return prev;
      }
    harness: |
      int main(void) {
          struct Node d = {4, NULL}, c = {3, &d}, b = {2, &c}, a = {1, &b};
          struct Node *h = reverse(&a);
          int out[4], i = 0;
          for (struct Node *p = h; p && i < 4; p = p->next) out[i++] = p->value;
          CHECK_INT("new head", h->value, 4);
          CHECK("order 4 3 2 1", i == 4 && out[1] == 3 && out[2] == 2 && out[3] == 1);
          CHECK("old head is new tail", a.next == NULL);
          CHECK("empty list", reverse(NULL) == NULL);
          struct Node s = {9, NULL};
          CHECK("single node", reverse(&s) == &s && s.next == NULL);
          return 0;
      }
    hints:
      - "Start with `prev = NULL`, `cur = head`."
      - "Each step: save `next = cur->next`, set `cur->next = prev`, then move `prev = cur` and `cur = next`."
      - When cur is NULL, prev is the new head.

  - title: A stack on an array
    text: |
      A **stack** is last-in, first-out, like a pile of plates: `push` adds on top, `pop` removes from the top.

      ```c
      typedef struct {
          int items[64];
          int top;        // number of items
      } Stack;
      ```

      **Your turn:** implement `push` (return 0 if full, 1 if ok) and `pop` (return the top item and remove it; the caller guarantees the stack isn't empty).
    seed: |
      typedef struct {
          int items[64];
          int top;
      } Stack;

      int push(Stack *s, int v) {

      }

      int pop(Stack *s) {

      }
    solution: |
      typedef struct {
          int items[64];
          int top;
      } Stack;

      int push(Stack *s, int v) {
          if (s->top == 64) return 0;
          s->items[s->top++] = v;
          return 1;
      }

      int pop(Stack *s) {
          return s->items[--s->top];
      }
    harness: |
      int main(void) {
          Stack s = {{0}, 0};
          push(&s, 1);
          push(&s, 2);
          push(&s, 3);
          CHECK_INT("pop -> 3", pop(&s), 3);
          CHECK_INT("pop -> 2", pop(&s), 2);
          push(&s, 9);
          CHECK_INT("pop -> 9", pop(&s), 9);
          CHECK_INT("pop -> 1", pop(&s), 1);
          CHECK_INT("empty again", s.top, 0);
          int ok = 1;
          for (int i = 0; i < 64; i++) ok = ok && push(&s, i);
          CHECK("64 pushes succeed", ok);
          CHECK_INT("65th push fails", push(&s, 99), 0);
          return 0;
      }
    hints:
      - "`top` is both the count and the index of the next free slot."
      - "push: if full return 0, else `s->items[s->top++] = v;`"
      - "pop: `return s->items[--s->top];`"
