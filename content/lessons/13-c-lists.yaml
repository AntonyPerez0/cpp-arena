  - title: Length and sum
    id: c-lists-3
    text: |
      Most list functions follow the same traversal pattern: start at the head, do something with each node, follow `next` until `NULL`. Only the "do something" changes.

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int list_max(const struct Node *head) {
          int best = head->value;
          for (const struct Node *p = head->next; p != NULL; p = p->next) {
              if (p->value > best) {
                  best = p->value;
              }
          }
          return best;
      }

      int count_negative(const struct Node *head) {
          int n = 0;
          for (; head != NULL; head = head->next) {
              if (head->value < 0) {
                  n++;
              }
          }
          return n;
      }

      int main(void) {
          struct Node c = {-4, NULL}, b = {9, &c}, a = {-1, &b};
          printf("max %d, negatives %d\n", list_max(&a), count_negative(&a));
          return 0;
      }
      ```

      ```output
      max 9, negatives 2
      ```

      ### Notes

      - `count_negative` moves the parameter `head` itself. That's fine: it's the function's own copy of the pointer, so the caller's list is unaffected.
      - `const struct Node *` promises the function won't modify the nodes; traversal functions should always take `const`.
      - `list_max` reads `head->value` without checking, so it requires a non-empty list. A function that must handle empty lists (like counting or summing) should work naturally when `head` is `NULL`: the loop simply doesn't run and the result is 0.

      Think about the empty list for every list function you write; it's the most common edge case in hidden tests.

      **Your turn:** write two traversal functions:

      - `int list_length(const struct Node *head)`
      - `int list_sum(const struct Node *head)`
    seed: |
      struct Node {
          int value;
          struct Node *next;
      };

      int list_length(const struct Node *head) {

      }

      int list_sum(const struct Node *head) {

      }
    solution: |
      struct Node {
          int value;
          struct Node *next;
      };

      int list_length(const struct Node *head) {
          int n = 0;
          for (const struct Node *p = head; p; p = p->next) n++;
          return n;
      }

      int list_sum(const struct Node *head) {
          int s = 0;
          for (const struct Node *p = head; p; p = p->next) s += p->value;
          return s;
      }
    harness: |
      #include <stddef.h>
      int main(void) {
          struct Node c = {30, NULL}, b = {20, &c}, a = {10, &b};
          CHECK_INT("length of 3", list_length(&a), 3);
          CHECK_INT("sum of 10,20,30", list_sum(&a), 60);
          CHECK_INT("length of empty", list_length(NULL), 0);
          CHECK_INT("sum of empty", list_sum(NULL), 0);
          CHECK_INT("length from middle", list_length(&b), 2);
          return 0;
      }
    hints:
      - "Walk with `for (const struct Node *p = head; p != NULL; p = p->next)`."
    more:
      - task: |
          Write `int list_max(const struct Node *head)` (the list has at least one node) and `int list_count(const struct Node *head, int v)`, which counts the nodes holding `v`.
        seed: |
          struct Node {
              int value;
              struct Node *next;
          };

          int list_max(const struct Node *head) {

          }

          int list_count(const struct Node *head, int v) {

          }
        solution: |
          struct Node {
              int value;
              struct Node *next;
          };

          int list_max(const struct Node *head) {
              int best = head->value;
              for (const struct Node *p = head->next; p; p = p->next) {
                  if (p->value > best) best = p->value;
              }
              return best;
          }

          int list_count(const struct Node *head, int v) {
              int n = 0;
              for (const struct Node *p = head; p; p = p->next) {
                  if (p->value == v) n++;
              }
              return n;
          }
        harness: |
          #include <stddef.h>
          int main(void) {
              struct Node d = {20, NULL}, c = {-5, &d}, b = {20, &c}, a = {10, &b};
              CHECK_INT("max of 10,20,-5,20", list_max(&a), 20);
              CHECK_INT("max starting from the third node", list_max(&c), 20);
              struct Node solo = {-7, NULL};
              CHECK_INT("max of a single negative", list_max(&solo), -7);
              CHECK_INT("count 20", list_count(&a, 20), 2);
              CHECK_INT("count 99", list_count(&a, 99), 0);
              CHECK_INT("count in empty list", list_count(NULL, 1), 0);
              return 0;
          }
        hints:
          - For the max, start with `head->value` so negative lists work.
          - The count is the same walk as `list_sum`, adding 1 only when `p->value == v`.
        tests: []
      - task: |
          Write `const struct Node *nth(const struct Node *head, int k)` that returns the node at position `k` (the head is position 0), or `NULL` if the list is too short.
        seed: |
          #include <stddef.h>

          struct Node {
              int value;
              struct Node *next;
          };

          const struct Node *nth(const struct Node *head, int k) {

          }
        solution: |
          #include <stddef.h>

          struct Node {
              int value;
              struct Node *next;
          };

          const struct Node *nth(const struct Node *head, int k) {
              const struct Node *p = head;
              while (p != NULL && k > 0) {
                  p = p->next;
                  k--;
              }
              return p;
          }
        harness: |
          int main(void) {
              struct Node c = {30, NULL}, b = {20, &c}, a = {10, &b};
              CHECK("position 0 is the head", nth(&a, 0) == &a);
              CHECK("position 2 is the last node", nth(&a, 2) == &c);
              CHECK("position 3 is past the end", nth(&a, 3) == NULL);
              CHECK("empty list", nth(NULL, 0) == NULL);
              CHECK("far past the end", nth(&a, 100) == NULL);
              return 0;
          }
        hints:
          - Step forward `k` times, but stop early if you reach `NULL`.
          - "`while (p != NULL && k > 0)` handles both at once."
        tests: []

  - title: Free the whole list
    id: c-lists-4
    text: |
      Every node was allocated with `malloc`, so every node must be freed, or the list leaks. Freeing looks like a traversal, but with a trap:

      ```c
      for (struct Node *p = head; p != NULL; p = p->next) {
          free(p);     // then the loop reads p->next: use after free!
      }
      ```

      After `free(p)`, the node's memory no longer belongs to you, so reading `p->next` to move on is undefined behavior. It may even appear to work, which is why this bug survives in real code. The fix: **save the next pointer before freeing**.

      ```c run
      #include <stdio.h>
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int main(void) {
          struct Node *head = NULL;
          for (int i = 0; i < 4; i++) {
              struct Node *n = malloc(sizeof *n);
              if (!n) return 1;
              n->value = i;
              n->next = head;
              head = n;
          }
          int total = 0;
          while (head != NULL) {
              struct Node *next = head->next;
              total += head->value;
              free(head);
              head = next;
          }
          printf("freed all, total was %d\n", total);
          return 0;
      }
      ```

      ```output
      freed all, total was 6
      ```

      The loop reads what it needs from the node (its value and `next`) **before** freeing it, then moves on using the saved pointer. When the loop ends, `head` is `NULL`, which correctly describes an empty list.

      This "save, free, advance" shape is how every linked structure is destroyed. Tools like AddressSanitizer report the wrong version immediately as a heap-use-after-free.

      **Your turn:** write `int free_list(struct Node *head)` that frees every node and returns how many it freed.
    seed: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int free_list(struct Node *head) {

      }
    solution: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int free_list(struct Node *head) {
          int n = 0;
          while (head != NULL) {
              struct Node *next = head->next;
              free(head);
              head = next;
              n++;
          }
          return n;
      }
    harness: |
      struct Node *mk(int v, struct Node *next) {
          struct Node *n = malloc(sizeof *n);
          n->value = v;
          n->next = next;
          return n;
      }
      int main(void) {
          struct Node *l = mk(1, mk(2, mk(3, mk(4, NULL))));
          CHECK_INT("freed 4 nodes", free_list(l), 4);
          CHECK_INT("empty list", free_list(NULL), 0);
          return 0;
      }
    hints:
      - Loop while head is not NULL.
      - "Save `head->next` in a variable before calling `free(head)`."
    more:
      - task: |
          Write `struct Node *remove_first(struct Node *head, int v)` that removes and frees the **first** node holding `v` and returns the (possibly new) head. If there's no such node, return the list unchanged.
        seed: |
          #include <stdlib.h>

          struct Node {
              int value;
              struct Node *next;
          };

          struct Node *remove_first(struct Node *head, int v) {

          }
        solution: |
          #include <stdlib.h>

          struct Node {
              int value;
              struct Node *next;
          };

          struct Node *remove_first(struct Node *head, int v) {
              if (head == NULL) return NULL;
              if (head->value == v) {
                  struct Node *rest = head->next;
                  free(head);
                  return rest;
              }
              struct Node *p = head;
              while (p->next != NULL && p->next->value != v) p = p->next;
              if (p->next != NULL) {
                  struct Node *gone = p->next;
                  p->next = gone->next;
                  free(gone);
              }
              return head;
          }
        harness: |
          struct Node *mk(int v, struct Node *next) {
              struct Node *n = malloc(sizeof *n);
              n->value = v;
              n->next = next;
              return n;
          }
          void free_all(struct Node *h) {
              while (h) { struct Node *n = h->next; free(h); h = n; }
          }
          int main(void) {
              struct Node *h = mk(1, mk(2, mk(3, mk(2, NULL))));
              h = remove_first(h, 2);
              CHECK("remove 2 from 1,2,3,2 gives 1,3,2", h->value == 1 && h->next->value == 3 && h->next->next->value == 2 && h->next->next->next == NULL);
              h = remove_first(h, 1);
              CHECK("removing the head", h->value == 3 && h->next->value == 2);
              h = remove_first(h, 9);
              CHECK("missing value leaves the list alone", h->value == 3 && h->next->value == 2);
              h = remove_first(h, 2);
              CHECK("removing the last node", h->value == 3 && h->next == NULL);
              CHECK("empty list", remove_first(NULL, 1) == NULL);
              free_all(h);
              return 0;
          }
        hints:
          - The head is a special case, because the function must return a different head.
          - Otherwise stop at the node **before** the one to remove, so you can relink it with `p->next = gone->next;`.
        tests: []
      - task: |
          Write `struct Node *remove_all(struct Node *head, int v)` that removes and frees **every** node holding `v`, and returns the new head. Several matching nodes can be next to each other, including at the start.
        seed: |
          #include <stdlib.h>

          struct Node {
              int value;
              struct Node *next;
          };

          struct Node *remove_all(struct Node *head, int v) {

          }
        solution: |
          #include <stdlib.h>

          struct Node {
              int value;
              struct Node *next;
          };

          struct Node *remove_all(struct Node *head, int v) {
              struct Node **link = &head;
              while (*link != NULL) {
                  if ((*link)->value == v) {
                      struct Node *gone = *link;
                      *link = gone->next;
                      free(gone);
                  } else {
                      link = &(*link)->next;
                  }
              }
              return head;
          }
        harness: |
          struct Node *mk(int v, struct Node *next) {
              struct Node *n = malloc(sizeof *n);
              n->value = v;
              n->next = next;
              return n;
          }
          void free_all(struct Node *h) {
              while (h) { struct Node *n = h->next; free(h); h = n; }
          }
          int main(void) {
              struct Node *h = mk(2, mk(2, mk(1, mk(2, mk(3, mk(2, NULL))))));
              h = remove_all(h, 2);
              CHECK("2,2,1,2,3,2 without 2 is 1,3", h != NULL && h->value == 1 && h->next->value == 3 && h->next->next == NULL);
              h = remove_all(h, 9);
              CHECK("nothing to remove", h->value == 1 && h->next->value == 3);
              free_all(h);
              struct Node *all = mk(5, mk(5, NULL));
              CHECK("removing every node gives NULL", remove_all(all, 5) == NULL);
              CHECK("empty list", remove_all(NULL, 1) == NULL);
              return 0;
          }
