id: c-lists
title: Linked data structures
lang: c
phase: "C: Memory"
summary: Put structs, pointers and malloc together. Build a linked list and a stack from scratch.
steps:
  - title: A node that points to a node
    id: c-lists-1
    text: |
      This module puts structs, pointers and `malloc` together to build the first real **data structure**. Arrays store elements side by side, which makes them fast to index but hard to grow or insert into. A **linked list** takes the opposite approach: each element (a **node**) is separate, and each node holds a pointer to the next one.

      ```c
      struct Node {
          int value;
          struct Node *next;
      };
      ```

      - `value` is the data.
      - `next` points at the following node, or is `NULL` for the last node.
      - The whole list is reached through one pointer to the first node, called the **head**. An empty list is just `head == NULL`.

      A struct can't contain itself (that would be infinitely big), but it can contain a **pointer** to its own type, because a pointer is a fixed size.

      ### Walking a list

      You can't jump to "element 5" of a list. You start at the head and follow `next` pointers until you reach `NULL`:

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      struct Node {
          const char *name;
          struct Node *next;
      };

      int main(void) {
          struct Node third = {"cherry", NULL};
          struct Node second = {"banana", &third};
          struct Node first = {"apple", &second};
          int count = 0;
          for (struct Node *p = &first; p != NULL; p = p->next) {
              printf("%s\n", p->name);
              count++;
          }
          printf("%d nodes\n", count);
          return 0;
      }
      ```

      ```output
      apple
      banana
      cherry
      3 nodes
      ```

      The `for` loop is the standard list traversal: start at the head, stop at `NULL`, and step with `p = p->next`. You'll write it many times.

      In real programs nodes are allocated with `malloc` (next step); here they're plain local variables to keep the first example simple.

      **Your turn:** link three stack-allocated nodes together and walk the list.
    fill: |
      #include <stdio.h>
      #include <stddef.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int main(void) {
          struct Node c = {3, NULL};
          struct Node b = {2, [[&c]]};
          struct Node a = {1, &b};
          for (struct Node *p = &a; p != [[NULL]]; p = p[[->next]]) {
              printf("%d ", p->value);
          }
          printf("\n");
          return 0;
      }
    hints:
      - b's next should be the address of c, written `&c`.
      - The walk stops when p becomes `NULL`, and moves with `p = p->next`.
    tests:
      - expect: "1 2 3"

  - title: Push to the front
    id: c-lists-2
    text: |
      Real lists create nodes on the heap, one `malloc` per node, so the list can grow as long as needed. The easiest insertion is at the **front**:

      1. Allocate a new node and fill in its value.
      2. Point its `next` at the current head.
      3. Make the new node the head.

      The order matters: if you replaced the head first, you'd lose the pointer to the rest of the list.

      ### Changing the caller's head

      Step 3 changes the head pointer, which belongs to the caller. As you saw with pointers to pointers, a function that must change the caller's pointer needs **the address of that pointer**, so the parameter is `struct Node **head`. Inside, `*head` is the caller's head pointer.

      ```c run
      #include <stdio.h>
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int push_back(struct Node **head, int value) {
          struct Node *n = malloc(sizeof *n);
          if (n == NULL) return 0;
          n->value = value;
          n->next = NULL;
          struct Node **link = head;
          while (*link != NULL) {
              link = &(*link)->next;
          }
          *link = n;
          return 1;
      }

      int main(void) {
          struct Node *list = NULL;
          push_back(&list, 1);
          push_back(&list, 2);
          push_back(&list, 3);
          for (struct Node *p = list; p; p = p->next) printf("%d ", p->value);
          printf("\n");
          while (list) {
              struct Node *next = list->next;
              free(list);
              list = next;
          }
          return 0;
      }
      ```

      ```output
      1 2 3 
      ```

      This example adds at the **back** instead: it walks a pointer-to-a-link until it finds the `NULL` at the end and attaches the node there. Adding at the back takes a walk through the whole list (O(n)); adding at the front is immediate (O(1)), which is why push-front is the basic list operation.

      **Your turn:** implement it.
    seed: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      void push_front(struct Node **head, int value) {

      }
    solution: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      void push_front(struct Node **head, int value) {
          struct Node *n = malloc(sizeof *n);
          n->value = value;
          n->next = *head;
          *head = n;
      }
    harness: |
      int main(void) {
          struct Node *head = NULL;
          push_front(&head, 3);
          push_front(&head, 2);
          push_front(&head, 1);
          CHECK("head not NULL", head != NULL);
          CHECK_INT("first", head->value, 1);
          CHECK_INT("second", head->next->value, 2);
          CHECK_INT("third", head->next->next->value, 3);
          CHECK("ends with NULL", head->next->next->next == NULL);
          while (head) {
              struct Node *next = head->next;
              free(head);
              head = next;
          }
          return 0;
      }
    hints:
      - "Allocate a node: `struct Node *n = malloc(sizeof *n);`"
      - "Set `n->value`, point `n->next` at the current head (`*head`), then make `*head = n`."

  - title: Length and sum
    id: c-lists-3
    text: |
      Most list functions follow the same traversal pattern: start at the head, do something with each node, follow `next` until `NULL`. Only the "do something" changes.

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int list_max(const struct Node *head) {
          int best = head->value;
          for (const struct Node *p = head->next; p != NULL; p = p->next) {
              if (p->value > best) {
                  best = p->value;
              }
          }
          return best;
      }

      int count_negative(const struct Node *head) {
          int n = 0;
          for (; head != NULL; head = head->next) {
              if (head->value < 0) {
                  n++;
              }
          }
          return n;
      }

      int main(void) {
          struct Node c = {-4, NULL}, b = {9, &c}, a = {-1, &b};
          printf("max %d, negatives %d\n", list_max(&a), count_negative(&a));
          return 0;
      }
      ```

      ```output
      max 9, negatives 2
      ```

      ### Notes

      - `count_negative` moves the parameter `head` itself. That's fine: it's the function's own copy of the pointer, so the caller's list is unaffected.
      - `const struct Node *` promises the function won't modify the nodes; traversal functions should always take `const`.
      - `list_max` reads `head->value` without checking, so it requires a non-empty list. A function that must handle empty lists (like counting or summing) should work naturally when `head` is `NULL`: the loop simply doesn't run and the result is 0.

      Think about the empty list for every list function you write; it's the most common edge case in hidden tests.

      **Your turn:** write two traversal functions:

      - `int list_length(const struct Node *head)`
      - `int list_sum(const struct Node *head)`
    seed: |
      struct Node {
          int value;
          struct Node *next;
      };

      int list_length(const struct Node *head) {

      }

      int list_sum(const struct Node *head) {

      }
    solution: |
      struct Node {
          int value;
          struct Node *next;
      };

      int list_length(const struct Node *head) {
          int n = 0;
          for (const struct Node *p = head; p; p = p->next) n++;
          return n;
      }

      int list_sum(const struct Node *head) {
          int s = 0;
          for (const struct Node *p = head; p; p = p->next) s += p->value;
          return s;
      }
    harness: |
      #include <stddef.h>
      int main(void) {
          struct Node c = {30, NULL}, b = {20, &c}, a = {10, &b};
          CHECK_INT("length of 3", list_length(&a), 3);
          CHECK_INT("sum of 10,20,30", list_sum(&a), 60);
          CHECK_INT("length of empty", list_length(NULL), 0);
          CHECK_INT("sum of empty", list_sum(NULL), 0);
          CHECK_INT("length from middle", list_length(&b), 2);
          return 0;
      }
    hints:
      - "Walk with `for (const struct Node *p = head; p != NULL; p = p->next)`."

  - title: Free the whole list
    id: c-lists-4
    text: |
      Every node was allocated with `malloc`, so every node must be freed, or the list leaks. Freeing looks like a traversal, but with a trap:

      ```c
      for (struct Node *p = head; p != NULL; p = p->next) {
          free(p);     // then the loop reads p->next: use after free!
      }
      ```

      After `free(p)`, the node's memory no longer belongs to you, so reading `p->next` to move on is undefined behavior. It may even appear to work, which is why this bug survives in real code. The fix: **save the next pointer before freeing**.

      ```c run
      #include <stdio.h>
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int main(void) {
          struct Node *head = NULL;
          for (int i = 0; i < 4; i++) {
              struct Node *n = malloc(sizeof *n);
              if (!n) return 1;
              n->value = i;
              n->next = head;
              head = n;
          }
          int total = 0;
          while (head != NULL) {
              struct Node *next = head->next;
              total += head->value;
              free(head);
              head = next;
          }
          printf("freed all, total was %d\n", total);
          return 0;
      }
      ```

      ```output
      freed all, total was 6
      ```

      The loop reads what it needs from the node (its value and `next`) **before** freeing it, then moves on using the saved pointer. When the loop ends, `head` is `NULL`, which correctly describes an empty list.

      This "save, free, advance" shape is how every linked structure is destroyed. Tools like AddressSanitizer report the wrong version immediately as a heap-use-after-free.

      **Your turn:** write `int free_list(struct Node *head)` that frees every node and returns how many it freed.
    seed: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int free_list(struct Node *head) {

      }
    solution: |
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      int free_list(struct Node *head) {
          int n = 0;
          while (head != NULL) {
              struct Node *next = head->next;
              free(head);
              head = next;
              n++;
          }
          return n;
      }
    harness: |
      struct Node *mk(int v, struct Node *next) {
          struct Node *n = malloc(sizeof *n);
          n->value = v;
          n->next = next;
          return n;
      }
      int main(void) {
          struct Node *l = mk(1, mk(2, mk(3, mk(4, NULL))));
          CHECK_INT("freed 4 nodes", free_list(l), 4);
          CHECK_INT("empty list", free_list(NULL), 0);
          return 0;
      }
    hints:
      - Loop while head is not NULL.
      - "Save `head->next` in a variable before calling `free(head)`."

  - title: Reverse a linked list
    id: c-lists-5
    text: |
      Reversing a linked list is a famous interview question because it tests whether you can manipulate pointers without losing track of anything. The goal: flip every `next` arrow to point backwards, in one pass, without allocating new nodes.

      ### Three pointers

      - `prev`: the part already reversed (starts as `NULL`, the new end).
      - `cur`: the node being flipped (starts at the head).
      - `next`: saved before flipping, so the rest of the list isn't lost.

      Each step:

      1. Save `next = cur->next`.
      2. Flip: `cur->next = prev`.
      3. Move forward: `prev = cur`, then `cur = next`.

      When `cur` becomes `NULL`, `prev` is the new head.

      The **Watch it run** link below shows exactly this: watch the heap arrows turn around one at a time. Here's the same three-pointer walk used for a different job, removing every node with a given value (it needs to remember the previous node to relink around the removed one):

      ```c run
      #include <stdio.h>
      #include <stdlib.h>

      struct Node {
          int value;
          struct Node *next;
      };

      struct Node *remove_all(struct Node *head, int target) {
          struct Node *prev = NULL, *cur = head;
          while (cur != NULL) {
              struct Node *next = cur->next;
              if (cur->value == target) {
                  if (prev == NULL) head = next;
                  else prev->next = next;
                  free(cur);
              } else {
                  prev = cur;
              }
              cur = next;
          }
          return head;
      }

      int main(void) {
          int vals[] = {3, 1, 3, 2};
          struct Node *head = NULL;
          for (int i = 3; i >= 0; i--) {
              struct Node *n = malloc(sizeof *n);
              if (!n) return 1;
              n->value = vals[i];
              n->next = head;
              head = n;
          }
          head = remove_all(head, 3);
          for (struct Node *p = head; p; p = p->next) printf("%d ", p->value);
          printf("\n");
          while (head) { struct Node *n = head->next; free(head); head = n; }
          return 0;
      }
      ```

      ```output
      1 2 
      ```

      Draw a small list on paper and trace your reverse before coding. Check the empty list and a one-node list too.

      **Your turn:** write `struct Node *reverse(struct Node *head)` that returns the new head.
    seed: |
      #include <stddef.h>

      struct Node {
          int value;
          struct Node *next;
      };

      struct Node *reverse(struct Node *head) {

      }
    solution: |
      #include <stddef.h>

      struct Node {
          int value;
          struct Node *next;
      };

      struct Node *reverse(struct Node *head) {
          struct Node *prev = NULL;
          struct Node *cur = head;
          while (cur != NULL) {
              struct Node *next = cur->next;
              cur->next = prev;
              prev = cur;
              cur = next;
          }
          return prev;
      }
    harness: |
      int main(void) {
          struct Node d = {4, NULL}, c = {3, &d}, b = {2, &c}, a = {1, &b};
          struct Node *h = reverse(&a);
          int out[4], i = 0;
          for (struct Node *p = h; p && i < 4; p = p->next) out[i++] = p->value;
          CHECK_INT("new head", h->value, 4);
          CHECK("order 4 3 2 1", i == 4 && out[1] == 3 && out[2] == 2 && out[3] == 1);
          CHECK("old head is new tail", a.next == NULL);
          CHECK("empty list", reverse(NULL) == NULL);
          struct Node s = {9, NULL};
          CHECK("single node", reverse(&s) == &s && s.next == NULL);
          return 0;
      }
    hints:
      - "Start with `prev = NULL`, `cur = head`."
      - "Each step: save `next = cur->next`, set `cur->next = prev`, then move `prev = cur` and `cur = next`."
      - When cur is NULL, prev is the new head.

  - title: A stack on an array
    id: c-lists-6
    text: |
      A **stack** is a collection with two operations: **push** adds an item on top, **pop** removes the top item. The last item in is the first out (**LIFO**), like a pile of plates. Stacks are everywhere: the call stack that holds function frames, undo history, and parsing nested brackets.

      You could build one from a linked list (push and pop at the front), but the simplest version uses an **array** plus a counter:

      ```c
      typedef struct {
          int items[64];
          int top;        /* how many items are stored; also the next free index */
      } Stack;
      ```

      - The items live in `items[0]` to `items[top - 1]`, and the top of the stack is `items[top - 1]`.
      - **push**: store at `items[top]`, then increment `top`.
      - **pop**: decrement `top`, then return `items[top]`.
      - Empty when `top == 0`; full when `top == 64`.

      ```c run
      #include <stdio.h>

      typedef struct {
          char items[32];
          int top;
      } CharStack;

      int balanced(const char *s) {
          CharStack st = {.top = 0};
          for (; *s; s++) {
              if (*s == '(') {
                  if (st.top == 32) return 0;
                  st.items[st.top++] = '(';
              } else if (*s == ')') {
                  if (st.top == 0) return 0;
                  st.top--;
              }
          }
          return st.top == 0;
      }

      int main(void) {
          printf("%d %d %d\n", balanced("(a(b)c)"), balanced("(()"), balanced(")("));
          return 0;
      }
      ```

      ```output
      1 0 0
      ```

      This checks whether parentheses are balanced: push on `(`, pop on `)`. A `)` with nothing to pop, or anything left over at the end, means unbalanced. Note `st.items[st.top++] = '('`: it stores at the current top and then increments, which is push in one line.

      Always check capacity before pushing into a fixed array; writing `items[64]` would overflow.

      **Your turn:** implement `push` (return 0 if full, 1 if ok) and `pop` (return the top item and remove it; the caller guarantees the stack isn't empty).
    seed: |
      typedef struct {
          int items[64];
          int top;
      } Stack;

      int push(Stack *s, int v) {

      }

      int pop(Stack *s) {

      }
    solution: |
      typedef struct {
          int items[64];
          int top;
      } Stack;

      int push(Stack *s, int v) {
          if (s->top == 64) return 0;
          s->items[s->top++] = v;
          return 1;
      }

      int pop(Stack *s) {
          return s->items[--s->top];
      }
    harness: |
      int main(void) {
          Stack s = {{0}, 0};
          push(&s, 1);
          push(&s, 2);
          push(&s, 3);
          CHECK_INT("pop -> 3", pop(&s), 3);
          CHECK_INT("pop -> 2", pop(&s), 2);
          push(&s, 9);
          CHECK_INT("pop -> 9", pop(&s), 9);
          CHECK_INT("pop -> 1", pop(&s), 1);
          CHECK_INT("empty again", s.top, 0);
          int ok = 1;
          for (int i = 0; i < 64; i++) ok = ok && push(&s, i);
          CHECK("64 pushes succeed", ok);
          CHECK_INT("65th push fails", push(&s, 99), 0);
          return 0;
      }
    hints:
      - "`top` is both the count and the index of the next free slot."
      - "push: if full return 0, else `s->items[s->top++] = v;`"
      - "pop: `return s->items[--s->top];`"
