  - title: "Challenge: a MinStack<T>"
    id: cpp-templates-8
    text: |
      Time for a classic interview problem, made generic. A normal stack gives you `push`, `pop` and `top` in O(1). Finding the **minimum** would normally mean scanning every element, O(n). The trick to make it O(1) is to **remember the answer as you go**.

      Here's the same idea for a running **maximum** in a history of scores:

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <vector>

      class ScoreLog {
      public:
          void add(int s) {
              int best = best_.empty() ? s : std::max(s, best_.back());
              scores_.push_back(s);
              best_.push_back(best);          // the max of everything up to here
          }
          void undo() { scores_.pop_back(); best_.pop_back(); }
          int best() const { return best_.back(); }

      private:
          std::vector<int> scores_;
          std::vector<int> best_;
      };

      int main() {
          ScoreLog log;
          for (int s : {40, 75, 60, 90}) {
              log.add(s);
              std::cout << "after " << s << ": best " << log.best() << "\n";
          }
          log.undo();
          std::cout << "after undo: best " << log.best() << "\n";
      }
      ```

      ```output
      after 40: best 40
      after 75: best 75
      after 60: best 75
      after 90: best 90
      after undo: best 75
      ```

      ### Why it works

      At every position, `best_` stores the maximum of all the values **at or below** that position. Since a stack only ever removes from the top, the values below never change. So after popping, the new top of `best_` is still correct. Every operation is O(1).

      ### Making it generic

      For your `MinStack<T>`, apply the same idea with `std::min`, and use `T` everywhere a value appears. Two common designs:

      - Store pairs `{value, min_so_far}` in one `std::vector<std::pair<T, T>>`.
      - Keep two vectors, as `ScoreLog` does.

      `top()` and `min()` return `const T&`, a reference to the stored element, so nothing is copied.

      **Your turn:** write `template <typename T> class MinStack` where **every** operation is O(1), including finding the minimum:

      - `void push(const T& v)`
      - `void pop()` (assume non-empty)
      - `const T& top() const`
      - `const T& min() const`: the smallest element currently in the stack
      - `bool empty() const`

      Hint for the O(1) min: alongside each value, remember what the minimum was at that point. Or keep a second stack of minimums.
    seed: |
      #include <vector>

      template <typename T>
      class MinStack {
      public:

      private:

      };
    solution: |
      #include <vector>

      template <typename T>
      class MinStack {
      public:
          void push(const T& v) {
              items_.push_back(v);
              if (mins_.empty() || v < mins_.back() || v == mins_.back()) mins_.push_back(v);
          }
          void pop() {
              if (items_.back() == mins_.back()) mins_.pop_back();
              items_.pop_back();
          }
          const T& top() const { return items_.back(); }
          const T& min() const { return mins_.back(); }
          bool empty() const { return items_.empty(); }

      private:
          std::vector<T> items_;
          std::vector<T> mins_;
      };
    harness: |
      #include <string>
      int main() {
          MinStack<int> s;
          s.push(5);
          s.push(3);
          s.push(7);
          s.push(3);
          CHECK_EQ("top", s.top(), 3);
          CHECK_EQ("min with duplicates", s.min(), 3);
          s.pop();
          CHECK_EQ("min after popping one 3", s.min(), 3);
          s.pop();
          s.pop();
          CHECK_EQ("min after popping both 3s", s.min(), 5);
          s.pop();
          CHECK_EQ("empty", s.empty(), true);
          MinStack<std::string> w;
          w.push("mirage");
          w.push("ancient");
          w.push("vertigo");
          CHECK_EQ("string min", w.min(), std::string("ancient"));
          w.pop();
          w.pop();
          CHECK_EQ("string min after pops", w.min(), std::string("mirage"));
      }
    hints:
      - "Keep two vectors: `items_` and `mins_`."
      - "On push, also push onto `mins_` when the value is less than or equal to the current min."
      - "On pop, if the value leaving equals `mins_.back()`, pop `mins_` too."
    more:
      - task: |
          Write `template <typename T> class TopK` that remembers the `k` largest values added. `add(const T& v)` is O(log k): keep a min-heap (`std::priority_queue` with `std::greater<T>`) of at most `k` values. `std::vector<T> items() const` returns them largest first.
        seed: |
          #include <functional>
          #include <queue>
          #include <vector>

          template <typename T>
          class TopK {
          public:
              explicit TopK(int k) : k_(k) {}

          private:
              int k_;
          };
        solution: |
          #include <algorithm>
          #include <functional>
          #include <queue>
          #include <vector>

          template <typename T>
          class TopK {
          public:
              explicit TopK(int k) : k_(k) {}
              void add(const T& v) {
                  heap_.push(v);
                  if ((int)heap_.size() > k_) heap_.pop();
              }
              std::vector<T> items() const {
                  auto copy = heap_;
                  std::vector<T> out;
                  while (!copy.empty()) {
                      out.push_back(copy.top());
                      copy.pop();
                  }
                  std::reverse(out.begin(), out.end());
                  return out;
              }

          private:
              int k_;
              std::priority_queue<T, std::vector<T>, std::greater<T>> heap_;
          };
        require:
          - pattern: "priority_queue"
            message: "Keep the values in a `std::priority_queue` min-heap."
        harness: |
          int main() {
              TopK<int> t(3);
              for (int x : {5, 1, 9, 3, 7, 9, 2}) t.add(x);
              CHECK_EQ("top 3", t.items(), (std::vector<int>{9, 9, 7}));
              CHECK_EQ("items() doesn't change it", t.items(), (std::vector<int>{9, 9, 7}));
              TopK<std::string> w(2);
              w.add("ancient");
              CHECK_EQ("fewer than k", w.items(), (std::vector<std::string>{"ancient"}));
              w.add("vertigo");
              w.add("mirage");
              CHECK_EQ("strings", w.items(), (std::vector<std::string>{"vertigo", "mirage"}));
          }
        hints:
          - "The heap's top is the smallest of the k kept values, so it's the one to drop when a new value pushes the size over k."
          - "`items()` is `const`, so pop from a copy of the heap."
      - task: |
          Write `template <typename T> class Tally` that counts values: `void add(const T& v)`, `int count(const T& v) const` (0 if never added) and `T most_common() const` (assume at least one value was added; on a tie return the **smallest** value).
        seed: |
          #include <map>

          template <typename T>
          class Tally {
          public:

          private:

          };
        solution: |
          #include <map>

          template <typename T>
          class Tally {
          public:
              void add(const T& v) { counts_[v]++; }
              int count(const T& v) const {
                  auto it = counts_.find(v);
                  return it == counts_.end() ? 0 : it->second;
              }
              T most_common() const {
                  auto best = counts_.begin();
                  for (auto it = counts_.begin(); it != counts_.end(); ++it) {
                      if (it->second > best->second) best = it;
                  }
                  return best->first;
              }

          private:
              std::map<T, int> counts_;
          };
        harness: |
          int main() {
              Tally<std::string> maps;
              for (const char* m : {"nuke", "mirage", "nuke", "inferno", "mirage", "nuke"}) maps.add(m);
              CHECK_EQ("nuke count", maps.count("nuke"), 3);
              CHECK_EQ("never added", maps.count("cache"), 0);
              CHECK_EQ("most common", maps.most_common(), std::string("nuke"));
              Tally<int> n;
              n.add(9);
              n.add(4);
              n.add(9);
              n.add(4);
              CHECK_EQ("tie goes to the smallest", n.most_common(), 4);
          }
        hints:
          - "A `std::map<T, int>` keeps the counts, and `counts_[v]++` starts new values at 0."
          - "Maps iterate in ascending key order, so only replacing the best on a strictly bigger count keeps the smallest value on ties."
