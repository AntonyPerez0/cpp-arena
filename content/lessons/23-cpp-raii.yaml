              ~Name() { delete[] s_; }
              // copy constructor here
              Name& operator=(Name other) {
                  std::swap(s_, other.s_);
                  return *this;
              }
              const char* c_str() const { return s_; }
              void set_first(char c) { s_[0] = c; }

          private:
              char* s_;
          };
        solution: |
          #include <cstring>
          #include <utility>

          class Name {
          public:
              explicit Name(const char* s) : s_(new char[std::strlen(s) + 1]) { std::strcpy(s_, s); }
              ~Name() { delete[] s_; }
              // copy constructor here
              Name(const Name& other) : s_(new char[std::strlen(other.s_) + 1]) { std::strcpy(s_, other.s_); }
              Name& operator=(Name other) {
                  std::swap(s_, other.s_);
                  return *this;
              }
              const char* c_str() const { return s_; }
              void set_first(char c) { s_[0] = c; }

          private:
              char* s_;
          };
        harness: |
          int main() {
              Name a("ropz");
              Name b = a;
              CHECK("copy has its own memory", b.c_str() != a.c_str());
