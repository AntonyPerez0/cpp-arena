        solution: |
          #include <utility>

          class IntStack {
          public:
              IntStack() : data_(new int[4]), size_(0), cap_(4) {}
              ~IntStack() { delete[] data_; }
              // copy constructor, swap and operator= here
              IntStack(const IntStack& o) : data_(new int[o.cap_]), size_(o.size_), cap_(o.cap_) {
                  for (int i = 0; i < size_; i++) data_[i] = o.data_[i];
              }
              void swap(IntStack& o) noexcept {
                  std::swap(data_, o.data_);
                  std::swap(size_, o.size_);
                  std::swap(cap_, o.cap_);
              }
              IntStack& operator=(IntStack o) {
                  swap(o);
                  return *this;
              }
              void push(int v) {
                  if (size_ == cap_) {
                      int* bigger = new int[cap_ * 2];
                      for (int i = 0; i < size_; i++) bigger[i] = data_[i];
                      delete[] data_;
                      data_ = bigger;
                      cap_ *= 2;
                  }
                  data_[size_++] = v;
              }
              int pop() { return data_[--size_]; }
              int size() const { return size_; }
              const int* raw() const { return data_; }

          private:
              int* data_;
              int size_;
              int cap_;
          };
        harness: |
          int main() {
              IntStack a;
              for (int i = 1; i <= 6; i++) a.push(i);
              IntStack b = a;
              CHECK("copy has its own array", b.raw() != a.raw());
              CHECK_EQ("copy has the same size", b.size(), 6);
              CHECK_EQ("top of the copy", b.pop(), 6);
              CHECK_EQ("original still has 6", a.size(), 6);
              IntStack c;
              c.push(99);
              c = a;
              CHECK_EQ("assignment copies", c.pop(), 6);
              c.push(7);
              CHECK_EQ("the copy keeps working after growing", c.pop(), 7);
              IntStack& alias = a;
              a = alias;
              CHECK_EQ("self-assignment is safe", a.pop(), 6);
          }
        hints:
          - The copy constructor allocates `o.cap_` ints and copies the first `o.size_` of them.
          - "`swap` must exchange all three members. Then `operator=` is the same two lines as always."
