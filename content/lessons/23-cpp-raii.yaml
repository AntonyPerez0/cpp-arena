        harness: |
          int main() {
              Name a("ropz");
              Name b("a much longer name");
              b = a;
              CHECK_EQ("assignment copies the text", std::string(b.c_str()), std::string("ropz"));
              CHECK("b has its own memory", b.c_str() != a.c_str());
              Name& alias = a;
              a = alias;
              CHECK_EQ("self-assignment keeps the text", std::string(a.c_str()), std::string("ropz"));
              Name x("x"), y("y");
