  - title: Copy assignment with copy-and-swap
    id: cpp-raii-6
    text: |
      **Copy assignment** (`a = b;` where `a` already exists) is trickier than the copy constructor, because `a` already owns a resource. A correct version must:

      1. Make a copy of `b`'s data.
      2. Release `a`'s old data.
      3. Handle **self-assignment** (`a = a;`), which a naive version breaks by freeing the data before copying it.
      4. Ideally, leave `a` unchanged if making the copy fails.

      The classic solution is **copy-and-swap**. Take the parameter **by value** (so the compiler makes the copy using your copy constructor), then **swap** your members with the copy's:

      ```cpp run
      #include <iostream>
      #include <utility>

      class Box {
      public:
          explicit Box(int v) : p_(new int(v)) {}
          Box(const Box& o) : p_(new int(*o.p_)) {}
          ~Box() { delete p_; }
          void swap(Box& o) noexcept { std::swap(p_, o.p_); }
          Box& operator=(Box other) {
              swap(other);
              return *this;
          }
          int get() const { return *p_; }

      private:
          int* p_;
      };

      int main() {
          Box a(1), b(2);
          a = b;
          a = a;
          Box c(3);
          c = a;
          std::cout << a.get() << " " << b.get() << " " << c.get() << "\n";
      }
      ```

      ```output
      2 2 2
      ```

      ### Why it works

      - The parameter `other` is already a fresh copy. If copying fails, it fails **before** anything in `*this` changed.
      - `swap` gives `*this` the new data and gives `other` the old data.
      - When `operator=` returns, `other` goes out of scope and its destructor frees the old data. No explicit `delete` needed.
      - Self-assignment is safe automatically: you copy first, then swap.

      `operator=` returns `*this` by reference, so assignments can chain (`a = b = c`). The `swap` member is marked `noexcept` because swapping two pointers can't fail, and the standard library relies on that promise.

      **Your turn:** write the member `swap` and the copy-and-swap `operator=`.
    seed: |
      #include <utility>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          // swap and operator= here

          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    solution: |
      #include <utility>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          // swap and operator= here
          void swap(IntArray& other) noexcept {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
          }
          IntArray& operator=(IntArray other) {
              swap(other);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    harness: |
      int main() {
          IntArray a(3);
          a.at(0) = 1; a.at(1) = 2; a.at(2) = 3;
          IntArray b(5);
          b = a;
          CHECK_EQ("size after assignment", b.size(), 3);
          CHECK_EQ("values after assignment", b.at(2), 3);
          CHECK("b has its own memory", b.raw() != a.raw());
          b.at(0) = 50;
          CHECK_EQ("a is unaffected", a.at(0), 1);
          IntArray& alias = a;
          a = alias;
          CHECK_EQ("self-assignment keeps values", a.at(1), 2);
          IntArray x(1), y(2);
          x.swap(y);
          CHECK("swap exchanges sizes", x.size() == 2 && y.size() == 1);
      }
    hints:
      - "`void swap(IntArray& other) noexcept` swaps both members with `std::swap`."
      - "`IntArray& operator=(IntArray other) { swap(other); return *this; }` (note: other is taken **by value**)."
    more:
