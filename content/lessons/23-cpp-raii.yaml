        solution: |
          #include <string>

          class Indent {
          public:
              Indent() { level_++; }
              ~Indent() { level_--; }
              Indent(const Indent&) = delete;
              Indent& operator=(const Indent&) = delete;
              static std::string pad() { return std::string(level_ * 2, ' '); }

          private:
              static inline int level_ = 0;
          };
