          Tag(std::string n) : name(n) { std::cout << "+ " << name << "\n"; }
          ~Tag() { std::cout << "- " << name << "\n"; }
      };

      int main() {
          Tag a("A");
          Tag b("B");
          Tag c("C");
      }
    solution: |
