        solution: |
          class ValueRestorer {
          public:
              explicit ValueRestorer(int& target) : target_(target), saved_(target) {}
              ~ValueRestorer() {
                  if (!committed_) target_ = saved_;
              }
              ValueRestorer(const ValueRestorer&) = delete;
              ValueRestorer& operator=(const ValueRestorer&) = delete;
              void commit() { committed_ = true; }

          private:
              int& target_;
              int saved_;
              bool committed_ = false;
          };
        harness: |
          #include <type_traits>
          int main() {
              int money = 800;
              {
                  ValueRestorer r(money);
                  money -= 650;
                  CHECK_EQ("changed inside the scope", money, 150);
              }
              CHECK_EQ("restored at the end of the scope", money, 800);
              {
                  ValueRestorer r(money);
                  money -= 300;
                  r.commit();
              }
              CHECK_EQ("committed change is kept", money, 500);
              CHECK("not copyable", !std::is_copy_constructible_v<ValueRestorer>);
          }
