  - title: RAII
    id: cpp-raii-3
    text: |
      **RAII** stands for "Resource Acquisition Is Initialization". It's an awkward name for the most important idea in C++:

      > Tie every resource to an object. Acquire it in the constructor, release it in the destructor.

      Because destructors always run when the object goes away, the resource is always released: on normal exit, early return, or an exception. You can't forget, and you can't get the order wrong. Memory, files, locks, network connections and database transactions are all managed this way.

      ### new and delete

      C++'s versions of `malloc` and `free`:

      - `new T(args)` creates one object on the heap and returns a pointer; `delete p` destroys it.
      - `new T[n]` creates an array; `delete[] p` destroys it. Mixing them up (`delete` on an array) is undefined behavior.
      - `new int[n]()`: the `()` zero-initializes the elements.

      Unlike `malloc`, `new` runs constructors and `delete` runs destructors.

      ```cpp run
      #include <iostream>

      class Buffer {
      public:
          explicit Buffer(int n) : data_(new double[n]()), n_(n) {
              std::cout << "allocated " << n_ << "\n";
          }
          ~Buffer() {
              delete[] data_;
              std::cout << "freed " << n_ << "\n";
          }
          double& at(int i) { return data_[i]; }
          int size() const { return n_; }

      private:
          double* data_;
          int n_;
      };

      int main() {
          Buffer b(3);
          b.at(0) = 1.5;
          b.at(2) = b.at(0) * 2;
          std::cout << b.at(0) + b.at(1) + b.at(2) << "\n";
      }
      ```

      ```output
      allocated 3
      4.5
      freed 3
      ```

      `main` never calls `delete`. The `Buffer` owns its array and frees it in its destructor.

      ### Returning a reference

      `double& at(int i)` returns a **reference** to the element, so `b.at(0) = 1.5` writes into the array. Returning `double` would return a copy, and the assignment would change the copy.

      **Your turn:** finish `IntArray`: the destructor, plus `int size() const`, `int& at(int i)` (returns a reference so callers can write through it) and `int sum() const`.
    seed: |
      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          // destructor, size, at, sum

      private:
          int* data_;
          int n_;
      };
    solution: |
      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          // destructor, size, at, sum
          ~IntArray() { delete[] data_; }
          IntArray(const IntArray&) = delete;
          IntArray& operator=(const IntArray&) = delete;
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          int sum() const {
              int s = 0;
              for (int i = 0; i < n_; i++) s += data_[i];
              return s;
          }

      private:
          int* data_;
          int n_;
      };
    require:
      - pattern: "~IntArray\\s*\\(\\s*\\)\\s*\\{[^}]*delete\\s*\\[\\s*\\]"
        message: "The destructor must release the memory with `delete[] data_;`."
    harness: |
      int main() {
          IntArray a(5);
          CHECK_EQ("size", a.size(), 5);
          CHECK_EQ("zero initialized", a.sum(), 0);
          a.at(0) = 10;
          a.at(4) = 7;
          CHECK_EQ("at() writes through", a.at(4), 7);
          CHECK_EQ("sum", a.sum(), 17);
          for (int k = 0; k < 1000; k++) {
              IntArray tmp(1000);
              tmp.at(999) = k;
          }
          CHECK("1000 temporary arrays freed cleanly", true);
      }
    hints:
      - "`~IntArray() { delete[] data_; }`"
      - "`int& at(int i) { return data_[i]; }` returns a reference, so `a.at(0) = 10` works."
    more:
      - task: |
          Finish `Buffer`, which owns a `char` array from `new char[n]`: the destructor, `int size() const`, `void fill(char c)` (every character becomes `c`), and `std::string str() const` (the characters as a string).
        seed: |
          #include <string>

          class Buffer {
          public:
              explicit Buffer(int n) : data_(new char[n]), n_(n) {}
              Buffer(const Buffer&) = delete;
              Buffer& operator=(const Buffer&) = delete;
              // destructor, size, fill, str

          private:
              char* data_;
              int n_;
          };
        solution: |
          #include <string>

          class Buffer {
          public:
              explicit Buffer(int n) : data_(new char[n]), n_(n) {}
              Buffer(const Buffer&) = delete;
              Buffer& operator=(const Buffer&) = delete;
              // destructor, size, fill, str
              ~Buffer() { delete[] data_; }
              int size() const { return n_; }
              void fill(char c) {
                  for (int i = 0; i < n_; i++) data_[i] = c;
              }
              std::string str() const { return std::string(data_, n_); }

          private:
              char* data_;
              int n_;
          };
        harness: |
          int main() {
              Buffer b(4);
              CHECK_EQ("size", b.size(), 4);
              b.fill('#');
              CHECK_EQ("filled", b.str(), std::string("####"));
              b.fill('x');
              CHECK_EQ("filled again", b.str(), std::string("xxxx"));
              for (int k = 0; k < 1000; k++) {
                  Buffer tmp(512);
                  tmp.fill('a');
              }
              CHECK("1000 temporary buffers freed cleanly", true);
          }
        require:
          - pattern: "~Buffer\\s*\\(\\s*\\)\\s*\\{[^}]*delete\\s*\\[\\s*\\]"
            message: "Free the array in the destructor with `delete[] data_;`."
        hints:
          - Memory from `new[]` must be released with `delete[]`, not plain `delete`.
          - "`std::string(data_, n_)` builds a string from the first `n_` characters."
