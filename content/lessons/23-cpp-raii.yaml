              Name c("x");
              c = a;
              CHECK_EQ("assignment copies", std::string(c.c_str()), std::string("ropz"));
          }
        hints:
          - The signature is `Name(const Name& other)`.
          - "Allocate `std::strlen(other.s_) + 1` bytes, then `std::strcpy` the text into them."
