                      CHECK_EQ("two levels", Indent::pad(), std::string("    "));
                  }
                  CHECK_EQ("back to one", Indent::pad(), std::string("  "));
              }
              CHECK_EQ("back to none", Indent::pad(), std::string(""));
              CHECK("not copyable", !std::is_copy_constructible_v<Indent>);
