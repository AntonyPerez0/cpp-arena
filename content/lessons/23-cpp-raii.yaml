      - task: |
          `Matrix` owns a flat `int` array of `rows * cols` values. Write **both** the deep-copy constructor and the copy assignment operator (use copy-and-swap for the assignment), so copies never share memory and self-assignment is safe.
        seed: |
          #include <utility>

          class Matrix {
          public:
              Matrix(int rows, int cols) : rows_(rows), cols_(cols), data_(new int[rows * cols]()) {}
              ~Matrix() { delete[] data_; }
              // copy constructor and copy assignment here
              int& at(int r, int c) { return data_[r * cols_ + c]; }
              int rows() const { return rows_; }
              int cols() const { return cols_; }
              const int* raw() const { return data_; }

          private:
              int rows_, cols_;
              int* data_;
          };
        solution: |
          #include <utility>

          class Matrix {
          public:
              Matrix(int rows, int cols) : rows_(rows), cols_(cols), data_(new int[rows * cols]()) {}
              ~Matrix() { delete[] data_; }
              // copy constructor and copy assignment here
              Matrix(const Matrix& o) : rows_(o.rows_), cols_(o.cols_), data_(new int[o.rows_ * o.cols_]) {
                  for (int i = 0; i < rows_ * cols_; i++) data_[i] = o.data_[i];
              }
              Matrix& operator=(Matrix o) {
                  std::swap(rows_, o.rows_);
                  std::swap(cols_, o.cols_);
                  std::swap(data_, o.data_);
                  return *this;
              }
              int& at(int r, int c) { return data_[r * cols_ + c]; }
              int rows() const { return rows_; }
              int cols() const { return cols_; }
              const int* raw() const { return data_; }

          private:
              int rows_, cols_;
              int* data_;
          };
        harness: |
          int main() {
              Matrix a(2, 3);
              a.at(1, 2) = 7;
              Matrix b = a;
              CHECK("copy has its own memory", b.raw() != a.raw());
              CHECK_EQ("copy has the value", b.at(1, 2), 7);
              b.at(0, 0) = 5;
              CHECK_EQ("original unchanged", a.at(0, 0), 0);
              Matrix c(1, 1);
              c = a;
              CHECK("assignment takes the shape", c.rows() == 2 && c.cols() == 3);
              CHECK_EQ("assignment copies values", c.at(1, 2), 7);
              Matrix& alias = c;
              c = alias;
              CHECK_EQ("self-assignment keeps the values", c.at(1, 2), 7);
          }
        hints:
          - The copy constructor allocates `rows * cols` ints and copies them one by one.
          - "Copy-and-swap: take the parameter **by value** (that makes the copy), swap every member with it, and let its destructor free the old data."
        tests: []

  - title: Non-copyable classes
    id: cpp-raii-5
    text: |
      For some resources, copying makes no sense at all. What would it mean to copy an open network connection, a lock on a mutex, or a handle to a unique hardware device? Two objects would both think they own it and both try to release it.

      The right answer is to **forbid copying**. Write the copy operations and mark them `= delete`:

      ```cpp run
      #include <iostream>
      #include <type_traits>

      class Connection {
      public:
          explicit Connection(int id) : id_(id) { std::cout << "connect " << id_ << "\n"; }
          ~Connection() { std::cout << "disconnect " << id_ << "\n"; }
          Connection(const Connection&) = delete;
          Connection& operator=(const Connection&) = delete;
          int id() const { return id_; }

      private:
          int id_;
      };

      void use(const Connection& c) {
          std::cout << "using " << c.id() << "\n";
      }

      int main() {
          Connection c(7);
          use(c);
          std::cout << std::is_copy_constructible_v<Connection> << "\n";
      }
      ```

      ```output
      connect 7
      using 7
      0
      disconnect 7
      ```

      Now `Connection d = c;` is a compile error: `call to deleted constructor of 'Connection'`. The mistake is caught before the program ever runs. Passing by reference (`const Connection&`) still works, because no copy is made.

      ### Two copy operations

      There are two copy operations to delete:

      - The **copy constructor** `Connection(const Connection&)`, used for `Connection d = c;`.
      - The **copy assignment operator** `Connection& operator=(const Connection&)`, used for `d = c;` when `d` already exists.

      `std::is_copy_constructible_v<T>` (from `<type_traits>`) asks the compiler, at compile time, whether a type can be copied. It's how the tests on this step check your class.

      A non-copyable type can still be made **movable** (able to hand over ownership) by writing move operations, which the move semantics module covers. But note that declaring the copy operations, even as `= delete`, stops the compiler from generating move operations for you, so `Connection` above can't be moved either. `std::unique_ptr` is the standard library's best-known type that can't be copied but can be moved.

      **Your turn:** make `Lock` non-copyable. The tests check it at compile time with `std::is_copy_constructible_v`.
    seed: |
      class Lock {
      public:
          Lock() = default;
          // forbid copying here

      };
    solution: |
      class Lock {
      public:
          Lock() = default;
          // forbid copying here
          Lock(const Lock&) = delete;
          Lock& operator=(const Lock&) = delete;
      };
    harness: |
      #include <type_traits>
      int main() {
          CHECK("Lock can be created", std::is_default_constructible_v<Lock>);
          CHECK("Lock cannot be copy-constructed", !std::is_copy_constructible_v<Lock>);
          CHECK("Lock cannot be copy-assigned", !std::is_copy_assignable_v<Lock>);
      }
    hints:
      - "`Lock(const Lock&) = delete;`"
      - "`Lock& operator=(const Lock&) = delete;`"
    more:
