      - task: |
          Write all three copy operations for `IntStack`, which owns a growable `int` array: the deep-copy constructor, a `swap`, and the copy-and-swap `operator=`. Copies must have their own array and the same `size_` and `cap_`.
        seed: |
          #include <utility>

          class IntStack {
          public:
              IntStack() : data_(new int[4]), size_(0), cap_(4) {}
              ~IntStack() { delete[] data_; }
              // copy constructor, swap and operator= here
              void push(int v) {
                  if (size_ == cap_) {
                      int* bigger = new int[cap_ * 2];
                      for (int i = 0; i < size_; i++) bigger[i] = data_[i];
                      delete[] data_;
                      data_ = bigger;
                      cap_ *= 2;
                  }
                  data_[size_++] = v;
              }
              int pop() { return data_[--size_]; }
              int size() const { return size_; }
              const int* raw() const { return data_; }

          private:
              int* data_;
              int size_;
              int cap_;
