      - task: |
          RAII isn't just for memory. Write `FileLog`, which owns an open file: the constructor opens `path` for writing with `std::fopen`, `bool ok() const` says whether that worked, `void write(const std::string& line)` writes the line plus a newline, and the destructor closes the file. Closing is what makes sure everything reaches the disk.
        seed: |
          #include <cstdio>
          #include <string>

          class FileLog {
          public:
              explicit FileLog(const std::string& path) : f_(std::fopen(path.c_str(), "w")) {}
              FileLog(const FileLog&) = delete;
              FileLog& operator=(const FileLog&) = delete;
              // ok, write, destructor

          private:
              std::FILE* f_;
          };
        solution: |
          #include <cstdio>
          #include <string>

          class FileLog {
          public:
              explicit FileLog(const std::string& path) : f_(std::fopen(path.c_str(), "w")) {}
              FileLog(const FileLog&) = delete;
              FileLog& operator=(const FileLog&) = delete;
              // ok, write, destructor
              ~FileLog() {
                  if (f_) std::fclose(f_);
              }
              bool ok() const { return f_ != nullptr; }
              void write(const std::string& line) {
                  if (f_) std::fprintf(f_, "%s\n", line.c_str());
              }

          private:
              std::FILE* f_;
          };
        harness: |
          #include <cstdio>
          static std::string slurp(const char* path) {
              std::string s;
              std::FILE* f = std::fopen(path, "r");
              if (!f) return "(missing)";
              int c;
              while ((c = std::fgetc(f)) != EOF) s += static_cast<char>(c);
              std::fclose(f);
              return s;
          }
          int main() {
              {
                  FileLog log("match.log");
                  CHECK_EQ("the file opened", log.ok(), true);
                  log.write("round 1");
                  log.write("round 2");
              }
              CHECK_EQ("both lines are in the file after the scope", slurp("match.log"), std::string("round 1\nround 2\n"));
              FileLog bad("no/such/dir/x.log");
              CHECK_EQ("a bad path isn't ok", bad.ok(), false);
              bad.write("ignored");
              CHECK("writing to a failed log is harmless", true);
          }
        require:
          - pattern: "~FileLog\\s*\\(\\s*\\)\\s*\\{[^}]*fclose"
            message: "Close the file in the destructor with `std::fclose`."
        hints:
          - The file might have failed to open, so check `f_` before writing or closing.
          - "`line.c_str()` gives the `const char *` that `fprintf` needs."
        tests: []

  - title: The copy problem
    id: cpp-raii-4
    text: |
      RAII classes have a hidden trap. When you copy an object, C++ by default copies each **member**. For a class holding a raw pointer, that copies the **pointer**, not the data it points to. Now two objects point at the same array:

      ```
      a.data_ ──┐
                ├──> [ 1 2 3 ]
      b.data_ ──┘
      ```

      Changing `b` changes `a`. Worse, when both are destroyed, both destructors `delete[]` the same array: a **double free**, which crashes or corrupts memory.

      ### The fix: a deep copy

      Write a **copy constructor**, the constructor that builds a new object from an existing one of the same type. It takes a `const` reference to the original and allocates **new** memory with the same contents:

      ```cpp run
      #include <iostream>
      #include <cstring>

      class Name {
      public:
          explicit Name(const char* s) : text_(new char[std::strlen(s) + 1]) { std::strcpy(text_, s); }
          Name(const Name& other) : text_(new char[std::strlen(other.text_) + 1]) {
              std::strcpy(text_, other.text_);
          }
          ~Name() { delete[] text_; }
          Name& operator=(const Name&) = delete;
          void upper_first() { text_[0] = text_[0] - 'a' + 'A'; }
          const char* c_str() const { return text_; }

      private:
          char* text_;
      };

      int main() {
          Name a("ada");
          Name b = a;
          b.upper_first();
          std::cout << a.c_str() << " " << b.c_str() << "\n";
      }
      ```

      ```output
      ada Ada
      ```

      `Name b = a;` calls the copy constructor, which gives `b` its own characters. Changing `b` doesn't affect `a`, and each destructor frees its own memory.

      ### The rule of three

      If a class needs a custom **destructor**, it almost certainly needs a custom **copy constructor** and **copy assignment operator** too, because all three deal with the same owned resource. (Here copy assignment is simply forbidden with `= delete`; the next steps cover both options.)

      **Your turn:** add the deep-copy constructor. (Copy assignment is provided.)
    seed: |
      #include <algorithm>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          // copy constructor goes here

          IntArray& operator=(IntArray other) {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    solution: |
      #include <algorithm>

      class IntArray {
      public:
          explicit IntArray(int n) : data_(new int[n]()), n_(n) {}
          ~IntArray() { delete[] data_; }
          // copy constructor goes here
          IntArray(const IntArray& other) : data_(new int[other.n_]), n_(other.n_) {
              for (int i = 0; i < n_; i++) data_[i] = other.data_[i];
          }
          IntArray& operator=(IntArray other) {
              std::swap(data_, other.data_);
              std::swap(n_, other.n_);
              return *this;
          }
          int size() const { return n_; }
          int& at(int i) { return data_[i]; }
          const int* raw() const { return data_; }

      private:
          int* data_;
          int n_;
      };
    harness: |
      int main() {
          IntArray a(3);
          a.at(0) = 1; a.at(1) = 2; a.at(2) = 3;
          IntArray b = a;
          CHECK("copy has its own memory", b.raw() != a.raw());
          CHECK_EQ("copy has same size", b.size(), 3);
          CHECK_EQ("copy has same values", b.at(2), 3);
          b.at(0) = 99;
          CHECK_EQ("changing the copy leaves the original alone", a.at(0), 1);
          IntArray c(1);
          c = a;
          CHECK_EQ("assignment copies values", c.at(1), 2);
      }
    hints:
      - "Signature: `IntArray(const IntArray& other)`."
      - "Allocate new memory of `other.n_` ints, then copy each element in a loop."
    more:
      - task: |
          `Name` owns a heap copy of a C string. Add the **deep-copy** constructor: allocate a new array of the same length plus one and copy the characters, so the copy doesn't share the original's memory.
        seed: |
