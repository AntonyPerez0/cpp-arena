      - task: |
          Read numbers and find the first **non-negative** one that is divisible by 7. Skip negative numbers with `continue`, and stop with `break` as soon as you find one. Print `found N at position P`, where P counts every number read (starting at 1). If the input runs out first, print `none`. Input `3 -14 10 21 7` prints `found 21 at position 4`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int x;
              int pos = 0;
              while (scanf("%d", &x) == 1) {

              }

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int x;
              int pos = 0;
              int found = 0;
              while (scanf("%d", &x) == 1) {
                  pos++;
                  if (x < 0) continue;
                  if (x % 7 == 0) {
                      found = 1;
                      break;
                  }
              }
              if (found) {
                  printf("found %d at position %d\n", x, pos);
              } else {
                  printf("none\n");
              }
              return 0;
          }
        require:
