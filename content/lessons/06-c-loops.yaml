      - stdin: "1\n"
      - stdin: "10\n"
        hidden: true
    more:
      - task: |
          Read `n` and print every multiple of 3 from 3 up to `n` on one line, separated by spaces. Input `10` prints `3 6 9`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              // for loop here

              printf("\n");
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              // for loop here
              for (int i = 3; i <= n; i += 3) {
                  printf("%d ", i);
              }
              printf("\n");
              return 0;
          }
        require:
          - pattern: "for\\s*\\("
            message: Use a `for` loop.
        hints:
          - The update part of a for loop can be anything, not only `i++`. Try `i += 3`.
          - Start at 3 and keep going while `i <= n`.
        tests:
          - stdin: "10\n"
          - stdin: "3\n"
          - stdin: "30\n"
            hidden: true
      - task: |
          Read `n` and print the sum `1 + 2 + ... + n` and the product `1 * 2 * ... * n` using one `for` loop. Input `4` prints `sum 10, product 24`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              int sum = 0;
              int product = 1;
              for (int i = 1; i <= n; i++) {
                  sum += i;
                  product *= i;
              }
              printf("sum %d, product %d\n", sum, product);
              return 0;
          }
        require:
          - pattern: "for\\s*\\("
            message: Use a `for` loop.
        hints:
          - Keep two variables. The sum starts at 0, but the product must start at 1 (anything times 0 is 0).
          - Inside the loop, `sum += i;` and `product *= i;`.
        tests:
          - stdin: "4\n"
          - stdin: "1\n"
          - stdin: "10\n"
            hidden: true

  - title: Accumulating a total
    id: c-loops-3
    text: |
      A pattern you'll use constantly: **accumulating** a result across a loop. Create a variable before the loop, update it on every pass, and use it after the loop.

      - For a **sum**, start at 0 and add each value.
      - For a **count**, start at 0 and add 1 when something matches.
      - For a **maximum**, start with a value that anything will beat (or with the first value), and replace it whenever you see something bigger.

      ```c run
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          int total = 0;
          int passed = 0;
          for (int i = 0; i < n; i++) {
              int grade;
              scanf("%d", &grade);
              total += grade;
              if (grade >= 50) {
                  passed++;
              }
          }
          printf("average %d, passed %d\n", total / n, passed);
          return 0;
      }
      ```

      ```input
      5
      72 45 90 38 60
      ```

      ```output
      average 61, passed 3
      ```

      ### Reading a list

      A common input format is "first the count, then that many values". Read the count first, then loop that many times, reading one value per pass. Each `scanf` continues from where the last one stopped, so the values can be on one line or many.

      ### Where to declare things

      `total` and `passed` are declared **before** the loop, because they must survive across passes and be used afterwards. `grade` is declared **inside**, because each pass only needs its own current value. If `total` were declared inside the loop, it would be reset to 0 every pass.

      For a maximum, starting at 0 works only when all values are at least 0. For values that might be negative, start with the first value instead.

      **Your turn:** the first number of input is `n`, followed by `n` damage values. Print the total damage and the highest single hit:

      Input:
      ```
      4
      27 100 64 9
      ```
      Output:
      ```
      total 200
      max 100
      ```
    seed: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          int total = 0;
          int max = 0;

          printf("total %d\n", total);
          printf("max %d\n", max);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          int total = 0;
          int max = 0;
          for (int i = 0; i < n; i++) {
              int d;
              scanf("%d", &d);
              total += d;
              if (d > max) {
                  max = d;
              }
          }
          printf("total %d\n", total);
          printf("max %d\n", max);
          return 0;
      }
    hints:
      - Loop n times. Each round, read one value with scanf.
      - "Add each value to total. If it's bigger than max, update max."
    tests:
      - stdin: "4\n27 100 64 9\n"
      - stdin: "1\n5\n"
      - stdin: "6\n10 20 30 40 50 60\n"
        hidden: true
    more:
      - task: |
          The first number is `n`, followed by `n` damage values. Print the **smallest** hit and the average with two decimals. Input `4` then `27 100 64 9` prints:

          ```
          min 9
          avg 50.00
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              int total = 0;
              int min = 0;
              for (int i = 0; i < n; i++) {
                  int d;
                  scanf("%d", &d);
                  total += d;
                  if (i == 0 || d < min) {
                      min = d;
                  }
              }
              printf("min %d\n", min);
              printf("avg %.2f\n", (double)total / n);
              return 0;
          }
        hints:
          - Starting `min` at 0 doesn't work, because no hit would ever be smaller. Take the first value as the starting minimum, for example with `if (i == 0 || d < min)`.
          - For the average, add everything up and divide with a cast, `(double)total / n`.
        tests:
          - stdin: "4\n27 100 64 9\n"
          - stdin: "1\n5\n"
          - stdin: "3\n-5 10 -20\n"
            hidden: true
      - task: |
          The first number is `n`, followed by `n` damage values. A hit of 100 or more is a headshot. Print how many headshots there were and the position (starting at 1) of the biggest hit. If two hits tie for the biggest, report the first one. Input `5` then `27 100 64 120 9` prints:

          ```
          headshots 2
          best hit #4
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              int headshots = 0;
              int best = 0;
              int best_pos = 0;
              for (int i = 1; i <= n; i++) {
                  int d;
                  scanf("%d", &d);
                  if (d >= 100) {
                      headshots++;
                  }
                  if (i == 1 || d > best) {
                      best = d;
                      best_pos = i;
                  }
              }
              printf("headshots %d\n", headshots);
              printf("best hit #%d\n", best_pos);
              return 0;
          }
        hints:
          - Keep a counter for headshots, plus the biggest value and where you saw it.
          - Use `>` (not `>=`) when comparing to the biggest so a tie keeps the first position.
        tests:
