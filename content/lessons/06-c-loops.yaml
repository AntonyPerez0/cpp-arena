id: c-loops
title: Loops
lang: c
phase: "C: Foundations"
summary: Repeat work with while, for and do-while. break, continue, nested loops and loop-driven input.
steps:
  - title: while loops
    id: c-loops-1
    text: |
      Computers are good at doing the same thing many times. A **loop** repeats a block of code. The simplest is `while`: it checks a condition, and if it's true, runs the body, then checks again, and so on until the condition is false.

      ```c run
      #include <stdio.h>

      int main(void) {
          int lives = 3;
          while (lives > 0) {
              printf("lives left: %d\n", lives);
              lives--;
          }
          printf("game over\n");
          return 0;
      }
      ```

      ```output
      lives left: 3
      lives left: 2
      lives left: 1
      game over
      ```

      ### Trace it

      Tracing a loop by hand (writing down each variable after every pass) is the best way to understand it:

      | Check `lives > 0` | Prints | `lives` after |
      |---|---|---|
      | 3 > 0 true | lives left: 3 | 2 |
      | 2 > 0 true | lives left: 2 | 1 |
      | 1 > 0 true | lives left: 1 | 0 |
      | 0 > 0 false | (loop ends) | 0 |

      The condition is checked **before** each pass, so if it's false at the start, the body never runs at all.

      ### Every loop needs progress

      Something in the body must eventually make the condition false. Here it's `lives--`. If you forget it, `lives` stays 3 forever and the loop never ends: an **infinite loop**. On this site, a program that runs longer than 3 seconds is stopped with a time-limit message. On your own computer, press Ctrl+C to stop it.

      **Your turn:** read `n` and count down from `n` to 1, one number per line, then print `GO!`.
    fill: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          [[while]] (n [[>=]] 1) {
              printf("%d\n", n);
              [[n--]];
          }
          printf("GO!\n");
          return 0;
      }
    hints:
      - Keep looping while n is at least 1, and decrease n each time.
      - "The update is `n--`."
    tests:
      - stdin: "3\n"
      - stdin: "1\n"
      - stdin: "0\n"
        hidden: true
    more:
      - task: |
          Read `n` and count **up** from 1 to `n`, one number per line, then print `done`.
        fill: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              int i = [[1]];
              while (i [[<=]] n) {
                  printf("%d\n", i);
                  [[i++]];
              }
              printf("done\n");
              return 0;
          }
        hints:
          - Start `i` at the first number to print.
          - Keep going while `i` is at most `n`, which is `i <= n`.
          - Without `i++` the loop never ends.
        tests:
          - stdin: "3\n"
          - stdin: "1\n"
          - stdin: "0\n"
            hidden: true
      - task: |
          Read `n` and keep halving it (integer division by 2) until it reaches 1. Print every value on one line, separated by spaces, starting with `n` itself. Input `20` prints `20 10 5 2 1`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              // while loop here

              printf("\n");
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              // while loop here
              printf("%d", n);
              while (n > 1) {
                  n = n / 2;
                  printf(" %d", n);
              }
              printf("\n");
              return 0;
          }
        require:
