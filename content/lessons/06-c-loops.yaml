id: c-loops
title: Loops
lang: c
phase: "C: Foundations"
summary: Repeat work with while, for and do-while. break, continue, nested loops and loop-driven input.
steps:
  - title: while loops
    text: |
      A `while` loop repeats its block as long as the condition stays true.

      ```c
      int i = 1;
      while (i <= 3) {
          printf("%d\n", i);
          i++;
      }
      ```

      This prints 1, 2, 3. Forget the `i++` and the loop runs forever. On this site, an infinite loop gets stopped after 3 seconds.

      **Your turn:** read `n` and count down from `n` to 1, one number per line, then print `GO!`.
    fill: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          [[while]] (n [[>=]] 1) {
              printf("%d\n", n);
              [[n--]];
          }
          printf("GO!\n");
          return 0;
      }
    hints:
      - Keep looping while n is at least 1, and decrease n each time.
      - "The update is `n--`."
    tests:
      - stdin: "3\n"
      - stdin: "1\n"
      - stdin: "0\n"
        hidden: true

  - title: for loops
    text: |
      A `for` loop puts the three parts of a counting loop on one line:

      ```c
      for (int i = 0; i < 5; i++) {
          printf("%d ", i);
      }
      // 0 1 2 3 4
      ```

      1. **init** `int i = 0` runs once
      2. **condition** `i < 5` is checked before each round
      3. **update** `i++` runs after each round

      **Your turn:** read `n` and print the squares from 1 to n on one line, separated by spaces. For `n = 4`: `1 4 9 16`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          // for loop here
          printf("\n");
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          // for loop here
          for (int i = 1; i <= n; i++) {
              printf("%d ", i * i);
          }
          printf("\n");
          return 0;
      }
    require:
      - pattern: "for\\s*\\("
        message: Use a `for` loop.
    hints:
      - Loop `i` from 1 up to and including n, so the condition is `i <= n`.
      - "Inside, print `i * i` followed by a space. (Trailing spaces at the end of a line are ignored by the checker.)"
    tests:
      - stdin: "4\n"
      - stdin: "1\n"
      - stdin: "10\n"
        hidden: true

  - title: Accumulating a total
    text: |
      A very common loop pattern: start a variable at 0 and add to it every round.

      ```c
      int sum = 0;
      for (int i = 1; i <= 100; i++) {
          sum += i;
      }
      ```

      **Your turn:** the first number of input is `n`, followed by `n` damage values. Print the total damage and the highest single hit:

      Input:
      ```
      4
      27 100 64 9
      ```
      Output:
      ```
      total 200
      max 100
      ```
    seed: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          int total = 0;
          int max = 0;

          printf("total %d\n", total);
          printf("max %d\n", max);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          int total = 0;
          int max = 0;
          for (int i = 0; i < n; i++) {
              int d;
              scanf("%d", &d);
              total += d;
              if (d > max) {
                  max = d;
              }
          }
          printf("total %d\n", total);
          printf("max %d\n", max);
          return 0;
      }
    hints:
      - Loop n times. Each round, read one value with scanf.
      - "Add each value to total. If it's bigger than max, update max."
    tests:
      - stdin: "4\n27 100 64 9\n"
      - stdin: "1\n5\n"
      - stdin: "6\n10 20 30 40 50 60\n"
        hidden: true

  - title: break and continue
    text: |
      - `break` leaves the loop immediately.
      - `continue` skips the rest of this round and jumps to the next one.

      ```c
      for (int i = 1; i <= 10; i++) {
          if (i % 2 == 0) continue;  // skip even numbers
          if (i > 7) break;          // stop after 7
          printf("%d ", i);
      }
      // 1 3 5 7
      ```

      **Your turn:** read numbers until you see `0`. Ignore negative numbers. Print the sum of the positive ones. Use `break` for the 0 and `continue` for negatives.
    seed: |
      #include <stdio.h>

      int main(void) {
          int sum = 0;
          int x;
          while (scanf("%d", &x) == 1) {
              // stop at 0, skip negatives, add the rest

          }
          printf("%d\n", sum);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int sum = 0;
          int x;
          while (scanf("%d", &x) == 1) {
              // stop at 0, skip negatives, add the rest
              if (x == 0) break;
              if (x < 0) continue;
              sum += x;
          }
          printf("%d\n", sum);
          return 0;
      }
    require:
      - pattern: "\\bbreak\\b"
        message: Use `break` to stop at 0.
      - pattern: "\\bcontinue\\b"
        message: Use `continue` to skip negative numbers.
    hints:
      - "`if (x == 0) break;`"
      - "`if (x < 0) continue;` then `sum += x;`"
    tests:
      - stdin: "5 -3 10 0 99\n"
      - stdin: "0\n"
      - stdin: "-1 -2 4 0\n"
        hidden: true

  - title: do-while
    text: |
      A `do { } while (cond);` loop checks its condition at the **end**, so the body always runs at least once. It's perfect for "ask until valid" input and for menus.

      ```c
      int x;
      do {
          scanf("%d", &x);
      } while (x < 1 || x > 5);
      ```

      Note the semicolon after `while (...)`.

      **Your turn:** read numbers until one is between 1 and 5 (inclusive). For every invalid number print `invalid N`. Then print `chose N`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int x;

          printf("chose %d\n", x);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int x;
          do {
              scanf("%d", &x);
              if (x < 1 || x > 5) {
                  printf("invalid %d\n", x);
              }
          } while (x < 1 || x > 5);
          printf("chose %d\n", x);
          return 0;
      }
    require:
      - pattern: "\\bdo\\s*\\{"
        message: Use a `do { ... } while (...);` loop.
    hints:
      - "Structure: `do { read; if invalid, print; } while (invalid);`"
      - "Invalid means `x < 1 || x > 5`."
    tests:
      - stdin: "9 0 3\n"
      - stdin: "5\n"
      - stdin: "-4 6 7 1\n"
        hidden: true

  - title: Nested loops
    text: |
      A loop inside a loop runs the inner loop completely for every round of the outer one. That's how you walk a grid.

      ```c
      for (int row = 0; row < 2; row++) {
          for (int col = 0; col < 3; col++) {
              printf("*");
          }
          printf("\n");
      }
      ```
      prints two rows of three stars.

      **Your turn:** read `n` and print a right triangle of `#` with `n` rows. For `n = 4`:

      ```
      #
      ##
      ###
      ####
      ```
    seed: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          for (int row = 1; row <= n; row++) {
              for (int i = 0; i < row; i++) {
                  printf("#");
              }
              printf("\n");
          }
          return 0;
      }
    hints:
      - Row number `row` (starting at 1) has exactly `row` hashes.
      - The inner loop runs `row` times and prints `#`. After it, print a newline.
    tests:
      - stdin: "4\n"
      - stdin: "1\n"
      - stdin: "6\n"
        hidden: true
