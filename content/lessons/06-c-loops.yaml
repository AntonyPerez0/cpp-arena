  - title: Nested loops
    id: c-loops-6
    text: |
      A loop's body can contain another loop. The **inner** loop runs completely, from start to finish, during **each** pass of the outer loop. If the outer loop runs 3 times and the inner loop 4 times, the inner body runs 12 times.

      Nested loops are how you work with anything two-dimensional: rows and columns, a grid, a table.

      ```c run
      #include <stdio.h>

      int main(void) {
          for (int row = 1; row <= 3; row++) {
              for (int col = 1; col <= 4; col++) {
                  printf("%3d", row * col);
              }
              printf("\n");
          }
          return 0;
      }
      ```

      ```output
        1  2  3  4
        2  4  6  8
        3  6  9 12
      ```

      (`%3d` pads each number to 3 characters wide so the columns line up.)

      ### How to think about it

      - The **outer** loop picks the row.
      - The **inner** loop prints everything in that row.
      - After the inner loop finishes, the outer body prints `\n` to end the row.

      The inner loop's limit can depend on the outer counter. For example, `for (int col = 1; col <= row; col++)` makes row 1 have one column, row 2 two columns, and so on, which is how you build triangle shapes.

      Use different counter names for each level (`row` and `col`, or `i` and `j`). Reusing the same name is a common bug.

      **Your turn:** read `n` and print a right triangle of `#` with `n` rows. For `n = 4`:

      ```
      #
      ##
      ###
      ####
      ```
    seed: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          for (int row = 1; row <= n; row++) {
              for (int i = 0; i < row; i++) {
                  printf("#");
              }
              printf("\n");
          }
          return 0;
      }
    hints:
      - Row number `row` (starting at 1) has exactly `row` hashes.
      - The inner loop runs `row` times and prints `#`. After it, print a newline.
    tests:
      - stdin: "4\n"
      - stdin: "1\n"
      - stdin: "6\n"
        hidden: true
    more:
      - task: |
          Read `n` and print an upside-down triangle of `#` with `n` rows. For `n = 4`:

          ```
          ####
          ###
          ##
          #
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              for (int row = n; row >= 1; row--) {
                  for (int i = 0; i < row; i++) {
                      printf("#");
                  }
                  printf("\n");
              }
              return 0;
          }
        hints:
          - Let the outer loop count down, from `n` to 1.
          - The inner loop prints `row` characters, then the outer loop prints `\n`.
        tests:
          - stdin: "4\n"
          - stdin: "1\n"
          - stdin: "6\n"
            hidden: true
      - task: |
          Read `n` and print a staircase that leans to the right: each row has spaces first, then `#`, and the last row has no spaces. For `n = 4`:

          ```
             #
            ##
           ###
          ####
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              for (int row = 1; row <= n; row++) {
                  for (int i = 0; i < n - row; i++) {
                      printf(" ");
                  }
                  for (int i = 0; i < row; i++) {
                      printf("#");
                  }
                  printf("\n");
              }
              return 0;
          }
        hints:
          - Row number `row` has `n - row` spaces followed by `row` hashes.
          - Use two inner loops one after the other, one for the spaces and one for the hashes.
        tests:
          - stdin: "4\n"
          - stdin: "1\n"
          - stdin: "6\n"
            hidden: true

  - title: One character at a time
    id: c-loops-7
    text: |
      `scanf` reads numbers and words. Sometimes you want the raw text instead, one character at a time: counting lines, copying input, cleaning up spacing, or writing your own parser. `getchar()` (from `<stdio.h>`) returns the next character of input, and `putchar(c)` prints one.

      When the input runs out, `getchar()` returns the special value **`EOF`** ("end of file", a negative number, usually -1). So the classic loop reads until then:

      ```c run
      #include <stdio.h>

      int main(void) {
          int c;
          int chars = 0, lines = 0;
          while ((c = getchar()) != EOF) {
              chars++;
              if (c == '\n') {
                  lines++;
              }
          }
          printf("%d characters, %d lines\n", chars, lines);
          return 0;
      }
      ```

      ```input
      gg
      wp
      ```

      ```output
      6 characters, 2 lines
      ```

      ### How it works

      - `(c = getchar()) != EOF` does two things: it stores the next character in `c`, then compares it with `EOF`. The inner parentheses are required, because `!=` binds tighter than `=`: without them, `c` would get the result of the comparison (0 or 1) instead of the character.
      - The newline at the end of each line is a character too (`'\n'`), which is why two 2-letter lines count as 6 characters.
      - `c` is an **`int`**, not a `char`, and this matters. `getchar()` must be able to return every possible byte value **and** `EOF`, which is one more value than a `char` can hold. With `char c`, either the loop never ends (on systems where `char` can't be negative) or a real byte with value 255 is mistaken for the end of input.

      ### Where does input end?

      On this site the input is everything in the input box, so it ends when that text ends. When you run a program in a terminal and type the input yourself, you signal the end with **Ctrl+D** on Linux and macOS, or **Ctrl+Z** then Enter on Windows. When input comes from a file (`./program < data.txt`), it ends at the end of the file.

      ### Remembering the previous character

      Many character-level tasks depend on what came **before**: a word starts where a letter follows a space, a paragraph ends at two newlines in a row. Keep the previous character in a variable and update it at the end of each pass.

      **Your turn:** copy the input to the output, but replace every run of two or more spaces with a single space. Everything else, including newlines, passes through unchanged.
    seed: |
      #include <stdio.h>

      int main(void) {
          int c;

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int c;
          int prev = 0;
          while ((c = getchar()) != EOF) {
              if (c == ' ' && prev == ' ') {
                  continue;
              }
              putchar(c);
              prev = c;
          }
          return 0;
      }
    hints:
      - "Loop with `while ((c = getchar()) != EOF)` and print each character with `putchar(c)`."
      - "Keep an `int prev` holding the last character you printed. Skip the character when both it and `prev` are spaces."
      - "`continue` skips the rest of the loop body, so the `putchar` and the update of `prev` don't happen for skipped spaces."
    tests:
      - stdin: "gg  wp\n"
      - stdin: "no double spaces here\n"
      - stdin: "a   b    c\nsecond     line\n"
      - stdin: " x  \n\n  y\n"
        hidden: true
    more:
      - task: |
          Count the lines and the characters in the input. Don't count the newline characters themselves. Input `gg wp` (one line) prints `lines 1, chars 5`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int c;
              int lines = 0;
              int chars = 0;

              printf("lines %d, chars %d\n", lines, chars);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int c;
              int lines = 0;
              int chars = 0;
              while ((c = getchar()) != EOF) {
                  if (c == '\n') {
                      lines++;
                  } else {
                      chars++;
                  }
              }
              printf("lines %d, chars %d\n", lines, chars);
              return 0;
          }
        hints:
          - "Read with `while ((c = getchar()) != EOF)`."
          - Every `'\n'` ends a line. Everything else is a character to count.
        tests:
          - stdin: "gg wp\n"
          - stdin: "a\nbc\n\n"
          - stdin: "one two three\nfour\n"
            hidden: true
      - task: |
          Copy the input to the output, but make the first letter of every word a capital. A word starts at the beginning of the input or right after a space or newline. Only change lowercase letters `a` to `z`. Input `gg wp` prints `Gg Wp`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int c;
              int prev = ' ';
              while ((c = getchar()) != EOF) {

              }
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int c;
              int prev = ' ';
              while ((c = getchar()) != EOF) {
                  if ((prev == ' ' || prev == '\n') && c >= 'a' && c <= 'z') {
                      c = c - 'a' + 'A';
                  }
                  putchar(c);
                  prev = c;
              }
              return 0;
          }
        hints:
          - Remember the previous character. Starting it at `' '` makes the very first letter count as the start of a word.
          - "Letters are numbers in order, so `c - 'a' + 'A'` turns a lowercase letter into its capital."
        tests:
          - stdin: "gg wp\n"
          - stdin: "hello   world\nnice shot\n"
          - stdin: "1v1 me\n"
            hidden: true
          - stdin: "Already Capital\n"
            hidden: true
