            hidden: true

  - title: for loops
    id: c-loops-2
    text: |
      Most loops count: start somewhere, stop at some point, and step each time. A `for` loop puts all three parts on one line, so you can see the whole plan at a glance:

      ```c
      for (init; condition; update) {
          body
      }
      ```

      1. **init** runs once, before anything else. Usually it creates the counter: `int i = 0`.
      2. **condition** is checked before every pass. If false, the loop ends.
      3. **body** runs.
      4. **update** runs after each pass, usually `i++`. Then back to step 2.

      ```c run
      #include <stdio.h>

      int main(void) {
          for (int i = 0; i < 5; i++) {
              printf("%d ", i);
          }
          printf("\n");
          for (int t = 10; t >= 0; t -= 5) {
              printf("T-%d ", t);
          }
          printf("\n");
          return 0;
      }
      ```

      ```output
      0 1 2 3 4 
      T-10 T-5 T-0 
      ```

      ### Counting conventions

      `for (int i = 0; i < n; i++)` runs exactly **n** times (0 through n-1). This "start at 0, stop before n" style is the standard in C, because it matches array positions, which also start at 0. If you need 1 through n, write `for (int i = 1; i <= n; i++)`.

      A counter declared in the `for` line only exists inside the loop. Using `i` after the loop is a compile error, which keeps names from leaking.

      ### for or while?

      They can do the same things. Use `for` when you're counting or the number of passes is known; use `while` when you loop until something happens (like input running out).

      **Your turn:** read `n` and print the squares from 1 to n on one line, separated by spaces. For `n = 4`: `1 4 9 16`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          // for loop here
          printf("\n");
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          // for loop here
          for (int i = 1; i <= n; i++) {
              printf("%d ", i * i);
          }
          printf("\n");
          return 0;
      }
    require:
      - pattern: "for\\s*\\("
        message: Use a `for` loop.
    hints:
      - Loop `i` from 1 up to and including n, so the condition is `i <= n`.
      - "Inside, print `i * i` followed by a space. (Trailing spaces at the end of a line are ignored by the checker.)"
    tests:
