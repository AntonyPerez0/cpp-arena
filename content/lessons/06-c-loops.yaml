  - title: do-while
    id: c-loops-5
    text: |
      `while` and `for` check their condition **before** each pass. `do ... while` checks it **after**, so the body always runs **at least once**:

      ```c
      do {
          body
      } while (condition);
      ```

      Note the semicolon after the closing parenthesis; forgetting it is a compile error.

      This fits situations where you must do something before you can decide whether to repeat, such as asking for input and then checking it:

      ```c run
      #include <stdio.h>

      int main(void) {
          int guess;
          int tries = 0;
          do {
              scanf("%d", &guess);
              tries++;
          } while (guess != 42);
          printf("got it in %d tries\n", tries);
          return 0;
      }
      ```

      ```input
      10 50 42 7
      ```

      ```output
      got it in 3 tries
      ```

      With a plain `while`, you'd need to read once before the loop and again inside it, repeating code. `do-while` avoids that.

      ### Validation loops

      "Keep asking until the input is valid" is the classic use. The condition describes **invalid** input, so the loop repeats while the input is bad. Write the condition carefully: "less than 1 **or** greater than 5" is outside the range; "less than 1 **and** greater than 5" can never be true, so the loop would never repeat.

      **Your turn:** read numbers until one is between 1 and 5 (inclusive). For every invalid number print `invalid N`. Then print `chose N`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int x;

          printf("chose %d\n", x);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int x;
          do {
              scanf("%d", &x);
              if (x < 1 || x > 5) {
                  printf("invalid %d\n", x);
              }
          } while (x < 1 || x > 5);
          printf("chose %d\n", x);
          return 0;
      }
    require:
      - pattern: "\\bdo\\s*\\{"
        message: Use a `do { ... } while (...);` loop.
    hints:
      - "Structure: `do { read; if invalid, print; } while (invalid);`"
      - "Invalid means `x < 1 || x > 5`."
    tests:
      - stdin: "9 0 3\n"
      - stdin: "5\n"
      - stdin: "-4 6 7 1\n"
        hidden: true
    more:
      - task: |
          Keep reading numbers and adding them up until the total is at least 100. Then print the total and how many numbers it took. Use a `do { ... } while (...);` loop. Input `40 30 50` prints:

          ```
          total 120
          numbers 3
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int total = 0;
              int count = 0;

              printf("total %d\n", total);
              printf("numbers %d\n", count);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int total = 0;
              int count = 0;
              do {
                  int x;
                  scanf("%d", &x);
                  total += x;
                  count++;
              } while (total < 100);
              printf("total %d\n", total);
              printf("numbers %d\n", count);
              return 0;
          }
        require:
          - pattern: "\\bdo\\s*\\{"
            message: Use a `do { ... } while (...);` loop.
        hints:
          - Inside the loop, read one number, add it to `total` and count it.
          - Repeat while the total is still below 100, `while (total < 100);`.
        tests:
          - stdin: "40 30 50\n"
          - stdin: "150\n"
          - stdin: "99 1\n"
            hidden: true
      - task: |
          Read a number that is 0 or more and print how many digits it has. Divide by 10 until nothing is left, counting each division. A `do-while` makes `0` come out right (it has 1 digit) without a special case. Input `12345` prints `5`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              int digits = 0;

              printf("%d\n", digits);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int n;
              scanf("%d", &n);
              int digits = 0;
              do {
                  digits++;
                  n /= 10;
              } while (n > 0);
              printf("%d\n", digits);
              return 0;
          }
        require:
          - pattern: "\\bdo\\s*\\{"
            message: Use a `do { ... } while (...);` loop.
        hints:
          - Each `n /= 10` removes the last digit.
          - The body runs at least once, so even 0 is counted as one digit. Repeat while `n > 0`.
        tests:
          - stdin: "12345\n"
          - stdin: "0\n"
          - stdin: "7\n"
