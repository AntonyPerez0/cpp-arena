              return 0;
          }
        hints:
          - "The names follow a pattern: `INT_MAX`, `SHRT_MAX`, `LONG_MAX`, and `U` in front for unsigned types, like `UINT_MAX`."
        tests:
          - expect: "short max 32767\nunsigned char max 255"
      - task: |
          Print the size of `short`, `int` and `long long` with `sizeof`, and the largest `unsigned int` from `<limits.h>`. Pick the right format for each: `%zu` for sizes, `%u` for an unsigned int.

          ```
          short 2
          int 4
          long long 8
