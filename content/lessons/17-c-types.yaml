  - title: The signed/unsigned comparison trap
    id: c-types-5
    text: |
      When an expression mixes a signed and an unsigned integer of the same (or larger) size, C converts the **signed one to unsigned** before operating. For comparisons this produces results that look impossible:

      ```c run
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          int n = -1;
          size_t len = strlen("abc");
          printf("%d\n", len > (size_t)n);
          printf("%d\n", n < 0 || len > (size_t)n);
          unsigned int u = 1;
          printf("%d\n", -1 < (int)u);
          return 0;
      }
      ```

      ```output
      0
      1
      1
      ```

      The first line asks "is 3 greater than -1?" and gets **false**, because -1 converted to `size_t` is the largest possible value. (The example writes the conversion out as `(size_t)n` so it compiles without warnings, but plain `len > n` does exactly the same conversion behind your back.) The second line handles the negative case **first**, before any conversion happens, and gets the right answer. The third converts the unsigned side to `int` instead, which is safe here because 1 fits.

      ### Small types are promoted first

      Before doing arithmetic, C converts `char` and `short` (signed or unsigned) to `int`. These **integer promotions** mean small types don't overflow in the middle of an expression:

      ```c run
      #include <stdio.h>

      int main(void) {
          unsigned char a = 200, b = 100;
          int sum = a + b;                  /* both promoted to int: 300 */
          unsigned char wrapped = a + b;    /* 300 doesn't fit in 1 byte: stored as 300 - 256 = 44 */
          printf("%d %d\n", sum, wrapped);
          return 0;
      }
      ```

      ```output
      300 44
      ```

      The addition happens in `int`. Only storing the result in the 1-byte `wrapped` loses information, and since that's a conversion to an unsigned type it wraps around, which is well defined. Promotion is also why `printf("%d", c)` works for a `char`: it arrives as an `int`.

      ### Where this bites

      `strlen`, `sizeof` and container sizes are all unsigned (`size_t`). Comparing them with an `int` that might be negative, or subtracting two sizes (`a_len - b_len` is huge, not negative, when b is longer), are classic bugs.

      ### Fixes

      - Handle the negative case separately before comparing, as in the second line.
      - Or convert the unsigned value to a signed type that's **wide enough** to hold it. Converting a `size_t` to `int` is not safe in general, since a length can exceed `INT_MAX`.
      - Compile with `-Wall -Wextra`: `-Wsign-compare` flags these. Treat that warning as a bug report, not noise.

      **Your turn:** `longer_than(s, n)` should return 1 when `s` has more than `n` characters. It's wrong for negative `n` (every string is longer than -1 characters). Fix it without casting the length to `int` (strings can be longer than `INT_MAX`).
    seed: |
      #include <string.h>

      int longer_than(const char *s, int n) {
          return strlen(s) > n;
      }
    solution: |
      #include <string.h>

      int longer_than(const char *s, int n) {
          return n < 0 || strlen(s) > (size_t)n;
      }
    forbid:
      - pattern: "\\(\\s*int\\s*\\)\\s*strlen"
        message: "Don't cast the length to int; handle negative n first, then compare as size_t."
    harness: |
      int main(void) {
          CHECK_INT("\"abc\" longer than 2", longer_than("abc", 2), 1);
          CHECK_INT("\"abc\" not longer than 3", longer_than("abc", 3), 0);
          CHECK_INT("\"\" not longer than 0", longer_than("", 0), 0);
          CHECK_INT("\"abc\" longer than -1", longer_than("abc", -1), 1);
          CHECK_INT("\"\" longer than -5", longer_than("", -5), 1);
          return 0;
      }
    hints:
      - "Handle the negative case first: any string is longer than a negative length."
      - "Once n is known to be >= 0, `(size_t)n` is safe: `return n < 0 || strlen(s) > (size_t)n;`"
    more:
      - task: |
          `last_index_of` should return the index of the last `c` in `s`, or -1. Its loop counts down with a `size_t`, but `i >= 0` is **always** true for an unsigned type, and for an empty string `strlen(s) - 1` wraps around to a huge number. Fix the loop so it works for every string.
        seed: |
          #include <string.h>

          int last_index_of(const char *s, char c) {
              for (size_t i = strlen(s) - 1; i >= 0; i--) {
                  if (s[i] == c) return (int)i;
              }
              return -1;
          }
        solution: |
          #include <string.h>

          int last_index_of(const char *s, char c) {
              for (size_t i = strlen(s); i-- > 0;) {
                  if (s[i] == c) return (int)i;
              }
              return -1;
          }
        harness: |
          int main(void) {
              CHECK_INT("last 'g' in \"gg wp\"", last_index_of("gg wp", 'g'), 1);
              CHECK_INT("'p' is the last character", last_index_of("gg wp", 'p'), 4);
              CHECK_INT("first character", last_index_of("ace", 'a'), 0);
              CHECK_INT("missing character", last_index_of("gg wp", 'z'), -1);
              CHECK_INT("empty string", last_index_of("", 'a'), -1);
              return 0;
          }
        forbid:
          - pattern: "i\\s*>=\\s*0"
            message: An unsigned `i >= 0` is always true. Use the `i-- > 0` pattern instead.
        hints:
          - "`for (size_t i = strlen(s); i-- > 0;)` tests `i` before subtracting, so it visits the last index down to 0 and stops."
        tests: []
      - task: |
          `has_room(used, cap, want)` should say whether `want` more items fit: `used + want <= cap`. A negative `want` means items are being **removed**, which always fits. The current code is wrong for negative `want`, because the int is converted to a huge `size_t` before adding. Fix it without casting the sizes to `int`.
        seed: |
          #include <stddef.h>

          int has_room(size_t used, size_t cap, int want) {
              return used + want <= cap;
          }
        solution: |
          #include <stddef.h>

          int has_room(size_t used, size_t cap, int want) {
              if (want <= 0) return 1;
              if (used > cap) return 0;
              return (size_t)want <= cap - used;
          }
        harness: |
          #include <stdint.h>
          int main(void) {
              CHECK_INT("3 more into 5 of 10", has_room(5, 10, 3), 1);
              CHECK_INT("5 more into 5 of 10 fills it exactly", has_room(5, 10, 5), 1);
              CHECK_INT("6 more into 5 of 10", has_room(5, 10, 6), 0);
              CHECK_INT("removing 2 always fits", has_room(5, 10, -2), 1);
              CHECK_INT("removing from a full list", has_room(10, 10, -10), 1);
              CHECK_INT("no overflow near SIZE_MAX", has_room(SIZE_MAX - 1, SIZE_MAX, 5), 0);
              return 0;
          }
        forbid:
          - pattern: "\\(\\s*int\\s*\\)\\s*(used|cap)"
            message: Don't cast the sizes to `int`; they can be larger than `INT_MAX`.
        hints:
          - Handle `want <= 0` first. After that, `want` is positive and converting it to `size_t` is safe.
          - Compare `want` with the free space, `cap - used`, instead of computing `used + want`, which could wrap around.
        tests: []

  - title: Floating-point rounding
    id: c-types-6
    text: |
      `double` stores numbers in **binary** floating point: a sign, an exponent and about 53 bits of precision. Whole numbers up to about 9 quadrillion are exact, but most decimal **fractions** have no exact binary form, just as 1/3 has no exact decimal form. 0.1 is stored as the nearest binary fraction, slightly off. Arithmetic then accumulates those tiny errors:

      ```c run
      #include <stdio.h>

      int main(void) {
          double a = 0.1 + 0.2;
          printf("%d\n", a == 0.3);
          printf("%.17f\n", a);
          double total = 0;
          for (int i = 0; i < 10; i++) total += 0.1;
          printf("%d %.17f\n", total == 1.0, total);
          long long cents = 0;
          for (int i = 0; i < 10; i++) cents += 10;
          printf("%lld.%02lld\n", cents / 100, cents % 100);
          return 0;
      }
      ```

      ```output
      0
      0.30000000000000004
      0 0.99999999999999989
      1.00
      ```

      ### Two rules professionals follow

      1. **Never compare doubles with `==` after arithmetic.** Ask whether they're *close enough* instead. The tolerance should scale with the size of the numbers: an error of 0.000001 is huge for values near 0.000001 but negligible for values near a million. A good test is `|a - b| <= eps * max(1, |a|, |b|)`, which behaves like an absolute tolerance for small numbers and a relative one for big numbers.
      2. **Never store money in `double`.** Store whole **cents** in an integer type (as in the last part of the example), and only format as dollars for display. Banks and payment systems do exactly this.

      Printing with `%.2f` hides the error but doesn't remove it; comparisons and repeated sums still see it.

      **Your turn:** write `int nearly_equal(double a, double b, double eps)` using that formula. Don't use `<math.h>`; write the absolute value yourself.
    seed: |
      int nearly_equal(double a, double b, double eps) {

      }
    solution: |
      static double absd(double x) { return x < 0 ? -x : x; }

      int nearly_equal(double a, double b, double eps) {
          double scale = 1.0;
          if (absd(a) > scale) scale = absd(a);
          if (absd(b) > scale) scale = absd(b);
          return absd(a - b) <= eps * scale;
      }
    harness: |
      int main(void) {
          CHECK_INT("0.1 + 0.2 vs 0.3", nearly_equal(0.1 + 0.2, 0.3, 1e-9), 1);
          CHECK_INT("but == says no", (0.1 + 0.2 == 0.3), 0);
          CHECK_INT("1.0 vs 1.1", nearly_equal(1.0, 1.1, 1e-9), 0);
          CHECK_INT("big numbers scale the tolerance", nearly_equal(1e12, 1e12 + 1, 1e-9), 1);
          CHECK_INT("small numbers use absolute tolerance", nearly_equal(1e-12, 0.0, 1e-9), 1);
          CHECK_INT("negative numbers", nearly_equal(-2.5, -2.5000000001, 1e-9), 1);
          return 0;
      }
    hints:
      - "Write a tiny helper: `static double absd(double x) { return x < 0 ? -x : x; }`"
      - "scale starts at 1.0 and grows to |a| or |b| if either is bigger."
      - "`return absd(a - b) <= eps * scale;`"
    more:
      - task: |
          Write `long round_cents(double dollars)` that converts an amount to whole cents, rounding to the **nearest** cent (halves away from zero). `19.99` is `1999` even though `19.99 * 100` is slightly less than 1999 in floating point. Don't use `<math.h>`.
        seed: |
          long round_cents(double dollars) {

          }
        solution: |
          long round_cents(double dollars) {
              double cents = dollars * 100.0;
              return (long)(cents < 0 ? cents - 0.5 : cents + 0.5);
          }
        harness: |
          int main(void) {
              CHECK_INT("19.99", round_cents(19.99), 1999);
              CHECK_INT("0.1 + 0.2", round_cents(0.1 + 0.2), 30);
              CHECK_INT("4.5", round_cents(4.5), 450);
              CHECK_INT("-2.5", round_cents(-2.5), -250);
              CHECK_INT("-0.07", round_cents(-0.07), -7);
              CHECK_INT("0.004 rounds down", round_cents(0.004), 0);
              CHECK_INT("0.006 rounds up", round_cents(0.006), 1);
              return 0;
          }
        hints:
          - Casting to `long` just cuts off the decimals, so `1998.9999` becomes `1998`.
          - Add `0.5` before the cast (or subtract it for negative amounts) to round to the nearest whole number.
        tests: []
      - task: |
          Adding many small numbers to a big one loses them to rounding. **Kahan summation** keeps a running correction for what was lost. Write `double kahan_sum(const double *a, int n)`:

          ```
          sum = 0, c = 0
          for each x:
              y = x - c
              t = sum + y
              c = (t - sum) - y
              sum = t
          ```
        seed: |
          double kahan_sum(const double *a, int n) {

          }
        solution: |
          double kahan_sum(const double *a, int n) {
              double sum = 0.0, c = 0.0;
              for (int i = 0; i < n; i++) {
                  double y = a[i] - c;
                  double t = sum + y;
                  c = (t - sum) - y;
                  sum = t;
              }
              return sum;
          }
        harness: |
          int main(void) {
              double a[101];
              a[0] = 1e16;
              for (int i = 1; i <= 100; i++) a[i] = 1.0;
              double naive = 0;
              for (int i = 0; i <= 100; i++) naive += a[i];
              CHECK("plain adding loses the ones", naive == 1e16);
              CHECK("1e16 plus a hundred 1s", kahan_sum(a, 101) == 1e16 + 100);
              double b[] = {0.1, 0.2, 0.3};
              CHECK_DBL("0.1 + 0.2 + 0.3", kahan_sum(b, 3), 0.6);
              CHECK("empty array is 0", kahan_sum(b, 0) == 0.0);
              return 0;
          }
        hints:
          - Follow the pseudocode exactly. `c` holds the part of the last addition that rounding threw away.
          - Algebra says `c` is always 0, but in floating point it isn't, which is the whole point. Don't simplify the formula.
        tests: []

  - title: Type punning and strict aliasing
    id: c-types-8
    text: |
      Sometimes you need the raw bits of a value: hashing a `float`, writing it to a network message, inspecting how it's stored. The tempting way is to cast the pointer:

      ```c
      float f = 1.0f;
      uint32_t bits = *(uint32_t *)&f;     /* undefined behavior */
      ```

      This is undefined behavior because of the **strict aliasing rule**: an object may only be read or written through an expression of its own type (or a signed/unsigned version of it, or a character type). A `float` must not be accessed as a `uint32_t`.

      ### Why the rule exists

      The rule lets the compiler assume that pointers to **different** types never point at the same memory, and optimize based on that:

      ```c
      int f(int *i, float *fp) {
          *i = 1;
          *fp = 2.0f;
          return *i;
      }
      ```

      GCC with `-O2` compiles this to "store 1, store 2.0, return 1": it doesn't read `*i` again, because a store through a `float *` can't have changed an `int`. If a caller passes the same address for both, the function returns 1 even though the memory now holds the bits of 2.0. Casting pointers between unrelated types breaks this assumption, and the optimizer produces code that seems to ignore your writes.

      ### The right way: copy the bytes

      `memcpy` copies bytes, and reading any object's bytes is always allowed. Compilers recognize a small fixed-size `memcpy` and turn it into a single register move, so it costs nothing:

      ```c run
      #include <stdint.h>
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          float values[] = {1.0f, -0.0f, 0.5f};
          for (int i = 0; i < 3; i++) {
              uint32_t bits;
              memcpy(&bits, &values[i], sizeof bits);
              printf("%5.1f -> %08x\n", values[i], (unsigned)bits);
          }
          return 0;
      }
      ```

      ```output
        1.0 -> 3f800000
       -0.0 -> 80000000
        0.5 -> 3f000000
      ```

      A `float` is 32 bits: 1 **sign** bit, 8 **exponent** bits and 23 **fraction** bits (the IEEE 754 format that every mainstream processor uses). That's why `-0.0` differs from `0.0` only in the top bit, `0x80000000`.

      ### The rules in short

      - Reading or writing any object through `char *` or `unsigned char *` is allowed. That's how `memcpy`, hashing and serialization code look at bytes.
      - To reinterpret a value as another type, `memcpy` it. In C, reading a different member of a union also works (the unions step covers it). In C++ use `std::bit_cast` (C++20) or `memcpy`; union punning is undefined behavior there.
      - GCC and Clang's `-fno-strict-aliasing` turns the optimization off, and the Linux kernel is built with it. Portable code shouldn't rely on it.

      **Your turn:** write `float_bits(f)`, returning a float's 32 bits, `bits_to_float(bits)`, the reverse, and `sign_bit(f)`, returning 1 if the sign bit is set (so `sign_bit(-0.0f)` is 1) and 0 otherwise. Use `memcpy`, not pointer casts.
    seed: |
      #include <stdint.h>
      #include <string.h>

      uint32_t float_bits(float f) {

      }

      float bits_to_float(uint32_t bits) {

      }

      int sign_bit(float f) {

      }
    solution: |
      #include <stdint.h>
      #include <string.h>

      uint32_t float_bits(float f) {
          uint32_t bits;
          memcpy(&bits, &f, sizeof bits);
          return bits;
      }

      float bits_to_float(uint32_t bits) {
          float f;
          memcpy(&f, &bits, sizeof f);
          return f;
      }

      int sign_bit(float f) {
          return (int)(float_bits(f) >> 31);
      }
    require:
      - pattern: "memcpy"
        message: Copy the bytes with memcpy; casting a float * to a uint32_t * breaks the strict aliasing rule.
    forbid:
      - pattern: "\\(\\s*(const\\s+)?(uint32_t|unsigned|int|float)\\s*\\*\\s*\\)"
        message: No pointer casts between float and integer types; that's the undefined behavior this step is about.
    harness: |
      int main(void) {
          CHECK("1.0f is 0x3f800000", float_bits(1.0f) == 0x3f800000u);
          CHECK("0.0f is all zeros", float_bits(0.0f) == 0u);
          CHECK("-2.0f is 0xc0000000", float_bits(-2.0f) == 0xc0000000u);
          CHECK_DBL("0x40490fdb is pi as a float", bits_to_float(0x40490fdbu), 3.14159274101257);
          CHECK_DBL("round trip", bits_to_float(float_bits(123.25f)), 123.25);
          CHECK_INT("sign of -0.0f", sign_bit(-0.0f), 1);
          CHECK_INT("sign of 0.0f", sign_bit(0.0f), 0);
          CHECK_INT("sign of -7.5f", sign_bit(-7.5f), 1);
          CHECK_INT("sign of 7.5f", sign_bit(7.5f), 0);
          return 0;
      }
    hints:
      - "`uint32_t bits; memcpy(&bits, &f, sizeof bits); return bits;`"
      - "bits_to_float is the same copy in the other direction."
      - "The sign is the top bit: `float_bits(f) >> 31` is 1 or 0."
    more:
      - task: |
          Files and network data often store numbers as bytes in **little-endian** order (lowest byte first). Write `uint32_t read_u32_le(const unsigned char *p)` and `void write_u32_le(unsigned char *p, uint32_t v)` with shifts, so they give the same result on every machine. Don't cast the byte pointer to a `uint32_t *`.
        seed: |
          #include <stdint.h>

          uint32_t read_u32_le(const unsigned char *p) {

          }

          void write_u32_le(unsigned char *p, uint32_t v) {

          }
        solution: |
          #include <stdint.h>

          uint32_t read_u32_le(const unsigned char *p) {
              return (uint32_t)p[0] | ((uint32_t)p[1] << 8) | ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24);
          }

          void write_u32_le(unsigned char *p, uint32_t v) {
              p[0] = (unsigned char)v;
              p[1] = (unsigned char)(v >> 8);
              p[2] = (unsigned char)(v >> 16);
              p[3] = (unsigned char)(v >> 24);
          }
        harness: |
          int main(void) {
              const unsigned char in[4] = {0x78, 0x56, 0x34, 0x12};
              CHECK("bytes 78 56 34 12 are 0x12345678", read_u32_le(in) == 0x12345678u);
              const unsigned char big[4] = {0xFF, 0xFF, 0xFF, 0xFF};
              CHECK("all FF is 0xFFFFFFFF", read_u32_le(big) == 0xFFFFFFFFu);
              unsigned char out[4] = {0};
              write_u32_le(out, 0xA1B2C3D4u);
              CHECK("0xA1B2C3D4 is written D4 C3 B2 A1", out[0] == 0xD4 && out[1] == 0xC3 && out[2] == 0xB2 && out[3] == 0xA1);
              CHECK("round trip", read_u32_le(out) == 0xA1B2C3D4u);
              return 0;
          }
        forbid:
          - pattern: "\\(\\s*(const\\s+)?(uint32_t|unsigned|int)\\s*\\*\\s*\\)"
            message: Build the number from the bytes with shifts instead of casting the pointer.
        hints:
          - Byte `k` is worth `256` to the power `k`, which is a shift of `8 * k` bits. Convert each byte to `uint32_t` before shifting.
          - To write, shift the value right by `8 * k` and keep the low byte with a cast to `unsigned char`.
        tests: []
      - task: |
          A float stores an exponent in bits 23 to 30, with 127 added to it. Write `int float_exponent(float f)` that returns the real exponent for normal (non-zero) floats: `1.0f` gives 0, `8.0f` gives 3, `0.5f` gives -1. Get the bits with `memcpy`.
        seed: |
