  - title: Unsigned wraparound
    id: c-types-2
    text: |
      Unsigned integers can't be negative. Instead, their arithmetic is defined to **wrap around**: results are taken modulo 2 to the power N, like a car's odometer rolling over. Go below 0 and you land at the maximum; go above the maximum and you land at 0.

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      int main(void) {
          unsigned int x = 0;
          x = x - 1;
          printf("%u\n", x);
          unsigned char c = 250;
          c = c + 10;
          printf("%u\n", c);
          size_t n = 3;
          for (size_t i = n; i-- > 0; ) {
              printf("%zu ", i);
          }
          printf("\n");
          return 0;
      }
      ```

      ```output
      4294967295
      4
      2 1 0 
      ```

      This wrapping is **well-defined** (unlike signed overflow, next step), and useful for hashing, checksums and bit manipulation.

      ### The countdown trap

      `size_t` (the type of `sizeof`, `strlen` and array sizes) is unsigned. That makes this innocent-looking loop run forever:

      ```c
      for (size_t i = n - 1; i >= 0; i--)   /* i >= 0 is ALWAYS true */
      ```

      When `i` is 0 and gets decremented, it wraps to the maximum value instead of becoming -1, so the condition never fails. (If `n` is 0, `n - 1` is already the maximum.) GCC warns about this with `-Wextra` (`comparison of unsigned expression in '>= 0' is always true`), but the compiler on this site doesn't, so you have to recognize the pattern yourself.

      The idiomatic fix, used in the example, tests **before** decrementing: `for (size_t i = n; i-- > 0; )`. The condition uses the old value of `i` (is it above 0?) and then decrements, so the body sees n-1 down to 0, and it's correct even when n is 0.

      **Your turn:** read a count `n` and then `n` integers into an array (at most 100), and print them in **reverse** order on one line, separated by spaces. Use a `size_t` index for the reverse loop.
    seed: |
      #include <stddef.h>
      #include <stdio.h>

      int main(void) {
          size_t n;
          int a[100];
          if (scanf("%zu", &n) != 1 || n > 100) return 1;
          for (size_t i = 0; i < n; i++) scanf("%d", &a[i]);
          // print a[n-1] ... a[0] here

          printf("\n");
          return 0;
      }
    solution: |
      #include <stddef.h>
      #include <stdio.h>

      int main(void) {
          size_t n;
          int a[100];
          if (scanf("%zu", &n) != 1 || n > 100) return 1;
          for (size_t i = 0; i < n; i++) scanf("%d", &a[i]);
          // print a[n-1] ... a[0] here
          for (size_t i = n; i-- > 0;) {
              printf("%d", a[i]);
              if (i > 0) printf(" ");
          }
          printf("\n");
          return 0;
      }
    require:
      - pattern: "size_t\\s+\\w+\\s*=\\s*n"
        message: "Count down with a `size_t` index, starting from `n`: `for (size_t i = n; i-- > 0; )`."
    hints:
      - "`for (size_t i = n; i-- > 0; )` checks i > 0 and *then* decrements, so the body sees n-1 down to 0."
      - "Print a space after every number except the last one printed (when i is 0)."
    tests:
      - stdin: "4\n1 2 3 4\n"
      - stdin: "1\n9\n"
      - stdin: "0\n"
        allowEmpty: true
      - stdin: "5\n-1 0 7 7 3\n"
        hidden: true
    more:
      - task: |
          Read a count `n` (at most 100) and `n` integers. Print the index (counting from 0) of the **last** negative number, or `none`. Search backwards with a `size_t` index, and make sure the loop still ends when the index reaches 0.
        seed: |
          #include <stddef.h>
          #include <stdio.h>

          int main(void) {
              size_t n;
              int a[100];
              if (scanf("%zu", &n) != 1 || n > 100) return 1;
              for (size_t i = 0; i < n; i++) scanf("%d", &a[i]);

              return 0;
          }
        solution: |
          #include <stddef.h>
          #include <stdio.h>

          int main(void) {
              size_t n;
              int a[100];
              if (scanf("%zu", &n) != 1 || n > 100) return 1;
              for (size_t i = 0; i < n; i++) scanf("%d", &a[i]);
              for (size_t i = n; i-- > 0;) {
                  if (a[i] < 0) {
                      printf("%zu\n", i);
                      return 0;
                  }
              }
              printf("none\n");
              return 0;
          }
        require:
          - pattern: "size_t\\s+\\w+\\s*=\\s*n"
            message: Start a `size_t` index at `n` and count down.
        hints:
          - "`for (size_t i = n; i-- > 0;)` visits `n - 1` down to `0` and stops. `i >= 0` would never be false for an unsigned `i`."
          - Print a `size_t` with `%zu`.
        tests:
          - stdin: "5\n3 -1 4 -1 5\n"
          - stdin: "3\n1 2 3\n"
          - stdin: "0\n"
          - stdin: "1\n-7\n"
            hidden: true
      - task: |
          Write `size_t safe_sub(size_t a, size_t b)` that returns `a - b`, or `0` when `b` is bigger than `a`. Plain `a - b` would wrap around to a huge number instead of going negative.
        seed: |
          #include <stddef.h>

          size_t safe_sub(size_t a, size_t b) {

          }
        solution: |
          #include <stddef.h>

          size_t safe_sub(size_t a, size_t b) {
              return b > a ? 0 : a - b;
          }
        harness: |
          #include <stdint.h>
          int main(void) {
              CHECK("10 - 3 is 7", safe_sub(10, 3) == 7);
              CHECK("3 - 10 is 0, not a huge number", safe_sub(3, 10) == 0);
              CHECK("5 - 5 is 0", safe_sub(5, 5) == 0);
              CHECK("SIZE_MAX - 1", safe_sub(SIZE_MAX, 1) == SIZE_MAX - 1);
              CHECK("0 - SIZE_MAX is 0", safe_sub(0, SIZE_MAX) == 0);
              return 0;
          }
        hints:
          - Compare first, then subtract only when it can't wrap.
        tests: []

  - title: Signed overflow is undefined
    id: c-types-3
    text: |
      For **signed** integers, going past `INT_MAX` (or below `INT_MIN`) is **undefined behavior** (UB). "Undefined" doesn't mean "wraps around like unsigned". It means the C standard places **no requirements at all** on what happens, and the compiler is allowed to assume it never occurs.

      That assumption is used by optimizers. For example, a compiler may delete a check like `if (x + 1 < x)` entirely, reasoning that in a correct program `x + 1` can never be less than `x`. So "detect overflow after it happened" doesn't work: the detection code itself can vanish.

      ### Check before, with operations that can't overflow

      To know whether `a + b` would overflow, rearrange the question so no step can overflow:

      - If `b > 0`, the sum overflows upward exactly when `a > INT_MAX - b`. (`INT_MAX - b` is safe because `b` is positive.)
      - If `b < 0`, it overflows downward exactly when `a < INT_MIN - b`.

      ```c run
      #include <stdio.h>
      #include <limits.h>

      int checked_mul(int a, int b, int *out) {
          long long wide = (long long)a * b;
          if (wide > INT_MAX || wide < INT_MIN) {
              return 0;
          }
          *out = (int)wide;
          return 1;
      }

      int main(void) {
          int r = 0;
          int ok = checked_mul(50000, 50000, &r);
          printf("%d %d\n", ok, r);
          ok = checked_mul(-300, 7, &r);
          printf("%d %d\n", ok, r);
          return 0;
      }
      ```

      ```output
      0 0
      1 -2100
      ```

      This example checks multiplication a different way: doing the math in a **wider type** (`long long` holds any product of two ints) and then checking the range. That works when a wider type exists; the rearranged comparisons work even for the widest type.

      Leaving `*out` untouched on failure lets the caller rely on its previous value. (GCC and Clang also offer `__builtin_add_overflow`, and C23 standardizes `ckd_add` in `<stdckdint.h>`.)

      **Your turn:** write `int checked_add(int a, int b, int *out)`. If the sum fits, store it in `*out` and return 1. Otherwise return 0 and leave `*out` untouched.
    seed: |
      #include <limits.h>

      int checked_add(int a, int b, int *out) {

      }
    solution: |
      #include <limits.h>

      int checked_add(int a, int b, int *out) {
          if (b > 0 && a > INT_MAX - b) return 0;
          if (b < 0 && a < INT_MIN - b) return 0;
          *out = a + b;
          return 1;
      }
    forbid:
      - pattern: "__builtin|ckd_add|long\\s+long"
        message: Write the check with plain `int` comparisons against INT_MAX and INT_MIN.
    harness: |
      #include <limits.h>
      int main(void) {
          int r = 0;
          CHECK_INT("2 + 3 fits", checked_add(2, 3, &r), 1);
          CHECK_INT("2 + 3 result", r, 5);
          r = 42;
          CHECK_INT("INT_MAX + 1 overflows", checked_add(INT_MAX, 1, &r), 0);
          CHECK_INT("out untouched on overflow", r, 42);
          CHECK_INT("INT_MIN + -1 overflows", checked_add(INT_MIN, -1, &r), 0);
          CHECK_INT("INT_MAX + INT_MIN fits", checked_add(INT_MAX, INT_MIN, &r), 1);
          CHECK_INT("INT_MAX + INT_MIN is -1", r, -1);
          CHECK_INT("INT_MAX + 0 fits", checked_add(INT_MAX, 0, &r), 1);
          CHECK_INT("-5 + -7", checked_add(-5, -7, &r) && r == -12, 1);
          return 0;
      }
    hints:
      - "Positive b: the sum overflows exactly when `a > INT_MAX - b`. That subtraction is safe because b > 0."
      - "Negative b: the sum underflows exactly when `a < INT_MIN - b`."
      - "Only compute `a + b` after both checks pass."
    more:
      - task: |
          Write `int checked_mul(int a, int b, int *out)`. If the product fits in an `int`, store it and return 1. Otherwise return 0 and leave `*out` alone. As in this step, don't compute the product in a wider type; check with division **before** multiplying.
        seed: |
          #include <limits.h>

          int checked_mul(int a, int b, int *out) {

          }
        solution: |
          #include <limits.h>

          int checked_mul(int a, int b, int *out) {
              if (a > 0) {
                  if (b > 0) {
                      if (a > INT_MAX / b) return 0;
                  } else {
                      if (b < INT_MIN / a) return 0;
                  }
              } else if (a < 0) {
                  if (b > 0) {
                      if (a < INT_MIN / b) return 0;
                  } else if (b < 0) {
                      if (a < INT_MAX / b) return 0;
                  }
              }
              *out = a * b;
              return 1;
          }
        harness: |
          #include <limits.h>
          int main(void) {
              int r = 0;
              CHECK_INT("6 * 7 fits", checked_mul(6, 7, &r), 1);
              CHECK_INT("6 * 7 result", r, 42);
              r = 5;
              CHECK_INT("INT_MAX * 2 overflows", checked_mul(INT_MAX, 2, &r), 0);
              CHECK_INT("out untouched on overflow", r, 5);
              CHECK_INT("INT_MIN * -1 overflows", checked_mul(INT_MIN, -1, &r), 0);
              CHECK_INT("-1 * INT_MIN overflows", checked_mul(-1, INT_MIN, &r), 0);
              CHECK_INT("65536 * 32768 overflows", checked_mul(65536, 32768, &r), 0);
              CHECK_INT("-65536 * 32768 fits exactly", checked_mul(-65536, 32768, &r) && r == INT_MIN, 1);
              CHECK_INT("-3 * -4", checked_mul(-3, -4, &r) && r == 12, 1);
              CHECK_INT("0 * INT_MIN", checked_mul(0, INT_MIN, &r) && r == 0, 1);
              return 0;
          }
        forbid:
          - pattern: "__builtin|ckd_mul|long\\s+long"
            message: Check with division instead of a wider type or a compiler built-in.
        hints:
          - Split by the signs of `a` and `b`. If either is 0 the product is 0 and always fits.
          - "Both positive: it overflows when `a > INT_MAX / b`. The other three sign combinations each compare with `INT_MIN / x` or `INT_MAX / b` in the same way."
        tests: []
      - task: |
          Write `int parse_int(const char *s, int *out)` that accepts only a complete decimal integer that fits in an `int`, like `"42"` or `"-17"`. Store it and return 1, or return 0 (leaving `*out` alone) for anything else: empty strings, junk after the number, or values out of range. Use `strtol` and check `errno` for `ERANGE`.
        seed: |
          #include <errno.h>
          #include <limits.h>
          #include <stdlib.h>

          int parse_int(const char *s, int *out) {

          }
        solution: |
          #include <errno.h>
          #include <limits.h>
          #include <stdlib.h>

          int parse_int(const char *s, int *out) {
              char *end;
              errno = 0;
              long v = strtol(s, &end, 10);
              if (end == s || *end != '\0') return 0;
              if (errno == ERANGE || v < INT_MIN || v > INT_MAX) return 0;
              *out = (int)v;
              return 1;
          }
        harness: |
          int main(void) {
              int r = 0;
              CHECK_INT("\"42\"", parse_int("42", &r) && r == 42, 1);
              CHECK_INT("\"-17\"", parse_int("-17", &r) && r == -17, 1);
              CHECK_INT("\"2147483647\"", parse_int("2147483647", &r) && r == 2147483647, 1);
              CHECK_INT("\"-2147483648\"", parse_int("-2147483648", &r) && r == -2147483647 - 1, 1);
              r = 9;
              CHECK_INT("\"2147483648\" is too big", parse_int("2147483648", &r), 0);
              CHECK_INT("\"99999999999999999999\" is too big", parse_int("99999999999999999999", &r), 0);
              CHECK_INT("\"12x\" has junk", parse_int("12x", &r), 0);
              CHECK_INT("\"\" is empty", parse_int("", &r), 0);
              CHECK_INT("\"abc\"", parse_int("abc", &r), 0);
              CHECK_INT("out untouched after failures", r, 9);
              return 0;
          }
        require:
          - pattern: "strtol\\s*\\("
            message: Parse with `strtol`.
        hints:
          - "Set `errno = 0` before calling `strtol`. Afterwards `errno == ERANGE` means the number didn't even fit in a `long`."
          - "`end == s` means no digits were read, and `*end != '\\0'` means junk followed the number. A `long` can still be bigger than an `int`, so also compare with `INT_MIN` and `INT_MAX`."
        tests: []

  - title: Fixed-width types
    id: c-types-4
    text: |
      Because `int` and `long` vary between platforms, any data that **leaves the program** (files, network messages, hashes, checksums) must use types with an exact, guaranteed size. `<stdint.h>` provides them:

      | Type | Size | Typical use |
      |---|---|---|
      | `int8_t` / `uint8_t` | 1 byte | raw bytes, pixels |
      | `int16_t` / `uint16_t` | 2 bytes | audio samples, small protocol fields |
      | `int32_t` / `uint32_t` | 4 bytes | file formats, protocols |
      | `int64_t` / `uint64_t` | 8 bytes | big counters, hashes, timestamps |

      `<inttypes.h>` provides matching `printf` macros, because the right specifier differs by platform: `printf("%" PRIu64 "\n", x);` (the macro expands to a string like `"lu"` or `"llu"`, and adjacent string literals are joined).

      ```c run
      #include <stdio.h>
      #include <stdint.h>
      #include <inttypes.h>

      uint32_t checksum(const char *s) {
          uint32_t sum = 0;
          for (; *s; s++) {
              sum = sum * 31 + (uint8_t)*s;
          }
          return sum;
      }

      int main(void) {
          uint64_t big = UINT64_C(1) << 40;
          printf("%" PRIu64 "\n", big);
          printf("%" PRIu32 "\n", checksum("hello"));
          printf("%zu %zu\n", sizeof(int8_t), sizeof(uint64_t));
          return 0;
      }
      ```

      ```output
      1099511627776
      99162322
      1 8
      ```

      `checksum` relies on **unsigned wraparound**: the multiplications overflow constantly, and that's fine (and deterministic) with `uint32_t`. The cast `(uint8_t)*s` treats each character as a byte from 0 to 255, so results are the same on platforms where `char` is signed.

      `UINT64_C(1)` makes a literal of the right 64-bit type, so shifting it by 40 doesn't overflow a 32-bit `int`.

      **Your turn:** implement the 64-bit **FNV-1a** hash, a simple, widely used string hash:

      ```
      hash = 14695981039346656037
      for each byte b of the string:
          hash = hash XOR b
          hash = hash * 1099511628211      (wrapping, which uint64_t does for free)
      ```
    seed: |
      #include <stdint.h>

      uint64_t fnv1a(const char *s) {

      }
    solution: |
      #include <stdint.h>

      uint64_t fnv1a(const char *s) {
          uint64_t h = 14695981039346656037ULL;
          for (const unsigned char *p = (const unsigned char *)s; *p; p++) {
              h ^= *p;
              h *= 1099511628211ULL;
          }
          return h;
      }
    harness: |
      #include <inttypes.h>
      int main(void) {
          CHECK("empty string gives the offset basis", fnv1a("") == 14695981039346656037ULL);
          CHECK("\"a\"", fnv1a("a") == 12638187200555641996ULL);
          CHECK("\"de_dust2\"", fnv1a("de_dust2") == 5579206504554651827ULL);
          CHECK("\"inferno\"", fnv1a("inferno") == 2781478895320847780ULL);
          CHECK("different strings, different hashes", fnv1a("ab") != fnv1a("ba"));
          return 0;
      }
    hints:
      - "Start with `uint64_t h = 14695981039346656037ULL;`. The `ULL` suffix makes the constant unsigned long long."
      - "Walk the string as `unsigned char` so bytes above 127 aren't negative: `(const unsigned char *)s`."
      - "In the loop: `h ^= *p; h *= 1099511628211ULL;`"
    more:
      - task: |
          Write the **32-bit** version of FNV-1a. It's the same loop with a different start and multiplier:

          ```
          hash = 2166136261
          for each byte b of the string:
              hash = hash XOR b
              hash = hash * 16777619      (wrapping, which uint32_t does for free)
          ```
        seed: |
          #include <stdint.h>

          uint32_t fnv1a32(const char *s) {

          }
        solution: |
          #include <stdint.h>

          uint32_t fnv1a32(const char *s) {
              uint32_t h = 2166136261u;
              for (const unsigned char *p = (const unsigned char *)s; *p; p++) {
                  h ^= *p;
                  h *= 16777619u;
              }
              return h;
          }
        harness: |
          int main(void) {
              CHECK("empty string gives the offset basis", fnv1a32("") == 2166136261u);
              CHECK("\"a\"", fnv1a32("a") == 3826002220u);
              CHECK("\"de_dust2\"", fnv1a32("de_dust2") == 2410686675u);
              CHECK("\"inferno\"", fnv1a32("inferno") == 838890020u);
              return 0;
          }
        hints:
          - Use `uint32_t` for the hash so the multiplication wraps at 32 bits.
          - Read the bytes as `unsigned char`, so characters above 127 aren't negative.
        tests: []
      - task: |
          Colors are often stored as one 32-bit number with four 8-bit channels. Write `uint32_t pack_rgba(uint8_t r, uint8_t g, uint8_t b, uint8_t a)`, which puts `r` in the highest byte and `a` in the lowest (`0xRRGGBBAA`), and `uint8_t channel(uint32_t color, int i)`, which returns channel `i` (0 is red, 3 is alpha).
        seed: |
          #include <stdint.h>

