              CHECK_INT("8.0f", float_exponent(8.0f), 3);
              CHECK_INT("0.5f", float_exponent(0.5f), -1);
              CHECK_INT("3.0f is 1.5 x 2^1", float_exponent(3.0f), 1);
              CHECK_INT("-1024.0f (the sign doesn't matter)", float_exponent(-1024.0f), 10);
              return 0;
          }
        require:
