        solution: |
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          int count_positive(const int *a, int n) {
              int count = 0;
              for (int i = 0; i < n; i++) {
                  if (a[i] > 0) count++;
              }
              return count;
          }

          char *greet(const char *name) {
              size_t size = strlen(name) + 4;
              char *buf = malloc(size);
              if (buf == NULL) return NULL;
              snprintf(buf, size, "hi %s", name);
              return buf;
          }
        harness: |
          int main(void) {
              int a[] = {3, -1, 4, 0, 5};
              CHECK_INT("3 positive numbers", count_positive(a, 5), 3);
              CHECK_INT("none in an empty array", count_positive(a, 0), 0);
              char *g = greet("ropz");
              CHECK_STR("greet(\"ropz\")", g, "hi ropz");
              char *h = greet("a much longer name than the others");
              CHECK_STR("a long name", h, "hi a much longer name than the others");
              CHECK_STR("the first greeting is still intact", g, "hi ropz");
              free(g);
              free(h);
              return 0;
          }
