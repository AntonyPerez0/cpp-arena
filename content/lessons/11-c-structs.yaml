      - task: |
          The compass directions are `NORTH, EAST, SOUTH, WEST`, so their values are 0 to 3 in clockwise order. Write `turn_right(d)` and `turn_left(d)` **without a switch**: use the numbers and `%` so that turning right from `WEST` gives `NORTH`.
        seed: |
          enum Dir { NORTH, EAST, SOUTH, WEST };

          enum Dir turn_right(enum Dir d) {

          }

          enum Dir turn_left(enum Dir d) {

          }
        solution: |
          enum Dir { NORTH, EAST, SOUTH, WEST };

          enum Dir turn_right(enum Dir d) {
              return (enum Dir)((d + 1) % 4);
          }

          enum Dir turn_left(enum Dir d) {
              return (enum Dir)((d + 3) % 4);
          }
        harness: |
          int main(void) {
              CHECK_INT("right from NORTH is EAST", turn_right(NORTH), EAST);
              CHECK_INT("right from WEST is NORTH", turn_right(WEST), NORTH);
              CHECK_INT("left from NORTH is WEST", turn_left(NORTH), WEST);
              CHECK_INT("left from SOUTH is EAST", turn_left(SOUTH), EAST);
              enum Dir d = NORTH;
              for (int i = 0; i < 4; i++) d = turn_left(d);
              CHECK_INT("four lefts is back to NORTH", d, NORTH);
              return 0;
          }
        forbid:
          - pattern: "\\bswitch\\b|\\bif\\b"
            message: Use the enum's numbers and `%` instead of a switch or if.
        hints:
          - Turning right adds 1. `% 4` wraps 4 back around to 0.
          - Turning left is the same as turning right three times, so add 3 before `% 4`. That avoids a negative number.
