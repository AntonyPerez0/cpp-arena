        solution: |
          #define PI 3.14159265358979

          enum ShapeKind { CIRCLE, RECTANGLE, TRIANGLE };

          struct Shape {
              enum ShapeKind kind;
              union {
                  struct { double radius; } circle;
                  struct { double width, height; } rect;
                  struct { double base, height; } tri;
              } as;
          };

          double area(const struct Shape *s) {
              switch (s->kind) {
              case CIRCLE:
                  return PI * s->as.circle.radius * s->as.circle.radius;
              case RECTANGLE:
                  return s->as.rect.width * s->as.rect.height;
              case TRIANGLE:
                  return s->as.tri.base * s->as.tri.height / 2;
              }
              return 0;
          }

          double total_area(const struct Shape shapes[], int n) {
              double sum = 0;
              for (int i = 0; i < n; i++) sum += area(&shapes[i]);
              return sum;
          }

          int count_kind(const struct Shape shapes[], int n, enum ShapeKind k) {
              int count = 0;
              for (int i = 0; i < n; i++) {
                  if (shapes[i].kind == k) count++;
              }
              return count;
          }
        harness: |
          int main(void) {
              struct Shape s[] = {
                  {RECTANGLE, {.rect = {3, 4}}},
                  {TRIANGLE, {.tri = {6, 5}}},
                  {RECTANGLE, {.rect = {1, 1}}},
                  {CIRCLE, {.circle = {1}}},
              };
              CHECK_DBL("total area", total_area(s, 4), 12 + 15 + 1 + PI);
              CHECK_DBL("total of the first two", total_area(s, 2), 27);
              CHECK_DBL("no shapes", total_area(s, 0), 0);
              CHECK_INT("two rectangles", count_kind(s, 4, RECTANGLE), 2);
              CHECK_INT("one circle", count_kind(s, 4, CIRCLE), 1);
              CHECK_INT("no circles in the first three", count_kind(s, 3, CIRCLE), 0);
              return 0;
          }
        hints:
          - "`area` takes a pointer, so pass `&shapes[i]`."
          - For `count_kind`, compare `shapes[i].kind == k`.
        tests: []
