  - title: typedef
    id: c-structs-6
    text: |
      Writing `struct Player` every time gets tiresome. `typedef` creates a new name (an alias) for an existing type:

      ```c
      typedef unsigned long long u64;   // u64 now means unsigned long long
      ```

      It's most often used with structs, so the type can be named with one word:

      ```c run
      #include <stdio.h>

      typedef struct {
          int r, g, b;
      } Color;

      Color mix(Color a, Color b) {
          Color out = {(a.r + b.r) / 2, (a.g + b.g) / 2, (a.b + b.b) / 2};
          return out;
      }

      int main(void) {
          Color red = {255, 0, 0};
          Color blue = {0, 0, 255};
          Color purple = mix(red, blue);
          printf("%d %d %d\n", purple.r, purple.g, purple.b);
          return 0;
      }
      ```

      ```output
      127 0 127
      ```

      ### Reading it

      `typedef struct { ... } Color;` defines an unnamed struct and names it `Color` in one go. After that, `Color` works like `int` or `double`: in declarations, parameters and return types.

      Notice `int r, g, b;`: several members of the same type can share one declaration.

      ### Returning a new struct

      `mix` builds a new `Color` from its inputs and returns it, leaving the inputs unchanged. Small value types like colors, points and vectors are usually written this way, and it's exactly how math-style code works in C and C++. You'll see this style again with operator overloading in C++, where `a + b` can be defined for your own types.

      ### Style

      Some C codebases (the Linux kernel, for example) avoid typedefs for structs, preferring the explicit `struct x`. Others use them everywhere. Follow the style of the code you're working in.

      **Your turn:** complete the typedef and write `Vec2 add(Vec2 a, Vec2 b)` returning the component-wise sum.
    seed: |
      typedef struct {
          double x, y;
      } Vec2;

      Vec2 add(Vec2 a, Vec2 b) {

      }
    solution: |
      typedef struct {
          double x, y;
      } Vec2;

      Vec2 add(Vec2 a, Vec2 b) {
          Vec2 r = {a.x + b.x, a.y + b.y};
          return r;
      }
    harness: |
      int main(void) {
          Vec2 a = {1, 2}, b = {3.5, -4};
          Vec2 c = add(a, b);
          CHECK_DBL("x", c.x, 4.5);
          CHECK_DBL("y", c.y, -2.0);
          Vec2 z = add(c, (Vec2){0, 0});
          CHECK_DBL("adding zero keeps x", z.x, 4.5);
          return 0;
      }
    hints:
      - "Build the result: `Vec2 r = {a.x + b.x, a.y + b.y};` and return it."
    more:
      - task: |
          Write `Vec2 scale(Vec2 v, double k)`, which multiplies both components by `k`, and `double dot(Vec2 a, Vec2 b)`, which returns `a.x * b.x + a.y * b.y`.
        seed: |
          typedef struct {
              double x, y;
          } Vec2;

          Vec2 scale(Vec2 v, double k) {

          }

          double dot(Vec2 a, Vec2 b) {

          }
        solution: |
          typedef struct {
              double x, y;
          } Vec2;

          Vec2 scale(Vec2 v, double k) {
              Vec2 r = {v.x * k, v.y * k};
              return r;
          }

          double dot(Vec2 a, Vec2 b) {
              return a.x * b.x + a.y * b.y;
          }
        harness: |
          int main(void) {
              Vec2 v = {1.5, -2};
              Vec2 s = scale(v, 2);
              CHECK_DBL("scale x", s.x, 3.0);
              CHECK_DBL("scale y", s.y, -4.0);
              Vec2 z = scale(v, 0);
              CHECK("scale by 0", z.x == 0 && z.y == 0);
              CHECK_DBL("dot of (1,2) and (3,4)", dot((Vec2){1, 2}, (Vec2){3, 4}), 11.0);
              CHECK_DBL("perpendicular vectors", dot((Vec2){1, 0}, (Vec2){0, 5}), 0.0);
              return 0;
          }
        hints:
          - "Build the result the same way as `add`: `Vec2 r = {v.x * k, v.y * k};`."
        tests: []
      - task: |
          Write the typedef for a `Rect` yourself: a struct with two `Vec2` fields, `min` (the bottom-left corner) and `max` (the top-right corner). Then write `int contains(Rect r, Vec2 p)` that returns `1` if the point is inside the rectangle or on its edge.
        seed: |
          typedef struct {
              double x, y;
          } Vec2;

          // typedef Rect here

          int contains(Rect r, Vec2 p) {

          }
        solution: |
          typedef struct {
              double x, y;
          } Vec2;

          // typedef Rect here
          typedef struct {
              Vec2 min;
              Vec2 max;
          } Rect;

          int contains(Rect r, Vec2 p) {
              return p.x >= r.min.x && p.x <= r.max.x && p.y >= r.min.y && p.y <= r.max.y;
          }
        harness: |
          int main(void) {
              Rect site = {{0, 0}, {4, 3}};
              CHECK_INT("(2, 1) is inside", contains(site, (Vec2){2, 1}), 1);
              CHECK_INT("(4, 3) is on the corner", contains(site, (Vec2){4, 3}), 1);
              CHECK_INT("(5, 1) is to the right", contains(site, (Vec2){5, 1}), 0);
              CHECK_INT("(2, -1) is below", contains(site, (Vec2){2, -1}), 0);
              CHECK_INT("(0, 3) is on the edge", contains(site, (Vec2){0, 3}), 1);
              return 0;
          }
        hints:
          - "`typedef struct { Vec2 min; Vec2 max; } Rect;`, the same shape as the Vec2 typedef."
          - "Fields of fields chain with dots, like `r.min.x`. The point is inside when both `x` and `y` are between min and max."
        tests: []

  - title: Unions and tagged unions
    id: c-structs-7
    text: |
      A struct holds **all** of its members at once, each in its own memory. A **union** looks the same but holds **one** member at a time: every member starts at the same address and shares the same bytes. A union is as big as its largest member (possibly rounded up for alignment), not the sum of them.

      On its own, a union doesn't remember which member you last stored, so real code pairs it with an `enum` that says which one is in use. That combination is called a **tagged union**, and it's C's way of saying "a value that can be one of several types":

      ```c run
      #include <stdio.h>

      enum Kind { NUMBER, TEXT };

      struct Value {
          enum Kind kind;           /* which union member is in use */
          union {
              double number;
              char text[16];
          } as;
      };

      void print_value(struct Value v) {
          if (v.kind == NUMBER) {
              printf("number %.2f\n", v.as.number);
          } else {
              printf("text \"%s\"\n", v.as.text);
          }
      }

      int main(void) {
          struct Value a = {NUMBER, {.number = 3.5}};
          struct Value b = {.kind = TEXT, .as.text = "hello"};
          print_value(a);
          print_value(b);
          printf("union: %zu bytes; members: %zu and %zu\n", sizeof a.as, sizeof a.as.number, sizeof a.as.text);
          return 0;
      }
      ```

      ```output
      number 3.50
      text "hello"
      union: 16 bytes; members: 8 and 16
      ```

      ### How it works

      - `union { double number; char text[16]; } as;` declares a member called `as` whose type is a union. `v.as.number` and `v.as.text` are two views of the same 16 bytes.
      - The union is 16 bytes, the size of its biggest member, even though it can hold an 8-byte `double`. A struct with both members would need 24.
      - `{.number = 3.5}` and `.as.text = "hello"` use **designated initializers** to say which member to fill in.
      - Every reader checks `kind` first and only touches the member that matches. Keeping the tag and the data in step is the programmer's job: the compiler won't stop you from reading `as.number` when `kind` says `TEXT`.

      ### Reading the wrong member

      If you store `3.5` into `as.number` and then read `as.text`, C reinterprets the same bytes as characters. That's allowed in C, but what you get depends on how the machine stores a `double`, so it's rarely what you want. (In C++, reading a union member other than the one last stored is undefined behavior.) Use unions for "one of several things", with a tag, and not as a trick for converting between types.

      ### Where they're used

      Tagged unions appear wherever data comes in several shapes: the values in an interpreter (a number, a string or a list), messages in a network protocol (each kind of message has a different payload), events in a game or GUI (a key press, a mouse click, a resize). They save memory when you have many such values, and they keep "one of these" explicit in the type. C++'s `std::variant`, later in the course, is a tagged union that tracks the tag for you.

      **Your turn:** a `struct Shape` is a circle, a rectangle or a triangle, with a union holding each kind's measurements. Write `area(s)` (a triangle's area is base × height / 2) and `make_circle(r)`, which returns a circle shape with radius `r`.
    seed: |
      #include <stdio.h>

      #define PI 3.14159265358979

      enum ShapeKind { CIRCLE, RECTANGLE, TRIANGLE };

      struct Shape {
          enum ShapeKind kind;
          union {
              struct { double radius; } circle;
              struct { double width, height; } rect;
              struct { double base, height; } tri;
          } as;
      };

      double area(const struct Shape *s) {

      }

      struct Shape make_circle(double r) {

      }
    solution: |
      #include <stdio.h>

      #define PI 3.14159265358979

      enum ShapeKind { CIRCLE, RECTANGLE, TRIANGLE };

      struct Shape {
          enum ShapeKind kind;
          union {
              struct { double radius; } circle;
              struct { double width, height; } rect;
              struct { double base, height; } tri;
          } as;
      };

      double area(const struct Shape *s) {
          switch (s->kind) {
          case CIRCLE:
              return PI * s->as.circle.radius * s->as.circle.radius;
          case RECTANGLE:
              return s->as.rect.width * s->as.rect.height;
          case TRIANGLE:
              return s->as.tri.base * s->as.tri.height / 2;
          }
          return 0;
      }

      struct Shape make_circle(double r) {
          struct Shape s = {CIRCLE, {.circle = {r}}};
          return s;
      }
    harness: |
      int main(void) {
          struct Shape rect = {RECTANGLE, {.rect = {3, 4}}};
          struct Shape tri = {TRIANGLE, {.tri = {6, 5}}};
          struct Shape c = make_circle(2);
          CHECK_DBL("rectangle 3 x 4", area(&rect), 12);
          CHECK_DBL("triangle base 6, height 5", area(&tri), 15);
          CHECK("make_circle sets the kind", c.kind == CIRCLE);
          CHECK_DBL("make_circle sets the radius", c.as.circle.radius, 2);
          CHECK_DBL("circle of radius 2", area(&c), 4 * PI);
          struct Shape unit = make_circle(1);
          CHECK_DBL("unit circle", area(&unit), PI);
          return 0;
      }
    hints:
      - "`s` is a pointer, so use `s->kind` and `s->as.circle.radius`, `s->as.rect.width` and so on."
      - "A `switch (s->kind)` with one `case` per kind, each returning its formula, reads well. Add a final `return 0;` after the switch."
      - "make_circle: `struct Shape s = {CIRCLE, {.circle = {r}}};` then `return s;`."
