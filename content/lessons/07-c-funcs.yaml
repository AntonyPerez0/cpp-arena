id: c-funcs
title: Functions
lang: c
phase: "C: Foundations"
summary: Split programs into named, reusable pieces. Parameters, return values, prototypes, scope and recursion.
steps:
  - title: Define and call a function
    id: c-funcs-1
    text: |
      As programs grow, putting everything in `main` gets messy fast. A **function** packages a piece of work under a name, so you can write it once and use it (**call** it) wherever it's needed. You've been calling functions all along: `printf` and `scanf` are functions someone else wrote.

      A function definition has four parts:

      ```c
      int square(int x) {
          return x * x;
      }
      ```

      - **Return type** (`int`): the type of value the function hands back.
      - **Name** (`square`): how you call it.
      - **Parameters** (`int x`): inputs, each with a type and a name. Inside the function, `x` is a variable holding whatever value the caller passed.
      - **Body**: the code between the braces. `return` ends the function and sends a value back.

      ```c run
      #include <stdio.h>

      int square(int x) {
          return x * x;
      }

      int main(void) {
          int a = square(7);
          printf("%d\n", a);
          printf("%d\n", square(3) + square(4));
          return 0;
      }
      ```

      ```output
      49
      25
      ```

      ### What happens during a call

      When `main` reaches `square(7)`, it pauses. The value 7 is copied into the parameter `x`, the body of `square` runs, and `return x * x` sends 49 back. The call `square(7)` is then **replaced by that value**, so `int a = square(7);` stores 49, and `main` carries on. A call is an expression, so it can be used anywhere a value can, like inside `printf` or another calculation.

      ### Function steps on this site

      From now on, some steps are **function steps**: you write only the function, and hidden tests call it with many different inputs and check what it returns. Don't write a `main` on those steps (the tests bring their own), and don't print anything the task didn't ask for; the tests look at the return value.

      **Your turn:** complete `add` so it returns the sum of its two parameters.
    fill: |
      [[int]] add(int a, int b) {
          [[return]] a + b;
      }
    harness: |
      int main(void) {
          CHECK_INT("add(2, 3)", add(2, 3), 5);
          CHECK_INT("add(-4, 4)", add(-4, 4), 0);
          CHECK_INT("add(100, 23)", add(100, 23), 123);
          return 0;
      }
    hints:
      - The function returns an int, so the return type is `int`.
      - "`return` sends a value back to the caller."
    more:
      - task: |
          Complete `area` so it takes a width and a height and returns the area of the rectangle (width times height).
        fill: |
          [[int]] area([[int]] w, int h) {
              [[return]] w [[*]] h;
          }
        harness: |
          int main(void) {
              CHECK_INT("area(3, 4)", area(3, 4), 12);
              CHECK_INT("area(0, 9)", area(0, 9), 0);
              CHECK_INT("area(7, 7)", area(7, 7), 49);
              return 0;
          }
        hints:
          - Every parameter needs a type, just like a variable. Both are ints.
          - The area is `w * h`, sent back with `return`.
        tests: []
      - task: |
          Write `int to_seconds(int minutes, int seconds)` that returns the total number of seconds. `to_seconds(2, 5)` returns `125`.
        seed: |
          int to_seconds(int minutes, int seconds) {

          }
        solution: |
          int to_seconds(int minutes, int seconds) {
              return minutes * 60 + seconds;
          }
        harness: |
          int main(void) {
              CHECK_INT("to_seconds(2, 5)", to_seconds(2, 5), 125);
              CHECK_INT("to_seconds(0, 59)", to_seconds(0, 59), 59);
              CHECK_INT("to_seconds(12, 34)", to_seconds(12, 34), 754);
              CHECK_INT("to_seconds(0, 0)", to_seconds(0, 0), 0);
              return 0;
          }
        hints:
          - Each minute is 60 seconds, so `minutes * 60 + seconds`.
        tests: []

  - title: Write a function
    id: c-funcs-2
    text: |
      Now write a whole function yourself. The task is to return the largest of three numbers. Before typing any code, think through the logic the way you'd do it by hand.

      ### Step 1: solve the smaller problem

      Finding the larger of **two** numbers is easy:

      ```c
      int max2(int a, int b) {
          if (a > b) {
              return a;
          }
          return b;
      }
      ```

      Notice there's no `else`: `return` ends the function immediately, so if `a > b` the second `return` is never reached. Many programmers like this "return early" style.

      ### Step 2: build on it

      For three numbers you can keep a "best so far" variable, the same idea as finding a maximum in a loop:

      ```c run
      #include <stdio.h>

      int min3(int a, int b, int c) {
          int best = a;
          if (b < best) {
              best = b;
          }
          if (c < best) {
              best = c;
          }
          return best;
      }

      int main(void) {
          printf("%d %d %d\n", min3(5, 2, 9), min3(1, 1, 1), min3(-4, 0, -7));
          return 0;
      }
      ```

      ```output
      2 1 -7
      ```

      That's the **minimum**; the maximum is the same idea with the comparisons flipped.

      ### Think about edge cases

      Hidden tests will try tricky inputs, so ask yourself: what if two numbers are equal? What if all are negative? What if the largest is first, or last? The "best so far" approach handles all of those without special cases, which is a sign it's a good approach.

      ### Every path must return

      If a function promises to return an `int`, every way through it must reach a `return`. If one path falls off the end without returning, the caller gets garbage (formally, undefined behavior); the compiler warns `non-void function does not return a value in all control paths`.

      **Your turn:** write `int max3(int a, int b, int c)` that returns the largest of three numbers.
    seed: |
      int max3(int a, int b, int c) {

      }
    solution: |
      int max3(int a, int b, int c) {
          int m = a;
          if (b > m) m = b;
          if (c > m) m = c;
          return m;
      }
    harness: |
      int main(void) {
          CHECK_INT("max3(1, 2, 3)", max3(1, 2, 3), 3);
          CHECK_INT("max3(9, 2, 3)", max3(9, 2, 3), 9);
          CHECK_INT("max3(1, 8, 3)", max3(1, 8, 3), 8);
          CHECK_INT("max3(-5, -2, -9)", max3(-5, -2, -9), -2);
          CHECK_INT("max3(4, 4, 4)", max3(4, 4, 4), 4);
          return 0;
      }
    hints:
      - Keep a running best. Start with `int m = a;` and compare it with b, then c.
    more:
      - task: |
          Write `int clamp(int x, int lo, int hi)` that returns `x` if it is between `lo` and `hi`, `lo` if `x` is smaller than that, and `hi` if it is bigger. Games use this to keep values like HP inside a range.
        seed: |
          int clamp(int x, int lo, int hi) {

          }
        solution: |
          int clamp(int x, int lo, int hi) {
              if (x < lo) return lo;
              if (x > hi) return hi;
              return x;
          }
        harness: |
          int main(void) {
              CHECK_INT("clamp(5, 0, 10)", clamp(5, 0, 10), 5);
              CHECK_INT("clamp(-3, 0, 10)", clamp(-3, 0, 10), 0);
              CHECK_INT("clamp(42, 0, 10)", clamp(42, 0, 10), 10);
              CHECK_INT("clamp(0, 0, 10)", clamp(0, 0, 10), 0);
              CHECK_INT("clamp(10, 0, 10)", clamp(10, 0, 10), 10);
              CHECK_INT("clamp(150, 1, 100)", clamp(150, 1, 100), 100);
              return 0;
          }
        hints:
          - A function can have more than one `return`. The first one that runs ends the function.
          - Return `lo` if `x < lo`, return `hi` if `x > hi`, and otherwise return `x`.
        tests: []
      - task: |
          Write `int median3(int a, int b, int c)` that returns the **middle** value of the three: the one that is neither the smallest nor the largest. `median3(9, 2, 5)` returns `5`. Equal values count too, so `median3(4, 4, 1)` returns `4`.
        seed: |
          int median3(int a, int b, int c) {

          }
        solution: |
          int median3(int a, int b, int c) {
              if ((a >= b && a <= c) || (a <= b && a >= c)) return a;
              if ((b >= a && b <= c) || (b <= a && b >= c)) return b;
              return c;
          }
        harness: |
          int main(void) {
              CHECK_INT("median3(9, 2, 5)", median3(9, 2, 5), 5);
              CHECK_INT("median3(1, 2, 3)", median3(1, 2, 3), 2);
              CHECK_INT("median3(3, 2, 1)", median3(3, 2, 1), 2);
              CHECK_INT("median3(2, 3, 1)", median3(2, 3, 1), 2);
              CHECK_INT("median3(4, 4, 1)", median3(4, 4, 1), 4);
              CHECK_INT("median3(-5, 0, -9)", median3(-5, 0, -9), -5);
              CHECK_INT("median3(7, 7, 7)", median3(7, 7, 7), 7);
              return 0;
          }
        hints:
          - "`a` is the middle one if it sits between the other two, in either order: `(a >= b && a <= c) || (a <= b && a >= c)`."
          - Do the same check for `b`. If neither `a` nor `b` is the middle, it must be `c`.
        tests: []

  - title: void functions
    id: c-funcs-3
    text: |
      Not every function computes a value. Some exist for what they **do**, like printing. Their return type is `void`, meaning "returns nothing":

      ```c run
      #include <stdio.h>

      void greet(int times) {
          for (int i = 0; i < times; i++) {
              printf("hi ");
          }
          printf("\n");
      }

      void banner(void) {
          printf("=== START ===\n");
      }

      int main(void) {
          banner();
          greet(3);
          greet(1);
          return 0;
      }
      ```

      ```output
      === START ===
      hi hi hi 
      hi 
      ```

      ### Details

      - A `void` function doesn't need a `return` statement; it ends when it reaches the closing brace. You can still write `return;` (with no value) to leave early.
      - You can't use its result: `int x = banner();` is a compile error, because there is no result.
      - `(void)` in the parameter list means "takes no arguments". Call it with empty parentheses: `banner()`. Forgetting the parentheses (`banner;`) doesn't call it at all; the compiler warns `expression result unused`.

      ### Why bother?

      Even small helpers make code easier to read. `print_bar(10)` says what it does; a loop that prints ten `=` characters has to be read to be understood. And if you need the same output in five places, a function means one place to fix when it changes.

      **Your turn:** write `void print_bar(int n)` that prints `n` `=` characters followed by a newline. `print_bar(5)` prints `=====`.
    seed: |
      #include <stdio.h>

      void print_bar(int n) {

      }
    solution: |
      #include <stdio.h>

      void print_bar(int n) {
          for (int i = 0; i < n; i++) {
              printf("=");
          }
          printf("\n");
      }
    harness: |
      int main(void) {
          print_bar(5);
          print_bar(1);
          print_bar(12);
          print_bar(0);
          return 0;
      }
    compare: stdout
    hints:
      - Loop n times printing `=`, then print `\n` once after the loop.
    more:
      - task: |
          Write `void print_row(char c, int n)` that prints the character `c` exactly `n` times, then a newline. `print_row('#', 3)` prints `###`.
        seed: |
          #include <stdio.h>

          void print_row(char c, int n) {

          }
        solution: |
          #include <stdio.h>

          void print_row(char c, int n) {
              for (int i = 0; i < n; i++) {
                  printf("%c", c);
              }
              printf("\n");
          }
        harness: |
          int main(void) {
              print_row('#', 3);
              print_row('-', 5);
              print_row('*', 1);
              return 0;
          }
        compare: stdout
        hints:
          - Same idea as `print_bar`, but print `c` with `%c` instead of a fixed `=`.
        tests:
          - expect: "###\n-----\n*"
      - task: |
          Write `void print_box(int w, int h)` that prints a hollow box `w` characters wide and `h` rows tall. The first and last rows are all `#`. The rows in between have `#` at both ends and spaces inside. `print_box(4, 3)` prints:

          ```
          ####
          #  #
          ####
          ```
        seed: |
          #include <stdio.h>

          void print_box(int w, int h) {

          }
        solution: |
          #include <stdio.h>

          void print_box(int w, int h) {
              for (int row = 0; row < h; row++) {
                  for (int col = 0; col < w; col++) {
                      int edge = row == 0 || row == h - 1 || col == 0 || col == w - 1;
                      printf("%c", edge ? '#' : ' ');
                  }
                  printf("\n");
              }
          }
        harness: |
          int main(void) {
              print_box(4, 3);
              print_box(5, 4);
              print_box(2, 2);
              print_box(1, 1);
              return 0;
          }
        compare: stdout
        hints:
          - Use two loops, one for the rows and one for the columns inside each row.
          - A position is on the edge if it is in the first or last row, or the first or last column. Print `#` there and a space everywhere else.
        tests:
          - expect: "####\n#  #\n####\n#####\n#   #\n#   #\n#####\n##\n##\n#"

  - title: Prototypes
    id: c-funcs-4
    text: |
      The compiler reads your file **once, from top to bottom**. When it reaches a call like `half(10)`, it needs to already know what `half` is: its return type and the types of its parameters. If the definition comes further down the file, the compiler hasn't seen it yet and reports an error such as `call to undeclared function 'half'`.

      You have two options:

      1. Define every function **above** the functions that call it.
      2. Put a **prototype** (also called a declaration) near the top: the function's first line, ending with a semicolon instead of a body.

      ```c run
      #include <stdio.h>

      double area(double w, double h);

      int main(void) {
          printf("%.1f\n", area(2.5, 4));
          return 0;
      }

      double area(double w, double h) {
          return w * h;
      }
      ```

      ```output
      10.0
      ```

      The prototype promises "a function called `area` exists, takes two doubles and returns a double". That's enough for the compiler to check the call in `main`. The actual body can come later in the file, or even in a different file.

      ### Why prototypes matter

      In bigger programs, functions call each other in every direction, so no ordering works for all of them. Prototypes also go in **header files** (`.h`), which is how one file uses functions defined in another. `#include <stdio.h>` is exactly that: a file full of prototypes, including `printf`'s.

      The prototype and the definition must match. If they disagree about types, the compiler reports `conflicting types`.

      **Your turn:** press Check to see the error, then add the missing prototype.
    seed: |
      #include <stdio.h>

      int main(void) {
          printf("%d\n", half(10));
          return 0;
      }

      int half(int x) {
          return x / 2;
      }
    solution: |
      #include <stdio.h>

      int half(int x);

      int main(void) {
          printf("%d\n", half(10));
          return 0;
      }

      int half(int x) {
          return x / 2;
      }
    require:
      - pattern: "int\\s+half\\s*\\(\\s*int\\s*\\w*\\s*\\)\\s*;"
        message: Add a prototype `int half(int x);` above main (keep the definition below).
    hints:
      - "A prototype is the first line of the function with a semicolon: `int half(int x);`"
      - Put it after the `#include` and before `main`.
    tests:
      - expect: "5"
    more:
      - task: |
          This time `main` calls two functions that are both defined below it. Press **Check** to see the errors, then add a prototype for each one above `main`.
        seed: |
          #include <stdio.h>

          int main(void) {
              printf("%d %d\n", double_it(4), triple(5));
              return 0;
          }

          int double_it(int x) {
              return x * 2;
          }

          int triple(int x) {
              return x * 3;
          }
        solution: |
          #include <stdio.h>

          int double_it(int x);
          int triple(int x);

          int main(void) {
              printf("%d %d\n", double_it(4), triple(5));
              return 0;
          }

          int double_it(int x) {
              return x * 2;
          }

          int triple(int x) {
              return x * 3;
          }
        require:
          - pattern: "int\\s+double_it\\s*\\(\\s*int\\s*\\w*\\s*\\)\\s*;"
            message: Add a prototype `int double_it(int x);` above main.
          - pattern: "int\\s+triple\\s*\\(\\s*int\\s*\\w*\\s*\\)\\s*;"
            message: Add a prototype `int triple(int x);` above main.
        hints:
          - A prototype is the first line of the function with a `;` instead of the body.
        tests:
          - expect: "8 15"
      - task: |
          Here `main` calls `report`, and `report` calls `square`, and both are defined below `main` with `square` last. Work out which prototypes are needed (it's more than one), and add them so the program prints:

          ```
          7 squared is 49
          12 squared is 144
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              report(7);
              report(12);
              return 0;
          }

          void report(int n) {
              printf("%d squared is %d\n", n, square(n));
          }

          int square(int n) {
              return n * n;
          }
        solution: |
          #include <stdio.h>

          void report(int n);
          int square(int n);

          int main(void) {
              report(7);
              report(12);
              return 0;
          }

          void report(int n) {
              printf("%d squared is %d\n", n, square(n));
          }

          int square(int n) {
              return n * n;
          }
        require:
          - pattern: "void\\s+report\\s*\\(\\s*int\\s*\\w*\\s*\\)\\s*;"
            message: "`main` uses `report` before its definition. Add `void report(int n);` above main."
          - pattern: "int\\s+square\\s*\\(\\s*int\\s*\\w*\\s*\\)\\s*;"
            message: "`report` uses `square` before its definition. Add `int square(int n);` above them."
        hints:
          - A function must be declared before any line that calls it, not only before `main`.
          - "`report` calls `square`, but `square` is defined after `report`."
        tests:
          - expect: "7 squared is 49\n12 squared is 144"

  - title: Scope and pass by value
    id: c-funcs-5
    text: |
      ### Scope: where a name exists

      A variable declared inside a function is **local** to it. It's created when the function starts and destroyed when it returns, and no other function can see it. Two functions can each have their own variable named `total` and they never interfere. The same goes for variables declared inside any `{ }` block, like a loop body.

      ### Pass by value

      When you call a function, C **copies** each argument's value into the matching parameter. The function works on its own copy:

      ```c run
      #include <stdio.h>

      void try_to_double(int n) {
          n = n * 2;
          printf("inside: %d\n", n);
      }

      int doubled(int n) {
          return n * 2;
      }

      int main(void) {
          int score = 10;
          try_to_double(score);
          printf("after try: %d\n", score);
          score = doubled(score);
          printf("after return: %d\n", score);
          return 0;
      }
      ```

      ```output
      inside: 20
      after try: 10
      after return: 20
      ```

      `try_to_double` doubled its **copy**, which vanished when it returned. `main`'s `score` was never touched. `doubled` does the right thing: it **returns** the new value, and `main` stores it.

      ### Why C works this way

      Copying keeps functions independent: calling a function can't secretly change your variables, which makes programs easier to reason about. When a function really does need to change the caller's variable, there are two ways: return the new value (best when there's one result), or pass the variable's **address** with a pointer, which is coming up in the pointers module.

      **Your turn:** `heal` below tries to modify its parameter. Rewrite it to **return** the new value instead, and store that result in `main` so the program prints `hp 75`.
    seed: |
      #include <stdio.h>

      void heal(int hp, int amount) {
          hp = hp + amount;
      }

      int main(void) {
          int hp = 50;
          heal(hp, 25);
          printf("hp %d\n", hp);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int heal(int hp, int amount) {
          return hp + amount;
      }

      int main(void) {
          int hp = 50;
          hp = heal(hp, 25);
          printf("hp %d\n", hp);
          return 0;
      }
    forbid:
      - pattern: "hp\\s*=\\s*75|printf\\s*\\(\\s*\"\"\\s*,\\s*75"
        message: Let heal() compute the value.
    hints:
      - Change the return type to `int` and `return hp + amount;`.
      - "In main, store the result: `hp = heal(hp, 25);`"
    tests:
      - expect: "hp 75"
    more:
      - task: |
          `spend` tries to change `money`, but it only changes its own copy. Rewrite it so it **returns** the money left, and so a purchase that costs more than you have changes nothing. Then store the result in `main` after each call. The program should print `money 150`.
        seed: |
          #include <stdio.h>

          void spend(int money, int price) {
              money = money - price;
          }

          int main(void) {
              int money = 1000;
              spend(money, 650);
              spend(money, 2700); // too expensive: nothing should change
              spend(money, 200);
              printf("money %d\n", money);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int spend(int money, int price) {
              if (price > money) {
                  return money;
              }
              return money - price;
          }

          int main(void) {
              int money = 1000;
              money = spend(money, 650);
              money = spend(money, 2700); // too expensive: nothing should change
              money = spend(money, 200);
              printf("money %d\n", money);
              return 0;
          }
        require:
          - pattern: "int\\s+spend\\s*\\("
            message: Change `spend` to return an `int`.
          - pattern: "money\\s*=\\s*spend\\s*\\("
            message: Store what `spend` returns, like `money = spend(money, 650);`.
        forbid:
          - pattern: "\\b150\\b"
            message: Let `spend` compute the money instead of typing 150.
        hints:
          - The return type changes from `void` to `int`, and the function ends with `return`.
          - If `price > money`, return `money` unchanged.
          - In main, each call becomes `money = spend(money, ...);`.
        tests:
          - expect: "money 150"
      - task: |
          `split` tries to hand back two results through its parameters, which can't work because parameters are copies. Replace it with two functions, `int minutes_of(int total)` and `int seconds_of(int total)`, that each **return** one result, and use them in `main`. Input `754` prints `12 min 34 sec`.
        seed: |
          #include <stdio.h>

          void split(int total, int minutes, int seconds) {
              minutes = total / 60;
              seconds = total % 60;
          }

          int main(void) {
              int total;
              scanf("%d", &total);
              int minutes = 0;
              int seconds = 0;
              split(total, minutes, seconds);
              printf("%d min %d sec\n", minutes, seconds);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int minutes_of(int total) {
              return total / 60;
          }

          int seconds_of(int total) {
              return total % 60;
          }

          int main(void) {
              int total;
              scanf("%d", &total);
              int minutes = minutes_of(total);
              int seconds = seconds_of(total);
              printf("%d min %d sec\n", minutes, seconds);
              return 0;
          }
        require:
          - pattern: "int\\s+minutes_of\\s*\\(\\s*int"
            message: Write `int minutes_of(int total)`.
          - pattern: "int\\s+seconds_of\\s*\\(\\s*int"
            message: Write `int seconds_of(int total)`.
        hints:
          - A C function returns one value, so each result gets its own function.
          - "In main, `int minutes = minutes_of(total);` and the same for the seconds."
        tests:
          - stdin: "754\n"
          - stdin: "59\n"
          - stdin: "3600\n"
            hidden: true

  - title: Recursion
    id: c-funcs-6
    text: |
      A function can call **itself**. This is called **recursion**, and it's a natural fit for problems defined in terms of smaller versions of themselves.

      Take factorial: 5! = 5 x 4 x 3 x 2 x 1. Notice that 5! is just 5 x 4!, and 4! is 4 x 3!, and so on down to 1! = 1. That translates directly into code:

      ```c run
      #include <stdio.h>

      int factorial(int n) {
          if (n <= 1) {
              return 1;
          }
          return n * factorial(n - 1);
      }

      int main(void) {
          printf("%d %d %d\n", factorial(1), factorial(5), factorial(10));
          return 0;
      }
      ```

      ```output
      1 120 3628800
      ```

      ### The two parts every recursive function needs

      1. A **base case** that answers directly, without recursing (`n <= 1` returns 1).
      2. A **recursive case** that calls itself on a **smaller** problem (`n - 1`), so it eventually reaches the base case.

      ### How it runs

      Each call gets its own copy of `n`, stored in its own **stack frame**. `factorial(3)` calls `factorial(2)`, which calls `factorial(1)`. Now three calls are paused, waiting. `factorial(1)` returns 1, then `factorial(2)` finishes with 2 x 1 = 2, then `factorial(3)` finishes with 3 x 2 = 6. The calls stack up, then unwind. Use the **Watch it run** link below to see the frames appear and disappear.

      Without a base case (or if the problem never gets smaller), the calls pile up until the program runs out of stack memory and crashes with a **stack overflow**.

      ### Fibonacci

      For this step, each Fibonacci number depends on the **two** before it, so the recursive case makes two calls. You need two base cases (0 and 1). This simple version recomputes the same values many times, so it's slow for large n; that's fine here, and you'll learn faster techniques later.

      **Your turn:** write `int fib(int n)` returning the n-th Fibonacci number, where `fib(0) = 0`, `fib(1) = 1` and every later number is the sum of the two before it.
    seed: |
      int fib(int n) {

      }
    solution: |
      int fib(int n) {
          if (n < 2) return n;
          return fib(n - 1) + fib(n - 2);
      }
    harness: |
      int main(void) {
          CHECK_INT("fib(0)", fib(0), 0);
          CHECK_INT("fib(1)", fib(1), 1);
          CHECK_INT("fib(2)", fib(2), 1);
          CHECK_INT("fib(7)", fib(7), 13);
          CHECK_INT("fib(20)", fib(20), 6765);
          return 0;
      }
    hints:
      - "Base cases: if n is 0 or 1, return n."
      - "Otherwise return `fib(n - 1) + fib(n - 2)`."
    more:
      - task: |
          Write a **recursive** `int sum_to(int n)` that returns `1 + 2 + ... + n`, and `0` when `n` is 0. Don't use a loop: `sum_to(n)` is `n` plus `sum_to(n - 1)`.
        seed: |
          int sum_to(int n) {

          }
        solution: |
          int sum_to(int n) {
              if (n == 0) return 0;
              return n + sum_to(n - 1);
          }
        harness: |
          int main(void) {
              CHECK_INT("sum_to(0)", sum_to(0), 0);
              CHECK_INT("sum_to(1)", sum_to(1), 1);
              CHECK_INT("sum_to(4)", sum_to(4), 10);
              CHECK_INT("sum_to(100)", sum_to(100), 5050);
              return 0;
          }
        forbid:
          - pattern: "\\b(for|while)\\b"
            message: Solve it with recursion, without a loop.
        hints:
          - The base case is `n == 0`, which returns 0.
          - Otherwise, return `n + sum_to(n - 1)`.
        tests: []
      - task: |
          Write a **recursive** `int power(int base, int exp)` that returns `base` raised to `exp` (for `exp` of 0 or more). Anything to the power 0 is 1. Don't use a loop.
        seed: |
          int power(int base, int exp) {

          }
        solution: |
          int power(int base, int exp) {
              if (exp == 0) return 1;
              return base * power(base, exp - 1);
          }
        harness: |
          int main(void) {
              CHECK_INT("power(2, 0)", power(2, 0), 1);
              CHECK_INT("power(2, 10)", power(2, 10), 1024);
              CHECK_INT("power(3, 4)", power(3, 4), 81);
              CHECK_INT("power(-2, 3)", power(-2, 3), -8);
              CHECK_INT("power(7, 1)", power(7, 1), 7);
              return 0;
          }
        forbid:
          - pattern: "\\b(for|while)\\b"
            message: Solve it with recursion, without a loop.
        hints:
          - The base case is `exp == 0`, which returns 1.
          - "`base` to the power `exp` is `base` times `base` to the power `exp - 1`."
        tests: []

  - title: "Challenge: is it prime?"
    id: c-funcs-7
    text: |
      A **prime** is a whole number greater than 1 whose only divisors are 1 and itself: 2, 3, 5, 7, 11, 13 and so on. 1 is **not** prime, and neither are 0 or negative numbers.

      ### The idea

      To test `n`, try dividing it by every candidate `d` starting at 2. If any `d` divides it evenly (`n % d == 0`), it isn't prime, and you can return 0 immediately. If none do, it's prime.

      ### Why stop at the square root?

      If `n` has a divisor bigger than its square root, it must also have one smaller than the square root (because they multiply to `n`: for 91, 7 x 13, and 7 is below the square root, about 9.5). So once you've tried every `d` with `d * d <= n` and found nothing, there's nothing left to find. For a number around a million, that's about 1,000 checks instead of 1,000,000.

      Writing the loop condition as `d * d <= n` avoids needing a square-root function and floating-point numbers. (For `n` very close to the largest `int`, about 2.1 billion, `d * d` itself can overflow; `d <= n / d` is the fully safe form. The tests here stay well below that.)

      Here's the same "try divisors" pattern used for a different job, counting how many divisors a number has:

      ```c run
      #include <stdio.h>

      int count_divisors(int n) {
          int count = 0;
          for (int d = 1; d <= n; d++) {
              if (n % d == 0) {
                  count++;
              }
          }
          return count;
      }

      int main(void) {
          printf("%d %d %d\n", count_divisors(12), count_divisors(7), count_divisors(1));
          return 0;
      }
      ```

      ```output
      6 2 1
      ```

      ### Handle the edge cases first

      Start the function by dealing with the special inputs (anything below 2) and returning right away. Then the loop only has to handle the normal case. Hidden tests will definitely try 0, 1, 2 and a large prime.

      **Your turn:** write `int is_prime(int n)` that returns `1` for primes and `0` otherwise. Only test divisors up to the square root (`d * d <= n`) so it stays fast for big numbers.
    seed: |
      int is_prime(int n) {

      }
    solution: |
      int is_prime(int n) {
          if (n < 2) return 0;
          for (int d = 2; d * d <= n; d++) {
              if (n % d == 0) return 0;
          }
          return 1;
      }
    harness: |
      int main(void) {
          CHECK_INT("is_prime(2)", is_prime(2), 1);
          CHECK_INT("is_prime(1)", is_prime(1), 0);
          CHECK_INT("is_prime(0)", is_prime(0), 0);
          CHECK_INT("is_prime(-7)", is_prime(-7), 0);
          CHECK_INT("is_prime(9)", is_prime(9), 0);
          CHECK_INT("is_prime(97)", is_prime(97), 1);
          CHECK_INT("is_prime(1000003)", is_prime(1000003), 1);
          CHECK_INT("is_prime(1000001)", is_prime(1000001), 0);
          return 0;
      }
    hints:
      - Anything below 2 is not prime.
      - Try every d from 2 while `d * d <= n`. If `n % d == 0`, it's not prime.
    more:
      - task: |
          Write `int gcd(int a, int b)` that returns the greatest common divisor of two numbers that are 0 or more, using Euclid's method: while `b` is not 0, replace `(a, b)` with `(b, a % b)`. When `b` reaches 0, the answer is `a`.
        seed: |
          int gcd(int a, int b) {

          }
        solution: |
          int gcd(int a, int b) {
              while (b != 0) {
                  int r = a % b;
                  a = b;
                  b = r;
              }
              return a;
          }
        harness: |
          int main(void) {
              CHECK_INT("gcd(12, 18)", gcd(12, 18), 6);
              CHECK_INT("gcd(7, 5)", gcd(7, 5), 1);
              CHECK_INT("gcd(0, 9)", gcd(0, 9), 9);
              CHECK_INT("gcd(9, 0)", gcd(9, 0), 9);
              CHECK_INT("gcd(100, 75)", gcd(100, 75), 25);
              CHECK_INT("gcd(13, 13)", gcd(13, 13), 13);
              return 0;
          }
        hints:
          - Save `a % b` in a temporary variable before you overwrite `a` and `b`.
          - "Loop `while (b != 0)`, then return `a`."
        tests: []
      - task: |
          Write `int next_prime(int n)` that returns the smallest prime **bigger** than `n`. `next_prime(13)` returns `17`. Writing your own `is_prime` helper above it keeps the code short, and it must stay fast for `next_prime(1000000)`.
        seed: |
          int next_prime(int n) {

          }
        solution: |
          int is_prime(int n) {
              if (n < 2) return 0;
              for (int d = 2; d * d <= n; d++) {
                  if (n % d == 0) return 0;
              }
              return 1;
          }

          int next_prime(int n) {
              int x = n + 1;
              while (!is_prime(x)) {
                  x++;
              }
              return x;
          }
        harness: |
          int main(void) {
              CHECK_INT("next_prime(1)", next_prime(1), 2);
              CHECK_INT("next_prime(2)", next_prime(2), 3);
              CHECK_INT("next_prime(13)", next_prime(13), 17);
              CHECK_INT("next_prime(-5)", next_prime(-5), 2);
              CHECK_INT("next_prime(100)", next_prime(100), 101);
              CHECK_INT("next_prime(1000000)", next_prime(1000000), 1000003);
              return 0;
          }
        hints:
          - Put the `is_prime` function from this step above `next_prime`, so it's declared before it's used.
          - Start at `n + 1` and keep adding 1 until `is_prime` says yes.
        tests: []
