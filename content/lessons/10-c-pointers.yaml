id: c-pointers
title: Pointers
lang: c
phase: "C: Memory"
summary: Addresses and the variables that hold them. & and *, changing a caller's variables, pointer arithmetic, arrays vs pointers, NULL and const.
steps:
  - title: Addresses and pointers
    id: c-pointers-1
    text: |
      Pointers are the idea that makes C, C. They're also the topic most beginners find hardest, so take this module slowly and use the **Watch it run** links: seeing the arrows helps enormously.

      ### Memory is a long row of numbered bytes

      Your computer's memory is like a very long street of mailboxes, each holding one byte and each with a number: its **address**. When you declare `int hp = 100;`, the compiler reserves 4 bytes somewhere on that street for `hp`. The variable's name is for you; the machine only knows the address.

      The `&` operator gives you a variable's address: `&hp` means "where `hp` lives". You've already used it with `scanf`.

      ### A pointer is a variable that holds an address

      ```c run
      #include <stdio.h>

      int main(void) {
          int hp = 100;
          int *p = &hp;
          printf("%d\n", *p);
          *p = 75;
          printf("%d\n", hp);
          hp = 20;
          printf("%d\n", *p);
          return 0;
      }
      ```

      ```output
      100
      75
      20
      ```

      - `int *p` declares `p` as a **pointer to int**: a variable whose value is the address of an int.
      - `p = &hp` stores `hp`'s address in `p`. We say "`p` points at `hp`".
      - `*p` **dereferences** the pointer: it means "the int at the address stored in `p`". Reading `*p` reads `hp`; writing `*p = 75` writes into `hp`.

      `p` and `hp` are two separate variables. Changing `hp` is visible through `*p`, and changing `*p` changes `hp`, because they refer to the same memory.

      ### Two meanings of `*`

      In a **declaration** (`int *p`), `*` means "p is a pointer". In an **expression** (`*p = 75`), `*` means "follow the pointer". Same symbol, two jobs; it's the main thing that makes pointer code look confusing at first.

      (The actual numbers stored in pointers vary from run to run and machine to machine, so you rarely print them. You can with `%p` if you're curious.)

      **Your turn:** make `p` point at `armor`, then use `p` (not `armor` directly) to set it to `50`.
    fill: |
      #include <stdio.h>

      int main(void) {
          int armor = 100;
          int *p = [[&armor]];
          [[*p]] = 50;
          printf("armor %d\n", armor);
          return 0;
      }
    hints:
      - The address of armor is `&armor`.
      - To write to the variable p points at, use `*p = ...`.
    tests:
      - expect: "armor 50"
    more:
      - task: |
          One pointer can point at different variables over time. Make `p` point at `hp` first (the program takes 30 off through it), then at `armor`, and set `armor` to `0` through `p`. The output should be `hp 70 armor 0`.
        fill: |
          #include <stdio.h>

          int main(void) {
              int hp = 100, armor = 50;
              int *p = [[&hp]];
              *p -= 30;
              p = [[&armor]];
              [[*p]] = 0;
              printf("hp %d armor %d\n", hp, armor);
              return 0;
          }
        hints:
          - "`&hp` is the address of `hp`. Assigning a new address to `p` makes it point somewhere else."
          - To change the variable `p` points at, write through `*p`.
        tests:
          - expect: "hp 70 armor 0"
      - task: |
          Use **only** the pointer `p` to add the round win reward of `3250` to `money`, and print the money through `p` too. The output is `money 4050`. Don't write `money` anywhere after the line that sets up `p`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int money = 800;
              int *p = &money;
              // add 3250 and print it, using only p

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int money = 800;
              int *p = &money;
              // add 3250 and print it, using only p
              *p += 3250;
              printf("money %d\n", *p);
              return 0;
          }
        require:
          - pattern: "\\*p\\s*(\\+=|=\\s*\\*p\\s*\\+)"
            message: Add to the money through the pointer, like `*p += 3250;`.
          - pattern: "printf\\s*\\([^;]*\\*p"
            message: Print the value through the pointer with `*p`.
        forbid:
          - pattern: "&money;[\\s\\S]*\\bmoney\\b"
            message: After setting up `p`, use only `p`, not `money`.
        hints:
          - "`*p` means \"the int that p points at\", so `*p += 3250;` changes `money`."
          - Print it with `printf("money %d\n", *p);`.
        tests:
          - expect: "money 4050"

  - title: Change the caller's variable
    id: c-pointers-2
    text: |
      Remember from the functions module: C passes arguments **by value**. A function gets copies, so it can't change the caller's variables. Pointers are the way around that. If you pass a variable's **address**, the function gets a copy of the address, and a copy of an address still points at the original variable.

      ```c run
      #include <stdio.h>

      void add_points(int *score, int points) {
          *score += points;
      }

      int main(void) {
          int score = 10;
          add_points(&score, 5);
          add_points(&score, 20);
          printf("%d\n", score);
          return 0;
      }
      ```

      ```output
      35
      ```

      Follow the data:

      1. `main` calls `add_points(&score, 5)`. The parameter `score` inside the function receives the **address** of `main`'s `score`.
      2. `*score += points` follows that address and changes `main`'s variable.
      3. When the function returns, its own variables disappear, but the change it made through the pointer stays.

      This is exactly how `scanf("%d", &x)` works: you give it the address, and it writes the number there.

      ### Swapping

      A swap function is the classic example: it must change **two** of the caller's variables, which `return` can't do. The body is the same three-step swap you used with arrays (save one value in a temporary, copy the other over it, put the saved value in the second), just done through `*a` and `*b`.

      Calling it requires addresses: `swap(&x, &y)`. Passing `x` and `y` without `&` is rejected here (`incompatible integer to pointer conversion`), because an `int` isn't an `int *`. Some older compilers only warn about it, but the program would then treat the numbers as addresses, so always treat that message as an error.

      **Your turn:** write `void swap(int *a, int *b)` that exchanges the two values.
    seed: |
      void swap(int *a, int *b) {

      }
    solution: |
      void swap(int *a, int *b) {
          int tmp = *a;
          *a = *b;
          *b = tmp;
      }
    harness: |
      int main(void) {
          int x = 1, y = 2;
          swap(&x, &y);
          CHECK_INT("x after swap", x, 2);
          CHECK_INT("y after swap", y, 1);
          int z = -7, w = -7;
          swap(&z, &w);
          CHECK("equal values stay equal", z == -7 && w == -7);
          return 0;
      }
    hints:
      - "Save the value at a: `int tmp = *a;`"
      - "Then `*a = *b;` and `*b = tmp;`"
    more:
      - task: |
          Write `void sort2(int *a, int *b)` that puts the two values in order, so that afterwards `*a <= *b`. If they're already in order, leave them alone.
        seed: |
          void sort2(int *a, int *b) {

          }
        solution: |
          void sort2(int *a, int *b) {
              if (*a > *b) {
                  int tmp = *a;
                  *a = *b;
                  *b = tmp;
              }
          }
        harness: |
          int main(void) {
              int x = 9, y = 4;
              sort2(&x, &y);
              CHECK("9, 4 becomes 4, 9", x == 4 && y == 9);
              int p = 1, q = 2;
              sort2(&p, &q);
              CHECK("1, 2 stays 1, 2", p == 1 && q == 2);
              int s = -3, t = -8;
              sort2(&s, &t);
              CHECK("-3, -8 becomes -8, -3", s == -8 && t == -3);
              int u = 5, v = 5;
              sort2(&u, &v);
              CHECK("equal values stay equal", u == 5 && v == 5);
              return 0;
          }
        hints:
          - Compare the values with `*a > *b`. Only swap when they're out of order.
        tests: []
      - task: |
          Write `void rotate3(int *a, int *b, int *c)` that moves the values one place to the left: `a` gets `b`'s old value, `b` gets `c`'s, and `c` gets `a`'s. Starting from `1, 2, 3` you get `2, 3, 1`.
        seed: |
          void rotate3(int *a, int *b, int *c) {

          }
        solution: |
          void rotate3(int *a, int *b, int *c) {
              int first = *a;
              *a = *b;
              *b = *c;
              *c = first;
          }
        harness: |
          int main(void) {
              int x = 1, y = 2, z = 3;
              rotate3(&x, &y, &z);
              CHECK("1, 2, 3 becomes 2, 3, 1", x == 2 && y == 3 && z == 1);
              rotate3(&x, &y, &z);
              CHECK("again: 3, 1, 2", x == 3 && y == 1 && z == 2);
              rotate3(&x, &y, &z);
              CHECK("three times is back to 1, 2, 3", x == 1 && y == 2 && z == 3);
              return 0;
          }
        hints:
          - Save `*a` in a temporary variable first, because it gets overwritten.
          - Then shift `*b` into `*a`, `*c` into `*b`, and the saved value into `*c`.
        tests: []

  - title: Returning two results
    id: c-pointers-3
    text: |
      A function can only `return` one value. When it naturally produces several results, a common C pattern is **out parameters**: the caller passes the addresses of variables, and the function fills them in.

      ```c run
      #include <stdio.h>

      void min_max(const int a[], int n, int *min, int *max) {
          *min = a[0];
          *max = a[0];
          for (int i = 1; i < n; i++) {
              if (a[i] < *min) {
                  *min = a[i];
              }
              if (a[i] > *max) {
                  *max = a[i];
              }
          }
      }

      int main(void) {
          int data[] = {7, -2, 15, 4};
          int lo, hi;
          min_max(data, 4, &lo, &hi);
          printf("min %d, max %d\n", lo, hi);
          return 0;
      }
      ```

      ```output
      min -2, max 15
      ```

      ### Reading the pattern

      - The parameters `int *min` and `int *max` are "where to put the answers".
      - Inside, the function writes through them: `*min = ...`.
      - The caller creates the variables (`lo`, `hi`), then passes their addresses.

      Out parameters show up all over real C code, including the standard library. A frequent combination is to `return` a success or error code while delivering the actual results through pointers, so the caller can check whether it worked.

      Name out parameters clearly and write to every one of them on every path, so the caller never reads an unset variable.

      **Your turn:** write `void divmod(int a, int b, int *q, int *r)` that stores `a / b` in `*q` and `a % b` in `*r`.
    seed: |
      void divmod(int a, int b, int *q, int *r) {

      }
    solution: |
      void divmod(int a, int b, int *q, int *r) {
          *q = a / b;
          *r = a % b;
      }
    harness: |
      int main(void) {
          int q = 0, r = 0;
          divmod(17, 5, &q, &r);
          CHECK_INT("17 / 5", q, 3);
          CHECK_INT("17 % 5", r, 2);
          divmod(754, 60, &q, &r);
          CHECK_INT("754 / 60", q, 12);
          CHECK_INT("754 % 60", r, 34);
          return 0;
      }
    hints:
      - "Write through the pointers: `*q = a / b;` and `*r = a % b;`"
    more:
      - task: |
          Write `void min_max(const int a[], int n, int *min, int *max)` that stores the smallest and the largest element of the array (which has at least one element) in `*min` and `*max`.
        seed: |
          void min_max(const int a[], int n, int *min, int *max) {

          }
        solution: |
          void min_max(const int a[], int n, int *min, int *max) {
              *min = a[0];
              *max = a[0];
              for (int i = 1; i < n; i++) {
                  if (a[i] < *min) *min = a[i];
                  if (a[i] > *max) *max = a[i];
              }
          }
        harness: |
          int main(void) {
              int a[] = {16, 9, 22, 13, 30};
              int lo = 0, hi = 0;
              min_max(a, 5, &lo, &hi);
              CHECK_INT("min of {16,9,22,13,30}", lo, 9);
              CHECK_INT("max of {16,9,22,13,30}", hi, 30);
              int b[] = {-4, -9, -1};
              min_max(b, 3, &lo, &hi);
              CHECK_INT("min of negatives", lo, -9);
              CHECK_INT("max of negatives", hi, -1);
              int c[] = {7};
              min_max(c, 1, &lo, &hi);
              CHECK("one element is both", lo == 7 && hi == 7);
              return 0;
          }
        hints:
          - Start both at `a[0]`, not at 0, so all-negative arrays work.
          - Update `*min` and `*max` inside one loop.
        tests: []
      - task: |
          Write `int stats(const int a[], int n, int *sum, double *avg)`. If `n` is 0, return `0` and **don't touch** `*sum` or `*avg`. Otherwise store the sum and the average and return `1`. Returning a success flag like this is a common C pattern.
        seed: |
          int stats(const int a[], int n, int *sum, double *avg) {

          }
        solution: |
          int stats(const int a[], int n, int *sum, double *avg) {
              if (n == 0) return 0;
              int s = 0;
              for (int i = 0; i < n; i++) s += a[i];
              *sum = s;
              *avg = (double)s / n;
              return 1;
          }
        harness: |
          int main(void) {
              int a[] = {2, 4, 6, 9};
              int sum = -1;
              double avg = -1;
              CHECK_INT("returns 1 for 4 numbers", stats(a, 4, &sum, &avg), 1);
              CHECK_INT("sum of {2,4,6,9}", sum, 21);
              CHECK_DBL("average of {2,4,6,9}", avg, 5.25);
              int s2 = 123;
              double a2 = 4.5;
              CHECK_INT("returns 0 for no numbers", stats(a, 0, &s2, &a2), 0);
              CHECK("outputs untouched when n is 0", s2 == 123 && a2 == 4.5);
              return 0;
          }
        hints:
          - Check `n == 0` first and return right away.
          - Add up into a local variable, then write `*sum` and `*avg` at the end. Cast before dividing.
        tests: []

  - title: Pointer arithmetic and arrays
    id: c-pointers-4
    text: |
      Here's the secret behind arrays. In most expressions, an array's name automatically turns into a **pointer to its first element**. This is called **decay**. So after `int a[3];`, writing `a` gives the same thing as `&a[0]`.

      ### Pointer arithmetic

      Adding an integer to a pointer moves it by that many **elements**, not bytes. If `p` points at an `int`, `p + 1` points at the next `int` (4 bytes further on), and `p + 2` two ints on. The compiler multiplies by the element size for you.

      ```c run
      #include <stdio.h>

      int main(void) {
          double prices[] = {1.5, 2.25, 4.0};
          double *p = prices;
          printf("%.2f\n", *p);
          printf("%.2f\n", *(p + 2));
          p++;
          printf("%.2f\n", *p);
          printf("%d\n", prices[1] == *(prices + 1));
          return 0;
      }
      ```

      ```output
      1.50
      4.00
      2.25
      1
      ```

      ### `a[i]` is `*(a + i)`

      The indexing you've been using is defined in terms of pointers: `a[i]` literally means "start at `a`, move `i` elements, and dereference". That's why array indexes start at 0 (`*(a + 0)` is the first element), and why a function that receives an array can change the caller's elements: it received a pointer to them.

      ### Walking with a pointer

      Instead of an index, you can move a pointer along the array. The loop needs to know when to stop: either count down `n`, or compute an **end pointer** one past the last element (`a + n`) and loop while the moving pointer hasn't reached it. Pointing one past the end is allowed; dereferencing it is not.

      **Your turn:** write `int sum(const int *p, int n)` using pointer arithmetic instead of `[]`.
    seed: |
      int sum(const int *p, int n) {

      }
    solution: |
      int sum(const int *p, int n) {
          int s = 0;
          for (const int *end = p + n; p < end; p++) {
              s += *p;
          }
          return s;
      }
    forbid:
      - pattern: "\\["
        message: Use pointer arithmetic (`*p`, `p++`, `*(p + i)`) instead of `[ ]` on this step.
    harness: |
      int main(void) {
          int a[] = {1, 2, 3, 4};
          CHECK_INT("sum {1,2,3,4}", sum(a, 4), 10);
          CHECK_INT("sum of first 2", sum(a, 2), 3);
          CHECK_INT("sum of middle 2", sum(a + 1, 2), 5);
          CHECK_INT("empty", sum(a, 0), 0);
          return 0;
      }
    hints:
      - "`*(p + i)` is element i. Or walk the pointer itself: `s += *p; p++;`"
      - "One neat version: `for (const int *end = p + n; p < end; p++) s += *p;`"
    more:
      - task: |
          Write `int max_of(const int *p, int n)` that returns the largest of the `n` values (with `n` at least 1), using pointer arithmetic instead of `[]`.
        seed: |
          int max_of(const int *p, int n) {

          }
        solution: |
          int max_of(const int *p, int n) {
              int best = *p;
              for (const int *end = p + n; p < end; p++) {
                  if (*p > best) best = *p;
              }
              return best;
          }
        harness: |
          int main(void) {
              int a[] = {3, 17, 4, 17, -2};
              CHECK_INT("max of {3,17,4,17,-2}", max_of(a, 5), 17);
              CHECK_INT("max of the first one", max_of(a, 1), 3);
              CHECK_INT("max of the last two", max_of(a + 3, 2), 17);
              int b[] = {-5, -9};
              CHECK_INT("all negative", max_of(b, 2), -5);
              return 0;
          }
        forbid:
          - pattern: "\\["
            message: Use pointer arithmetic (`*p`, `p++`) instead of `[]`.
        hints:
          - Start with `int best = *p;`, the first value.
          - Move `p` forward until it reaches `p + n`, comparing `*p` with `best` each time.
        tests: []
      - task: |
          Write `int count_pairs(const int *p, int n)` that counts how many neighbours are equal: positions where a value is the same as the one right after it. `{1, 1, 2, 2, 2}` has 3 such pairs. No `[]`.
        seed: |
          int count_pairs(const int *p, int n) {

          }
        solution: |
          int count_pairs(const int *p, int n) {
              int count = 0;
              for (const int *q = p; q + 1 < p + n; q++) {
                  if (*q == *(q + 1)) count++;
              }
              return count;
          }
        harness: |
          int main(void) {
              int a[] = {1, 1, 2, 2, 2};
              CHECK_INT("{1,1,2,2,2}", count_pairs(a, 5), 3);
              int b[] = {1, 2, 1, 2};
              CHECK_INT("{1,2,1,2}", count_pairs(b, 4), 0);
              CHECK_INT("one element", count_pairs(a, 1), 0);
              CHECK_INT("no elements", count_pairs(a, 0), 0);
              int c[] = {4, 4};
              CHECK_INT("{4,4}", count_pairs(c, 2), 1);
              return 0;
          }
        forbid:
          - pattern: "\\["
            message: Use pointer arithmetic instead of `[]`.
        hints:
          - The element after `*q` is `*(q + 1)`.
          - Stop while `q + 1` is still inside the array, `q + 1 < p + n`, so you never read past the end.
        tests: []

  - title: "NULL"
    id: c-pointers-5
    text: |
      Sometimes a pointer needs to say "I'm not pointing at anything right now". For that, C has **`NULL`**: a special pointer value guaranteed not to be the address of any real object. It's defined in `<stddef.h>` (and several other headers).

      Typical uses:

      - A search function returns `NULL` when it finds nothing.
      - An optional parameter can be `NULL` to mean "not provided".
      - The last node of a linked list has a `next` pointer of `NULL`.
      - A pointer that has been freed is set to `NULL` so nobody uses it by accident.

      ### Never dereference NULL

      Following a `NULL` pointer is undefined behavior. On desktop operating systems it usually crashes the program immediately with a **segmentation fault**. But undefined means *anything* can happen: in WebAssembly, which runs your code on this site, address 0 is ordinary memory, so reading through `NULL` here may quietly give you 0 instead of crashing. The same bug can crash on one machine and silently produce wrong answers on another, which is exactly why you must never rely on it. Whenever a pointer **might** be `NULL`, check it before using it:

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      void print_score(const int *score) {
          if (score == NULL) {
              printf("no score yet\n");
              return;
          }
          printf("score %d\n", *score);
      }

      int main(void) {
          int s = 42;
          print_score(&s);
          print_score(NULL);
          return 0;
      }
      ```

      ```output
      score 42
      no score yet
      ```

      ### Style

      `if (p != NULL)` and `if (p)` mean the same thing, because `NULL` compares equal to 0 (false). Many C programmers write the short form. Checking early and returning (a **guard clause**) keeps the rest of the function simple, since it can assume the pointer is valid.

      **Your turn:** write `int safe_get(const int *p, int fallback)` that returns `*p`, or `fallback` if `p` is `NULL`.
    seed: |
      #include <stddef.h>

      int safe_get(const int *p, int fallback) {

      }
    solution: |
      #include <stddef.h>

      int safe_get(const int *p, int fallback) {
          if (p == NULL) return fallback;
          return *p;
      }
    harness: |
      int main(void) {
          int v = 42;
          CHECK_INT("valid pointer", safe_get(&v, -1), 42);
          CHECK_INT("NULL pointer", safe_get(NULL, -1), -1);
          CHECK_INT("NULL with other fallback", safe_get(NULL, 7), 7);
          return 0;
      }
    hints:
      - "Check `if (p == NULL) return fallback;` before touching `*p`."
    more:
      - task: |
          Write `int safe_div(int a, int b, int *out)`. If `b` is 0 or `out` is `NULL`, return `0` and do nothing else. Otherwise store `a / b` in `*out` and return `1`.
        seed: |
          #include <stddef.h>

          int safe_div(int a, int b, int *out) {

          }
        solution: |
          #include <stddef.h>

          int safe_div(int a, int b, int *out) {
              if (b == 0 || out == NULL) return 0;
              *out = a / b;
              return 1;
          }
        harness: |
          int main(void) {
              int r = -1;
              CHECK_INT("10 / 3 succeeds", safe_div(10, 3, &r), 1);
              CHECK_INT("10 / 3 stores 3", r, 3);
              r = 42;
              CHECK_INT("dividing by 0 fails", safe_div(10, 0, &r), 0);
              CHECK_INT("result untouched after a failure", r, 42);
              CHECK_INT("a NULL out pointer fails", safe_div(10, 2, NULL), 0);
              return 0;
          }
        hints:
          - Check both problems first, `b == 0 || out == NULL`, before touching `*out`.
        tests: []
      - task: |
          Write `const char *display_name(const char *name)` that returns `name`, or `"anonymous"` if `name` is `NULL` or an empty string. Check for `NULL` **before** looking at the first character.
        seed: |
          #include <stddef.h>

          const char *display_name(const char *name) {

          }
        solution: |
          #include <stddef.h>

          const char *display_name(const char *name) {
              if (name == NULL || *name == '\0') return "anonymous";
              return name;
          }
        harness: |
          int main(void) {
              CHECK_STR("a real name", display_name("ropz"), "ropz");
              CHECK_STR("NULL", display_name(NULL), "anonymous");
              CHECK_STR("empty string", display_name(""), "anonymous");
              const char *n = "m0NESY";
              CHECK("returns the same pointer it got", display_name(n) == n);
              return 0;
          }
        hints:
          - "`||` stops at the first true part, so in `name == NULL || *name == '\\0'` the `*name` never runs when `name` is NULL."
        tests: []

  - title: Strings through pointers
    id: c-pointers-6
    text: |
      Strings are char arrays, and a string passed to a function arrives as a `char *` pointing at its first character. Walking a string with a pointer is the most common pointer code in C, so it's worth getting fluent with it.

      ```c run
      #include <stdio.h>

      int count_vowels(const char *s) {
          int count = 0;
          for (const char *c = s; *c != '\0'; c++) {
              if (*c == 'a' || *c == 'e' || *c == 'i' || *c == 'o' || *c == 'u') {
                  count++;
              }
          }
          return count;
      }

      int main(void) {
          printf("%d\n", count_vowels("programming in c"));
          return 0;
      }
      ```

      ```output
      4
      ```

      ### Reading the loop

      - `const char *c = s` starts a pointer at the first character.
      - `*c != '\0'` keeps going until the terminator.
      - `c++` moves to the next character.
      - Inside, `*c` is the current character.

      It does the same thing as `for (int i = 0; s[i] != '\0'; i++)` with `s[i]`. Both styles are common; the pointer version is idiomatic C and shows up in the standard library's own code.

      ### String literals are read-only

      A literal like `"programming in c"` must never be modified: writing to it is undefined behavior. On most desktop systems literals live in read-only memory, so an attempt crashes; on others it silently misbehaves. You can point at a literal with a `const char *`, and the `const` makes the compiler stop you from writing through it. Declaring parameters as `const char *` lets callers pass literals safely, and the compiler will stop you if the function tries to modify them.

      **Your turn:** write `int count_char(const char *s, char ch)` that returns how many times `ch` appears in `s`.
    seed: |
      int count_char(const char *s, char ch) {

      }
    solution: |
      int count_char(const char *s, char ch) {
          int n = 0;
          for (; *s != '\0'; s++) {
              if (*s == ch) n++;
          }
          return n;
      }
    harness: |
      int main(void) {
          CHECK_INT("'s' in \"headshots\"", count_char("headshots", 's'), 2);
          CHECK_INT("'z' in \"dust\"", count_char("dust", 'z'), 0);
          CHECK_INT("'a' in \"\"", count_char("", 'a'), 0);
          CHECK_INT("' ' in \"a b c\"", count_char("a b c", ' '), 2);
          return 0;
      }
    hints:
      - Walk the pointer until `*s == '\0'`, counting matches.
    more:
