      - task: |
          Write `void tidy(char *s)` that removes spaces at the start and the end, and turns every run of spaces between words into **one** space, in place. `"  rush   b  "` becomes `"rush b"`.
        seed: |
          void tidy(char *s) {

          }
        solution: |
          void tidy(char *s) {
              char *w = s;
              int pending = 0;
              for (const char *r = s; *r != '\0'; r++) {
                  if (*r == ' ') {
                      if (w != s) pending = 1;
                  } else {
                      if (pending) {
                          *w = ' ';
                          w++;
                          pending = 0;
                      }
                      *w = *r;
                      w++;
                  }
              }
              *w = '\0';
          }
        harness: |
          int main(void) {
              char a[] = "  rush   b  ";
              tidy(a);
              CHECK_STR("\"  rush   b  \"", a, "rush b");
              char b[] = "plant the bomb";
              tidy(b);
              CHECK_STR("already tidy", b, "plant the bomb");
              char c[] = "     ";
              tidy(c);
              CHECK_STR("only spaces", c, "");
              char d[] = "a  b  c";
              tidy(d);
              CHECK_STR("\"a  b  c\"", d, "a b c");
              char e[] = "";
              tidy(e);
              CHECK_STR("empty string", e, "");
              return 0;
          }
        hints:
          - Use a read pointer and a write pointer. Don't write a space right away when you see one; remember that one is pending.
          - Write the pending space only when the next word starts, and only if something has been written already (`w != s`). That drops leading and trailing spaces.
