id: c-pointers
title: Pointers
lang: c
phase: "C: Memory"
summary: Addresses and the variables that hold them. & and *, changing a caller's variables, pointer arithmetic, arrays vs pointers, NULL and const.
steps:
  - title: Addresses and pointers
    id: c-pointers-1
    text: |
      Pointers are the idea that makes C, C. They're also the topic most beginners find hardest, so take this module slowly and use the **Watch it run** links: seeing the arrows helps enormously.

      ### Memory is a long row of numbered bytes

      Your computer's memory is like a very long street of mailboxes, each holding one byte and each with a number: its **address**. When you declare `int hp = 100;`, the compiler reserves 4 bytes somewhere on that street for `hp`. The variable's name is for you; the machine only knows the address.

      The `&` operator gives you a variable's address: `&hp` means "where `hp` lives". You've already used it with `scanf`.

      ### A pointer is a variable that holds an address

      ```c run
      #include <stdio.h>

      int main(void) {
          int hp = 100;
          int *p = &hp;
          printf("%d\n", *p);
          *p = 75;
          printf("%d\n", hp);
          hp = 20;
          printf("%d\n", *p);
          return 0;
      }
      ```

      ```output
      100
      75
      20
      ```

      - `int *p` declares `p` as a **pointer to int**: a variable whose value is the address of an int.
      - `p = &hp` stores `hp`'s address in `p`. We say "`p` points at `hp`".
      - `*p` **dereferences** the pointer: it means "the int at the address stored in `p`". Reading `*p` reads `hp`; writing `*p = 75` writes into `hp`.

      `p` and `hp` are two separate variables. Changing `hp` is visible through `*p`, and changing `*p` changes `hp`, because they refer to the same memory.

      ### Two meanings of `*`

      In a **declaration** (`int *p`), `*` means "p is a pointer". In an **expression** (`*p = 75`), `*` means "follow the pointer". Same symbol, two jobs; it's the main thing that makes pointer code look confusing at first.

      (The actual numbers stored in pointers vary from run to run and machine to machine, so you rarely print them. You can with `%p` if you're curious.)

      **Your turn:** make `p` point at `armor`, then use `p` (not `armor` directly) to set it to `50`.
    fill: |
      #include <stdio.h>

      int main(void) {
          int armor = 100;
          int *p = [[&armor]];
          [[*p]] = 50;
          printf("armor %d\n", armor);
          return 0;
      }
    hints:
      - The address of armor is `&armor`.
      - To write to the variable p points at, use `*p = ...`.
    tests:
      - expect: "armor 50"

  - title: Change the caller's variable
    id: c-pointers-2
    text: |
      Remember from the functions module: C passes arguments **by value**. A function gets copies, so it can't change the caller's variables. Pointers are the way around that. If you pass a variable's **address**, the function gets a copy of the address, and a copy of an address still points at the original variable.

      ```c run
      #include <stdio.h>

      void add_points(int *score, int points) {
          *score += points;
      }

      int main(void) {
          int score = 10;
          add_points(&score, 5);
          add_points(&score, 20);
          printf("%d\n", score);
          return 0;
      }
      ```

      ```output
      35
      ```

      Follow the data:

      1. `main` calls `add_points(&score, 5)`. The parameter `score` inside the function receives the **address** of `main`'s `score`.
      2. `*score += points` follows that address and changes `main`'s variable.
      3. When the function returns, its own variables disappear, but the change it made through the pointer stays.

      This is exactly how `scanf("%d", &x)` works: you give it the address, and it writes the number there.

      ### Swapping

      A swap function is the classic example: it must change **two** of the caller's variables, which `return` can't do. The body is the same three-step swap you used with arrays (save one value in a temporary, copy the other over it, put the saved value in the second), just done through `*a` and `*b`.

      Calling it requires addresses: `swap(&x, &y)`. Passing `x` and `y` without `&` is a compile error, because an `int` isn't an `int *`.

      **Your turn:** write `void swap(int *a, int *b)` that exchanges the two values.
    seed: |
      void swap(int *a, int *b) {

      }
    solution: |
      void swap(int *a, int *b) {
          int tmp = *a;
          *a = *b;
          *b = tmp;
      }
    harness: |
      int main(void) {
          int x = 1, y = 2;
          swap(&x, &y);
          CHECK_INT("x after swap", x, 2);
          CHECK_INT("y after swap", y, 1);
          int z = -7, w = -7;
          swap(&z, &w);
          CHECK("equal values stay equal", z == -7 && w == -7);
          return 0;
      }
    hints:
      - "Save the value at a: `int tmp = *a;`"
      - "Then `*a = *b;` and `*b = tmp;`"

  - title: Returning two results
    id: c-pointers-3
    text: |
      A function can only `return` one value. When it naturally produces several results, a common C pattern is **out parameters**: the caller passes the addresses of variables, and the function fills them in.

      ```c run
      #include <stdio.h>

      void min_max(const int a[], int n, int *min, int *max) {
          *min = a[0];
          *max = a[0];
          for (int i = 1; i < n; i++) {
              if (a[i] < *min) {
                  *min = a[i];
              }
              if (a[i] > *max) {
                  *max = a[i];
              }
          }
      }

      int main(void) {
          int data[] = {7, -2, 15, 4};
          int lo, hi;
          min_max(data, 4, &lo, &hi);
          printf("min %d, max %d\n", lo, hi);
          return 0;
      }
      ```

      ```output
      min -2, max 15
      ```

      ### Reading the pattern

      - The parameters `int *min` and `int *max` are "where to put the answers".
      - Inside, the function writes through them: `*min = ...`.
      - The caller creates the variables (`lo`, `hi`), then passes their addresses.

      Out parameters show up all over real C code, including the standard library. A frequent combination is to `return` a success or error code while delivering the actual results through pointers, so the caller can check whether it worked.

      Name out parameters clearly and write to every one of them on every path, so the caller never reads an unset variable.

      **Your turn:** write `void divmod(int a, int b, int *q, int *r)` that stores `a / b` in `*q` and `a % b` in `*r`.
    seed: |
      void divmod(int a, int b, int *q, int *r) {

      }
    solution: |
      void divmod(int a, int b, int *q, int *r) {
          *q = a / b;
          *r = a % b;
      }
    harness: |
      int main(void) {
          int q = 0, r = 0;
          divmod(17, 5, &q, &r);
          CHECK_INT("17 / 5", q, 3);
          CHECK_INT("17 % 5", r, 2);
          divmod(754, 60, &q, &r);
          CHECK_INT("754 / 60", q, 12);
          CHECK_INT("754 % 60", r, 34);
          return 0;
      }
    hints:
      - "Write through the pointers: `*q = a / b;` and `*r = a % b;`"

  - title: Pointer arithmetic and arrays
    id: c-pointers-4
    text: |
      Here's the secret behind arrays. In most expressions, an array's name automatically turns into a **pointer to its first element**. This is called **decay**. So after `int a[3];`, writing `a` gives the same thing as `&a[0]`.

      ### Pointer arithmetic

      Adding an integer to a pointer moves it by that many **elements**, not bytes. If `p` points at an `int`, `p + 1` points at the next `int` (4 bytes further on), and `p + 2` two ints on. The compiler multiplies by the element size for you.

      ```c run
      #include <stdio.h>

      int main(void) {
          double prices[] = {1.5, 2.25, 4.0};
          double *p = prices;
          printf("%.2f\n", *p);
          printf("%.2f\n", *(p + 2));
          p++;
          printf("%.2f\n", *p);
          printf("%d\n", prices[1] == *(prices + 1));
          return 0;
      }
      ```

      ```output
      1.50
      4.00
      2.25
      1
      ```

      ### `a[i]` is `*(a + i)`

      The indexing you've been using is defined in terms of pointers: `a[i]` literally means "start at `a`, move `i` elements, and dereference". That's why array indexes start at 0 (`*(a + 0)` is the first element), and why a function that receives an array can change the caller's elements: it received a pointer to them.

      ### Walking with a pointer

      Instead of an index, you can move a pointer along the array. The loop needs to know when to stop: either count down `n`, or compute an **end pointer** one past the last element (`a + n`) and loop while the moving pointer hasn't reached it. Pointing one past the end is allowed; dereferencing it is not.

      **Your turn:** write `int sum(const int *p, int n)` using pointer arithmetic instead of `[]`.
    seed: |
      int sum(const int *p, int n) {

      }
    solution: |
      int sum(const int *p, int n) {
          int s = 0;
          for (const int *end = p + n; p < end; p++) {
              s += *p;
          }
          return s;
      }
    forbid:
      - pattern: "\\["
        message: Use pointer arithmetic (`*p`, `p++`, `*(p + i)`) instead of `[ ]` on this step.
    harness: |
      int main(void) {
          int a[] = {1, 2, 3, 4};
          CHECK_INT("sum {1,2,3,4}", sum(a, 4), 10);
          CHECK_INT("sum of first 2", sum(a, 2), 3);
          CHECK_INT("sum of middle 2", sum(a + 1, 2), 5);
          CHECK_INT("empty", sum(a, 0), 0);
          return 0;
      }
    hints:
      - "`*(p + i)` is element i. Or walk the pointer itself: `s += *p; p++;`"
      - "One neat version: `for (const int *end = p + n; p < end; p++) s += *p;`"

  - title: NULL
    id: c-pointers-5
    text: |
      Sometimes a pointer needs to say "I'm not pointing at anything right now". For that, C has **`NULL`**: a special pointer value guaranteed not to be the address of any real object. It's defined in `<stddef.h>` (and several other headers).

      Typical uses:

      - A search function returns `NULL` when it finds nothing.
      - An optional parameter can be `NULL` to mean "not provided".
      - The last node of a linked list has a `next` pointer of `NULL`.
      - A pointer that has been freed is set to `NULL` so nobody uses it by accident.

      ### Never dereference NULL

      Following a `NULL` pointer is undefined behavior. On desktop operating systems it immediately crashes the program with a **segmentation fault** (in the browser you'll see a crash message). So whenever a pointer **might** be `NULL`, check it before using it:

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      void print_score(const int *score) {
          if (score == NULL) {
              printf("no score yet\n");
              return;
          }
          printf("score %d\n", *score);
      }

      int main(void) {
          int s = 42;
          print_score(&s);
          print_score(NULL);
          return 0;
      }
      ```

      ```output
      score 42
      no score yet
      ```

      ### Style

      `if (p != NULL)` and `if (p)` mean the same thing, because `NULL` compares equal to 0 (false). Many C programmers write the short form. Checking early and returning (a **guard clause**) keeps the rest of the function simple, since it can assume the pointer is valid.

      **Your turn:** write `int safe_get(const int *p, int fallback)` that returns `*p`, or `fallback` if `p` is `NULL`.
    seed: |
      #include <stddef.h>

      int safe_get(const int *p, int fallback) {

      }
    solution: |
      #include <stddef.h>

      int safe_get(const int *p, int fallback) {
          if (p == NULL) return fallback;
          return *p;
      }
    harness: |
      int main(void) {
          int v = 42;
          CHECK_INT("valid pointer", safe_get(&v, -1), 42);
          CHECK_INT("NULL pointer", safe_get(NULL, -1), -1);
          CHECK_INT("NULL with other fallback", safe_get(NULL, 7), 7);
          return 0;
      }
    hints:
      - "Check `if (p == NULL) return fallback;` before touching `*p`."

  - title: Strings through pointers
    id: c-pointers-6
    text: |
      Strings are char arrays, and a string passed to a function arrives as a `char *` pointing at its first character. Walking a string with a pointer is the most common pointer code in C, so it's worth getting fluent with it.

      ```c run
      #include <stdio.h>

      int count_vowels(const char *s) {
          int count = 0;
          for (const char *c = s; *c != '\0'; c++) {
              if (*c == 'a' || *c == 'e' || *c == 'i' || *c == 'o' || *c == 'u') {
                  count++;
              }
          }
          return count;
      }

      int main(void) {
          printf("%d\n", count_vowels("programming in c"));
          return 0;
      }
      ```

      ```output
      4
      ```

      ### Reading the loop

      - `const char *c = s` starts a pointer at the first character.
      - `*c != '\0'` keeps going until the terminator.
      - `c++` moves to the next character.
      - Inside, `*c` is the current character.

      It does the same thing as `for (int i = 0; s[i] != '\0'; i++)` with `s[i]`. Both styles are common; the pointer version is idiomatic C and shows up in the standard library's own code.

      ### String literals are read-only

      A literal like `"programming in c"` is stored in read-only memory. You can point at it with a `const char *`, but you must never write through that pointer. Declaring parameters as `const char *` lets callers pass literals safely, and the compiler will stop you if the function tries to modify them.

      **Your turn:** write `int count_char(const char *s, char ch)` that returns how many times `ch` appears in `s`.
    seed: |
      int count_char(const char *s, char ch) {

      }
    solution: |
      int count_char(const char *s, char ch) {
          int n = 0;
          for (; *s != '\0'; s++) {
              if (*s == ch) n++;
          }
          return n;
      }
    harness: |
      int main(void) {
          CHECK_INT("'s' in \"headshots\"", count_char("headshots", 's'), 2);
          CHECK_INT("'z' in \"dust\"", count_char("dust", 'z'), 0);
          CHECK_INT("'a' in \"\"", count_char("", 'a'), 0);
          CHECK_INT("' ' in \"a b c\"", count_char("a b c", ' '), 2);
          return 0;
      }
    hints:
      - Walk the pointer until `*s == '\0'`, counting matches.

  - title: Pointers to pointers
    id: c-pointers-7
    text: |
      A pointer is itself a variable, so it has an address too. A **pointer to a pointer** (`int **pp`, read "pointer to pointer to int") stores that address. It sounds abstract, but there's one very practical reason to use it:

      **When a function must change which address the caller's pointer holds**, it needs the address of that pointer, for the same reason a function needs `&x` to change an `int`.

      ```c run
      #include <stdio.h>

      void skip_digits(const char **p) {
          while (**p >= '0' && **p <= '9') {
              (*p)++;
          }
      }

      int main(void) {
          const char *text = "2024 was a leap year";
          skip_digits(&text);
          printf("[%s]\n", text);
          return 0;
      }
      ```

      ```output
      [ was a leap year]
      ```

      ### Unpacking the stars

      Inside `skip_digits`, `p` has type `const char **`:

      - `p` is the address of `main`'s `text` variable.
      - `*p` **is** `main`'s `text` (a `const char *`), so `(*p)++` moves the caller's pointer forward.
      - `**p` is the character that `text` currently points at.

      The parentheses in `(*p)++` matter. `*p++` would move `p` itself (the local copy of the address) instead of the caller's pointer, because `++` binds tighter than `*`.

      After the call, `main`'s `text` points into the middle of the same string. Nothing was copied; only the pointer moved.

      ### Where you'll see this

      Functions that allocate memory and hand it back through a parameter, functions that parse text and advance the caller's position, and linked-list code that changes the head pointer all use double pointers.

      **Your turn:** write `void advance(const char **s)` that moves the caller's string pointer past any leading spaces. After `advance(&p)` with `p` pointing at `"   go"`, `p` should point at `"go"`.
    seed: |
      void advance(const char **s) {

      }
    solution: |
      void advance(const char **s) {
          while (**s == ' ') {
              (*s)++;
          }
      }
    harness: |
      int main(void) {
          const char *p = "   go";
          advance(&p);
          CHECK_STR("\"   go\"", p, "go");
          const char *q = "ready";
          advance(&q);
          CHECK_STR("no spaces", q, "ready");
          const char *r = "    ";
          advance(&r);
          CHECK_STR("only spaces", r, "");
          return 0;
      }
    hints:
      - "`*s` is the caller's pointer, and `**s` is the character it points at."
      - "While `**s == ' '`, move the caller's pointer: `(*s)++;` (parentheses matter)."

  - title: const and pointers
    id: c-pointers-8
    text: |
      `const` can protect two different things when pointers are involved: the **data being pointed at**, or the **pointer itself**. Where you put `const` decides which.

      | Declaration | Can change `*p`? | Can move `p`? |
      |---|---|---|
      | `const int *p` | no | yes |
      | `int *const p` | yes | no |
      | `const int *const p` | no | no |

      The trick is to read the declaration **right to left**: `const int *p` is "p is a pointer to an int that is const". `int *const p` is "p is a const pointer to an int".

      ### Why professionals use it everywhere

      When a function takes `const int *a`, it promises not to change the caller's data, and the compiler enforces the promise. Readers learn from the signature alone that the function only reads. It also allows passing data that genuinely can't change, like string literals.

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      const char *first_upper(const char *s) {
          for (; *s != '\0'; s++) {
              if (*s >= 'A' && *s <= 'Z') {
                  return s;
              }
          }
          return NULL;
      }

      int main(void) {
          const char *hit = first_upper("hello World");
          if (hit != NULL) {
              printf("%s\n", hit);
          }
          printf("%d\n", first_upper("quiet") == NULL);
          return 0;
      }
      ```

      ```output
      World
      1
      ```

      ### Returning a pointer into the input

      A search can return a **pointer to the element it found**, instead of an index, and `NULL` for "not found". If the input was `const`, the returned pointer must be `const` too; otherwise the caller could use it to modify data that was promised to be read-only, and the compiler rejects that (`discards 'const' qualifier`).

      Note that `s++` is allowed above: `s` is a pointer to const chars, and moving the pointer doesn't change any chars.

      **Your turn:** write `const int *find(const int *a, int n, int target)` that returns a pointer to the first element equal to `target`, or `NULL` if there is none.
    seed: |
      #include <stddef.h>

      const int *find(const int *a, int n, int target) {

      }
    solution: |
      #include <stddef.h>

      const int *find(const int *a, int n, int target) {
          for (const int *p = a; p < a + n; p++) {
              if (*p == target) return p;
          }
          return NULL;
      }
    harness: |
      int main(void) {
          const int scores[] = {7, 3, 9, 3};
          CHECK("finds 9 at index 2", find(scores, 4, 9) == &scores[2]);
          CHECK("first 3 is at index 1", find(scores, 4, 3) == &scores[1]);
          CHECK("missing value gives NULL", find(scores, 4, 42) == NULL);
          CHECK("empty range gives NULL", find(scores, 0, 7) == NULL);
          CHECK("searching a sub-range", find(scores + 2, 2, 3) == &scores[3]);
          return 0;
      }
    hints:
      - Loop over the n elements. When one equals target, return its address.
      - "`return &a[i];` or, walking a pointer, `return p;`. After the loop, `return NULL;`."

  - title: Two pointers from both ends
    id: c-pointers-9
    text: |
      The **two-pointer** technique comes up constantly, in interviews and in real code. One pointer starts at the front, another at the back, and they move toward each other, doing some work at each step, until they meet.

      ```c run
      #include <stdio.h>

      int is_mirror(const int *a, int n) {
          const int *lo = a;
          const int *hi = a + n - 1;
          while (lo < hi) {
              if (*lo != *hi) {
                  return 0;
              }
              lo++;
              hi--;
          }
          return 1;
      }

      int main(void) {
          int x[] = {1, 4, 9, 4, 1};
          int y[] = {1, 2, 3};
          printf("%d %d\n", is_mirror(x, 5), is_mirror(y, 3));
          return 0;
      }
      ```

      ```output
      1 0
      ```

      ### The details that matter

      - `a + n - 1` points at the **last** element. `a + n` would be one past the end.
      - `lo < hi` compares positions. Comparing pointers with `<` is valid when both point into the same array. The loop stops when they meet (odd length, middle element) or cross (even length).
      - Each pass moves `lo` forward and `hi` backward, so the loop always finishes.

      The example checks whether the array reads the same from both ends. Reversing uses the same walk, but instead of comparing, it **swaps** the two values the pointers point at. You already know how to swap through pointers from step 2.

      Try it on paper with 4 and 5 elements before coding, to see exactly which pairs get touched.

      **Your turn:** write `void reverse(int *a, int n)` that reverses the array **in place** using two pointers (no `[ ]`).
    seed: |
      void reverse(int *a, int n) {

      }
    solution: |
      void reverse(int *a, int n) {
          if (n < 2) return;
          int *lo = a, *hi = a + n - 1;
          while (lo < hi) {
              int tmp = *lo;
              *lo = *hi;
              *hi = tmp;
              lo++;
              hi--;
          }
      }
    forbid:
      - pattern: "\\["
        message: Use two pointers (`*lo`, `*hi`) instead of `[ ]` on this step.
    harness: |
      int main(void) {
          int a[] = {1, 2, 3, 4, 5};
          reverse(a, 5);
          CHECK("odd length", a[0] == 5 && a[1] == 4 && a[2] == 3 && a[3] == 2 && a[4] == 1);
          int b[] = {10, 20, 30, 40};
          reverse(b, 4);
          CHECK("even length", b[0] == 40 && b[1] == 30 && b[2] == 20 && b[3] == 10);
          int c[] = {8};
          reverse(c, 1);
          CHECK_INT("one element", c[0], 8);
          reverse(c, 0);
          CHECK_INT("zero elements does nothing", c[0], 8);
          return 0;
      }
    hints:
      - "Start with `int *lo = a, *hi = a + n - 1;`."
      - "While `lo < hi`: swap `*lo` and `*hi` with a temp, then `lo++; hi--;`."
      - "Guard `n < 2` first, so you never compute `a - 1` for an empty array."

  - title: "Challenge: squeeze out spaces"
    id: c-pointers-10
    text: |
      Another two-pointer classic, with both pointers moving in the **same** direction at different speeds:

      - A **read** pointer visits every character.
      - A **write** pointer marks where the next character we keep should go. It only advances when something is kept.

      Because the write pointer never gets ahead of the read pointer, you can filter a string **in place**, in the same buffer, without allocating anything.

      ```c run
      #include <stdio.h>

      void keep_digits(char *s) {
          char *write = s;
          for (const char *read = s; *read != '\0'; read++) {
              if (*read >= '0' && *read <= '9') {
                  *write = *read;
                  write++;
              }
          }
          *write = '\0';
      }

      int main(void) {
          char phone[] = "(555) 123-4567";
          keep_digits(phone);
          printf("%s\n", phone);
          return 0;
      }
      ```

      ```output
      5551234567
      ```

      ### Trace a few steps

      For `"(555) 1"`: the read pointer sees `(`, which isn't kept, so write stays at index 0. Then `5`, kept: written at index 0, write moves to 1. Then `5` to index 1, `5` to index 2. Then `)` and the space are skipped, and `1` goes to index 3. The kept characters slide left over the ones that were dropped.

      ### Don't forget the terminator

      When the read pointer reaches the end, the characters after the write position are leftovers from the original string. Writing `'\0'` at the write position cuts them off. Forgetting it is the classic bug: the result would print with junk on the end.

      `phone` is declared as an **array** (`char phone[] = "..."`), which makes a writable copy of the text. Modifying a string literal directly through a pointer would be undefined behavior.

      **Your turn:** write `void squeeze(char *s)` that removes every space from `s` in place.
    seed: |
      void squeeze(char *s) {

      }
    solution: |
      void squeeze(char *s) {
          char *w = s;
          for (const char *r = s; *r != '\0'; r++) {
              if (*r != ' ') {
                  *w = *r;
                  w++;
              }
          }
          *w = '\0';
      }
    harness: |
      int main(void) {
          char a[] = "a b  c";
          squeeze(a);
          CHECK_STR("\"a b  c\"", a, "abc");
          char b[] = "   rush b   ";
          squeeze(b);
          CHECK_STR("leading and trailing", b, "rushb");
          char c[] = "nospace";
          squeeze(c);
          CHECK_STR("no spaces", c, "nospace");
          char d[] = "    ";
          squeeze(d);
          CHECK_STR("only spaces", d, "");
          return 0;
      }
    hints:
      - "Use two pointers into the same string: `char *w = s;` for writing and another for reading."
      - "For every character that isn't a space, copy it with `*w = *r;` and move `w` forward."
      - "After the loop, end the string: `*w = '\\0';`"
