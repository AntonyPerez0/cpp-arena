          Write `int read_number(const char **s)` that reads the digits at the start of `*s`, returns them as a number, and moves the caller's pointer past them. With `p` pointing at `"123abc"`, `read_number(&p)` returns `123` and leaves `p` pointing at `"abc"`. If there are no digits, return 0 and don't move the pointer.
        seed: |
