              CHECK_INT("\"123abc\" gives 123", read_number(&p), 123);
              CHECK_STR("pointer moved to \"abc\"", p, "abc");
              const char *q = "7";
              CHECK_INT("\"7\" gives 7", read_number(&q), 7);
              CHECK_STR("pointer at the end", q, "");
              const char *r = "x9";
