          Prefix sums work in two dimensions too. Write class `Grid2D` with a constructor taking a `std::vector<std::vector<int>>` and `long long sum(int r1, int c1, int r2, int c2) const`, the sum of the rectangle with those inclusive corners, in O(1) per query. Store `P[r][c]`, the sum of everything above and to the left, with an extra row and column of zeros.
        seed: |
          #include <vector>

          class Grid2D {
          public:
              explicit Grid2D(const std::vector<std::vector<int>>& g);
              long long sum(int r1, int c1, int r2, int c2) const;

          private:

          };
        solution: |
          #include <vector>

          class Grid2D {
          public:
              explicit Grid2D(const std::vector<std::vector<int>>& g) {
                  int rows = (int)g.size(), cols = rows ? (int)g[0].size() : 0;
                  p_.assign(rows + 1, std::vector<long long>(cols + 1, 0));
                  for (int r = 0; r < rows; r++)
                      for (int c = 0; c < cols; c++) p_[r + 1][c + 1] = g[r][c] + p_[r][c + 1] + p_[r + 1][c] - p_[r][c];
              }
              long long sum(int r1, int c1, int r2, int c2) const {
                  return p_[r2 + 1][c2 + 1] - p_[r1][c2 + 1] - p_[r2 + 1][c1] + p_[r1][c1];
              }

          private:
              std::vector<std::vector<long long>> p_;
          };
        harness: |
          int main() {
              Grid2D g({{1, 2, 3}, {4, 5, 6}, {7, 8, 9}});
              CHECK_EQ("whole grid", g.sum(0, 0, 2, 2), 45LL);
              CHECK_EQ("bottom-right 2 x 2", g.sum(1, 1, 2, 2), 28LL);
              CHECK_EQ("one cell", g.sum(1, 0, 1, 0), 4LL);
              CHECK_EQ("middle row", g.sum(1, 0, 1, 2), 15LL);
              std::vector<std::vector<int>> big(500, std::vector<int>(500, 2));
              Grid2D b(big);
