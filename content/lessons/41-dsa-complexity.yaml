          long long max_window_sum(const std::vector<int>& v, int k) {

          }
        solution: |
          #include <algorithm>
          #include <vector>

          long long max_window_sum(const std::vector<int>& v, int k) {
              long long cur = 0;
              for (int i = 0; i < k; i++) cur += v[i];
              long long best = cur;
              for (std::size_t i = k; i < v.size(); i++) {
                  cur += v[i] - v[i - k];
                  best = std::max(best, cur);
              }
              return best;
          }
