id: dsa-complexity
title: Complexity and searching
lang: cpp
phase: "Data Structures and Algorithms"
summary: Big-O in practice. Trading memory for speed with hash sets, binary search and lower_bound, two pointers, prefix sums and sliding windows, with tests big enough that slow solutions time out.
steps:
  - title: Big-O in practice
    id: dsa-complexity-1
    text: |
      Two programs can give the same answer and still differ enormously: one finishes instantly, the other takes hours. The difference is usually not the language or the computer, but **how the amount of work grows** as the input gets bigger. **Big-O** notation describes exactly that growth, ignoring constant factors:

      | Complexity | n = 1,000 | n = 1,000,000 | Typical example |
      |---|---|---|---|
      | O(1) | 1 | 1 | array index, hash lookup |
      | O(log n) | 10 | 20 | binary search |
      | O(n) | 1,000 | 1,000,000 | one pass over the data |
      | O(n log n) | 10,000 | 20,000,000 | good sorting |
      | O(n²) | 1,000,000 | 1,000,000,000,000 | comparing every pair |

      A computer does roughly 10⁸ to 10⁹ simple operations per second. So at a million items, O(n²) takes **minutes to hours** (a trillion steps) while O(n log n) takes milliseconds. Interviews test this, and so does production traffic.

      ### Counting the work

      To find a function's complexity, ask how many times the innermost statement runs for an input of size n:

      - One loop over the data: n times, so O(n).
      - A loop inside a loop over the same data: about n × n / 2 times, so O(n²). The `/ 2` is a constant factor, and Big-O drops it.
      - A loop that halves the range each time: log₂ n times, so O(log n).

      Here the same question, "which numbers appear in both lists?", is answered both ways:

      ```cpp run
      #include <iostream>
      #include <unordered_set>
      #include <vector>

      long ops = 0;

      int common_slow(const std::vector<int>& a, const std::vector<int>& b) {
          int n = 0;
          for (int x : a) {
              for (int y : b) {
                  ops++;
                  if (x == y) { n++; break; }
              }
          }
          return n;
      }

      int common_fast(const std::vector<int>& a, const std::vector<int>& b) {
          std::unordered_set<int> in_b(b.begin(), b.end());   // O(n) to build
          int n = 0;
          for (int x : a) {
              ops++;
              if (in_b.contains(x)) n++;                      // O(1) average each
          }
          return n;
      }

      int main() {
          std::vector<int> a, b;
          for (int i = 0; i < 2000; i++) { a.push_back(i * 2); b.push_back(i * 3); }
          ops = 0;
          std::cout << common_slow(a, b) << " common, " << ops << " steps\n";
          ops = 0;
          std::cout << common_fast(a, b) << " common, " << ops << " steps\n";
      }
      ```

      ```output
      667 common, 3110889 steps
      667 common, 2000 steps
      ```

      With 2,000 numbers the nested loop already does over 3 million steps. With 200,000 it would do tens of billions, while the hash set version would do 200,000.

      ### Trading memory for time

      The most common fix for O(n²) is to **remember what you've seen** in a structure with fast lookup. A hash set uses extra memory, but checks membership in O(1) on average, so one pass over the data is enough.

      **Your turn:** write `bool has_duplicate(const std::vector<int>& v)` in O(n). The hidden test uses 200,000 numbers, so comparing every pair will run out of time.
    seed: |
      #include <vector>

      bool has_duplicate(const std::vector<int>& v) {
          for (std::size_t i = 0; i < v.size(); i++)
              for (std::size_t j = i + 1; j < v.size(); j++)
                  if (v[i] == v[j]) return true;
          return false;
      }
    solution: |
      #include <unordered_set>
      #include <vector>

      bool has_duplicate(const std::vector<int>& v) {
          std::unordered_set<int> seen;
          seen.reserve(v.size());
          for (int x : v) {
              if (!seen.insert(x).second) return true;
          }
          return false;
      }
    seedMayPass: true
    harness: |
      int main() {
          CHECK_EQ("small with duplicate", has_duplicate({3, 1, 4, 1, 5}), true);
          CHECK_EQ("small without", has_duplicate({3, 1, 4, 5}), false);
          CHECK_EQ("empty", has_duplicate({}), false);
          std::vector<int> big(200000);
          for (int i = 0; i < 200000; i++) big[i] = i * 7;
          CHECK_EQ("200,000 distinct values", has_duplicate(big), false);
          big.push_back(7 * 199999);
          CHECK_EQ("duplicate at the very end", has_duplicate(big), true);
      }
    hints:
      - "Keep a `std::unordered_set<int> seen;`."
      - "`seen.insert(x).second` is false when x was already there. That's your duplicate."
    more:
      - task: |
          Write `int first_repeat(const std::vector<int>& v)`, the first value that appears for the **second** time as you read left to right, or -1 if every value is different. It must be O(n): the hidden test has 200,000 values.
        seed: |
          #include <unordered_set>
          #include <vector>

          int first_repeat(const std::vector<int>& v) {

          }
        solution: |
          #include <unordered_set>
          #include <vector>

          int first_repeat(const std::vector<int>& v) {
              std::unordered_set<int> seen;
              for (int x : v) {
                  if (!seen.insert(x).second) return x;
              }
              return -1;
          }
        harness: |
          int main() {
              CHECK_EQ("3 comes back first", first_repeat({5, 3, 7, 3, 5}), 3);
              CHECK_EQ("no repeat", first_repeat({1, 2, 3}), -1);
              CHECK_EQ("empty", first_repeat({}), -1);
              std::vector<int> big(200000);
              for (int i = 0; i < 200000; i++) big[i] = i * 3;
              big.push_back(3 * 150000);
              CHECK_EQ("200,000 values", first_repeat(big), 450000);
          }
        hints:
          - "Remember what you've seen in a `std::unordered_set`; `insert(x).second` is false when `x` was already there."
      - task: |
          Write `int count_pairs_diff(const std::vector<int>& v, int k)`: how many **different pairs of values** `(x, x + k)` both appear in `v`, for `k >= 1`. Repeated values count once. It must be O(n) on average.
        seed: |
          #include <unordered_set>
          #include <vector>

          int count_pairs_diff(const std::vector<int>& v, int k) {

          }
        solution: |
          #include <unordered_set>
          #include <vector>

          int count_pairs_diff(const std::vector<int>& v, int k) {
              std::unordered_set<int> values(v.begin(), v.end());
              int n = 0;
              for (int x : values)
                  if (values.count(x + k)) n++;
              return n;
          }
        harness: |
          int main() {
              CHECK_EQ("1-3, 3-5", count_pairs_diff({1, 5, 3, 4, 2}, 2), 3);
              CHECK_EQ("repeats count once", count_pairs_diff({1, 1, 2, 2}, 1), 1);
              CHECK_EQ("none", count_pairs_diff({10, 20}, 3), 0);
              std::vector<int> big(200000);
              for (int i = 0; i < 200000; i++) big[i] = i * 2;
              CHECK_EQ("200,000 values", count_pairs_diff(big, 4), 199998);
          }
        hints:
          - "Put the values in a set, then for each distinct `x` check whether `x + k` is in it."

  - title: Binary search
    id: dsa-complexity-2
    text: |
      Looking for a word in a dictionary, you don't start at page 1. You open the middle, see whether your word comes before or after, and throw away the half it can't be in. After about 20 halvings, a million pages are down to one. That's **binary search**, and it only works on **sorted** data.

      ```
      lo = 0, hi = n - 1
      while lo <= hi:
          mid = lo + (hi - lo) / 2      (not (lo + hi) / 2: that can overflow!)
          if v[mid] == target: found
          if v[mid] < target: lo = mid + 1
          else: hi = mid - 1
      ```

      Here it is on a sorted list of words, printing each step so you can watch the range shrink:

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      int find_word(const std::vector<std::string>& words, const std::string& target) {
          int lo = 0, hi = (int)words.size() - 1;
          while (lo <= hi) {
              int mid = lo + (hi - lo) / 2;
              std::cout << "  look at [" << lo << ", " << hi << "] middle " << words[mid] << "\n";
              if (words[mid] == target) return mid;
              if (words[mid] < target) lo = mid + 1;    // target is to the right
              else hi = mid - 1;                        // target is to the left
          }
          return -1;
      }

      int main() {
          std::vector<std::string> w = {"ant", "bee", "cat", "dog", "eel", "fox", "gnu", "hen"};
          int fox = find_word(w, "fox");
          std::cout << "fox at " << fox << "\n";
          int cow = find_word(w, "cow");
          std::cout << "cow at " << cow << "\n";
      }
      ```

      ```output
        look at [0, 7] middle dog
        look at [4, 7] middle fox
      fox at 5
        look at [0, 7] middle dog
        look at [0, 2] middle bee
        look at [2, 2] middle cat
      cow at -1
      ```

      ### Why it's fast

      Each step halves the range: 8, 4, 2, 1. A million elements need at most 20 steps, a billion about 30. That's O(log n).

      ### The details that matter

      - `lo <= hi`, not `lo < hi`: when `lo == hi` there's still one element left to check.
      - `lo = mid + 1` and `hi = mid - 1`: `mid` was already checked, so exclude it. Writing `lo = mid` can loop forever when `hi == lo + 1`.
      - `lo + (hi - lo) / 2` instead of `(lo + hi) / 2`: for huge arrays, `lo + hi` can overflow an `int`. This exact bug sat in Java's standard library for about nine years.
      - When the loop ends without finding it, `lo > hi` and the target isn't there. Also note `lo` is where the target **would** be inserted, which is the idea behind `lower_bound` in the next step.

      Binary search is famously easy to get subtly wrong. Write it carefully once and understand every `+ 1` and `- 1`.

      **Your turn:** write `int find_index(const std::vector<int>& v, int target)` returning the index of `target` in the sorted vector `v`, or -1. Don't use the standard library's search functions.
    seed: |
      #include <vector>

      int find_index(const std::vector<int>& v, int target) {

      }
    solution: |
      #include <vector>

      int find_index(const std::vector<int>& v, int target) {
          int lo = 0, hi = static_cast<int>(v.size()) - 1;
          while (lo <= hi) {
              int mid = lo + (hi - lo) / 2;
              if (v[mid] == target) return mid;
              if (v[mid] < target) lo = mid + 1;
              else hi = mid - 1;
          }
          return -1;
      }
    forbid:
      - pattern: "lower_bound|upper_bound|binary_search|std::find|equal_range"
        message: Write the halving loop yourself on this step.
    harness: |
      int main() {
          std::vector<int> v = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};
          CHECK_EQ("middle", find_index(v, 16), 4);
          CHECK_EQ("first", find_index(v, 2), 0);
          CHECK_EQ("last", find_index(v, 91), 9);
          CHECK_EQ("missing", find_index(v, 17), -1);
          CHECK_EQ("below range", find_index(v, -5), -1);
          CHECK_EQ("empty", find_index({}, 3), -1);
          std::vector<int> big(1000000);
          for (int i = 0; i < 1000000; i++) big[i] = 2 * i;
          long long found = 0;
          for (int q = 0; q < 200000; q++) found += find_index(big, 5 * q) >= 0;
          CHECK_EQ("200,000 searches in a million elements", found, 100000LL);
      }
    hints:
      - "Track an inclusive range `lo..hi`, starting at 0 and size - 1."
      - "`int mid = lo + (hi - lo) / 2;` then move lo to `mid + 1` or hi to `mid - 1`."
      - "The loop runs while `lo <= hi`; if it ends, the target isn't there."
    more:
      - task: |
          Write `int first_at_least(const std::vector<int>& v, int target)` for a sorted `v`: the index of the first element `>= target`, or `v.size()` if there's none. This is `std::lower_bound`, written by hand: keep a half-open range `[lo, hi)` and halve it.
        seed: |
          #include <vector>

          int first_at_least(const std::vector<int>& v, int target) {

          }
        solution: |
          #include <vector>

          int first_at_least(const std::vector<int>& v, int target) {
              int lo = 0, hi = (int)v.size();
              while (lo < hi) {
                  int mid = lo + (hi - lo) / 2;
                  if (v[mid] < target) lo = mid + 1;
                  else hi = mid;
              }
              return lo;
          }
        forbid:
          - pattern: "lower_bound|upper_bound|binary_search|std::find|equal_range|partition_point"
            message: Write the halving loop yourself on this step.
        harness: |
          int main() {
              std::vector<int> v = {2, 4, 4, 4, 9};
              CHECK_EQ("first of the 4s", first_at_least(v, 4), 1);
              CHECK_EQ("between values", first_at_least(v, 5), 4);
              CHECK_EQ("below everything", first_at_least(v, 0), 0);
              CHECK_EQ("above everything", first_at_least(v, 10), 5);
              CHECK_EQ("empty", first_at_least({}, 3), 0);
              std::vector<int> big(1000000);
              for (int i = 0; i < 1000000; i++) big[i] = i / 3;
              long long total = 0;
              for (int q = 0; q < 200000; q++) total += first_at_least(big, q);
              CHECK_EQ("200,000 searches", total, 3LL * 199999 * 200000 / 2);
          }
        hints:
          - "If `v[mid] < target`, the answer is to the right of `mid`; otherwise `mid` itself might be the answer, so keep it: `hi = mid`."
      - task: |
          Binary search also works on **answers**. Write `long long isqrt(long long n)`, the largest `x` with `x * x <= n`, for `0 <= n <= 10^18`, by binary searching on `x`. Don't use `sqrt` (floating point is not exact at this size), and watch out for overflow in `x * x`.
        seed: |
          long long isqrt(long long n) {

          }
        solution: |
          long long isqrt(long long n) {
              long long lo = 0, hi = 1000000001;
              while (hi - lo > 1) {
                  long long mid = lo + (hi - lo) / 2;
                  if (mid <= n / mid) lo = mid;
                  else hi = mid;
              }
              return lo;
          }
        forbid:
          - pattern: "\\bsqrt\\s*\\(|\\bpow\\s*\\("
            message: Binary search on the answer instead of using floating point.
        harness: |
          int main() {
              CHECK_EQ("0", isqrt(0), 0LL);
              CHECK_EQ("1", isqrt(1), 1LL);
              CHECK_EQ("15", isqrt(15), 3LL);
              CHECK_EQ("16", isqrt(16), 4LL);
              CHECK_EQ("10^18", isqrt(1000000000000000000LL), 1000000000LL);
              CHECK_EQ("10^18 - 1", isqrt(999999999999999999LL), 999999999LL);
          }
        hints:
          - "The answer is between 0 and 10^9. Keep `lo` as a value that works and `hi` as one that's too big."
          - "`mid * mid <= n` can overflow; `mid <= n / mid` asks the same thing safely (for `mid >= 1`)."

  - title: lower_bound and upper_bound
    id: dsa-complexity-3
    text: |
      In real code, use the standard library's binary searches on sorted ranges. They're correct, fast, and answer more useful questions than "is it there?":

      - `std::lower_bound(b, e, x)`: first element **not less than** x (where x would be inserted)
      - `std::upper_bound(b, e, x)`: first element **greater than** x
      - `std::binary_search(b, e, x)`: just yes or no

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> ages = {12, 15, 15, 15, 18, 21, 30, 42};

          auto lo = std::lower_bound(ages.begin(), ages.end(), 15);
          auto hi = std::upper_bound(ages.begin(), ages.end(), 15);
          std::cout << "15 appears " << (hi - lo) << " times, first at index " << (lo - ages.begin()) << "\n";

          auto adults = ages.end() - std::lower_bound(ages.begin(), ages.end(), 18);
          std::cout << adults << " are 18 or older\n";

          auto pos = std::lower_bound(ages.begin(), ages.end(), 20);
          std::cout << "20 would go at index " << (pos - ages.begin()) << ", before " << *pos << "\n";
          std::cout << std::binary_search(ages.begin(), ages.end(), 21) << std::binary_search(ages.begin(), ages.end(), 22) << "\n";
      }
      ```

      ```output
      15 appears 3 times, first at index 1
      4 are 18 or older
      20 would go at index 5, before 21
      10
      ```

      ### Picture it

      For the value 15 in `12 15 15 15 18`:

      ```
       12  15  15  15  18
           ^           ^
      lower_bound   upper_bound
      ```

      The elements equal to x are exactly `[lower_bound, upper_bound)`. Subtracting the iterators counts them.

      ### Counting a range

      The number of values `v` with `lo <= v <= hi` is:

      ```
      upper_bound(hi) - lower_bound(lo)
      ```

      `lower_bound(lo)` is the first value that's at least `lo`; `upper_bound(hi)` is the first value past `hi`. Everything between them is in range. Two binary searches, O(log n), no matter how many values match. If `lo > hi`, the result would be negative, so return 0 in that case.

      **Your turn:** write `long count_in_range(const std::vector<int>& sorted, int lo, int hi)` counting values `v` with `lo <= v <= hi`.
    seed: |
      #include <algorithm>
      #include <vector>

      long count_in_range(const std::vector<int>& sorted, int lo, int hi) {

      }
    solution: |
      #include <algorithm>
      #include <vector>

      long count_in_range(const std::vector<int>& sorted, int lo, int hi) {
          if (lo > hi) return 0;
          auto first = std::lower_bound(sorted.begin(), sorted.end(), lo);
          auto last = std::upper_bound(sorted.begin(), sorted.end(), hi);
          return last - first;
      }
    require:
      - pattern: "lower_bound"
        message: "Use `std::lower_bound` and `std::upper_bound` so each query is O(log n)."
    harness: |
      int main() {
          std::vector<int> v = {1, 3, 3, 3, 5, 8, 8, 13};
          CHECK_EQ("3..8", count_in_range(v, 3, 8), 6L);
          CHECK_EQ("exactly 3", count_in_range(v, 3, 3), 3L);
          CHECK_EQ("between values", count_in_range(v, 9, 12), 0L);
          CHECK_EQ("everything", count_in_range(v, -100, 100), 8L);
          CHECK_EQ("lo > hi", count_in_range(v, 8, 3), 0L);
          std::vector<int> big(1000000);
          for (int i = 0; i < 1000000; i++) big[i] = i / 4;
          long total = 0;
          for (int q = 0; q < 100000; q++) total += count_in_range(big, q, q + 1);
          CHECK_EQ("100,000 range queries", total, 800000L);
      }
    hints:
      - "`auto first = std::lower_bound(sorted.begin(), sorted.end(), lo);`"
      - "`auto last = std::upper_bound(sorted.begin(), sorted.end(), hi);` and return `last - first`."
    more:
      - task: |
          Write `long count_equal(const std::vector<int>& sorted, int x)` in O(log n) with `std::equal_range`, which returns the pair `{lower_bound, upper_bound}`.
        seed: |
          #include <algorithm>
          #include <vector>

          long count_equal(const std::vector<int>& sorted, int x) {

          }
        solution: |
          #include <algorithm>
          #include <vector>

          long count_equal(const std::vector<int>& sorted, int x) {
              auto [lo, hi] = std::equal_range(sorted.begin(), sorted.end(), x);
              return hi - lo;
          }
        require:
          - pattern: "equal_range"
            message: "Use `std::equal_range`."
        harness: |
          int main() {
              std::vector<int> v = {1, 3, 3, 3, 5};
              CHECK_EQ("three 3s", count_equal(v, 3), 3L);
              CHECK_EQ("no 4", count_equal(v, 4), 0L);
              CHECK_EQ("one 5", count_equal(v, 5), 1L);
              std::vector<int> big(1000000);
              for (int i = 0; i < 1000000; i++) big[i] = i / 5;
              long total = 0;
              for (int q = 0; q < 200000; q++) total += count_equal(big, q);
              CHECK_EQ("200,000 queries", total, 1000000L);
          }
        hints:
          - "`auto [lo, hi] = std::equal_range(...)`, and the count is `hi - lo`."
      - task: |
          Write `std::vector<int> ranks(const std::vector<int>& sorted_scores, const std::vector<int>& queries)`. A score's rank is 1 plus the number of scores **strictly greater** than it, so equal scores share a rank. `sorted_scores` is in increasing order; use `std::upper_bound` for each query.
        seed: |
          #include <algorithm>
          #include <vector>

          std::vector<int> ranks(const std::vector<int>& sorted_scores, const std::vector<int>& queries) {

          }
        solution: |
          #include <algorithm>
          #include <vector>

          std::vector<int> ranks(const std::vector<int>& sorted_scores, const std::vector<int>& queries) {
              std::vector<int> out;
              for (int q : queries) {
                  auto it = std::upper_bound(sorted_scores.begin(), sorted_scores.end(), q);
                  out.push_back(1 + (int)(sorted_scores.end() - it));
              }
              return out;
          }
        require:
          - pattern: "upper_bound"
            message: "Use `std::upper_bound`."
        harness: |
          int main() {
              std::vector<int> s = {10, 20, 20, 40};
              CHECK_EQ("ranks", ranks(s, {40, 20, 10, 50, 5}), (std::vector<int>{1, 2, 4, 1, 5}));
              CHECK_EQ("no scores", ranks({}, {7}), (std::vector<int>{1}));
          }
        hints:
          - "`upper_bound` points at the first score greater than the query, so everything from there to the end is strictly greater."

  - title: Two pointers
    id: dsa-complexity-4
    text: |
      On sorted data, two indexes moving toward each other can often replace a nested loop. Each comparison lets you **rule out one element for good**, so the whole scan is O(n) instead of O(n²).

      Here's the idea on a different problem: is a string a palindrome (the same forwards and backwards), ignoring non-letters?

      ```cpp run
      #include <cctype>
      #include <iostream>
      #include <string>

      bool is_palindrome(const std::string& s) {
          int i = 0, j = (int)s.size() - 1;
          while (i < j) {
              if (!std::isalpha((unsigned char)s[i])) { i++; continue; }
              if (!std::isalpha((unsigned char)s[j])) { j--; continue; }
              if (std::tolower((unsigned char)s[i]) != std::tolower((unsigned char)s[j])) return false;
              i++;
              j--;
          }
          return true;
      }

      int main() {
          std::cout << is_palindrome("Never odd or even") << is_palindrome("A man, a plan, a canal: Panama")
                    << is_palindrome("two pointers") << "\n";
      }
      ```

      ```output
      110
      ```

      ### Two pointers for a target sum

      For "do two numbers in a sorted list add up to `target`?":

      - start with `i` at the smallest value and `j` at the largest,
      - if `v[i] + v[j]` is **too small**, the only way to grow the sum is to move `i` right (`j` is already the biggest),
      - if it's **too big**, move `j` left,
      - if it's equal, you've found a pair.

      Every step discards one value that can't be part of any answer, so the loop runs at most n times. Stop when `i` meets `j`, because the two positions must be different.

      Watch the types: `target` is a `long`, and two big `int`s can overflow when added. Add them as `long`: `(long)v[i] + v[j]`.

      **Your turn:** write `bool pair_sum(const std::vector<int>& sorted, long target)` that says whether two **different positions** hold values summing to `target`.
    seed: |
      #include <vector>

      bool pair_sum(const std::vector<int>& sorted, long target) {

      }
    solution: |
      #include <vector>

      bool pair_sum(const std::vector<int>& sorted, long target) {
          if (sorted.size() < 2) return false;
          std::size_t i = 0, j = sorted.size() - 1;
          while (i < j) {
              long s = static_cast<long>(sorted[i]) + sorted[j];
              if (s == target) return true;
              if (s < target) i++;
              else j--;
          }
          return false;
      }
    harness: |
      int main() {
          std::vector<int> v = {1, 4, 6, 9, 13};
          CHECK_EQ("4 + 9", pair_sum(v, 13), true);
