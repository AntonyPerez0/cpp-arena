              CHECK_EQ("zeros", count_subarrays({0, 0}, 0), 3);
              CHECK_EQ("none", count_subarrays({5}, 3), 0);
              std::vector<int> big(200000, 1);
              CHECK_EQ("200,000 ones, k = 199999", count_subarrays(big, 199999), 2);
          }
