              Queue q;
              CHECK_EQ("pop on empty", q.pop(), std::string(""));
              std::string big(70, 'q');
              const char* bp = big.data();
              q.push(std::move(big));
              q.push("second");
              CHECK_EQ("size", q.size(), 2);
              std::string first = q.pop();
              CHECK("moved in and out without a copy", first.data() == bp);
              CHECK_EQ("then second", q.pop(), std::string("second"));
              CHECK_EQ("empty", q.size(), 0);
          }
        hints:
          - "Move the front into a local before `pop_front()` destroys it: `std::string out = std::move(items_.front());`"
