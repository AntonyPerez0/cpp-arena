id: cpp-move
title: Move semantics
lang: cpp
phase: "C++: Modern and Advanced"
summary: Why C++ can pass big objects around cheaply. lvalues vs rvalues, std::move, move constructors and the rule of five.
steps:
  - title: Copies are expensive
    id: cpp-move-1
    text: |
      Copying a `std::vector` with a million elements copies a million elements. That's fine when you need two independent vectors. But very often the source is **about to disappear anyway**: it's a temporary, or a variable you'll never use again. Copying it and then throwing the original away is wasted work.

      A **move** avoids that. Instead of copying the elements, the new vector simply **takes over** the old one's heap buffer (a pointer, a size and a capacity: three small values), and the old vector is left empty. It's like handing someone your suitcase instead of packing an identical one for them.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      int main() {
          std::string a = "a long string that lives on the heap, not in the small buffer";
          std::string copy = a;                  // copies every character
          std::string moved = std::move(a);      // takes a's buffer

          std::cout << copy.size() << " " << moved.size() << "\n";
          std::cout << (copy == moved) << "\n";

          std::vector<std::string> shelf;
          std::string book = "Dune";
          shelf.push_back(book);                 // copy: we still use book below
          shelf.push_back(std::move(copy));      // move: done with copy
          std::cout << book << " | " << shelf.size() << "\n";
      }
      ```

      ```output
      61 61
      1
      Dune | 2
      ```

      ### lvalues and rvalues

      C++ decides between copying and moving by looking at the **kind of expression**:

      - An **lvalue** has a name and lives on after this line: `a`, `book`, `v[0]`. Stealing from it would surprise you later, so C++ **copies**.
      - An **rvalue** is a temporary about to die: `make_vector()`, `a + b`, a number like `42`. Nobody can use it again, so C++ **moves** from it automatically.

      ### What std::move really does

      `std::move(x)` doesn't move anything by itself. It's a **cast** that turns `x` into an rvalue, which means "I'm done with x, you may steal from it". The actual moving is done by whatever receives it: the vector's `push_back`, a constructor, an assignment.

      After a move, the source is in a **valid but unspecified** state. Don't read its value. You may assign it a new one or let it be destroyed.

      **Your turn:** move `big` into `store` instead of copying it.
    fill: |
      #include <iostream>
      #include <utility>
      #include <vector>

      int main() {
          std::vector<int> big(1000000, 7);
          std::vector<std::vector<int>> store;
          store.push_back([[std::move]](big));
          std::cout << store[0].size() << "\n";
      }
    hints:
      - "Wrap it: `std::move(big)`."
    tests:
      - expect: "1000000"

  - title: Write a move constructor
    id: cpp-move-2
    text: |
      How does a class become movable? It provides a **move constructor**: a constructor that takes an **rvalue reference**, written `T&&`. An `&&` parameter only binds to rvalues (temporaries and `std::move`d values), so this constructor runs exactly when stealing is allowed.

      The recipe for a class that owns a raw resource:

      1. Copy the **pointer** (and sizes) from `other` into the new object.
      2. Set `other`'s pointer to `nullptr` (and sizes to 0), so its destructor won't free what you just took.

      ```cpp run
      #include <cstring>
      #include <iostream>
      #include <utility>

      class Text {
      public:
          explicit Text(const char* s) : len_(std::strlen(s)), buf_(new char[len_ + 1]) {
              std::memcpy(buf_, s, len_ + 1);
          }
          ~Text() { delete[] buf_; }
          Text(const Text&) = delete;
          Text& operator=(const Text&) = delete;

          Text(Text&& other) noexcept : len_(other.len_), buf_(other.buf_) {
              other.buf_ = nullptr;          // other no longer owns the buffer
              other.len_ = 0;
              std::cout << "moved\n";
          }

          const char* c_str() const { return buf_ ? buf_ : "(empty)"; }

      private:
          std::size_t len_;
          char* buf_;
      };

      int main() {
          Text a("hello");
          Text b(std::move(a));              // runs the move constructor
          std::cout << b.c_str() << " / " << a.c_str() << "\n";
      }                                      // both destructors run; delete[] nullptr is harmless
      ```

      ```output
      moved
      hello / (empty)
      ```

      ### Why each part matters

      - Without step 2, both `a` and `b` would point at the same buffer, and both destructors would `delete[]` it: a double free.
      - `delete[] nullptr` does nothing, so the moved-from object's destructor is safe.
      - `noexcept` promises the move can't fail. `std::vector` checks this when it grows: it only moves elements into the new buffer if the move is `noexcept`, otherwise it falls back to copying. Moves that just shuffle pointers can't fail, so always mark them.
      - The member initializer list reads `other`'s members **before** the body resets them.

      **Your turn:** write the move constructor for `Buffer`.
    seed: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(const Buffer&) = delete;
          Buffer& operator=(const Buffer&) = delete;
          // move constructor here

          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    solution: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(const Buffer&) = delete;
          Buffer& operator=(const Buffer&) = delete;
          // move constructor here
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    harness: |
      #include <utility>
      int main() {
          Buffer a(64);
          const int* original = a.data();
          Buffer b(std::move(a));
          CHECK("b stole a's memory", b.data() == original);
          CHECK_EQ("b has the size", b.size(), 64);
          CHECK("a is empty", a.data() == nullptr);
          CHECK_EQ("a size is 0", a.size(), 0);
          std::vector<Buffer> v;
          v.push_back(Buffer(3));
          v.push_back(Buffer(5));
          CHECK_EQ("vector of move-only buffers", v[1].size(), 5);
      }
    hints:
      - "Signature: `Buffer(Buffer&& other) noexcept`."
      - "Copy the pointer and size from other, then set `other.data_ = nullptr;` and `other.size_ = 0;`."

  - title: Move assignment and the rule of five
    id: cpp-move-3
    text: |
      The move constructor makes a **new** object from a dying one. **Move assignment**, `a = std::move(b);`, is harder, because `a` already exists and may **already own something**. The recipe:

      1. If `this` is the same object as `other`, do nothing (self-assignment).
      2. Free what you currently own.
      3. Take `other`'s resources.
      4. Leave `other` empty.
      5. Return `*this`, so assignments can chain.

      ```cpp run
      #include <iostream>
      #include <utility>

      class Grid {
      public:
          explicit Grid(int n) : cells_(new int[n]()), n_(n) {}
          ~Grid() { delete[] cells_; }
          Grid(Grid&& o) noexcept : cells_(o.cells_), n_(o.n_) { o.cells_ = nullptr; o.n_ = 0; }

          Grid& operator=(Grid&& o) noexcept {
              if (this != &o) {
                  delete[] cells_;                 // release the old buffer
                  cells_ = o.cells_;
                  n_ = o.n_;
                  o.cells_ = nullptr;
                  o.n_ = 0;
              }
              return *this;
          }

          int size() const { return n_; }

      private:
          int* cells_;
          int n_;
      };

      int main() {
          Grid a(10), b(3);
          a = std::move(b);                        // a frees its 10 cells, takes b's 3
          std::cout << a.size() << " " << b.size() << "\n";
          Grid& alias = a;                         // another name for a
          a = std::move(alias);                    // self-move: guarded, nothing breaks
          std::cout << a.size() << "\n";
      }
      ```

      ```output
      3 0
      3
      ```

      ### What goes wrong without each step

      - No `delete[]` first: `a`'s original 10 cells leak.
      - No self-assignment check: moving an object into itself (here through the reference `alias`, which is easy to do by accident in real code) deletes its own buffer and then "takes" the pointer it just freed.
      - Not resetting `o`: two objects own one buffer, so it's freed twice.

      ### The rule of five, and the rule of zero

      The five special members are the destructor, copy constructor, copy assignment, move constructor and move assignment. If you write **any** of them, you're managing a resource by hand, so think about **all five**.

      Better still is the **rule of zero**: hold resources in members that already manage themselves, such as `std::vector<int>` or `std::unique_ptr<int[]>`. Then the compiler generates correct versions of all five, and you write none. Hand-written moves are worth learning so you understand what those types do for you.

      **Your turn:** add move assignment.
    seed: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          // move assignment here

          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    solution: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          // move assignment here
          Buffer& operator=(Buffer&& other) noexcept {
              if (this != &other) {
                  delete[] data_;
                  data_ = other.data_;
                  size_ = other.size_;
                  other.data_ = nullptr;
                  other.size_ = 0;
              }
              return *this;
          }
          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    harness: |
      #include <utility>
      int main() {
          Buffer a(10), b(20);
          const int* bp = b.data();
          a = std::move(b);
          CHECK("a now owns b's memory", a.data() == bp);
          CHECK_EQ("a size", a.size(), 20);
          CHECK("b emptied", b.data() == nullptr && b.size() == 0);
          Buffer& self = a;
          a = std::move(self);
          CHECK("self-move keeps the data", a.data() == bp && a.size() == 20);
          for (int i = 0; i < 2000; i++) {
              Buffer t(100000);
              a = std::move(t);
          }
          CHECK("2000 move-assignments without leaking", a.size() == 100000);
      }
    hints:
      - "Signature: `Buffer& operator=(Buffer&& other) noexcept`."
      - "Guard with `if (this != &other)`, free your old data with `delete[] data_;`, steal, reset other."
      - "End with `return *this;`."

  - title: Return by value is free
    id: cpp-move-4
    text: |
      A common worry is that returning a big object from a function is slow, so people return pointers or fill in "out" parameters instead. In modern C++ that worry is outdated.

      - Returning a **temporary** (`return Widget(...);`): C++17 **guarantees** the object is built directly in the caller's variable. No copy and no move happen at all. This is called **copy elision**.
      - Returning a **named local** (`Widget w; ...; return w;`): compilers almost always build it directly in place too (the "named return value optimization"). When they can't, the value is **moved**, not copied.

      ```cpp run
      #include <iostream>
      #include <string>

      struct Loud {
          std::string tag;
          explicit Loud(std::string t) : tag(t) { std::cout << "construct " << tag << "\n"; }
          Loud(const Loud& o) : tag(o.tag) { std::cout << "COPY " << tag << "\n"; }
      };

      Loud make_direct() {
          return Loud("direct");           // guaranteed: built right in the caller
      }

      Loud make_named() {
          Loud l("named");
          l.tag += "!";
          return l;                        // NRVO in practice
      }

      int main() {
          Loud a = make_direct();
          Loud b = make_named();
          std::cout << a.tag << " " << b.tag << "\n";
          Loud c = a;                      // a real copy, because we asked for one
      }
      ```

      ```output
      construct direct
      construct named
      direct named!
      COPY direct
      ```

      ### Reading the output

      - Each function constructs exactly once, and there's no `COPY` line for `a` or `b`: the objects were built directly in `main`'s variables.
      - The only copy is `Loud c = a;`, where copying is exactly what the code asks for, since `a` is still alive.

      ### What this means for your code

      - Return by value. It's the clearest way to write a function that makes something, and it's cheap.
      - Don't write `return std::move(local);`. It **prevents** copy elision, forcing a move where there would have been nothing at all. Compilers warn about it (`-Wpessimizing-move`).
      - Returning a temporary directly, like `return Tracker(id);`, is the case the language guarantees.

      **Your turn:** the `Tracker` struct counts copies. Write `Tracker make_tracker(int id)` so that creating one via your function performs **zero** copies. The test prints the copy count.
    seed: |
      struct Tracker {
          static inline int copies = 0;
          int id;
          explicit Tracker(int i) : id(i) {}
          Tracker(const Tracker& o) : id(o.id) { copies++; }
      };

      Tracker make_tracker(int id) {

      }
    solution: |
      struct Tracker {
          static inline int copies = 0;
          int id;
          explicit Tracker(int i) : id(i) {}
          Tracker(const Tracker& o) : id(o.id) { copies++; }
      };

      Tracker make_tracker(int id) {
          return Tracker(id);
      }
    harness: |
      int main() {
          Tracker t = make_tracker(7);
          CHECK_EQ("id", t.id, 7);
          CHECK_EQ("copies made", Tracker::copies, 0);
      }
    hints:
      - "Just `return Tracker(id);`. Guaranteed copy elision does the rest."

  - title: Moved-from objects
    id: cpp-move-5
    text: |
      After `b = std::move(a);`, what is `a`? For standard library types the rule is **valid but unspecified**:

      - It's still a real object. You **may** destroy it, assign it a new value, or call functions with no preconditions, such as `clear()`, `empty()` and `size()`.
      - You **must not** rely on its value. A moved-from `std::string` or `std::vector` is usually empty, but the standard doesn't promise it.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      int main() {
          std::vector<std::string> inbox = {"hi", "lunch?", "meeting at 3"};

          std::vector<std::string> archive = std::move(inbox);   // steal the whole buffer
          inbox.clear();                                          // now definitely empty
          std::cout << archive.size() << " archived, inbox " << inbox.size() << "\n";

          inbox.push_back("new mail");                            // reusing it is fine
          std::cout << inbox[0] << "\n";

          std::string draft = "unsent text";
          archive.push_back(std::move(draft));                    // move one element in
          draft = "fresh draft";                                  // assign a new value: fine
          std::cout << archive.back() << " / " << draft << "\n";
      }
      ```

      ```output
      3 archived, inbox 0
      new mail
      unsent text / fresh draft
      ```

      ### How it works

      - `std::vector<std::string> archive = std::move(inbox);` runs the vector's move constructor. It takes over the buffer, so none of the strings are copied, however many there are.
      - `inbox.clear()` turns "unspecified" into "definitely empty", which is what the next user of `inbox` expects.
      - After `std::move(draft)`, assigning a new value is always allowed, and from then on `draft` is fully usable again.

      ### The professional habit

      After moving from something, either **stop using it** or **reset it explicitly** (`clear()`, assignment). Code that reads a moved-from value may work today and break on another compiler.

      A function can also move out of a **reference parameter**, as your task does. That's powerful but surprising for the caller, so name such functions clearly (`take_all`, `release`, `drain`), so readers know the argument will be emptied.

      **Your turn:** write `std::vector<std::string> take_all(std::vector<std::string>& src)` that moves the whole contents out of `src` (no element copies) and leaves `src` definitely empty.
    seed: |
      #include <string>
      #include <utility>
      #include <vector>

      std::vector<std::string> take_all(std::vector<std::string>& src) {

      }
    solution: |
      #include <string>
      #include <utility>
      #include <vector>

      std::vector<std::string> take_all(std::vector<std::string>& src) {
          std::vector<std::string> out = std::move(src);
          src.clear();
          return out;
      }
    require:
      - pattern: "std::move\\s*\\(\\s*src\\s*\\)|std::exchange\\s*\\(\\s*src"
        message: "Move the whole vector with `std::move(src)` instead of copying element by element."
    harness: |
      int main() {
          std::vector<std::string> q = {"entry", "flash", "smoke"};
          const std::string* first = q.data();
          auto got = take_all(q);
          CHECK_EQ("got all three", got.size(), 3u);
          CHECK_EQ("order kept", got[1], std::string("flash"));
          CHECK("elements were moved, not copied", got.data() == first);
          CHECK("source is empty", q.empty());
          q.push_back("retake");
          CHECK_EQ("source is reusable", q.size(), 1u);
      }
    hints:
      - "`std::vector<std::string> out = std::move(src);` steals src's buffer in one go."
      - "Then `src.clear();` so the caller gets a known state, and `return out;`."

  - title: Sink parameters and emplace_back
    id: cpp-move-6
    text: |
      When a function or constructor is going to **keep** a string (store it in a member or a container), how should it take the parameter?

      - `const std::string&` avoids a copy on the way in, but then storing it must copy.
      - The **sink** pattern: take it **by value**, and `std::move` it into place. The caller decides whether that by-value parameter is filled by a copy (if they still need their string) or by a move (if they pass a temporary or use `std::move`).

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      class Contact {
      public:
          Contact(std::string name, std::string phone)
              : name_(std::move(name)), phone_(std::move(phone)) {}
          std::string line() const { return name_ + ": " + phone_; }

      private:
          std::string name_;
          std::string phone_;
      };

      int main() {
          std::vector<Contact> book;
          std::string mine = "Ada";
          book.emplace_back(mine, "555-0101");        // mine is copied once; we still have it
          book.emplace_back("Grace", "555-0199");     // built in place from the literals
          book.push_back(Contact("Linus", "555-0142"));  // builds a temporary, then moves it in
          for (const auto& c : book) std::cout << c.line() << "\n";
          std::cout << "still have " << mine << "\n";
      }
      ```

      ```output
      Ada: 555-0101
      Grace: 555-0199
      Linus: 555-0142
      still have Ada
      ```

      ### The cost for each kind of caller

      - Passing a variable you still need: exactly **one copy** (into the parameter), then a cheap move into the member. You can't do better, since two strings must exist.
      - Passing a temporary or `std::move(x)`: **zero copies**, just moves.

      ### emplace_back vs push_back

      - `push_back(obj)` takes a finished object and copies or moves it into the vector.
      - `emplace_back(args...)` passes `args` straight to the element's constructor, building it **inside** the vector's memory. No temporary object at all.

      Use `emplace_back` when you have constructor arguments rather than an existing object.

      ### Common mistake

      Taking a parameter by value and then **not** moving it: `name_(name)` copies again. The `std::move` in the initializer is what makes the sink pattern pay off.

      **Your turn:** give `Player` a sink constructor, and write `void recruit(std::vector<Player>& team, std::string name)` that adds a player using `emplace_back` and moves the name.
    seed: |
      #include <string>
      #include <utility>
      #include <vector>

      class Player {
      public:
          // sink constructor here

          const std::string& name() const { return name_; }

      private:
          std::string name_;
      };

      void recruit(std::vector<Player>& team, std::string name) {

      }
    solution: |
      #include <string>
      #include <utility>
      #include <vector>

      class Player {
      public:
          // sink constructor here
          explicit Player(std::string name) : name_(std::move(name)) {}
          const std::string& name() const { return name_; }

      private:
          std::string name_;
      };

      void recruit(std::vector<Player>& team, std::string name) {
          team.emplace_back(std::move(name));
      }
    require:
      - pattern: "emplace_back\\s*\\(\\s*std::move\\s*\\(\\s*name\\s*\\)\\s*\\)"
        message: "Add the player with `team.emplace_back(std::move(name));`"
      - pattern: "name_\\s*\\(\\s*std::move\\s*\\(\\s*name\\s*\\)\\s*\\)"
        message: "In the constructor, move the parameter into the member: `name_(std::move(name))`."
    harness: |
      int main() {
          std::vector<Player> team;
          recruit(team, "twistzz");
          std::string n = "elige";
          recruit(team, n);
          CHECK_EQ("team size", team.size(), 2u);
          CHECK_EQ("first player", team[0].name(), std::string("twistzz"));
          CHECK_EQ("second player", team[1].name(), std::string("elige"));
          CHECK_EQ("caller's copy is untouched", n, std::string("elige"));
          std::string longname(100, 'x');
          const char* buf = longname.data();
          Player p(std::move(longname));
          CHECK("constructor moves, not copies", p.name().data() == buf);
      }
    hints:
      - "Constructor: `explicit Player(std::string name) : name_(std::move(name)) {}`"
      - "recruit: `team.emplace_back(std::move(name));`"

  - title: "Challenge: a move-aware log"
    id: cpp-move-7
    text: |
      One last tool. `std::exchange(obj, new_value)` from `<utility>` sets `obj` to `new_value` and returns the **old** value, moving where it can. It's the tidy way to "take" something and leave a reset value behind, in one line.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      class Cart {
      public:
          void add(std::string item) {
              if (item.empty()) return;
              items_.push_back(std::move(item));      // sink: move into storage
          }
          std::vector<std::string> checkout() {
              return std::exchange(items_, {});       // hand over, leave an empty cart
          }
          int size() const { return (int)items_.size(); }

      private:
          std::vector<std::string> items_;
      };

      int main() {
          Cart cart;
          cart.add("milk");
          cart.add("");
          cart.add("bread");
          std::cout << cart.size() << " in cart\n";

          std::vector<std::string> bought = cart.checkout();
          std::cout << bought.size() << " bought, " << cart.size() << " left\n";

          int ticket = 7;
          int old = std::exchange(ticket, ticket + 1);
          std::cout << old << " then " << ticket << "\n";
      }
      ```

      ```output
      2 in cart
      2 bought, 0 left
      7 then 8
      ```

      ### How it works

      - `std::exchange(items_, {})` moves the current vector out as the return value and assigns an empty vector (`{}`) in its place. No strings are copied, and the object is left in a known, empty state, not a "valid but unspecified" one.
      - It works for any type: the `ticket` example is a handy "use the current number and advance it".
      - `add` combines everything from this module: a sink parameter, an early return for invalid input, and a move into the container.

      ### Putting it together for your Log

      Your `Log` is the same shape as `Cart`: a sink `add` that skips empty lines, a `size`, and a `flush` that hands over all the lines and leaves the log empty.

      **Your turn:** write class `Log`:

      - `void add(std::string line)`: a sink; ignore empty lines
      - `int size() const`
      - `std::vector<std::string> flush()`: hand over all lines (no copies) and leave the log empty
    seed: |
      #include <string>
      #include <utility>
      #include <vector>

      class Log {
      public:

      private:
          std::vector<std::string> lines_;
      };
    solution: |
      #include <string>
      #include <utility>
      #include <vector>

      class Log {
      public:
          void add(std::string line) {
              if (!line.empty()) lines_.push_back(std::move(line));
          }
          int size() const { return static_cast<int>(lines_.size()); }
          std::vector<std::string> flush() { return std::exchange(lines_, {}); }

      private:
          std::vector<std::string> lines_;
