  - title: Moved-from objects
    id: cpp-move-5
    text: |
      After `b = std::move(a);`, what is `a`? For standard library types the rule is **valid but unspecified**:

      - It's still a real object. You **may** destroy it, assign it a new value, or call functions with no preconditions, such as `clear()`, `empty()` and `size()`.
      - You **must not** rely on its value. A moved-from `std::string` or `std::vector` is usually empty, but the standard doesn't promise it.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      int main() {
          std::vector<std::string> inbox = {"hi", "lunch?", "meeting at 3"};

          std::vector<std::string> archive = std::move(inbox);   // steal the whole buffer
          inbox.clear();                                          // now definitely empty
          std::cout << archive.size() << " archived, inbox " << inbox.size() << "\n";

          inbox.push_back("new mail");                            // reusing it is fine
          std::cout << inbox[0] << "\n";

          std::string draft = "unsent text";
          archive.push_back(std::move(draft));                    // move one element in
          draft = "fresh draft";                                  // assign a new value: fine
          std::cout << archive.back() << " / " << draft << "\n";
      }
      ```

      ```output
      3 archived, inbox 0
      new mail
      unsent text / fresh draft
      ```

      ### How it works

      - `std::vector<std::string> archive = std::move(inbox);` runs the vector's move constructor. It takes over the buffer, so none of the strings are copied, however many there are.
      - `inbox.clear()` turns "unspecified" into "definitely empty", which is what the next user of `inbox` expects.
      - After `std::move(draft)`, assigning a new value is always allowed, and from then on `draft` is fully usable again.

      ### The professional habit

      After moving from something, either **stop using it** or **reset it explicitly** (`clear()`, assignment). Code that reads a moved-from value may work today and break on another compiler.

      A function can also move out of a **reference parameter**, as your task does. That's powerful but surprising for the caller, so name such functions clearly (`take_all`, `release`, `drain`), so readers know the argument will be emptied.

      **Your turn:** write `std::vector<std::string> take_all(std::vector<std::string>& src)` that moves the whole contents out of `src` (no element copies) and leaves `src` definitely empty.
    seed: |
      #include <string>
      #include <utility>
      #include <vector>

      std::vector<std::string> take_all(std::vector<std::string>& src) {

      }
    solution: |
      #include <string>
      #include <utility>
      #include <vector>

      std::vector<std::string> take_all(std::vector<std::string>& src) {
          std::vector<std::string> out = std::move(src);
          src.clear();
          return out;
      }
    require:
      - pattern: "std::move\\s*\\(\\s*src\\s*\\)|std::exchange\\s*\\(\\s*src"
        message: "Move the whole vector with `std::move(src)` instead of copying element by element."
    harness: |
      int main() {
          std::vector<std::string> q = {"entry", "flash", "smoke"};
          const std::string* first = q.data();
          auto got = take_all(q);
          CHECK_EQ("got all three", got.size(), 3u);
          CHECK_EQ("order kept", got[1], std::string("flash"));
          CHECK("elements were moved, not copied", got.data() == first);
          CHECK("source is empty", q.empty());
          q.push_back("retake");
          CHECK_EQ("source is reusable", q.size(), 1u);
      }
    hints:
      - "`std::vector<std::string> out = std::move(src);` steals src's buffer in one go."
      - "Then `src.clear();` so the caller gets a known state, and `return out;`."
    more:
