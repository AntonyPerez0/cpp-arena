        hints:
          - "Park `a` in `tmp`, move `b` into `a`, then move `tmp` into `b`."
          - "This is roughly what `std::swap` does for you."
        tests:
          - expect: "inferno mirage"
      - task: |
          Write `void append_all(std::vector<std::string>& dst, std::vector<std::string>& src)` that moves every string from `src` onto the end of `dst`, in order, and then clears `src`. The strings' characters must not be copied.
        seed: |
          #include <string>
          #include <utility>
          #include <vector>

          void append_all(std::vector<std::string>& dst, std::vector<std::string>& src) {

          }
        solution: |
          #include <string>
          #include <utility>
          #include <vector>

          void append_all(std::vector<std::string>& dst, std::vector<std::string>& src) {
              dst.reserve(dst.size() + src.size());
              for (auto& s : src) dst.push_back(std::move(s));
              src.clear();
          }
        require:
          - pattern: "std::move"
            message: "Move each string with `std::move`."
        harness: |
          int main() {
              std::vector<std::string> dst = {"first"};
              std::vector<std::string> src = {std::string(50, 'a'), std::string(60, 'b')};
              const char* a = src[0].data();
              const char* b = src[1].data();
              append_all(dst, src);
              CHECK_EQ("size", dst.size(), 3u);
              CHECK_EQ("order", dst[2], std::string(60, 'b'));
              CHECK("first string moved, not copied", dst[1].data() == a);
              CHECK("second string moved, not copied", dst[2].data() == b);
              CHECK("src is empty", src.empty());
          }
        hints:
          - "Loop over `src` by reference (`auto& s`) and `push_back(std::move(s))`."
          - "The moved-from strings are still in `src`, so finish with `src.clear()`."

  - title: Write a move constructor
    id: cpp-move-2
    text: |
      How does a class become movable? It provides a **move constructor**: a constructor that takes an **rvalue reference**, written `T&&`. An `&&` parameter only binds to rvalues (temporaries and `std::move`d values), so this constructor runs exactly when stealing is allowed.

      The recipe for a class that owns a raw resource:

      1. Copy the **pointer** (and sizes) from `other` into the new object.
      2. Set `other`'s pointer to `nullptr` (and sizes to 0), so its destructor won't free what you just took.

      ```cpp run
      #include <cstring>
      #include <iostream>
      #include <utility>

      class Text {
      public:
          explicit Text(const char* s) : len_(std::strlen(s)), buf_(new char[len_ + 1]) {
              std::memcpy(buf_, s, len_ + 1);
          }
          ~Text() { delete[] buf_; }
          Text(const Text&) = delete;
          Text& operator=(const Text&) = delete;

          Text(Text&& other) noexcept : len_(other.len_), buf_(other.buf_) {
              other.buf_ = nullptr;          // other no longer owns the buffer
              other.len_ = 0;
              std::cout << "moved\n";
          }

          const char* c_str() const { return buf_ ? buf_ : "(empty)"; }

      private:
          std::size_t len_;
          char* buf_;
      };

      int main() {
          Text a("hello");
          Text b(std::move(a));              // runs the move constructor
          std::cout << b.c_str() << " / " << a.c_str() << "\n";
      }                                      // both destructors run; delete[] nullptr is harmless
      ```

      ```output
      moved
      hello / (empty)
      ```

      ### Why each part matters

      - Without step 2, both `a` and `b` would point at the same buffer, and both destructors would `delete[]` it: a double free.
      - `delete[] nullptr` does nothing, so the moved-from object's destructor is safe.
      - `noexcept` promises the move can't fail. `std::vector` checks this when it grows: it only moves elements into the new buffer if the move is `noexcept`, otherwise it falls back to copying. Moves that just shuffle pointers can't fail, so always mark them.
      - The member initializer list reads `other`'s members **before** the body resets them.

      **Your turn:** write the move constructor for `Buffer`.
    seed: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(const Buffer&) = delete;
          Buffer& operator=(const Buffer&) = delete;
          // move constructor here

          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    solution: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(const Buffer&) = delete;
          Buffer& operator=(const Buffer&) = delete;
          // move constructor here
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    harness: |
      #include <utility>
      int main() {
          Buffer a(64);
          const int* original = a.data();
          Buffer b(std::move(a));
          CHECK("b stole a's memory", b.data() == original);
          CHECK_EQ("b has the size", b.size(), 64);
          CHECK("a is empty", a.data() == nullptr);
          CHECK_EQ("a size is 0", a.size(), 0);
          std::vector<Buffer> v;
          v.push_back(Buffer(3));
          v.push_back(Buffer(5));
          CHECK_EQ("vector of move-only buffers", v[1].size(), 5);
      }
    hints:
      - "Signature: `Buffer(Buffer&& other) noexcept`."
      - "Copy the pointer and size from other, then set `other.data_ = nullptr;` and `other.size_ = 0;`."
    more:
      - task: |
          `Match` has a string, a vector and an int. Write its move constructor: **move** the string and the vector (so their memory is taken over), copy the int, and set the source's `score_` to 0.
        seed: |
          #include <string>
          #include <utility>
          #include <vector>

          class Match {
          public:
              Match(std::string map, std::vector<int> rounds, int score)
                  : map_(std::move(map)), rounds_(std::move(rounds)), score_(score) {}
              // move constructor here

              const std::string& map() const { return map_; }
              const std::vector<int>& rounds() const { return rounds_; }
              int score() const { return score_; }

          private:
              std::string map_;
              std::vector<int> rounds_;
              int score_;
          };
        solution: |
          #include <string>
          #include <utility>
          #include <vector>

          class Match {
          public:
              Match(std::string map, std::vector<int> rounds, int score)
                  : map_(std::move(map)), rounds_(std::move(rounds)), score_(score) {}
              // move constructor here
              Match(Match&& o) noexcept
                  : map_(std::move(o.map_)), rounds_(std::move(o.rounds_)), score_(o.score_) {
                  o.score_ = 0;
              }
              const std::string& map() const { return map_; }
              const std::vector<int>& rounds() const { return rounds_; }
              int score() const { return score_; }

          private:
              std::string map_;
              std::vector<int> rounds_;
              int score_;
          };
        harness: |
          #include <utility>
          int main() {
              Match a(std::string(40, 'm'), {1, 0, 1, 1}, 16);
              const char* mp = a.map().data();
              const int* rp = a.rounds().data();
              Match b(std::move(a));
              CHECK("map string was moved", b.map().data() == mp);
              CHECK("rounds vector was moved", b.rounds().data() == rp);
              CHECK_EQ("score copied", b.score(), 16);
              CHECK_EQ("source score reset", a.score(), 0);
              CHECK("source rounds emptied", a.rounds().empty());
          }
        hints:
          - "In the member initializer list, `std::move` each member of `o`: `map_(std::move(o.map_))`."
          - "An `int` has nothing to steal, so copy it and then set `o.score_ = 0;` in the body."
      - task: |
          `FileHandle` wraps an operating-system file number: `-1` means "no file", and the destructor closes a real one (here it just counts in `closed`). Write the move constructor so the file is closed **exactly once**, by whichever object ends up owning it. Use `std::exchange`.
        seed: |
          #include <utility>

          class FileHandle {
          public:
              static inline int closed = 0;
              explicit FileHandle(int fd) : fd_(fd) {}
              ~FileHandle() {
                  if (fd_ != -1) closed++;
              }
              FileHandle(const FileHandle&) = delete;
              FileHandle& operator=(const FileHandle&) = delete;
              // move constructor here

              int fd() const { return fd_; }

          private:
              int fd_;
          };
        solution: |
          #include <utility>

          class FileHandle {
          public:
              static inline int closed = 0;
              explicit FileHandle(int fd) : fd_(fd) {}
              ~FileHandle() {
                  if (fd_ != -1) closed++;
              }
              FileHandle(const FileHandle&) = delete;
              FileHandle& operator=(const FileHandle&) = delete;
              // move constructor here
              FileHandle(FileHandle&& other) noexcept : fd_(std::exchange(other.fd_, -1)) {}
              int fd() const { return fd_; }

          private:
              int fd_;
          };
        require:
          - pattern: "std::exchange"
            message: "Take the number and leave `-1` behind with `std::exchange(other.fd_, -1)`."
        harness: |
          int main() {
              {
                  FileHandle a(3);
                  FileHandle b(std::move(a));
                  CHECK_EQ("b owns 3", b.fd(), 3);
                  CHECK_EQ("a has no file", a.fd(), -1);
              }
              CHECK_EQ("closed once, not twice", FileHandle::closed, 1);
              {
                  std::vector<FileHandle> v;
                  for (int i = 10; i < 20; i++) v.push_back(FileHandle(i));
              }
              CHECK_EQ("ten more, each closed once", FileHandle::closed, 11);
          }
        hints:
          - "`std::exchange(x, y)` sets `x` to `y` and returns the old value of `x`."
          - "`FileHandle(FileHandle&& other) noexcept : fd_(std::exchange(other.fd_, -1)) {}`"

  - title: Move assignment and the rule of five
    id: cpp-move-3
    text: |
      The move constructor makes a **new** object from a dying one. **Move assignment**, `a = std::move(b);`, is harder, because `a` already exists and may **already own something**. The recipe:

      1. If `this` is the same object as `other`, do nothing (self-assignment).
      2. Free what you currently own.
      3. Take `other`'s resources.
      4. Leave `other` empty.
      5. Return `*this`, so assignments can chain.

      ```cpp run
      #include <iostream>
      #include <utility>

      class Grid {
      public:
          explicit Grid(int n) : cells_(new int[n]()), n_(n) {}
          ~Grid() { delete[] cells_; }
          Grid(Grid&& o) noexcept : cells_(o.cells_), n_(o.n_) { o.cells_ = nullptr; o.n_ = 0; }

          Grid& operator=(Grid&& o) noexcept {
              if (this != &o) {
                  delete[] cells_;                 // release the old buffer
                  cells_ = o.cells_;
                  n_ = o.n_;
                  o.cells_ = nullptr;
                  o.n_ = 0;
              }
              return *this;
          }

          int size() const { return n_; }

      private:
          int* cells_;
          int n_;
      };

      int main() {
          Grid a(10), b(3);
          a = std::move(b);                        // a frees its 10 cells, takes b's 3
          std::cout << a.size() << " " << b.size() << "\n";
          Grid& alias = a;                         // another name for a
          a = std::move(alias);                    // self-move: guarded, nothing breaks
          std::cout << a.size() << "\n";
      }
      ```

      ```output
      3 0
      3
      ```

      ### What goes wrong without each step

      - No `delete[]` first: `a`'s original 10 cells leak.
      - No self-assignment check: moving an object into itself (here through the reference `alias`, which is easy to do by accident in real code) deletes its own buffer and then "takes" the pointer it just freed.
      - Not resetting `o`: two objects own one buffer, so it's freed twice.

      ### The rule of five, and the rule of zero

      The five special members are the destructor, copy constructor, copy assignment, move constructor and move assignment. If you write **any** of them, you're managing a resource by hand, so think about **all five**.

      Better still is the **rule of zero**: hold resources in members that already manage themselves, such as `std::vector<int>` or `std::unique_ptr<int[]>`. Then the compiler generates correct versions of all five, and you write none. Hand-written moves are worth learning so you understand what those types do for you.

      **Your turn:** add move assignment.
    seed: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          // move assignment here

          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    solution: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          // move assignment here
          Buffer& operator=(Buffer&& other) noexcept {
              if (this != &other) {
                  delete[] data_;
                  data_ = other.data_;
                  size_ = other.size_;
                  other.data_ = nullptr;
                  other.size_ = 0;
              }
              return *this;
          }
          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    harness: |
      #include <utility>
      int main() {
          Buffer a(10), b(20);
          const int* bp = b.data();
          a = std::move(b);
          CHECK("a now owns b's memory", a.data() == bp);
          CHECK_EQ("a size", a.size(), 20);
          CHECK("b emptied", b.data() == nullptr && b.size() == 0);
          Buffer& self = a;
          a = std::move(self);
          CHECK("self-move keeps the data", a.data() == bp && a.size() == 20);
          for (int i = 0; i < 2000; i++) {
              Buffer t(100000);
              a = std::move(t);
          }
          CHECK("2000 move-assignments without leaking", a.size() == 100000);
      }
    hints:
      - "Signature: `Buffer& operator=(Buffer&& other) noexcept`."
      - "Guard with `if (this != &other)`, free your old data with `delete[] data_;`, steal, reset other."
      - "End with `return *this;`."
