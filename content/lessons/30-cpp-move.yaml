  - title: "Challenge: a move-aware log"
    id: cpp-move-7
    text: |
      One last tool. `std::exchange(obj, new_value)` from `<utility>` sets `obj` to `new_value` and returns the **old** value, moving where it can. It's the tidy way to "take" something and leave a reset value behind, in one line.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>
      #include <vector>

      class Cart {
      public:
          void add(std::string item) {
              if (item.empty()) return;
              items_.push_back(std::move(item));      // sink: move into storage
          }
          std::vector<std::string> checkout() {
              return std::exchange(items_, {});       // hand over, leave an empty cart
          }
          int size() const { return (int)items_.size(); }

      private:
          std::vector<std::string> items_;
      };

      int main() {
          Cart cart;
          cart.add("milk");
          cart.add("");
          cart.add("bread");
          std::cout << cart.size() << " in cart\n";

          std::vector<std::string> bought = cart.checkout();
          std::cout << bought.size() << " bought, " << cart.size() << " left\n";

          int ticket = 7;
          int old = std::exchange(ticket, ticket + 1);
          std::cout << old << " then " << ticket << "\n";
      }
      ```

      ```output
      2 in cart
      2 bought, 0 left
      7 then 8
      ```

      ### How it works

      - `std::exchange(items_, {})` moves the current vector out as the return value and assigns an empty vector (`{}`) in its place. No strings are copied, and the object is left in a known, empty state, not a "valid but unspecified" one.
      - It works for any type: the `ticket` example is a handy "use the current number and advance it".
      - `add` combines everything from this module: a sink parameter, an early return for invalid input, and a move into the container.

      ### Putting it together for your Log

      Your `Log` is the same shape as `Cart`: a sink `add` that skips empty lines, a `size`, and a `flush` that hands over all the lines and leaves the log empty.

      **Your turn:** write class `Log`:

      - `void add(std::string line)`: a sink; ignore empty lines
      - `int size() const`
      - `std::vector<std::string> flush()`: hand over all lines (no copies) and leave the log empty
    seed: |
      #include <string>
      #include <utility>
      #include <vector>

      class Log {
      public:

      private:
          std::vector<std::string> lines_;
      };
    solution: |
      #include <string>
      #include <utility>
      #include <vector>

      class Log {
      public:
          void add(std::string line) {
              if (!line.empty()) lines_.push_back(std::move(line));
          }
          int size() const { return static_cast<int>(lines_.size()); }
          std::vector<std::string> flush() { return std::exchange(lines_, {}); }

      private:
          std::vector<std::string> lines_;
      };
    harness: |
      int main() {
          Log log;
          log.add("round 1: T win");
          log.add("");
          std::string big(64, 'k');
          const char* bigbuf = big.data();
          log.add(std::move(big));
          CHECK_EQ("empty line ignored", log.size(), 2);
          auto out = log.flush();
          CHECK_EQ("flush returns everything", out.size(), 2u);
          CHECK_EQ("first line", out[0], std::string("round 1: T win"));
          CHECK("long line was moved all the way in", out[1].data() == bigbuf);
          CHECK_EQ("log is empty after flush", log.size(), 0);
          log.add("round 2");
          CHECK_EQ("log is reusable", log.flush().size(), 1u);
      }
    hints:
      - "`add`: `if (!line.empty()) lines_.push_back(std::move(line));`"
      - "`flush`: `return std::exchange(lines_, {});`"
    more:
      - task: |
          Write class `Queue` of strings backed by a `std::deque<std::string>`: `void push(std::string s)` (a sink), `std::string pop()` that moves the **front** string out and removes it (`""` when empty), and `int size() const`.
        seed: |
          #include <deque>
          #include <string>
          #include <utility>

          class Queue {
          public:

          private:
              std::deque<std::string> items_;
          };
        solution: |
          #include <deque>
          #include <string>
          #include <utility>

          class Queue {
          public:
              void push(std::string s) { items_.push_back(std::move(s)); }
              std::string pop() {
                  if (items_.empty()) return "";
                  std::string out = std::move(items_.front());
                  items_.pop_front();
                  return out;
              }
              int size() const { return static_cast<int>(items_.size()); }

          private:
              std::deque<std::string> items_;
          };
        harness: |
