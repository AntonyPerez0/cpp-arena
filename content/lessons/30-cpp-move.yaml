        solution: |
          #include <utility>

          class FileHandle {
          public:
              static inline int closed = 0;
              explicit FileHandle(int fd) : fd_(fd) {}
              ~FileHandle() {
                  if (fd_ != -1) closed++;
              }
              FileHandle(FileHandle&& other) noexcept : fd_(std::exchange(other.fd_, -1)) {}
              // move assignment here
              FileHandle& operator=(FileHandle&& other) noexcept {
                  if (this != &other) {
                      if (fd_ != -1) closed++;
                      fd_ = std::exchange(other.fd_, -1);
                  }
                  return *this;
              }
              int fd() const { return fd_; }

          private:
              int fd_;
          };
        harness: |
          int main() {
              FileHandle a(3), b(4);
              a = std::move(b);
              CHECK_EQ("a's old file 3 was closed", FileHandle::closed, 1);
              CHECK_EQ("a owns 4", a.fd(), 4);
              CHECK_EQ("b has no file", b.fd(), -1);
              FileHandle& self = a;
              a = std::move(self);
              CHECK_EQ("self-move keeps the file", a.fd(), 4);
              CHECK_EQ("and closes nothing", FileHandle::closed, 1);
              FileHandle empty(-1);
              empty = std::move(a);
              CHECK_EQ("nothing to close when empty", FileHandle::closed, 1);
              CHECK_EQ("empty took 4", empty.fd(), 4);
          }
        hints:
          - "Guard with `if (this != &other)`, close your own file if `fd_ != -1`, then `fd_ = std::exchange(other.fd_, -1);`."
          - "End with `return *this;`."
      - task: |
          One assignment operator can serve for **both** copying and moving: take the parameter **by value**, then swap its contents with yours. The caller's copy or move builds the parameter, and the parameter's destructor frees your old data. Write `Buffer& operator=(Buffer other) noexcept` this way, using `std::swap` on the two members.
        seed: |
          #include <algorithm>
          #include <utility>

          class Buffer {
          public:
              explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
              ~Buffer() { delete[] data_; }
              Buffer(const Buffer& o) : data_(new int[o.size_]), size_(o.size_) {
                  std::copy(o.data_, o.data_ + size_, data_);
              }
              Buffer(Buffer&& o) noexcept : data_(std::exchange(o.data_, nullptr)), size_(std::exchange(o.size_, 0)) {}
              // one assignment operator here

              int size() const { return size_; }
              int* data() { return data_; }

          private:
              int* data_;
              int size_;
          };
        solution: |
          #include <algorithm>
          #include <utility>

          class Buffer {
          public:
              explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
              ~Buffer() { delete[] data_; }
              Buffer(const Buffer& o) : data_(new int[o.size_]), size_(o.size_) {
                  std::copy(o.data_, o.data_ + size_, data_);
              }
              Buffer(Buffer&& o) noexcept : data_(std::exchange(o.data_, nullptr)), size_(std::exchange(o.size_, 0)) {}
              // one assignment operator here
              Buffer& operator=(Buffer other) noexcept {
                  std::swap(data_, other.data_);
                  std::swap(size_, other.size_);
                  return *this;
              }
              int size() const { return size_; }
              int* data() { return data_; }

          private:
              int* data_;
              int size_;
          };
        require:
          - pattern: "operator\\s*=\\s*\\(\\s*Buffer\\s+\\w+\\s*\\)"
            message: "Take the parameter by value: `Buffer& operator=(Buffer other) noexcept`."
          - pattern: "swap"
            message: "Swap the members with `std::swap`."
        harness: |
          int main() {
              Buffer a(3), b(5);
              b.data()[0] = 42;
              a = b;
              CHECK_EQ("copy: size", a.size(), 5);
              CHECK_EQ("copy: contents", a.data()[0], 42);
              CHECK("copy: separate memory", a.data() != b.data());
              a.data()[0] = 7;
              CHECK_EQ("copy: b unchanged", b.data()[0], 42);
              int* bp = b.data();
              a = std::move(b);
              CHECK("move: memory taken over", a.data() == bp);
              CHECK_EQ("move: b emptied", b.size(), 0);
              for (int i = 0; i < 2000; i++) a = Buffer(50000);
              CHECK_EQ("2000 assignments without leaking", a.size(), 50000);
          }
        hints:
          - "The body is two `std::swap` calls and `return *this;`."
          - "Your old memory ends up in `other`, which frees it when the function returns."

  - title: Return by value is free
    id: cpp-move-4
    text: |
      A common worry is that returning a big object from a function is slow, so people return pointers or fill in "out" parameters instead. In modern C++ that worry is outdated.

      - Returning a **temporary** (`return Widget(...);`): C++17 **guarantees** the object is built directly in the caller's variable. No copy and no move happen at all. This is called **copy elision**.
      - Returning a **named local** (`Widget w; ...; return w;`): compilers almost always build it directly in place too (the "named return value optimization"). When they can't, the value is **moved**, not copied.

      ```cpp run
      #include <iostream>
      #include <string>

      struct Loud {
          std::string tag;
          explicit Loud(std::string t) : tag(t) { std::cout << "construct " << tag << "\n"; }
          Loud(const Loud& o) : tag(o.tag) { std::cout << "COPY " << tag << "\n"; }
      };

      Loud make_direct() {
          return Loud("direct");           // guaranteed: built right in the caller
      }

      Loud make_named() {
          Loud l("named");
          l.tag += "!";
          return l;                        // NRVO in practice
      }

      int main() {
          Loud a = make_direct();
          Loud b = make_named();
          std::cout << a.tag << " " << b.tag << "\n";
          Loud c = a;                      // a real copy, because we asked for one
      }
      ```

      ```output
      construct direct
      construct named
      direct named!
      COPY direct
      ```

      ### Reading the output

      - Each function constructs exactly once, and there's no `COPY` line for `a` or `b`: the objects were built directly in `main`'s variables.
      - The only copy is `Loud c = a;`, where copying is exactly what the code asks for, since `a` is still alive.

      ### What this means for your code

      - Return by value. It's the clearest way to write a function that makes something, and it's cheap.
      - Don't write `return std::move(local);`. It **prevents** copy elision, forcing a move where there would have been nothing at all. Compilers warn about it (`-Wpessimizing-move`).
      - Returning a temporary directly, like `return Tracker(id);`, is the case the language guarantees.

