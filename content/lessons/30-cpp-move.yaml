          public:
              static inline int closed = 0;
              explicit FileHandle(int fd) : fd_(fd) {}
              ~FileHandle() {
                  if (fd_ != -1) closed++;
              }
              FileHandle(FileHandle&& other) noexcept : fd_(std::exchange(other.fd_, -1)) {}
