          #include <utility>
          #include <vector>

          class Batcher {
          public:
              explicit Batcher(int n) : n_(n) {}
              void add(std::string line) {
                  current_.push_back(std::move(line));
                  if (static_cast<int>(current_.size()) == n_) done_.push_back(std::exchange(current_, {}));
              }
              int pending() const { return static_cast<int>(current_.size()); }
              std::vector<std::vector<std::string>> take_batches() { return std::exchange(done_, {}); }

          private:
              int n_;
              std::vector<std::string> current_;
              std::vector<std::vector<std::string>> done_;
          };
        harness: |
          int main() {
              Batcher b(2);
              std::string big(64, 'b');
              const char* bp = big.data();
              b.add(std::move(big));
              CHECK_EQ("one waiting", b.pending(), 1);
              CHECK_EQ("no batch yet", b.take_batches().size(), 0u);
              b.add("two");
              b.add("three");
              CHECK_EQ("one waiting again", b.pending(), 1);
              auto batches = b.take_batches();
              CHECK_EQ("one full batch", batches.size(), 1u);
              CHECK_EQ("batch contents", batches[0], (std::vector<std::string>{std::string(64, 'b'), "two"}));
              CHECK("line moved all the way through", batches[0][0].data() == bp);
              CHECK_EQ("batches were handed over", b.take_batches().size(), 0u);
              b.add("four");
              CHECK_EQ("next batch", b.take_batches()[0], (std::vector<std::string>{"three", "four"}));
          }
        hints:
          - "Keep a `std::vector<std::string>` for the batch being filled and a `std::vector<std::vector<std::string>>` for finished ones."
          - "When the current batch is full, `done_.push_back(std::exchange(current_, {}));` moves it over and starts a fresh one."
