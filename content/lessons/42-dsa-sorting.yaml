          #include <vector>

          void radix_sort(std::vector<unsigned>& v) {
              std::vector<unsigned> tmp(v.size());
              for (int shift = 0; shift < 32; shift += 8) {
                  std::size_t count[257] = {};
                  for (unsigned x : v) count[((x >> shift) & 255) + 1]++;
                  for (int b = 0; b < 256; b++) count[b + 1] += count[b];
                  for (unsigned x : v) tmp[count[(x >> shift) & 255]++] = x;
                  v.swap(tmp);
              }
          }
