            message: Implement the partition yourself on this step.
        harness: |
          #include <algorithm>
          int main() {
              std::vector<int> a = {5, 1, 5, 3, 5, 2, 5};
              quick_sort3(a, 0, 6);
              CHECK_EQ("small", a, (std::vector<int>{1, 2, 3, 5, 5, 5, 5}));
              std::vector<int> dup(200000);
              for (int i = 0; i < 200000; i++) dup[i] = (i * 13) % 3;
              quick_sort3(dup, 0, 199999);
              CHECK("200,000 values from 0 to 2", std::is_sorted(dup.begin(), dup.end()));
              std::vector<int> big(100000);
              unsigned x = 7;
              for (auto& y : big) {
                  x = x * 1664525u + 1013904223u;
                  y = (int)(x >> 4);
              }
