id: dsa-sorting
title: Sorting algorithms
lang: cpp
phase: "Data Structures and Algorithms"
summary: How sorting really works. Insertion sort, merge sort, quicksort partitioning, counting sort, stability with custom comparators, and quickselect.
steps:
  - title: Insertion sort
    id: dsa-sorting-1
    text: |
      You'll almost always sort with `std::sort` in real code. But knowing **how** sorting works teaches the core ideas of algorithm design (growing a solved part, divide and conquer, partitioning), and interviewers love asking about it. This module builds the classic algorithms yourself.

      **Insertion sort** grows a sorted prefix, like sorting cards in your hand: take the next card and slide it left past every larger card until its spot opens up.

      ```
      for i in 1..n-1:
          key = v[i]; j = i - 1
          while j >= 0 and v[j] > key: v[j + 1] = v[j]; j--
          v[j + 1] = key
      ```

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      void show(const std::vector<std::string>& v) {
          for (const auto& s : v) std::cout << s << " ";
          std::cout << "\n";
      }

      int main() {
          std::vector<std::string> hand = {"7", "3", "9", "2"};
          show(hand);
          for (std::size_t i = 1; i < hand.size(); i++) {
              std::string key = hand[i];
              int j = (int)i - 1;
              while (j >= 0 && std::stoi(hand[j]) > std::stoi(key)) {
                  hand[j + 1] = hand[j];          // shift the bigger card right
                  j--;
              }
              hand[j + 1] = key;                  // drop the key into the gap
              show(hand);
          }
      }
      ```

      ```output
      7 3 9 2 
      3 7 9 2 
      3 7 9 2 
      2 3 7 9 
      ```

      ### Reading the trace

      - Step 1: `3` is smaller than `7`, so `7` shifts right and `3` goes first.
      - Step 2: `9` is bigger than everything before it, so nothing moves.
      - Step 3: `2` is smaller than all three, so all three shift and `2` lands at the front.

      The part to the left of `i` is always sorted, and each step makes it one longer.

      ### Properties

      - O(n²) in general, but O(n) on data that's already **almost sorted**, because each element only shifts a little.
      - **Stable** (equal elements keep their order) and **in place** (no extra array).
      - Fastest of all for tiny arrays. Real `std::sort` implementations switch to it for ranges below about 16 elements.

      The number of shifts equals the number of pairs that are out of order (called **inversions**), which is why it measures how unsorted the input was.

      **Your turn:** implement `insertion_sort` and return how many element **shifts** it performed (a measure of how unsorted the input was).
    seed: |
      #include <vector>

      long insertion_sort(std::vector<int>& v) {

      }
    solution: |
      #include <vector>

      long insertion_sort(std::vector<int>& v) {
          long shifts = 0;
          for (std::size_t i = 1; i < v.size(); i++) {
              int key = v[i];
              std::size_t j = i;
              while (j > 0 && v[j - 1] > key) {
                  v[j] = v[j - 1];
                  j--;
                  shifts++;
              }
              v[j] = key;
          }
          return shifts;
      }
    forbid:
      - pattern: "std::sort|stable_sort|std::ranges::sort"
        message: Implement the algorithm yourself on this step.
    harness: |
      int main() {
          std::vector<int> a = {5, 2, 4, 6, 1, 3};
          long s = insertion_sort(a);
          CHECK_EQ("sorted", a, (std::vector<int>{1, 2, 3, 4, 5, 6}));
          CHECK_EQ("shifts", s, 9L);
          std::vector<int> sorted = {1, 2, 3, 4};
          CHECK_EQ("already sorted: no shifts", insertion_sort(sorted), 0L);
          std::vector<int> rev = {4, 3, 2, 1};
          CHECK_EQ("reversed: every pair shifts", insertion_sort(rev), 6L);
          std::vector<int> empty;
          CHECK_EQ("empty", insertion_sort(empty), 0L);
      }
    hints:
      - "Loop i from 1; save `key = v[i]` and slide j down while `v[j - 1] > key`."
      - "Using `j > 0` with `v[j - 1]` avoids a negative size_t index."
      - "Count one shift each time you copy `v[j] = v[j - 1]`."
    more:
      - task: |
          Write `int selection_sort(std::vector<int>& v)`: for each position, find the smallest remaining element and swap it into place. Return how many swaps it made, counting only swaps where the smallest element wasn't already in place.
        seed: |
          #include <utility>
          #include <vector>

          int selection_sort(std::vector<int>& v) {

          }
        solution: |
          #include <utility>
          #include <vector>

          int selection_sort(std::vector<int>& v) {
              int swaps = 0;
              for (std::size_t i = 0; i < v.size(); i++) {
                  std::size_t m = i;
                  for (std::size_t j = i + 1; j < v.size(); j++)
                      if (v[j] < v[m]) m = j;
                  if (m != i) {
                      std::swap(v[i], v[m]);
                      swaps++;
                  }
              }
              return swaps;
          }
        forbid:
          - pattern: "std::sort|stable_sort|std::ranges::sort|min_element"
            message: Implement the algorithm yourself on this step.
        harness: |
          int main() {
              std::vector<int> a = {3, 1, 2};
              CHECK_EQ("swaps", selection_sort(a), 2);
              CHECK_EQ("sorted", a, (std::vector<int>{1, 2, 3}));
              std::vector<int> s = {1, 2, 3, 4};
              CHECK_EQ("already sorted: no swaps", selection_sort(s), 0);
              std::vector<int> r = {4, 3, 2, 1};
              CHECK_EQ("reversed: 2 swaps", selection_sort(r), 2);
              CHECK_EQ("reversed sorted", r, (std::vector<int>{1, 2, 3, 4}));
          }
        hints:
          - "Selection sort does at most n - 1 swaps, far fewer than insertion sort's shifts, but it always does about n²/2 comparisons."
      - task: |
          Write `void sort_words(std::vector<std::string>& w)` with **insertion sort**, ordering by length first and alphabetically among words of the same length. Put the comparison in a small helper `bool before(const std::string& a, const std::string& b)`.
        seed: |
          #include <string>
          #include <vector>

          void sort_words(std::vector<std::string>& w) {

          }
        solution: |
          #include <string>
          #include <utility>
          #include <vector>

          static bool before(const std::string& a, const std::string& b) {
              if (a.size() != b.size()) return a.size() < b.size();
              return a < b;
          }

          void sort_words(std::vector<std::string>& w) {
              for (std::size_t i = 1; i < w.size(); i++) {
                  std::string key = std::move(w[i]);
                  std::size_t j = i;
                  while (j > 0 && before(key, w[j - 1])) {
                      w[j] = std::move(w[j - 1]);
                      j--;
                  }
                  w[j] = std::move(key);
              }
          }
        forbid:
          - pattern: "std::sort|stable_sort|std::ranges::sort"
            message: Implement insertion sort yourself on this step.
        harness: |
          int main() {
              std::vector<std::string> w = {"nuke", "ak", "awp", "dust2", "m4", "p90"};
              sort_words(w);
              CHECK_EQ("by length, then alphabetical", w, (std::vector<std::string>{"ak", "m4", "awp", "p90", "nuke", "dust2"}));
              std::vector<std::string> e;
              sort_words(e);
              CHECK("empty", e.empty());
          }
        hints:
          - "Take the key out, shift larger neighbours one place right while `before(key, w[j - 1])`, then drop the key in the gap."

  - title: Merge sort
    id: dsa-sorting-2
    text: |
      **Merge sort** is the classic **divide and conquer** algorithm:

      1. **Divide**: split the array into two halves.
      2. **Conquer**: sort each half, recursively. An array of 0 or 1 elements is already sorted: that's the base case.
      3. **Combine**: **merge** the two sorted halves into one sorted array.

      The merge is the heart of it. With two sorted lists, the smallest remaining element is always at the front of one of them, so you repeatedly take the smaller front:

      ```cpp run
      #include <iostream>
      #include <vector>

      std::vector<int> merge(const std::vector<int>& a, const std::vector<int>& b) {
          std::vector<int> out;
          out.reserve(a.size() + b.size());
          std::size_t i = 0, j = 0;
          while (i < a.size() && j < b.size()) {
              if (a[i] <= b[j]) out.push_back(a[i++]);    // <= keeps it stable
              else out.push_back(b[j++]);
          }
          while (i < a.size()) out.push_back(a[i++]);     // copy whatever is left
          while (j < b.size()) out.push_back(b[j++]);
          return out;
      }

      int main() {
          for (int x : merge({1, 4, 9, 10}, {2, 3, 9, 20, 21})) std::cout << x << " ";
          std::cout << "\n";
      }
      ```

      ```output
      1 2 3 4 9 9 10 20 21 
      ```

      ### Why O(n log n)

      Halving repeatedly gives about log₂ n **levels** of recursion. At each level, the merges together touch every element once, which is O(n) work per level. So the total is O(n log n), and unlike quicksort that's true **even in the worst case**.

      ```
      [5 2 8 1 9 3]
      [5 2 8] [1 9 3]          split
      [5] [2 8] [1] [9 3]      split
      ...                      single elements are sorted
      [2 5 8] [1 3 9]          merge
      [1 2 3 5 8 9]            merge
      ```

      ### Properties

      - Always O(n log n).
      - Stable, as long as the merge takes from the **left** half on ties (`<=`). That's why `std::stable_sort` is usually a merge sort.
      - Needs O(n) extra memory for merging.

      ### Your task

      Write a recursive helper that sorts `v[lo..hi)`: if the range has fewer than 2 elements, return; otherwise sort both halves and merge them through a temporary vector, copying the result back. Allocating one temporary buffer up front and reusing it is faster than making new vectors at every level.

      **Your turn:** implement `merge_sort(std::vector<int>& v)`. The test sorts 200,000 numbers, so an O(n²) sort won't finish in time.
    seed: |
      #include <vector>

      void merge_sort(std::vector<int>& v) {

      }
    solution: |
      #include <vector>

      static void sort_range(std::vector<int>& v, std::vector<int>& tmp, std::size_t lo, std::size_t hi) {
          if (hi - lo < 2) return;
          std::size_t mid = lo + (hi - lo) / 2;
          sort_range(v, tmp, lo, mid);
          sort_range(v, tmp, mid, hi);
          std::size_t i = lo, j = mid, k = lo;
          while (i < mid && j < hi) tmp[k++] = (v[j] < v[i]) ? v[j++] : v[i++];
          while (i < mid) tmp[k++] = v[i++];
          while (j < hi) tmp[k++] = v[j++];
          for (std::size_t x = lo; x < hi; x++) v[x] = tmp[x];
      }

      void merge_sort(std::vector<int>& v) {
          std::vector<int> tmp(v.size());
          sort_range(v, tmp, 0, v.size());
      }
    forbid:
      - pattern: "std::sort|stable_sort|std::ranges::sort|std::merge|inplace_merge"
        message: Implement merge sort yourself on this step.
    harness: |
      #include <algorithm>
      int main() {
          std::vector<int> a = {38, 27, 43, 3, 9, 82, 10};
          merge_sort(a);
          CHECK_EQ("small", a, (std::vector<int>{3, 9, 10, 27, 38, 43, 82}));
          std::vector<int> e;
          merge_sort(e);
          CHECK("empty", e.empty());
          std::vector<int> big(200000);
          unsigned x = 12345;
          for (auto& y : big) {
              x = x * 1103515245u + 12345u;
              y = static_cast<int>(x >> 8) % 1000000;
          }
          std::vector<int> expect = big;
          std::sort(expect.begin(), expect.end());
          merge_sort(big);
          CHECK("200,000 random numbers", big == expect);
      }
    hints:
      - "Write a recursive helper that sorts the half-open range `[lo, hi)` using one shared temporary buffer."
      - "Base case: fewer than 2 elements. Otherwise sort `[lo, mid)` and `[mid, hi)`, then merge into tmp and copy back."
      - "When merging, take from the right half only if it's strictly smaller; that keeps the sort stable."
    more:
      - task: |
          An **inversion** is a pair `i < j` with `v[i] > v[j]`. Write `long long count_inversions(std::vector<int> v)` in O(n log n) by merge sorting and counting while you merge: when an element from the **right** half is taken before the remaining left elements, it forms an inversion with each of them.
        seed: |
          #include <vector>

          long long count_inversions(std::vector<int> v) {

          }
        solution: |
          #include <vector>

          static long long sort_count(std::vector<int>& v, std::vector<int>& tmp, int lo, int hi) {
              if (hi - lo < 2) return 0;
              int mid = lo + (hi - lo) / 2;
              long long n = sort_count(v, tmp, lo, mid) + sort_count(v, tmp, mid, hi);
              int i = lo, j = mid, k = lo;
              while (i < mid && j < hi) {
                  if (v[j] < v[i]) {
                      n += mid - i;
                      tmp[k++] = v[j++];
                  } else {
                      tmp[k++] = v[i++];
                  }
              }
              while (i < mid) tmp[k++] = v[i++];
              while (j < hi) tmp[k++] = v[j++];
              for (int t = lo; t < hi; t++) v[t] = tmp[t];
              return n;
          }

          long long count_inversions(std::vector<int> v) {
              std::vector<int> tmp(v.size());
              return sort_count(v, tmp, 0, (int)v.size());
          }
        forbid:
          - pattern: "std::sort|stable_sort|std::ranges::sort|std::merge|inplace_merge"
            message: Count while you merge, in your own merge sort.
        harness: |
          int main() {
              CHECK_EQ("2 4 1 3 5", count_inversions({2, 4, 1, 3, 5}), 3LL);
              CHECK_EQ("sorted", count_inversions({1, 2, 3}), 0LL);
              CHECK_EQ("reversed", count_inversions({3, 2, 1}), 3LL);
              CHECK_EQ("equal values aren't inversions", count_inversions({2, 2, 2}), 0LL);
              std::vector<int> big(200000);
              for (int i = 0; i < 200000; i++) big[i] = 200000 - i;
              CHECK_EQ("200,000 reversed", count_inversions(big), 200000LL * 199999 / 2);
          }
        hints:
          - "When `v[j] < v[i]`, every element from `i` to the end of the left half is bigger than `v[j]`: that's `mid - i` inversions at once."
      - task: |
          Write `std::vector<int> merge_all(const std::vector<std::vector<int>>& lists)` that merges any number of sorted lists into one sorted list by **divide and conquer**: merge the left half of the lists, merge the right half, then merge those two results. Write the two-list merge yourself.
        seed: |
          #include <vector>

          std::vector<int> merge_all(const std::vector<std::vector<int>>& lists) {

          }
        solution: |
          #include <vector>

          static std::vector<int> merge2(const std::vector<int>& a, const std::vector<int>& b) {
              std::vector<int> out;
              out.reserve(a.size() + b.size());
              std::size_t i = 0, j = 0;
              while (i < a.size() && j < b.size()) out.push_back(a[i] <= b[j] ? a[i++] : b[j++]);
              while (i < a.size()) out.push_back(a[i++]);
              while (j < b.size()) out.push_back(b[j++]);
              return out;
          }

          static std::vector<int> merge_range(const std::vector<std::vector<int>>& lists, std::size_t lo, std::size_t hi) {
              if (lo >= hi) return {};
              if (hi - lo == 1) return lists[lo];
              std::size_t mid = lo + (hi - lo) / 2;
              return merge2(merge_range(lists, lo, mid), merge_range(lists, mid, hi));
          }

          std::vector<int> merge_all(const std::vector<std::vector<int>>& lists) {
              return merge_range(lists, 0, lists.size());
          }
        forbid:
          - pattern: "std::sort|stable_sort|std::ranges::sort|std::merge|inplace_merge"
            message: Merge the lists yourself.
        harness: |
          int main() {
              CHECK_EQ("three lists", merge_all({{1, 4, 7}, {2, 5}, {0, 3, 6, 9}}), (std::vector<int>{0, 1, 2, 3, 4, 5, 6, 7, 9}));
              CHECK_EQ("with empties", merge_all({{}, {5}, {}}), (std::vector<int>{5}));
              CHECK_EQ("no lists", merge_all({}), (std::vector<int>{}));
              std::vector<std::vector<int>> many(1000);
              for (int l = 0; l < 1000; l++)
                  for (int i = 0; i < 100; i++) many[l].push_back(i * 1000 + l);
              auto m = merge_all(many);
              CHECK("1000 lists of 100", m.size() == 100000 && m[0] == 0 && m[99999] == 99999);
          }
        hints:
          - "A helper that merges `lists[lo..hi)` calls itself on each half, then merges the two results with your two-list merge."
          - "Pairing lists up like this costs O(N log k) for N values in k lists; merging them one after another would be much slower."

  - title: Quicksort and partitioning
    id: dsa-sorting-3
    text: |
      **Quicksort** also divides and conquers, but does the hard work **before** recursing instead of after:

      1. Pick a **pivot** element.
      2. **Partition**: rearrange so everything smaller than the pivot comes before it and everything else after. The pivot is now in its **final** position.
      3. Recursively sort the part before the pivot and the part after it. No merge step is needed.

      The **Lomuto** partition, using the last element as the pivot:

      ```
      pivot = v[hi]; i = lo
      for j in lo..hi-1:
          if v[j] < pivot: swap(v[i], v[j]); i++
      swap(v[i], v[hi])     // pivot lands at its final position i
      return i
      ```

      Here's one partition step, printed, on letters:

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>

      int partition(std::string& s, int lo, int hi) {
          char pivot = s[hi];
          int i = lo;                              // s[lo..i) holds letters < pivot
          for (int j = lo; j < hi; j++) {
              if (s[j] < pivot) {
                  std::swap(s[i], s[j]);
                  i++;
              }
          }
          std::swap(s[i], s[hi]);
          return i;
      }

      int main() {
          std::string s = "qjxbmae";
          std::cout << s << "  pivot " << s.back() << "\n";
          int p = partition(s, 0, (int)s.size() - 1);
          std::cout << s << "  pivot now at " << p << "\n";
      }
      ```

      ```output
      qjxbmae  pivot e
      baeqmjx  pivot now at 2
      ```

      ### Reading the result

      After partitioning, `e` sits at index 2, with the smaller letters `b a` before it and the larger `q m j x` after it. Neither side is sorted yet, but `e` is exactly where it belongs in the final order. Quicksort now recurses on `[0, 1]` and `[3, 6]`.

      The invariant that makes Lomuto work: everything in `s[lo..i)` is smaller than the pivot. Each time a smaller element is found, it's swapped to position `i` and the boundary moves right.

      ### Properties

      - O(n log n) on average, in place, and very fast in practice thanks to good cache behavior.
      - O(n²) worst case with bad pivots, for example always taking the last element of already-sorted data: every partition then splits off just one element. That's why real implementations pick pivots carefully, and `std::sort` falls back to heapsort when recursion gets too deep ("introsort").
      - Not stable.

      ### Your task

      `partition` is the loop above on a `std::vector<int>`. `quick_sort(v, lo, hi)` returns when `lo >= hi` (zero or one element); otherwise it partitions, getting `p`, and recurses on `lo..p-1` and `p+1..hi`. Note that the pivot itself is **excluded** from both recursive calls, which guarantees progress.

      **Your turn:** write `int partition(std::vector<int>& v, int lo, int hi)` (inclusive range) and `void quick_sort(std::vector<int>& v, int lo, int hi)`.
    seed: |
      #include <utility>
      #include <vector>

      int partition(std::vector<int>& v, int lo, int hi) {

      }

      void quick_sort(std::vector<int>& v, int lo, int hi) {

      }
    solution: |
      #include <utility>
      #include <vector>

      int partition(std::vector<int>& v, int lo, int hi) {
          int pivot = v[hi];
          int i = lo;
          for (int j = lo; j < hi; j++) {
              if (v[j] < pivot) {
                  std::swap(v[i], v[j]);
                  i++;
              }
          }
          std::swap(v[i], v[hi]);
          return i;
      }

      void quick_sort(std::vector<int>& v, int lo, int hi) {
          if (lo >= hi) return;
          int p = partition(v, lo, hi);
          quick_sort(v, lo, p - 1);
          quick_sort(v, p + 1, hi);
      }
    forbid:
      - pattern: "std::sort|stable_sort|std::ranges::sort|std::partition|nth_element"
        message: Implement the partition yourself on this step.
    harness: |
      #include <algorithm>
      int main() {
          std::vector<int> p = {7, 2, 9, 4, 5};
          int at = partition(p, 0, 4);
          CHECK_EQ("pivot 5 lands at index 2", at, 2);
          CHECK("left side smaller", p[0] < 5 && p[1] < 5);
          CHECK("right side larger", p[3] > 5 && p[4] > 5);
          std::vector<int> a = {3, 6, 1, 8, 2, 9, 2};
          quick_sort(a, 0, 6);
          CHECK_EQ("sorted with duplicates", a, (std::vector<int>{1, 2, 2, 3, 6, 8, 9}));
          std::vector<int> big(100000);
          unsigned x = 99;
          for (auto& y : big) {
              x = x * 1664525u + 1013904223u;
              y = static_cast<int>(x >> 4);
          }
          std::vector<int> expect = big;
          std::sort(expect.begin(), expect.end());
          quick_sort(big, 0, static_cast<int>(big.size()) - 1);
          CHECK("100,000 random numbers", big == expect);
      }
    hints:
      - "partition: `int pivot = v[hi]; int i = lo;` then for each j < hi, swap smaller elements to position i."
      - "Finally swap the pivot into place: `std::swap(v[i], v[hi]); return i;`"
      - "quick_sort: stop when `lo >= hi`, else partition and recurse on both sides of p."
    more:
      - task: |
          Write `void sort_colors(std::vector<int>& v)` for values that are only 0, 1 or 2, in **one pass** with three pointers (the Dutch national flag): everything before `lo` is 0, everything after `hi` is 2, and `mid` scans the unknown part in between.
        seed: |
          #include <utility>
          #include <vector>

          void sort_colors(std::vector<int>& v) {

          }
        solution: |
          #include <utility>
          #include <vector>

          void sort_colors(std::vector<int>& v) {
              int lo = 0, mid = 0, hi = (int)v.size() - 1;
              while (mid <= hi) {
                  if (v[mid] == 0) std::swap(v[lo++], v[mid++]);
                  else if (v[mid] == 2) std::swap(v[mid], v[hi--]);
                  else mid++;
              }
          }
