          #include <vector>

          void quick_sort3(std::vector<int>& v, int lo, int hi) {

          }
        solution: |
          #include <utility>
          #include <vector>

          void quick_sort3(std::vector<int>& v, int lo, int hi) {
              if (lo >= hi) return;
              int pivot = v[lo + (hi - lo) / 2];
              int lt = lo, i = lo, gt = hi;
              while (i <= gt) {
                  if (v[i] < pivot) std::swap(v[lt++], v[i++]);
                  else if (v[i] > pivot) std::swap(v[i], v[gt--]);
                  else i++;
              }
              quick_sort3(v, lo, lt - 1);
              quick_sort3(v, gt + 1, hi);
          }
        forbid:
