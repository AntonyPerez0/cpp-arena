id: cpp-review
title: "Capstone: code review"
lang: cpp
phase: "Capstone: Code Review"
summary: Review realistic pull requests the way a senior engineer would. Each step hides several real bugs (off-by-one errors, dangling references, leaks on error paths, invalidated iterators, integer overflow and broken class design) for you to find and fix.
steps:
  - title: "Review: pagination"
    id: cpp-review-1
    text: |
      Reading other people's code critically is half of a professional developer's job. Before code is merged, a teammate **reviews** it: they read the change line by line, looking for bugs the author missed. The tests in these steps are the reviewer's edge cases. Your job is to find what breaks and fix it.

      ### How to review

      For every line, ask: **what inputs break this?** Try the edge cases in your head:

      - empty input, one element, exactly full
      - the first and the last item
      - zero, negative numbers, huge numbers
      - values right at a boundary (the spec's "1-based", "inclusive", "at most")

      Then compare the code with the **spec**, word by word. Many bugs are code that works, but does something slightly different from what was asked.

      ### A worked review

      This function should return the last `n` messages of a chat (fewer if there aren't that many). Here's the fixed version, with comments on what the review caught:

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      std::vector<std::string> last_n(const std::vector<std::string>& msgs, int n) {
          std::vector<std::string> out;
          if (n <= 0) return out;                          // caught: negative n
          // caught: msgs.size() - n underflowed (size_t is unsigned) when n > size
          std::size_t start = msgs.size() > (std::size_t)n ? msgs.size() - n : 0;
          for (std::size_t i = start; i < msgs.size(); i++) out.push_back(msgs[i]);
          return out;
      }

      int main() {
          std::vector<std::string> chat = {"hi", "gg", "wp", "rematch?"};
          for (int n : {2, 10, 0, -1}) {
              std::cout << n << ":";
              for (const auto& m : last_n(chat, n)) std::cout << " " << m;
              std::cout << "\n";
          }
          std::cout << "empty: " << last_n({}, 3).size() << "\n";
      }
      ```

      ```output
      2: wp rematch?
      10: hi gg wp rematch?
      0:
      -1:
      empty: 0
      ```

      The original version passed the author's one test (`n = 2`) and crashed on the other four.

      ### For this pull request

      Check the arithmetic for "page 1 is the first page" with a concrete example: with 10 items, 3 per page, page 1 is items 0 to 2 and page 4 holds just item 9. Then ask what happens for page 5, and for page 0.

      A teammate opened this pull request for the leaderboard API. The spec says:

      - `page` is **1-based** (page 1 is the first page)
      - pages past the end return an empty list, never crash
      - `page < 1` or `per_page < 1` returns an empty list

      The tests here are the reviewer's edge cases. **Your turn:** find and fix the bugs. There are three.
    seed: |
      #include <string>
      #include <vector>

      std::vector<std::string> page_of(const std::vector<std::string>& items, int page, int per_page) {
          std::vector<std::string> out;
          int start = page * per_page;
          int end = start + per_page;
          for (int i = start; i < end; i++) out.push_back(items[i]);
          return out;
      }
    solution: |
      #include <string>
      #include <vector>

      std::vector<std::string> page_of(const std::vector<std::string>& items, int page, int per_page) {
          std::vector<std::string> out;
          if (page < 1 || per_page < 1) return out;
          long long start = static_cast<long long>(page - 1) * per_page;
          long long end = start + per_page;
          long long size = static_cast<long long>(items.size());
          if (end > size) end = size;
          for (long long i = start; i < end; i++) out.push_back(items[i]);
          return out;
      }
    harness: |
      int main() {
          std::vector<std::string> v = {"a", "b", "c", "d", "e"};
          CHECK_EQ("page 1", page_of(v, 1, 2), (std::vector<std::string>{"a", "b"}));
          CHECK_EQ("page 2", page_of(v, 2, 2), (std::vector<std::string>{"c", "d"}));
          CHECK_EQ("last partial page", page_of(v, 3, 2), (std::vector<std::string>{"e"}));
          CHECK("past the end is empty", page_of(v, 4, 2).empty());
          CHECK("page 0 is invalid", page_of(v, 0, 2).empty());
          CHECK("per_page 0 is invalid", page_of(v, 1, 0).empty());
          CHECK("huge page number doesn't overflow", page_of(v, 2000000000, 2000000000).empty());
          CHECK("empty list", page_of({}, 1, 10).empty());
      }
    hints:
      - "Bug 1: page is 1-based, so page 1 must start at index 0: `(page - 1) * per_page`."
      - "Bug 2: the last page can be partial, and pages past the end are empty. Clamp `end` to `items.size()`."
      - "Bug 3: invalid arguments. Reject `page < 1 || per_page < 1` up front. And `page * per_page` can overflow an int: compute it in `long long`."

  - title: "Review: dangling references"
    id: cpp-review-2
    text: |
      `std::string_view` and references are cheap **views** of data owned by someone else. The classic review catch is a view that **outlives** what it points at. It compiles cleanly, often seems to work in testing (the freed memory still holds the old bytes for a while), and then prints garbage in production.

      Red flags to look for:

      - returning a `string_view` or a reference to a **local** or a **temporary**
      - storing a `string_view` member initialized from a temporary `std::string`
      - keeping a reference into a container that later grows

      ### Who owns the characters?

      For every view, find the `std::string` (or literal) that owns its characters, and check that the owner lives **at least as long** as the view.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <string_view>
      #include <utility>

      std::string_view first_word(std::string_view s) {      // fine: points into the caller's text
          return s.substr(0, s.find(' '));
      }

      struct Label {
          std::string text;                                   // owns its characters
          explicit Label(std::string t) : text(std::move(t)) {}
      };

      Label make_label(int n) {
          return Label("item " + std::to_string(n));          // the temporary is moved into the member
      }

      int main() {
          std::string line = "hello big world";
          std::cout << first_word(line) << "\n";              // line outlives the view: safe

          Label l = make_label(7);
          std::cout << l.text << "\n";
      }
      ```

      ```output
      hello
      item 7
      ```

      - `first_word` is safe because it returns a view into the **caller's** string, which is still alive when the view is used.
      - `Label` stores a `std::string`, not a view. The temporary `"item " + ...` would die at the end of the statement, so a `string_view` member would dangle; an owning member takes the characters with it.

      The rule of thumb: views for **parameters**, owning strings for **members** and for **return values built inside the function**.

      **Your turn:** this pull request adds a greeting helper and a `Tag` type. Both have lifetime bugs. Fix them by making each owner hold its own `std::string`. (The checks inspect the types too, since dangling-view bugs can seem to work by luck.)
    seed: |
      #include <string>
      #include <string_view>

      std::string_view greeting(const std::string& name) {
          std::string text = "gl hf, " + name;
          return text;
      }

      class Tag {
      public:
          explicit Tag(const std::string& label) : label_(label) {}
          std::string_view label() const { return label_; }

      private:
          std::string_view label_;
      };

      Tag make_tag(int round) {
          return Tag("round " + std::to_string(round));
      }
    solution: |
      #include <string>
      #include <string_view>

      std::string greeting(const std::string& name) {
          std::string text = "gl hf, " + name;
          return text;
      }

      class Tag {
      public:
          explicit Tag(const std::string& label) : label_(label) {}
          std::string_view label() const { return label_; }

      private:
          std::string label_;
      };

      Tag make_tag(int round) {
          return Tag("round " + std::to_string(round));
      }
    harness: |
      #include <type_traits>
      int main() {
          static_assert(std::is_same_v<decltype(greeting(std::string())), std::string>, "greeting must return an owning std::string");
          CHECK_EQ("greeting", std::string(greeting("ropz")), std::string("gl hf, ropz"));
          Tag t = make_tag(16);
          std::string filler(100, 'x');
          CHECK_EQ("tag outlives the temporary", std::string(t.label()), std::string("round 16"));
          CHECK("Tag owns its text", sizeof(Tag) == sizeof(std::string));
      }
    hints:
      - "`greeting` returns a view of the local `text`, which is destroyed at the closing brace. Return `std::string` instead."
      - "`Tag` stores a view of the temporary string built in `make_tag`. Make the member a `std::string`; the accessor can still return a view of it."

  - title: "Review: leaks on the error path"
    id: cpp-review-3
    text: |
      In C-style code, every early `return` is a chance to leak. Reviewers trace **each exit path** and check that everything acquired before it gets released.

      ### Tracing exit paths

      Go through the function top to bottom and keep a list of what's currently held. At every `return`, check the list:

      ```
      values = xmalloc(...)      held: values
        return -1 (bad number)   still held: values        <- must free here
      unique = xmalloc(...)      held: values, unique
        return -1 (n == 0)       still held: both          <- must free here
      xfree(unique); xfree(values)
      return n                   held: nothing             ok
      ```

      ### The single cleanup label

      C code commonly handles this with one exit point: every error sets a result and jumps to a label that frees everything. Freeing a null pointer does nothing, so it's safe even when some allocations never happened.

      ```cpp run
      #include <cstdio>
      #include <cstdlib>

      int live = 0;
      void* xmalloc(std::size_t n) { void* p = std::malloc(n); if (p) live++; return p; }
      void xfree(void* p) { if (p) live--; std::free(p); }

      int sum_positive(const int* in, int n) {
          int result = -1;
          int* a = nullptr;
          int* b = static_cast<int*>(xmalloc(sizeof(int) * n));
          if (!b) goto cleanup;
          a = static_cast<int*>(xmalloc(sizeof(int) * n));
          if (!a) goto cleanup;
          result = 0;
          for (int i = 0; i < n; i++) {
              if (in[i] < 0) { result = -1; goto cleanup; }   // error path: no leak
              a[i] = b[i] = in[i];
              result += a[i];
          }
      cleanup:
          xfree(a);
          xfree(b);
          return result;
      }

      int main() {
          int good[] = {1, 2, 3}, bad[] = {1, -2, 3};
          int a = sum_positive(good, 3);
          int b = sum_positive(bad, 3);
          std::printf("%d %d, live allocations: %d\n", a, b, live);
      }
      ```

      ```output
      6 -1, live allocations: 0
      ```

      Every path, success or failure, ends at `cleanup`, so both blocks are always released. (In real C++ you'd use `std::vector` or `std::unique_ptr` and let destructors do this; this pull request stays in C style, which is common in code that talks to C libraries.)

      **Your turn:** the happy path is fine, but some error paths leak. Make every path leave `live_allocations` where it started. There are two leaks. Staying in this C style is fine; a common tidy fix is a single cleanup label (`goto cleanup;`) or freeing before each return.
    seed: |
      #include <cstdlib>
      #include <cstring>

      static int live_allocations = 0;
      void* xmalloc(std::size_t n) { void* p = std::malloc(n > 0 ? n : 1); if (p) live_allocations++; return p; }
      void xfree(void* p) { if (p) live_allocations--; std::free(p); }

      /* Parses up to `count` space-separated ints from `text`, keeps the first
         occurrence of each, and returns how many unique values there were.
         Returns -1 if the text doesn't contain `count` valid numbers. */
      int unique_count(const char* text, int count) {
          int* values = static_cast<int*>(xmalloc(sizeof(int) * count));
          const char* p = text;
          for (int i = 0; i < count; i++) {
              char* end;
              long v = std::strtol(p, &end, 10);
              if (end == p) return -1;
              values[i] = static_cast<int>(v);
              p = end;
          }
          int* unique = static_cast<int*>(xmalloc(sizeof(int) * count));
          int n = 0;
          for (int i = 0; i < count; i++) {
              bool seen = false;
              for (int j = 0; j < n; j++) seen = seen || unique[j] == values[i];
              if (!seen) unique[n++] = values[i];
          }
          if (n == 0) return -1;
          xfree(unique);
          xfree(values);
          return n;
      }
    solution: |
      #include <cstdlib>
      #include <cstring>

      static int live_allocations = 0;
      void* xmalloc(std::size_t n) { void* p = std::malloc(n > 0 ? n : 1); if (p) live_allocations++; return p; }
      void xfree(void* p) { if (p) live_allocations--; std::free(p); }

      /* Parses up to `count` space-separated ints from `text`, keeps the first
         occurrence of each, and returns how many unique values there were.
         Returns -1 if the text doesn't contain `count` valid numbers. */
      int unique_count(const char* text, int count) {
          int result = -1;
          int* unique = nullptr;
          int* values = static_cast<int*>(xmalloc(sizeof(int) * count));
          const char* p = text;
          for (int i = 0; i < count; i++) {
              char* end;
              long v = std::strtol(p, &end, 10);
              if (end == p) goto cleanup;
              values[i] = static_cast<int>(v);
              p = end;
          }
          unique = static_cast<int*>(xmalloc(sizeof(int) * count));
          {
              int n = 0;
              for (int i = 0; i < count; i++) {
                  bool seen = false;
                  for (int j = 0; j < n; j++) seen = seen || unique[j] == values[i];
                  if (!seen) unique[n++] = values[i];
              }
              if (n > 0) result = n;
          }
      cleanup:
          xfree(unique);
          xfree(values);
          return result;
      }
    harness: |
      int main() {
          CHECK_EQ("happy path", unique_count("3 1 3 2 1", 5), 3);
          CHECK_EQ("no leak on success", live_allocations, 0);
          CHECK_EQ("bad number", unique_count("4 x 6", 3), -1);
          CHECK_EQ("no leak when parsing fails", live_allocations, 0);
          CHECK_EQ("too few numbers", unique_count("1 2", 3), -1);
          CHECK_EQ("still no leak", live_allocations, 0);
          CHECK_EQ("zero numbers", unique_count("", 0), -1);
          CHECK_EQ("no leak on the empty path", live_allocations, 0);
      }
    hints:
      - "Leak 1: when strtol fails, `return -1` skips freeing `values`."
      - "Leak 2: when n == 0, the early return skips freeing both buffers."
      - "One tidy fix: keep a `result` variable, `goto cleanup;` on errors, and free both pointers (xfree(nullptr) is safe) at a single `cleanup:` label."

  - title: "Review: modifying while iterating"
    id: cpp-review-4
    text: |
      Another classic: changing a container **while looping over it**.

      - erasing index `i` shifts the next element into position `i`, and then `i++` **skips** it
      - `push_back` during a range-for can reallocate, invalidating the loop's hidden iterators
      - a reference taken before a `push_back` can dangle afterwards

      ### Spotting the skip

      Run the erase loop by hand on an input with two matches **next to each other**, like `{a, X, X, b}` where X should be removed:

      ```
      i = 1: erase X  -> {a, X, b}   then i++ -> i = 2
      i = 2: b                       the second X, now at index 1, was never checked
      ```

      The safe patterns: only increment when nothing was erased, use `std::erase_if`, or build a new vector of the items you keep.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> queue = {"ok", "spam", "spam", "ok", "spam"};
          for (std::size_t i = 0; i < queue.size(); ) {
              if (queue[i] == "spam") queue.erase(queue.begin() + i);   // don't advance
              else i++;                                                  // advance only when keeping
          }
          for (const auto& m : queue) std::cout << m << " ";
          std::cout << "(" << queue.size() << ")\n";

          std::vector<int> v = {1, 2, 3};
          int first = v.front();                // a copy, not a reference: safe after growth
          for (int i = 0; i < 100; i++) v.push_back(i);
          std::cout << first << "\n";
      }
      ```

      ```output
      ok ok (2)
      1
      ```

      ### Adding while looping

      A range-for over `roster` that calls `roster.push_back` is undefined behavior: the loop's hidden iterators point into the old buffer after a reallocation. If you need to add a number of items, compute the count first, then add them in a separate plain loop that doesn't iterate over the container.

      ### The dangling reference

      `const std::string& captain = roster.front();` refers to an element **inside** the vector. After `push_back` reallocates, it refers to freed memory. Copy the value (`std::string captain = ...`) when you need it to survive changes to the container.

      **Your turn:** this pull request enforces bans and fills the roster back up with substitutes. Fix it so that every banned player is removed (including when two are adjacent), one substitute is added per removed player, and `captain` returns the right name. There are three bugs.
    seed: |
      #include <set>
      #include <string>
      #include <vector>

      // Removes banned players, then appends one substitute per removal.
      void apply_bans(std::vector<std::string>& roster, const std::set<std::string>& banned, const std::string& sub) {
          int removed = 0;
          for (std::size_t i = 0; i < roster.size(); i++) {
              if (banned.count(roster[i])) {
                  roster.erase(roster.begin() + i);
                  removed++;
              }
          }
          for (const auto& p : roster) {
              if (removed > 0 && p != sub) {
                  roster.push_back(sub);
                  removed--;
              }
          }
      }

      // Returns the first player's name after adding a new player at the end.
      std::string captain_after_signing(std::vector<std::string>& roster, const std::string& signing) {
          const std::string& captain = roster.front();
          roster.push_back(signing);
          return captain;
      }
    solution: |
      #include <set>
      #include <string>
      #include <vector>

      // Removes banned players, then appends one substitute per removal.
      void apply_bans(std::vector<std::string>& roster, const std::set<std::string>& banned, const std::string& sub) {
          std::size_t removed = std::erase_if(roster, [&](const std::string& p) { return banned.count(p) > 0; });
          for (std::size_t i = 0; i < removed; i++) roster.push_back(sub);
      }

      // Returns the first player's name after adding a new player at the end.
      std::string captain_after_signing(std::vector<std::string>& roster, const std::string& signing) {
          std::string captain = roster.front();
          roster.push_back(signing);
          return captain;
      }
    forbid:
      - pattern: "const\\s+std::string\\s*&\\s*captain\\s*="
        message: "`captain` is a reference into the vector, and push_back can reallocate and leave it dangling. Copy the name first."
    harness: |
      int main() {
          std::vector<std::string> r = {"a", "cheat1", "cheat2", "b", "cheat3"};
          apply_bans(r, {"cheat1", "cheat2", "cheat3"}, "sub");
          CHECK_EQ("adjacent bans both removed, one sub each", r, (std::vector<std::string>{"a", "b", "sub", "sub", "sub"}));
          std::vector<std::string> clean = {"x", "y"};
          apply_bans(clean, {"z"}, "sub");
          CHECK_EQ("nothing banned", clean, (std::vector<std::string>{"x", "y"}));
          std::vector<std::string> all = {"c1", "c2"};
          apply_bans(all, {"c1", "c2"}, "sub");
          CHECK_EQ("everyone banned", all, (std::vector<std::string>{"sub", "sub"}));
          std::vector<std::string> team = {"karrigan", "ropz"};
          team.shrink_to_fit();
          CHECK_EQ("captain survives reallocation", captain_after_signing(team, "jks"), std::string("karrigan"));
      }
    hints:
      - "Bug 1: after `erase(begin() + i)`, the next player moves into slot i and `i++` skips them. `std::erase_if` (C++20) removes all matches correctly and returns how many."
      - "Bug 2: the second loop push_backs into `roster` while range-for iterates it. Just loop `removed` times instead."
      - "Bug 3: `captain` is a reference into the vector, and push_back may reallocate. Copy the string instead."

  - title: "Review: integer math"
    id: cpp-review-5
    text: |
      Numeric code gets reviewed for four things: **overflow**, **division by zero**, **signed/unsigned mix-ups**, and **empty input**. None of them shows up with small, friendly test values, which is exactly why reviewers try unfriendly ones.

      ### The four checks

      - **Overflow**: can an intermediate result exceed the type's range? An `int` holds about ±2.1 billion. `a * 100` overflows when `a` is only 22 million. Signed overflow is undefined behavior, not just a wrong number. Do the math in a wider type (`long long`) **before** the operation, not after.
      - **Division by zero**: is the divisor ever 0? For `int` it's undefined behavior (often a crash); for `double` it gives `inf` or `nan`.
      - **Unsigned wraparound**: `size_t` can't be negative. `v.size() - n` with `n > v.size()` wraps to a gigantic number.
      - **Empty input**: what does the function return for no data? The spec usually says.

      ```cpp run
      #include <cstdint>
      #include <iostream>
      #include <vector>

      // Percentage of bytes used, rounded down; 0 for a zero-size disk.
      int percent_used(std::int64_t used, std::int64_t total) {
          if (total == 0) return 0;                            // division by zero
          return static_cast<int>(used * 100 / total);         // 64-bit math: no overflow
      }

      // Sum of the first n readings (all of them if fewer).
      long long first_n(const std::vector<int>& r, std::size_t n) {
          long long sum = 0;                                   // wide accumulator
          for (std::size_t i = 0; i < n && i < r.size(); i++) sum += r[i];
          return sum;
      }

      int main() {
          std::cout << percent_used(3'000'000'000LL, 4'000'000'000LL) << "\n";
          std::cout << percent_used(0, 0) << "\n";
          std::cout << first_n({2'000'000'000, 2'000'000'000}, 5) << "\n";
          std::cout << first_n({}, 3) << "\n";
      }
      ```

      ```output
      75
      0
      4000000000
      0
      ```

      Every line handles one of the four checks: the zero guard, 64-bit multiplication, a `long long` sum that can hold two billion plus two billion, and a loop bound that respects both `n` and the real size.

      ### Where the conversion goes

      `static_cast<long long>(a) * 100` widens **before** multiplying. `static_cast<long long>(a * 100)` multiplies in `int` first, overflows, and only then widens the already wrong value. The same applies to sums: the accumulator's type must be wide from the start.

      **Your turn:** this pull request adds stats for the match history page. The specification:

      - `win_rate(wins, games)`: whole-number percentage, rounded down; 0 when there are no games. It must work for career totals in the billions.
      - `average(scores)`: the mean as a double; 0.0 for no scores. Scores can be large.
      - `last_n_total(scores, n)`: the sum of the last `n` scores (all of them if there are fewer than n).

      There are four bugs.
    seed: |
      #include <vector>

      int win_rate(int wins, int games) {
          return wins * 100 / games;
      }

      double average(const std::vector<int>& scores) {
          int sum = 0;
          for (int s : scores) sum += s;
          return static_cast<double>(sum) / scores.size();
      }

      long long last_n_total(const std::vector<int>& scores, std::size_t n) {
          long long total = 0;
          for (std::size_t i = scores.size() - n; i < scores.size(); i++) total += scores[i];
          return total;
      }
    solution: |
      #include <vector>

      int win_rate(int wins, int games) {
          if (games <= 0) return 0;
          return static_cast<int>(static_cast<long long>(wins) * 100 / games);
      }

      double average(const std::vector<int>& scores) {
          if (scores.empty()) return 0.0;
          long long sum = 0;
          for (int s : scores) sum += s;
          return static_cast<double>(sum) / static_cast<double>(scores.size());
      }

      long long last_n_total(const std::vector<int>& scores, std::size_t n) {
          long long total = 0;
          std::size_t start = n >= scores.size() ? 0 : scores.size() - n;
          for (std::size_t i = start; i < scores.size(); i++) total += scores[i];
          return total;
      }
    harness: |
      int main() {
          CHECK_EQ("simple rate", win_rate(3, 4), 75);
          CHECK_EQ("no games", win_rate(0, 0), 0);
          CHECK_EQ("career totals don't overflow", win_rate(1500000000, 2000000000), 75);
          CHECK_EQ("average", average({1, 2, 3, 4}), 2.5);
          CHECK_EQ("empty average", average({}), 0.0);
          CHECK_EQ("big scores", average({2000000000, 2000000000}), 2000000000.0);
          CHECK_EQ("last 2", last_n_total({5, 6, 7}, 2), 13LL);
          CHECK_EQ("n larger than size", last_n_total({5, 6, 7}, 10), 18LL);
          CHECK_EQ("empty scores", last_n_total({}, 3), 0LL);
      }
    hints:
      - "win_rate: guard `games <= 0`, and do the multiplication in `long long`: 1.5 billion × 100 doesn't fit in an int."
      - "average: an empty vector divides by zero, and an `int` sum overflows for big scores. Use a long long sum and check empty first."
      - "last_n_total: `scores.size() - n` is unsigned, so it wraps to a huge number when n is bigger than the size. Clamp the start index."

  - title: "Review: class design"
    id: cpp-review-6
    text: |
      Design bugs in class hierarchies are invisible in small tests and expensive in production. Three are common enough that experienced reviewers check for them on sight:

      - a base class used polymorphically **without a virtual destructor**: deleting through a base pointer skips the derived destructor (leaking whatever it owns)
      - storing derived objects **by value** in a container of the base type **slices** them: only the base part is copied, and virtual calls go to the base version
      - an intended override with a **slightly different signature** (missing `const`) silently creates a new function instead. `override` turns that into a compile error

      ### A correct hierarchy, for comparison

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>
      #include <vector>

      class Sensor {
      public:
          virtual ~Sensor() = default;                       // 1. virtual destructor
          virtual std::string read() const { return "?"; }
      };

      class Thermo : public Sensor {
      public:
          std::string read() const override { return "21C"; }   // 2. override checks the signature
      };

      class Humidity : public Sensor {
      public:
          std::string read() const override { return "40%"; }
      };

      int main() {
          std::vector<std::unique_ptr<Sensor>> sensors;      // 3. pointers, so nothing is sliced
          sensors.push_back(std::make_unique<Thermo>());
          sensors.push_back(std::make_unique<Humidity>());
          for (const auto& s : sensors) std::cout << s->read() << " ";
          std::cout << "\n";

          Thermo t;
          Sensor copy = t;                                   // slicing: only the Sensor part is copied
          std::cout << copy.read() << "\n";
      }
      ```

      ```output
      21C 40% 
      ?
      ```

      The last two lines show slicing on purpose: copying a `Thermo` into a plain `Sensor` keeps only the base part, so `read()` gives the base answer. A `std::vector<Sensor>` does exactly that to every element pushed into it.

      ### Reviewing a hierarchy

      1. Does the base have a virtual destructor? If any function is virtual, it needs one.
      2. Does every derived function that's meant to override say `override`? Add it, and let the compiler tell you about signature mismatches such as a missing `const`.
      3. Are derived objects ever stored or passed **by value** as the base type? Switch to references, pointers, or `std::unique_ptr<Base>`.

      Changing a function's parameter type (like the container in `names`) is a legitimate review fix when the old signature forces a bug.

      **Your turn:** this pull request adds weapon logging. Find and fix all three problems so the tests pass.
    seed: |
      #include <memory>
      #include <string>
      #include <vector>

      inline int live_scopes = 0;

      class Weapon {
      public:
          ~Weapon() {}
          virtual std::string name() const { return "weapon"; }
          virtual int damage() const { return 0; }
      };

      class Sniper : public Weapon {
      public:
          Sniper() { live_scopes++; }
          ~Sniper() { live_scopes--; }
          std::string name() const { return "sniper"; }
          int damage() { return 115; }
      };

      std::vector<std::string> names(const std::vector<Weapon>& arsenal) {
          std::vector<std::string> out;
          for (const auto& w : arsenal) out.push_back(w.name());
          return out;
      }
    solution: |
      #include <memory>
      #include <string>
      #include <vector>

      inline int live_scopes = 0;

      class Weapon {
      public:
          virtual ~Weapon() {}
          virtual std::string name() const { return "weapon"; }
          virtual int damage() const { return 0; }
      };

      class Sniper : public Weapon {
      public:
          Sniper() { live_scopes++; }
          ~Sniper() override { live_scopes--; }
          std::string name() const override { return "sniper"; }
          int damage() const override { return 115; }
      };

      std::vector<std::string> names(const std::vector<std::unique_ptr<Weapon>>& arsenal) {
          std::vector<std::string> out;
          for (const auto& w : arsenal) out.push_back(w->name());
          return out;
      }
    harness: |
      int main() {
          {
              std::unique_ptr<Weapon> w = std::make_unique<Sniper>();
              CHECK_EQ("damage through the base", w->damage(), 115);
          }
          CHECK_EQ("derived destructor ran", live_scopes, 0);
          std::vector<std::unique_ptr<Weapon>> arsenal;
          arsenal.push_back(std::make_unique<Sniper>());
          arsenal.push_back(std::make_unique<Weapon>());
          CHECK_EQ("no slicing", names(arsenal), (std::vector<std::string>{"sniper", "weapon"}));
      }
    hints:
      - "Make the base destructor `virtual`, so deleting a Sniper through a Weapon pointer runs ~Sniper."
      - "`int damage()` in Sniper lacks `const`, so it doesn't override. Add `const override` (and `override` on name())."
      - "`std::vector<Weapon>` slices every Sniper into a plain Weapon. Take `std::vector<std::unique_ptr<Weapon>>` and call `w->name()`."
