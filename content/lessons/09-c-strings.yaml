id: c-strings
title: Strings
lang: c
phase: "C: Memory"
summary: C strings are char arrays ending in '\0'. Length, copying, comparing, and writing string functions yourself.
steps:
  - title: The null terminator
    id: c-strings-1
    text: |
      You've been printing strings since the first lesson. Now it's time to see what they really are, because C strings behave very differently from strings in most other languages.

      C has **no string type**. A string is just a `char` array, and the end of the text is marked by a special character with the value 0, written `'\0'` and called the **null terminator**.

      ```c run
      #include <stdio.h>

      int main(void) {
          char word[] = "map";
          printf("%s\n", word);
          printf("%zu bytes\n", sizeof(word));
          printf("codes: %d %d %d %d\n", word[0], word[1], word[2], word[3]);
          word[0] = 'c';
          printf("%s\n", word);
          return 0;
      }
      ```

      ```output
      map
      4 bytes
      codes: 109 97 112 0
      cap
      ```

      `"map"` has 3 letters but takes **4** bytes: `'m'`, `'a'`, `'p'` and `'\0'`. When you write a string in double quotes, the compiler adds the terminator for you.

      ### Why a terminator?

      A plain array doesn't know its own length. Functions like `printf("%s", ...)` need to know where the text ends, so they print characters one by one **until they reach `'\0'`**. Every string function in C relies on this rule.

      If the terminator is missing, those functions keep going past the end of the array, printing or copying whatever bytes happen to follow in memory, until they happen to hit a zero. That's a bug, and a common source of crashes and security problems.

      ### Strings are editable arrays

      Because a string is a char array, you can change individual characters with an index, as the example does with `word[0] = 'c'`. When you build a string by hand, character by character, you must put the `'\0'` at the end yourself.

      **Your turn:** build the string `"ak"` by hand and print it.
    fill: |
      #include <stdio.h>

      int main(void) {
          char gun[3];
          gun[0] = 'a';
          gun[1] = 'k';
          gun[2] = [['\0']];
          printf("%s\n", gun);
          return 0;
      }
    hints:
      - The terminator character is written `'\0'` (backslash zero, in single quotes).
    tests:
      - expect: "ak"
    more:
      - task: |
          A string ends at the first `'\0'`, even if more characters come after it. Put a terminator in the right place so `msg` prints only `rush`.
        fill: |
          #include <stdio.h>

          int main(void) {
              char msg[] = "rush b";
              msg[[[4]]] = [['\0']];
              printf("%s\n", msg);
              return 0;
          }
        hints:
          - "`r` is at index 0, so the space after `rush` is at index 4."
          - The terminator is written `'\0'`.
        tests:
          - expect: "rush"
      - task: |
          Fill `s` with the letters `a` to `e` **using a loop**, end the string yourself, and print it. The output is `abcde`.
        seed: |
          #include <stdio.h>

          int main(void) {
              char s[6];
              // put 'a' to 'e' into s with a loop, then end the string

              printf("%s\n", s);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              char s[6];
              // put 'a' to 'e' into s with a loop, then end the string
              for (int i = 0; i < 5; i++) {
                  s[i] = 'a' + i;
              }
              s[5] = '\0';
              printf("%s\n", s);
              return 0;
          }
        require:
          - pattern: "for\\s*\\("
            message: Fill the letters with a `for` loop.
          - pattern: "s\\s*\\[\\s*5\\s*\\]\\s*="
            message: End the string by storing `'\0'` in `s[5]`.
        hints:
          - "`'a' + i` is the letter `i` places after `a`."
          - Five letters need six chars. The last one, `s[5]`, must be `'\0'`.
        tests:
          - expect: "abcde"

  - title: strlen and friends
    id: c-strings-2
    text: |
      Since strings are arrays, you can't combine or copy them with `=` or `+` like in other languages. `char a[10]; a = "hi";` doesn't compile: arrays can't be assigned. Instead, the standard library `<string.h>` provides functions:

      | Function | What it does |
      |---|---|
      | `strlen(s)` | counts characters before the `'\0'` |
      | `strcpy(dst, src)` | copies `src` into `dst`, including the terminator |
      | `strcat(dst, src)` | appends `src` to the end of the text already in `dst` |
      | `strcmp(a, b)` | compares two strings (next steps) |

      ```c run
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char greeting[40];
          strcpy(greeting, "Hello");
          strcat(greeting, ", ");
          strcat(greeting, "Ada");
          printf("%s (%zu chars)\n", greeting, strlen(greeting));
          return 0;
      }
      ```

      ```output
      Hello, Ada (10 chars)
      ```

      ### The destination must be big enough

      `strcpy` and `strcat` don't know how big `dst` is. They copy until they reach the source's terminator, and if `dst` is too small they write past its end: a **buffer overflow**. Always size the destination for the longest possible result, **plus one** for the `'\0'`. Here `greeting` has room for 40, and we use 11.

      For text built from several pieces, `snprintf` is often safer: it works like `printf` but writes into an array and never writes more than the size you give it:

      ```c
      snprintf(greeting, sizeof greeting, "%s, %s", "Hello", "Ada");
      ```

      ### strlen vs sizeof

      `strlen` counts the characters of text currently stored (10 here). `sizeof greeting` is the size of the whole array (40), no matter what's in it.

      ### More of `<string.h>`

      - `strncpy(dst, src, n)` looks like a safe `strcpy`, but when `src` has `n` or more characters it does **not** add the `'\0'`, so the result isn't a string. Prefer `snprintf`.
      - `strchr(s, c)` and `strstr(s, sub)` find a character or a substring. They return a pointer to it, or `NULL` if it isn't there (pointers are the next module).
      - `strtok` splits a string on separators, but it writes `'\0'`s into your string and remembers its position in a hidden variable, so it can't work on a string literal or on two strings at once.
      - `memset`, `memcpy` and `memmove` work on raw bytes of any type. `memcpy` must not be used when the source and destination overlap; `memmove` handles overlap correctly.

      **Your turn:** read two words and print them joined with a `-` between, followed by the total length. Input `de dust2` prints `de-dust2 8`.
    seed: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char a[32], b[32];
          scanf("%31s %31s", a, b);
          char out[80];
          // build out = a + "-" + b

          printf("%s %zu\n", out, strlen(out));
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char a[32], b[32];
          scanf("%31s %31s", a, b);
          char out[80];
          // build out = a + "-" + b
          strcpy(out, a);
          strcat(out, "-");
          strcat(out, b);
          printf("%s %zu\n", out, strlen(out));
          return 0;
      }
    hints:
      - "Copy the first word in with `strcpy(out, a);`"
      - "Then `strcat(out, \"-\");` and `strcat(out, b);`"
    tests:
      - stdin: "de dust2\n"
      - stdin: "a b\n"
      - stdin: "mirage inferno\n"
        hidden: true
    more:
      - task: |
          Read a team tag and a player name and build the string `[tag] name` in `out`, then print it with its length. Input `NaVi s1mple` prints `[NaVi] s1mple 13`.
        seed: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              char tag[16], name[32];
              scanf("%15s %31s", tag, name);
              char out[64];
              // build out = "[" + tag + "] " + name

              printf("%s %zu\n", out, strlen(out));
              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              char tag[16], name[32];
              scanf("%15s %31s", tag, name);
              char out[64];
              // build out = "[" + tag + "] " + name
              strcpy(out, "[");
              strcat(out, tag);
              strcat(out, "] ");
              strcat(out, name);
              printf("%s %zu\n", out, strlen(out));
              return 0;
          }
        hints:
          - Start with `strcpy(out, "[");` so `out` is a proper string.
          - Then `strcat` the tag, `"] "` and the name, in that order.
        tests:
          - stdin: "NaVi s1mple\n"
          - stdin: "G2 m0NESY\n"
          - stdin: "FaZe ropz\n"
            hidden: true
      - task: |
          Read three words and print the **longest** one and its length. If two are equally long, keep the first. Input `dust2 inferno nuke` prints `inferno 7`.
        seed: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              char w[3][32];
              for (int i = 0; i < 3; i++) {
                  scanf("%31s", w[i]);
              }

              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              char w[3][32];
              for (int i = 0; i < 3; i++) {
                  scanf("%31s", w[i]);
              }
              int best = 0;
              for (int i = 1; i < 3; i++) {
                  if (strlen(w[i]) > strlen(w[best])) best = i;
              }
              printf("%s %zu\n", w[best], strlen(w[best]));
              return 0;
          }
        hints:
          - "`w[i]` is the i-th word, and `strlen(w[i])` is its length."
          - Keep the index of the longest word so far, and use `>` so ties keep the first.
        tests:
          - stdin: "dust2 inferno nuke\n"
          - stdin: "aa bb cc\n"
          - stdin: "go vertigo anubis\n"
            hidden: true

  - title: Write your own strlen
    id: c-strings-3
    text: |
      Library functions aren't magic. `strlen` is a short loop, and writing it yourself is the best way to really understand how C strings work.

      The idea: start at index 0 and move forward one character at a time until you find `'\0'`. The index where you stop **is** the length, because indexes start at 0. Here's the same kind of loop counting something else, the number of spaces:

      ```c run
      #include <stdio.h>

      int count_spaces(const char s[]) {
          int count = 0;
          for (int i = 0; s[i] != '\0'; i++) {
              if (s[i] == ' ') {
                  count++;
              }
          }
          return count;
      }

      int main(void) {
          printf("%d\n", count_spaces("to be or not to be"));
          printf("%d\n", count_spaces(""));
          return 0;
      }
      ```

      ```output
      5
      0
      ```

      ### The loop condition is the key

      `s[i] != '\0'` is the standard way to walk a string: the loop body runs for every real character and stops at the terminator. You don't need the length in advance, which is the whole point of the terminator. (Since `'\0'` is 0 and 0 is false, you'll often see the shorter `for (int i = 0; s[i]; i++)`.)

      ### Empty strings

      `""` is a string whose very first character is `'\0'`. A correct loop handles it naturally: the condition is false immediately, the body never runs, and the result is 0. Always check your string functions against the empty string.

      ### const

      `const char s[]` promises that the function only **reads** the string. If the body tried `s[0] = 'x'`, the compiler would refuse. It also tells callers it's safe to pass string literals like `"hello"`, which must never be modified.

      **Your turn:** write `int my_strlen(const char s[])` without using `<string.h>`.
    seed: |
      int my_strlen(const char s[]) {

      }
    solution: |
      int my_strlen(const char s[]) {
          int n = 0;
          while (s[n] != '\0') {
              n++;
          }
          return n;
      }
    forbid:
      - pattern: "\\bstrlen\\s*\\("
        message: Don't call the library strlen; count the characters yourself.
    harness: |
      int main(void) {
          CHECK_INT("my_strlen(\"\")", my_strlen(""), 0);
          CHECK_INT("my_strlen(\"a\")", my_strlen("a"), 1);
          CHECK_INT("my_strlen(\"headshot\")", my_strlen("headshot"), 8);
          CHECK_INT("my_strlen(\"with spaces too\")", my_strlen("with spaces too"), 15);
          return 0;
      }
    hints:
      - Start a counter at 0 and move forward while `s[n] != '\0'`.
    more:
      - task: |
          Write `void my_strcpy(char dst[], const char src[])` that copies `src` into `dst`, **including** the terminator. Don't use `<string.h>`.
        seed: |
          void my_strcpy(char dst[], const char src[]) {

          }
        solution: |
          void my_strcpy(char dst[], const char src[]) {
              int i = 0;
              while (src[i] != '\0') {
                  dst[i] = src[i];
                  i++;
              }
              dst[i] = '\0';
          }
        harness: |
          int main(void) {
              char d[32];
              my_strcpy(d, "headshot");
              CHECK_STR("copy \"headshot\"", d, "headshot");
              my_strcpy(d, "ak");
              CHECK_STR("a shorter string ends in the right place", d, "ak");
              my_strcpy(d, "");
              CHECK_STR("empty string", d, "");
              return 0;
          }
        forbid:
          - pattern: "\\bstrcpy\\s*\\(|\\bmemcpy\\s*\\("
            message: Copy the characters yourself with a loop.
        hints:
          - Copy characters until you reach `'\0'` in `src`.
          - The loop stops before copying the terminator, so write `dst[i] = '\0';` after it. The second test fails without it.
        tests: []
      - task: |
          Write `int my_strcmp(const char a[], const char b[])` that works like `strcmp`: return a negative number if `a` comes first in dictionary order, `0` if they are equal, and a positive number if `b` comes first. Compare character by character; at the first difference, return `a[i] - b[i]`.
        seed: |
          int my_strcmp(const char a[], const char b[]) {

          }
        solution: |
          int my_strcmp(const char a[], const char b[]) {
              int i = 0;
              while (a[i] != '\0' && a[i] == b[i]) {
                  i++;
              }
              return (unsigned char)a[i] - (unsigned char)b[i];
          }
        harness: |
          int main(void) {
              CHECK("\"abc\" vs \"abc\" is 0", my_strcmp("abc", "abc") == 0);
              CHECK("\"abc\" vs \"abd\" is negative", my_strcmp("abc", "abd") < 0);
              CHECK("\"b\" vs \"a\" is positive", my_strcmp("b", "a") > 0);
              CHECK("\"ab\" vs \"abc\" is negative (prefix first)", my_strcmp("ab", "abc") < 0);
              CHECK("\"abc\" vs \"ab\" is positive", my_strcmp("abc", "ab") > 0);
              CHECK("\"\" vs \"\" is 0", my_strcmp("", "") == 0);
              CHECK("\"Z\" vs \"a\" is negative (capitals first)", my_strcmp("Z", "a") < 0);
              return 0;
          }
        forbid:
          - pattern: "\\bstrcmp\\s*\\("
            message: Compare the characters yourself instead of calling strcmp.
        hints:
          - Move forward while the characters are equal and `a` hasn't ended.
          - When the loop stops, `a[i] - b[i]` has the right sign. When one string is a prefix of the other, its `'\0'` (which is 0) makes it come first.
        tests: []

  - title: Compare strings correctly
    id: c-strings-4
    text: |
      Comparing two strings with `==` is one of the most common C bugs:

      ```c
      char cmd[20] = "quit";
      if (cmd == "quit") { ... }   // wrong: compares addresses
      ```

      A string in C is an array, and using an array's name gives the **address** of its first character. So `==` asks "are these the same place in memory?", not "do they contain the same text?". They're different arrays, so it's false even though the letters match. The compiler warns: `result of comparison against a string literal is unspecified`.

      To compare **contents**, use `strcmp(a, b)` from `<string.h>`. It compares character by character and returns:

      - `0` if the strings are equal,
      - a **negative** number if `a` comes first alphabetically (by character codes),
      - a **positive** number if `a` comes after `b`.

      ```c run
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char answer[20];
          scanf("%19s", answer);
          if (strcmp(answer, "yes") == 0) {
              printf("confirmed\n");
          } else if (strcmp(answer, "no") == 0) {
              printf("cancelled\n");
          } else {
              printf("please answer yes or no\n");
          }
          printf("%d\n", strcmp("apple", "banana") < 0);
          return 0;
      }
      ```

      ```input
      no
      ```

      ```output
      cancelled
      1
      ```

      ### Read it carefully

      `strcmp` returns 0 for **equal**, and 0 means false in C. So `if (strcmp(a, b))` runs when they're **different**, the opposite of what it looks like. Always write the comparison out: `strcmp(a, b) == 0`.

      The comparison is exact and case sensitive: `"Yes"` and `"yes"` are different, because `'Y'` and `'y'` have different codes.

      **Your turn:** read a command word. Print `planting` for `plant`, `defusing` for `defuse`, and `unknown command` for anything else.
    seed: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char cmd[32];
          scanf("%31s", cmd);

          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char cmd[32];
          scanf("%31s", cmd);
          if (strcmp(cmd, "plant") == 0) {
              printf("planting\n");
          } else if (strcmp(cmd, "defuse") == 0) {
              printf("defusing\n");
          } else {
              printf("unknown command\n");
          }
          return 0;
      }
    require:
      - pattern: "strcmp\\s*\\("
        message: Compare the text with `strcmp`.
    hints:
      - "`strcmp(cmd, \"plant\") == 0` is true when they match."
    tests:
      - stdin: "plant\n"
      - stdin: "defuse\n"
      - stdin: "rush\n"
      - stdin: "Plant\n"
        hidden: true
    more:
      - task: |
          Read two player names and print which one comes first in dictionary order, as `X comes first`. If they're the same, print `same name`. Input `ropz broky` prints `broky comes first`.
        seed: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              char a[32], b[32];
              scanf("%31s %31s", a, b);

              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              char a[32], b[32];
              scanf("%31s %31s", a, b);
              int c = strcmp(a, b);
              if (c == 0) {
                  printf("same name\n");
              } else if (c < 0) {
                  printf("%s comes first\n", a);
              } else {
                  printf("%s comes first\n", b);
              }
              return 0;
          }
        require:
          - pattern: "strcmp\\s*\\("
            message: Compare the names with `strcmp`.
        hints:
          - "`strcmp(a, b)` is negative when `a` comes first, 0 when equal, positive when `b` comes first."
        tests:
          - stdin: "ropz broky\n"
          - stdin: "apex apex\n"
          - stdin: "karrigan niko\n"
          - stdin: "abc ab\n"
            hidden: true
      - task: |
          Read words until the word `end` (or until the input runs out) and count how many of them were `gg`. Input `gg wp gg ez end gg` prints `2`, because the last `gg` comes after `end`.
        seed: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              char w[32];
              int count = 0;

              printf("%d\n", count);
              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
              char w[32];
              int count = 0;
              while (scanf("%31s", w) == 1) {
                  if (strcmp(w, "end") == 0) break;
                  if (strcmp(w, "gg") == 0) count++;
              }
              printf("%d\n", count);
              return 0;
          }
        require:
          - pattern: "strcmp\\s*\\("
            message: Compare the words with `strcmp`.
        hints:
          - "Loop with `while (scanf(\"%31s\", w) == 1)` so the loop also stops when the input ends."
          - "`break` on `end`, and add 1 when `strcmp(w, \"gg\") == 0`."
        tests:
          - stdin: "gg wp gg ez end gg\n"
          - stdin: "wp\n"
          - stdin: "gg gg GG gg\n"
            hidden: true

  - title: Characters are numbers
    id: c-strings-5
    text: |
      A `char` is a small integer holding a character code, so you can do arithmetic and comparisons on characters. In ASCII, the letters `'a'` to `'z'` have consecutive codes (97 to 122), and so do `'A'` to `'Z'` (65 to 90) and the digits `'0'` to `'9'` (48 to 57). That makes several tricks possible:

      - `c >= 'a' && c <= 'z'` checks for a lowercase letter.
      - `c - 'a'` gives a letter's position in the alphabet (`'c' - 'a'` is 2).
      - `c - '0'` turns a digit character into its number (`'7' - '0'` is 7).
      - The gap between lowercase and uppercase is the same for every letter: `'a' - 'A'` is 32.

      ```c run
      #include <stdio.h>

      int digit_sum(const char s[]) {
          int sum = 0;
          for (int i = 0; s[i] != '\0'; i++) {
              if (s[i] >= '0' && s[i] <= '9') {
                  sum += s[i] - '0';
              }
          }
          return sum;
      }

      int main(void) {
          printf("%d\n", digit_sum("a1b2c3"));
          printf("%c%c\n", 'a' + 7, 'A' + ('e' - 'a'));
          return 0;
      }
      ```

      ```output
      6
      hE
      ```

      ### The `<ctype.h>` helpers

      The standard library has ready-made, readable versions of these checks: `isdigit(c)`, `isalpha(c)`, `islower(c)`, `isupper(c)`, `isspace(c)`, and converters `toupper(c)` and `tolower(c)`, which return the converted character (or the same character if there's nothing to convert). They're clearer than hand-written ranges, so prefer them in real code.

      ### Changing a string in place

      To modify a string, loop over it and assign to `s[i]`. Only change the characters that need changing; everything else, including spaces, digits and the terminator, must stay as it was.

      **Your turn:** write `void to_upper(char s[])` that converts every lowercase letter in the string to uppercase **in place**. Leave other characters alone.
    seed: |
      void to_upper(char s[]) {

      }
    solution: |
      void to_upper(char s[]) {
          for (int i = 0; s[i] != '\0'; i++) {
              if (s[i] >= 'a' && s[i] <= 'z') {
                  s[i] = s[i] - 'a' + 'A';
              }
          }
      }
    harness: |
      int main(void) {
          char a[] = "rush b";
          to_upper(a);
          CHECK_STR("\"rush b\"", a, "RUSH B");
          char b[] = "AWP-123";
          to_upper(b);
          CHECK_STR("\"AWP-123\"", b, "AWP-123");
          char c[] = "";
          to_upper(c);
          CHECK_STR("empty string", c, "");
          char d[] = "gG wP!";
          to_upper(d);
          CHECK_STR("\"gG wP!\"", d, "GG WP!");
          return 0;
      }
    hints:
      - Loop until you reach `'\0'`.
      - "If `s[i]` is between 'a' and 'z', subtract `'a' - 'A'` (or call `toupper` from `<ctype.h>`)."
    more:
      - task: |
          Write `void capitalize(char s[])` that makes the first letter of every word uppercase and every other letter lowercase, in place. A word starts at the beginning or right after a space.
        seed: |
          void capitalize(char s[]) {

          }
        solution: |
          void capitalize(char s[]) {
              for (int i = 0; s[i] != '\0'; i++) {
                  int start = (i == 0 || s[i - 1] == ' ');
                  if (start && s[i] >= 'a' && s[i] <= 'z') {
                      s[i] = s[i] - 'a' + 'A';
                  } else if (!start && s[i] >= 'A' && s[i] <= 'Z') {
                      s[i] = s[i] - 'A' + 'a';
