      - task: |
          Write `int is_phrase_palindrome(const char s[])` that ignores capitals **and** skips every character that isn't a letter. `"A man, a plan, a canal: Panama"` is a palindrome. A string with no letters counts as one.
        seed: |
          #include <string.h>

          int is_phrase_palindrome(const char s[]) {

          }
        solution: |
          #include <string.h>

          int is_letter(char c) {
              return (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z');
          }

          char lower(char c) {
              if (c >= 'A' && c <= 'Z') return c - 'A' + 'a';
              return c;
          }

          int is_phrase_palindrome(const char s[]) {
              int i = 0;
              int j = (int)strlen(s) - 1;
              while (i < j) {
                  if (!is_letter(s[i])) {
                      i++;
                  } else if (!is_letter(s[j])) {
                      j--;
                  } else {
                      if (lower(s[i]) != lower(s[j])) return 0;
                      i++;
                      j--;
                  }
              }
              return 1;
          }
        harness: |
          int main(void) {
              CHECK_INT("\"A man, a plan, a canal: Panama\"", is_phrase_palindrome("A man, a plan, a canal: Panama"), 1);
              CHECK_INT("\"No lemon, no melon\"", is_phrase_palindrome("No lemon, no melon"), 1);
              CHECK_INT("\"gg wp\"", is_phrase_palindrome("gg wp"), 0);
              CHECK_INT("\"\"", is_phrase_palindrome(""), 1);
              CHECK_INT("\"!!\"", is_phrase_palindrome("!!"), 1);
              CHECK_INT("\"a.b\"", is_phrase_palindrome("a.b"), 0);
              return 0;
          }
        hints:
          - Keep the two indexes. If `s[i]` isn't a letter, move `i` forward and try again; same for `s[j]` moving backward.
          - Only compare when both are letters, using a lowercase helper.
