id: cpp-move
title: Move semantics
lang: cpp
phase: "C++: Modern and Advanced"
summary: Why C++ can pass big objects around cheaply. lvalues vs rvalues, std::move, move constructors and the rule of five.
steps:
  - title: Copies are expensive
    text: |
      Copying a `std::vector` with a million elements copies a million elements. But often the source is about to disappear anyway (a temporary, or a variable you're done with). In that case you can **steal** its internals instead: that's a **move**.

      - An **lvalue** is something with a name that lives on (`v`).
      - An **rvalue** is a temporary about to die (`make_vector()`, `a + b`).

      `std::move(x)` doesn't move anything by itself. It *casts* `x` to an rvalue, which says "I'm done with x, you may steal from it".

      After a move, the source is in a valid but unspecified state. Don't read its value; you may assign a new one.

      **Your turn:** move `big` into `store` instead of copying it.
    fill: |
      #include <iostream>
      #include <utility>
      #include <vector>

      int main() {
          std::vector<int> big(1000000, 7);
          std::vector<std::vector<int>> store;
          store.push_back([[std::move]](big));
          std::cout << store[0].size() << "\n";
      }
    hints:
      - "Wrap it: `std::move(big)`."
    tests:
      - expect: "1000000"

  - title: Write a move constructor
    text: |
      A class that owns a resource can implement moving itself. The **move constructor** takes an rvalue reference (`T&&`), steals the pointer, and leaves the source empty so its destructor does nothing harmful:

      ```cpp
      Buffer(Buffer&& other) noexcept
          : data_(other.data_), size_(other.size_) {
          other.data_ = nullptr;
          other.size_ = 0;
      }
      ```

      `noexcept` promises it won't fail, which lets `std::vector` use it when growing.

      **Your turn:** write the move constructor for `Buffer`.
    seed: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(const Buffer&) = delete;
          Buffer& operator=(const Buffer&) = delete;
          // move constructor here

          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    solution: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(const Buffer&) = delete;
          Buffer& operator=(const Buffer&) = delete;
          // move constructor here
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    harness: |
      #include <utility>
      int main() {
          Buffer a(64);
          const int* original = a.data();
          Buffer b(std::move(a));
          CHECK("b stole a's memory", b.data() == original);
          CHECK_EQ("b has the size", b.size(), 64);
          CHECK("a is empty", a.data() == nullptr);
          CHECK_EQ("a size is 0", a.size(), 0);
          std::vector<Buffer> v;
          v.push_back(Buffer(3));
          v.push_back(Buffer(5));
          CHECK_EQ("vector of move-only buffers", v[1].size(), 5);
      }
    hints:
      - "Signature: `Buffer(Buffer&& other) noexcept`."
      - "Copy the pointer and size from other, then set `other.data_ = nullptr;` and `other.size_ = 0;`."

  - title: Move assignment and the rule of five
    text: |
      **Move assignment** (`a = std::move(b);`) must also release what `a` currently owns, and must survive self-assignment:

      ```cpp
      Buffer& operator=(Buffer&& other) noexcept {
          if (this != &other) {
              delete[] data_;
              data_ = other.data_;  size_ = other.size_;
              other.data_ = nullptr; other.size_ = 0;
          }
          return *this;
      }
      ```

      The **rule of five**: if you write any of destructor, copy constructor, copy assignment, move constructor, move assignment, think about all five. Even better is the **rule of zero**: use members like `std::vector` and `std::unique_ptr` that already handle all five, and write none.

      **Your turn:** add move assignment.
    seed: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          // move assignment here

          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    solution: |
      class Buffer {
      public:
          explicit Buffer(int n) : data_(new int[n]()), size_(n) {}
          ~Buffer() { delete[] data_; }
          Buffer(Buffer&& other) noexcept : data_(other.data_), size_(other.size_) {
              other.data_ = nullptr;
              other.size_ = 0;
          }
          // move assignment here
          Buffer& operator=(Buffer&& other) noexcept {
              if (this != &other) {
                  delete[] data_;
                  data_ = other.data_;
                  size_ = other.size_;
                  other.data_ = nullptr;
                  other.size_ = 0;
              }
              return *this;
          }
          int size() const { return size_; }
          const int* data() const { return data_; }

      private:
          int* data_;
          int size_;
      };
    harness: |
      #include <utility>
      int main() {
          Buffer a(10), b(20);
          const int* bp = b.data();
          a = std::move(b);
          CHECK("a now owns b's memory", a.data() == bp);
          CHECK_EQ("a size", a.size(), 20);
          CHECK("b emptied", b.data() == nullptr && b.size() == 0);
          Buffer& self = a;
          a = std::move(self);
          CHECK("self-move keeps the data", a.data() == bp && a.size() == 20);
          for (int i = 0; i < 2000; i++) {
              Buffer t(100000);
              a = std::move(t);
          }
          CHECK("2000 move-assignments without leaking", a.size() == 100000);
      }
    hints:
      - "Signature: `Buffer& operator=(Buffer&& other) noexcept`."
      - "Guard with `if (this != &other)`, free your old data with `delete[] data_;`, steal, reset other."
      - "End with `return *this;`."

  - title: Return by value is free
    text: |
      Returning a local object by value doesn't copy it. When you return a temporary (`return Widget(...);`), C++17 **guarantees** the object is built directly in the caller's variable: no copy, no move. Returning a named local is almost always optimized the same way, and otherwise it's moved.

      So write functions that return by value; don't return pointers or use out-parameters for performance.

      **Your turn:** the `Tracker` struct counts copies. Write `Tracker make_tracker(int id)` so that creating one via your function performs **zero** copies. The test prints the copy count.
    seed: |
      struct Tracker {
          static inline int copies = 0;
          int id;
          explicit Tracker(int i) : id(i) {}
          Tracker(const Tracker& o) : id(o.id) { copies++; }
      };

      Tracker make_tracker(int id) {

      }
    solution: |
      struct Tracker {
          static inline int copies = 0;
          int id;
          explicit Tracker(int i) : id(i) {}
          Tracker(const Tracker& o) : id(o.id) { copies++; }
      };

      Tracker make_tracker(int id) {
          return Tracker(id);
      }
    harness: |
      int main() {
          Tracker t = make_tracker(7);
          CHECK_EQ("id", t.id, 7);
          CHECK_EQ("copies made", Tracker::copies, 0);
      }
    hints:
      - "Just `return Tracker(id);`. Guaranteed copy elision does the rest."
