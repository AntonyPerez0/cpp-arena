id: cpp-operators
title: Operator overloading
lang: cpp
phase: "C++: A Better C"
summary: Teach your own types to work with +, ==, <<, [] and <, so they read like built-in types.
steps:
  - title: operator+
    id: cpp-operators-1
    text: |
      Built-in types work with operators: `a + b`, `a == b`, `std::cout << a`. C++ lets **your** types work with them too. This is called **operator overloading**, and it's why `std::string` can be joined with `+` and compared with `==`: the standard library overloads those operators.

      An operator is just a function with a special name: `operator+`, `operator==`, `operator<<`, and so on. When the compiler sees `a + b` with your types, it calls `operator+(a, b)`.

      ```cpp run
      #include <iostream>

      struct Money {
          long long cents;
      };

      Money operator+(Money a, Money b) { return {a.cents + b.cents}; }
      Money operator*(Money a, int n) { return {a.cents * n}; }
      bool operator<(Money a, Money b) { return a.cents < b.cents; }

      int main() {
          Money coffee{350};
          Money cake{425};
          Money bill = coffee * 2 + cake;
          long long c = bill.cents % 100;
          std::cout << bill.cents / 100 << "." << (c < 10 ? "0" : "") << c << "\n";   // pad cents to 2 digits
          std::cout << (cake < coffee) << "\n";
      }
      ```

      ```output
      11.25
      0
      ```

      `coffee * 2 + cake` reads exactly like math. The usual precedence still applies (`*` before `+`), because overloading changes what operators **do**, not how expressions are parsed.

      ### Guidelines

      - Overload an operator only when its meaning is **obvious**: arithmetic on math-like types, comparisons, `<<` for printing, `[]` for indexing. `+` should never secretly delete a file.
      - Keep the usual behavior: `+` shouldn't change its operands; `==` should be consistent with `!=`.
      - `return {a.cents + b.cents};` builds the result with braces, filling the struct's members in order.

      **Your turn:** complete `operator-` and `operator*` (vector times a number).
    fill: |
      #include <iostream>

      struct Vec2 { double x, y; };

      Vec2 [[operator-]](Vec2 a, Vec2 b) { return {a.x - b.x, a.y - b.y}; }
      Vec2 operator*(Vec2 a, double k) { return {a.x [[*]] k, a.y * k}; }

      int main() {
          Vec2 v = (Vec2{5, 5} - Vec2{2, 1}) * 2;
          std::cout << v.x << " " << v.y << "\n";
      }
    hints:
      - "The function for `-` is named `operator-`."
    tests:
      - expect: "6 8"
    more:
      - task: |
          Complete `operator+=` as a **member** function: it changes this vector and returns it by reference, so calls can be chained. The program prints `4 6`.
        fill: |
          #include <iostream>

          struct Vec2 {
              double x, y;
              Vec2& operator[[+=]](Vec2 o) {
                  x += o.x;
                  y += o.y;
                  return [[*this]];
              }
          };

          int main() {
              Vec2 v{1, 2};
              v += Vec2{1, 1};
              v += Vec2{2, 3};
              std::cout << v.x << " " << v.y << "\n";
          }
        hints:
          - The operator's name is `operator` followed by the symbol, here `+=`.
          - "`this` is a pointer to the current object, so the object itself is `*this`."
        tests:
          - expect: "4 6"
      - task: |
          Write `operator+` for two `Vec2`s and the **unary** `operator-` that negates a vector (`-v` flips both signs), so the program prints `-4 -1`.
        seed: |
          #include <iostream>

          struct Vec2 { double x, y; };

          // operator+ and unary operator- here

          int main() {
              Vec2 a{1, 2}, b{3, -1};
              Vec2 c = -(a + b);
              std::cout << c.x << " " << c.y << "\n";
          }
        solution: |
          #include <iostream>

          struct Vec2 { double x, y; };

          // operator+ and unary operator- here
          Vec2 operator+(Vec2 a, Vec2 b) { return {a.x + b.x, a.y + b.y}; }
          Vec2 operator-(Vec2 v) { return {-v.x, -v.y}; }

          int main() {
              Vec2 a{1, 2}, b{3, -1};
              Vec2 c = -(a + b);
              std::cout << c.x << " " << c.y << "\n";
          }
        hints:
          - A binary operator written outside the struct takes two parameters. The unary minus takes just one.
        tests:
          - expect: "-4 -1"

  - title: operator== and !=
    id: cpp-operators-2
    text: |
      To compare your own types with `==`, define `operator==`. It returns a `bool` and usually takes both sides by `const&`:

      ```cpp run
      #include <iostream>
      #include <string>

      struct Version {
          int major, minor;
          std::string label;
      };

      bool operator==(const Version& a, const Version& b) {
          return a.major == b.major && a.minor == b.minor;
      }

      struct Point {
          int x, y;
          bool operator==(const Point&) const = default;
      };

      int main() {
          Version v1{2, 1, "stable"};
          Version v2{2, 1, "rc"};
          std::cout << (v1 == v2) << (v1 != v2) << "\n";
          std::cout << (Point{1, 2} == Point{1, 2}) << (Point{1, 2} == Point{2, 1}) << "\n";
      }
      ```

      ```output
      10
      10
      ```

      ### You decide what "equal" means

      `Version`'s `==` deliberately ignores the label: two versions with the same numbers count as equal. Writing `==` by hand lets you choose which members matter.

      ### C++20 conveniences

      - Define `==` and the compiler automatically rewrites `a != b` as `!(a == b)`. You don't need to write `!=` any more.
      - `bool operator==(const Point&) const = default;` asks the compiler to generate `==` comparing **every** member in order. That's the right choice when equality really means "all members equal".

      ### All six comparisons from one line

      `auto operator<=>(const T&) const = default;` defines the **three-way comparison** (nicknamed the spaceship operator, from `<compare>`). The compiler then provides `<`, `<=`, `>` and `>=`, comparing members in the order they're declared, the way a dictionary compares words letter by letter. A defaulted `<=>` also gives you `==`, so one line makes a type fully comparable and sortable:

      ```cpp run
      #include <compare>
      #include <iostream>

      struct Release {
          int major, minor, patch;
          auto operator<=>(const Release&) const = default;
      };

      int main() {
          Release a{1, 4, 2}, b{1, 10, 0};
          std::cout << (a < b) << (a == b) << (b >= a) << "\n";
      }
      ```

      ```output
      101
      ```

      `1.4.2` is less than `1.10.0` because `minor` is compared as a number (4 < 10), not as text.

      ### Member or free function?

      `Point`'s operator is a **member** (declared inside the struct, with one parameter: the right-hand side, while `*this` is the left). `Version`'s is a **free function** with both sides as parameters. Both work. Free functions are often preferred for symmetric operators like `==` and `+`, since they treat both sides the same way.

      **Your turn:** write `operator==` for `Score` by hand. Two scores are equal if both teams' round counts match; the map name doesn't matter.
    seed: |
      #include <string>

      struct Score {
          int t;
          int ct;
          std::string map;
      };

      // operator== here
    solution: |
      #include <string>

      struct Score {
          int t;
          int ct;
          std::string map;
      };

      // operator== here
      bool operator==(const Score& a, const Score& b) {
          return a.t == b.t && a.ct == b.ct;
      }
    harness: |
      int main() {
          Score a{13, 7, "mirage"}, b{13, 7, "nuke"}, c{7, 13, "mirage"};
          CHECK("13-7 == 13-7 on another map", a == b);
          CHECK("13-7 != 7-13", !(a == c));
          CHECK("!= works too (C++20)", a != c);
      }
    hints:
      - "`bool operator==(const Score& a, const Score& b)`"
      - Compare only `t` and `ct`.
    more:
      - task: |
          Write `operator==` for `Weapon`: two weapons are equal when both the name **and** the price match.
        seed: |
          #include <string>

          struct Weapon {
              std::string name;
              int price;
          };

          // operator== here
        solution: |
          #include <string>

          struct Weapon {
              std::string name;
              int price;
          };

          // operator== here
          bool operator==(const Weapon& a, const Weapon& b) {
              return a.name == b.name && a.price == b.price;
          }
        harness: |
          int main() {
              Weapon ak{"ak47", 2700}, ak2{"ak47", 2700}, cheap{"ak47", 2000}, m4{"m4a4", 2700};
              CHECK("same name and price", ak == ak2);
              CHECK("different price", !(ak == cheap));
              CHECK("different name", !(ak == m4));
              CHECK("!= comes for free (C++20)", ak != m4);
          }
        hints:
          - Take both by `const` reference and compare field by field with `&&`.
        tests: []
      - task: |
          Write `operator==` and `operator<` for `Version`, compared by `major` first, then `minor`, then `patch`. `1.9.9 < 1.10.0` must be true, which a string comparison would get wrong.
        seed: |
          struct Version {
              int major, minor, patch;
          };

          // operator== and operator< here
        solution: |
          struct Version {
              int major, minor, patch;
          };

          // operator== and operator< here
          bool operator==(const Version& a, const Version& b) {
              return a.major == b.major && a.minor == b.minor && a.patch == b.patch;
          }

          bool operator<(const Version& a, const Version& b) {
              if (a.major != b.major) return a.major < b.major;
              if (a.minor != b.minor) return a.minor < b.minor;
              return a.patch < b.patch;
          }
        harness: |
          int main() {
              CHECK("1.9.9 < 1.10.0", Version{1, 9, 9} < Version{1, 10, 0});
              CHECK("2.0.0 is not < 1.99.99", !(Version{2, 0, 0} < Version{1, 99, 99}));
              CHECK("1.2.3 < 1.2.4", Version{1, 2, 3} < Version{1, 2, 4});
              CHECK("equal versions are not <", !(Version{1, 2, 3} < Version{1, 2, 3}));
              CHECK("==", Version{3, 1, 4} == Version{3, 1, 4});
              CHECK("!=", Version{3, 1, 4} != Version{3, 1, 5});
          }
        hints:
          - Compare the first field that differs; only when a field is equal move on to the next one.
        tests: []

  - title: Printing with operator<<
    id: cpp-operators-3
    text: |
      `std::cout << x` works for built-in types because the standard library defines `operator<<` for each of them. You can add one for your own types, and then they print like anything else, including into files and string streams.

      ```cpp run
      #include <iostream>
      #include <sstream>
      #include <string>

      struct Date {
          int y, m, d;
      };

      std::ostream& operator<<(std::ostream& os, const Date& date) {
          os << date.y << "-";
          if (date.m < 10) os << "0";
          os << date.m << "-";
          if (date.d < 10) os << "0";
          return os << date.d;
      }

      int main() {
          Date launch{1969, 7, 20};
          std::cout << "launch: " << launch << "\n";
          std::ostringstream text;
          text << launch;
          std::string s = text.str();
          std::cout << s.size() << " chars\n";
      }
      ```

      ```output
      launch: 1969-07-20
      10 chars
      ```

      ### The required shape

      ```cpp
      std::ostream& operator<<(std::ostream& os, const T& value)
      ```

      - The **left** operand is the stream, so this must be a free function (you can't add members to `std::ostream`).
      - Take the value by `const&`: printing shouldn't copy or change it.
      - **Return the stream** by reference. That's what makes chaining work: `std::cout << "launch: " << launch << "\n"` is evaluated as `((std::cout << "launch: ") << launch) << "\n"`, so each `<<` needs the stream back from the previous one.

      Because it takes any `std::ostream`, the same operator writes to `std::cout`, to a file (`std::ofstream`), or to a string (`std::ostringstream`), as the example shows.

      Don't print a trailing newline inside `operator<<`; let the caller decide.

      **Your turn:** make `Score` printable as `T 13 - 7 CT`.
    seed: |
      #include <iostream>

      struct Score {
          int t;
          int ct;
      };

      // operator<< here
    solution: |
      #include <iostream>

      struct Score {
          int t;
          int ct;
      };

      // operator<< here
      std::ostream& operator<<(std::ostream& os, const Score& s) {
          return os << "T " << s.t << " - " << s.ct << " CT";
      }
    harness: |
      #include <sstream>
      int main() {
          std::ostringstream out;
          out << Score{13, 7};
          CHECK_EQ("print 13-7", out.str(), std::string("T 13 - 7 CT"));
          std::ostringstream out2;
          out2 << Score{0, 0} << "|" << Score{16, 14};
          CHECK_EQ("chained", out2.str(), std::string("T 0 - 0 CT|T 16 - 14 CT"));
      }
    hints:
      - "Signature: `std::ostream& operator<<(std::ostream& os, const Score& s)`."
      - "`return os << \"T \" << s.t << \" - \" << s.ct << \" CT\";`"
    more:
      - task: |
          Make `Weapon` printable as `ak47 ($2700)`.
        seed: |
          #include <iostream>
          #include <string>

          struct Weapon {
              std::string name;
              int price;
          };

          // operator<< here
        solution: |
          #include <iostream>
          #include <string>

          struct Weapon {
              std::string name;
              int price;
          };

          // operator<< here
          std::ostream& operator<<(std::ostream& os, const Weapon& w) {
              return os << w.name << " ($" << w.price << ")";
          }
        harness: |
          #include <sstream>
          int main() {
              std::ostringstream out;
              out << Weapon{"ak47", 2700};
              CHECK_EQ("print one", out.str(), std::string("ak47 ($2700)"));
              std::ostringstream out2;
              out2 << Weapon{"p250", 300} << ", " << Weapon{"awp", 4750};
              CHECK_EQ("chained", out2.str(), std::string("p250 ($300), awp ($4750)"));
          }
        hints:
          - "The signature is `std::ostream& operator<<(std::ostream& os, const Weapon& w)`, and it returns `os` so `<<` can chain."
        tests: []
      - task: |
          Make `Team` printable as `NaVi: s1mple, b1t, jL`, with the players separated by `, `. A team without players prints `NaVi: (no players)`.
        seed: |
          #include <iostream>
          #include <string>
          #include <vector>

          struct Team {
              std::string name;
              std::vector<std::string> players;
          };

          // operator<< here
        solution: |
          #include <iostream>
          #include <string>
          #include <vector>

          struct Team {
              std::string name;
              std::vector<std::string> players;
          };

          // operator<< here
          std::ostream& operator<<(std::ostream& os, const Team& t) {
              os << t.name << ": ";
              if (t.players.empty()) return os << "(no players)";
              for (std::size_t i = 0; i < t.players.size(); i++) {
                  if (i > 0) os << ", ";
                  os << t.players[i];
              }
              return os;
          }
        harness: |
          #include <sstream>
          int main() {
              std::ostringstream out;
              out << Team{"NaVi", {"s1mple", "b1t", "jL"}};
              CHECK_EQ("three players", out.str(), std::string("NaVi: s1mple, b1t, jL"));
              std::ostringstream out2;
              out2 << Team{"G2", {}};
              CHECK_EQ("no players", out2.str(), std::string("G2: (no players)"));
              std::ostringstream out3;
              out3 << Team{"FaZe", {"ropz"}} << "!";
              CHECK_EQ("one player, chained", out3.str(), std::string("FaZe: ropz!"));
          }
        hints:
          - Write the parts to `os` in a loop, putting `, ` before every player except the first. Return `os` at the end.
        tests: []

  - title: operator[]
    id: cpp-operators-4
    text: |
      `operator[]` lets your type be indexed like an array: `obj[i]`. It must be a **member** function. Two versions are usually provided:

      ```cpp
      T& operator[](int i);               // for non-const objects: allows obj[i] = x
      const T& operator[](int i) const;   // for const objects: read-only
      ```

      Returning a **reference** is what makes assignment through it work.

      ```cpp run
      #include <iostream>
      #include <string>

      class Week {
      public:
          std::string& operator[](int day) { return plans_[day - 1]; }
          const std::string& operator[](int day) const { return plans_[day - 1]; }

      private:
          std::string plans_[7] = {"gym", "", "", "", "", "", "rest"};
      };

      void show(const Week& w) {
          std::cout << w[1] << ", " << w[3] << ", " << w[7] << "\n";
      }

      int main() {
          Week w;
          w[3] = "swim";
          show(w);
      }
      ```

      ```output
      gym, swim, rest
      ```

      ### Custom indexing

      The operator is a normal function, so it can translate the index. `Week` uses days **1 to 7** (as people count them) and converts to array positions 0 to 6 inside. The conversion lives in one place.

      ### Const overloads

      `show` receives a `const Week&`, so only the `const` version of `operator[]` can be called; it returns a `const std::string&`, so `w[1] = "x"` inside `show` wouldn't compile. `main` has a non-const `Week`, so it gets the version that allows writing. The compiler picks the right one automatically.

      Like `[]` on arrays and `std::vector`, `operator[]` usually doesn't check the index (that's what `.at()` is for in the standard library).

      **Your turn:** give `Loadout` an `operator[]` taking a slot number 1 to 5 (not 0 to 4!) and returning the weapon name in that slot.
    seed: |
      #include <string>

      class Loadout {
      public:

      private:
          std::string slots_[5] = {"rifle", "pistol", "knife", "grenade", "bomb"};
      };
    solution: |
      #include <string>

      class Loadout {
      public:
          std::string& operator[](int slot) { return slots_[slot - 1]; }
          const std::string& operator[](int slot) const { return slots_[slot - 1]; }

      private:
          std::string slots_[5] = {"rifle", "pistol", "knife", "grenade", "bomb"};
      };
    harness: |
      int main() {
          Loadout l;
          CHECK_EQ("l[1]", l[1], std::string("rifle"));
          CHECK_EQ("l[3]", l[3], std::string("knife"));
          l[2] = "deagle";
          CHECK_EQ("assign through l[2]", l[2], std::string("deagle"));
          const Loadout& c = l;
          CHECK_EQ("const access c[5]", c[5], std::string("bomb"));
      }
    hints:
      - "Slot 1 is index 0, so return `slots_[slot - 1]`."
      - Write both `std::string& operator[](int)` and a `const` version returning `const std::string&`.
    more:
      - task: |
          `Grid` is a 3 by 3 board. Give it `operator()(int r, int c)` so you can write `g(1, 2)`, in two versions: a non-const one returning `char&` (so you can assign through it) and a const one returning `char`.
        seed: |
          class Grid {
          public:
              // operator() here

          private:
              char cells_[3][3] = {{'.', '.', '.'}, {'.', '.', '.'}, {'.', '.', '.'}};
          };
        solution: |
          class Grid {
          public:
              // operator() here
              char& operator()(int r, int c) { return cells_[r][c]; }
              char operator()(int r, int c) const { return cells_[r][c]; }

          private:
              char cells_[3][3] = {{'.', '.', '.'}, {'.', '.', '.'}, {'.', '.', '.'}};
          };
        harness: |
          int main() {
              Grid g;
              CHECK_EQ("starts empty", g(1, 1), '.');
              g(1, 2) = 'X';
              g(0, 0) = 'O';
              CHECK_EQ("g(1, 2)", g(1, 2), 'X');
              const Grid& c = g;
              CHECK_EQ("const access c(0, 0)", c(0, 0), 'O');
          }
        hints:
          - "`operator()` can take any number of parameters, which is why grids and matrices often use it instead of `operator[]`."
        tests: []
      - task: |
          Write class `Ring`, a vector of ints whose `operator[]` **wraps around**: index `size()` is element 0 again, and `-1` is the last element. Give it a constructor from a `std::vector<int>` and `int& operator[](int i)`.
        seed: |
          #include <vector>

          class Ring {
          public:

          private:
              std::vector<int> v_;
          };
        solution: |
          #include <vector>

          class Ring {
          public:
              explicit Ring(std::vector<int> v) : v_(v) {}
              int& operator[](int i) {
                  int n = (int)v_.size();
                  int k = i % n;
                  if (k < 0) k += n;
                  return v_[k];
              }

          private:
              std::vector<int> v_;
          };
        harness: |
          int main() {
              Ring r({10, 20, 30});
              CHECK_EQ("r[0]", r[0], 10);
              CHECK_EQ("r[3] wraps to r[0]", r[3], 10);
              CHECK_EQ("r[7] wraps to r[1]", r[7], 20);
              CHECK_EQ("r[-1] is the last", r[-1], 30);
              CHECK_EQ("r[-4] is the last too", r[-4], 30);
              r[4] = 99;
              CHECK_EQ("assigning through a wrapped index", r[1], 99);
          }
        hints:
          - "`i % n` wraps, but in C++ it can be negative for negative `i`. Add `n` when it is."
        tests: []

  - title: operator< and sorting
    id: cpp-operators-5
    text: |
      Many standard library tools need to know how to **order** your objects: `std::sort`, `std::set`, `std::map` keys, `std::min` and `std::max`. By default they all use `operator<`. Define it, and your type works with all of them.

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      struct Task {
          std::string name;
          int priority;
      };

      bool operator<(const Task& a, const Task& b) {
          if (a.priority != b.priority) {
              return a.priority > b.priority;
          }
          return a.name < b.name;
      }

      int main() {
          std::vector<Task> tasks = {{"email", 1}, {"deploy", 3}, {"backup", 3}, {"lunch", 2}};
          std::sort(tasks.begin(), tasks.end());
          for (const Task& t : tasks) std::cout << t.name << " ";
          std::cout << "\n";
      }
      ```

      ```output
      backup deploy lunch email 
      ```

      ### "Less than" means "comes first"

      `operator<` doesn't have to mean numerically smaller. It answers "should `a` come **before** `b`?" Here higher priority comes first, so for priorities it uses `>`. Ties are broken alphabetically by name. This "compare the most important key; if equal, compare the next" pattern is how multi-key sorting always works.

      ### It must be a consistent ordering

      `std::sort` requires a **strict weak ordering**. In practice:

      - `a < a` must be false (use `>` or `<`, never `>=` or `<=`).
      - If `a < b` then `!(b < a)`.
      - It must be transitive: `a < b` and `b < c` means `a < c`.

      Breaking these (for example using `<=`) is undefined behavior: sort can misorder elements, loop forever, or crash.

      **Your turn:** define `operator<` for `Player` so sorting puts the **most kills first**, and for equal kills, the name alphabetically first.
    seed: |
      #include <string>

      struct Player {
          std::string name;
          int kills;
      };

      // operator< here
    solution: |
      #include <string>

      struct Player {
          std::string name;
          int kills;
      };

      // operator< here
      bool operator<(const Player& a, const Player& b) {
          if (a.kills != b.kills) return a.kills > b.kills;
          return a.name < b.name;
      }
    harness: |
      #include <algorithm>
      int main() {
          std::vector<Player> t = {{"rain", 18}, {"ropz", 25}, {"broky", 25}, {"karrigan", 9}};
          std::sort(t.begin(), t.end());
          std::vector<std::string> names;
          for (auto& p : t) names.push_back(p.name);
          CHECK_EQ("sorted order", names, std::vector<std::string>{"broky", "ropz", "rain", "karrigan"});
      }
    hints:
      - "\"Comes first\" means \"is less\". a comes before b if a has **more** kills."
      - "`if (a.kills != b.kills) return a.kills > b.kills; return a.name < b.name;`"
    more:
      - task: |
          Define `operator<` for `Match` so sorting orders matches by map name alphabetically, and by round number within the same map.
        seed: |
          #include <string>

          struct Match {
              std::string map;
              int round;
          };

          // operator< here
        solution: |
          #include <string>

          struct Match {
              std::string map;
              int round;
          };

          // operator< here
          bool operator<(const Match& a, const Match& b) {
              if (a.map != b.map) return a.map < b.map;
              return a.round < b.round;
          }
        harness: |
          #include <algorithm>
          int main() {
              std::vector<Match> m = {{"nuke", 3}, {"dust2", 12}, {"nuke", 1}, {"dust2", 4}};
              std::sort(m.begin(), m.end());
              std::vector<std::string> got;
              for (auto& x : m) got.push_back(x.map + " " + std::to_string(x.round));
              CHECK_EQ("sorted", got, std::vector<std::string>{"dust2 4", "dust2 12", "nuke 1", "nuke 3"});
          }
        hints:
          - "`std::string` already has `<` for alphabetical order."
        tests: []
      - task: |
          Define `operator<` for playing cards: by `rank` (2 to 14) first, and for equal ranks by suit in the order `C`, `D`, `H`, `S`.
        seed: |
          struct Card {
              int rank;
              char suit;
          };

          // operator< here
        solution: |
          struct Card {
              int rank;
              char suit;
          };

          // operator< here
          static int suit_order(char s) {
              switch (s) {
                  case 'C': return 0;
                  case 'D': return 1;
                  case 'H': return 2;
                  case 'S': return 3;
              }
              return 4;
          }

          bool operator<(const Card& a, const Card& b) {
              if (a.rank != b.rank) return a.rank < b.rank;
              return suit_order(a.suit) < suit_order(b.suit);
          }
        harness: |
          #include <algorithm>
          int main() {
              std::vector<Card> hand = {{14, 'S'}, {2, 'H'}, {10, 'C'}, {2, 'C'}, {10, 'S'}, {10, 'D'}};
              std::sort(hand.begin(), hand.end());
              std::string got;
              for (auto& c : hand) got += std::to_string(c.rank) + c.suit + " ";
              CHECK_EQ("sorted hand", got, std::string("2C 2H 10C 10D 10S 14S "));
          }
        hints:
          - "The letters `C D H S` happen to be in alphabetical order, but mapping each suit to a number with a small helper makes the intent clear and easy to change."
        tests: []
