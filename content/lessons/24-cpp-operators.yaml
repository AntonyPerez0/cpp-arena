id: cpp-operators
title: Operator overloading
lang: cpp
phase: "C++: A Better C"
summary: Teach your own types to work with +, ==, <<, [] and <, so they read like built-in types.
steps:
  - title: operator+
    id: cpp-operators-1
    text: |
      Built-in types work with operators: `a + b`, `a == b`, `std::cout << a`. C++ lets **your** types work with them too. This is called **operator overloading**, and it's why `std::string` can be joined with `+` and compared with `==`: the standard library overloads those operators.

      An operator is just a function with a special name: `operator+`, `operator==`, `operator<<`, and so on. When the compiler sees `a + b` with your types, it calls `operator+(a, b)`.

      ```cpp run
      #include <iostream>

      struct Money {
          long long cents;
      };

      Money operator+(Money a, Money b) { return {a.cents + b.cents}; }
      Money operator*(Money a, int n) { return {a.cents * n}; }
      bool operator<(Money a, Money b) { return a.cents < b.cents; }

      int main() {
          Money coffee{350};
          Money cake{425};
          Money bill = coffee * 2 + cake;
          long long c = bill.cents % 100;
          std::cout << bill.cents / 100 << "." << (c < 10 ? "0" : "") << c << "\n";   // pad cents to 2 digits
          std::cout << (cake < coffee) << "\n";
      }
      ```

      ```output
      11.25
      0
      ```

      `coffee * 2 + cake` reads exactly like math. The usual precedence still applies (`*` before `+`), because overloading changes what operators **do**, not how expressions are parsed.

      ### Guidelines

      - Overload an operator only when its meaning is **obvious**: arithmetic on math-like types, comparisons, `<<` for printing, `[]` for indexing. `+` should never secretly delete a file.
      - Keep the usual behavior: `+` shouldn't change its operands; `==` should be consistent with `!=`.
      - `return {a.cents + b.cents};` builds the result with braces, filling the struct's members in order.

      **Your turn:** complete `operator-` and `operator*` (vector times a number).
    fill: |
      #include <iostream>

      struct Vec2 { double x, y; };

      Vec2 [[operator-]](Vec2 a, Vec2 b) { return {a.x - b.x, a.y - b.y}; }
      Vec2 operator*(Vec2 a, double k) { return {a.x [[*]] k, a.y * k}; }

      int main() {
          Vec2 v = (Vec2{5, 5} - Vec2{2, 1}) * 2;
          std::cout << v.x << " " << v.y << "\n";
      }
    hints:
      - "The function for `-` is named `operator-`."
    tests:
      - expect: "6 8"

  - title: operator== and !=
    id: cpp-operators-2
    text: |
      To compare your own types with `==`, define `operator==`. It returns a `bool` and usually takes both sides by `const&`:

      ```cpp run
      #include <iostream>
      #include <string>

      struct Version {
          int major, minor;
          std::string label;
      };

      bool operator==(const Version& a, const Version& b) {
          return a.major == b.major && a.minor == b.minor;
      }

      struct Point {
          int x, y;
          bool operator==(const Point&) const = default;
      };

      int main() {
          Version v1{2, 1, "stable"};
          Version v2{2, 1, "rc"};
          std::cout << (v1 == v2) << (v1 != v2) << "\n";
          std::cout << (Point{1, 2} == Point{1, 2}) << (Point{1, 2} == Point{2, 1}) << "\n";
      }
      ```

      ```output
      10
      10
      ```

      ### You decide what "equal" means

      `Version`'s `==` deliberately ignores the label: two versions with the same numbers count as equal. Writing `==` by hand lets you choose which members matter.

      ### C++20 conveniences

      - Define `==` and the compiler automatically rewrites `a != b` as `!(a == b)`. You don't need to write `!=` any more.
      - `bool operator==(const Point&) const = default;` asks the compiler to generate `==` comparing **every** member in order. That's the right choice when equality really means "all members equal".

      ### Member or free function?

      `Point`'s operator is a **member** (declared inside the struct, with one parameter: the right-hand side, while `*this` is the left). `Version`'s is a **free function** with both sides as parameters. Both work. Free functions are often preferred for symmetric operators like `==` and `+`, since they treat both sides the same way.

      **Your turn:** write `operator==` for `Score` by hand. Two scores are equal if both teams' round counts match; the map name doesn't matter.
    seed: |
      #include <string>

      struct Score {
          int t;
          int ct;
          std::string map;
      };

      // operator== here
    solution: |
      #include <string>

      struct Score {
          int t;
          int ct;
          std::string map;
      };

      // operator== here
      bool operator==(const Score& a, const Score& b) {
          return a.t == b.t && a.ct == b.ct;
      }
    harness: |
      int main() {
          Score a{13, 7, "mirage"}, b{13, 7, "nuke"}, c{7, 13, "mirage"};
          CHECK("13-7 == 13-7 on another map", a == b);
          CHECK("13-7 != 7-13", !(a == c));
          CHECK("!= works too (C++20)", a != c);
      }
    hints:
      - "`bool operator==(const Score& a, const Score& b)`"
      - Compare only `t` and `ct`.

  - title: Printing with operator<<
    id: cpp-operators-3
    text: |
      `std::cout << x` works for built-in types because the standard library defines `operator<<` for each of them. You can add one for your own types, and then they print like anything else, including into files and string streams.

      ```cpp run
      #include <iostream>
      #include <sstream>
      #include <string>

      struct Date {
          int y, m, d;
      };

      std::ostream& operator<<(std::ostream& os, const Date& date) {
          os << date.y << "-";
          if (date.m < 10) os << "0";
          os << date.m << "-";
          if (date.d < 10) os << "0";
          return os << date.d;
      }

      int main() {
          Date launch{1969, 7, 20};
          std::cout << "launch: " << launch << "\n";
          std::ostringstream text;
          text << launch;
          std::string s = text.str();
          std::cout << s.size() << " chars\n";
      }
      ```

      ```output
      launch: 1969-07-20
      10 chars
      ```

      ### The required shape

      ```cpp
      std::ostream& operator<<(std::ostream& os, const T& value)
      ```

      - The **left** operand is the stream, so this must be a free function (you can't add members to `std::ostream`).
      - Take the value by `const&`: printing shouldn't copy or change it.
      - **Return the stream** by reference. That's what makes chaining work: `std::cout << "launch: " << launch << "\n"` is evaluated as `((std::cout << "launch: ") << launch) << "\n"`, so each `<<` needs the stream back from the previous one.

      Because it takes any `std::ostream`, the same operator writes to `std::cout`, to a file (`std::ofstream`), or to a string (`std::ostringstream`), as the example shows.

      Don't print a trailing newline inside `operator<<`; let the caller decide.

      **Your turn:** make `Score` printable as `T 13 - 7 CT`.
    seed: |
      #include <iostream>

      struct Score {
          int t;
          int ct;
      };

      // operator<< here
    solution: |
      #include <iostream>

      struct Score {
          int t;
          int ct;
      };

      // operator<< here
      std::ostream& operator<<(std::ostream& os, const Score& s) {
          return os << "T " << s.t << " - " << s.ct << " CT";
      }
    harness: |
      #include <sstream>
      int main() {
          std::ostringstream out;
          out << Score{13, 7};
          CHECK_EQ("print 13-7", out.str(), std::string("T 13 - 7 CT"));
          std::ostringstream out2;
          out2 << Score{0, 0} << "|" << Score{16, 14};
          CHECK_EQ("chained", out2.str(), std::string("T 0 - 0 CT|T 16 - 14 CT"));
      }
    hints:
      - "Signature: `std::ostream& operator<<(std::ostream& os, const Score& s)`."
      - "`return os << \"T \" << s.t << \" - \" << s.ct << \" CT\";`"

  - title: operator[]
    id: cpp-operators-4
    text: |
      `operator[]` lets your type be indexed like an array: `obj[i]`. It must be a **member** function. Two versions are usually provided:

      ```cpp
      T& operator[](int i);               // for non-const objects: allows obj[i] = x
      const T& operator[](int i) const;   // for const objects: read-only
      ```

      Returning a **reference** is what makes assignment through it work.

      ```cpp run
      #include <iostream>
      #include <string>

      class Week {
      public:
          std::string& operator[](int day) { return plans_[day - 1]; }
          const std::string& operator[](int day) const { return plans_[day - 1]; }

      private:
          std::string plans_[7] = {"gym", "", "", "", "", "", "rest"};
      };

      void show(const Week& w) {
          std::cout << w[1] << ", " << w[3] << ", " << w[7] << "\n";
      }

      int main() {
          Week w;
          w[3] = "swim";
          show(w);
      }
      ```

      ```output
      gym, swim, rest
      ```

      ### Custom indexing

      The operator is a normal function, so it can translate the index. `Week` uses days **1 to 7** (as people count them) and converts to array positions 0 to 6 inside. The conversion lives in one place.

      ### Const overloads

      `show` receives a `const Week&`, so only the `const` version of `operator[]` can be called; it returns a `const std::string&`, so `w[1] = "x"` inside `show` wouldn't compile. `main` has a non-const `Week`, so it gets the version that allows writing. The compiler picks the right one automatically.

      Like `[]` on arrays and `std::vector`, `operator[]` usually doesn't check the index (that's what `.at()` is for in the standard library).

      **Your turn:** give `Loadout` an `operator[]` taking a slot number 1 to 5 (not 0 to 4!) and returning the weapon name in that slot.
    seed: |
      #include <string>

      class Loadout {
      public:

      private:
          std::string slots_[5] = {"rifle", "pistol", "knife", "grenade", "bomb"};
      };
    solution: |
      #include <string>

      class Loadout {
      public:
          std::string& operator[](int slot) { return slots_[slot - 1]; }
          const std::string& operator[](int slot) const { return slots_[slot - 1]; }

      private:
          std::string slots_[5] = {"rifle", "pistol", "knife", "grenade", "bomb"};
      };
    harness: |
      int main() {
          Loadout l;
          CHECK_EQ("l[1]", l[1], std::string("rifle"));
          CHECK_EQ("l[3]", l[3], std::string("knife"));
          l[2] = "deagle";
          CHECK_EQ("assign through l[2]", l[2], std::string("deagle"));
          const Loadout& c = l;
          CHECK_EQ("const access c[5]", c[5], std::string("bomb"));
      }
    hints:
      - "Slot 1 is index 0, so return `slots_[slot - 1]`."
      - Write both `std::string& operator[](int)` and a `const` version returning `const std::string&`.

  - title: operator< and sorting
    id: cpp-operators-5
    text: |
      Many standard library tools need to know how to **order** your objects: `std::sort`, `std::set`, `std::map` keys, `std::min` and `std::max`. By default they all use `operator<`. Define it, and your type works with all of them.

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      struct Task {
          std::string name;
          int priority;
      };

      bool operator<(const Task& a, const Task& b) {
          if (a.priority != b.priority) {
              return a.priority > b.priority;
          }
          return a.name < b.name;
      }

      int main() {
          std::vector<Task> tasks = {{"email", 1}, {"deploy", 3}, {"backup", 3}, {"lunch", 2}};
          std::sort(tasks.begin(), tasks.end());
          for (const Task& t : tasks) std::cout << t.name << " ";
          std::cout << "\n";
      }
      ```

      ```output
      backup deploy lunch email 
      ```

      ### "Less than" means "comes first"

      `operator<` doesn't have to mean numerically smaller. It answers "should `a` come **before** `b`?" Here higher priority comes first, so for priorities it uses `>`. Ties are broken alphabetically by name. This "compare the most important key; if equal, compare the next" pattern is how multi-key sorting always works.

      ### It must be a consistent ordering

      `std::sort` requires a **strict weak ordering**. In practice:

      - `a < a` must be false (use `>` or `<`, never `>=` or `<=`).
      - If `a < b` then `!(b < a)`.
      - It must be transitive: `a < b` and `b < c` means `a < c`.

      Breaking these (for example using `<=`) is undefined behavior: sort can misorder elements, loop forever, or crash.

      **Your turn:** define `operator<` for `Player` so sorting puts the **most kills first**, and for equal kills, the name alphabetically first.
    seed: |
      #include <string>

      struct Player {
          std::string name;
          int kills;
      };

      // operator< here
    solution: |
      #include <string>

      struct Player {
          std::string name;
          int kills;
      };

      // operator< here
      bool operator<(const Player& a, const Player& b) {
          if (a.kills != b.kills) return a.kills > b.kills;
          return a.name < b.name;
      }
    harness: |
      #include <algorithm>
      int main() {
          std::vector<Player> t = {{"rain", 18}, {"ropz", 25}, {"broky", 25}, {"karrigan", 9}};
          std::sort(t.begin(), t.end());
          std::vector<std::string> names;
          for (auto& p : t) names.push_back(p.name);
          CHECK_EQ("sorted order", names, std::vector<std::string>{"broky", "ropz", "rain", "karrigan"});
      }
    hints:
      - "\"Comes first\" means \"is less\". a comes before b if a has **more** kills."
      - "`if (a.kills != b.kills) return a.kills > b.kills; return a.name < b.name;`"
