          class Collatz {
          public:
              explicit Collatz(long long start) : start_(start) {}

              class Iterator {
              public:
                  Iterator(long long v, bool done) : v_(v), done_(done) {}
                  long long operator*() const { return v_; }
                  Iterator& operator++() {
