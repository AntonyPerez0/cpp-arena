        solution: |
          #include <cstddef>
          #include <istream>
          #include <iterator>
          #include <string>

          class Lines {
          public:
              explicit Lines(std::istream& in) : in_(&in) {}

              class Iterator {
              public:
                  using iterator_category = std::input_iterator_tag;
                  using value_type = std::string;
                  using difference_type = std::ptrdiff_t;
                  using pointer = const std::string*;
                  using reference = const std::string&;

                  Iterator() = default;
                  explicit Iterator(std::istream* in) : in_(in) { read(); }
                  const std::string& operator*() const { return line_; }
                  Iterator& operator++() {
                      read();
                      return *this;
                  }
                  void operator++(int) { read(); }
                  bool operator==(const Iterator& o) const { return in_ == o.in_; }

              private:
                  void read() {
                      if (in_ && !std::getline(*in_, line_)) in_ = nullptr;
                  }
                  std::istream* in_ = nullptr;
                  std::string line_;
              };

              Iterator begin() const { return Iterator(in_); }
              Iterator end() const { return Iterator(nullptr); }

          private:
              std::istream* in_;
          };
        harness: |
          #include <algorithm>
          int main() {
              static_assert(std::input_iterator<Lines::Iterator>, "must satisfy std::input_iterator");
