          };
        solution: |
          #include <cstddef>
          #include <iterator>

          class Span {
          public:
              Span(int lo, int hi) : lo_(lo), hi_(hi) {}

              class Iterator {
              public:
                  using iterator_category = std::bidirectional_iterator_tag;
                  using value_type = int;
                  using difference_type = std::ptrdiff_t;

                  Iterator() = default;
                  explicit Iterator(int v) : v_(v) {}
                  int operator*() const { return v_; }
                  Iterator& operator++() {
                      ++v_;
                      return *this;
                  }
                  Iterator operator++(int) {
                      Iterator old = *this;
                      ++v_;
                      return old;
                  }
                  Iterator& operator--() {
                      --v_;
                      return *this;
                  }
                  Iterator operator--(int) {
                      Iterator old = *this;
                      --v_;
                      return old;
                  }
                  bool operator==(const Iterator& o) const { return v_ == o.v_; }

              private:
                  int v_ = 0;
              };

              Iterator begin() const { return Iterator(lo_); }
              Iterator end() const { return Iterator(hi_ < lo_ ? lo_ : hi_); }

          private:
              int lo_, hi_;
          };
