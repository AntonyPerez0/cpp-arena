      - task: |
          Write an iterator that **skips** values. `Evens(v)` is a view of a `std::vector<int>` whose iterator only stops on even numbers: `++` moves to the next even one, and `begin()` starts at the first even one.
        seed: |
          #include <cstddef>
          #include <vector>

          class Evens {
          public:
              explicit Evens(const std::vector<int>& v) : v_(v) {}

              class Iterator {
              public:
                  Iterator(const std::vector<int>* v, std::size_t i);
                  // operator*, operator++, operator== here
