                  bool operator==(const Iterator& o) const { return i_ == o.i_; }

              private:
                  const Zip* z_;
                  std::size_t i_;
              };

              Iterator begin() const { return Iterator(this, 0); }
              Iterator end() const { return Iterator(this, std::min(a_.size(), b_.size())); }

          private:
