              void add(const std::string& name) { players_.push_back(name); }
              // begin() and end() here
              std::vector<std::string>::iterator begin() { return players_.begin(); }
              std::vector<std::string>::iterator end() { return players_.end(); }
              std::vector<std::string>::const_iterator begin() const { return players_.begin(); }
              std::vector<std::string>::const_iterator end() const { return players_.end(); }

