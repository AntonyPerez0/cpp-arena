          template <typename A, typename B>
          class Zip {
          public:
              Zip(const std::vector<A>& a, const std::vector<B>& b) : a_(a), b_(b) {}

              class Iterator {
              public:
                  Iterator(const Zip* z, std::size_t i) : z_(z), i_(i) {}
