          A **bidirectional** iterator can also go back with `--`. Write `Span(lo, hi)`, a range of the ints `lo` to `hi - 1`, whose iterator satisfies `std::bidirectional_iterator`: the member types (`std::bidirectional_iterator_tag`), a default constructor, `*`, `==`, and pre- and post- `++` and `--`. The tests walk it backwards with `std::reverse_iterator`.
        seed: |
          #include <cstddef>
          #include <iterator>

          class Span {
          public:
              Span(int lo, int hi) : lo_(lo), hi_(hi) {}

