  - title: Loop over a vector
    id: cpp-vector-2
    text: |
      Looping over a vector is best done with a range-based `for`. The reference symbol decides whether you get copies or the real elements:

      ```cpp
      for (auto x : v)          // x is a copy of each element
      for (const auto& x : v)   // x refers to each element, read-only: no copies
      for (auto& x : v)         // x refers to each element, and you can modify it
      ```

      For `int` the copy is cheap, but for strings or objects, `const auto&` avoids copying every element. Use `auto&` when you want to change the vector's elements in place.

      ```cpp run
      #include <iostream>
      #include <vector>

      std::vector<double> scaled(const std::vector<double>& v, double k) {
          std::vector<double> out;
          out.reserve(v.size());
          for (double x : v) {
              out.push_back(x * k);
          }
          return out;
      }

      int main() {
          std::vector<double> prices = {1.5, 2.0, 4.25};
          for (auto& p : prices) p += 1;
          std::vector<double> doubled = scaled(prices, 2);
          for (const auto& p : doubled) std::cout << p << " ";
          std::cout << "\n";
      }
      ```

      ```output
      5 6 10.5 
      ```

      ### Passing and returning vectors

      - Take a vector parameter by `const&` when the function only reads it; by value would copy every element.
      - Take it by `&` when the function must modify the caller's vector.
      - **Return** a new vector by value freely. Modern C++ moves (or directly constructs) the result instead of copying it, so returning even a large vector is cheap. You'll see why in the move semantics module.

      `out.reserve(n)` sets the capacity up front when you know the final size, so `push_back` never has to reallocate.

      **Your turn:** write `std::vector<int> running_total(const std::vector<int>& v)` that returns the prefix sums. `{1, 2, 3, 4}` becomes `{1, 3, 6, 10}`.
    seed: |
      #include <vector>

      std::vector<int> running_total(const std::vector<int>& v) {

      }
    solution: |
      #include <vector>

      std::vector<int> running_total(const std::vector<int>& v) {
          std::vector<int> out;
          int sum = 0;
          for (int x : v) {
              sum += x;
              out.push_back(sum);
          }
          return out;
      }
    harness: |
      int main() {
          CHECK_EQ("{1,2,3,4}", running_total({1, 2, 3, 4}), std::vector<int>{1, 3, 6, 10});
          CHECK_EQ("{}", running_total({}), std::vector<int>{});
          CHECK_EQ("{5,-5,5}", running_total({5, -5, 5}), std::vector<int>{5, 0, 5});
      }
    hints:
      - Start an empty result vector and a running sum.
      - For each element, add it to the sum and `push_back` the sum.
    more:
      - task: |
          Write `std::vector<int> only_positive(const std::vector<int>& v)` that returns a new vector with just the elements greater than 0, in the same order.
        seed: |
          #include <vector>

          std::vector<int> only_positive(const std::vector<int>& v) {

          }
        solution: |
          #include <vector>

          std::vector<int> only_positive(const std::vector<int>& v) {
              std::vector<int> out;
              for (int x : v) {
                  if (x > 0) out.push_back(x);
              }
              return out;
          }
        harness: |
          int main() {
              CHECK_EQ("{3,-1,0,5}", only_positive({3, -1, 0, 5}), std::vector<int>{3, 5});
              CHECK_EQ("{-2,-3}", only_positive({-2, -3}), std::vector<int>{});
              CHECK_EQ("{}", only_positive({}), std::vector<int>{});
          }
        hints:
          - Start with an empty vector and `push_back` each element you keep.
        tests: []
      - task: |
          Write `std::vector<int> pairwise_diff(const std::vector<int>& v)` that returns the difference between each element and the one before it. `{3, 7, 4}` becomes `{4, -3}`. A vector with fewer than 2 elements gives `{}`.
        seed: |
          #include <vector>

          std::vector<int> pairwise_diff(const std::vector<int>& v) {

          }
        solution: |
          #include <vector>

          std::vector<int> pairwise_diff(const std::vector<int>& v) {
              std::vector<int> out;
              for (std::size_t i = 1; i < v.size(); i++) {
                  out.push_back(v[i] - v[i - 1]);
              }
              return out;
          }
        harness: |
          int main() {
              CHECK_EQ("{3,7,4}", pairwise_diff({3, 7, 4}), std::vector<int>{4, -3});
              CHECK_EQ("{1,1,1,1}", pairwise_diff({1, 1, 1, 1}), std::vector<int>{0, 0, 0});
              CHECK_EQ("{5}", pairwise_diff({5}), std::vector<int>{});
              CHECK_EQ("{}", pairwise_diff({}), std::vector<int>{});
          }
        hints:
          - Start the loop at index 1 so `v[i - 1]` always exists. Using `size_t` and `i < v.size()`, an empty vector simply skips the loop.
        tests: []

  - title: Insert and erase
    id: cpp-vector-3
    text: |
      Adding or removing elements in the **middle** of a vector uses **iterators**: objects that mark a position in a container. You'll study them in depth later; for now:

      - `v.begin()` is the position of the first element.
      - `v.begin() + i` is the position of element `i`.
      - `v.end()` is the position **one past** the last element.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<std::string> steps = {"wake", "coffee", "work"};
          steps.insert(steps.begin() + 1, "shower");
          steps.insert(steps.end(), "sleep");
          steps.erase(steps.begin() + 2);
          for (const auto& s : steps) std::cout << s << " ";
          std::cout << "(" << steps.size() << ")\n";
      }
      ```

      ```output
      wake shower work sleep (4)
      ```

      - `insert(pos, value)` puts `value` **before** `pos`. Everything after it shifts one place to the right.
      - `erase(pos)` removes the element at `pos`. Everything after it shifts left.
      - `clear()` removes everything.

      ### Cost

      Because elements are contiguous, inserting or erasing in the middle must **move** every element after that position: O(n). Adding or removing at the **end** is fast (O(1)). If you do lots of middle insertions on big data, a different container may fit better, but for most sizes a vector is still the fastest choice, because moving contiguous memory is very quick.

      ### Validate positions

      `erase` and `insert` don't check their positions: erasing `v.begin() + 10` in a 3-element vector is undefined behavior. When an index comes from outside, check `0 <= i` and `i < v.size()` first (converting carefully between `int` and the unsigned `size()`).

      **Your turn:** write `void remove_at(std::vector<std::string>& v, int i)` that removes element `i` if it's a valid index and does nothing otherwise.
    seed: |
      #include <string>
      #include <vector>

      void remove_at(std::vector<std::string>& v, int i) {

      }
    solution: |
      #include <string>
      #include <vector>

      void remove_at(std::vector<std::string>& v, int i) {
          if (i < 0 || i >= (int)v.size()) return;
          v.erase(v.begin() + i);
      }
    harness: |
      int main() {
          std::vector<std::string> v = {"a", "b", "c", "d"};
          remove_at(v, 1);
          CHECK_EQ("remove index 1", v, std::vector<std::string>{"a", "c", "d"});
          remove_at(v, 2);
          CHECK_EQ("remove last", v, std::vector<std::string>{"a", "c"});
          remove_at(v, 5);
          CHECK_EQ("index too big: unchanged", v, std::vector<std::string>{"a", "c"});
          remove_at(v, -1);
          CHECK_EQ("negative index: unchanged", v, std::vector<std::string>{"a", "c"});
      }
    hints:
      - "Guard first: `if (i < 0 || i >= (int)v.size()) return;`"
      - "`v.erase(v.begin() + i);`"
    more:
      - task: |
          Write `void insert_at(std::vector<std::string>& v, int i, const std::string& s)` that inserts `s` so it ends up at index `i`. Valid positions are `0` up to `v.size()` (which appends at the end); for any other `i`, do nothing.
        seed: |
          #include <string>
          #include <vector>

          void insert_at(std::vector<std::string>& v, int i, const std::string& s) {

          }
        solution: |
          #include <string>
          #include <vector>

          void insert_at(std::vector<std::string>& v, int i, const std::string& s) {
              if (i < 0 || i > (int)v.size()) return;
              v.insert(v.begin() + i, s);
          }
        harness: |
          int main() {
              std::vector<std::string> v = {"a", "c"};
              insert_at(v, 1, "b");
              CHECK_EQ("insert in the middle", v, std::vector<std::string>{"a", "b", "c"});
              insert_at(v, 0, "start");
              CHECK_EQ("insert at the front", v, std::vector<std::string>{"start", "a", "b", "c"});
              insert_at(v, 4, "end");
              CHECK_EQ("insert at size() appends", v, std::vector<std::string>{"start", "a", "b", "c", "end"});
              insert_at(v, 9, "x");
              insert_at(v, -1, "x");
              CHECK_EQ("bad positions change nothing", v.size(), 5);
          }
        hints:
          - "`v.insert(v.begin() + i, s)` inserts before position `i`, so `s` ends up at index `i`."
          - Unlike `erase`, `i == v.size()` is valid here.
        tests: []
      - task: |
          Write `void remove_all(std::vector<int>& v, int x)` that removes every element equal to `x`, keeping the others in order. Erasing inside a loop is easy to get wrong: after `erase`, the next element moves into the current index.
        seed: |
          #include <vector>

          void remove_all(std::vector<int>& v, int x) {

          }
        solution: |
          #include <vector>

          void remove_all(std::vector<int>& v, int x) {
              std::size_t i = 0;
              while (i < v.size()) {
                  if (v[i] == x) {
                      v.erase(v.begin() + i);
                  } else {
                      i++;
                  }
              }
          }
        harness: |
          int main() {
              std::vector<int> v = {3, 1, 3, 3, 2, 3};
              remove_all(v, 3);
              CHECK_EQ("remove every 3", v, std::vector<int>{1, 2});
              std::vector<int> w = {7, 7};
              remove_all(w, 7);
              CHECK_EQ("remove everything", w, std::vector<int>{});
              std::vector<int> u = {1, 2};
              remove_all(u, 9);
              CHECK_EQ("nothing to remove", u, std::vector<int>{1, 2});
          }
        hints:
          - Only move to the next index when you did **not** erase. Otherwise two equal elements in a row would skip one.
        tests: []

  - title: 2D vectors
    id: cpp-vector-4
    text: |
      A vector can hold anything, including other vectors. A **vector of vectors** gives you a 2D grid whose size is decided at run time, without any manual memory management:

      ```cpp run
      #include <iostream>
      #include <vector>

      int main() {
          int rows = 3, cols = 4;
          std::vector<std::vector<int>> grid(rows, std::vector<int>(cols, 0));
          for (int r = 0; r < rows; r++) {
              for (int c = 0; c < cols; c++) {
                  grid[r][c] = r * cols + c;
              }
          }
          std::cout << grid[2][3] << " " << grid.size() << "x" << grid[0].size() << "\n";
          int diagonal = 0;
          for (int i = 0; i < rows; i++) diagonal += grid[i][i];
          std::cout << diagonal << "\n";
      }
      ```

      ```output
      11 3x4
      15
      ```

      ### Reading the declaration

      `std::vector<std::vector<int>> grid(rows, std::vector<int>(cols, 0))` means: `rows` copies of "a vector of `cols` zeros". Each row is its own independent vector.

      ### Sizes

      - `grid.size()` is the number of rows.
      - `grid[r].size()` is the length of row `r`. Rows can even have different lengths (a "jagged" grid), which is why the code asks each row.
      - `grid[r][c]` indexes like a 2D array.

      ### Building a result of a different shape

      When the output has a different shape from the input (like swapping rows and columns), create the output grid with the **new** dimensions first, then fill it with nested loops, reading from the input's `[r][c]` and writing to the output's corresponding position.

      Compared with the C version (an array of row pointers with a `malloc` per row and careful freeing), this is shorter, can't leak, and copies correctly. The trade-off is that rows are separate allocations; performance-critical code sometimes uses one flat vector of `rows * cols` elements instead.

      **Your turn:** write `std::vector<std::vector<int>> transpose(const std::vector<std::vector<int>>& m)` that swaps rows and columns. A 2x3 matrix becomes 3x2. You can assume every row has the same length and there's at least one row.
    seed: |
      #include <vector>

      std::vector<std::vector<int>> transpose(const std::vector<std::vector<int>>& m) {

      }
    solution: |
      #include <vector>

      std::vector<std::vector<int>> transpose(const std::vector<std::vector<int>>& m) {
          std::size_t rows = m.size(), cols = m[0].size();
          std::vector<std::vector<int>> t(cols, std::vector<int>(rows));
          for (std::size_t r = 0; r < rows; r++)
              for (std::size_t c = 0; c < cols; c++)
                  t[c][r] = m[r][c];
          return t;
      }
    harness: |
      int main() {
          std::vector<std::vector<int>> m = {{1, 2, 3}, {4, 5, 6}};
          auto t = transpose(m);
          CHECK_EQ("rows", t.size(), 3);
          CHECK_EQ("row 0", t[0], std::vector<int>{1, 4});
          CHECK_EQ("row 2", t[2], std::vector<int>{3, 6});
          auto one = transpose({{7}});
          CHECK_EQ("1x1", one[0], std::vector<int>{7});
      }
    hints:
      - "Make the result with `cols` rows of `rows` ints each."
      - "`t[c][r] = m[r][c];` in a nested loop."
    more:
      - task: |
          Write `std::vector<std::vector<char>> make_grid(int rows, int cols, char fill)` that returns a `rows` by `cols` grid where every cell is `fill`.
        seed: |
          #include <vector>

          std::vector<std::vector<char>> make_grid(int rows, int cols, char fill) {

          }
        solution: |
          #include <vector>

          std::vector<std::vector<char>> make_grid(int rows, int cols, char fill) {
              return std::vector<std::vector<char>>(rows, std::vector<char>(cols, fill));
          }
        harness: |
          int main() {
              auto g = make_grid(3, 4, '.');
              CHECK_EQ("rows", g.size(), 3);
              CHECK_EQ("cols", g[0].size(), 4);
              CHECK_EQ("every cell filled", g[2][3], '.');
              g[1][2] = '#';
              CHECK_EQ("rows are separate", g[0][2], '.');
              auto e = make_grid(0, 5, '#');
              CHECK_EQ("zero rows", e.size(), 0);
          }
        hints:
          - "`std::vector<char>(cols, fill)` is one row. `std::vector<std::vector<char>>(rows, row)` makes `rows` copies of it."
        tests: []
      - task: |
          The grid is a vector of strings, one string per row, where `#` is a wall. Write `int count_neighbors(const std::vector<std::string>& g, int r, int c)` that counts the `#` cells among the **8** cells around `(r, c)` (not counting the cell itself). Cells outside the grid don't count.
        seed: |
          #include <string>
          #include <vector>

          int count_neighbors(const std::vector<std::string>& g, int r, int c) {

          }
        solution: |
          #include <string>
          #include <vector>

          int count_neighbors(const std::vector<std::string>& g, int r, int c) {
              int count = 0;
              for (int dr = -1; dr <= 1; dr++) {
                  for (int dc = -1; dc <= 1; dc++) {
                      if (dr == 0 && dc == 0) continue;
                      int nr = r + dr, nc = c + dc;
                      if (nr < 0 || nr >= (int)g.size()) continue;
                      if (nc < 0 || nc >= (int)g[nr].size()) continue;
                      if (g[nr][nc] == '#') count++;
                  }
              }
              return count;
          }
        harness: |
          int main() {
              std::vector<std::string> g = {
                  "#.#",
                  ".#.",
                  "##.",
              };
              CHECK_EQ("middle cell", count_neighbors(g, 1, 1), 4);
              CHECK_EQ("top-left corner", count_neighbors(g, 0, 0), 1);
              CHECK_EQ("bottom-right corner", count_neighbors(g, 2, 2), 2);
              CHECK_EQ("top edge", count_neighbors(g, 0, 1), 3);
          }
        hints:
          - Two loops for the offsets `-1`, `0`, `+1` in each direction, skipping `(0, 0)`.
          - Check that the neighbor's row and column are inside the grid before reading it.
        tests: []

  - title: string search and substrings
    id: cpp-vector-5
    text: |
      `std::string` has many useful member functions. The two you'll use most for text processing are `find` and `substr`:

      ```cpp run
      #include <iostream>
      #include <string>

      int main() {
          std::string email = "ada.lovelace@example.com";
          std::size_t at = email.find('@');
          std::string user = email.substr(0, at);
          std::string domain = email.substr(at + 1);
          std::cout << user << " | " << domain << "\n";
          std::size_t dot = user.find('.');
          std::cout << user.substr(dot + 1) << "\n";
          std::cout << (email.find("xyz") == std::string::npos) << "\n";
          std::cout << email.rfind('.') << "\n";
      }
      ```

      ```output
      ada.lovelace | example.com
      lovelace
      1
      20
      ```

      ### find

      `s.find(x)` searches for a character or substring and returns the **index** of the first match. If there's no match it returns the special value `std::string::npos` (the largest possible `size_t`). **Always** check for `npos` before using the result: using it as a position leads to wrong results or out-of-range errors. `rfind` searches from the end. Both can take a starting position as a second argument.

      ### substr

      `s.substr(pos, len)` returns a **new** string of `len` characters starting at `pos`. Leave out `len` to take everything to the end. If `pos` is beyond the end of the string, it throws an error, so make sure it's valid.

      ### Store find's result as size_t

      `find` returns a `std::size_t`. Storing it in an `int` is a bad habit: comparing that `int` with `npos` only works through a conversion quirk, the compiler warns about mixing signed and unsigned, and it breaks for very long strings. Use `std::size_t` (or `auto`).

      **Your turn:** write `std::string map_name(const std::string& s)` that strips a prefix ending in the first `_`. `"de_dust2"` becomes `"dust2"`; a string without `_` is returned unchanged.
    seed: |
      #include <string>

      std::string map_name(const std::string& s) {

      }
    solution: |
      #include <string>

      std::string map_name(const std::string& s) {
          std::size_t pos = s.find('_');
          if (pos == std::string::npos) return s;
          return s.substr(pos + 1);
      }
    harness: |
      int main() {
          CHECK_EQ("de_dust2", map_name("de_dust2"), std::string("dust2"));
          CHECK_EQ("cs_office", map_name("cs_office"), std::string("office"));
          CHECK_EQ("no underscore", map_name("anubis"), std::string("anubis"));
          CHECK_EQ("only first _", map_name("ar_baggage_v2"), std::string("baggage_v2"));
      }
    hints:
      - "`s.find('_')` gives the index, or `std::string::npos`."
      - "`s.substr(pos + 1)` is everything after it."
    more:
      - task: |
          Write `std::string file_extension(const std::string& path)` that returns the text after the **last** `.`, or `""` if there is no dot. `"archive.tar.gz"` gives `"gz"`.
        seed: |
          #include <string>

          std::string file_extension(const std::string& path) {

          }
        solution: |
          #include <string>

          std::string file_extension(const std::string& path) {
              std::size_t pos = path.rfind('.');
              if (pos == std::string::npos) return "";
              return path.substr(pos + 1);
          }
        harness: |
          int main() {
              CHECK_EQ("demo.dem", file_extension("demo.dem"), std::string("dem"));
              CHECK_EQ("archive.tar.gz", file_extension("archive.tar.gz"), std::string("gz"));
              CHECK_EQ("no dot", file_extension("README"), std::string(""));
              CHECK_EQ("ends with a dot", file_extension("odd."), std::string(""));
          }
        hints:
          - "`rfind` searches from the end, so it finds the last dot."
          - "`substr(pos + 1)` is everything after it. When the dot is the last character, that's an empty string."
        tests: []
      - task: |
          Write `std::string replace_all(std::string s, const std::string& from, const std::string& to)` that replaces every occurrence of `from` (which is never empty) with `to`. Careful: if `to` contains `from`, like replacing `"a"` with `"aa"`, don't keep finding the text you just inserted.
        seed: |
          #include <string>

          std::string replace_all(std::string s, const std::string& from, const std::string& to) {

          }
        solution: |
          #include <string>

          std::string replace_all(std::string s, const std::string& from, const std::string& to) {
              std::size_t pos = s.find(from);
              while (pos != std::string::npos) {
                  s.replace(pos, from.size(), to);
                  pos = s.find(from, pos + to.size());
              }
              return s;
          }
        harness: |
          int main() {
              CHECK_EQ("gg -> GG", replace_all("gg wp gg", "gg", "GG"), std::string("GG wp GG"));
              CHECK_EQ("longer replacement", replace_all("a-b", "-", " to "), std::string("a to b"));
              CHECK_EQ("a -> aa doesn't loop forever", replace_all("aaa", "a", "aa"), std::string("aaaaaa"));
              CHECK_EQ("no match", replace_all("dust2", "x", "y"), std::string("dust2"));
              CHECK_EQ("remove text", replace_all("r u s h", " ", ""), std::string("rush"));
          }
        hints:
          - "`s.replace(pos, from.size(), to)` swaps one match for the new text."
          - Continue searching **after** the inserted text, at `pos + to.size()`.
        tests: []

  - title: "Challenge: split"
    id: cpp-vector-6
    text: |
      Splitting a string on a separator is one of the most common text-processing tasks: CSV lines, paths, configuration values, command arguments. It's worth knowing how to write it correctly, because the edge cases trip people up.

      ### The approach

      Keep a `start` position (initially 0). Repeatedly `find` the separator from `start`:

      - If found at position `p`, the piece is `s.substr(start, p - start)`. Add it, then continue from `start = p + 1`.
      - If not found, the rest of the string, `s.substr(start)`, is the **last** piece. Add it and stop.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      std::vector<std::string> words(const std::string& s) {
          std::vector<std::string> out;
          std::string current;
          for (char c : s) {
              if (c == ' ') {
                  if (!current.empty()) out.push_back(current);
                  current.clear();
              } else {
                  current += c;
              }
          }
          if (!current.empty()) out.push_back(current);
          return out;
      }

      int main() {
          auto w = words("  the  quick brown   fox ");
          std::cout << w.size() << ":";
          for (const auto& x : w) std::cout << " [" << x << "]";
          std::cout << "\n";
      }
      ```

      ```output
      4: [the] [quick] [brown] [fox]
      ```

      This example shows a different approach (building each piece character by character) for a different rule: splitting into **words**, where runs of spaces are skipped and empty pieces are dropped.

      ### Your rule is different: keep empty pieces

      For CSV-like data, `"a,,b"` has three fields, the middle one empty, and `""` is one empty field. Dropping empty pieces would shift columns and corrupt data. With the find-based approach, the rule "the text after the last separator is always one more piece" gives exactly these results: `n` separators always produce `n + 1` pieces. Test your function on `"a,,b"`, `""`, `","` and `"a,"` before submitting.

      **Your turn:** write `std::vector<std::string> split(const std::string& s, char sep)` that breaks a string at every `sep`.

      - `split("a,b,c", ',')` gives `{"a", "b", "c"}`
      - `split("a,,b", ',')` gives `{"a", "", "b"}` (empty pieces are kept)
      - `split("", ',')` gives `{""}`
    seed: |
      #include <string>
      #include <vector>

      std::vector<std::string> split(const std::string& s, char sep) {

      }
    solution: |
      #include <string>
      #include <vector>

      std::vector<std::string> split(const std::string& s, char sep) {
          std::vector<std::string> parts;
          std::string cur;
          for (char c : s) {
              if (c == sep) {
                  parts.push_back(cur);
                  cur.clear();
              } else {
                  cur += c;
              }
          }
          parts.push_back(cur);
          return parts;
      }
    harness: |
      int main() {
          using V = std::vector<std::string>;
          CHECK_EQ("a,b,c", split("a,b,c", ','), V{"a", "b", "c"});
          CHECK_EQ("a,,b", split("a,,b", ','), V{"a", "", "b"});
          CHECK_EQ("empty", split("", ','), V{""});
          CHECK_EQ("no separator", split("dust2", ','), V{"dust2"});
          CHECK_EQ("spaces", split("rush b now", ' '), V{"rush", "b", "now"});
          CHECK_EQ("trailing sep", split("x;", ';'), V{"x", ""});
      }
    hints:
      - Build the current piece character by character.
      - When you hit `sep`, push the current piece and clear it. After the loop, push the last piece.
    more:
      - task: |
          Write the opposite of `split`: `std::string join(const std::vector<std::string>& parts, const std::string& sep)` puts `sep` between the parts. `join({"a", "b", "c"}, ", ")` gives `"a, b, c"`.
        seed: |
          #include <string>
          #include <vector>

          std::string join(const std::vector<std::string>& parts, const std::string& sep) {

          }
        solution: |
          #include <string>
          #include <vector>

          std::string join(const std::vector<std::string>& parts, const std::string& sep) {
              std::string out;
              for (std::size_t i = 0; i < parts.size(); i++) {
                  if (i > 0) out += sep;
                  out += parts[i];
              }
              return out;
          }
        harness: |
          int main() {
              using V = std::vector<std::string>;
              CHECK_EQ("three parts", join(V{"a", "b", "c"}, ", "), std::string("a, b, c"));
              CHECK_EQ("one part", join(V{"dust2"}, "-"), std::string("dust2"));
              CHECK_EQ("no parts", join(V{}, "-"), std::string(""));
              CHECK_EQ("empty parts are kept", join(V{"a", "", "b"}, ","), std::string("a,,b"));
          }
        hints:
          - Add `sep` before every part except the first.
        tests: []
      - task: |
          Write `std::vector<std::string> split_words(const std::string& s)` that splits on **runs** of spaces and never returns empty words. `"  rush   b  "` gives `{"rush", "b"}`, and a string of only spaces gives `{}`.
        seed: |
          #include <string>
          #include <vector>

          std::vector<std::string> split_words(const std::string& s) {

          }
        solution: |
          #include <string>
          #include <vector>

          std::vector<std::string> split_words(const std::string& s) {
              std::vector<std::string> words;
              std::string cur;
              for (char c : s) {
                  if (c == ' ') {
                      if (!cur.empty()) {
                          words.push_back(cur);
                          cur.clear();
                      }
                  } else {
                      cur += c;
                  }
              }
              if (!cur.empty()) words.push_back(cur);
              return words;
          }
        harness: |
          int main() {
              using V = std::vector<std::string>;
              CHECK_EQ("extra spaces", split_words("  rush   b  "), V{"rush", "b"});
              CHECK_EQ("normal sentence", split_words("plant the bomb"), V{"plant", "the", "bomb"});
              CHECK_EQ("only spaces", split_words("    "), V{});
              CHECK_EQ("empty", split_words(""), V{});
              CHECK_EQ("one word", split_words("eco"), V{"eco"});
          }
        hints:
          - Like `split`, but only push a word when `cur` isn't empty.
          - Remember the last word after the loop, if the string doesn't end with a space.
        tests: []
