      - task: |
          Write a **factory**: `std::unique_ptr<Weapon> make_weapon(const std::string& name)` returns a new `Pistol` for `"pistol"`, a new `Shotgun` for `"shotgun"`, and `nullptr` otherwise. Implement both classes (pistol 25 per hit; shotgun 80 for the first hit and 20 for each after), then `int total_for(const std::vector<std::string>& names, int hits)`, which skips unknown names.
