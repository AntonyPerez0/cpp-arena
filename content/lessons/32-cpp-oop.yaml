id: cpp-oop
title: Inheritance and polymorphism
lang: cpp
phase: "C++: Modern and Advanced"
summary: Derived classes, virtual functions and override, abstract interfaces, and polymorphic containers.
steps:
  - title: Inheritance
    id: cpp-oop-1
    text: |
      Often several classes share most of their data and behavior: every vehicle has a name and a speed, every account has an owner and a balance. **Inheritance** lets a new class (the **derived** class) start from an existing one (the **base** class), getting all its members, and then add more.

      The relationship must be **is-a**: a `Car` *is a* `Vehicle`, so anything you can do with a vehicle you can do with a car.

      ```cpp run
      #include <iostream>
      #include <string>

      class Vehicle {
      public:
          Vehicle(std::string name, int wheels) : name_(name), wheels_(wheels) {}
          std::string summary() const { return name_ + " on " + std::to_string(wheels_) + " wheels"; }

      private:
          std::string name_;
          int wheels_;
      };

      class Truck : public Vehicle {
      public:
          Truck(std::string name, int load) : Vehicle(name, 6), load_(load) {}
          int load() const { return load_; }

      private:
          int load_;
      };

      int main() {
          Truck t("hauler", 12);
          std::cout << t.summary() << ", carrying " << t.load() << " tons\n";
          Vehicle v("bike", 2);
          std::cout << v.summary() << "\n";
      }
      ```

      ```output
      hauler on 6 wheels, carrying 12 tons
      bike on 2 wheels
      ```

      ### How it works

      - `class Truck : public Vehicle` means "Truck inherits from Vehicle". Always write `public` here; without it, the inherited members become private to the outside world, which is almost never what you want.
      - A `Truck` object **contains** a complete `Vehicle` inside it, plus its own `load_`.
      - `t.summary()` works because `summary` was inherited.
      - The base part must be constructed first, and the derived class does that in its initializer list: `: Vehicle(name, 6)`. That's the **only** way to call the base constructor, and it's required when the base has no default constructor.
      - `name_` and `wheels_` are `private` to `Vehicle`, so even `Truck`'s own code can't touch them directly. It uses `Vehicle`'s public functions like everyone else.

      ### Common mistakes

      - Trying to set base members in the derived constructor's body (`name_ = name;`). They're private to the base; pass them to the base constructor instead.
      - Using inheritance just to reuse code when there's no is-a relationship. That's what members are for (more in step 7).

      **Your turn:** make `Sniper` inherit from `Weapon` and set the base part through the base constructor.
    fill: |
      #include <iostream>
      #include <string>

      class Weapon {
      public:
          Weapon(std::string name, int damage) : name_(name), damage_(damage) {}
          std::string info() const { return name_ + " " + std::to_string(damage_); }
      private:
          std::string name_;
          int damage_;
      };

      class Sniper [[:]] [[public]] Weapon {
      public:
          Sniper() : [[Weapon]]("awp", 115) {}
          bool scoped = false;
      };

      int main() {
          Sniper s;
          std::cout << s.info() << " " << s.scoped << "\n";
      }
    hints:
      - "`class Sniper : public Weapon`"
      - "The base class is initialized in the initializer list by name: `: Weapon(\"awp\", 115)`."
    tests:
      - expect: "awp 115 0"

  - title: virtual and override
    id: cpp-oop-2
    text: |
      Inheritance becomes powerful when code works with the **base** type but each object behaves according to its **real** type. A function that takes `const Animal&` should make a `Dog` bark and a `Cat` meow. That's **polymorphism** ("many forms").

      By default, C++ doesn't do this: through a base reference, the **base** version of a function runs. Marking the function `virtual` changes that: the call is decided **at run time**, by the actual object.

      ```cpp run
      #include <iostream>
      #include <string>

      class Notifier {
      public:
          virtual std::string send(const std::string& msg) const { return "log: " + msg; }
          std::string channel() const { return "base"; }          // not virtual
          virtual ~Notifier() = default;
      };

      class Email : public Notifier {
      public:
          std::string send(const std::string& msg) const override { return "email: " + msg; }
          std::string channel() const { return "smtp"; }          // hides, doesn't override
      };

      class Sms : public Notifier {
      public:
          std::string send(const std::string& msg) const override { return "sms: " + msg.substr(0, 5); }
      };

      void alert(const Notifier& n) {
          std::cout << n.send("server down") << " via " << n.channel() << "\n";
      }

      int main() {
          alert(Notifier{});
          alert(Email{});
          alert(Sms{});
      }
      ```

      ```output
      log: server down via base
      email: server down via base
      sms: serve via base
      ```

      ### Reading the output

      - `send` is `virtual`, so `alert` calls the real object's version: log, email and sms.
      - `channel` is **not** virtual, so through a `Notifier&` it's always the base version, even for an `Email`. That's almost never what you want in a class hierarchy.

      ### override

      Write `override` after every function that's meant to replace a virtual one. The compiler then **checks** that a matching virtual function exists in the base. Without it, a typo or a missing `const` silently creates a brand new function, and the base version keeps running. With it, that's a compile error.

      ### virtual ~Base() = default

      A class meant to be used through base references or pointers needs a **virtual destructor**. You'll see exactly why in step 5; for now, always include it.

      **Your turn:** make `Knife` and `Grenade` override `attack`, returning `"slash"` and `"boom"`.
    seed: |
      #include <string>

      class Weapon {
      public:
          virtual std::string attack() const { return "..."; }
          virtual ~Weapon() = default;
      };

      class Knife : public Weapon {
      public:

      };

      class Grenade : public Weapon {
      public:

      };
    solution: |
      #include <string>

      class Weapon {
      public:
          virtual std::string attack() const { return "..."; }
          virtual ~Weapon() = default;
      };

      class Knife : public Weapon {
      public:
          std::string attack() const override { return "slash"; }
      };

      class Grenade : public Weapon {
      public:
          std::string attack() const override { return "boom"; }
      };
    require:
      - pattern: "override"
        message: "Mark the derived functions with `override`."
    harness: |
      std::string use(const Weapon& w) { return w.attack(); }
      int main() {
          Knife k;
          Grenade g;
          Weapon plain;
          CHECK_EQ("Knife through Weapon&", use(k), std::string("slash"));
          CHECK_EQ("Grenade through Weapon&", use(g), std::string("boom"));
          CHECK_EQ("plain Weapon", use(plain), std::string("..."));
      }
    hints:
      - "Same signature as the base, plus `override`: `std::string attack() const override { ... }`."

  - title: Abstract classes
    id: cpp-oop-3
    text: |
      Sometimes the base class can't give a sensible default. What's the area of "a shape"? There isn't one: only circles, squares and triangles have areas. So the base declares the function but provides no body, by writing `= 0`. That's a **pure virtual** function.

      A class with at least one pure virtual function is **abstract**: you can't create an object of it, only of classes derived from it that implement every pure virtual function. An abstract class with only pure virtual functions is an **interface**: a promise of what every derived class can do.

      ```cpp run
      #include <iostream>
      #include <string>

      class Payment {
      public:
          virtual double fee(double amount) const = 0;      // no body: must be overridden
          virtual std::string name() const = 0;
          virtual ~Payment() = default;
      };

      class Card : public Payment {
      public:
          double fee(double amount) const override { return 0.30 + amount * 0.029; }
          std::string name() const override { return "card"; }
      };

      class Transfer : public Payment {
      public:
          double fee(double) const override { return 1.0; }  // flat fee; parameter unused
          std::string name() const override { return "transfer"; }
      };

      void quote(const Payment& p, double amount) {
          std::cout << p.name() << ": " << p.fee(amount) << "\n";
      }

      int main() {
          quote(Card{}, 100);
          quote(Transfer{}, 100);
          // Payment p;   // error: cannot declare variable 'p' to be of abstract type
      }
      ```

      ```output
      card: 3.2
      transfer: 1
      ```

      ### How it works

      - `= 0` makes a function pure virtual. `Payment` itself can never be created.
      - `Card` and `Transfer` implement **both** pure virtual functions, so they're concrete classes. If a derived class missed one, it would be abstract too, and creating it would be a compile error that names the missing function.
      - `quote` works with any payment method, including ones written years later. That's the point of an interface.
      - `double fee(double) const` leaves the parameter unnamed because it isn't used. That avoids an "unused parameter" warning.

      ### Your task

      Each shape stores its own dimensions and implements `area()`: a circle is pi times r squared, a rectangle is width times height. Remember `const` and `override`, and use the value of pi given.

      **Your turn:** write `Circle` (radius) and `Rect` (width, height) implementing `area()`. Use `3.14159265358979` for pi.
    seed: |
      class Shape {
      public:
          virtual double area() const = 0;
          virtual ~Shape() = default;
      };

      class Circle : public Shape {
      public:
          explicit Circle(double r) : r_(r) {}

      private:
          double r_;
      };

      class Rect : public Shape {
      public:
          Rect(double w, double h) : w_(w), h_(h) {}

      private:
          double w_, h_;
      };
    solution: |
      class Shape {
      public:
          virtual double area() const = 0;
          virtual ~Shape() = default;
      };

      class Circle : public Shape {
      public:
          explicit Circle(double r) : r_(r) {}
          double area() const override { return 3.14159265358979 * r_ * r_; }

      private:
          double r_;
      };

      class Rect : public Shape {
      public:
          Rect(double w, double h) : w_(w), h_(h) {}
          double area() const override { return w_ * h_; }

      private:
          double w_, h_;
      };
    harness: |
      #include <cmath>
      #include <type_traits>
      bool near(double a, double b) { return std::fabs(a - b) < 1e-6; }
      int main() {
          CHECK("Shape is abstract", std::is_abstract_v<Shape>);
          Circle c(2);
          Rect r(3, 4.5);
          const Shape& s1 = c;
          const Shape& s2 = r;
          CHECK("circle r=2 area ~12.566", near(s1.area(), 12.5663706143592));
          CHECK("rect 3x4.5 area 13.5", near(s2.area(), 13.5));
      }
    hints:
      - "Each class needs `double area() const override { ... }`."
      - "Circle: `3.14159265358979 * r_ * r_`. Rect: `w_ * h_`."

  - title: Polymorphic containers
    id: cpp-oop-4
    text: |
      To hold **different** derived types in one container, you can't store the objects themselves: a `std::vector<Shape>` would only have room for the base part, and an abstract base can't be stored at all. Instead, store **pointers to the base**, and let virtual calls reach each real object. With `std::unique_ptr`, the vector owns the objects and nothing leaks.

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <memory>
      #include <string>
      #include <vector>

      class Plan {
      public:
          virtual double monthly(int users) const = 0;
          virtual ~Plan() = default;
      };

      class Flat : public Plan {
      public:
          explicit Flat(double price) : price_(price) {}
          double monthly(int) const override { return price_; }
      private:
          double price_;
      };

      class PerSeat : public Plan {
      public:
          double monthly(int users) const override {
              return users <= 5 ? users * 8.0 : 40 + (users - 5) * 6.0;   // cheaper after 5 seats
          }
      };

      int main() {
          std::vector<std::unique_ptr<Plan>> plans;
          plans.push_back(std::make_unique<Flat>(99));
          plans.push_back(std::make_unique<PerSeat>());

          for (int users : {3, 12}) {
              double cheapest = 1e9;
              for (const auto& p : plans) cheapest = std::min(cheapest, p->monthly(users));
              std::cout << users << " users: best price " << cheapest << "\n";
          }
      }
      ```

      ```output
      3 users: best price 24
      12 users: best price 82
      ```

      ### How it works

      - `std::make_unique<Flat>(99)` creates a `Flat` and returns `unique_ptr<Flat>`, which converts automatically to `unique_ptr<Plan>` when pushed into the vector.
      - `p->monthly(users)` is a virtual call, so each plan's own formula runs.
      - When `plans` is destroyed, each `unique_ptr` deletes its object **through a `Plan*`**. That only runs the right destructor because `Plan`'s destructor is virtual.

      ### Your task: shotgun damage

      "80 on the first hit, 20 for each hit after" means `hits` of 0 gives 0, 1 gives 80, 3 gives 80 + 20 + 20. Handle 0 hits separately. `total_damage` is then a loop that adds `w->damage(hits)` for every weapon.

      **Your turn:** write `int total_damage(const std::vector<std::unique_ptr<Weapon>>& ws, int hits)` that sums `damage(hits)` across all weapons, and implement `Pistol` (25 per hit) and `Shotgun` (80 on the first hit, 20 for each hit after).
    seed: |
      #include <memory>
      #include <vector>

      class Weapon {
      public:
          virtual int damage(int hits) const = 0;
          virtual ~Weapon() = default;
      };

      class Pistol : public Weapon {
      public:

      };

      class Shotgun : public Weapon {
      public:

      };

      int total_damage(const std::vector<std::unique_ptr<Weapon>>& ws, int hits) {

      }
    solution: |
      #include <memory>
      #include <vector>

      class Weapon {
      public:
          virtual int damage(int hits) const = 0;
          virtual ~Weapon() = default;
      };

      class Pistol : public Weapon {
      public:
          int damage(int hits) const override { return 25 * hits; }
      };

      class Shotgun : public Weapon {
      public:
          int damage(int hits) const override {
              if (hits <= 0) return 0;
              return 80 + 20 * (hits - 1);
          }
      };

      int total_damage(const std::vector<std::unique_ptr<Weapon>>& ws, int hits) {
          int t = 0;
          for (const auto& w : ws) t += w->damage(hits);
          return t;
      }
    harness: |
      int main() {
          std::vector<std::unique_ptr<Weapon>> ws;
          ws.push_back(std::make_unique<Pistol>());
          ws.push_back(std::make_unique<Shotgun>());
          ws.push_back(std::make_unique<Pistol>());
          CHECK_EQ("1 hit", total_damage(ws, 1), 25 + 80 + 25);
          CHECK_EQ("3 hits", total_damage(ws, 3), 75 + 120 + 75);
          CHECK_EQ("0 hits", total_damage(ws, 0), 0);
          CHECK_EQ("no weapons", total_damage({}, 5), 0);
      }
    hints:
      - "Each derived class implements `int damage(int hits) const override`."
      - "Shotgun: 0 for no hits, else `80 + 20 * (hits - 1)`."
      - "Sum with `for (const auto& w : ws) t += w->damage(hits);`"

  - title: Virtual destructors
    id: cpp-oop-5
    text: |
      Here's why the base class of a hierarchy always has a **virtual destructor**. When you `delete` an object through a base pointer (which is what `unique_ptr<Base>` does when it goes away), the destructor call follows the same rule as any other member function:

      - If `~Base()` is **not** virtual, only `~Base()` runs. The derived part is never destroyed: its members aren't cleaned up, its resources leak. Formally, it's undefined behavior.
      - If `~Base()` **is** virtual, the call goes to `~Derived()` first, which then automatically runs `~Base()`.

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>

      struct Connection {
          virtual ~Connection() { std::cout << "close socket\n"; }
      };

      struct TlsConnection : Connection {
          std::string session = "keys";
          ~TlsConnection() override { std::cout << "wipe " << session << "\n"; }
      };

      int main() {
          std::unique_ptr<Connection> c = std::make_unique<TlsConnection>();
          std::cout << "using connection\n";
      }
      ```

      ```output
      using connection
      wipe keys
      close socket
      ```

      ### The order

      Construction goes **base first, then derived**: the derived constructor relies on its base part already existing. Destruction goes in **reverse**: derived first, then base. The output shows the derived cleanup (`wipe keys`) before the base cleanup (`close socket`).

      If you removed the `virtual` from `~Connection`, the `wipe keys` line would disappear. In real code that's a leaked session key, a leaked buffer, or an open file.

      ### The rule

      If a class has **any** virtual function, give it a virtual destructor. `virtual ~Base() = default;` is enough when there's nothing to clean up in the base itself.

      **Your turn:** the program should print:

      ```
      + base
      + derived
      - derived
      - base
      ```

      but `- derived` is missing. Fix it with one keyword.
    seed: |
      #include <iostream>
      #include <memory>

      struct Base {
          Base() { std::cout << "+ base\n"; }
          ~Base() { std::cout << "- base\n"; }
      };

      struct Derived : Base {
          Derived() { std::cout << "+ derived\n"; }
          ~Derived() { std::cout << "- derived\n"; }
      };

      int main() {
          std::unique_ptr<Base> p = std::make_unique<Derived>();
      }
    solution: |
      #include <iostream>
      #include <memory>

      struct Base {
          Base() { std::cout << "+ base\n"; }
          virtual ~Base() { std::cout << "- base\n"; }
      };

      struct Derived : Base {
          Derived() { std::cout << "+ derived\n"; }
          ~Derived() { std::cout << "- derived\n"; }
      };

      int main() {
          std::unique_ptr<Base> p = std::make_unique<Derived>();
      }
    hints:
      - The base class destructor needs to be `virtual`.
    tests:
      - expect: "+ base\n+ derived\n- derived\n- base"

  - title: Calling the base version, and protected
    id: cpp-oop-6
    text: |
      An override often wants to **extend** the base behavior rather than replace it: do what the base did, then add something. Call the base version by naming its class with `::`.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>

      class Account {
      public:
          explicit Account(std::string owner) : owner_(std::move(owner)) {}
          virtual ~Account() = default;
          virtual std::string describe() const { return owner_ + ": " + std::to_string(balance_); }
          void deposit(int amount) { balance_ += amount; }

      protected:
          int balance_ = 0;          // derived classes may use this directly

      private:
          std::string owner_;
      };

      class Savings : public Account {
      public:
          using Account::Account;    // reuse the base constructors
          std::string describe() const override { return Account::describe() + " (savings)"; }
          void add_interest() { balance_ += balance_ * rate_ / 100; }

      private:
          int rate_ = 5;
      };

      int main() {
          Savings s("Mia");
          s.deposit(200);
          s.add_interest();
          std::cout << s.describe() << "\n";
      }
      ```

      ```output
      Mia: 210 (savings)
      ```

      ### How it works

      - `Account::describe()` explicitly calls the **base** version, even though `describe` is virtual. Without the `Account::` prefix, the override would call itself forever.
      - `add_interest` changes `balance_` directly, which is allowed because it's `protected`. `owner_` is `private`, so `Savings` couldn't touch it.
      - `using Account::Account;` inherits the base constructors, so `Savings s("Mia")` works without writing a constructor.

      ### Access levels, one more time

      | Keyword | Who can use it |
      |---|---|
      | `public` | everyone |
      | `protected` | the class **and classes derived from it** |
      | `private` | only the class itself |

      Use `protected` sparingly. Every protected member is part of the contract with all future subclasses, so it's as hard to change later as a public one.

      ### Your task

      In `Medic`, `describe()` calls `Unit::describe()` and appends `" +heal"`. `heal(Unit& u)` calls the public `u.restore(power_)`. `power_` is protected, so the Medic can read it.

      **Your turn:** finish `Medic`. Its `describe()` returns the base description plus `" +heal"`, and `heal(Unit& u)` restores `u` by the protected `power_` amount (use `u.restore(...)`).
    seed: |
      #include <string>

      class Unit {
      public:
          Unit(std::string name, int hp) : name_(std::move(name)), hp_(hp) {}
          virtual ~Unit() = default;
          virtual std::string describe() const { return name_ + " (" + std::to_string(hp_) + ")"; }
          void restore(int amount) { hp_ += amount; }
          int hp() const { return hp_; }

      protected:
          int power_ = 10;

      private:
          std::string name_;
          int hp_;
      };

      class Medic : public Unit {
      public:
          Medic(std::string name, int hp) : Unit(std::move(name), hp) { power_ = 25; }

      };
    solution: |
      #include <string>

      class Unit {
      public:
          Unit(std::string name, int hp) : name_(std::move(name)), hp_(hp) {}
          virtual ~Unit() = default;
          virtual std::string describe() const { return name_ + " (" + std::to_string(hp_) + ")"; }
          void restore(int amount) { hp_ += amount; }
          int hp() const { return hp_; }

      protected:
          int power_ = 10;

      private:
          std::string name_;
          int hp_;
      };

      class Medic : public Unit {
      public:
          Medic(std::string name, int hp) : Unit(std::move(name), hp) { power_ = 25; }
          std::string describe() const override { return Unit::describe() + " +heal"; }
          void heal(Unit& u) const { u.restore(power_); }
      };
    require:
      - pattern: "Unit::describe\\s*\\(\\s*\\)"
        message: "Reuse the base text by calling `Unit::describe()` instead of rebuilding it."
    harness: |
      int main() {
          Medic m("doc", 80);
          CHECK_EQ("medic describe", m.describe(), std::string("doc (80) +heal"));
          const Unit& asUnit = m;
          CHECK_EQ("virtual call through base", asUnit.describe(), std::string("doc (80) +heal"));
          Unit grunt("grunt", 40);
          m.heal(grunt);
          CHECK_EQ("heal uses power_", grunt.hp(), 65);
          m.heal(m);
          CHECK_EQ("medic can heal itself", m.hp(), 105);
      }
    hints:
      - "`std::string describe() const override { return Unit::describe() + \" +heal\"; }`"
      - "`void heal(Unit& u) const { u.restore(power_); }`: Medic can read `power_` because it's protected."

  - title: Composition over inheritance
    id: cpp-oop-7
    text: |
      Inheritance is powerful, but it's also the **tightest** coupling there is: a derived class depends on every detail of its base. For many relationships there's a simpler tool. Inheritance means **is-a**: a `Truck` *is a* `Vehicle`. For **has-a** relationships, give the class a **member** instead. That's called **composition**.

      ```cpp
      class Squad : public std::vector<Player> { };   // wrong: a squad isn't a vector
      class Squad { std::vector<Player> members_; };   // right: a squad has members
      ```

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      class Playlist {
      public:
          bool add(const std::string& song) {
              if (songs_.size() >= 3) return false;                                   // rule: max 3
              if (std::find(songs_.begin(), songs_.end(), song) != songs_.end()) return false;
              songs_.push_back(song);
              return true;
          }
          std::string summary() const {
              std::string out;
              for (const auto& s : songs_) out += "[" + s + "]";
              return out;
          }

      private:
          std::vector<std::string> songs_;    // has-a: the playlist controls access
      };

      int main() {
          Playlist p;
          std::cout << p.add("a") << p.add("b") << p.add("a") << p.add("c") << p.add("d") << "\n";
          std::cout << p.summary() << "\n";
      }
      ```

      ```output
      11010
      [a][b][c]
      ```

      ### Why composition is the default in professional code

      - The class controls its own interface. Inheriting from `std::vector` would expose `erase`, `clear`, `push_back` and everything else, letting callers break the "max 3, no duplicates" rules.
      - You can swap the member's type later (say, to a `std::set`) without touching any caller.
      - Standard containers have no virtual destructor, so they aren't meant to be base classes at all.

      ### Your task

      `Squad` is the same shape as `Playlist`: `add` checks the size limit and duplicates, `remove` finds the name with `std::find` and erases it, and `roster` joins the names with `", "` (watch out for the separator fencepost from the streams module).

      **Your turn:** write class `Squad` that *has* a `std::vector<std::string>` of names, with a maximum size of 5:

      - `bool add(const std::string& name)`: false if full or already in the squad
      - `bool remove(const std::string& name)`: false if not found
      - `int size() const`, `std::string roster() const` (names joined with `", "`, in join order)
    seed: |
      #include <string>
      #include <vector>

      class Squad {
      public:

      private:
          std::vector<std::string> members_;
      };
    solution: |
      #include <algorithm>
      #include <string>
      #include <vector>

      class Squad {
      public:
          bool add(const std::string& name) {
              if (members_.size() >= 5) return false;
              if (std::find(members_.begin(), members_.end(), name) != members_.end()) return false;
              members_.push_back(name);
              return true;
          }
          bool remove(const std::string& name) {
              auto it = std::find(members_.begin(), members_.end(), name);
              if (it == members_.end()) return false;
              members_.erase(it);
              return true;
          }
          int size() const { return static_cast<int>(members_.size()); }
          std::string roster() const {
              std::string out;
              for (std::size_t i = 0; i < members_.size(); i++) {
                  if (i) out += ", ";
                  out += members_[i];
              }
              return out;
          }

      private:
          std::vector<std::string> members_;
      };
    forbid:
      - pattern: "class\\s+Squad\\s*:"
        message: "Don't inherit here. A squad *has* members; keep them in the private vector."
    harness: |
      int main() {
          Squad s;
          CHECK_EQ("add karrigan", s.add("karrigan"), true);
          s.add("rain");
          CHECK_EQ("duplicate refused", s.add("rain"), false);
          s.add("ropz");
          s.add("broky");
          s.add("frozen");
          CHECK_EQ("sixth refused", s.add("jks"), false);
          CHECK_EQ("size 5", s.size(), 5);
          CHECK_EQ("remove rain", s.remove("rain"), true);
          CHECK_EQ("remove missing", s.remove("rain"), false);
          CHECK_EQ("roster keeps order", s.roster(), std::string("karrigan, ropz, broky, frozen"));
          Squad empty;
          CHECK_EQ("empty roster", empty.roster(), std::string(""));
      }
    hints:
      - "Use `std::find` from `<algorithm>` to check for duplicates and to locate a name to erase."
      - "For the roster, add `\", \"` before every name except the first."

  - title: Casts, dynamic_cast and slicing
    id: cpp-oop-9
    text: |
      A **cast** converts a value to another type on purpose. C has one cast syntax, `(int)x`, that does everything from harmless number conversions to dangerous pointer reinterpretation, without saying which. C++ splits casting into four named casts, so each one says exactly what it's doing and is easy to search for:

      | Cast | What it does | Checked |
      |---|---|---|
      | `static_cast<T>(x)` | ordinary conversions: `double` to `int`, `int` to an `enum`, a base pointer to a derived pointer **when you know** the real type | at compile time only |
      | `dynamic_cast<T*>(p)` | a base pointer to a derived pointer, **if** the object really is one; otherwise `nullptr` | at run time |
      | `const_cast<T>(x)` | removes `const`, to call old code that forgot to declare it | not at all |
      | `reinterpret_cast<T>(x)` | treats the bits as a different type, like a pointer as an integer | not at all |

      ### dynamic_cast: asking "what are you, really?"

      With a pointer to a base class, `dynamic_cast` checks at run time whether the object is the derived type you ask for:

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <vector>

      struct Shape {
          virtual ~Shape() = default;
          virtual double area() const = 0;
      };

      struct Circle : Shape {
          double r;
          explicit Circle(double radius) : r(radius) {}
          double area() const override { return 3.14159 * r * r; }
      };

      struct Square : Shape {
          double side;
          explicit Square(double s) : side(s) {}
          double area() const override { return side * side; }
      };

      int main() {
          std::vector<std::unique_ptr<Shape>> shapes;
          shapes.push_back(std::make_unique<Circle>(1.0));
          shapes.push_back(std::make_unique<Square>(2.0));
          for (const auto& s : shapes) {
              if (const auto* c = dynamic_cast<const Circle*>(s.get())) {
                  std::cout << "circle with radius " << c->r << "\n";
              } else {
                  std::cout << "not a circle, area " << s->area() << "\n";
              }
          }
          std::cout << static_cast<int>(7.9) << "\n";
      }
      ```

      ```output
      circle with radius 1
      not a circle, area 4
      7
      ```

      - `dynamic_cast` only works on **polymorphic** classes (with at least one virtual function), because it uses the same run-time type information that virtual calls use. It returns `nullptr` when the object isn't that type, so the `if (const auto* c = ...)` pattern tests and converts in one step. (There's also a reference form, `dynamic_cast<Circle&>(shape)`, which throws `std::bad_cast` on failure instead.)
      - `static_cast<Circle*>(shape_ptr)` would also compile, but it doesn't check anything. If the object is really a `Square`, using the result is undefined behavior. Use `static_cast` downward only when the type is guaranteed.
      - `static_cast<int>(7.9)` truncates toward zero, giving 7.
      - Needing many `dynamic_cast`s is often a sign that a **virtual function is missing**: instead of asking each object what it is, ask it to do the work (`s->area()`). It's the right tool when you genuinely need something only one subclass has.

      ### const_cast, reinterpret_cast and C-style casts

      - `const_cast` is for calling an old function that takes `char*` but doesn't actually modify anything. Modifying an object that was really declared `const` through it is undefined behavior.
      - `reinterpret_cast` is for low-level code: hardware registers, hashing a pointer's address. To look at an object's bytes, copy them with `std::memcpy` (or C++20's `std::bit_cast`) instead.
      - A C-style cast `(Circle*)p` in C++ silently tries `static_cast`, then `const_cast`, then `reinterpret_cast`, and does whichever compiles, including the dangerous ones. That's why C++ style guides ban it: the named casts make intent visible and mistakes loud.

      ### Object slicing

      Copying a derived object **into a base-class object** (not a pointer or reference) keeps only the base part. The derived members are sliced off, and virtual calls on the copy run the **base** versions:

      ```cpp run
      #include <iostream>
      #include <string>

      struct Animal {
          virtual ~Animal() = default;
          virtual std::string sound() const { return "..."; }
      };

      struct Dog : Animal {
          std::string sound() const override { return "woof"; }
      };

      void by_value(Animal a) { std::cout << a.sound() << "\n"; }       // copies just the Animal part
      void by_ref(const Animal& a) { std::cout << a.sound() << "\n"; }  // refers to the real Dog

      int main() {
          Dog d;
          by_value(d);
          by_ref(d);
      }
      ```

      ```output
      ...
      woof
      ```

      The same happens when you store derived objects in a `std::vector<Animal>`: each one is sliced to an `Animal` as it's copied in. That's why polymorphic objects are always passed by reference or pointer and stored as `std::unique_ptr<Base>`, as in this module's containers. Making the base class abstract, or deleting its copy operations, turns accidental slicing into a compile error.

      ### Multiple inheritance

      A C++ class can have more than one base class: `class Duck : public Swimmer, public Flyer`. The common, safe use is implementing several **interfaces** (abstract classes with only pure virtual functions). Inheriting data and behavior from several classes gets complicated fast (two bases sharing a common base create the "diamond problem", solved with `virtual` inheritance), so most style guides restrict it to interfaces.

      **Your turn:** write `circle_area_total(shapes)`, the total area of only the circles, and `largest_square(shapes)`, a pointer to the square with the biggest side, or `nullptr` if there are no squares.
    seed: |
      #include <memory>
      #include <vector>

      struct Shape {
          virtual ~Shape() = default;
          virtual double area() const = 0;
      };

      struct Circle : Shape {
          double r;
          explicit Circle(double radius) : r(radius) {}
          double area() const override { return 3.14159 * r * r; }
      };

      struct Square : Shape {
          double side;
          explicit Square(double s) : side(s) {}
          double area() const override { return side * side; }
      };

      using Shapes = std::vector<std::unique_ptr<Shape>>;

      double circle_area_total(const Shapes& shapes) {

      }

      const Square* largest_square(const Shapes& shapes) {

      }
    solution: |
      #include <memory>
      #include <vector>

      struct Shape {
          virtual ~Shape() = default;
          virtual double area() const = 0;
      };

      struct Circle : Shape {
          double r;
          explicit Circle(double radius) : r(radius) {}
          double area() const override { return 3.14159 * r * r; }
      };

      struct Square : Shape {
          double side;
          explicit Square(double s) : side(s) {}
          double area() const override { return side * side; }
      };

      using Shapes = std::vector<std::unique_ptr<Shape>>;

      double circle_area_total(const Shapes& shapes) {
          double total = 0;
          for (const auto& s : shapes)
              if (dynamic_cast<const Circle*>(s.get())) total += s->area();
          return total;
      }

      const Square* largest_square(const Shapes& shapes) {
          const Square* best = nullptr;
          for (const auto& s : shapes) {
              if (const auto* sq = dynamic_cast<const Square*>(s.get())) {
                  if (!best || sq->side > best->side) best = sq;
              }
          }
          return best;
      }
    require:
      - pattern: "dynamic_cast"
        message: Use dynamic_cast to find out which shapes are circles and squares.
    harness: |
      int main() {
          Shapes v;
          v.push_back(std::make_unique<Square>(2));
          v.push_back(std::make_unique<Circle>(1));
          v.push_back(std::make_unique<Square>(5));
          v.push_back(std::make_unique<Circle>(2));
          v.push_back(std::make_unique<Square>(3));
          double want = 3.14159 * 1 * 1 + 3.14159 * 2 * 2;
          double got = circle_area_total(v);
          CHECK("circle total is pi(1) + pi(4)", got > want - 1e-9 && got < want + 1e-9);
          const Square* big = largest_square(v);
          CHECK("largest square has side 5", big && big->side == 5);
          CHECK("it points at the real object", big == v[2].get());
          Shapes circles;
          circles.push_back(std::make_unique<Circle>(3));
          CHECK("no squares gives nullptr", largest_square(circles) == nullptr);
          CHECK("no circles gives 0", circle_area_total(Shapes{}) == 0);
      }
    hints:
      - "`dynamic_cast<const Circle*>(s.get())` is a non-null pointer exactly when the shape is a circle."
      - "largest_square: keep a `const Square* best = nullptr` and replace it when you find a square with a bigger `side`."
      - "Return `best` at the end; it stays `nullptr` if no shape was a square."

  - title: "Challenge: program to an interface"
    id: cpp-oop-8
    text: |
      In professional code, the most valuable use of virtual functions isn't game units: it's **dependency injection**. A class depends on an abstract **interface** instead of a concrete service, and whoever creates it passes in the real thing.

      Why that matters: code that calls the system clock, a database or the network directly is hard to test. Tests would have to wait for real time to pass or set up a real server. If the code only talks to an interface, a test can pass in a **fake** it fully controls.

      ```cpp run
      #include <iostream>

      class Clock {
      public:
          virtual ~Clock() = default;
          virtual long now() const = 0;
      };

      class FakeClock : public Clock {        // a test double: time moves only when told
      public:
          long now() const override { return t_; }
          void advance(long s) { t_ += s; }
      private:
          long t_ = 0;
      };

      class Coupon {
      public:
          Coupon(const Clock& clock, long valid_for) : clock_(clock), expires_(clock.now() + valid_for) {}
          bool valid() const { return clock_.now() < expires_; }
      private:
          const Clock& clock_;                // depends on the interface only
          long expires_;
      };

      int main() {
          FakeClock clock;
          Coupon c(clock, 60);
          std::cout << c.valid();
          clock.advance(59);
          std::cout << c.valid();
          clock.advance(1);
          std::cout << c.valid() << "\n";
      }
      ```

      ```output
      110
      ```

      The test checks a 60 second expiry instantly, with exact control over the boundary. In production you'd pass a `SystemClock` whose `now()` reads the real time, and `Coupon` wouldn't change at all.

      ### Designing the rate limiter

      Store the **times** of recent allowed calls in a `std::deque<long>`, oldest at the front. In `allow()`:

      1. Get `now()` once.
      2. Pop from the front every time `t` where `now >= t + window_`: those calls have left the window.
      3. If fewer than `limit_` remain, push `now` at the back and return `true`; otherwise return `false`.

      Store the clock as a `const Clock&` member, as `Coupon` does. The object that owns the real clock must outlive the limiter.

      **Your turn:** write `class RateLimiter` that takes a `const Clock&` and allows at most `limit` calls to `allow()` in any window of `window` seconds. `allow()` returns true and records the call if under the limit, otherwise false. A call at time `t` falls out of the window once `now() >= t + window`.
    seed: |
      #include <deque>

      class Clock {
      public:
          virtual ~Clock() = default;
          virtual long now() const = 0;
      };

      class RateLimiter {
      public:
          RateLimiter(const Clock& clock, int limit, long window);
          bool allow();

      private:

      };
    solution: |
      #include <deque>

      class Clock {
      public:
          virtual ~Clock() = default;
          virtual long now() const = 0;
      };

      class RateLimiter {
      public:
          RateLimiter(const Clock& clock, int limit, long window) : clock_(clock), limit_(limit), window_(window) {}
          bool allow() {
              long t = clock_.now();
              while (!calls_.empty() && t >= calls_.front() + window_) calls_.pop_front();
              if (static_cast<int>(calls_.size()) >= limit_) return false;
              calls_.push_back(t);
              return true;
          }

      private:
          const Clock& clock_;
          int limit_;
          long window_;
          std::deque<long> calls_;
      };
    harness: |
      class FakeClock : public Clock {
      public:
          long t = 0;
          long now() const override { return t; }
      };
      int main() {
          FakeClock clock;
          RateLimiter rl(clock, 3, 10);
          CHECK_EQ("call 1", rl.allow(), true);
          CHECK_EQ("call 2", rl.allow(), true);
          clock.t = 5;
          CHECK_EQ("call 3", rl.allow(), true);
          CHECK_EQ("call 4 is over the limit", rl.allow(), false);
          clock.t = 9;
          CHECK_EQ("still inside the window at t=9", rl.allow(), false);
          clock.t = 10;
          CHECK_EQ("first two calls expire at t=10", rl.allow(), true);
          CHECK_EQ("one more fits", rl.allow(), true);
          CHECK_EQ("then full again", rl.allow(), false);
          clock.t = 100;
          RateLimiter one(clock, 1, 1);
          CHECK_EQ("limit 1 first", one.allow(), true);
          CHECK_EQ("limit 1 second", one.allow(), false);
      }
    hints:
      - "Store `const Clock& clock_` and a `std::deque<long>` of call times."
      - "In `allow()`: read `t = clock_.now()`, pop calls from the front while `t >= front + window_`."
      - "Then if the deque holds `limit_` calls, return false; otherwise push t and return true."
