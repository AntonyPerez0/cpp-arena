  - title: Calling the base version, and protected
    id: cpp-oop-6
    text: |
      An override often wants to **extend** the base behavior rather than replace it: do what the base did, then add something. Call the base version by naming its class with `::`.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>

      class Account {
      public:
          explicit Account(std::string owner) : owner_(std::move(owner)) {}
          virtual ~Account() = default;
          virtual std::string describe() const { return owner_ + ": " + std::to_string(balance_); }
          void deposit(int amount) { balance_ += amount; }

      protected:
          int balance_ = 0;          // derived classes may use this directly

      private:
          std::string owner_;
      };

      class Savings : public Account {
      public:
          using Account::Account;    // reuse the base constructors
          std::string describe() const override { return Account::describe() + " (savings)"; }
          void add_interest() { balance_ += balance_ * rate_ / 100; }

      private:
          int rate_ = 5;
      };

      int main() {
          Savings s("Mia");
          s.deposit(200);
          s.add_interest();
          std::cout << s.describe() << "\n";
      }
      ```

      ```output
      Mia: 210 (savings)
      ```

      ### How it works

      - `Account::describe()` explicitly calls the **base** version, even though `describe` is virtual. Without the `Account::` prefix, the override would call itself forever.
      - `add_interest` changes `balance_` directly, which is allowed because it's `protected`. `owner_` is `private`, so `Savings` couldn't touch it.
      - `using Account::Account;` inherits the base constructors, so `Savings s("Mia")` works without writing a constructor.

      ### Access levels, one more time

      | Keyword | Who can use it |
      |---|---|
      | `public` | everyone |
      | `protected` | the class **and classes derived from it** |
      | `private` | only the class itself |

      Use `protected` sparingly. Every protected member is part of the contract with all future subclasses, so it's as hard to change later as a public one.

      ### Your task

      In `Medic`, `describe()` calls `Unit::describe()` and appends `" +heal"`. `heal(Unit& u)` calls the public `u.restore(power_)`. `power_` is protected, so the Medic can read it.

      **Your turn:** finish `Medic`. Its `describe()` returns the base description plus `" +heal"`, and `heal(Unit& u)` restores `u` by the protected `power_` amount (use `u.restore(...)`).
    seed: |
      #include <string>

      class Unit {
      public:
          Unit(std::string name, int hp) : name_(std::move(name)), hp_(hp) {}
          virtual ~Unit() = default;
          virtual std::string describe() const { return name_ + " (" + std::to_string(hp_) + ")"; }
          void restore(int amount) { hp_ += amount; }
          int hp() const { return hp_; }

      protected:
          int power_ = 10;

      private:
          std::string name_;
          int hp_;
      };

      class Medic : public Unit {
      public:
          Medic(std::string name, int hp) : Unit(std::move(name), hp) { power_ = 25; }

      };
    solution: |
