          - "`copy_all` just calls `s->clone()` on each element; the virtual call picks the right class."

  - title: "Challenge: program to an interface"
    id: cpp-oop-8
    text: |
      In professional code, the most valuable use of virtual functions isn't game units: it's **dependency injection**. A class depends on an abstract **interface** instead of a concrete service, and whoever creates it passes in the real thing.

      Why that matters: code that calls the system clock, a database or the network directly is hard to test. Tests would have to wait for real time to pass or set up a real server. If the code only talks to an interface, a test can pass in a **fake** it fully controls.

      ```cpp run
      #include <iostream>

      class Clock {
      public:
          virtual ~Clock() = default;
          virtual long now() const = 0;
      };

      class FakeClock : public Clock {        // a test double: time moves only when told
      public:
          long now() const override { return t_; }
          void advance(long s) { t_ += s; }
      private:
          long t_ = 0;
      };

      class Coupon {
      public:
          Coupon(const Clock& clock, long valid_for) : clock_(clock), expires_(clock.now() + valid_for) {}
          bool valid() const { return clock_.now() < expires_; }
      private:
          const Clock& clock_;                // depends on the interface only
          long expires_;
      };

      int main() {
          FakeClock clock;
          Coupon c(clock, 60);
          std::cout << c.valid();
          clock.advance(59);
          std::cout << c.valid();
          clock.advance(1);
          std::cout << c.valid() << "\n";
      }
      ```

      ```output
      110
      ```

      The test checks a 60 second expiry instantly, with exact control over the boundary. In production you'd pass a `SystemClock` whose `now()` reads the real time, and `Coupon` wouldn't change at all.

      ### Designing the rate limiter

      Store the **times** of recent allowed calls in a `std::deque<long>`, oldest at the front. In `allow()`:

      1. Get `now()` once.
      2. Pop from the front every time `t` where `now >= t + window_`: those calls have left the window.
      3. If fewer than `limit_` remain, push `now` at the back and return `true`; otherwise return `false`.

      Store the clock as a `const Clock&` member, as `Coupon` does. The object that owns the real clock must outlive the limiter.

      **Your turn:** write `class RateLimiter` that takes a `const Clock&` and allows at most `limit` calls to `allow()` in any window of `window` seconds. `allow()` returns true and records the call if under the limit, otherwise false. A call at time `t` falls out of the window once `now() >= t + window`.
    seed: |
      #include <deque>

      class Clock {
      public:
          virtual ~Clock() = default;
          virtual long now() const = 0;
      };

      class RateLimiter {
      public:
          RateLimiter(const Clock& clock, int limit, long window);
          bool allow();

      private:

      };
    solution: |
      #include <deque>

      class Clock {
      public:
          virtual ~Clock() = default;
          virtual long now() const = 0;
      };

      class RateLimiter {
      public:
          RateLimiter(const Clock& clock, int limit, long window) : clock_(clock), limit_(limit), window_(window) {}
          bool allow() {
              long t = clock_.now();
              while (!calls_.empty() && t >= calls_.front() + window_) calls_.pop_front();
              if (static_cast<int>(calls_.size()) >= limit_) return false;
              calls_.push_back(t);
              return true;
          }

      private:
          const Clock& clock_;
          int limit_;
          long window_;
          std::deque<long> calls_;
      };
    harness: |
      class FakeClock : public Clock {
      public:
          long t = 0;
          long now() const override { return t; }
      };
      int main() {
          FakeClock clock;
          RateLimiter rl(clock, 3, 10);
          CHECK_EQ("call 1", rl.allow(), true);
          CHECK_EQ("call 2", rl.allow(), true);
          clock.t = 5;
          CHECK_EQ("call 3", rl.allow(), true);
          CHECK_EQ("call 4 is over the limit", rl.allow(), false);
          clock.t = 9;
          CHECK_EQ("still inside the window at t=9", rl.allow(), false);
          clock.t = 10;
          CHECK_EQ("first two calls expire at t=10", rl.allow(), true);
          CHECK_EQ("one more fits", rl.allow(), true);
          CHECK_EQ("then full again", rl.allow(), false);
          clock.t = 100;
          RateLimiter one(clock, 1, 1);
          CHECK_EQ("limit 1 first", one.allow(), true);
          CHECK_EQ("limit 1 second", one.allow(), false);
      }
    hints:
      - "Store `const Clock& clock_` and a `std::deque<long>` of call times."
      - "In `allow()`: read `t = clock_.now()`, pop calls from the front while `t >= front + window_`."
      - "Then if the deque holds `limit_` calls, return false; otherwise push t and return true."
    more:
      - task: |
          Write class `Cooldown` that reads the time from a `const Clock&`. `use()` succeeds (returns true and remembers the time) only when the ability is ready; `ready()` is true if it was never used, or if at least `seconds` have passed since the last successful use.
        seed: |
