          #include <memory>
          #include <string>
          #include <vector>

          class Weapon {
          public:
              virtual ~Weapon() = default;
              virtual int damage(int hits) const = 0;
          };

          class Pistol : public Weapon {
          public:
              int damage(int hits) const override { return 25 * hits; }
          };

          class Shotgun : public Weapon {
          public:
              int damage(int hits) const override { return hits <= 0 ? 0 : 80 + 20 * (hits - 1); }
          };

          std::unique_ptr<Weapon> make_weapon(const std::string& name) {
              if (name == "pistol") return std::make_unique<Pistol>();
              if (name == "shotgun") return std::make_unique<Shotgun>();
              return nullptr;
          }

          int total_for(const std::vector<std::string>& names, int hits) {
              int total = 0;
              for (const auto& n : names) {
