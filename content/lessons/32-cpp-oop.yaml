        solution: |
          #include <memory>
          #include <string>

          class Strategy {
          public:
              virtual ~Strategy() = default;
              virtual std::string choose(int hp) const = 0;
          };

          // Aggressive and Careful here
          class Aggressive : public Strategy {
          public:
              std::string choose(int) const override { return "push"; }
          };

          class Careful : public Strategy {
          public:
              std::string choose(int hp) const override { return hp < 50 ? "retreat" : "hold"; }
          };

          class Bot {
          public:
              void set_strategy(std::unique_ptr<Strategy> s) { strategy_ = std::move(s); }
              std::string act(int hp) const { return strategy_ ? strategy_->choose(hp) : "idle"; }

          private:
