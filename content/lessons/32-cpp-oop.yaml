              CHECK_EQ("same size", c.size(), 2u);
              CHECK("new objects", c[0].get() != v[0].get() && c[1].get() != v[1].get());
              CHECK("first is still a Circle", dynamic_cast<Circle*>(c[0].get()) != nullptr);
              CHECK("second is still a Square", dynamic_cast<Square*>(c[1].get()) != nullptr);
              CHECK("areas copied", c[0]->area() == 12 && c[1]->area() == 9);
              dynamic_cast<Square*>(c[1].get())->side = 10;
              CHECK("deep copy: the original is unchanged", v[1]->area() == 9);
          }
        hints:
