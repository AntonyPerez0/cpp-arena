  - title: Composition over inheritance
    id: cpp-oop-7
    text: |
      Inheritance is powerful, but it's also the **tightest** coupling there is: a derived class depends on every detail of its base. For many relationships there's a simpler tool. Inheritance means **is-a**: a `Truck` *is a* `Vehicle`. For **has-a** relationships, give the class a **member** instead. That's called **composition**.

      ```cpp
      class Squad : public std::vector<Player> { };   // wrong: a squad isn't a vector
      class Squad { std::vector<Player> members_; };   // right: a squad has members
      ```

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      class Playlist {
      public:
          bool add(const std::string& song) {
              if (songs_.size() >= 3) return false;                                   // rule: max 3
              if (std::find(songs_.begin(), songs_.end(), song) != songs_.end()) return false;
              songs_.push_back(song);
              return true;
          }
          std::string summary() const {
              std::string out;
              for (const auto& s : songs_) out += "[" + s + "]";
              return out;
          }

      private:
          std::vector<std::string> songs_;    // has-a: the playlist controls access
      };

      int main() {
          Playlist p;
          std::cout << p.add("a") << p.add("b") << p.add("a") << p.add("c") << p.add("d") << "\n";
          std::cout << p.summary() << "\n";
      }
      ```

      ```output
      11010
      [a][b][c]
      ```

      ### Why composition is the default in professional code

      - The class controls its own interface. Inheriting from `std::vector` would expose `erase`, `clear`, `push_back` and everything else, letting callers break the "max 3, no duplicates" rules.
      - You can swap the member's type later (say, to a `std::set`) without touching any caller.
      - Standard containers have no virtual destructor, so they aren't meant to be base classes at all.

      ### Your task

      `Squad` is the same shape as `Playlist`: `add` checks the size limit and duplicates, `remove` finds the name with `std::find` and erases it, and `roster` joins the names with `", "` (watch out for the separator fencepost from the streams module).

      **Your turn:** write class `Squad` that *has* a `std::vector<std::string>` of names, with a maximum size of 5:

      - `bool add(const std::string& name)`: false if full or already in the squad
      - `bool remove(const std::string& name)`: false if not found
      - `int size() const`, `std::string roster() const` (names joined with `", "`, in join order)
    seed: |
      #include <string>
      #include <vector>

      class Squad {
      public:

      private:
          std::vector<std::string> members_;
      };
    solution: |
      #include <algorithm>
      #include <string>
      #include <vector>

      class Squad {
      public:
          bool add(const std::string& name) {
              if (members_.size() >= 5) return false;
              if (std::find(members_.begin(), members_.end(), name) != members_.end()) return false;
              members_.push_back(name);
              return true;
          }
          bool remove(const std::string& name) {
              auto it = std::find(members_.begin(), members_.end(), name);
              if (it == members_.end()) return false;
              members_.erase(it);
              return true;
          }
          int size() const { return static_cast<int>(members_.size()); }
          std::string roster() const {
              std::string out;
              for (std::size_t i = 0; i < members_.size(); i++) {
                  if (i) out += ", ";
                  out += members_[i];
              }
              return out;
          }

      private:
          std::vector<std::string> members_;
      };
    forbid:
      - pattern: "class\\s+Squad\\s*:"
        message: "Don't inherit here. A squad *has* members; keep them in the private vector."
    harness: |
      int main() {
          Squad s;
          CHECK_EQ("add karrigan", s.add("karrigan"), true);
          s.add("rain");
          CHECK_EQ("duplicate refused", s.add("rain"), false);
          s.add("ropz");
          s.add("broky");
          s.add("frozen");
          CHECK_EQ("sixth refused", s.add("jks"), false);
          CHECK_EQ("size 5", s.size(), 5);
          CHECK_EQ("remove rain", s.remove("rain"), true);
          CHECK_EQ("remove missing", s.remove("rain"), false);
          CHECK_EQ("roster keeps order", s.roster(), std::string("karrigan, ropz, broky, frozen"));
          Squad empty;
          CHECK_EQ("empty roster", empty.roster(), std::string(""));
      }
    hints:
      - "Use `std::find` from `<algorithm>` to check for duplicates and to locate a name to erase."
      - "For the roster, add `\", \"` before every name except the first."
    more:
      - task: |
          Write class `Backpack` that *has* a `std::map<std::string, int>` of item counts and a weight limit. `bool add(const std::string& item, int qty)` fails (changing nothing) if it would take the total over the limit or `qty <= 0`. `bool remove(const std::string& item, int qty)` fails if there aren't that many, and erases an item whose count reaches 0. `int total() const` and `int count(const std::string& item) const`.
        seed: |
          #include <map>
          #include <string>

          class Backpack {
          public:
              explicit Backpack(int limit) : limit_(limit) {}

          private:
              int limit_;
              std::map<std::string, int> items_;
          };
        solution: |
          #include <map>
          #include <string>

          class Backpack {
          public:
              explicit Backpack(int limit) : limit_(limit) {}
              bool add(const std::string& item, int qty) {
                  if (qty <= 0 || total_ + qty > limit_) return false;
                  items_[item] += qty;
                  total_ += qty;
                  return true;
              }
              bool remove(const std::string& item, int qty) {
                  auto it = items_.find(item);
                  if (qty <= 0 || it == items_.end() || it->second < qty) return false;
                  it->second -= qty;
                  total_ -= qty;
                  if (it->second == 0) items_.erase(it);
                  return true;
              }
              int total() const { return total_; }
              int count(const std::string& item) const {
                  auto it = items_.find(item);
                  return it == items_.end() ? 0 : it->second;
              }

          private:
              int limit_;
              std::map<std::string, int> items_;
              int total_ = 0;
          };
        forbid:
          - pattern: "class\\s+Backpack\\s*:"
            message: "Don't inherit from the map. A backpack *has* items; keep them in the private member."
        harness: |
          int main() {
              Backpack b(10);
              CHECK("add 4 nades", b.add("nade", 4));
              CHECK("add 5 ammo", b.add("ammo", 5));
              CHECK("over the limit", !b.add("ammo", 2));
              CHECK_EQ("total", b.total(), 9);
              CHECK("zero qty refused", !b.add("kit", 0));
              CHECK("remove too many", !b.remove("nade", 5));
              CHECK("remove 4", b.remove("nade", 4));
              CHECK_EQ("nades gone", b.count("nade"), 0);
              CHECK("missing item", !b.remove("nade", 1));
              CHECK("room again", b.add("kit", 5));
              CHECK_EQ("total 10", b.total(), 10);
