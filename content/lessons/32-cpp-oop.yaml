        solution: |
          class Clock {
          public:
              virtual ~Clock() = default;
              virtual long now() const = 0;
          };

          class Cooldown {
          public:
              Cooldown(const Clock& clock, long seconds) : clock_(clock), seconds_(seconds) {}
              bool ready() const { return !used_ || clock_.now() >= last_ + seconds_; }
              bool use() {
                  if (!ready()) return false;
                  used_ = true;
                  last_ = clock_.now();
                  return true;
              }

          private:
              const Clock& clock_;
              long seconds_;
              bool used_ = false;
              long last_ = 0;
          };
