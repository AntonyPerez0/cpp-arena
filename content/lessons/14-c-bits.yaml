      - task: |
          Write `unsigned next_pow2(unsigned x)` that returns the smallest power of two that is **at least** `x`, for `x` from 1 to `0x80000000`. `next_pow2(5)` is 8 and `next_pow2(8)` is 8. No loops. The trick: subtract 1, copy the highest 1 bit into every bit below it with `x |= x >> 1; x |= x >> 2;` and so on up to `>> 16`, then add 1.
        seed: |
          unsigned next_pow2(unsigned x) {

          }
        solution: |
          unsigned next_pow2(unsigned x) {
              x--;
              x |= x >> 1;
              x |= x >> 2;
              x |= x >> 4;
              x |= x >> 8;
              x |= x >> 16;
              return x + 1;
          }
        harness: |
          int main(void) {
              CHECK_INT("next_pow2(1)", next_pow2(1), 1);
              CHECK_INT("next_pow2(2)", next_pow2(2), 2);
              CHECK_INT("next_pow2(5)", next_pow2(5), 8);
              CHECK_INT("next_pow2(8)", next_pow2(8), 8);
              CHECK_INT("next_pow2(1000)", next_pow2(1000), 1024);
              CHECK_INT("next_pow2(65537)", next_pow2(65537), 131072);
              CHECK_INT("next_pow2(0x80000000)", next_pow2(0x80000000u), 0x80000000u);
              return 0;
          }
