id: c-bits
title: Bits and the preprocessor
lang: c
phase: "C: Memory"
summary: "Work with individual bits using bitwise operators and flags, and control compilation with #define and macros."
steps:
  - title: "#define constants"
    id: c-bits-1
    text: |
      Before the compiler proper sees your code, a first stage called the **preprocessor** runs. It handles every line that starts with `#`. You've been using it since the first lesson: `#include <stdio.h>` tells the preprocessor to paste in the contents of that header file.

      `#define` creates a **macro**: a name that the preprocessor replaces with text everywhere it appears.

      ```c run
      #include <stdio.h>

      #define MAX_HP 100
      #define GAME_NAME "Arena"

      int main(void) {
          int hp = MAX_HP;
          printf("%s: %d/%d\n", GAME_NAME, hp - 35, MAX_HP);
          return 0;
      }
      ```

      ```output
      Arena: 65/100
      ```

      ### It's text replacement

      The preprocessor doesn't understand C. It literally replaces the token `MAX_HP` with `100` before compiling, as if you had typed `100` yourself. So there's no type, no memory, and no `=` or `;` in the definition. A common mistake is `#define MAX_HP 100;`: the semicolon becomes part of the replacement and breaks expressions like `MAX_HP * 2`.

      ### Conventions

      - Macro names are written in `UPPER_CASE`, so readers know text replacement is happening.
      - Use them for values used in many places, so changing one line updates them all.
      - In modern C, `const` variables and `enum` constants are often preferable because they have types and obey scope. But `#define` is still everywhere in real C code, including all the standard headers, and it's the only option for some jobs, like conditional compilation (`#ifdef DEBUG`). One C quirk: unlike in C++, a `const int` is not a true compile-time constant in C, so it can't size an array declared outside a function; a `#define` or an `enum` constant can.

      **Your turn:** define `TEAM_SIZE` as `5` so the program prints `10 players`.
    fill: |
      #include <stdio.h>

      [[#define]] TEAM_SIZE [[5]]

      int main(void) {
          printf("%d players\n", TEAM_SIZE * 2);
          return 0;
      }
    hints:
      - "`#define NAME value`, with no `=` and no semicolon."
    tests:
      - expect: "10 players"
    more:
      - task: |
          Define `MAX_ROUNDS` as `24`, and define `HALF` in terms of `MAX_ROUNDS`, so the program prints `24 rounds, half at 12`.
        fill: |
          #include <stdio.h>

          #define MAX_ROUNDS [[24]]
          #define HALF ([[MAX_ROUNDS]] / 2)

          int main(void) {
              printf("%d rounds, half at %d\n", MAX_ROUNDS, HALF);
              return 0;
          }
        hints:
          - A macro can use another macro. `HALF` is `MAX_ROUNDS` divided by 2.
        tests:
          - expect: "24 rounds, half at 12"
      - task: |
          Define two constants with `#define`: `ROUND_SECONDS` as `115` and `ROUNDS` as `24`. Use them to print the longest possible match time in whole minutes: `46 min`.
        seed: |
          #include <stdio.h>

          // define ROUND_SECONDS and ROUNDS here

          int main(void) {

              return 0;
          }
        solution: |
          #include <stdio.h>

          // define ROUND_SECONDS and ROUNDS here
          #define ROUND_SECONDS 115
          #define ROUNDS 24

          int main(void) {
              printf("%d min\n", ROUND_SECONDS * ROUNDS / 60);
              return 0;
          }
        require:
          - pattern: "#define\\s+ROUND_SECONDS\\s+115"
            message: "Add `#define ROUND_SECONDS 115`."
          - pattern: "#define\\s+ROUNDS\\s+24"
            message: "Add `#define ROUNDS 24`."
          - pattern: "ROUND_SECONDS\\s*\\*\\s*ROUNDS|ROUNDS\\s*\\*\\s*ROUND_SECONDS"
            message: Compute the time from the two constants.
        hints:
          - "`#define` lines have no `=` and no semicolon."
          - The total is `ROUND_SECONDS * ROUNDS` seconds. Divide by 60 for minutes.
        tests:
          - expect: "46 min"

  - title: Macro pitfalls
    id: c-bits-2
    text: |
      Macros can take parameters, which makes them look like functions:

      ```c
      #define SQUARE(x) x * x
      ```

      But they aren't functions. The preprocessor pastes the argument's **text** into the body, without evaluating it first. That leads to surprises:

      ```c
      SQUARE(1 + 2)      // becomes  1 + 2 * 1 + 2   which is 5, not 9
      100 / SQUARE(5)    // becomes  100 / 5 * 5     which is 100, not 4
      ```

      The fix is to put parentheses around **every use of each parameter** and around **the whole body**:

      ```c run
      #include <stdio.h>

      #define BAD_SQUARE(x) x * x
      #define SQUARE(x) ((x) * (x))
      #define MAX(a, b) ((a) > (b) ? (a) : (b))

      int main(void) {
          printf("%d %d\n", BAD_SQUARE(1 + 2), SQUARE(1 + 2));
          printf("%d %d\n", 100 / BAD_SQUARE(5), 100 / SQUARE(5));
          printf("%d\n", MAX(3, 7) * 2);
          return 0;
      }
      ```

      ```output
      5 9
      100 4
      14
      ```

      ### Another trap: arguments evaluated twice

      `MAX(i++, j)` expands to use `i++` twice, so `i` may be incremented twice. A real function evaluates each argument exactly once. This is why modern C code prefers `static inline` functions over function-like macros whenever possible: they have types, evaluate arguments once, and show up in the debugger. Macros remain useful for things functions can't do, but always write them defensively.

      **Your turn:** `DOUBLE(3 + 4) * 2` should be 28, but this prints 18. Fix the `DOUBLE` macro.
    seed: |
      #include <stdio.h>

      #define DOUBLE(x) x + x

      int main(void) {
          printf("%d\n", DOUBLE(3 + 4) * 2);
          return 0;
      }
    solution: |
      #include <stdio.h>

      #define DOUBLE(x) ((x) + (x))

      int main(void) {
          printf("%d\n", DOUBLE(3 + 4) * 2);
          return 0;
      }
    hints:
      - "Expand it by hand: `3 + 4 + 3 + 4 * 2` = 18. The `* 2` only grabbed the last 4."
      - "Wrap the argument and the body: `#define DOUBLE(x) ((x) + (x))`."
    require:
      - pattern: "#define\\s+DOUBLE\\(x\\)\\s*\\(\\s*\\(x\\)\\s*\\+\\s*\\(x\\)\\s*\\)"
        message: "Parenthesize the macro fully: `((x) + (x))`."
    tests:
      - expect: "28"
    more:
      - task: |
          `SQUARE(2 + 3)` should be 25, but this prints 11. Fix the `SQUARE` macro.
        seed: |
          #include <stdio.h>

          #define SQUARE(x) x * x

          int main(void) {
              printf("%d\n", SQUARE(2 + 3));
              return 0;
          }
        solution: |
          #include <stdio.h>

          #define SQUARE(x) ((x) * (x))

          int main(void) {
              printf("%d\n", SQUARE(2 + 3));
              return 0;
          }
        require:
          - pattern: "#define\\s+SQUARE\\(x\\)\\s*\\(\\s*\\(x\\)\\s*\\*\\s*\\(x\\)\\s*\\)"
            message: "Put parentheses around each `x` and around the whole body: `((x) * (x))`."
        hints:
          - "The macro pastes text, so `SQUARE(2 + 3)` becomes `2 + 3 * 2 + 3`, which is 11."
        tests:
          - expect: "25"
      - task: |
          `MAX(10, 7) + 1` should be 11, but this prints 10. Work out why, and fix the `MAX` macro. The fixed form is `((a) > (b) ? (a) : (b))`.
        seed: |
          #include <stdio.h>

          #define MAX(a, b) a > b ? a : b

          int main(void) {
              printf("%d\n", MAX(10, 7) + 1);
              return 0;
          }
        solution: |
          #include <stdio.h>

          #define MAX(a, b) ((a) > (b) ? (a) : (b))

          int main(void) {
              printf("%d\n", MAX(10, 7) + 1);
              return 0;
          }
        require:
          - pattern: "#define\\s+MAX\\(a,\\s*b\\)\\s*\\(\\s*\\(a\\)\\s*>\\s*\\(b\\)\\s*\\?\\s*\\(a\\)\\s*:\\s*\\(b\\)\\s*\\)"
            message: "Write the macro as `((a) > (b) ? (a) : (b))`."
        hints:
          - "After pasting, the line is `10 > 7 ? 10 : 7 + 1`. The `+ 1` only belongs to the last part."
          - Parentheses around the whole body keep the `?:` together, and parentheses around each parameter protect arguments like `x + 1`.
        tests:
          - expect: "11"

  - title: Bitwise operators
    id: c-bits-3
    text: |
      Every integer is stored as a pattern of **bits** (binary digits, 0 or 1). The number 13 is `1101` in binary: 8 + 4 + 0 + 1. Bitwise operators work on those individual bits, all at once:

      | Operator | Name | Result bit is 1 when | Example |
      |---|---|---|---|
      | `a & b` | AND | both bits are 1 | `1100 & 1010 = 1000` |
      | `a \| b` | OR | at least one is 1 | `1100 \| 1010 = 1110` |
      | `a ^ b` | XOR | the bits differ | `1100 ^ 1010 = 0110` |
      | `~a` | NOT | the bit was 0 | flips every bit |
      | `a << n` | shift left | bits move n places left (zeros come in) | `0011 << 2 = 1100` |
      | `a >> n` | shift right | bits move n places right | `1100 >> 2 = 0011` |

      Shifting left by n multiplies by 2 to the power n, and shifting right divides by it. `1u << n` is a number with only bit `n` set.

      ```c run
      #include <stdio.h>

      int lowest_set_bit(unsigned x) {
          for (int i = 0; i < 32; i++) {
              if (x & (1u << i)) {
                  return i;
              }
          }
          return -1;
      }

      int main(void) {
          unsigned a = 12, b = 10;
          printf("%u %u %u\n", a & b, a | b, a ^ b);
          printf("%u %u\n", 1u << 5, 40u >> 3);
          printf("%d %d\n", lowest_set_bit(12), lowest_set_bit(0));
          return 0;
      }
      ```

      ```output
      8 14 6
      32 5
      2 -1
      ```

      ### Testing one bit

      `x & 1` is 1 if the lowest bit of `x` is set, else 0. More generally, `x & (1u << i)` is non-zero exactly when bit `i` is set. Combining that test with shifting (`x >>= 1` moves the next bit into the lowest position) lets you look at every bit in turn.

      ### Use unsigned types

      Bit manipulation should use **unsigned** integers (`unsigned`, `uint32_t`). Shifting negative signed numbers, or shifting a 1 into the sign bit, is undefined or implementation-defined. The `u` suffix in `1u` makes the literal unsigned.

      **Your turn:** write `int count_bits(unsigned x)` that returns how many bits are 1. Check the lowest bit with `x & 1`, then shift right.
    seed: |
      int count_bits(unsigned x) {

      }
    solution: |
      int count_bits(unsigned x) {
          int n = 0;
          while (x != 0) {
              n += x & 1;
              x >>= 1;
          }
          return n;
      }
    harness: |
      int main(void) {
          CHECK_INT("count_bits(0)", count_bits(0), 0);
          CHECK_INT("count_bits(1)", count_bits(1), 1);
          CHECK_INT("count_bits(7)", count_bits(7), 3);
          CHECK_INT("count_bits(8)", count_bits(8), 1);
          CHECK_INT("count_bits(255)", count_bits(255), 8);
          CHECK_INT("count_bits(0xFFFFFFFF)", count_bits(0xFFFFFFFFu), 32);
          return 0;
      }
    hints:
      - Loop while x is not 0. Add `x & 1` to the count, then `x >>= 1`.
    more:
      - task: |
          Write `int bit_at(unsigned x, int i)`, which returns bit number `i` (0 is the lowest) as `0` or `1`, and `unsigned set_bit(unsigned x, int i)`, which returns `x` with bit `i` turned on.
        seed: |
          int bit_at(unsigned x, int i) {

          }

          unsigned set_bit(unsigned x, int i) {

          }
        solution: |
          int bit_at(unsigned x, int i) {
              return (x >> i) & 1;
          }

          unsigned set_bit(unsigned x, int i) {
              return x | (1u << i);
          }
        harness: |
          int main(void) {
              CHECK_INT("bit_at(5, 0)", bit_at(5, 0), 1);
              CHECK_INT("bit_at(5, 1)", bit_at(5, 1), 0);
              CHECK_INT("bit_at(5, 2)", bit_at(5, 2), 1);
              CHECK_INT("bit_at(0x80000000, 31)", bit_at(0x80000000u, 31), 1);
              CHECK_INT("set_bit(0, 3)", set_bit(0, 3), 8);
              CHECK_INT("set_bit(5, 0) is already set", set_bit(5, 0), 5);
              CHECK_INT("set_bit(5, 1)", set_bit(5, 1), 7);
              return 0;
          }
        hints:
          - Shift the bit you want down to position 0 with `x >> i`, then keep only it with `& 1`.
          - "`1u << i` has only bit `i` set. OR it into `x`."
        tests: []
      - task: |
          Write `unsigned reverse8(unsigned x)` that reverses the lowest 8 bits of `x` (bit 0 swaps with bit 7, bit 1 with bit 6, and so on). `reverse8(1)` is `128`, and `reverse8(0x0F)` is `0xF0`.
        seed: |
          unsigned reverse8(unsigned x) {

          }
        solution: |
          unsigned reverse8(unsigned x) {
              unsigned r = 0;
              for (int i = 0; i < 8; i++) {
                  r = (r << 1) | ((x >> i) & 1);
              }
              return r;
          }
        harness: |
          int main(void) {
              CHECK_INT("reverse8(1)", reverse8(1), 128);
              CHECK_INT("reverse8(128)", reverse8(128), 1);
              CHECK_INT("reverse8(0x0F)", reverse8(0x0F), 0xF0);
              CHECK_INT("reverse8(0)", reverse8(0), 0);
              CHECK_INT("reverse8(0xFF)", reverse8(0xFF), 0xFF);
              CHECK_INT("reverse8(0x06)", reverse8(0x06), 0x60);
              return 0;
          }
        hints:
          - Build the result one bit at a time. Take bit `i` of `x` with `(x >> i) & 1`.
          - "Shift the result left before adding each bit: `r = (r << 1) | bit`. The first bit you add ends up highest."
        tests: []

  - title: Flags
    id: c-bits-4
    text: |
      A common use of bits is **flags**: packing several yes/no settings into a single integer, one bit each. File permissions, network protocol headers, graphics options and hardware registers all work this way.

      Give each flag its own bit with a shift:

      ```c
      #define BOLD      (1u << 0)   /* 001 */
      #define ITALIC    (1u << 1)   /* 010 */
      #define UNDERLINE (1u << 2)   /* 100 */
      ```

      Then four operations cover everything:

      | Goal | Code |
      |---|---|
      | turn a flag on | `style \|= ITALIC;` |
      | turn a flag off | `style &= ~ITALIC;` |
      | toggle a flag | `style ^= ITALIC;` |
      | test a flag | `if (style & ITALIC)` |

      ```c run
      #include <stdio.h>

      #define BOLD      (1u << 0)
      #define ITALIC    (1u << 1)
      #define UNDERLINE (1u << 2)

      int main(void) {
          unsigned style = BOLD | UNDERLINE;
          printf("%u\n", style);
          style ^= BOLD;
          style |= ITALIC;
          printf("%u bold=%d italic=%d\n", style, (style & BOLD) != 0, (style & ITALIC) != 0);
          return 0;
      }
      ```

      ```output
      5
      6 bold=0 italic=1
      ```

      ### Why `&= ~FLAG` turns a flag off

      `~ITALIC` has every bit set **except** the italic bit (`...11101`). AND-ing with it keeps every other bit as it was and forces the italic bit to 0.

      ### Why `!= 0` when testing

      `style & ITALIC` is either 0 or the flag's value (here 2), not 1. As a condition in `if` that's fine, since non-zero is true. When you want an actual 0 or 1, compare with `!= 0` (or use `!!`).

      Combining flags with `|` when calling a function (like `BOLD | ITALIC`) is a pattern you'll see in many C APIs, including `open()` on Unix.

      ### Bit-fields

      C can also pack small fields into an integer for you, with **bit-fields**:

      ```c
      struct Style {
          unsigned bold : 1;      /* 1 bit: 0 or 1 */
          unsigned italic : 1;
          unsigned size : 6;      /* 6 bits: 0 to 63 */
      };
      ```

      Each member uses only the number of bits after the colon, and you read and write it like any member (`s.size = 12;`). That saves memory in big arrays of small records. But the compiler chooses the exact layout (which end the bits start from, padding), so bit-fields are **not** a portable way to match a file format or a hardware register. Use masks and shifts, as above, for that.

      ### Byte order

      A 4-byte `int` like `0x12345678` is stored as 4 separate bytes, and machines disagree about their order. **Little-endian** machines, which include x86 and ARM as it's almost always configured (so nearly every PC and phone, and WebAssembly), store the lowest byte first: `78 56 34 12`. **Big-endian** machines store `12 34 56 78`, and network protocols traditionally send numbers in big-endian order. Shifts and masks work on **values**, so `(x >> 8) & 0xFF` gives the same answer everywhere. Byte order only matters when you look at memory one byte at a time, or read and write raw bytes, as binary files do in the next module.

      **Your turn:** fill in the operators.
    fill: |
      #include <stdio.h>

      #define HAS_HELMET (1u << 0)
      #define HAS_KIT    (1u << 1)
      #define IS_SCOPED  (1u << 2)

      int main(void) {
          unsigned s = 0;
          s [[|=]] HAS_HELMET;       // turn helmet on
          s |= HAS_KIT;
          s [[&=]] ~HAS_KIT;         // turn kit off
          s [[^=]] IS_SCOPED;        // toggle scope
          printf("%u %d %d\n", s, (s [[&]] HAS_HELMET) != 0, (s & HAS_KIT) != 0);
          return 0;
      }
    hints:
      - "On: `|=`, off: `&= ~`, toggle: `^=`, test: `&`."
    tests:
      - expect: "5 1 0"
    more:
      - task: |
          Fill in the operators: check the scope flag, turn the scope **off**, then turn the kit **on**. The output is `1` and then `3`.
        fill: |
          #include <stdio.h>

          #define HAS_HELMET (1u << 0)
          #define HAS_KIT    (1u << 1)
          #define IS_SCOPED  (1u << 2)

          int main(void) {
              unsigned s = HAS_HELMET | IS_SCOPED;
              printf("%d\n", (s [[&]] IS_SCOPED) != 0);   // is the scope on?
              s [[&=]] ~IS_SCOPED;                        // turn the scope off
              s [[|=]] HAS_KIT;                           // turn the kit on
              printf("%u\n", s);
              return 0;
          }
        hints:
          - Testing a flag uses `&`.
          - Turning a flag off is `&= ~FLAG`, and turning it on is `|= FLAG`.
        tests:
          - expect: "1\n3"
      - task: |
          Write `unsigned apply(unsigned s, char cmd)` that returns the new flags after one command: `'h'` turns the helmet on, `'k'` turns the kit on, `'d'` drops the kit (turns it off), `'s'` toggles the scope. Any other command changes nothing.
        seed: |
          #define HAS_HELMET (1u << 0)
          #define HAS_KIT    (1u << 1)
          #define IS_SCOPED  (1u << 2)

          unsigned apply(unsigned s, char cmd) {

          }
        solution: |
          #define HAS_HELMET (1u << 0)
          #define HAS_KIT    (1u << 1)
          #define IS_SCOPED  (1u << 2)

          unsigned apply(unsigned s, char cmd) {
              switch (cmd) {
                  case 'h': return s | HAS_HELMET;
                  case 'k': return s | HAS_KIT;
                  case 'd': return s & ~HAS_KIT;
                  case 's': return s ^ IS_SCOPED;
              }
              return s;
          }
        harness: |
          int main(void) {
              CHECK_INT("'h' on nothing", apply(0, 'h'), HAS_HELMET);
              CHECK_INT("'k' keeps the helmet", apply(HAS_HELMET, 'k'), HAS_HELMET | HAS_KIT);
              CHECK_INT("'d' drops only the kit", apply(HAS_HELMET | HAS_KIT, 'd'), HAS_HELMET);
              CHECK_INT("'d' without a kit does nothing", apply(HAS_HELMET, 'd'), HAS_HELMET);
              CHECK_INT("'s' turns the scope on", apply(0, 's'), IS_SCOPED);
              CHECK_INT("'s' again turns it off", apply(IS_SCOPED | HAS_KIT, 's'), HAS_KIT);
              CHECK_INT("unknown command", apply(HAS_KIT, 'x'), HAS_KIT);
              unsigned s = 0;
              const char *cmds = "hkssd";
              for (const char *p = cmds; *p; p++) s = apply(s, *p);
              CHECK_INT("after \"hkssd\"", s, HAS_HELMET);
              return 0;
          }
        hints:
          - A `switch` on `cmd`, returning the changed flags in each case.
          - "On is `|`, off is `& ~`, toggle is `^`."
        tests: []

  - title: "Challenge: power of two"
    id: c-bits-5
    text: |
      Bit tricks let you answer some questions in a single expression. The classic one: is a number a power of two?

      A power of two has **exactly one** 1 bit: 1 is `0001`, 2 is `0010`, 4 is `0100`, 8 is `1000`.

      ### The trick: `x & (x - 1)`

      Subtracting 1 flips the lowest 1 bit to 0 and every 0 bit below it to 1. For example, 12 is `1100` and 11 is `1011`. AND-ing them keeps only the bits both have: `1000`, which is 8. So `x & (x - 1)` is `x` with its **lowest set bit cleared**.

      If `x` had only one bit set, clearing it leaves 0. That's the power-of-two test. Zero needs special care, though: `0 & (0 - 1)` is also 0, but 0 is not a power of two, so it has to be excluded separately.

      The same trick gives a fast way to count bits: keep clearing the lowest set bit until nothing is left, counting as you go. The loop runs once per 1 bit instead of once per bit position.

      ```c run
      #include <stdio.h>

      int count_bits_fast(unsigned x) {
          int n = 0;
          while (x != 0) {
              x &= x - 1;
              n++;
          }
          return n;
      }

      int main(void) {
          printf("%d %d %d\n", count_bits_fast(12), count_bits_fast(255), count_bits_fast(0));
          printf("%u %u\n", 12u & (12u - 1), 16u & (16u - 1));
          return 0;
      }
      ```

      ```output
      2 8 0
      8 0
      ```

      `16 & 15` is 0 because 16 is a power of two; `12 & 11` is 8 because 12 has two bits set.

      ### Why bother with tricks like this?

      They show up in performance-sensitive code (hash tables often require power-of-two sizes so that `hash & (size - 1)` can replace a slower `%`), in systems programming, and in interviews. More importantly, working them out builds a real understanding of how numbers are stored.

      **Your turn:** write `int is_pow2(unsigned x)` returning 1 or 0, without loops.
    seed: |
      int is_pow2(unsigned x) {

      }
    solution: |
      int is_pow2(unsigned x) {
          return x != 0 && (x & (x - 1)) == 0;
      }
    forbid:
      - pattern: "\\bfor\\b|\\bwhile\\b"
        message: Solve it without a loop using `x & (x - 1)`.
    harness: |
      int main(void) {
          CHECK_INT("is_pow2(1)", is_pow2(1), 1);
          CHECK_INT("is_pow2(64)", is_pow2(64), 1);
          CHECK_INT("is_pow2(0)", is_pow2(0), 0);
          CHECK_INT("is_pow2(6)", is_pow2(6), 0);
          CHECK_INT("is_pow2(1024)", is_pow2(1024), 1);
          CHECK_INT("is_pow2(1023)", is_pow2(1023), 0);
          return 0;
      }
    hints:
      - Zero is not a power of two, so handle it.
      - "`return x != 0 && (x & (x - 1)) == 0;`"
    more:
      - task: |
          Write `unsigned lowest_bit(unsigned x)` that returns only the lowest `1` bit of `x` (so `12`, binary `1100`, gives `4`), or `0` for `0`. No loops. Hint from the lesson: `x & (x - 1)` **clears** the lowest bit, so compare `x` with that.
        seed: |
          unsigned lowest_bit(unsigned x) {

          }
        solution: |
          unsigned lowest_bit(unsigned x) {
              return x & ~(x - 1);
          }
        harness: |
          int main(void) {
              CHECK_INT("lowest_bit(12)", lowest_bit(12), 4);
              CHECK_INT("lowest_bit(1)", lowest_bit(1), 1);
              CHECK_INT("lowest_bit(0)", lowest_bit(0), 0);
              CHECK_INT("lowest_bit(10)", lowest_bit(10), 2);
              CHECK_INT("lowest_bit(0x80000000)", lowest_bit(0x80000000u), 0x80000000u);
              CHECK_INT("lowest_bit(0xFFFFFFFF)", lowest_bit(0xFFFFFFFFu), 1);
              return 0;
          }
        forbid:
          - pattern: "\\bfor\\b|\\bwhile\\b"
            message: Solve it without loops, with bit operations.
