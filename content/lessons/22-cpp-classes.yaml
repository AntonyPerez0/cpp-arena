          class Volume {
          public:

          private:

          };
        solution: |
          class Volume {
          public:
              void up() {
                  muted_ = false;
                  if (level_ < 10) level_++;
              }
              void down() {
                  muted_ = false;
                  if (level_ > 0) level_--;
              }
              void mute() { muted_ = true; }
              void unmute() { muted_ = false; }
              int level() const { return muted_ ? 0 : level_; }
              bool muted() const { return muted_; }

          private:
              int level_ = 5;
              bool muted_ = false;
          };
        harness: |
          int main() {
              Volume v;
              CHECK_EQ("starts at 5", v.level(), 5);
              for (int i = 0; i < 20; i++) v.up();
              CHECK_EQ("capped at 10", v.level(), 10);
              v.mute();
              CHECK("muted reads 0", v.muted() && v.level() == 0);
              v.unmute();
              CHECK_EQ("unmute restores 10", v.level(), 10);
              v.mute();
              v.down();
              CHECK("down while muted unmutes, then lowers", !v.muted() && v.level() == 9);
              for (int i = 0; i < 20; i++) v.down();
              CHECK_EQ("floor at 0", v.level(), 0);
