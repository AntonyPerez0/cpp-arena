      - task: |
          Write class `Duration` with the invariant **seconds always 0 to 59, total never negative**:

          - `Duration(int minutes, int seconds)`: extra seconds carry into minutes (`Duration(1, 75)` is 2:15); a negative total becomes 0:00
          - `int minutes() const`, `int seconds() const`
          - `Duration plus(const Duration& o) const`
          - `std::string str() const`: `M:SS`, like `2:15` or `0:07`
        seed: |
          #include <string>

          class Duration {
          public:

          private:

          };
        solution: |
          #include <string>

          class Duration {
          public:
              Duration(int minutes, int seconds) {
                  int total = minutes * 60 + seconds;
                  if (total < 0) total = 0;
                  total_ = total;
              }
              int minutes() const { return total_ / 60; }
              int seconds() const { return total_ % 60; }
              Duration plus(const Duration& o) const { return Duration(0, total_ + o.total_); }
              std::string str() const {
                  int s = seconds();
                  return std::to_string(minutes()) + ":" + (s < 10 ? "0" : "") + std::to_string(s);
              }

          private:
              int total_;
          };
        harness: |
          int main() {
              CHECK_EQ("1:75 carries", Duration(1, 75).str(), std::string("2:15"));
              CHECK_EQ("0:7 is 0:07", Duration(0, 7).str(), std::string("0:07"));
              CHECK_EQ("negative becomes 0:00", Duration(-1, 30).str(), std::string("0:00"));
              Duration d(1, 50);
              CHECK("minutes and seconds", d.minutes() == 1 && d.seconds() == 50);
              CHECK_EQ("1:50 + 0:25", d.plus(Duration(0, 25)).str(), std::string("2:15"));
              CHECK_EQ("59 minutes plus a minute", Duration(59, 30).plus(Duration(0, 30)).str(), std::string("60:00"));
          }
        hints:
          - Storing only the total number of seconds makes the invariant easy; minutes and seconds are computed from it.
          - Do the carrying and the negative check once, in the constructor, and let `plus` build its result with that constructor.
