      - task: |
          Write a `struct Scoreboard` with two `int` fields, `t` and `ct`, both starting at 0, and three member functions:

          - `void round_won(char side)`: `'T'` gives the T side a round, `'C'` the CT side
          - `bool finished() const`: true once either side has 13
          - `void print() const`: prints `T 2 - 1 CT`

          `main` is written for you: it reads round winners until the match is finished.
        seed: |
          #include <iostream>

          // struct Scoreboard here

          int main() {
              Scoreboard s;
              char c;
              while (!s.finished() && std::cin >> c) s.round_won(c);
              s.print();
          }
        solution: |
          #include <iostream>

          // struct Scoreboard here
          struct Scoreboard {
              int t = 0;
              int ct = 0;
              void round_won(char side) {
                  if (side == 'T') t++;
                  else if (side == 'C') ct++;
              }
              bool finished() const { return t >= 13 || ct >= 13; }
              void print() const { std::cout << "T " << t << " - " << ct << " CT\n"; }
          };

          int main() {
              Scoreboard s;
              char c;
              while (!s.finished() && std::cin >> c) s.round_won(c);
              s.print();
          }
        hints:
          - Give the fields default values right where they're declared, `int t = 0;`.
          - "`print` and `finished` don't change anything, so mark them `const`."
        tests:
          - stdin: "TCT\n"
          - stdin: "TTTTTTTTTTTTTCCC\n"
          - stdin: "CCCCCCCCCCCCTTTTC\n"
            hidden: true

  - title: public and private
    id: cpp-classes-2
    text: |
      With a plain struct, any code anywhere can change any member. If an account's balance must never go negative, nothing stops `acct.balance = -500;` from some far-away function. C++ lets a type **protect** its data with access specifiers:

      - `public:` members can be used by anyone.
      - `private:` members can only be used by the type's own member functions.

      A `class` is exactly a `struct` whose members are **private by default** (a struct's are public by default). By convention, `class` is used for types that protect their data.

      ```cpp run
      #include <iostream>

      class Thermostat {
      public:
          void set(int degrees) {
              if (degrees < 10) degrees = 10;
              if (degrees > 30) degrees = 30;
              target_ = degrees;
          }
          int target() const { return target_; }

      private:
          int target_ = 20;
      };

      int main() {
          Thermostat t;
          t.set(45);
          std::cout << t.target() << "\n";
          t.set(18);
          std::cout << t.target() << "\n";
      }
      ```

      ```output
      30
      18
      ```

      ### Why this matters

      Outside code can't write `t.target_ = 45;` (it's a compile error: `'target_' is a private member of 'Thermostat'`). The only way to change the temperature is through `set`, which enforces the 10 to 30 rule. The rule lives in **one** place, so it can't be broken by accident anywhere in a million-line program. This is **encapsulation**, the central idea of classes.

      ### Conventions

      - Public interface first, private data last, so readers see what they can use.
      - A trailing underscore (`target_`) marks private data members in many codebases, avoiding clashes with method names like `target()`.
      - A method that only reads is marked `const` (step 4 explains why).

      **Your turn:** write a class `Wallet` with a private `int money_` starting at 800, and public methods:

      - `int money() const` returns it
      - `bool buy(int price)` subtracts the price and returns `true` if there's enough money, otherwise changes nothing and returns `false`
      - `void earn(int amount)` adds money, but the total can never exceed 16000
    seed: |
      class Wallet {
      public:

      private:
          int money_ = 800;
      };
    solution: |
      class Wallet {
      public:
          int money() const { return money_; }
          bool buy(int price) {
              if (price > money_) return false;
              money_ -= price;
              return true;
          }
          void earn(int amount) {
              money_ += amount;
              if (money_ > 16000) money_ = 16000;
          }

      private:
          int money_ = 800;
      };
    harness: |
      int main() {
          Wallet w;
          CHECK_EQ("starts at 800", w.money(), 800);
          CHECK_EQ("buy 1000 fails", w.buy(1000), false);
          CHECK_EQ("money unchanged", w.money(), 800);
          CHECK_EQ("buy 500 works", w.buy(500), true);
          CHECK_EQ("money now 300", w.money(), 300);
          w.earn(3250);
          CHECK_EQ("earn 3250", w.money(), 3550);
          w.earn(20000);
          CHECK_EQ("capped at 16000", w.money(), 16000);
      }
    hints:
      - Put the three methods under `public:`.
      - "In buy: `if (price > money_) return false;` otherwise subtract and return true."
      - "In earn: add, then clamp with `if (money_ > 16000) money_ = 16000;`."
    more:
      - task: |
          Write a class `Ammo` with a private magazine (starting at 30) and reserve (starting at 90), and public methods:

          - `int mag() const` and `int reserve() const`
          - `bool fire()`: uses one bullet and returns `true`, or returns `false` if the magazine is empty
          - `void reload()`: fills the magazine back to 30 from the reserve, as far as the reserve allows
        seed: |
          class Ammo {
          public:

          private:

          };
        solution: |
          class Ammo {
          public:
              int mag() const { return mag_; }
              int reserve() const { return reserve_; }
              bool fire() {
                  if (mag_ == 0) return false;
                  mag_--;
                  return true;
              }
              void reload() {
                  int need = 30 - mag_;
                  if (need > reserve_) need = reserve_;
                  mag_ += need;
                  reserve_ -= need;
              }

          private:
              int mag_ = 30;
              int reserve_ = 90;
          };
        harness: |
          int main() {
              Ammo a;
              for (int i = 0; i < 10; i++) a.fire();
              CHECK_EQ("mag after 10 shots", a.mag(), 20);
              a.reload();
              CHECK("reload moves 10 from the reserve", a.mag() == 30 && a.reserve() == 80);
              for (int i = 0; i < 30; i++) a.fire();
              CHECK_EQ("firing on empty fails", a.fire(), false);
              a.reload(); a.reload();
              for (int i = 0; i < 30; i++) a.fire();
              a.reload();
              for (int i = 0; i < 30; i++) a.fire();
              a.reload();
              CHECK("the last reload only gets what's left", a.mag() == 20 && a.reserve() == 0);
          }
        hints:
          - The magazine needs `30 - mag_` bullets, but the reserve might have fewer. Take the smaller of the two.
        tests: []
      - task: |
          Write a class `Streak` that tracks kill streaks: `void kill()` adds one to the current streak, `void death()` resets it to 0, `int current() const` returns it, and `int best() const` returns the longest streak ever reached. Keep the data private.
        seed: |
          class Streak {
          public:

          private:

          };
        solution: |
          class Streak {
          public:
              void kill() {
                  current_++;
                  if (current_ > best_) best_ = current_;
              }
              void death() { current_ = 0; }
              int current() const { return current_; }
              int best() const { return best_; }

          private:
              int current_ = 0;
              int best_ = 0;
          };
        harness: |
          int main() {
              Streak s;
              CHECK("starts at 0", s.current() == 0 && s.best() == 0);
              s.kill(); s.kill(); s.kill();
              CHECK_EQ("3 kills", s.current(), 3);
              s.death();
              CHECK_EQ("death resets current", s.current(), 0);
              CHECK_EQ("best remembers 3", s.best(), 3);
              s.kill(); s.kill();
              CHECK_EQ("a shorter streak keeps best at 3", s.best(), 3);
              s.kill(); s.kill();
              CHECK_EQ("a longer streak raises best", s.best(), 4);
          }
        hints:
          - Update `best_` every time `current_` grows past it, inside `kill()`.
        tests: []

  - title: Constructors
    id: cpp-classes-3
    text: |
      A **constructor** is a special member function that runs automatically when an object is created. It sets the object up so it's valid from the first moment. It has the same name as the class and **no return type**.

      ```cpp run
      #include <iostream>
      #include <string>

      class Book {
      public:
          Book(std::string title, int pages) : title_(title), pages_(pages), read_(0) {}

          void read(int n) {
              read_ += n;
              if (read_ > pages_) read_ = pages_;
          }
          int percent() const { return read_ * 100 / pages_; }
          std::string title() const { return title_; }

      private:
          std::string title_;
          int pages_;
          int read_;
      };

      int main() {
          Book b("Dune", 400);
          b.read(100);
          std::cout << b.title() << ": " << b.percent() << "%\n";
          Book c{"Emma", 300};
          std::cout << c.title() << ": " << c.percent() << "%\n";
      }
      ```

      ```output
      Dune: 25%
      Emma: 0%
      ```

      ### The member initializer list

      The part after the `:` is the **member initializer list**: `title_(title)` initializes the member `title_` from the parameter `title`, and so on. Members are **constructed** directly with these values, before the constructor's body runs. The body (`{}` here) can then do any extra work.

      ### Creating objects

      `Book b("Dune", 400);` and `Book c{"Emma", 300};` both call the constructor. The brace form (**uniform initialization**) is common in modern C++ and refuses narrowing conversions, like silently turning `3.7` into an `int`.

      Braces have one more rule. A constructor taking a `std::initializer_list<T>` (from `<initializer_list>`) accepts a brace list of any length, and when one exists, braces **prefer** it. That's how `std::vector<int> v{1, 2, 3}` holds three values, and why `std::vector<int> v{3, 7}` holds 3 and 7 while `std::vector<int> v(3, 7)` holds three 7s. Your own classes can take a list the same way: `Bag(std::initializer_list<int> items) { for (int x : items) add(x); }`.

      Once a class has a constructor with parameters, you can't create one without arguments (`Book d;` is an error) unless you also write a constructor that takes none. That's the point: there's no way to get a `Book` without a title and a page count.

      **Your turn:** complete the constructor's initializer list.
    fill: |
