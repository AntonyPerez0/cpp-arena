      struct Gun {
          int mag_size = 30;
          int ammo = 30;
          void fire() { ammo--; }
          void reload() { [[ammo]] = [[mag_size]]; }
      };

      int main() {
          Gun g;
          g.fire();
          g.fire();
          std::cout << g.ammo << " ";
          g[[.reload()]];
          std::cout << g.ammo << "\n";
      }
    hints:
