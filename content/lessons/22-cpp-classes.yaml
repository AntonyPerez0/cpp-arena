        solution: |
          #include <numeric>
          #include <string>

          class Fraction {
          public:
              Fraction(int num, int den = 1) : num_(num), den_(den) {
                  if (den_ < 0) {
                      num_ = -num_;
                      den_ = -den_;
                  }
                  int g = std::gcd(num_, den_);
                  if (g > 1) {
                      num_ /= g;
                      den_ /= g;
                  }
              }
              int num() const { return num_; }
              int den() const { return den_; }
              std::string str() const {
                  if (den_ == 1) return std::to_string(num_);
                  return std::to_string(num_) + "/" + std::to_string(den_);
              }
              // add minus and less here
              Fraction minus(const Fraction& o) const { return Fraction(num_ * o.den_ - o.num_ * den_, den_ * o.den_); }
              bool less(const Fraction& o) const { return num_ * o.den_ < o.num_ * den_; }

          private:
              int num_;
              int den_;
          };
        harness: |
          int main() {
              CHECK_EQ("1/2 - 1/3", Fraction(1, 2).minus(Fraction(1, 3)).str(), std::string("1/6"));
              CHECK_EQ("1/3 - 1/2", Fraction(1, 3).minus(Fraction(1, 2)).str(), std::string("-1/6"));
              CHECK_EQ("3/4 - 3/4", Fraction(3, 4).minus(Fraction(3, 4)).str(), std::string("0"));
              CHECK_EQ("1/3 < 1/2", Fraction(1, 3).less(Fraction(1, 2)), true);
              CHECK_EQ("1/2 < 1/3", Fraction(1, 2).less(Fraction(1, 3)), false);
              CHECK_EQ("-1/2 < 1/3", Fraction(-1, 2).less(Fraction(1, 3)), true);
              CHECK_EQ("2/4 < 1/2 (equal)", Fraction(2, 4).less(Fraction(1, 2)), false);
          }
