id: dsa-sorting
title: Sorting algorithms
lang: cpp
phase: "Data Structures and Algorithms"
summary: How sorting really works. Insertion sort, merge sort, quicksort partitioning, counting sort, stability with custom comparators, and quickselect.
steps:
  - title: Insertion sort
    id: dsa-sorting-1
    text: |
      You'll almost always sort with `std::sort` in real code. But knowing **how** sorting works teaches the core ideas of algorithm design (growing a solved part, divide and conquer, partitioning), and interviewers love asking about it. This module builds the classic algorithms yourself.

      **Insertion sort** grows a sorted prefix, like sorting cards in your hand: take the next card and slide it left past every larger card until its spot opens up.

      ```
      for i in 1..n-1:
          key = v[i]; j = i - 1
          while j >= 0 and v[j] > key: v[j + 1] = v[j]; j--
          v[j + 1] = key
      ```

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      void show(const std::vector<std::string>& v) {
          for (const auto& s : v) std::cout << s << " ";
          std::cout << "\n";
      }

      int main() {
          std::vector<std::string> hand = {"7", "3", "9", "2"};
          show(hand);
          for (std::size_t i = 1; i < hand.size(); i++) {
              std::string key = hand[i];
              int j = (int)i - 1;
              while (j >= 0 && std::stoi(hand[j]) > std::stoi(key)) {
                  hand[j + 1] = hand[j];          // shift the bigger card right
                  j--;
              }
              hand[j + 1] = key;                  // drop the key into the gap
              show(hand);
          }
      }
      ```

      ```output
      7 3 9 2 
      3 7 9 2 
      3 7 9 2 
      2 3 7 9 
      ```

      ### Reading the trace

      - Step 1: `3` is smaller than `7`, so `7` shifts right and `3` goes first.
      - Step 2: `9` is bigger than everything before it, so nothing moves.
      - Step 3: `2` is smaller than all three, so all three shift and `2` lands at the front.

      The part to the left of `i` is always sorted, and each step makes it one longer.

      ### Properties

      - O(n²) in general, but O(n) on data that's already **almost sorted**, because each element only shifts a little.
      - **Stable** (equal elements keep their order) and **in place** (no extra array).
      - Fastest of all for tiny arrays. Real `std::sort` implementations switch to it for ranges below about 16 elements.

      The number of shifts equals the number of pairs that are out of order (called **inversions**), which is why it measures how unsorted the input was.

      **Your turn:** implement `insertion_sort` and return how many element **shifts** it performed (a measure of how unsorted the input was).
    seed: |
      #include <vector>

      long insertion_sort(std::vector<int>& v) {

      }
    solution: |
      #include <vector>

      long insertion_sort(std::vector<int>& v) {
          long shifts = 0;
          for (std::size_t i = 1; i < v.size(); i++) {
              int key = v[i];
              std::size_t j = i;
              while (j > 0 && v[j - 1] > key) {
                  v[j] = v[j - 1];
                  j--;
                  shifts++;
              }
              v[j] = key;
          }
          return shifts;
      }
    forbid:
      - pattern: "std::sort|stable_sort|std::ranges::sort"
        message: Implement the algorithm yourself on this step.
    harness: |
      int main() {
          std::vector<int> a = {5, 2, 4, 6, 1, 3};
          long s = insertion_sort(a);
          CHECK_EQ("sorted", a, (std::vector<int>{1, 2, 3, 4, 5, 6}));
          CHECK_EQ("shifts", s, 9L);
          std::vector<int> sorted = {1, 2, 3, 4};
          CHECK_EQ("already sorted: no shifts", insertion_sort(sorted), 0L);
          std::vector<int> rev = {4, 3, 2, 1};
          CHECK_EQ("reversed: every pair shifts", insertion_sort(rev), 6L);
          std::vector<int> empty;
          CHECK_EQ("empty", insertion_sort(empty), 0L);
      }
    hints:
      - "Loop i from 1; save `key = v[i]` and slide j down while `v[j - 1] > key`."
      - "Using `j > 0` with `v[j - 1]` avoids a negative size_t index."
      - "Count one shift each time you copy `v[j] = v[j - 1]`."

  - title: Merge sort
    id: dsa-sorting-2
    text: |
      **Merge sort** is the classic **divide and conquer** algorithm:

      1. **Divide**: split the array into two halves.
      2. **Conquer**: sort each half, recursively. An array of 0 or 1 elements is already sorted: that's the base case.
      3. **Combine**: **merge** the two sorted halves into one sorted array.

      The merge is the heart of it. With two sorted lists, the smallest remaining element is always at the front of one of them, so you repeatedly take the smaller front:

      ```cpp run
      #include <iostream>
      #include <vector>

      std::vector<int> merge(const std::vector<int>& a, const std::vector<int>& b) {
          std::vector<int> out;
          out.reserve(a.size() + b.size());
          std::size_t i = 0, j = 0;
          while (i < a.size() && j < b.size()) {
              if (a[i] <= b[j]) out.push_back(a[i++]);    // <= keeps it stable
              else out.push_back(b[j++]);
          }
          while (i < a.size()) out.push_back(a[i++]);     // copy whatever is left
          while (j < b.size()) out.push_back(b[j++]);
          return out;
      }

      int main() {
          for (int x : merge({1, 4, 9, 10}, {2, 3, 9, 20, 21})) std::cout << x << " ";
          std::cout << "\n";
      }
      ```

      ```output
      1 2 3 4 9 9 10 20 21 
      ```

      ### Why O(n log n)

      Halving repeatedly gives about log₂ n **levels** of recursion. At each level, the merges together touch every element once, which is O(n) work per level. So the total is O(n log n), and unlike quicksort that's true **even in the worst case**.

      ```
      [5 2 8 1 9 3]
      [5 2 8] [1 9 3]          split
      [5] [2 8] [1] [9 3]      split
      ...                      single elements are sorted
      [2 5 8] [1 3 9]          merge
      [1 2 3 5 8 9]            merge
      ```

      ### Properties

      - Always O(n log n).
      - Stable, as long as the merge takes from the **left** half on ties (`<=`). That's why `std::stable_sort` is usually a merge sort.
      - Needs O(n) extra memory for merging.

      ### Your task

      Write a recursive helper that sorts `v[lo..hi)`: if the range has fewer than 2 elements, return; otherwise sort both halves and merge them through a temporary vector, copying the result back. Allocating one temporary buffer up front and reusing it is faster than making new vectors at every level.

      **Your turn:** implement `merge_sort(std::vector<int>& v)`. The test sorts 200,000 numbers, so an O(n²) sort won't finish in time.
    seed: |
      #include <vector>

      void merge_sort(std::vector<int>& v) {

      }
    solution: |
      #include <vector>

      static void sort_range(std::vector<int>& v, std::vector<int>& tmp, std::size_t lo, std::size_t hi) {
          if (hi - lo < 2) return;
          std::size_t mid = lo + (hi - lo) / 2;
          sort_range(v, tmp, lo, mid);
          sort_range(v, tmp, mid, hi);
          std::size_t i = lo, j = mid, k = lo;
          while (i < mid && j < hi) tmp[k++] = (v[j] < v[i]) ? v[j++] : v[i++];
          while (i < mid) tmp[k++] = v[i++];
          while (j < hi) tmp[k++] = v[j++];
          for (std::size_t x = lo; x < hi; x++) v[x] = tmp[x];
      }

      void merge_sort(std::vector<int>& v) {
          std::vector<int> tmp(v.size());
          sort_range(v, tmp, 0, v.size());
      }
    forbid:
      - pattern: "std::sort|stable_sort|std::ranges::sort|std::merge|inplace_merge"
        message: Implement merge sort yourself on this step.
    harness: |
      #include <algorithm>
      int main() {
          std::vector<int> a = {38, 27, 43, 3, 9, 82, 10};
          merge_sort(a);
          CHECK_EQ("small", a, (std::vector<int>{3, 9, 10, 27, 38, 43, 82}));
          std::vector<int> e;
          merge_sort(e);
          CHECK("empty", e.empty());
          std::vector<int> big(200000);
          unsigned x = 12345;
          for (auto& y : big) {
              x = x * 1103515245u + 12345u;
              y = static_cast<int>(x >> 8) % 1000000;
          }
          std::vector<int> expect = big;
          std::sort(expect.begin(), expect.end());
          merge_sort(big);
          CHECK("200,000 random numbers", big == expect);
      }
    hints:
      - "Write a recursive helper that sorts the half-open range `[lo, hi)` using one shared temporary buffer."
      - "Base case: fewer than 2 elements. Otherwise sort `[lo, mid)` and `[mid, hi)`, then merge into tmp and copy back."
      - "When merging, take from the right half only if it's strictly smaller; that keeps the sort stable."

  - title: Quicksort and partitioning
    id: dsa-sorting-3
    text: |
      **Quicksort** also divides and conquers, but does the hard work **before** recursing instead of after:

      1. Pick a **pivot** element.
      2. **Partition**: rearrange so everything smaller than the pivot comes before it and everything else after. The pivot is now in its **final** position.
      3. Recursively sort the part before the pivot and the part after it. No merge step is needed.

      The **Lomuto** partition, using the last element as the pivot:

      ```
      pivot = v[hi]; i = lo
      for j in lo..hi-1:
          if v[j] < pivot: swap(v[i], v[j]); i++
      swap(v[i], v[hi])     // pivot lands at its final position i
      return i
      ```

      Here's one partition step, printed, on letters:

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>

      int partition(std::string& s, int lo, int hi) {
          char pivot = s[hi];
          int i = lo;                              // s[lo..i) holds letters < pivot
          for (int j = lo; j < hi; j++) {
              if (s[j] < pivot) {
                  std::swap(s[i], s[j]);
                  i++;
              }
          }
          std::swap(s[i], s[hi]);
          return i;
      }

      int main() {
          std::string s = "qjxbmae";
          std::cout << s << "  pivot " << s.back() << "\n";
          int p = partition(s, 0, (int)s.size() - 1);
          std::cout << s << "  pivot now at " << p << "\n";
      }
      ```

      ```output
      qjxbmae  pivot e
      baeqmjx  pivot now at 2
      ```

      ### Reading the result

      After partitioning, `e` sits at index 2, with the smaller letters `b a` before it and the larger `q m j x` after it. Neither side is sorted yet, but `e` is exactly where it belongs in the final order. Quicksort now recurses on `[0, 1]` and `[3, 6]`.

      The invariant that makes Lomuto work: everything in `s[lo..i)` is smaller than the pivot. Each time a smaller element is found, it's swapped to position `i` and the boundary moves right.

      ### Properties

      - O(n log n) on average, in place, and very fast in practice thanks to good cache behavior.
      - O(n²) worst case with bad pivots, for example always taking the last element of already-sorted data: every partition then splits off just one element. That's why real implementations pick pivots carefully, and `std::sort` falls back to heapsort when recursion gets too deep ("introsort").
      - Not stable.

      ### Your task

      `partition` is the loop above on a `std::vector<int>`. `quick_sort(v, lo, hi)` returns when `lo >= hi` (zero or one element); otherwise it partitions, getting `p`, and recurses on `lo..p-1` and `p+1..hi`. Note that the pivot itself is **excluded** from both recursive calls, which guarantees progress.

      **Your turn:** write `int partition(std::vector<int>& v, int lo, int hi)` (inclusive range) and `void quick_sort(std::vector<int>& v, int lo, int hi)`.
    seed: |
      #include <utility>
      #include <vector>

      int partition(std::vector<int>& v, int lo, int hi) {

      }

      void quick_sort(std::vector<int>& v, int lo, int hi) {

      }
    solution: |
      #include <utility>
      #include <vector>

      int partition(std::vector<int>& v, int lo, int hi) {
          int pivot = v[hi];
          int i = lo;
          for (int j = lo; j < hi; j++) {
              if (v[j] < pivot) {
                  std::swap(v[i], v[j]);
                  i++;
              }
          }
          std::swap(v[i], v[hi]);
          return i;
      }

      void quick_sort(std::vector<int>& v, int lo, int hi) {
          if (lo >= hi) return;
          int p = partition(v, lo, hi);
          quick_sort(v, lo, p - 1);
          quick_sort(v, p + 1, hi);
      }
    forbid:
      - pattern: "std::sort|stable_sort|std::ranges::sort|std::partition|nth_element"
        message: Implement the partition yourself on this step.
    harness: |
      #include <algorithm>
      int main() {
          std::vector<int> p = {7, 2, 9, 4, 5};
          int at = partition(p, 0, 4);
          CHECK_EQ("pivot 5 lands at index 2", at, 2);
          CHECK("left side smaller", p[0] < 5 && p[1] < 5);
          CHECK("right side larger", p[3] > 5 && p[4] > 5);
          std::vector<int> a = {3, 6, 1, 8, 2, 9, 2};
          quick_sort(a, 0, 6);
          CHECK_EQ("sorted with duplicates", a, (std::vector<int>{1, 2, 2, 3, 6, 8, 9}));
          std::vector<int> big(100000);
          unsigned x = 99;
          for (auto& y : big) {
              x = x * 1664525u + 1013904223u;
              y = static_cast<int>(x >> 4);
          }
          std::vector<int> expect = big;
          std::sort(expect.begin(), expect.end());
          quick_sort(big, 0, static_cast<int>(big.size()) - 1);
          CHECK("100,000 random numbers", big == expect);
      }
    hints:
      - "partition: `int pivot = v[hi]; int i = lo;` then for each j < hi, swap smaller elements to position i."
      - "Finally swap the pivot into place: `std::swap(v[i], v[hi]); return i;`"
      - "quick_sort: stop when `lo >= hi`, else partition and recurse on both sides of p."

  - title: Counting sort
    id: dsa-sorting-4
    text: |
      Comparison sorts, which only learn about the data by asking "is a < b?", can't beat O(n log n) in the worst case. That's a proven limit. But when the values are **small integers** in a known range `0..k`, you don't need comparisons at all: **count** how many times each value occurs, then write the values back in order. That's O(n + k).

      ```cpp run
      #include <iostream>
      #include <string>
      #include <vector>

      int main() {
          std::vector<int> grades = {3, 1, 4, 1, 5, 3, 3, 0, 5};    // grades 0..5
          std::vector<int> count(6, 0);
          for (int g : grades) count[g]++;                        // tally

          for (int g = 0; g <= 5; g++) {
              std::cout << g << ": " << std::string(count[g], '#') << "\n";
          }

          std::size_t k = 0;
          for (int g = 0; g <= 5; g++) {
              for (int c = 0; c < count[g]; c++) grades[k++] = g;   // write back in order
          }
          for (int g : grades) std::cout << g << " ";
          std::cout << "\n";
      }
      ```

      ```output
      0: #
      1: ##
      2: 
      3: ###
      4: #
      5: ##
      0 1 1 3 3 3 4 5 5 
      ```

      ### How it works

      - The count array has one slot per possible value: `max_value + 1` slots, because the range includes both 0 and the maximum.
      - The first pass tallies; the second writes each value back as many times as it was counted.
      - No element is ever compared with another.

      ### When to use it

      It shines when the range `k` is small compared with n: ages, exam scores, bytes (0 to 255), days of the month. Sorting a million ages is basically instant. It's also the building block of **radix sort**, which sorts big numbers digit by digit with counting passes. If `k` is huge (say, arbitrary 32-bit ints), the count array would be enormous, and a comparison sort is the better choice.

      **Your turn:** write `void counting_sort(std::vector<int>& v, int max_value)` for values in `0..max_value`.
    seed: |
      #include <vector>

      void counting_sort(std::vector<int>& v, int max_value) {

      }
    solution: |
      #include <vector>

      void counting_sort(std::vector<int>& v, int max_value) {
          std::vector<int> count(max_value + 1, 0);
          for (int x : v) count[x]++;
          std::size_t k = 0;
          for (int value = 0; value <= max_value; value++) {
              for (int c = 0; c < count[value]; c++) v[k++] = value;
          }
      }
    forbid:
      - pattern: "std::sort|stable_sort|std::ranges::sort"
        message: Count, don't compare, on this step.
    harness: |
      int main() {
          std::vector<int> a = {4, 1, 3, 4, 0, 1, 1};
          counting_sort(a, 4);
          CHECK_EQ("small", a, (std::vector<int>{0, 1, 1, 1, 3, 4, 4}));
          std::vector<int> big(1000000);
          for (int i = 0; i < 1000000; i++) big[i] = (i * 37) % 101;
          counting_sort(big, 100);
          bool ok = true;
          for (std::size_t i = 1; i < big.size(); i++) if (big[i - 1] > big[i]) ok = false;
          CHECK("a million values", ok && big.front() == 0 && big.back() == 100);
      }
    hints:
      - "`std::vector<int> count(max_value + 1, 0);` and `count[x]++` for every x."
      - "Then walk value from 0 to max_value, writing it `count[value]` times."

  - title: Stability and custom comparators
    id: dsa-sorting-5
    text: |
      A sort is **stable** if equal elements keep their original relative order. It sounds like a detail, but it matters whenever the input order means something (arrival time, sign-up order) or when you sort by one key after another.

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <string>
      #include <vector>

      struct Order {
          std::string id;
          int priority;
      };

      int main() {
          // Arrival order: a1 came first, then b2, and so on.
          std::vector<Order> q = {{"a1", 2}, {"b2", 1}, {"c3", 2}, {"d4", 1}, {"e5", 2}};

          std::stable_sort(q.begin(), q.end(), [](const Order& x, const Order& y) {
              return x.priority < y.priority;          // strictly less: a valid comparator
          });
          for (const auto& o : q) std::cout << o.id << "(" << o.priority << ") ";
          std::cout << "\n";
      }
      ```

      ```output
      b2(1) d4(1) a1(2) c3(2) e5(2) 
      ```

      Within each priority, orders are still in arrival order: `b2` before `d4`, and `a1`, `c3`, `e5` in sequence. `std::sort` might have mixed them up.

      ### std::sort vs std::stable_sort

      - `std::sort`: not stable, usually slightly faster.
      - `std::stable_sort`: stable. Use it whenever ties must keep their order.

      ### Comparators must be strict

      A comparator answers "must `a` come **strictly** before `b`?". For equal elements it must return `false` both ways. So use `<` or `>`, never `<=` or `>=`. Breaking this rule is undefined behavior: results can be wrong, and with `std::sort` it can even read outside the array and crash.

      For "highest score first", compare with `>`: `return a.score > b.score;`.

      **Your turn:** write `void rank(std::vector<Entry>& v)` that orders entries by score, highest first. Entries with equal scores must stay in their original (sign-up) order.
    seed: |
      #include <algorithm>
      #include <string>
      #include <vector>

      struct Entry {
          std::string name;
          int score;
      };

      void rank(std::vector<Entry>& v) {

      }
    solution: |
      #include <algorithm>
      #include <string>
      #include <vector>

      struct Entry {
          std::string name;
          int score;
      };

      void rank(std::vector<Entry>& v) {
          std::stable_sort(v.begin(), v.end(), [](const Entry& a, const Entry& b) { return a.score > b.score; });
      }
    forbid:
      - pattern: "<=|>="
        message: "A comparator must be strict: use `>` or `<`, never `<=` or `>=`."
    harness: |
      int main() {
          std::vector<Entry> v = {{"a", 10}, {"b", 30}, {"c", 10}, {"d", 30}, {"e", 20}, {"f", 10}};
          rank(v);
          std::string order;
          for (const auto& e : v) order += e.name;
          CHECK_EQ("by score, ties in sign-up order", order, std::string("bdeacf"));
          std::vector<Entry> many;
          for (int i = 0; i < 50000; i++) many.push_back({std::to_string(i), i % 3});
          rank(many);
          bool stable = true;
          for (std::size_t i = 1; i < many.size(); i++)
              if (many[i - 1].score == many[i].score && std::stoi(many[i - 1].name) > std::stoi(many[i].name)) stable = false;
          CHECK("stable on 50,000 entries", stable && many.front().score == 2);
      }
    hints:
      - "Use `std::stable_sort` with a lambda comparator."
      - "Highest first: `return a.score > b.score;`"

  - title: "Challenge: quickselect"
    id: dsa-sorting-6
    text: |
      To find the k-th smallest element (a median, a percentile, "the 95th percentile latency"), you don't need to sort everything. **Quickselect** partitions like quicksort, but then only continues into the **one side** that contains position k. The other side is never touched.

      ```cpp run
      #include <algorithm>
      #include <iostream>
      #include <vector>

      int main() {
          std::vector<int> latency_ms = {120, 35, 80, 300, 45, 60, 95, 40, 250, 55};

          std::vector<int> v = latency_ms;
          std::size_t mid = v.size() / 2;
          std::nth_element(v.begin(), v.begin() + mid, v.end());
          std::cout << "median-ish (index 5): " << v[mid] << "\n";

          std::size_t p90 = v.size() * 9 / 10;
          std::nth_element(v.begin(), v.begin() + p90, v.end());
          std::cout << "90th percentile: " << v[p90] << "\n";

          std::sort(latency_ms.begin(), latency_ms.end());      // check against a full sort
          std::cout << latency_ms[mid] << " " << latency_ms[p90] << "\n";
      }
      ```

      ```output
      median-ish (index 5): 80
      90th percentile: 300
      80 300
      ```

      `std::nth_element` puts the element that **would** be at that position after sorting into place, with smaller ones before it and larger ones after, in no particular order. That's quickselect.

      ### Why O(n) on average

      Each partition costs time proportional to the current range, and with a decent pivot the range roughly halves: n + n/2 + n/4 + ... is about 2n, so O(n) on average. Sorting would be O(n log n).

      ### The loop

      ```
      lo = 0, hi = n - 1
      loop:
          p = partition(v, lo, hi)
          if p == k: return v[k]
          if k < p: hi = p - 1
          else: lo = p + 1
      ```

      No recursion is needed, since only one side continues.

      ### Pivot choice

      With the last element as the pivot, already-sorted input makes every partition split off just one element, which is O(n²). Taking the **middle** element as the pivot (swap it to the end, then partition as usual) fixes the common sorted and reverse-sorted cases.

      **Your turn:** write `int kth_smallest(std::vector<int> v, int k)` (k is 0-based; the vector is passed by value so you may rearrange it) using your own partition loop. Pick the **middle** element as the pivot (swap it to the end first) so already-sorted input stays fast.
    seed: |
      #include <utility>
      #include <vector>

      int kth_smallest(std::vector<int> v, int k) {

      }
    solution: |
      #include <utility>
      #include <vector>

      int kth_smallest(std::vector<int> v, int k) {
          int lo = 0, hi = static_cast<int>(v.size()) - 1;
          while (true) {
              if (lo == hi) return v[lo];
              int mid = lo + (hi - lo) / 2;
              std::swap(v[mid], v[hi]);
              int pivot = v[hi], i = lo;
              for (int j = lo; j < hi; j++) {
                  if (v[j] < pivot) std::swap(v[i++], v[j]);
              }
              std::swap(v[i], v[hi]);
              if (k == i) return v[i];
              if (k < i) hi = i - 1;
              else lo = i + 1;
          }
      }
    forbid:
      - pattern: "std::sort|stable_sort|nth_element|std::ranges::|partial_sort|priority_queue"
        message: Write the partition loop yourself.
    harness: |
      int main() {
          CHECK_EQ("median of 5", kth_smallest({9, 1, 7, 3, 5}, 2), 5);
          CHECK_EQ("smallest", kth_smallest({9, 1, 7, 3, 5}, 0), 1);
          CHECK_EQ("largest", kth_smallest({9, 1, 7, 3, 5}, 4), 9);
          CHECK_EQ("duplicates", kth_smallest({4, 4, 4, 1}, 2), 4);
          CHECK_EQ("single", kth_smallest({42}, 0), 42);
          std::vector<int> sorted(200000);
          for (int i = 0; i < 200000; i++) sorted[i] = i;
          CHECK_EQ("already sorted input stays fast", kth_smallest(sorted, 123456), 123456);
          std::vector<int> big(300000);
          for (int i = 0; i < 300000; i++) big[i] = static_cast<int>((7919LL * i) % 300000);
          CHECK_EQ("300,000 shuffled", kth_smallest(big, 150000), 150000);
      }
