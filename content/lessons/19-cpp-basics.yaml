id: cpp-basics
title: From C to C++
lang: cpp
phase: "C++: A Better C"
summary: Everything you know from C still works, plus iostream, std::string, bool, auto and range-based for loops.
steps:
  - title: Hello, C++
    id: cpp-basics-1
    text: |
      Welcome to C++. Bjarne Stroustrup started it in 1979 as "C with Classes" and renamed it C++ in 1983, and almost everything you learned in C still works: variables, `if`, loops, functions, pointers, arrays and structs. What C++ adds are tools that make programs **safer** and **shorter**: classes that clean up after themselves, a huge standard library (strings, dynamic arrays, maps, algorithms), references, templates and more.

      The first difference you'll notice is output. Instead of `printf` with format specifiers, C++ uses **streams**:

      ```cpp run
      #include <iostream>

      int main() {
          int kills = 25;
          double accuracy = 0.61;
          std::cout << "Kills: " << kills << "\n";
          std::cout << "Accuracy: " << accuracy << " (" << accuracy * 100 << "%)\n";
      }
      ```

      ```output
      Kills: 25
      Accuracy: 0.61 (61%)
      ```

      ### How it works

      - `#include <iostream>` brings in the stream library (C++ standard headers have no `.h`).
      - `std::cout` is the **standard output** stream, the C++ equivalent of `stdout`.
      - `<<` sends a value into the stream. Expressions chain from left to right: each `<<` returns the stream again, so the next `<<` continues writing.
      - There are **no format specifiers**. The compiler knows each value's type and picks the right way to print it, so the classic `printf` mismatch bugs can't happen.
      - `std::` is a **namespace** prefix: the standard library's names live in the namespace `std`, so they don't clash with your own names.
      - In C++, `main` may leave out `return 0;`; reaching the end of `main` means success.

      You'll see `std::endl` in older code; it prints a newline **and** flushes the stream, which is slower. `"\n"` is usually what you want.

      **Your turn:** print `Rounds won: 13` using cout.
    fill: |
      #include <iostream>

      int main() {
          int won = 13;
          [[std::cout]] [[<<]] "Rounds won: " << [[won]] << "\n";
      }
    hints:
      - The output stream is `std::cout` and the operator that sends to it is `<<`.
    tests:
      - expect: "Rounds won: 13"
    more:
      - task: |
          Print the K/D as `25/12` by chaining the two variables and a `"/"` in one `std::cout` statement.
        fill: |
          #include <iostream>

          int main() {
              int kills = 25;
              int deaths = 12;
              std::cout << [[kills]] << [["/"]] << [[deaths]] << "\n";
          }
        hints:
          - Each `<<` sends one more thing to the output, in order.
          - The slash is text, so it goes in double quotes.
        tests:
          - expect: "25/12"
      - task: |
          Using the variables, print these three lines with `std::cout`. Compute the rounds played instead of typing 24:

          ```
          Map: mirage
          Rounds: 24
          Score: 13-11
          ```
        seed: |
          #include <iostream>
          #include <string>

          int main() {
              std::string map = "mirage";
              int t = 13;
              int ct = 11;
              // print the three lines

          }
        solution: |
          #include <iostream>
          #include <string>

          int main() {
              std::string map = "mirage";
              int t = 13;
              int ct = 11;
              // print the three lines
              std::cout << "Map: " << map << "\n";
              std::cout << "Rounds: " << t + ct << "\n";
              std::cout << "Score: " << t << "-" << ct << "\n";
          }
        require:
          - pattern: "t\\s*\\+\\s*ct|ct\\s*\\+\\s*t"
            message: Compute the rounds as `t + ct`.
        hints:
          - "A `std::string` prints with `<<` just like a number: `std::cout << \"Map: \" << map << \"\\n\";`"
          - "You can put an expression straight into the chain: `<< t + ct <<`."
        tests:
          - expect: "Map: mirage\nRounds: 24\nScore: 13-11"

  - title: Reading with cin
    id: cpp-basics-2
    text: |
      Input works the same way in reverse: `std::cin` is the **standard input** stream, and `>>` reads a value from it into a variable.

      ```cpp run
      #include <iostream>
      #include <string>

      int main() {
          std::string city;
          int year;
          double temp;
          std::cin >> city >> year >> temp;
          std::cout << city << " in " << year << ": " << temp << " degrees\n";
      }
      ```

      ```input
      Oslo 2024
      -3.5
      ```

      ```output
      Oslo in 2024: -3.5 degrees
      ```

      ### Compared with scanf

      - **No `&`**: `>>` takes its argument by reference (you'll learn references in the next module), so it can fill the variable directly.
      - **No format specifiers**: the variable's type decides how the text is parsed. Reading into an `int` parses a number; reading into a `std::string` reads a word.
      - Like `scanf`, `>>` **skips whitespace** before each value, so values can be separated by spaces or newlines.

      ### std::string

      `std::string` (from `<string>`) is C++'s real string type. It grows automatically as needed, knows its own length, and frees its memory when it's no longer used. No fixed-size arrays, no `'\0'` bookkeeping, and no buffer overflows when a user types a long name. Reading into it with `>>` reads one **word** (up to the next whitespace).

      If a read fails (say, letters where an `int` was expected), the stream goes into a **fail state** and further reads do nothing. `if (std::cin >> x)` checks whether a read worked, like checking `scanf`'s return value.

      **Your turn:** read a name and a number of kills and print `NAME got N kills`.
    fill: |
      #include <iostream>
      #include <string>

      int main() {
          [[std::string]] name;
          int kills;
          std::cin [[>>]] name >> kills;
          std::cout << name << " got " << kills << " kills\n";
      }
    hints:
      - The C++ string type is `std::string`.
      - Reading uses `>>` (the arrows point where the data flows).
    tests:
      - stdin: "dev1ce 27\n"
      - stdin: "twistzz 3\n"
      - stdin: "karrigan 0\n"
        hidden: true
    more:
      - task: |
          Read two whole numbers and print their sum. Input `18 7` prints `25`.
        fill: |
          #include <iostream>

          int main() {
              int a, b;
              std::cin [[>>]] a [[>>]] b;
              std::cout << a + b << "\n";
          }
        hints:
          - Input flows **out of** `std::cin` **into** the variables, so the arrows point right, `>>`.
        tests:
          - stdin: "18 7\n"
          - stdin: "-3 3\n"
          - stdin: "100\n250\n"
            hidden: true
      - task: |
          The input is pairs of `name kills` until the end. Print the player with the most kills (the first one on a tie) as `MVP NAME KILLS`. Input `rain 18 ropz 25 broky 25` prints `MVP ropz 25`.
        seed: |
          #include <iostream>
          #include <string>

          int main() {

          }
        solution: |
          #include <iostream>
          #include <string>

          int main() {
              std::string name, best;
              int kills, best_kills = -1;
              while (std::cin >> name >> kills) {
                  if (kills > best_kills) {
                      best_kills = kills;
                      best = name;
                  }
              }
              std::cout << "MVP " << best << " " << best_kills << "\n";
          }
        hints:
          - "`while (std::cin >> name >> kills)` keeps reading pairs and stops at the end of the input."
          - Copying a `std::string` is just `best = name;`, no `strcpy` needed.
        tests:
          - stdin: "rain 18 ropz 25 broky 25\n"
          - stdin: "solo 0\n"
          - stdin: "a 1\nb 2\nc 9\nd 3\n"
            hidden: true

  - title: std::string is easy
    id: cpp-basics-3
    text: |
      `std::string` takes care of everything that made C strings painful. It behaves like a normal value: you can copy it with `=`, compare it with `==`, and join strings with `+`.

      ```cpp run
      #include <iostream>
      #include <string>

      int main() {
          std::string map = "mirage";
          std::string title = "de_" + map;
          title += " (competitive)";
          std::cout << title << "\n";
          std::cout << title.size() << " chars, first '" << title[0] << "'\n";
          std::cout << (map == "mirage") << " " << (map < "nuke") << "\n";
          std::string copy = map;
          copy[0] = 'M';
          std::cout << map << " " << copy << "\n";
      }
      ```

      ```output
      de_mirage (competitive)
      23 chars, first 'd'
      1 1
      mirage Mirage
      ```

      ### What you get

      - `+` joins strings, and `+=` appends. The string grows as needed.
      - `.size()` (or `.length()`) gives the number of characters, instantly; no counting to a terminator.
      - `==`, `!=`, `<` and `>` compare the **text**, alphabetically. The C trap of comparing addresses is gone.
      - `s[i]` reads or writes one character, as with arrays.
      - Assignment **copies** the text: changing `copy` doesn't affect `map`. Each string owns its own characters.

      `.size()` is a **member function**: a function that belongs to the object and is called with a dot. You'll write your own in the classes module.

      ### One trap

      `"de_" + map` works because one side is a `std::string`. But `"de_" + "dust2"` (two plain literals) doesn't compile (`invalid operands to binary expression`): literals are C-style char arrays, which turn into pointers, and C++ has no `+` that joins two pointers. Make sure at least one side of the first `+` is a `std::string`.

      **Your turn:** read a first name and a last name, then print `Hello, First Last! (N letters)` where N is the number of letters in both names (not counting the space).
    seed: |
      #include <iostream>
      #include <string>

      int main() {
          std::string first, last;
          std::cin >> first >> last;

      }
    solution: |
      #include <iostream>
      #include <string>

      int main() {
          std::string first, last;
          std::cin >> first >> last;
          std::string full = first + " " + last;
          std::cout << "Hello, " << full << "! (" << first.size() + last.size() << " letters)\n";
      }
    hints:
      - "`first + \" \" + last` builds the full name."
      - "`first.size() + last.size()` counts the letters."
    tests:
      - stdin: "Oleksandr Kostyliev\n"
      - stdin: "Ada Lovelace\n"
      - stdin: "Li Na\n"
        hidden: true
    more:
      - task: |
          Read a player's name and print how long it is and its first and last letter. Input `ropz` prints `ropz: 4 letters, starts with r, ends with z`.
        seed: |
          #include <iostream>
          #include <string>

          int main() {
              std::string name;
              std::cin >> name;

          }
        solution: |
          #include <iostream>
          #include <string>

          int main() {
              std::string name;
              std::cin >> name;
              std::cout << name << ": " << name.size() << " letters, starts with " << name[0]
                        << ", ends with " << name.back() << "\n";
          }
        hints:
          - "`name.size()` is the length, `name[0]` is the first character, and `name.back()` is the last."
        tests:
          - stdin: "ropz\n"
          - stdin: "s1mple\n"
          - stdin: "x\n"
            hidden: true
      - task: |
          Read words until the end of the input and join them with `-` into one `std::string`, then print it and its length. Input `rush b now` prints `rush-b-now 10`.
        seed: |
          #include <iostream>
          #include <string>

          int main() {

          }
        solution: |
          #include <iostream>
          #include <string>

          int main() {
              std::string word, joined;
              while (std::cin >> word) {
                  if (!joined.empty()) joined += "-";
                  joined += word;
              }
              std::cout << joined << " " << joined.size() << "\n";
          }
        hints:
          - "`joined += word;` appends to a string. It grows by itself, so there's no buffer size to worry about."
          - Add the `-` before every word except the first. `joined.empty()` tells you if nothing was added yet.
        tests:
          - stdin: "rush b now\n"
          - stdin: "gg\n"
          - stdin: "a b c d\n"
            hidden: true

  - title: bool, auto and range-for
    id: cpp-basics-4
    text: |
      A few small upgrades from C that you'll use constantly.

      ### bool

      `bool` is a built-in type with the values `true` and `false`. Comparisons produce a `bool`. When printed with `cout` it shows as `1` or `0` (or `true`/`false` with `std::boolalpha`).

      ### auto

      `auto` tells the compiler to **deduce** a variable's type from its initializer: `auto n = 5;` is an `int`, `auto x = 2.5;` is a `double`. It's especially handy for long type names you'll meet later. The type is still fixed at compile time; `auto` just saves typing it.

      ### The range-based for loop

      This loop visits every element of a string, array or container, without an index:

      ```cpp run
      #include <iostream>
      #include <string>

      int count_digits(const std::string& s) {
          int n = 0;
          for (char c : s) {
              if (c >= '0' && c <= '9') {
                  n++;
              }
          }
          return n;
      }

      int main() {
          auto label = std::string("room 101, floor 3");
          bool has_digits = count_digits(label) > 0;
          std::cout << count_digits(label) << " " << has_digits << "\n";
          int scores[] = {7, 9, 4};
          int total = 0;
          for (int s : scores) total += s;
          std::cout << total << "\n";
      }
      ```

      ```output
      4 1
      20
      ```

      Read `for (char c : s)` as "for each char `c` in `s`". On each pass, `c` is a **copy** of the next element. You can't accidentally go out of bounds, and there's no off-by-one to get wrong. Use the index form only when you actually need the index.

      (`const std::string&` in the parameter avoids copying the string; the next module explains it.)

      **Your turn:** write `int count_vowels(std::string s)` that counts `a e i o u` (lowercase only) using a range-based for loop.
    seed: |
      #include <string>

      int count_vowels(std::string s) {

      }
    solution: |
      #include <string>

      int count_vowels(std::string s) {
          int n = 0;
          for (char c : s) {
              if (c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u') n++;
          }
          return n;
      }
    require:
      - pattern: "for\\s*\\(\\s*(auto|char|const\\s+char|const\\s+auto)\\s*&?\\s*\\w+\\s*:"
        message: "Use a range-based for loop (`for (char c : s)`)."
    harness: |
      int main() {
          CHECK_EQ("count_vowels(\"inferno\")", count_vowels("inferno"), 3);
          CHECK_EQ("count_vowels(\"rhythm\")", count_vowels("rhythm"), 0);
          CHECK_EQ("count_vowels(\"\")", count_vowels(""), 0);
          CHECK_EQ("count_vowels(\"aeiou aeiou\")", count_vowels("aeiou aeiou"), 10);
      }
    hints:
      - "`for (char c : s)` gives you each character."
      - "Check `c == 'a' || c == 'e' || ...` and count."
    more:
      - task: |
          Write `int count_upper(std::string s)` that counts the capital letters `A` to `Z` using a range-based for loop.
        seed: |
          #include <string>

          int count_upper(std::string s) {

          }
        solution: |
          #include <string>

          int count_upper(std::string s) {
              int n = 0;
              for (char c : s) {
                  if (c >= 'A' && c <= 'Z') n++;
              }
              return n;
          }
        harness: |
          int main() {
              CHECK_EQ("count_upper(\"NaVi\")", count_upper("NaVi"), 2);
              CHECK_EQ("count_upper(\"GG WP\")", count_upper("GG WP"), 4);
              CHECK_EQ("count_upper(\"quiet\")", count_upper("quiet"), 0);
              CHECK_EQ("count_upper(\"\")", count_upper(""), 0);
          }
        require:
          - pattern: "for\\s*\\(\\s*(auto|char|const\\s+char|const\\s+auto)\\s*&?\\s*\\w+\\s*:"
            message: "Use a range-based for loop, like `for (char c : s)`."
        hints:
          - "`for (char c : s)` visits every character of the string."
        tests: []
      - task: |
          Write two functions with range-based for loops: `std::string without_spaces(std::string s)`, which returns `s` with every space removed, and `bool all_digits(std::string s)`, which is `true` when every character is `0` to `9` (an empty string is **not** all digits).
        seed: |
          #include <string>

          std::string without_spaces(std::string s) {

          }

          bool all_digits(std::string s) {

          }
        solution: |
          #include <string>

          std::string without_spaces(std::string s) {
              std::string out;
              for (char c : s) {
                  if (c != ' ') out += c;
              }
              return out;
          }

          bool all_digits(std::string s) {
              if (s.empty()) return false;
              for (char c : s) {
                  if (c < '0' || c > '9') return false;
              }
              return true;
          }
        harness: |
          int main() {
              CHECK_EQ("without_spaces(\"rush b now\")", without_spaces("rush b now"), std::string("rushbnow"));
              CHECK_EQ("without_spaces(\"  \")", without_spaces("  "), std::string(""));
              CHECK_EQ("all_digits(\"2024\")", all_digits("2024"), true);
              CHECK_EQ("all_digits(\"12a\")", all_digits("12a"), false);
              CHECK_EQ("all_digits(\"\")", all_digits(""), false);
          }
        require:
          - pattern: "for\\s*\\(\\s*(auto|char|const\\s+char|const\\s+auto)\\s*&?\\s*\\w+\\s*:"
            message: "Use a range-based for loop, like `for (char c : s)`."
        hints:
          - "Build the result with `out += c;` for every character you keep."
          - For `all_digits`, check for empty first, then return `false` at the first character outside `'0'` to `'9'`.
        tests: []

  - title: Namespaces and using
    id: cpp-basics-5
    text: |
      Large programs combine code from many libraries, and two libraries might both define a function called `load` or a type called `Config`. C++ avoids these clashes with **namespaces**: named scopes that group related names.

      ```cpp run
      #include <iostream>
      #include <string>

      namespace audio {
          int volume = 7;
          std::string name() { return "audio"; }
      }

      namespace video {
          int volume = 3;
          std::string name() { return "video"; }
      }

      using std::cout;

      int main() {
          cout << audio::name() << " " << audio::volume << "\n";
          cout << video::name() << " " << video::volume << "\n";
      }
      ```

      ```output
      audio 7
      video 3
      ```

      - `namespace audio { ... }` puts everything inside into the `audio` namespace.
      - `::` is the **scope resolution operator**: `audio::volume` means "the `volume` inside `audio`". Both namespaces have a `volume` and there's no conflict.
      - The standard library lives in `std`, which is why you write `std::cout` and `std::string`.

      ### Shortening names

      - `using std::cout;` (a **using-declaration**) brings one name into scope, so you can write `cout`.
      - `using namespace std;` brings in **every** name from `std`. You'll see it in tutorials, and it's fine in tiny programs, but it's a bad habit in real code: `std` contains hundreds of names, and pulling them all in invites clashes (with your own `count`, `max`, `distance`, ...). Never put it in a header, where it would affect every file that includes it.

      Most professional code simply writes `std::` everywhere; it quickly becomes invisible.

      **Your turn:** fill in the scope operators and the using-declaration.
    fill: |
      #include <iostream>
      #include <string>

      namespace config {
          const int tickrate = 128;
      }

      [[using]] std::string;

      int main() {
          string server = "faceit";
          std::cout << server << " " << config[[::]]tickrate << "\n";
      }
    hints:
      - "`using std::string;` brings just that one name into scope."
      - The scope operator is `::`.
    tests:
      - expect: "faceit 128"
    more:
      - task: |
          Put the function in a namespace called `scoring` and call it through that namespace, so the program prints `900`.
        fill: |
          #include <iostream>

          namespace [[scoring]] {
              int kill_reward() { return 300; }
          }

          int main() {
              std::cout << scoring[[::]]kill_reward() * 3 << "\n";
          }
        hints:
          - The namespace's name comes right after the keyword `namespace`.
          - Names inside a namespace are reached with `::`, like `std::cout`.
        tests:
          - expect: "900"
      - task: |
          Two namespaces can each have a function with the same name without clashing. Create namespaces `ct` and `t`, each with a function `std::string side_name()`, returning `"Counter-Terrorists"` and `"Terrorists"`, and print both, one per line.
        seed: |
          #include <iostream>
          #include <string>

          // two namespaces here

          int main() {

          }
        solution: |
          #include <iostream>
          #include <string>

          // two namespaces here
          namespace ct {
              std::string side_name() { return "Counter-Terrorists"; }
          }

          namespace t {
              std::string side_name() { return "Terrorists"; }
          }

          int main() {
              std::cout << ct::side_name() << "\n";
              std::cout << t::side_name() << "\n";
          }
        require:
          - pattern: "namespace\\s+ct\\b"
            message: "Create `namespace ct { ... }`."
          - pattern: "namespace\\s+t\\b"
            message: "Create `namespace t { ... }`."
          - pattern: "ct::side_name[\\s\\S]*t::side_name|t::side_name[\\s\\S]*ct::side_name"
            message: "Call both functions through their namespaces, `ct::side_name()` and `t::side_name()`."
        hints:
          - "`namespace ct { std::string side_name() { return \"Counter-Terrorists\"; } }`"
        tests:
          - expect: "Counter-Terrorists\nTerrorists"

  - title: Whole lines with getline
    id: cpp-basics-6
    text: |
      `std::cin >> word` reads a single word and stops at whitespace, so a line like `rush b` would arrive in two pieces. To read an entire line, spaces included, use `std::getline`:

      ```cpp
      std::string line;
      std::getline(std::cin, line);
      ```

      It reads everything up to the end of the line and **removes** the newline (unlike C's `fgets`, which keeps it).

      ### Reading every line

      `getline` returns the stream, and a stream converts to `false` once reading fails, which happens at the end of the input. So the standard loop is:

      ```cpp run
      #include <iostream>
      #include <string>

      int main() {
          std::string line;
          int longest = 0;
          int count = 0;
          while (std::getline(std::cin, line)) {
              count++;
              if ((int)line.size() > longest) {
                  longest = line.size();
              }
          }
          std::cout << count << " lines, longest has " << longest << " chars\n";
      }
      ```

      ```input
      to be
      or not to be
      that is the question
      ```

      ```output
      3 lines, longest has 20 chars
      ```

      ### Mixing `>>` and getline

      A classic trap: after `std::cin >> n;` reads a number, the newline after it is still waiting in the input. A following `getline` reads that leftover newline and returns an **empty line**. The fix is to skip it first, for example with `std::cin >> std::ws;` (which skips whitespace) before calling `getline`.

      **Your turn:** read lines until the end of input and print each one prefixed with its line number, like `1: first line`. Then print `total N`.
    seed: |
      #include <iostream>
      #include <string>

      int main() {
          std::string line;

      }
    solution: |
      #include <iostream>
      #include <string>

      int main() {
          std::string line;
          int n = 0;
          while (std::getline(std::cin, line)) {
              n++;
              std::cout << n << ": " << line << "\n";
          }
          std::cout << "total " << n << "\n";
      }
    hints:
      - "Loop with `while (std::getline(std::cin, line))`."
      - Keep a counter, increment it before printing each line.
    tests:
      - stdin: "rush b\ndon't stop\n"
      - stdin: "one line only\n"
      - stdin: ""
      - stdin: "a b c\n\nlast\n"
        hidden: true
    more:
      - task: |
          Read lines until the end and print the **longest** line (the first one on a tie) as `longest: LINE`. With no input at all, print `no lines`.
        seed: |
          #include <iostream>
          #include <string>

          int main() {

          }
        solution: |
          #include <iostream>
          #include <string>

          int main() {
              std::string line, longest;
              bool any = false;
              while (std::getline(std::cin, line)) {
                  if (!any || line.size() > longest.size()) longest = line;
                  any = true;
              }
              if (any) std::cout << "longest: " << longest << "\n";
              else std::cout << "no lines\n";
          }
        hints:
          - "`while (std::getline(std::cin, line))` reads one whole line at a time, spaces included."
          - Keep a flag for whether you read anything, since the longest line itself could be empty.
        tests:
          - stdin: "rush b\ndon't stop now\ngg\n"
          - stdin: ""
          - stdin: "same\nsize\n"
            hidden: true
      - task: |
          The first line is a number `n`, followed by `n` lines of chat. Print the chat lines in **reverse** order. Careful: `std::cin >> n` leaves the newline after the number waiting, so the next `getline` would read an empty line. Skip it first with `std::cin >> std::ws`.
        seed: |
          #include <iostream>
          #include <string>
          #include <vector>

          int main() {
              int n;
              std::cin >> n;
              std::vector<std::string> lines;

          }
        solution: |
          #include <iostream>
          #include <string>
          #include <vector>

          int main() {
              int n;
              std::cin >> n;
              std::vector<std::string> lines;
              std::cin >> std::ws;
              for (int i = 0; i < n; i++) {
                  std::string line;
                  std::getline(std::cin, line);
                  lines.push_back(line);
              }
              for (int i = n - 1; i >= 0; i--) std::cout << lines[i] << "\n";
          }
        hints:
          - "`std::cin >> std::ws;` skips spaces and newlines, including the one after the number."
          - Store the lines with `lines.push_back(line);`, then print from index `n - 1` down to 0.
        tests:
          - stdin: "3\ngg\nnice shot\nwp\n"
          - stdin: "1\nhello there\n"
          - stdin: "2\nfirst line\nsecond line\n"
            hidden: true
  - title: Where C and C++ differ
    id: cpp-basics-7
    text: |
      C++ grew out of C, and most C code is also valid C++. But the languages have been developed separately for decades, and some differences bite when you move code between them or mix them in one project.

      | Feature | C | C++ |
      |---|---|---|
      | `void *` to another pointer | converts automatically: `int *p = malloc(n);` | needs a cast (or better, `new`, `std::vector`, `std::make_unique`) |
      | `void f()` | "unspecified arguments" before C23; write `void f(void)` | no arguments, same as `f(void)` |
      | `struct Point` | the type is `struct Point`, unless you add a `typedef` | the type is just `Point` |
      | `sizeof('a')` | `sizeof(int)`, usually 4: a character literal is an `int` | 1: it's a `char` |
      | variable-length arrays `int a[n];` | standard in C99, optional since C11 | not standard; GCC and Clang accept them as an extension (Clang warns) |
      | designated initializers | any order, nested, and for arrays: `{.y = 2, .x = 1}`, `[3] = 7` | C++20, but only in declaration order and not for arrays (GCC rejects `{.y = 2, .x = 1}`, Clang warns) |
      | string literal type | `char[N]` (writing to it is still undefined) | `const char[N]` |
      | a `const` global | visible to other files | private to its file unless marked `extern` |
      | `bool`, `true`, `false` | from `<stdbool.h>` before C23, keywords since | keywords |
      | `new`, `class`, `delete`, `this` | ordinary names you can use for variables | reserved keywords |

      ```cpp run
      #include <cstdlib>
      #include <iostream>

      struct Point {
          int x;
          int y;
      };

      int main() {
          Point p{.x = 1, .y = 2};                                        // designators in declaration order
          int* nums = static_cast<int*>(std::malloc(3 * sizeof(int)));    // C++ needs the cast from void*
          if (!nums) return 1;
          nums[0] = p.x + p.y;
          std::cout << sizeof('a') << " " << nums[0] << "\n";              // 1: a char literal is a char
          std::free(nums);
      }
      ```

      ```output
      1 3
      ```

      ### Mixing C and C++ in one program

      A C library can be used from C++ (the `extern "C"` section in the design patterns module shows how the headers make that work), and C++ can offer functions that C calls. What can't cross the boundary is C++-only machinery: classes with constructors, references, templates, overloading and exceptions. So libraries meant for both languages expose a plain C interface and use C++ inside.

      In C++ code, prefer the C++ versions of C headers (`<cstdlib>`, `<cstring>`, `<cstdio>`), which put the names in namespace `std`, and prefer C++ facilities over C ones: `std::string` over `char` arrays, `std::vector` over `malloc`, streams or `std::format` over `printf`.

      **Your turn:** this code was copied from a C project, and it doesn't compile as C++. Fix `make_buffer` so it compiles and works: `Buffer`'s designated initializers must follow the declaration order (this site's compiler, Clang, only warns about that, but GCC refuses to compile it), and `malloc`'s result needs a cast. Keep `free_buffer` as it is.
    seed: |
      #include <cstdlib>
      #include <cstring>

      struct Buffer {
          char *data;
          int size;
      };

      struct Buffer make_buffer(const char *text) {
          struct Buffer b = {.size = (int)std::strlen(text), .data = 0};
          b.data = std::malloc(b.size + 1);
          std::memcpy(b.data, text, b.size + 1);
          return b;
      }

      void free_buffer(struct Buffer *b) {
          std::free(b->data);
          b->data = 0;
          b->size = 0;
      }
    solution: |
      #include <cstdlib>
      #include <cstring>

      struct Buffer {
          char *data;
          int size;
      };

      struct Buffer make_buffer(const char *text) {
          struct Buffer b = {.data = nullptr, .size = (int)std::strlen(text)};
          b.data = static_cast<char *>(std::malloc(b.size + 1));
          std::memcpy(b.data, text, b.size + 1);
          return b;
      }

      void free_buffer(struct Buffer *b) {
          std::free(b->data);
          b->data = 0;
          b->size = 0;
      }
    forbid:
      - pattern: "\\.size\\s*=[^;]*\\.data\\s*="
        message: "Designated initializers must follow the declaration order: .data first, then .size. GCC rejects any other order."
    harness: |
      int main() {
          Buffer b = make_buffer("hello");
          CHECK_EQ("size", b.size, 5);
          CHECK("data holds a copy of the text", b.data && std::strcmp(b.data, "hello") == 0);
          free_buffer(&b);
          CHECK("free_buffer resets it", b.data == nullptr && b.size == 0);
          Buffer e = make_buffer("");
          CHECK("an empty text still gets its terminator", e.data && e.size == 0 && e.data[0] == '\0');
          free_buffer(&e);
      }
    hints:
      - "Designators in declaration order: `{.data = nullptr, .size = (int)std::strlen(text)}`."
      - "`std::malloc` returns `void *`; C++ needs `static_cast<char *>(std::malloc(b.size + 1))`."
      - "`struct Buffer` still works in C++, but plain `Buffer` is the usual C++ spelling."
    more:
      - task: |
          This C function compiles as C, but not as C++: it uses `new` and `class` as variable names, and both are **keywords** in C++. Rename the variables so it compiles and still returns the sum of the scores.
        seed: |
          int sum_scores(const int *new, int count) {
              int class = 0;
              for (int i = 0; i < count; i++) class += new[i];
              return class;
          }
        solution: |
          int sum_scores(const int *scores, int count) {
              int total = 0;
              for (int i = 0; i < count; i++) total += scores[i];
              return total;
          }
        harness: |
          int main() {
              int a[] = {10, 20, 30};
              CHECK_EQ("sum of 10, 20, 30", sum_scores(a, 3), 60);
              CHECK_EQ("no scores", sum_scores(a, 0), 0);
          }
        forbid:
          - pattern: "\\bnew\\b|\\bclass\\b"
            message: "`new` and `class` are C++ keywords, so they can't be variable names. Rename them."
        hints:
          - Any other names work, like `scores` and `total`.
        tests: []
      - task: |
          Two more C habits that C++ rejects. Fix both so the code compiles as C++:

          - `malloc` returns `void *`, which C converts to `char *` silently. C++ needs a `static_cast<char *>(...)`.
          - A string literal is read-only in C++, so it can't be pointed to by a plain `char *`. Make `name` a `const char *`.
        seed: |
          #include <cstdlib>
          #include <cstring>

          char *shout(const char *s) {
              char *out = std::malloc(std::strlen(s) + 2);
              std::strcpy(out, s);
              std::strcat(out, "!");
              return out;
          }

          const char *default_name() {
              char *name = "anon";
              return name;
          }
        solution: |
          #include <cstdlib>
          #include <cstring>

          char *shout(const char *s) {
              char *out = static_cast<char *>(std::malloc(std::strlen(s) + 2));
              std::strcpy(out, s);
              std::strcat(out, "!");
              return out;
          }

          const char *default_name() {
              const char *name = "anon";
              return name;
          }
        harness: |
          int main() {
              char *s = shout("gg");
              CHECK("shout(\"gg\") is \"gg!\"", s && std::strcmp(s, "gg!") == 0);
              std::free(s);
              CHECK("default_name() is \"anon\"", std::strcmp(default_name(), "anon") == 0);
          }
        require:
          - pattern: "static_cast\\s*<\\s*char\\s*\\*\\s*>"
            message: "Convert malloc's result with `static_cast<char *>(...)`."
          - pattern: "const\\s+char\\s*\\*\\s*name"
            message: "Point at the string literal with a `const char *`."
        hints:
          - "C++ never converts `void *` to another pointer type on its own. `static_cast` says you mean it."
          - Writing into a string literal is undefined behavior, which is why C++ insists on `const`.
        tests: []
