          #include <memory>
          #include <optional>

          class Bst {
          public:
              bool insert(int key) {
                  std::unique_ptr<Node>* link = &root_;
                  while (*link) {
                      if (key == (*link)->key) return false;
                      link = key < (*link)->key ? &(*link)->left : &(*link)->right;
