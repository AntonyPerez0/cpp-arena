              root->right = leaf(3);
              root->left->left = leaf(4);
              root->left->right = leaf(5);
              CHECK_EQ("leaves 4, 5, 3", count_leaves(root.get()), 3);
              CHECK_EQ("empty tree", count_leaves(nullptr), 0);
              mirror(root.get());
              CHECK("root's children swapped", root->left->value == 3 && root->right->value == 2);
              CHECK("and deeper ones too", root->right->left->value == 5 && root->right->right->value == 4);
              mirror(nullptr);
          }
