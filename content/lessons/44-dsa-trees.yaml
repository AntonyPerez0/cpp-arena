          #include <utility>
          #include <vector>

          static void sift_down(std::vector<int>& a, std::size_t i) {
              std::size_t n = a.size();
              while (true) {
                  std::size_t l = 2 * i + 1, r = l + 1, m = i;
                  if (l < n && a[l] < a[m]) m = l;
                  if (r < n && a[r] < a[m]) m = r;
                  if (m == i) return;
                  std::swap(a[i], a[m]);
                  i = m;
              }
          }

          void heapify(std::vector<int>& a) {
              for (std::size_t i = a.size() / 2; i-- > 0;) sift_down(a, i);
          }

          bool is_min_heap(const std::vector<int>& a) {
              for (std::size_t i = 1; i < a.size(); i++)
                  if (a[i] < a[(i - 1) / 2]) return false;
              return true;
          }
