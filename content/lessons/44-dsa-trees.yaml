          #include <memory>
          #include <vector>

          struct Node {
              int key;
              std::unique_ptr<Node> left, right;
          };

          static std::unique_ptr<Node> build(const std::vector<int>& v, int lo, int hi) {
              if (lo >= hi) return nullptr;
              int mid = lo + (hi - lo) / 2;
              auto n = std::unique_ptr<Node>(new Node{v[mid], nullptr, nullptr});
              n->left = build(v, lo, mid);
              n->right = build(v, mid + 1, hi);
              return n;
