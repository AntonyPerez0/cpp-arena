          #include <functional>
          #include <queue>
          #include <vector>

          class RunningMedian {
          public:
              void add(int x) {
                  if (low_.empty() || x <= low_.top()) low_.push(x);
                  else high_.push(x);
                  if (low_.size() > high_.size() + 1) {
                      high_.push(low_.top());
                      low_.pop();
                  } else if (high_.size() > low_.size()) {
                      low_.push(high_.top());
                      high_.pop();
                  }
              }
              double median() const {
                  if (low_.size() > high_.size()) return low_.top();
                  return (low_.top() + (double)high_.top()) / 2;
              }

          private:
              std::priority_queue<int> low_;
              std::priority_queue<int, std::vector<int>, std::greater<int>> high_;
          };
