        solution: |
          #include <memory>
          #include <utility>

          struct Node {
              int value;
              std::unique_ptr<Node> left, right;
          };

          int count_leaves(const Node* n) {
              if (!n) return 0;
              if (!n->left && !n->right) return 1;
              return count_leaves(n->left.get()) + count_leaves(n->right.get());
          }

          void mirror(Node* n) {
              if (!n) return;
              std::swap(n->left, n->right);
              mirror(n->left.get());
              mirror(n->right.get());
          }
        harness: |
          static std::unique_ptr<Node> leaf(int v) { return std::unique_ptr<Node>(new Node{v, nullptr, nullptr}); }
