        solution: |
          #include <array>
          #include <memory>
          #include <string>

          class Trie {
          public:
              void insert(const std::string& w) {
                  if (contains(w)) return;
                  Node* n = &root_;
                  n->pass++;
                  for (char c : w) {
                      auto& next = n->next[c - 'a'];
                      if (!next) next = std::make_unique<Node>();
                      n = next.get();
                      n->pass++;
                  }
                  n->end = true;
              }
              bool contains(const std::string& w) const {
                  const Node* n = find(w);
                  return n && n->end;
              }
              int count_prefix(const std::string& p) const {
                  const Node* n = find(p);
                  return n ? n->pass : 0;
              }
              bool erase(const std::string& w) {
                  if (!contains(w)) return false;
                  Node* n = &root_;
                  n->pass--;
                  for (char c : w) {
                      n = n->next[c - 'a'].get();
                      n->pass--;
                  }
                  n->end = false;
                  return true;
              }

          private:
              struct Node {
                  std::array<std::unique_ptr<Node>, 26> next;
                  bool end = false;
                  int pass = 0;
              };
              const Node* find(const std::string& p) const {
                  const Node* n = &root_;
                  for (char c : p) {
                      n = n->next[c - 'a'].get();
                      if (!n) return nullptr;
                  }
                  return n;
              }
              Node root_;
          };
