        solution: |
          #include <array>
          #include <memory>
          #include <string>
          #include <vector>

          struct TrieNode {
              std::array<std::unique_ptr<TrieNode>, 26> next;
              bool end = false;
          };

          std::string longest_common_prefix(const std::vector<std::string>& words) {
              if (words.empty()) return "";
              TrieNode root;
              for (const auto& w : words) {
                  TrieNode* n = &root;
                  for (char c : w) {
                      auto& nx = n->next[c - 'a'];
                      if (!nx) nx = std::make_unique<TrieNode>();
                      n = nx.get();
                  }
                  n->end = true;
              }
              std::string prefix;
              const TrieNode* n = &root;
              while (!n->end) {
                  int children = 0, only = -1;
                  for (int i = 0; i < 26; i++)
                      if (n->next[i]) {
                          children++;
                          only = i;
                      }
                  if (children != 1) break;
                  prefix += (char)('a' + only);
                  n = n->next[only].get();
              }
              return prefix;
          }
        harness: |
          int main() {
              CHECK_EQ("flower flow flight", longest_common_prefix({"flower", "flow", "flight"}), std::string("fl"));
              CHECK_EQ("one word is a prefix of the other", longest_common_prefix({"dust", "dustii"}), std::string("dust"));
              CHECK_EQ("nothing shared", longest_common_prefix({"nuke", "dust"}), std::string(""));
              CHECK_EQ("one word", longest_common_prefix({"inferno"}), std::string("inferno"));
              CHECK_EQ("no words", longest_common_prefix({}), std::string(""));
              CHECK_EQ("an empty word", longest_common_prefix({"abc", ""}), std::string(""));
          }
