                  *link = std::make_unique<Node>(key);
                  return true;
              }
              std::optional<int> floor(int x) const {
                  std::optional<int> best;
                  const Node* n = root_.get();
                  while (n) {
                      if (n->key == x) return x;
                      if (n->key < x) {
                          best = n->key;
                          n = n->right.get();
                      } else {
                          n = n->left.get();
                      }
                  }
                  return best;
              }

          private:
              struct Node {
                  int key;
                  std::unique_ptr<Node> left, right;
                  explicit Node(int k) : key(k) {}
              };
              std::unique_ptr<Node> root_;
          };
