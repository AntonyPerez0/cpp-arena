      - task: |
          The **diameter** of a tree is the number of edges on its longest path between any two nodes (the path doesn't have to pass through the root). Write `int diameter(const Node* root)`. A helper that returns a subtree's height while updating the best path seen so far keeps it O(n).
        seed: |
          #include <memory>

          struct Node {
              int value;
              std::unique_ptr<Node> left, right;
          };

          int diameter(const Node* root) {

          }
        solution: |
          #include <algorithm>
          #include <memory>

          struct Node {
              int value;
              std::unique_ptr<Node> left, right;
          };

          static int height(const Node* n, int& best) {
              if (!n) return 0;
              int l = height(n->left.get(), best);
              int r = height(n->right.get(), best);
              best = std::max(best, l + r);
              return 1 + std::max(l, r);
          }

          int diameter(const Node* root) {
              int best = 0;
              height(root, best);
              return best;
          }
        harness: |
          static std::unique_ptr<Node> leaf(int v) { return std::unique_ptr<Node>(new Node{v, nullptr, nullptr}); }
          int main() {
              auto root = leaf(1);
              root->left = leaf(2);
              root->right = leaf(3);
              root->left->left = leaf(4);
              root->left->right = leaf(5);
              CHECK_EQ("4 -> 2 -> 1 -> 3", diameter(root.get()), 3);
              auto side = leaf(1);
              side->left = leaf(2);
              side->left->left = leaf(3);
              side->left->left->left = leaf(4);
              side->left->right = leaf(5);
              side->left->right->right = leaf(6);
              CHECK_EQ("longest path avoids the root", diameter(side.get()), 4);
              CHECK_EQ("one node", diameter(leaf(7).get()), 0);
              CHECK_EQ("empty", diameter(nullptr), 0);
          }
        hints:
          - "The longest path through a node uses the heights of its two subtrees: `left height + right height` edges."
          - "Return the height, but record the best `l + r` in a variable passed by reference."

  - title: Binary search trees
    id: dsa-trees-2
    text: |
      A **binary search tree** (BST) adds one rule to a binary tree: everything in a node's left subtree is **smaller** than the node, and everything in its right subtree is **larger**. That rule makes searching fast: at each node, you know which side the key must be on, so you walk **one path** from the root and ignore the rest.

      ```
              8
             / \
            3   10
           / \    \
          1   6    14
      ```

      To find 6: 6 < 8, go left; 6 > 3, go right; found. Three steps instead of checking all six nodes.

      ```cpp run
      #include <iostream>
      #include <memory>

      struct Node {
          int key;
          std::unique_ptr<Node> left, right;
          explicit Node(int k) : key(k) {}
      };

      void insert(std::unique_ptr<Node>& root, int key) {
          std::unique_ptr<Node>* slot = &root;          // a pointer to "the link we might fill"
          while (*slot) {
              slot = key < (*slot)->key ? &(*slot)->left : &(*slot)->right;
          }
          *slot = std::make_unique<Node>(key);          // fill the empty link
      }

      int depth_of(const Node* n, int key) {
          int depth = 0;
          while (n) {
              if (key == n->key) return depth;
              n = key < n->key ? n->left.get() : n->right.get();
              depth++;
          }
          return -1;
      }

      int main() {
          std::unique_ptr<Node> root;
          for (int k : {8, 3, 10, 1, 6, 14}) insert(root, k);
          std::cout << depth_of(root.get(), 6) << " " << depth_of(root.get(), 14) << " " << depth_of(root.get(), 5) << "\n";
      }
      ```

      ```output
      2 2 -1
      ```

      ### How insertion works

      A new key always goes into an **empty spot** at the bottom: walk down as if searching, and when you reach a null link, put the new node there. The trick is `slot`: a pointer to the `unique_ptr` link itself, not to a node. Following it down the tree, you end up pointing at exactly the link to fill, whether that's `root` or some node's `left` or `right`.

      ### Balance

      On a **balanced** tree, each step discards about half the nodes, so search and insert are O(log n). But insert the keys in sorted order (1, 2, 3, 4, ...) and every node goes to the right: the "tree" becomes a linked list, and operations become O(n). `std::map` and `std::set` are **self-balancing** BSTs (red-black trees in every major standard library) that rotate nodes to keep the height O(log n) no matter the insertion order.

      ### Your task

      `insert` is the loop above, plus a duplicate check (if the key equals the node's key, return `false`) and `size_++` on success. `contains` walks down the same way with a plain `const Node*`.

      **Your turn:** write `Bst::insert` (returns false for duplicates) and `Bst::contains`, both iterative.
    seed: |
      #include <memory>

      class Bst {
      public:
          bool insert(int key);
          bool contains(int key) const;
          int size() const { return size_; }

      private:
          struct Node {
              int key;
              std::unique_ptr<Node> left, right;
              explicit Node(int k) : key(k) {}
          };
          std::unique_ptr<Node> root_;
          int size_ = 0;
      };
    solution: |
      #include <memory>

      class Bst {
      public:
          bool insert(int key);
          bool contains(int key) const;
          int size() const { return size_; }

      private:
          struct Node {
              int key;
              std::unique_ptr<Node> left, right;
              explicit Node(int k) : key(k) {}
          };
          std::unique_ptr<Node> root_;
          int size_ = 0;
      };

      bool Bst::insert(int key) {
          std::unique_ptr<Node>* slot = &root_;
          while (*slot) {
              if (key == (*slot)->key) return false;
              slot = key < (*slot)->key ? &(*slot)->left : &(*slot)->right;
          }
          *slot = std::make_unique<Node>(key);
          size_++;
          return true;
      }

      bool Bst::contains(int key) const {
          const Node* n = root_.get();
          while (n) {
              if (key == n->key) return true;
              n = key < n->key ? n->left.get() : n->right.get();
          }
          return false;
      }
    harness: |
      int main() {
          Bst t;
          for (int k : {50, 30, 70, 20, 40, 60, 80}) t.insert(k);
          CHECK_EQ("size", t.size(), 7);
          CHECK_EQ("duplicate refused", t.insert(40), false);
          CHECK_EQ("contains 60", t.contains(60), true);
          CHECK_EQ("contains 20", t.contains(20), true);
          CHECK_EQ("missing 65", t.contains(65), false);
          Bst big;
          unsigned x = 7;
          int inserted = 0;
          for (int i = 0; i < 100000; i++) {
              x = x * 1103515245u + 12345u;
              inserted += big.insert(static_cast<int>(x >> 8));
          }
          CHECK_EQ("100,000 random keys", big.size(), inserted);
      }
