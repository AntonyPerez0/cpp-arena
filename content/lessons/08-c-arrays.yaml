  - title: Random numbers and shuffling
    id: c-arrays-7
    text: |
      Games, simulations and tests all need random numbers. C's standard library has a simple generator in `<stdlib.h>`:

      - `rand()` returns a number from 0 to `RAND_MAX` (at least 32767; on this site and on Linux it's 2147483647).
      - `srand(seed)` sets the **seed**, the starting point of the sequence.

      ```c run
      #include <stdio.h>
      #include <stdlib.h>
      #include <time.h>

      int main(void) {
          srand((unsigned) time(NULL));        // seed once, from the clock
          int counts[7] = {0};
          for (int i = 0; i < 6000; i++) {
              int roll = rand() % 6 + 1;       // 1 to 6
              counts[roll]++;
          }
          int even = 1;
          for (int face = 1; face <= 6; face++) {
              if (counts[face] < 800 || counts[face] > 1200) even = 0;
          }
          printf("every face came up about 1000 times: %s\n", even ? "yes" : "no");
          return 0;
      }
      ```

      ```output
      every face came up about 1000 times: yes
      ```

      ### Pseudo-random

      `rand()` isn't truly random. It's a formula that turns each number into the next, so the whole sequence is decided by the seed. That has consequences:

      - Without `srand`, every run starts from seed 1 and produces **the same numbers**. That's handy for debugging, useless for a game.
      - `srand(time(NULL))` seeds from the current time in seconds, so each run differs. Call it **once**, at the start of `main`. Calling it before every `rand()` restarts the sequence, and within the same second you'd get the same number over and over.
      - Different C libraries use different formulas. After `srand(1)`, `rand() % 100` is 0 on this site but 83 with GCC's library on Linux. Never write a test that expects particular random values.
      - `rand() % n` gives 0 to n - 1. When `RAND_MAX + 1` isn't a multiple of `n`, the smaller results come up very slightly more often. That's fine for a game, not for statistics.
      - `rand()` is **not** for passwords, tokens or anything security-related: its output is predictable. Operating systems provide secure sources for that.

      ### Shuffling fairly

      To shuffle an array, the correct algorithm is the **Fisher-Yates shuffle**. Walk from the last element down to the second; for each position `i`, pick a random position `j` from 0 to `i` (inclusive) and swap the two:

      ```
      for i from n - 1 down to 1:
          j = random number from 0 to i
          swap a[i] and a[j]
      ```

      Every ordering comes out exactly equally likely. The tempting shortcut, swapping each element with a random position anywhere in the array, is **biased**: for 3 elements it makes 3 × 3 × 3 = 27 equally likely choices, which can't be split evenly among the 6 possible orders, so some orders come up more often than others.

      **Your turn:** write `roll(sides)`, returning a random number from 1 to `sides`, and `shuffle(a, n)`, a Fisher-Yates shuffle of the `n` elements of `a`. The tests seed the generator themselves and check that every order of a 3-element array is equally likely, so the biased shortcut won't pass.
    seed: |
      #include <stdlib.h>

      int roll(int sides) {

      }

      void shuffle(int a[], int n) {

      }
    solution: |
      #include <stdlib.h>

      int roll(int sides) {
          return rand() % sides + 1;
      }

      void shuffle(int a[], int n) {
          for (int i = n - 1; i > 0; i--) {
              int j = rand() % (i + 1);
              int tmp = a[i];
              a[i] = a[j];
              a[j] = tmp;
          }
      }
    forbid:
      - pattern: "srand"
        message: Don't seed inside your functions; the program (here, the tests) seeds once at the start.
    harness: |
      int main(void) {
          srand(2024);
          int lo = 100, hi = 0;
          for (int i = 0; i < 1000; i++) {
              int r = roll(6);
              if (r < lo) lo = r;
              if (r > hi) hi = r;
          }
          CHECK_INT("roll(6) is never below 1", lo, 1);
          CHECK_INT("roll(6) is never above 6", hi, 6);
          int always_one = 1;
          for (int i = 0; i < 100; i++) if (roll(1) != 1) always_one = 0;
          CHECK("roll(1) is always 1", always_one);
          int a[5] = {1, 2, 3, 4, 5};
          shuffle(a, 5);
          int seen[6] = {0}, perm = 1;
          for (int i = 0; i < 5; i++) {
              if (a[i] < 1 || a[i] > 5 || seen[a[i]]++) perm = 0;
          }
          CHECK("shuffle keeps every value exactly once", perm);
          int one[1] = {7};
          shuffle(one, 1);
          CHECK_INT("a single element stays put", one[0], 7);
          int counts[6] = {0};
          for (int t = 0; t < 60000; t++) {
              int b[3] = {0, 1, 2};
              shuffle(b, 3);
              counts[b[0] * 2 + (b[1] > b[2])]++;
          }
          int fair = 1;
          for (int k = 0; k < 6; k++) if (counts[k] < 9000 || counts[k] > 11000) fair = 0;
          CHECK("all 6 orders of 3 items come up equally often", fair);
          return 0;
      }
    hints:
      - "roll: `rand() % sides` is 0 to sides - 1, so add 1."
      - "shuffle: loop `i` from `n - 1` down to 1, pick `j = rand() % (i + 1)`, and swap `a[i]` with `a[j]`."
      - "`j` must range over 0 to `i` only, not the whole array; that's what makes it fair."
    more:
      - task: |
          Write `int roll_range(int lo, int hi)` that returns a random number from `lo` to `hi`, including both ends. `roll_range(5, 7)` returns 5, 6 or 7. Don't call `srand`; the tests seed the generator.
        seed: |
          #include <stdlib.h>

          int roll_range(int lo, int hi) {

          }
        solution: |
          #include <stdlib.h>

          int roll_range(int lo, int hi) {
              return lo + rand() % (hi - lo + 1);
          }
        harness: |
          int main(void) {
              srand(7);
              int min = 1000, max = -1000;
              int seen[3] = {0};
              for (int i = 0; i < 3000; i++) {
                  int r = roll_range(5, 7);
                  if (r < min) min = r;
                  if (r > max) max = r;
                  if (r >= 5 && r <= 7) seen[r - 5] = 1;
              }
              CHECK_INT("roll_range(5, 7) is never below 5", min, 5);
              CHECK_INT("roll_range(5, 7) is never above 7", max, 7);
              CHECK("5, 6 and 7 all come up", seen[0] && seen[1] && seen[2]);
              int lo = 1000, hi = -1000;
              for (int i = 0; i < 3000; i++) {
                  int r = roll_range(-3, 3);
                  if (r < lo) lo = r;
                  if (r > hi) hi = r;
              }
              CHECK("roll_range(-3, 3) covers -3 to 3", lo == -3 && hi == 3);
              int same = 1;
              for (int i = 0; i < 100; i++) if (roll_range(4, 4) != 4) same = 0;
              CHECK("roll_range(4, 4) is always 4", same);
              return 0;
          }
        forbid:
          - pattern: srand
            message: Don't call srand. The tests seed the generator so results are repeatable.
        hints:
          - There are `hi - lo + 1` possible values.
          - "`rand() % (hi - lo + 1)` gives 0 up to that count minus 1. Add `lo`."
        tests: []
      - task: |
          Write `void sample(int n, int k, int out[])` that picks `k` **different** numbers from `0` to `n - 1` (with `k <= n <= 100`) at random and stores them in `out`. Every number must be equally likely to be picked. A partial Fisher-Yates shuffle does this: shuffle only the first `k` positions of `{0, 1, ..., n - 1}`.
        seed: |
          #include <stdlib.h>

          void sample(int n, int k, int out[]) {

          }
        solution: |
          #include <stdlib.h>

          void sample(int n, int k, int out[]) {
              int pool[100];
              for (int i = 0; i < n; i++) pool[i] = i;
              for (int i = 0; i < k; i++) {
                  int j = i + rand() % (n - i);
                  int tmp = pool[i];
                  pool[i] = pool[j];
                  pool[j] = tmp;
                  out[i] = pool[i];
              }
          }
        harness: |
          int main(void) {
              srand(99);
              int out[100];
              int ok = 1;
              for (int t = 0; t < 200; t++) {
                  sample(10, 4, out);
                  for (int i = 0; i < 4; i++) {
                      if (out[i] < 0 || out[i] > 9) ok = 0;
                      for (int j = 0; j < i; j++) if (out[i] == out[j]) ok = 0;
                  }
              }
              CHECK("picks are in range and never repeat", ok);
              sample(6, 6, out);
              int seen[6] = {0}, perm = 1;
              for (int i = 0; i < 6; i++) {
                  if (out[i] < 0 || out[i] > 5 || seen[out[i]]++) perm = 0;
              }
              CHECK("k == n picks every number once", perm);
              int counts[5] = {0};
              for (int t = 0; t < 50000; t++) {
                  sample(5, 2, out);
                  counts[out[0]]++;
                  counts[out[1]]++;
              }
              int fair = 1;
              for (int v = 0; v < 5; v++) if (counts[v] < 18500 || counts[v] > 21500) fair = 0;
              CHECK("every number is picked equally often", fair);
              return 0;
          }
        forbid:
          - pattern: srand
            message: Don't call srand. The tests seed the generator so results are repeatable.
        hints:
          - Fill a local array `pool` with `0` to `n - 1`.
          - For each position `i` below `k`, swap `pool[i]` with a random position from `i` to `n - 1`, then copy `pool[i]` to `out[i]`.
        tests: []
