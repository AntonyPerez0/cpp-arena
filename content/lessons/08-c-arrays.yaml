id: c-arrays
title: Arrays
lang: c
phase: "C: Memory"
summary: Store many values of one type side by side. Indexing, looping, passing arrays to functions and 2D grids.
steps:
  - title: Declare and index
    id: c-arrays-1
    text: |
      Suppose a game tracks the score of 5 players. Five separate variables (`score1`, `score2`, ...) work, but they're painful: you can't loop over them, and 100 players would need 100 names. An **array** solves this: one name for a whole row of values of the same type, stored **side by side** in memory.

      ```c run
      #include <stdio.h>

      int main(void) {
          int temps[4] = {18, 21, 25, 19};
          printf("first: %d\n", temps[0]);
          printf("third: %d\n", temps[2]);
          temps[3] = 20;
          printf("last is now: %d\n", temps[3]);
          return 0;
      }
      ```

      ```output
      first: 18
      third: 25
      last is now: 20
      ```

      ### Declaring

      `int temps[4]` creates 4 ints in a row. The size must be known when the array is created and it never changes. The `{ ... }` list gives initial values. If the list is shorter than the size, the rest are set to 0, so `int counts[10] = {0};` is a handy way to zero a whole array. You can also leave the size out and let the list decide: `int temps[] = {18, 21, 25, 19};` has size 4.

      ### Indexing starts at 0

      `temps[i]` is element number `i`, counting from **0**. An array of size 4 has indexes **0, 1, 2, 3**, so the last one is always `size - 1`. The index is really an **offset**: how many elements past the start. The first element is 0 steps from the start.

      ### No safety net

      C does **not** check indexes. `temps[4]` or `temps[-1]` compiles fine and reads or writes whatever memory happens to be next to the array. That's **undefined behavior**: the program might crash, print garbage, or seem to work and fail later. Keeping indexes in range is your job.

      **Your turn:** print the first and the last element of the array.
    fill: |
      #include <stdio.h>

      int main(void) {
          int scores[5] = {16, 9, 22, 13, 30};
          printf("first %d\n", scores[[[0]]]);
          printf("last %d\n", scores[[[4]]]);
          return 0;
      }
    hints:
      - The first index is 0. With 5 elements, the last index is 4.
    tests:
      - expect: "first 16\nlast 30"
    more:
      - task: |
          The third player took damage. Set **their** HP (the third element) to `35` so the program prints `100 100 35 100`. Remember that counting starts at 0.
        fill: |
          #include <stdio.h>

          int main(void) {
              int hp[4] = {100, 100, 100, 100};
              hp[[[2]]] = [[35]];
              printf("%d %d %d %d\n", hp[0], hp[1], hp[2], hp[3]);
              return 0;
          }
        hints:
          - The first element is `hp[0]`, so the third one is `hp[2]`.
        tests:
          - expect: "100 100 35 100"
      - task: |
          Swap the first and the last element of the array so the program prints `5 1 4 1 3`. You'll need a temporary variable, because the first assignment overwrites one of the values.
        seed: |
          #include <stdio.h>

          int main(void) {
              int a[5] = {3, 1, 4, 1, 5};
              // swap the first and the last element

              printf("%d %d %d %d %d\n", a[0], a[1], a[2], a[3], a[4]);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int a[5] = {3, 1, 4, 1, 5};
              // swap the first and the last element
              int tmp = a[0];
              a[0] = a[4];
              a[4] = tmp;
              printf("%d %d %d %d %d\n", a[0], a[1], a[2], a[3], a[4]);
              return 0;
          }
        forbid:
          - pattern: "\\{\\s*5\\s*,\\s*1\\s*,\\s*4"
            message: Keep the starting array as it is and swap the two elements in code.
        hints:
          - Save `a[0]` in `int tmp` first, then copy `a[4]` into `a[0]`, then `tmp` into `a[4]`.
        tests:
          - expect: "5 1 4 1 3"

  - title: Loop over an array
    id: c-arrays-2
    text: |
      Arrays and loops go together: the loop counter becomes the index, so one loop can visit every element no matter how many there are.

      ```c run
      #include <stdio.h>

      int main(void) {
          double prices[] = {2.5, 4.0, 1.25, 3.75};
          int n = sizeof(prices) / sizeof(prices[0]);
          double total = 0;
          for (int i = 0; i < n; i++) {
              printf("item %d: %.2f\n", i, prices[i]);
              total += prices[i];
          }
          printf("%d items, total %.2f\n", n, total);
          return 0;
      }
      ```

      ```output
      item 0: 2.50
      item 1: 4.00
      item 2: 1.25
      item 3: 3.75
      4 items, total 11.50
      ```

      ### The standard loop

      `for (int i = 0; i < n; i++)` visits indexes 0 through n-1: exactly the valid ones. The most common array bug is `i <= n`, which runs one extra time and reads `a[n]`, one past the end. This mistake is so common it has a name: an **off-by-one** error.

      ### Counting elements with sizeof

      `sizeof(prices)` is the size of the whole array in bytes (4 doubles x 8 bytes = 32), and `sizeof(prices[0])` is the size of one element (8). Dividing gives the element count (4). Computing it like this means the loop stays correct if you add items to the list later.

      This only works where the array itself was declared. Once an array is passed to a function it becomes a pointer, and `sizeof` gives the pointer's size instead. You'll see this in a couple of steps.

      ### Averages

      Remember the integer division trap: if you sum ints and divide by an int count, cast one side to `double` first.

      **Your turn:** print the average of the array with two decimals: `avg 18.00`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int scores[5] = {16, 9, 22, 13, 30};
          int n = sizeof(scores) / sizeof(scores[0]);

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int scores[5] = {16, 9, 22, 13, 30};
          int n = sizeof(scores) / sizeof(scores[0]);
          int sum = 0;
          for (int i = 0; i < n; i++) {
              sum += scores[i];
          }
          printf("avg %.2f\n", (double)sum / n);
          return 0;
      }
    forbid:
      - pattern: "18\\.0|\\b90\\b"
        message: Compute the average with a loop instead of hard-coding it.
    hints:
      - Sum the elements in a for loop from 0 to n - 1.
      - "Divide as doubles: `(double)sum / n`, then print with `%.2f`."
    tests:
      - expect: "avg 18.00"
    more:
      - task: |
          Count how many scores are **above 15** with a loop, and print `above 15: 3`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int scores[5] = {16, 9, 22, 13, 30};
              int n = sizeof(scores) / sizeof(scores[0]);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int scores[5] = {16, 9, 22, 13, 30};
              int n = sizeof(scores) / sizeof(scores[0]);
              int count = 0;
              for (int i = 0; i < n; i++) {
                  if (scores[i] > 15) count++;
              }
              printf("above 15: %d\n", count);
              return 0;
          }
        require:
          - pattern: "for\\s*\\(|while\\s*\\("
            message: Count with a loop instead of typing the answer.
        hints:
          - Start a counter at 0 and add 1 for every `scores[i] > 15`.
        tests:
          - expect: "above 15: 3"
      - task: |
          Find the highest score **and where it is**. If the highest value appears more than once, report the first position. Print `max 31 at 1`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int scores[5] = {16, 31, 22, 13, 31};
              int n = sizeof(scores) / sizeof(scores[0]);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int scores[5] = {16, 31, 22, 13, 31};
              int n = sizeof(scores) / sizeof(scores[0]);
              int best = 0;
              for (int i = 1; i < n; i++) {
                  if (scores[i] > scores[best]) best = i;
              }
              printf("max %d at %d\n", scores[best], best);
              return 0;
          }
        require:
          - pattern: "for\\s*\\(|while\\s*\\("
            message: Find the answer with a loop instead of typing it.
        hints:
          - Keep the index of the best element so far, starting at 0.
          - Use `>` (not `>=`) so a later tie doesn't replace the first position.
        tests:
          - expect: "max 31 at 1"

  - title: Read into an array
    id: c-arrays-3
    text: |
      Each element of an array is a normal variable, so you can read input directly into one. `scanf` needs its address, just like with a plain variable: `&a[i]`.

      A common pattern: first read how many values there will be, then read them into an array inside a loop.

      ```c run
      #include <stdio.h>

      int main(void) {
          int values[50];
          int n;
          scanf("%d", &n);
          for (int i = 0; i < n; i++) {
              scanf("%d", &values[i]);
          }
          int above = 0;
          for (int i = 0; i < n; i++) {
              if (values[i] > values[0]) {
                  above++;
              }
          }
          printf("%d values are bigger than the first\n", above);
          return 0;
      }
      ```

      ```input
      6
      10 4 15 22 10 11
      ```

      ```output
      3 values are bigger than the first
      ```

      ### Why store the values at all?

      For a sum or a maximum you don't need an array: one pass while reading is enough. You need an array when you must look at the data **more than once** or **out of order**, like comparing everything to the first value, sorting, or printing in reverse. Reading first and processing afterwards is a very common program structure.

      ### Capacity

      The array has a fixed capacity (50 here). The program trusts the input to say at most 50. Real programs check that `n` fits before reading, or allocate memory of the right size at run time (you'll learn `malloc` in the dynamic memory module).

      ### Looping backwards

      To walk an array from the end, start at the last valid index and count down: `for (int i = n - 1; i >= 0; i--)`. Note the start is `n - 1`, not `n`, and the condition is `i >= 0` so index 0 is included.

      **Your turn:** input is `n` (at most 100) followed by `n` numbers. Print them in **reverse** order on one line, separated by spaces.

      Input `4` / `1 2 3 4` prints `4 3 2 1`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int a[100];
          int n;
          scanf("%d", &n);

          printf("\n");
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int a[100];
          int n;
          scanf("%d", &n);
          for (int i = 0; i < n; i++) {
              scanf("%d", &a[i]);
          }
          for (int i = n - 1; i >= 0; i--) {
              printf("%d ", a[i]);
          }
          printf("\n");
          return 0;
      }
    hints:
      - First loop reads with `scanf("%d", &a[i]);`
      - "Second loop counts down: `for (int i = n - 1; i >= 0; i--)`."
    tests:
      - stdin: "4\n1 2 3 4\n"
      - stdin: "1\n42\n"
      - stdin: "7\n5 -1 8 0 3 3 9\n"
        hidden: true
    more:
      - task: |
          Input is `n` (at most 100) followed by `n` numbers. Print the numbers that are **above the average**, in their original order, separated by spaces. If none are, print `none`. You need the whole array, because the average is only known after reading everything.

          Input `4` / `1 2 3 10` (average 4) prints `10`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int a[100];
              int n;
              scanf("%d", &n);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int a[100];
              int n;
              scanf("%d", &n);
              int sum = 0;
              for (int i = 0; i < n; i++) {
                  scanf("%d", &a[i]);
                  sum += a[i];
              }
              int printed = 0;
              for (int i = 0; i < n; i++) {
                  if (a[i] * n > sum) {
                      printf("%d ", a[i]);
                      printed++;
                  }
              }
              if (printed == 0) printf("none");
              printf("\n");
              return 0;
          }
        hints:
          - First loop reads and adds up. Second loop prints.
          - "`a[i] > average` is the same as `a[i] * n > sum`, which avoids doubles."
        tests:
          - stdin: "4\n1 2 3 10\n"
          - stdin: "3\n5 5 5\n"
          - stdin: "5\n-2 0 4 7 1\n"
            hidden: true
      - task: |
          Input is `n` (at most 100) followed by `n` numbers. Print each number only the **first** time it appears, in order. Input `6` / `3 1 3 2 1 5` prints `3 1 2 5`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int a[100];
              int n;
              scanf("%d", &n);

              printf("\n");
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int a[100];
              int n;
              scanf("%d", &n);
              for (int i = 0; i < n; i++) {
                  scanf("%d", &a[i]);
              }
              for (int i = 0; i < n; i++) {
                  int seen = 0;
                  for (int j = 0; j < i; j++) {
                      if (a[j] == a[i]) seen = 1;
                  }
                  if (!seen) printf("%d ", a[i]);
              }
              printf("\n");
              return 0;
          }
        hints:
          - Read everything into the array first.
          - For each position `i`, look back at positions `0` to `i - 1`. Print `a[i]` only if none of them are equal to it.
        tests:
          - stdin: "6\n3 1 3 2 1 5\n"
          - stdin: "1\n7\n"
          - stdin: "5\n4 4 4 4 4\n"
            hidden: true
          - stdin: "7\n-1 2 -1 3 2 3 0\n"
            hidden: true

  - title: Arrays as parameters
    id: c-arrays-4
    text: |
      You can pass an array to a function, which lets you write reusable tools like "sum this array" or "find this value". The parameter is written with empty brackets:

      ```c run
      #include <stdio.h>

      int count_over(int a[], int n, int limit) {
          int count = 0;
          for (int i = 0; i < n; i++) {
              if (a[i] > limit) {
                  count++;
              }
          }
          return count;
      }

      int main(void) {
          int speeds[] = {45, 72, 51, 90, 38};
          printf("%d\n", count_over(speeds, 5, 50));
          printf("%d\n", count_over(speeds, 5, 100));
          return 0;
      }
      ```

      ```output
      3
      0
      ```

      ### The function doesn't know the length

      When you pass an array, C doesn't copy the elements. It passes the **address of the first element**, and nothing about the length comes along. Inside the function, `a` is really a pointer, and `sizeof(a)` gives the size of a pointer (often 4 or 8), not the array. That's why every C function that takes an array also takes its length: `int a[], int n`. The standard library works the same way.

      ### Search: returning early

      A **linear search** checks elements one by one. As soon as it finds a match, it can `return` right away; there's no point looking further. If the loop finishes without finding anything, the value isn't there, so the code after the loop returns a "not found" signal. Returning `-1` is the usual convention, because `-1` can never be a valid index.

      ### Changes are shared

      Because the function receives the array's address rather than a copy, if it **changes** `a[i]`, the caller's array changes too. That's different from plain ints, and it's the subject of the next step.

      **Your turn:** write `int index_of(int a[], int n, int target)` that returns the index of the first element equal to `target`, or `-1` if it isn't there.
    seed: |
      int index_of(int a[], int n, int target) {

      }
    solution: |
      int index_of(int a[], int n, int target) {
          for (int i = 0; i < n; i++) {
              if (a[i] == target) return i;
          }
          return -1;
      }
    harness: |
      int main(void) {
          int a[] = {4, 8, 15, 16, 23, 42, 15};
          CHECK_INT("find 4", index_of(a, 7, 4), 0);
          CHECK_INT("find 42", index_of(a, 7, 42), 5);
          CHECK_INT("first 15", index_of(a, 7, 15), 2);
          CHECK_INT("missing 7", index_of(a, 7, 7), -1);
          CHECK_INT("empty array", index_of(a, 0, 4), -1);
          return 0;
      }
    hints:
      - Loop over every index. Return `i` as soon as `a[i] == target`.
      - If the loop finishes without finding it, return -1.
    more:
      - task: |
          Write `int count_of(int a[], int n, int target)` that returns how many elements are equal to `target`.
        seed: |
          int count_of(int a[], int n, int target) {

          }
        solution: |
          int count_of(int a[], int n, int target) {
              int count = 0;
              for (int i = 0; i < n; i++) {
                  if (a[i] == target) count++;
              }
              return count;
          }
        harness: |
          int main(void) {
              int a[] = {4, 8, 15, 16, 23, 42, 15};
              CHECK_INT("count 15", count_of(a, 7, 15), 2);
              CHECK_INT("count 42", count_of(a, 7, 42), 1);
              CHECK_INT("count 7 (missing)", count_of(a, 7, 7), 0);
              CHECK_INT("only the first 2 elements", count_of(a, 2, 15), 0);
              CHECK_INT("empty array", count_of(a, 0, 4), 0);
              return 0;
          }
        hints:
          - Unlike `index_of`, don't return early. Loop over all `n` elements and count the matches.
        tests: []
      - task: |
          Write `int is_sorted(int a[], int n)` that returns `1` if every element is less than or equal to the next one, and `0` otherwise. An empty array and a one-element array count as sorted.
        seed: |
          int is_sorted(int a[], int n) {

          }
        solution: |
          int is_sorted(int a[], int n) {
              for (int i = 0; i + 1 < n; i++) {
                  if (a[i] > a[i + 1]) return 0;
              }
              return 1;
          }
        harness: |
          int main(void) {
              int up[] = {1, 3, 3, 7, 9};
              int bad_end[] = {1, 2, 3, 5, 4};
              int bad_start[] = {2, 1, 3};
              int one[] = {5};
              CHECK_INT("{1,3,3,7,9}", is_sorted(up, 5), 1);
              CHECK_INT("{1,2,3,5,4}", is_sorted(bad_end, 5), 0);
              CHECK_INT("{2,1,3}", is_sorted(bad_start, 3), 0);
              CHECK_INT("one element", is_sorted(one, 1), 1);
              CHECK_INT("empty", is_sorted(one, 0), 1);
              return 0;
          }
        hints:
          - Compare each element with the one after it, `a[i] > a[i + 1]` means not sorted.
          - Stop at the second-to-last element so `a[i + 1]` never goes past the end. `i + 1 < n` does that.
        tests: []

  - title: Modify an array in a function
    id: c-arrays-5
    text: |
      Since a function receives the array's address, it can modify the caller's elements directly. This is called working **in place**: no second array is needed.

      ```c run
      #include <stdio.h>

      void add_bonus(int a[], int n, int bonus) {
          for (int i = 0; i < n; i++) {
              a[i] += bonus;
          }
      }

      int main(void) {
          int scores[] = {10, 20, 30};
          add_bonus(scores, 3, 5);
          printf("%d %d %d\n", scores[0], scores[1], scores[2]);
          return 0;
      }
      ```

      ```output
      15 25 35
      ```

      ### Swapping two elements

      To exchange two values you need a **temporary** variable. Writing `a[i] = a[j]; a[j] = a[i];` loses the original `a[i]` on the first line, so both end up equal. Save one value first:

      ```c
      int tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
      ```

      ### Reversing: two indexes moving inward

      Reversing in place means swapping the first and last elements, then the second and second-to-last, and so on. Use two indexes: `i` starting at the front (0) and `j` at the back (`n - 1`). After each swap, move `i` forward and `j` backward. Stop when they meet or cross (`i < j` is the loop condition). If you kept going past the middle, you'd swap everything back again.

      Check edge cases in your head: an array of 1 element (the loop shouldn't run), an even length (4 elements: swap 0-3 and 1-2), and an odd length (5 elements: the middle one stays put).

      **Your turn:** write `void reverse(int a[], int n)` that reverses the array **in place** (no second array).
    seed: |
      void reverse(int a[], int n) {

      }
    solution: |
      void reverse(int a[], int n) {
          for (int i = 0, j = n - 1; i < j; i++, j--) {
              int tmp = a[i];
              a[i] = a[j];
              a[j] = tmp;
          }
      }
    harness: |
      int same(int *a, int *b, int n) {
          for (int i = 0; i < n; i++) if (a[i] != b[i]) return 0;
          return 1;
      }
      int main(void) {
          int a[] = {1, 2, 3, 4, 5};
          int ra[] = {5, 4, 3, 2, 1};
          reverse(a, 5);
          CHECK("odd length {1,2,3,4,5}", same(a, ra, 5));
          int b[] = {7, 8, 9, 10};
          int rb[] = {10, 9, 8, 7};
          reverse(b, 4);
          CHECK("even length {7,8,9,10}", same(b, rb, 4));
          int c[] = {3};
          reverse(c, 1);
          CHECK("single element", c[0] == 3);
          reverse(c, 0);
          CHECK("empty array", c[0] == 3);
          return 0;
      }
    hints:
      - "Use two indexes: i from the front, j from the back. Loop while `i < j`."
      - Swap `a[i]` and `a[j]` with a temporary variable, then move i forward and j backward.
    more:
      - task: |
          Write `void rotate_left(int a[], int n)` that moves every element one place to the left, in place, with the first element moving to the end. `{1, 2, 3, 4}` becomes `{2, 3, 4, 1}`.
        seed: |
          void rotate_left(int a[], int n) {

          }
        solution: |
          void rotate_left(int a[], int n) {
              if (n < 2) return;
              int first = a[0];
              for (int i = 0; i < n - 1; i++) {
                  a[i] = a[i + 1];
              }
              a[n - 1] = first;
          }
        harness: |
          int same(int *a, int *b, int n) {
              for (int i = 0; i < n; i++) if (a[i] != b[i]) return 0;
              return 1;
          }
          int main(void) {
              int a[] = {1, 2, 3, 4};
              int ra[] = {2, 3, 4, 1};
              rotate_left(a, 4);
              CHECK("{1,2,3,4} -> {2,3,4,1}", same(a, ra, 4));
              int ra2[] = {3, 4, 1, 2};
              rotate_left(a, 4);
              CHECK("twice -> {3,4,1,2}", same(a, ra2, 4));
              int b[] = {9, 8};
              int rb[] = {8, 9};
              rotate_left(b, 2);
              CHECK("two elements swap", same(b, rb, 2));
              int c[] = {5};
              rotate_left(c, 1);
              CHECK("single element", c[0] == 5);
              rotate_left(c, 0);
              CHECK("empty array", c[0] == 5);
              return 0;
          }
        hints:
          - Save `a[0]` first, then shift everything left with `a[i] = a[i + 1]`.
          - Put the saved value into the last slot, `a[n - 1]`.
        tests: []
      - task: |
          Write `int remove_value(int a[], int n, int value)` that removes every copy of `value` from the array **in place**, keeping the other elements in their order at the front. Return the new length. For `{3, 1, 3, 2}` and value `3`, the array starts with `{1, 2}` and the function returns `2`.
        seed: |
          int remove_value(int a[], int n, int value) {

          }
        solution: |
          int remove_value(int a[], int n, int value) {
              int w = 0;
              for (int r = 0; r < n; r++) {
                  if (a[r] != value) {
                      a[w] = a[r];
                      w++;
                  }
              }
              return w;
          }
        harness: |
          int same(int *a, int *b, int n) {
              for (int i = 0; i < n; i++) if (a[i] != b[i]) return 0;
              return 1;
          }
          int main(void) {
              int a[] = {3, 1, 3, 2};
              int ra[] = {1, 2};
              int n = remove_value(a, 4, 3);
              CHECK_INT("new length for {3,1,3,2} without 3", n, 2);
              CHECK("remaining {1,2} in order", n == 2 && same(a, ra, 2));
              int b[] = {7, 7, 7};
              CHECK_INT("removing everything", remove_value(b, 3, 7), 0);
              int c[] = {1, 2, 3};
              int rc[] = {1, 2, 3};
              CHECK_INT("nothing to remove", remove_value(c, 3, 9), 3);
              CHECK("untouched when nothing is removed", same(c, rc, 3));
              int d[] = {5, 0, 5, 0, 5, 6};
              int rd[] = {0, 0, 6};
              int m = remove_value(d, 6, 5);
              CHECK("{5,0,5,0,5,6} without 5 is {0,0,6}", m == 3 && same(d, rd, 3));
              return 0;
          }
        hints:
          - Use two indexes, one for reading every element and one for where the next kept element goes.
          - When `a[r]` is not the value, copy it to `a[w]` and move `w` forward. At the end, `w` is the new length.
        tests: []

  - title: 2D arrays
    id: c-arrays-6
    text: |
      A **2D array** is an array of arrays: a grid with rows and columns. It's the natural fit for boards, maps, images and tables.

      ```c run
      #include <stdio.h>

      int main(void) {
          int seats[2][4] = {
              {1, 0, 1, 1},
              {0, 0, 1, 0},
          };
          int taken = 0;
          for (int r = 0; r < 2; r++) {
              for (int c = 0; c < 4; c++) {
                  taken += seats[r][c];
              }
          }
          printf("row 1, seat 2: %d\n", seats[1][2]);
          printf("%d seats taken\n", taken);
          return 0;
      }
      ```

      ```output
      row 1, seat 2: 1
      4 seats taken
      ```

      ### Indexing

      `seats[r][c]` means row `r`, column `c`. Both start at 0. `int seats[2][4]` has 2 rows of 4 columns.

      ### In memory

      The grid is stored **row by row** in one long line: all of row 0, then all of row 1. That's why the column count must be known: to find `seats[1][2]`, C skips one full row of 4 and then 2 more elements.

      ### Nested loops

      Rows go in the outer loop and columns in the inner loop, so the program walks the grid the same way it's laid out in memory. To compute something **per row** (like each row's sum), reset the running total at the start of each outer pass and print it at the end of the pass. Something that follows a **diagonal** needs only one loop: the main diagonal is where row equals column, `g[i][i]`.

      Reading a grid from input works the same way: nested loops with `scanf("%d", &g[r][c])`.

      **Your turn:** read a 3x3 grid of numbers and print the sum of each row on its own line, then the sum of the main diagonal (top-left to bottom-right) as `diag N`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int g[3][3];

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int g[3][3];
          for (int r = 0; r < 3; r++)
              for (int c = 0; c < 3; c++)
                  scanf("%d", &g[r][c]);
          for (int r = 0; r < 3; r++) {
              int s = 0;
              for (int c = 0; c < 3; c++) s += g[r][c];
              printf("%d\n", s);
          }
          int d = 0;
          for (int i = 0; i < 3; i++) d += g[i][i];
          printf("diag %d\n", d);
          return 0;
      }
    hints:
      - Read with nested loops using `&g[r][c]`.
      - The diagonal elements are `g[0][0]`, `g[1][1]`, `g[2][2]`, so `g[i][i]`.
    tests:
      - stdin: "1 2 3\n4 5 6\n7 8 9\n"
      - stdin: "0 0 0\n0 0 0\n0 0 1\n"
      - stdin: "5 -1 2\n3 3 3\n-9 4 10\n"
        hidden: true
    more:
      - task: |
          Read a 3x3 grid of numbers. Print the sum of each **column** on one line, separated by spaces, then the sum of the other diagonal (top-right to bottom-left) as `anti N`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int g[3][3];

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int g[3][3];
              for (int r = 0; r < 3; r++)
                  for (int c = 0; c < 3; c++)
                      scanf("%d", &g[r][c]);
              for (int c = 0; c < 3; c++) {
                  int s = 0;
                  for (int r = 0; r < 3; r++) s += g[r][c];
                  printf("%d ", s);
              }
              printf("\n");
              int d = 0;
              for (int i = 0; i < 3; i++) d += g[i][2 - i];
              printf("anti %d\n", d);
              return 0;
          }
        hints:
          - For column sums, let the outer loop go over columns and the inner loop over rows.
          - The other diagonal is `g[0][2]`, `g[1][1]`, `g[2][0]`, which is `g[i][2 - i]`.
        tests:
          - stdin: "1 2 3\n4 5 6\n7 8 9\n"
          - stdin: "0 0 1\n0 0 0\n0 0 0\n"
          - stdin: "5 -1 2\n3 3 3\n-9 4 10\n"
            hidden: true
      - task: |
          Read the number of rows `r` and columns `c` (each at most 10), then an `r` by `c` grid. Print the grid **transposed**: rows become columns. Input:

          ```
          2 3
          1 2 3
          4 5 6
          ```

          prints:

          ```
          1 4
          2 5
          3 6
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int g[10][10];
              int rows, cols;
              scanf("%d %d", &rows, &cols);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int g[10][10];
              int rows, cols;
              scanf("%d %d", &rows, &cols);
              for (int r = 0; r < rows; r++)
                  for (int c = 0; c < cols; c++)
                      scanf("%d", &g[r][c]);
              for (int c = 0; c < cols; c++) {
                  for (int r = 0; r < rows; r++) {
                      printf("%d ", g[r][c]);
                  }
                  printf("\n");
              }
              return 0;
          }
        hints:
          - Read the grid normally, row by row.
          - To print it transposed, swap the loops. The outer loop goes over columns and prints `g[r][c]` for every row `r`.
        tests:
