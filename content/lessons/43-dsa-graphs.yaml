id: dsa-graphs
title: Graphs
lang: cpp
phase: "Data Structures and Algorithms"
summary: Model connections. Adjacency lists, breadth-first shortest paths on a grid, depth-first flood fill, topological sort for build order, Dijkstra with a priority queue, and union-find.
steps:
  - title: Adjacency lists
    id: dsa-graphs-1
    text: |
      A **graph** is a set of *vertices* (numbered 0..n-1 here) connected by *edges*. Road maps, social networks, build dependencies and network topologies are all graphs.

      The standard representation is an **adjacency list**: for each vertex, the list of its neighbors.

      ```cpp
      std::vector<std::vector<int>> adj(n);
      adj[a].push_back(b);     // edge a -> b
      adj[b].push_back(a);     // ...and b -> a if the graph is undirected
      ```

      It uses O(V + E) memory, far less than an n × n matrix for the sparse graphs you meet in practice.

      **Your turn:** write `build(n, edges, directed)` returning the adjacency list, and `int max_degree(const std::vector<std::vector<int>>& adj)` returning the largest number of neighbors any vertex has.
    seed: |
      #include <utility>
      #include <vector>

      using Graph = std::vector<std::vector<int>>;

      Graph build(int n, const std::vector<std::pair<int, int>>& edges, bool directed) {

      }

      int max_degree(const Graph& adj) {

      }
    solution: |
      #include <utility>
      #include <vector>

      using Graph = std::vector<std::vector<int>>;

      Graph build(int n, const std::vector<std::pair<int, int>>& edges, bool directed) {
          Graph adj(n);
          for (auto [a, b] : edges) {
              adj[a].push_back(b);
              if (!directed) adj[b].push_back(a);
          }
          return adj;
      }

      int max_degree(const Graph& adj) {
          std::size_t best = 0;
          for (const auto& nb : adj)
              if (nb.size() > best) best = nb.size();
          return static_cast<int>(best);
      }
    harness: |
      int main() {
          std::vector<std::pair<int, int>> e = {{0, 1}, {0, 2}, {0, 3}, {2, 3}};
          Graph u = build(4, e, false);
          CHECK_EQ("undirected: 0 has 3 neighbors", u[0].size(), 3u);
          CHECK_EQ("undirected: 3 sees 0 and 2", u[3], (std::vector<int>{0, 2}));
          CHECK_EQ("max degree", max_degree(u), 3);
          Graph d = build(4, e, true);
          CHECK_EQ("directed: 3 has no out-edges", d[3].size(), 0u);
          CHECK_EQ("directed max degree", max_degree(d), 3);
          CHECK_EQ("isolated vertices", max_degree(build(3, {}, false)), 0);
      }
    hints:
      - "`Graph adj(n);` then for each edge `adj[a].push_back(b);` and, if undirected, the reverse."
      - "max_degree is the largest `adj[v].size()`."

  - title: Shortest path with BFS
    id: dsa-graphs-2
    text: |
      When every edge has the same cost, **breadth-first search** finds shortest paths: it explores everything 1 step away, then 2 steps, and so on, so the first time it reaches a cell is by a shortest route.

      Grids are graphs too: each open cell is a vertex connected to its up/down/left/right neighbors.

      ```
      dist[start] = 0; queue = [start]
      while queue not empty:
          cur = pop front
          for each open neighbor nb with no dist yet:
              dist[nb] = dist[cur] + 1; push nb
      ```

      **Your turn:** write `int shortest_path(const std::vector<std::string>& grid)` returning the fewest moves from `S` to `E`, moving through `.` cells (not `#`), or -1 if E can't be reached.
    seed: |
      #include <queue>
      #include <string>
      #include <utility>
      #include <vector>

      int shortest_path(const std::vector<std::string>& grid) {

      }
    solution: |
      #include <queue>
      #include <string>
      #include <utility>
      #include <vector>

      int shortest_path(const std::vector<std::string>& grid) {
          int rows = static_cast<int>(grid.size());
          if (rows == 0) return -1;
          int cols = static_cast<int>(grid[0].size());
          std::vector<std::vector<int>> dist(rows, std::vector<int>(cols, -1));
          std::queue<std::pair<int, int>> q;
          for (int r = 0; r < rows; r++)
              for (int c = 0; c < cols; c++)
                  if (grid[r][c] == 'S') {
                      dist[r][c] = 0;
                      q.push({r, c});
                  }
          const int dr[] = {-1, 1, 0, 0}, dc[] = {0, 0, -1, 1};
          while (!q.empty()) {
              auto [r, c] = q.front();
              q.pop();
              if (grid[r][c] == 'E') return dist[r][c];
              for (int k = 0; k < 4; k++) {
                  int nr = r + dr[k], nc = c + dc[k];
                  if (nr < 0 || nc < 0 || nr >= rows || nc >= cols) continue;
                  if (grid[nr][nc] == '#' || dist[nr][nc] != -1) continue;
                  dist[nr][nc] = dist[r][c] + 1;
                  q.push({nr, nc});
              }
          }
          return -1;
      }
    harness: |
      int main() {
          CHECK_EQ("open room", shortest_path({"S..", "...", "..E"}), 4);
          CHECK_EQ("around a wall", shortest_path({"S#.", ".#.", "...", ".#E"}), 5);
          CHECK_EQ("blocked", shortest_path({"S#E"}), -1);
          CHECK_EQ("adjacent", shortest_path({"SE"}), 1);
          std::vector<std::string> big(300, std::string(300, '.'));
          big[0][0] = 'S';
          big[299][299] = 'E';
          for (int r = 1; r < 299; r += 2) big[r][(r / 2) % 2 ? 0 : 299] = '#';
          CHECK_EQ("300 x 300 grid", shortest_path(big), 598);
      }
    hints:
      - "Keep `dist` as a grid of -1 (unvisited). Find S, set its distance to 0 and push it."
      - "Pop the front; if it's E return its distance. Otherwise push each in-bounds, non-wall, unvisited neighbor with distance + 1."
      - "If the queue empties first, return -1."

  - title: Depth-first flood fill
    id: dsa-graphs-3
    text: |
      **Depth-first search** follows one path as far as it can before backtracking. It's the natural tool for "which things are connected?": pick an unvisited vertex, DFS from it to mark its whole component, and count how many times you had to start.

      Recursive DFS is elegant, but a big component can overflow the call stack (the default stack is only about 1 MB, and on this site even less). Production code often uses an **explicit stack** instead:

      ```cpp
      std::vector<std::pair<int, int>> stack = {{r, c}};
      while (!stack.empty()) { auto [r, c] = stack.back(); stack.pop_back(); ... push neighbors ... }
      ```

      **Your turn:** write `int count_islands(std::vector<std::string> grid)`, counting groups of `#` cells connected up/down/left/right. Use an explicit stack: the test has an island of 250,000 cells.
    seed: |
      #include <string>
      #include <utility>
      #include <vector>

      int count_islands(std::vector<std::string> grid) {

      }
    solution: |
      #include <string>
      #include <utility>
      #include <vector>

      int count_islands(std::vector<std::string> grid) {
          int rows = static_cast<int>(grid.size());
          int islands = 0;
          for (int r = 0; r < rows; r++) {
              for (int c = 0; c < static_cast<int>(grid[r].size()); c++) {
                  if (grid[r][c] != '#') continue;
                  islands++;
                  std::vector<std::pair<int, int>> stack = {{r, c}};
                  grid[r][c] = '.';
                  while (!stack.empty()) {
                      auto [cr, cc] = stack.back();
                      stack.pop_back();
                      const int dr[] = {-1, 1, 0, 0}, dc[] = {0, 0, -1, 1};
                      for (int k = 0; k < 4; k++) {
                          int nr = cr + dr[k], nc = cc + dc[k];
                          if (nr < 0 || nr >= rows || nc < 0 || nc >= static_cast<int>(grid[nr].size())) continue;
                          if (grid[nr][nc] != '#') continue;
                          grid[nr][nc] = '.';
                          stack.push_back({nr, nc});
                      }
                  }
              }
          }
          return islands;
      }
    harness: |
      int main() {
          CHECK_EQ("three islands", count_islands({"##..#", "#...#", "..#..", "....."}), 3);
          CHECK_EQ("diagonals don't connect", count_islands({"#.", ".#"}), 2);
          CHECK_EQ("none", count_islands({"...", "..."}), 0);
          CHECK_EQ("empty grid", count_islands({}), 0);
          std::vector<std::string> big(500, std::string(500, '#'));
          CHECK_EQ("one island of 250,000 cells", count_islands(big), 1);
          std::vector<std::string> checker(200, std::string(200, '.'));
          for (int r = 0; r < 200; r++)
              for (int c = 0; c < 200; c++)
                  if ((r + c) % 2 == 0) checker[r][c] = '#';
          CHECK_EQ("20,000 single-cell islands", count_islands(checker), 20000);
      }
    hints:
      - "Scan every cell. When you find a `#`, count a new island and flood it."
      - "Flood with a vector used as a stack: mark cells as visited (turn them into '.') when you push them, so none is pushed twice."
      - "Taking the grid by value lets you modify your own copy."

  - title: Topological sort
    id: dsa-graphs-4
    text: |
      Build systems, package managers, spreadsheets and job schedulers must run tasks **after** their dependencies. For a directed graph with no cycles, a **topological order** lists every vertex before everything that depends on it.

      **Kahn's algorithm**:

      1. Count each vertex's *in-degree* (how many edges point to it).
      2. Put every vertex with in-degree 0 in a queue: nothing blocks it.
      3. Pop one, append it to the order, and decrement the in-degree of its dependents; any that reach 0 join the queue.

      If the order ends up shorter than n, some vertices were never freed: the graph has a **cycle** (for example, two libraries that depend on each other).

      **Your turn:** write `std::vector<int> build_order(int n, const std::vector<std::pair<int, int>>& deps)` where `{a, b}` means "a must be built before b". Use a **min-heap** instead of a plain queue so ties come out smallest-number first (the tests expect that exact order). Return an empty vector if there's a cycle.
    seed: |
      #include <functional>
      #include <queue>
      #include <utility>
      #include <vector>

      std::vector<int> build_order(int n, const std::vector<std::pair<int, int>>& deps) {

      }
    solution: |
      #include <functional>
      #include <queue>
      #include <utility>
      #include <vector>

      std::vector<int> build_order(int n, const std::vector<std::pair<int, int>>& deps) {
          std::vector<std::vector<int>> out(n);
          std::vector<int> indeg(n, 0);
          for (auto [a, b] : deps) {
              out[a].push_back(b);
              indeg[b]++;
          }
          std::priority_queue<int, std::vector<int>, std::greater<int>> ready;
          for (int v = 0; v < n; v++)
              if (indeg[v] == 0) ready.push(v);
          std::vector<int> order;
          while (!ready.empty()) {
              int v = ready.top();
              ready.pop();
              order.push_back(v);
              for (int w : out[v])
                  if (--indeg[w] == 0) ready.push(w);
          }
          if (static_cast<int>(order.size()) != n) return {};
          return order;
      }
    harness: |
      int main() {
          CHECK_EQ("chain", build_order(3, {{2, 1}, {1, 0}}), (std::vector<int>{2, 1, 0}));
          CHECK_EQ("independent tasks in number order", build_order(3, {}), (std::vector<int>{0, 1, 2}));
          CHECK_EQ("diamond", build_order(4, {{0, 1}, {0, 2}, {1, 3}, {2, 3}}), (std::vector<int>{0, 1, 2, 3}));
          CHECK_EQ("tie-break", build_order(4, {{3, 0}, {2, 0}}), (std::vector<int>{1, 2, 3, 0}));
          CHECK("cycle gives empty", build_order(3, {{0, 1}, {1, 2}, {2, 0}}).empty());
      }
    hints:
      - "Build an adjacency list and an in-degree count from the dependency pairs."
      - "Seed a `std::priority_queue<int, std::vector<int>, std::greater<int>>` with all in-degree-0 vertices."
      - "Pop, append, decrement dependents, push any that hit 0. Return {} if the order is shorter than n."

  - title: Dijkstra's shortest paths
    id: dsa-graphs-5
    text: |
      When edges have **different weights** (distances, latencies, costs), BFS is no longer enough. **Dijkstra's algorithm** is BFS with a priority queue: always expand the unfinished vertex with the smallest known distance.

      ```
      dist[src] = 0; heap = {(0, src)}
      while heap not empty:
          (d, v) = pop smallest
          if d > dist[v]: continue            // stale entry, skip it
          for each edge (v, w, cost):
              if dist[v] + cost < dist[w]:
                  dist[w] = dist[v] + cost; push (dist[w], w)
      ```

      O((V + E) log V). It requires **non-negative** weights. It's the algorithm behind route planners and network routing protocols like OSPF.

      **Your turn:** write `std::vector<long long> dijkstra(int n, const std::vector<Edge>& edges, int src)` for a directed graph. Unreachable vertices get -1.
    seed: |
      #include <functional>
      #include <queue>
      #include <utility>
      #include <vector>

      struct Edge {
          int from, to;
          long long cost;
      };

      std::vector<long long> dijkstra(int n, const std::vector<Edge>& edges, int src) {

      }
    solution: |
      #include <functional>
      #include <queue>
      #include <utility>
      #include <vector>

      struct Edge {
          int from, to;
          long long cost;
      };

      std::vector<long long> dijkstra(int n, const std::vector<Edge>& edges, int src) {
          std::vector<std::vector<std::pair<int, long long>>> adj(n);
          for (const auto& e : edges) adj[e.from].push_back({e.to, e.cost});
          const long long INF = -1;
          std::vector<long long> dist(n, INF);
          using Item = std::pair<long long, int>;
          std::priority_queue<Item, std::vector<Item>, std::greater<Item>> heap;
          dist[src] = 0;
          heap.push({0, src});
          while (!heap.empty()) {
              auto [d, v] = heap.top();
              heap.pop();
              if (d > dist[v]) continue;
              for (auto [w, cost] : adj[v]) {
                  long long nd = d + cost;
                  if (dist[w] == INF || nd < dist[w]) {
                      dist[w] = nd;
                      heap.push({nd, w});
                  }
              }
          }
          return dist;
      }
    harness: |
      int main() {
          std::vector<Edge> e = {{0, 1, 4}, {0, 2, 1}, {2, 1, 2}, {1, 3, 1}, {2, 3, 5}};
          auto d = dijkstra(5, e, 0);
          CHECK_EQ("to 1 via 2", d[1], 3LL);
          CHECK_EQ("to 3", d[3], 4LL);
          CHECK_EQ("source", d[0], 0LL);
          CHECK_EQ("unreachable", d[4], -1LL);
          int n = 100000;
          std::vector<Edge> chain;
          for (int i = 0; i + 1 < n; i++) {
              chain.push_back({i, i + 1, 1000000});
              if (i + 2 < n) chain.push_back({i, i + 2, 1999999});
          }
          auto far = dijkstra(n, chain, 0);
          CHECK_EQ("100,000 vertices", far[n - 1], 99999LL * 1000000 - 49999);
      }
    hints:
      - "Build an adjacency list of (neighbor, cost) pairs."
      - "Use a min-heap of (distance, vertex): `std::priority_queue<Item, std::vector<Item>, std::greater<Item>>`."
      - "Skip popped entries whose distance is larger than the best known one; relax each edge and push improvements."

  - title: "Challenge: union-find"
    id: dsa-graphs-6
    text: |
      **Union-find** (disjoint set union) tracks which items are in the same group while groups keep merging: network connectivity, clustering, Kruskal's minimum spanning tree, detecting cycles as edges arrive.

      Each set is a tree; `find(x)` walks to the root, which identifies the set. Two tricks make it nearly O(1) per operation:

      - **path compression**: while finding, point nodes directly at the root
      - **union by size**: attach the smaller tree under the larger one

      **Your turn:** write class `UnionFind`:

      - `explicit UnionFind(int n)`: n separate sets
      - `int find(int x)` with path compression
      - `bool unite(int a, int b)`: merge; returns false if already in the same set
      - `int groups() const`: number of separate sets
      - `int size_of(int x)`: size of x's set
    seed: |
      #include <numeric>
      #include <utility>
      #include <vector>

      class UnionFind {
      public:
          explicit UnionFind(int n);
          int find(int x);
          bool unite(int a, int b);
          int groups() const;
          int size_of(int x);

      private:

      };
    solution: |
      #include <numeric>
      #include <utility>
      #include <vector>

      class UnionFind {
      public:
          explicit UnionFind(int n);
          int find(int x);
          bool unite(int a, int b);
          int groups() const;
          int size_of(int x);

      private:
          std::vector<int> parent_, size_;
          int groups_;
      };

      UnionFind::UnionFind(int n) : parent_(n), size_(n, 1), groups_(n) {
          std::iota(parent_.begin(), parent_.end(), 0);
      }

      int UnionFind::find(int x) {
          int root = x;
          while (parent_[root] != root) root = parent_[root];
          while (parent_[x] != root) {
              int next = parent_[x];
              parent_[x] = root;
              x = next;
          }
          return root;
      }

      bool UnionFind::unite(int a, int b) {
          a = find(a);
          b = find(b);
          if (a == b) return false;
          if (size_[a] < size_[b]) std::swap(a, b);
          parent_[b] = a;
          size_[a] += size_[b];
          groups_--;
          return true;
      }

      int UnionFind::groups() const { return groups_; }

      int UnionFind::size_of(int x) { return size_[find(x)]; }
    harness: |
      int main() {
          UnionFind uf(6);
          CHECK_EQ("starts separate", uf.groups(), 6);
          CHECK_EQ("unite 0-1", uf.unite(0, 1), true);
          uf.unite(2, 3);
          uf.unite(1, 3);
          CHECK_EQ("already connected", uf.unite(0, 2), false);
          CHECK_EQ("groups", uf.groups(), 3);
          CHECK_EQ("size of 3", uf.size_of(3), 4);
          CHECK("same root", uf.find(0) == uf.find(3));
          CHECK("5 alone", uf.size_of(5) == 1);
          int n = 300000;
          UnionFind big(n);
          for (int i = 0; i + 1 < n; i++) big.unite(i, i + 1);
          CHECK_EQ("one big group", big.groups(), 1);
          long long checks = 0;
          for (int i = 0; i < n; i++) checks += big.find(i) == big.find(0);
          CHECK_EQ("300,000 finds", checks, 300000LL);
      }
    hints:
      - "Store `parent_` (initialized to 0..n-1 with std::iota), `size_` (all 1) and a group counter."
      - "find: walk up to the root, then walk again pointing every node on the path straight at the root."
      - "unite: find both roots; if equal return false. Attach the smaller root under the larger, add sizes, decrement groups."
