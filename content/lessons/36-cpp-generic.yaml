      - "Constructor and copy constructor: `count_++`. Destructor: `count_--`. `static int alive() { return count_; }`."
      - "Declaring a copy constructor stops the compiler generating copy assignment, so add `Counted& operator=(const Counted&) = default;` (assignment doesn't change how many objects exist)."
