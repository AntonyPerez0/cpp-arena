          Write `template <std::size_t N> constexpr std::array<char, N> caesar(const char (&s)[N], int shift)` that shifts every lowercase letter forward by `shift` places (wrapping from `z` to `a`) and copies everything else, including the final `'\0'`. It must work at compile time.
