id: cpp-generic
title: Variadic templates and type traits
lang: cpp
phase: "C++: Professional C++"
summary: Generic code at library level. Parameter packs and fold expressions, perfect forwarding, type traits, writing your own trait, constraining templates with concepts, and compile-time computation.
steps:
  - title: Parameter packs and fold expressions
    id: cpp-generic-1
    text: |
      A **variadic template** accepts any number of arguments, of any types, as a *parameter pack*:

      ```cpp
      template <typename... Ts>
      auto sum(Ts... xs) {
          return (xs + ...);      // a fold expression: x1 + (x2 + (x3 + ...))
      }
      sum(1, 2, 3);        // 6
      sum(1.5, 2);         // 3.5
      ```

      `sizeof...(xs)` gives the number of arguments. Fold expressions work with any binary operator: `(xs && ...)`, `(... , f(xs))` and so on. `std::make_unique`, `std::tuple`, `emplace_back` and `std::format` are all built on packs.

      **Your turn:** write `count_if_all(pred, xs...)`, returning how many of the arguments satisfy `pred`, and `all_positive(xs...)`. Use fold expressions, no loops.
    seed: |
      template <typename Pred, typename... Ts>
      int count_if_all(Pred pred, Ts... xs) {

      }

      template <typename... Ts>
      bool all_positive(Ts... xs) {

      }
    solution: |
      template <typename Pred, typename... Ts>
      int count_if_all(Pred pred, Ts... xs) {
          return (0 + ... + (pred(xs) ? 1 : 0));
      }

      template <typename... Ts>
      bool all_positive(Ts... xs) {
          return ((xs > 0) && ...);
      }
    forbid:
      - pattern: "\\bfor\\b|\\bwhile\\b"
        message: Use fold expressions instead of loops.
    harness: |
      int main() {
          auto even = [](auto x) { return static_cast<long>(x) % 2 == 0; };
          CHECK_EQ("count evens", count_if_all(even, 1, 2, 3, 4, 6), 3);
          CHECK_EQ("mixed types", count_if_all(even, 2, 4L, 7.0), 2);
          CHECK_EQ("all positive", all_positive(1, 2.5, 3L), true);
          CHECK_EQ("one negative", all_positive(1, -2, 3), false);
          CHECK_EQ("empty && fold is true", all_positive(), true);
      }
    hints:
      - "A binary fold with an initial value handles the empty pack: `(0 + ... + expr)`."
      - "For each argument, `expr` can be `(pred(xs) ? 1 : 0)`."
      - "`((xs > 0) && ...)` is true for an empty pack."

  - title: Perfect forwarding
    id: cpp-generic-2
    text: |
      A factory like `std::make_unique<T>(args...)` must pass its arguments to `T`'s constructor **exactly** as received: temporaries as rvalues (so they can be moved), named variables as lvalues (so they're copied, not stolen).

      That's **perfect forwarding**:

      ```cpp
      template <typename T, typename... Args>
      std::unique_ptr<T> make(Args&&... args) {
          return std::unique_ptr<T>(new T(std::forward<Args>(args)...));
      }
      ```

      - `Args&&` in a template is a **forwarding reference**: it binds to anything and remembers whether it was an lvalue or an rvalue.
      - `std::forward<Args>(args)...` restores that category when passing it on.

      **Your turn:** write `template <typename T, typename... Args> T& emplace_into(std::vector<T>& v, Args&&... args)` that constructs a T at the end of v from the forwarded arguments (with `emplace_back`) and returns a reference to it.
    seed: |
      #include <utility>
      #include <vector>

      template <typename T, typename... Args>
      T& emplace_into(std::vector<T>& v, Args&&... args) {

      }
    solution: |
      #include <utility>
      #include <vector>

      template <typename T, typename... Args>
      T& emplace_into(std::vector<T>& v, Args&&... args) {
          return v.emplace_back(std::forward<Args>(args)...);
      }
    require:
      - pattern: "std::forward\\s*<\\s*Args\\s*>\\s*\\(\\s*args\\s*\\)\\s*\\.\\.\\."
        message: "Forward the arguments: `std::forward<Args>(args)...`"
    harness: |
      #include <string>
      struct Tracked {
          std::string name;
          int copies = 0;
          Tracked(std::string n, int) : name(std::move(n)) {}
          Tracked(const Tracked& o) : name(o.name), copies(o.copies + 1) {}
          Tracked(Tracked&& o) noexcept : name(std::move(o.name)), copies(o.copies) {}
          Tracked& operator=(const Tracked&) = default;
      };
      int main() {
          std::vector<Tracked> v;
          v.reserve(4);
          Tracked& a = emplace_into(v, std::string("ropz"), 1);
          CHECK_EQ("constructed in place", a.name, std::string("ropz"));
          CHECK_EQ("returns a reference into the vector", &a == &v.back(), true);
          Tracked keep("rain", 2);
          Tracked& b = emplace_into(v, keep);
          CHECK_EQ("lvalue argument is copied", b.copies, 1);
          CHECK_EQ("original untouched", keep.name, std::string("rain"));
          Tracked& c = emplace_into(v, Tracked("broky", 3));
          CHECK_EQ("rvalue argument is moved, not copied", c.copies, 0);
          std::vector<std::string> s;
          emplace_into(s, 3, 'x');
          CHECK_EQ("forwards two arguments to string(count, ch)", s[0], std::string("xxx"));
      }
    hints:
      - "`emplace_back` returns a reference to the new element in C++17 and later."
      - "`return v.emplace_back(std::forward<Args>(args)...);`"

  - title: Type traits
    id: cpp-generic-3
    text: |
      `<type_traits>` answers questions about types **at compile time**: `std::is_integral_v<T>`, `std::is_floating_point_v<T>`, `std::is_same_v<A, B>`, `std::is_pointer_v<T>`... and transforms types: `std::remove_cvref_t<T>`, `std::make_unsigned_t<T>`.

      Combined with `if constexpr` (from the templates module), a single template can handle each kind of type correctly:

      ```cpp
      template <typename T>
      std::string describe(const T& v) {
          if constexpr (std::is_integral_v<T>) return "int " + std::to_string(v);
          else if constexpr (std::is_floating_point_v<T>) return "float";
          else return "other";
      }
      ```

      **Your turn:** write `template <typename T> std::string kind_of(const T&)` returning `"bool"` for bool (careful: bool **is** an integral type, so check it first), `"signed"` or `"unsigned"` for other integral types, `"float"` for floating point, `"pointer"` for pointers, and `"other"` otherwise.
    seed: |
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string kind_of(const T&) {

      }
    solution: |
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string kind_of(const T&) {
          if constexpr (std::is_same_v<T, bool>) return "bool";
          else if constexpr (std::is_integral_v<T>) return std::is_signed_v<T> ? "signed" : "unsigned";
          else if constexpr (std::is_floating_point_v<T>) return "float";
          else if constexpr (std::is_pointer_v<T>) return "pointer";
          else return "other";
      }
    harness: |
      int main() {
          int x = 1;
          CHECK_EQ("int", kind_of(-5), std::string("signed"));
          CHECK_EQ("unsigned", kind_of(5u), std::string("unsigned"));
          CHECK_EQ("char is integral", kind_of('c') == "signed" || kind_of('c') == "unsigned", true);
          CHECK_EQ("bool", kind_of(true), std::string("bool"));
          CHECK_EQ("double", kind_of(2.5), std::string("float"));
          CHECK_EQ("pointer", kind_of(&x), std::string("pointer"));
          CHECK_EQ("string", kind_of(std::string("hi")), std::string("other"));
      }
    hints:
      - "Chain `if constexpr ... else if constexpr ...` and check `std::is_same_v<T, bool>` first."
      - "`std::is_signed_v<T>` tells signed from unsigned integral types."

  - title: Writing your own trait
    id: cpp-generic-4
    text: |
      A trait is just a template struct with a `value`, where **specializations** give the answers. The standard ones are written exactly like this:

      ```cpp
      template <typename T>
      struct is_vector : std::false_type {};          // default: no

      template <typename T, typename A>
      struct is_vector<std::vector<T, A>> : std::true_type {};   // any vector: yes

      template <typename T>
      inline constexpr bool is_vector_v = is_vector<T>::value;
      ```

      The second one is a **partial specialization**: it's still a template (over T and the allocator A), but only matches vectors.

      **Your turn:** write the `is_vector` trait and `is_vector_v`, then use it in `size_of(const T& x)`: for a vector, return its `size()`; for anything else, return 1.
    seed: |
      #include <cstddef>
      #include <type_traits>
      #include <vector>

      // is_vector and is_vector_v here

      template <typename T>
      std::size_t size_of(const T& x) {

      }
    solution: |
      #include <cstddef>
      #include <type_traits>
      #include <vector>

      // is_vector and is_vector_v here
      template <typename T>
      struct is_vector : std::false_type {};

      template <typename T, typename A>
      struct is_vector<std::vector<T, A>> : std::true_type {};

      template <typename T>
      inline constexpr bool is_vector_v = is_vector<T>::value;

      template <typename T>
      std::size_t size_of(const T& x) {
          if constexpr (is_vector_v<T>) return x.size();
          else return 1;
      }
    harness: |
      #include <string>
      int main() {
          static_assert(is_vector_v<std::vector<int>>, "vector<int> is a vector");
          static_assert(!is_vector_v<int>, "int is not a vector");
          static_assert(!is_vector_v<std::string>, "string is not a vector");
          CHECK_EQ("vector of 3", size_of(std::vector<int>{1, 2, 3}), 3u);
          CHECK_EQ("vector of strings", size_of(std::vector<std::string>{"a", "b"}), 2u);
          CHECK_EQ("plain int", size_of(42), 1u);
          CHECK_EQ("string counts as one thing", size_of(std::string("hello")), 1u);
      }
    hints:
      - "Primary template inherits `std::false_type`; the partial specialization for `std::vector<T, A>` inherits `std::true_type`."
      - "`template <typename T> inline constexpr bool is_vector_v = is_vector<T>::value;`"
      - "In size_of, `if constexpr (is_vector_v<T>) return x.size(); else return 1;`"

  - title: Constraining templates with concepts
    id: cpp-generic-5
    text: |
      An unconstrained template accepts any type and fails deep inside its body with a wall of errors. A **concept** states the requirements up front, so a wrong type gets one clear error at the call site:

      ```cpp
      template <typename T>
      concept Shape = requires(const T& s) {
          { s.area() } -> std::convertible_to<double>;
          { s.name() } -> std::convertible_to<std::string>;
      };

      template <Shape S>
      void print(const S& s);
      ```

      A `requires` expression lists operations that must compile, and optionally what they must return. This gives you **static polymorphism**: shapes that share no base class and have no virtual functions still work, with zero runtime cost.

      **Your turn:** write the `Shape` concept above and `template <Shape S> double total_area(const std::vector<S>& shapes)`.
    seed: |
      #include <concepts>
      #include <string>
      #include <vector>

      // concept Shape here

      // total_area here
    solution: |
      #include <concepts>
      #include <string>
      #include <vector>

      // concept Shape here
      template <typename T>
      concept Shape = requires(const T& s) {
          { s.area() } -> std::convertible_to<double>;
          { s.name() } -> std::convertible_to<std::string>;
      };

      // total_area here
      template <Shape S>
      double total_area(const std::vector<S>& shapes) {
          double t = 0;
          for (const auto& s : shapes) t += s.area();
          return t;
      }
    harness: |
      struct Square {
          double side;
          double area() const { return side * side; }
          std::string name() const { return "square"; }
      };
      struct Circle {
          double r;
          double area() const { return 3.0 * r * r; }
          const char* name() const { return "circle"; }
      };
      struct Blob { int size; };
      int main() {
          static_assert(Shape<Square>, "Square is a Shape");
          static_assert(Shape<Circle>, "Circle is a Shape (const char* converts to string)");
          static_assert(!Shape<Blob>, "Blob has no area()");
          static_assert(!Shape<int>, "int is not a Shape");
          CHECK_EQ("two squares", total_area(std::vector<Square>{{2}, {3}}), 13.0);
          CHECK_EQ("circles", total_area(std::vector<Circle>{{1}, {2}}), 15.0);
          CHECK_EQ("empty", total_area(std::vector<Square>{}), 0.0);
      }
    hints:
      - "`template <typename T> concept Shape = requires(const T& s) { ... };`"
      - "Inside: `{ s.area() } -> std::convertible_to<double>;` and the same for name() with std::string."
      - "Then `template <Shape S> double total_area(const std::vector<S>& shapes)` just loops and adds."

  - title: "Challenge: compile-time computation"
    id: cpp-generic-6
    text: |
      `constexpr` functions can run **during compilation** when their inputs are constants. The result is baked into the program as a literal, and `static_assert` can check it. Lookup tables, hashes of fixed strings, unit conversions and configuration validation are often done this way in performance-critical code.

      Since C++20, constexpr functions may use loops, local variables, `std::array` and even `std::vector` (as long as it doesn't escape).

      **Your turn:**

      - `constexpr std::array<int, N> first_primes<N>()`: the first N primes
      - `constexpr std::uint32_t hash32(std::string_view s)`: 32-bit FNV-1a (start `2166136261u`, for each byte `h ^= byte; h *= 16777619u;`)

      Both must work at compile time: the tests use them inside `static_assert`.
    seed: |
      #include <array>
      #include <cstddef>
      #include <cstdint>
      #include <string_view>

      template <std::size_t N>
      constexpr std::array<int, N> first_primes() {

      }

      constexpr std::uint32_t hash32(std::string_view s) {

      }
    solution: |
      #include <array>
      #include <cstddef>
      #include <cstdint>
      #include <string_view>

      template <std::size_t N>
      constexpr std::array<int, N> first_primes() {
          std::array<int, N> out{};
          std::size_t found = 0;
          for (int n = 2; found < N; n++) {
              bool prime = true;
              for (int d = 2; d * d <= n; d++) {
                  if (n % d == 0) {
                      prime = false;
                      break;
                  }
              }
              if (prime) out[found++] = n;
          }
          return out;
      }

      constexpr std::uint32_t hash32(std::string_view s) {
          std::uint32_t h = 2166136261u;
          for (char c : s) {
              h ^= static_cast<unsigned char>(c);
              h *= 16777619u;
          }
          return h;
      }
    harness: |
      int main() {
          constexpr auto p = first_primes<10>();
          static_assert(p[0] == 2 && p[9] == 29, "computed at compile time");
          CHECK_EQ("5th prime", p[4], 11);
          CHECK_EQ("last of 10", p[9], 29);
          static_assert(first_primes<100>()[99] == 541, "100th prime is 541");
          static_assert(hash32("") == 2166136261u, "empty string");
          static_assert(hash32("a") == 0xe40c292cu, "FNV-1a of a");
          CHECK("different strings differ", hash32("dust2") != hash32("mirage"));
          constexpr std::uint32_t h = hash32("inferno");
          CHECK("usable as a compile-time constant", h == hash32(std::string_view("inferno")));
      }
    hints:
      - "first_primes: fill a `std::array<int, N> out{}` by testing n = 2, 3, 4, ... for divisors up to sqrt(n)."
      - "hash32: `std::uint32_t h = 2166136261u;` then for each char `h ^= static_cast<unsigned char>(c); h *= 16777619u;`."
