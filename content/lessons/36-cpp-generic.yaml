      #include <string>
      #include <vector>

      // concept Shape here

      // total_area here
    solution: |
      #include <concepts>
      #include <string>
      #include <vector>

      // concept Shape here
      template <typename T>
      concept Shape = requires(const T& s) {
          { s.area() } -> std::convertible_to<double>;
          { s.name() } -> std::convertible_to<std::string>;
      };

      // total_area here
      template <Shape S>
      double total_area(const std::vector<S>& shapes) {
          double t = 0;
          for (const auto& s : shapes) t += s.area();
          return t;
      }
    harness: |
