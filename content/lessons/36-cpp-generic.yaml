id: cpp-generic
title: Variadic templates and type traits
lang: cpp
phase: "C++: Professional C++"
summary: Generic code at library level. Parameter packs and fold expressions, perfect forwarding, type traits, writing your own trait, constraining templates with concepts, and compile-time computation.
steps:
  - title: Parameter packs and fold expressions
    id: cpp-generic-1
    text: |
      Some functions naturally take **any number** of arguments: `std::make_unique<T>(args...)` forwards however many the constructor needs, `std::format` takes a value for every `{}`. A **variadic template** accepts any number of arguments, of any types, as a **parameter pack**.

      ```cpp run
      #include <iostream>
      #include <string>

      template <typename... Ts>
      auto sum(Ts... xs) {
          return (xs + ...);                     // a fold expression: x1 + (x2 + (x3 + ...))
      }

      template <typename... Ts>
      void print_all(const Ts&... xs) {
          ((std::cout << xs << " "), ...);       // a comma fold: do this for each x, in order
          std::cout << "(" << sizeof...(xs) << " values)\n";
      }

      template <typename... Ts>
      bool any_empty(const Ts&... strs) {
          return (strs.empty() || ...);          // true if at least one is empty
      }

      int main() {
          std::cout << sum(1, 2, 3) << " " << sum(1.5, 2) << "\n";
          print_all("id", 7, 2.5, 'x');
          std::cout << any_empty(std::string("a"), std::string(""), std::string("c")) << "\n";
      }
      ```

      ```output
      6 3.5
      id 7 2.5 x (4 values)
      1
      ```

      ### How it works

      - `typename... Ts` declares a **pack of types**, and `Ts... xs` a matching **pack of values**. For `sum(1, 2, 3)`, `Ts` is `int, int, int`.
      - A pack can't be looped over like a vector. Instead you **expand** it with `...`, and the most useful expansion is a **fold expression**: `(xs + ...)` puts `+` between every element.
      - The pattern before the `...` can be any expression using the pack: `(strs.empty() || ...)` calls `empty()` on each and joins the results with `||`.
      - `((std::cout << xs << " "), ...)` folds over the **comma operator**, which just means "do each of these, left to right". It's the loop-free way to run a statement for every element.
      - `sizeof...(xs)` gives the number of elements.

      ### Your task

      For counting, turn each check into a number and add them: `(int(pred(xs)) + ... + 0)`. The `+ 0` at the end makes the fold work even with **zero** arguments (an empty `+` fold with no starting value doesn't compile). `all_positive` is an `&&` fold of `xs > 0`, which is `true` for an empty pack.

      **Your turn:** write `count_if_all(pred, xs...)`, returning how many of the arguments satisfy `pred`, and `all_positive(xs...)`. Use fold expressions, no loops.
    seed: |
      template <typename Pred, typename... Ts>
      int count_if_all(Pred pred, Ts... xs) {

      }

      template <typename... Ts>
      bool all_positive(Ts... xs) {

      }
    solution: |
      template <typename Pred, typename... Ts>
      int count_if_all(Pred pred, Ts... xs) {
          return (0 + ... + (pred(xs) ? 1 : 0));
      }

      template <typename... Ts>
      bool all_positive(Ts... xs) {
          return ((xs > 0) && ...);
      }
    forbid:
      - pattern: "\\bfor\\b|\\bwhile\\b"
        message: Use fold expressions instead of loops.
    harness: |
      int main() {
          auto even = [](auto x) { return static_cast<long>(x) % 2 == 0; };
          CHECK_EQ("count evens", count_if_all(even, 1, 2, 3, 4, 6), 3);
          CHECK_EQ("mixed types", count_if_all(even, 2, 4L, 7.0), 2);
          CHECK_EQ("all positive", all_positive(1, 2.5, 3L), true);
          CHECK_EQ("one negative", all_positive(1, -2, 3), false);
          CHECK_EQ("empty && fold is true", all_positive(), true);
      }
    hints:
      - "A binary fold with an initial value handles the empty pack: `(0 + ... + expr)`."
      - "For each argument, `expr` can be `(pred(xs) ? 1 : 0)`."
      - "`((xs > 0) && ...)` is true for an empty pack."

  - title: Perfect forwarding
    id: cpp-generic-2
    text: |
      A factory like `std::make_unique<T>(args...)` must pass its arguments on to `T`'s constructor **exactly as it received them**: a temporary should stay a temporary (so it can be moved from), and a named variable should stay a named variable (so it's copied, not stolen). Getting that right is called **perfect forwarding**.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>

      struct Tag {
          std::string text;
          Tag(const std::string& t) : text(t) { std::cout << "copied '" << t << "'\n"; }
          Tag(std::string&& t) : text(std::move(t)) { std::cout << "moved '" << text << "'\n"; }
      };

      template <typename T, typename... Args>
      T build(Args&&... args) {
          return T(std::forward<Args>(args)...);
      }

      int main() {
          std::string name = "keep me";
          Tag a = build<Tag>(name);                  // lvalue: must copy
          Tag b = build<Tag>(std::string("temp"));   // rvalue: may move
          std::cout << "name is still '" << name << "'\n";
      }
      ```

      ```output
      copied 'keep me'
      moved 'temp'
      name is still 'keep me'
      ```

      ### How it works

      - In a template, `Args&&` is not a plain rvalue reference. It's a **forwarding reference**: it binds to anything and remembers whether the argument was an lvalue or an rvalue, by encoding it in `Args`.
      - Inside the function, `args` has a name, so it's an lvalue no matter what was passed. Passing it on directly would **always copy**.
      - `std::forward<Args>(args)` restores the original category: lvalue in, lvalue out; rvalue in, rvalue out. With a pack, `std::forward<Args>(args)...` does that for every argument.

      ### Rules of thumb

      - `std::move` means "treat this as an rvalue, always".
      - `std::forward<T>` means "keep whatever it originally was". Use it only on forwarding references, typically exactly once per argument.

      ### Your task

      `v.emplace_back(...)` already takes forwarded arguments and builds the element in place. Forward yours into it, and return `v.back()`, which is a reference to the new element. (Since C++17 `emplace_back` also returns that reference.)

      **Your turn:** write `template <typename T, typename... Args> T& emplace_into(std::vector<T>& v, Args&&... args)` that constructs a T at the end of v from the forwarded arguments (with `emplace_back`) and returns a reference to it.
    seed: |
      #include <utility>
      #include <vector>

      template <typename T, typename... Args>
      T& emplace_into(std::vector<T>& v, Args&&... args) {

      }
    solution: |
      #include <utility>
      #include <vector>

      template <typename T, typename... Args>
      T& emplace_into(std::vector<T>& v, Args&&... args) {
          return v.emplace_back(std::forward<Args>(args)...);
      }
    require:
      - pattern: "std::forward\\s*<\\s*Args\\s*>\\s*\\(\\s*args\\s*\\)\\s*\\.\\.\\."
        message: "Forward the arguments: `std::forward<Args>(args)...`"
    harness: |
      #include <string>
      struct Tracked {
          std::string name;
          int copies = 0;
          Tracked(std::string n, int) : name(std::move(n)) {}
          Tracked(const Tracked& o) : name(o.name), copies(o.copies + 1) {}
          Tracked(Tracked&& o) noexcept : name(std::move(o.name)), copies(o.copies) {}
          Tracked& operator=(const Tracked&) = default;
      };
      int main() {
          std::vector<Tracked> v;
          v.reserve(4);
          Tracked& a = emplace_into(v, std::string("ropz"), 1);
          CHECK_EQ("constructed in place", a.name, std::string("ropz"));
          CHECK_EQ("returns a reference into the vector", &a == &v.back(), true);
          Tracked keep("rain", 2);
          Tracked& b = emplace_into(v, keep);
          CHECK_EQ("lvalue argument is copied", b.copies, 1);
          CHECK_EQ("original untouched", keep.name, std::string("rain"));
          Tracked& c = emplace_into(v, Tracked("broky", 3));
          CHECK_EQ("rvalue argument is moved, not copied", c.copies, 0);
          std::vector<std::string> s;
          emplace_into(s, 3, 'x');
          CHECK_EQ("forwards two arguments to string(count, ch)", s[0], std::string("xxx"));
      }
    hints:
      - "`emplace_back` returns a reference to the new element in C++17 and later."
      - "`return v.emplace_back(std::forward<Args>(args)...);`"

  - title: Type traits
    id: cpp-generic-3
    text: |
      `<type_traits>` is a library of compile-time questions and answers about types. It has two kinds of tools:

      - **Predicates** answer yes/no: `std::is_integral_v<T>`, `std::is_signed_v<T>`, `std::is_floating_point_v<T>`, `std::is_pointer_v<T>`, `std::is_same_v<A, B>`.
      - **Transformations** produce a new type: `std::remove_cvref_t<T>` (strip `const` and references), `std::make_unsigned_t<T>`, `std::add_pointer_t<T>`.

      Combined with `if constexpr`, a single template can handle each kind of type correctly:

      ```cpp run
      #include <iostream>
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string info(const T&) {
          std::string s;
          if constexpr (std::is_integral_v<T>) {
              s = std::is_signed_v<T> ? "signed int" : "unsigned int";
              s += " of " + std::to_string(sizeof(T) * 8) + " bits";
          } else if constexpr (std::is_floating_point_v<T>) {
              s = "floating point";
          } else if constexpr (std::is_same_v<T, std::string>) {
              s = "std::string";
          } else {
              s = "something else";
          }
          return s;
      }

      int main() {
          short a = 1;
          unsigned char b = 2;
          std::cout << info(a) << "\n" << info(b) << "\n" << info(2.5f) << "\n";
          std::cout << info(std::string("x")) << "\n" << info(nullptr) << "\n";
          static_assert(std::is_same_v<std::remove_cvref_t<const int&>, int>);
      }
      ```

      ```output
      signed int of 16 bits
      unsigned int of 8 bits
      floating point
      std::string
      something else
      ```

      ### Traps

      - `bool` and `char` are **integral** types. `std::is_integral_v<bool>` is `true`, so a bool check must come **before** the general integral check.
      - A pointer is not integral and not a class, so `std::is_pointer_v<T>` needs its own branch.
      - The parameter is `const T&`, but `T` itself is deduced without the `const` and `&`, so `std::is_same_v<T, std::string>` works here. When you're unsure, wrap the type in `std::remove_cvref_t` first.
      - The last line shows a transformation checked at compile time: stripping `const` and `&` from `const int&` leaves `int`.

      ### decltype

      `decltype(expr)` is the type of an expression, worked out at compile time without running it. If `a` is an `int` and `b` a `double`, `decltype(a + b)` is `double`. Generic code uses it to name types it can't spell out, like `std::vector<decltype(a + b)>`, and you can declare a variable with exactly another one's type: `decltype(total) copy = 0;`.

      **Your turn:** write `template <typename T> std::string kind_of(const T&)` returning `"bool"` for bool (careful: bool **is** an integral type, so check it first), `"signed"` or `"unsigned"` for other integral types, `"float"` for floating point, `"pointer"` for pointers, and `"other"` otherwise.
    seed: |
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string kind_of(const T&) {

      }
    solution: |
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string kind_of(const T&) {
          if constexpr (std::is_same_v<T, bool>) return "bool";
          else if constexpr (std::is_integral_v<T>) return std::is_signed_v<T> ? "signed" : "unsigned";
          else if constexpr (std::is_floating_point_v<T>) return "float";
          else if constexpr (std::is_pointer_v<T>) return "pointer";
          else return "other";
      }
    harness: |
      int main() {
          int x = 1;
          CHECK_EQ("int", kind_of(-5), std::string("signed"));
          CHECK_EQ("unsigned", kind_of(5u), std::string("unsigned"));
          CHECK_EQ("char is integral", kind_of('c') == "signed" || kind_of('c') == "unsigned", true);
          CHECK_EQ("bool", kind_of(true), std::string("bool"));
          CHECK_EQ("double", kind_of(2.5), std::string("float"));
          CHECK_EQ("pointer", kind_of(&x), std::string("pointer"));
          CHECK_EQ("string", kind_of(std::string("hi")), std::string("other"));
      }
    hints:
      - "Chain `if constexpr ... else if constexpr ...` and check `std::is_same_v<T, bool>` first."
      - "`std::is_signed_v<T>` tells signed from unsigned integral types."

  - title: Writing your own trait
    id: cpp-generic-4
    text: |
      The standard traits aren't magic. A trait is just a template struct with a `value` member, and **specializations** give different answers for different types. You can write your own in a few lines, exactly the way the standard library does.

      ```cpp run
      #include <iostream>
      #include <map>
      #include <string>
      #include <type_traits>

      template <typename T>
      struct is_map : std::false_type {};                     // general case: no

      template <typename K, typename V, typename C, typename A>
      struct is_map<std::map<K, V, C, A>> : std::true_type {};   // any std::map: yes

      template <typename T>
      inline constexpr bool is_map_v = is_map<T>::value;

      template <typename T>
      std::string show(const T& x) {
          if constexpr (is_map_v<T>) {
              std::string out = "{";
              for (const auto& [k, v] : x) out += k + ":" + std::to_string(v) + " ";
              return out + "}";
          } else {
              return std::to_string(x);
          }
      }

      int main() {
          std::map<std::string, int> ages = {{"ann", 31}, {"bo", 4}};
          std::cout << show(ages) << "\n" << show(42) << "\n";
          std::cout << is_map_v<int> << is_map_v<std::map<int, int>> << "\n";
      }
      ```

      ```output
      {ann:31 bo:4 }
      42
      01
      ```

      ### How it works

      - `std::false_type` and `std::true_type` are tiny structs with `static constexpr bool value = false` (or `true`). Inheriting from them gives your trait its `value`.
      - The second definition is a **partial specialization**: it's still a template (over the key, value, comparator and allocator types), but it only matches `std::map<...>`. The compiler picks it whenever the type is a map, and the general version otherwise.
      - `is_map_v` is the usual `_v` shortcut, a **variable template** that reads `::value` for you.
      - `std::map` really has four template parameters. The last two have defaults, which is why you normally write only two. A specialization must list all of them to match every possible map.

      ### Your task

      `std::vector` has **two** template parameters, the element type and the allocator, so your specialization is over `std::vector<T, A>`. Then `size_of` uses `if constexpr (is_vector_v<T>)` to call `x.size()` only when `x` is a vector.

      **Your turn:** write the `is_vector` trait and `is_vector_v`, then use it in `size_of(const T& x)`: for a vector, return its `size()`; for anything else, return 1.
    seed: |
      #include <cstddef>
      #include <type_traits>
      #include <vector>

      // is_vector and is_vector_v here

      template <typename T>
      std::size_t size_of(const T& x) {

      }
    solution: |
      #include <cstddef>
      #include <type_traits>
      #include <vector>

      // is_vector and is_vector_v here
      template <typename T>
      struct is_vector : std::false_type {};

      template <typename T, typename A>
      struct is_vector<std::vector<T, A>> : std::true_type {};

      template <typename T>
      inline constexpr bool is_vector_v = is_vector<T>::value;

      template <typename T>
      std::size_t size_of(const T& x) {
          if constexpr (is_vector_v<T>) return x.size();
          else return 1;
      }
    harness: |
      #include <string>
      int main() {
          static_assert(is_vector_v<std::vector<int>>, "vector<int> is a vector");
          static_assert(!is_vector_v<int>, "int is not a vector");
          static_assert(!is_vector_v<std::string>, "string is not a vector");
          CHECK_EQ("vector of 3", size_of(std::vector<int>{1, 2, 3}), 3u);
          CHECK_EQ("vector of strings", size_of(std::vector<std::string>{"a", "b"}), 2u);
          CHECK_EQ("plain int", size_of(42), 1u);
          CHECK_EQ("string counts as one thing", size_of(std::string("hello")), 1u);
      }
    hints:
      - "Primary template inherits `std::false_type`; the partial specialization for `std::vector<T, A>` inherits `std::true_type`."
      - "`template <typename T> inline constexpr bool is_vector_v = is_vector<T>::value;`"
      - "In size_of, `if constexpr (is_vector_v<T>) return x.size(); else return 1;`"

  - title: Constraining templates with concepts
    id: cpp-generic-5
    text: |
      An unconstrained template accepts any type and fails deep inside its body with a wall of errors. A **concept** states the requirements up front, so a wrong type gets one clear error at the call site.

      A concept can also require **operations**, not just categories like "integral". A `requires` expression lists expressions that must compile for the type, and optionally what they must return:

      ```cpp run
      #include <concepts>
      #include <iostream>
      #include <string>
      #include <vector>

      template <typename T>
      concept Priced = requires(const T& item) {
          { item.price() } -> std::convertible_to<double>;
          { item.label() } -> std::convertible_to<std::string>;
      };

      struct Book {
          double price() const { return 12.5; }
          std::string label() const { return "book"; }
      };

      struct Ticket {
          int cents;
          double price() const { return cents / 100.0; }
          const char* label() const { return "ticket"; }
      };

      template <Priced P>
      double total(const std::vector<P>& items) {
          double sum = 0;
          for (const auto& i : items) sum += i.price();
          return sum;
      }

      int main() {
          std::cout << total(std::vector<Book>(2)) << "\n";
          std::cout << total(std::vector<Ticket>{{250}, {1000}}) << "\n";
          std::cout << Priced<Book> << Priced<int> << "\n";
      }
      ```

      ```output
      25
      12.5
      10
      ```

      ### How it works

      - `requires(const T& item) { ... }` introduces a pretend variable `item` and lists what must be valid for it.
      - `{ item.price() } -> std::convertible_to<double>;` means "calling `price()` compiles, and its result converts to `double`". `Ticket::label()` returns `const char*`, which converts to `std::string`, so it qualifies.
      - `Priced<int>` is simply `false`: a concept is a compile-time bool you can test directly.

      ### Static polymorphism

      `Book` and `Ticket` share **no base class** and have **no virtual functions**, yet `total` works for both. That's **static polymorphism**: the compiler generates a separate `total` for each type, with direct calls and zero run-time cost. Virtual functions (dynamic polymorphism) are still the tool when you need **one** container holding **different** types; concepts are for generic code where each call uses one type.

      ### The concept for your task

      ```cpp
      template <typename T>
      concept Shape = requires(const T& s) {
          { s.area() } -> std::convertible_to<double>;
          { s.name() } -> std::convertible_to<std::string>;
      };
      ```

      **Your turn:** write the `Shape` concept above and `template <Shape S> double total_area(const std::vector<S>& shapes)`.
    seed: |
      #include <concepts>
      #include <string>
      #include <vector>

      // concept Shape here

      // total_area here
    solution: |
      #include <concepts>
      #include <string>
      #include <vector>

      // concept Shape here
      template <typename T>
      concept Shape = requires(const T& s) {
          { s.area() } -> std::convertible_to<double>;
          { s.name() } -> std::convertible_to<std::string>;
      };

      // total_area here
      template <Shape S>
      double total_area(const std::vector<S>& shapes) {
          double t = 0;
          for (const auto& s : shapes) t += s.area();
          return t;
      }
    harness: |
      struct Square {
          double side;
          double area() const { return side * side; }
          std::string name() const { return "square"; }
      };
      struct Circle {
          double r;
          double area() const { return 3.0 * r * r; }
          const char* name() const { return "circle"; }
      };
      struct Blob { int size; };
      int main() {
          static_assert(Shape<Square>, "Square is a Shape");
          static_assert(Shape<Circle>, "Circle is a Shape (const char* converts to string)");
          static_assert(!Shape<Blob>, "Blob has no area()");
          static_assert(!Shape<int>, "int is not a Shape");
          CHECK_EQ("two squares", total_area(std::vector<Square>{{2}, {3}}), 13.0);
          CHECK_EQ("circles", total_area(std::vector<Circle>{{1}, {2}}), 15.0);
          CHECK_EQ("empty", total_area(std::vector<Square>{}), 0.0);
      }
    hints:
      - "`template <typename T> concept Shape = requires(const T& s) { ... };`"
      - "Inside: `{ s.area() } -> std::convertible_to<double>;` and the same for name() with std::string."
      - "Then `template <Shape S> double total_area(const std::vector<S>& shapes)` just loops and adds."

  - title: Value categories and reference collapsing
    id: cpp-generic-7
    text: |
      Move semantics and perfect forwarding rest on one idea the standard calls **value categories**. Every expression has a type (`int`, `std::string`) and a category, which answers two questions: does it have an **identity** (is it a particular object you could refer to again)? And **may its resources be taken** (moved from)?

      | Category | Identity? | Movable? | Examples |
      |---|---|---|---|
      | **lvalue** | yes | no | a variable `s`, `*p`, `v[0]`, a call returning `T&` |
      | **prvalue** ("pure rvalue") | no | yes | `42`, `a + b`, `std::string("x")`, a call returning `T` by value |
      | **xvalue** ("expiring value") | yes | yes | `std::move(s)`, a call returning `T&&` |

      Two group names cover them: **rvalues** are prvalues and xvalues (anything you may move from), and **glvalues** are lvalues and xvalues (anything with an identity). Overload resolution uses the category: an rvalue prefers a `T&&` parameter, an lvalue binds to `T&` or `const T&`.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>

      std::string make() { return "temp"; }
      void which(const std::string&) { std::cout << "lvalue\n"; }
      void which(std::string&&) { std::cout << "rvalue\n"; }

      int main() {
          std::string s = "named";
          which(s);                 // lvalue
          which(make());            // prvalue
          which(std::move(s));      // xvalue
          which(s + "!");           // prvalue
          std::string&& r = make();
          which(r);                 // a NAMED rvalue reference is an lvalue
      }
      ```

      ```output
      lvalue
      rvalue
      rvalue
      rvalue
      lvalue
      ```

      The last line surprises everyone once. `r`'s **type** is `std::string&&`, but the expression `r` is a name, so its **category** is lvalue. Anything with a name is an lvalue. That's why a function taking `std::string&& s` still has to write `std::move(s)` to pass it on as an rvalue.

      ### Reference collapsing

      In a template, `T&&` with a deduced `T` is a **forwarding reference**. Pass an lvalue `std::string` and `T` is deduced as `std::string&`, which makes the parameter `std::string& &&`. You can't write a reference to a reference yourself, but when one appears through templates or aliases it **collapses**:

      | Combined | Collapses to |
      |---|---|
      | `& &`, `& &&`, `&& &` | `&` |
      | `&& &&` | `&&` |

      If either side is `&`, the result is `&`. So an lvalue argument gives an lvalue reference parameter, and an rvalue argument (where `T` is plain `std::string`) gives `std::string&&`. `std::forward<T>(x)` then casts `x` back to an rvalue **only** when `T` isn't a reference, which is exactly "only when the caller passed an rvalue". You can ask the same question directly with `std::is_lvalue_reference_v<T>`.

      **Your turn:** write `category(x)`, which returns `"lvalue"` or `"rvalue"` for whatever the caller passed, and `keep(out, x)`, which adds `x` to the vector, copying lvalues and moving rvalues. The tests use a `Tracker` type that counts its copies and moves.
    seed: |
      #include <string>
      #include <type_traits>
      #include <utility>
      #include <vector>

      struct Tracker {
          static inline int copies = 0;
          static inline int moves = 0;
          Tracker() = default;
          Tracker(const Tracker&) { copies++; }
          Tracker(Tracker&&) noexcept { moves++; }
      };

      template <typename T>
      std::string category(T&& x) {

      }

      template <typename T>
      void keep(std::vector<Tracker>& out, T&& x) {

      }
    solution: |
      #include <string>
      #include <type_traits>
      #include <utility>
      #include <vector>

      struct Tracker {
          static inline int copies = 0;
          static inline int moves = 0;
          Tracker() = default;
          Tracker(const Tracker&) { copies++; }
          Tracker(Tracker&&) noexcept { moves++; }
      };

      template <typename T>
      std::string category(T&& x) {
          (void)x;
          return std::is_lvalue_reference_v<T> ? "lvalue" : "rvalue";
      }

      template <typename T>
      void keep(std::vector<Tracker>& out, T&& x) {
          out.push_back(std::forward<T>(x));
      }
    require:
      - pattern: "std::forward"
        message: keep should pass x on with std::forward<T>(x), so lvalues are copied and rvalues moved.
    harness: |
      int main() {
          std::string s = "hi";
          const int c = 3;
          CHECK_EQ("a variable", category(s), std::string("lvalue"));
          CHECK_EQ("a const variable", category(c), std::string("lvalue"));
          CHECK_EQ("a literal", category(42), std::string("rvalue"));
          CHECK_EQ("std::move(s)", category(std::move(s)), std::string("rvalue"));
          CHECK_EQ("a temporary string", category(std::string("x")), std::string("rvalue"));
          std::vector<Tracker> v;
          v.reserve(10);
          Tracker a;
          keep(v, a);
          CHECK("an lvalue is copied", Tracker::copies == 1 && Tracker::moves == 0);
          keep(v, Tracker{});
          CHECK("a temporary is moved", Tracker::copies == 1 && Tracker::moves == 1);
          keep(v, std::move(a));
          CHECK("std::move(a) is moved", Tracker::copies == 1 && Tracker::moves == 2);
          CHECK_EQ("three kept", v.size(), 3u);
      }
    hints:
      - "For an lvalue argument, `T` is deduced as a reference type; for an rvalue, it isn't. `std::is_lvalue_reference_v<T>` tells them apart."
      - "`(void)x;` silences the unused-parameter warning in category."
      - "keep: `out.push_back(std::forward<T>(x));` copies or moves according to what the caller passed."
  - title: SFINAE and enable_if
    id: cpp-generic-8
    text: |
      Concepts arrived in C++20. Before that, templates were constrained with a trick you'll still meet in older code and in almost every library written before 2020, including parts of the standard library: **SFINAE**, "Substitution Failure Is Not An Error".

      The rule: when the compiler tries a function template during overload resolution, it substitutes the deduced types into the template's **signature**. If that produces something invalid (a type that doesn't exist, an expression that doesn't compile), the compiler doesn't report an error. It just quietly drops that template from the candidates and tries the others. Libraries use this on purpose to switch overloads on and off.

      `std::enable_if_t<condition, T>` (from `<type_traits>`) is the usual switch: it means `T` when the condition is true, and names **no type at all** when it's false, which makes the signature invalid and removes the overload.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <type_traits>
      #include <utility>

      template <typename T>
      std::enable_if_t<std::is_integral_v<T>, std::string> describe(T) { return "integer"; }

      template <typename T>
      std::enable_if_t<std::is_floating_point_v<T>, std::string> describe(T) { return "floating point"; }

      // Detection idiom: does T have a size() member?
      template <typename T, typename = void>
      struct has_size : std::false_type {};

      template <typename T>
      struct has_size<T, std::void_t<decltype(std::declval<const T&>().size())>> : std::true_type {};

      int main() {
          std::cout << describe(42) << ", " << describe(2.5) << "\n";
          std::cout << has_size<std::string>::value << has_size<int>::value << "\n";
      }
      ```

      ```output
      integer, floating point
      10
      ```

      ### How it works

      - For `describe(42)`, both templates are tried with `T = int`. In the second, `std::enable_if_t<false, std::string>` doesn't exist, so that overload silently disappears and the first one is chosen. `describe("text")` would match neither, and that **is** an error: "no matching function".
      - The **detection idiom** has two parts. The general `has_size` says `false`. The specialization applies only when `std::void_t<decltype(...)>` is valid, that is, when `std::declval<const T&>().size()` compiles. `std::declval<T>()` pretends to produce a `T` inside `decltype` without constructing one. For `int`, the expression is invalid, the specialization is dropped, and the general version answers `false`.
      - Only the **signature** counts. An error inside a function's body is still a hard error; SFINAE only applies during substitution into the declaration.

      ### The same thing with concepts

      ```cpp
      template <std::integral T> std::string describe(T) { return "integer"; }
      template <typename T> concept HasSize = requires(const T& t) { t.size(); };
      ```

      Concepts say the same thing directly, and their error messages name the requirement that failed instead of listing every rejected overload. Write concepts in new code, and recognize `enable_if` and `void_t` when you read older code.

      **Your turn:** without concepts or `requires`, write the detection trait `has_begin<T>` (true when `std::declval<const T&>().begin()` is valid), and two `count_items` overloads using `enable_if_t`: for types with `begin()`, return the number of elements (`std::distance(c.begin(), c.end())`); for everything else, return 1.
    seed: |
      #include <cstddef>
      #include <iterator>
      #include <type_traits>
      #include <utility>

      template <typename T, typename = void>
      struct has_begin : std::false_type {};

      // your specialization of has_begin here

      // your two count_items overloads here
    solution: |
      #include <cstddef>
      #include <iterator>
      #include <type_traits>
      #include <utility>

      template <typename T, typename = void>
      struct has_begin : std::false_type {};

      template <typename T>
      struct has_begin<T, std::void_t<decltype(std::declval<const T&>().begin())>> : std::true_type {};

      template <typename T>
      std::enable_if_t<has_begin<T>::value, std::size_t> count_items(const T& c) {
          return static_cast<std::size_t>(std::distance(c.begin(), c.end()));
      }

      template <typename T>
      std::enable_if_t<!has_begin<T>::value, std::size_t> count_items(const T&) {
          return 1;
      }
    forbid:
      - pattern: "requires|concept\\b"
        message: Use enable_if and void_t on this step, not concepts.
    require:
      - pattern: "void_t"
        message: Build has_begin with std::void_t, the detection idiom from the lesson.
      - pattern: "enable_if"
        message: Choose between the count_items overloads with std::enable_if_t.
    harness: |
      #include <list>
      #include <map>
      int main() {
          CHECK("vector has begin()", has_begin<std::vector<int>>::value);
          CHECK("string has begin()", has_begin<std::string>::value);
          CHECK("int doesn't", !has_begin<int>::value);
          CHECK("a pointer doesn't", !has_begin<int*>::value);
          CHECK_EQ("a vector of 3", count_items(std::vector<int>{1, 2, 3}), 3u);
          CHECK_EQ("a string of 2", count_items(std::string("ab")), 2u);
          CHECK_EQ("a list of 4", count_items(std::list<int>{4, 3, 2, 1}), 4u);
          CHECK_EQ("an empty map", count_items(std::map<int, int>{}), 0u);
          CHECK_EQ("a plain int counts as 1", count_items(5), 1u);
          CHECK_EQ("a double counts as 1", count_items(2.5), 1u);
      }
    hints:
      - "Copy the lesson's has_size specialization and change `.size()` to `.begin()`."
      - "Return type of the container version: `std::enable_if_t<has_begin<T>::value, std::size_t>`. The other uses `!has_begin<T>::value`."
      - "`std::distance` returns a signed count, so convert it with `static_cast<std::size_t>`."
  - title: CRTP and static polymorphism
    id: cpp-generic-9
    text: |
      Virtual functions choose which code to run **at run time**, through a hidden pointer to a table of functions. That's flexible, but every call is an indirect jump the compiler usually can't inline. When the concrete type is known at compile time anyway, the **Curiously Recurring Template Pattern** (CRTP) gets the same "the base class calls the derived class's version" effect with ordinary, inlinable calls. The name comes from its odd shape: a class inherits from a template instantiated with **itself**.

      ```cpp run
      #include <iostream>
      #include <string>

      template <typename Derived>
      struct Greeter {
          void greet() const {
              // The base knows its real type at compile time, so no virtual call is needed.
              const auto& self = static_cast<const Derived&>(*this);
              std::cout << "Hello from " << self.name() << "\n";
          }
      };

      struct London : Greeter<London> {
          std::string name() const { return "London"; }
      };

      struct Madrid : Greeter<Madrid> {
          std::string name() const { return "Madrid"; }
      };

      template <typename T>
      void welcome(const Greeter<T>& g) { g.greet(); }

      int main() {
          welcome(London{});
          welcome(Madrid{});
      }
      ```

      ```output
      Hello from London
      Hello from Madrid
      ```

      ### How it works

      - `struct London : Greeter<London>` hands the base class the derived type as a template argument. Inside `Greeter<London>`, `Derived` **is** `London`, so the `static_cast` is safe and `self.name()` is a direct call.
      - No `virtual`, no vtable, no pointer to follow. The compiler sees the exact function and can inline it.
      - The price: `Greeter<London>` and `Greeter<Madrid>` are **unrelated types**. There's no common base, so you can't put a London and a Madrid in one `std::vector` and loop over them. Code that uses them must itself be a template, like `welcome`. When you need a mixed collection chosen at run time, virtual functions (or type erasure, in the design patterns module) are the tool.

      ### What CRTP is used for

      - **Mixins**: write a feature once in a base template and add it to any class, like comparison operators generated from one `<`, or cloning, or printing.
      - **Per-type bookkeeping**: static data in a CRTP base is separate for every derived class, because every `Base<X>` is a different class. That's the exercise.
      - **Static interfaces** in performance-critical libraries (math, graphics, simulations), where virtual calls in tight loops would cost too much.

      C++23 added "deducing this" (`void greet(this const auto& self)`), which covers many of these uses without the curious inheritance. You'll still see CRTP everywhere in existing code.

      **Your turn:** write a CRTP base `Counted<T>` that tracks how many objects of each derived type are alive. Its constructor and copy constructor add one to a counter, its destructor subtracts one, and `static int alive()` returns the count. Because the counter lives in `Counted<Enemy>` and `Counted<Bullet>` separately, each type gets its own count.
    seed: |
      template <typename T>
      class Counted {
      public:

      };

      struct Enemy : Counted<Enemy> {
          int hp = 100;
      };

      struct Bullet : Counted<Bullet> {
          int damage = 30;
      };
    solution: |
      template <typename T>
      class Counted {
      public:
          Counted() { count_++; }
          Counted(const Counted&) { count_++; }
          Counted& operator=(const Counted&) = default;
          ~Counted() { count_--; }
          static int alive() { return count_; }

      private:
          static inline int count_ = 0;
      };

      struct Enemy : Counted<Enemy> {
          int hp = 100;
      };

      struct Bullet : Counted<Bullet> {
          int damage = 30;
      };
    forbid:
      - pattern: "\\bvirtual\\b"
        message: CRTP needs no virtual functions.
    harness: |
      int main() {
          CHECK("nothing alive at the start", Enemy::alive() == 0 && Bullet::alive() == 0);
          Enemy a, b;
          CHECK_EQ("two enemies", Enemy::alive(), 2);
          CHECK_EQ("bullets are counted separately", Bullet::alive(), 0);
          {
              Bullet x, y, z;
              Enemy c = a;
              CHECK_EQ("three bullets", Bullet::alive(), 3);
              CHECK_EQ("a copy counts too", Enemy::alive(), 3);
          }
          CHECK_EQ("bullets gone at the end of the block", Bullet::alive(), 0);
          CHECK_EQ("the copy is gone too", Enemy::alive(), 2);
          std::vector<Enemy> wave(5);
          CHECK_EQ("five more in a vector", Enemy::alive(), 7);
      }
    hints:
      - "Keep the count in `static inline int count_ = 0;`. Every `Counted<X>` is a separate class, so each gets its own `count_`."
      - "Constructor and copy constructor: `count_++`. Destructor: `count_--`. `static int alive() { return count_; }`."
      - "Declaring a copy constructor stops the compiler generating copy assignment, so add `Counted& operator=(const Counted&) = default;` (assignment doesn't change how many objects exist)."
  - title: "Challenge: compile-time computation"
    id: cpp-generic-6
    text: |
      `constexpr` functions can run **during compilation** when their inputs are constants. The result is baked into the program as a literal, and `static_assert` can check it before the program even exists. Lookup tables, hashes of fixed strings, unit conversions and configuration checks are often done this way in performance-critical code: the work costs nothing at run time.

      Since C++20, `constexpr` functions may use loops, local variables, `std::array` and even `std::vector` (as long as it doesn't escape the function).

      ```cpp run
      #include <array>
      #include <cstddef>
      #include <iostream>

      template <std::size_t N>
      constexpr std::array<long, N> squares() {
          std::array<long, N> out{};
          for (std::size_t i = 0; i < N; i++) out[i] = (long)(i * i);
          return out;
      }

      constexpr int digit_sum(unsigned n) {
          int s = 0;
          while (n > 0) { s += n % 10; n /= 10; }
          return s;
      }

      constexpr auto table = squares<6>();          // built by the compiler
      static_assert(table[5] == 25);
      static_assert(digit_sum(2024) == 8);

      int main() {
          for (long x : table) std::cout << x << " ";
          std::cout << "\n" << digit_sum(999) << "\n";
      }
      ```

      ```output
      0 1 4 9 16 25 
      27
      ```

      ### How it works

      - `constexpr auto table = squares<6>();` **forces** compile-time evaluation, because a `constexpr` variable must be initialized with a constant.
      - The template parameter `N` sizes the returned `std::array`, so each `N` gives a different function.
      - Inside a `constexpr` function, every variable must be initialized (`out{}`, `s = 0`), and you can't call non-constexpr functions such as I/O.

      ### Your task

      - **First N primes**: fill the array in order. Test each candidate from 2 upward by trying divisors `d` while `d * d <= candidate`; if none divides it, it's prime. Stop when N are found.
      - **FNV-1a hash**: a simple, well-known hash. Start with `h = 2166136261u`, and for each character, `h ^= (unsigned char)c;` then `h *= 16777619u;`. Using `std::uint32_t` makes the multiplication wrap around at 32 bits, which is exactly what the algorithm expects. Cast the char to `unsigned char` first so bytes above 127 aren't sign-extended.

      **Your turn:**

      - `constexpr std::array<int, N> first_primes<N>()`: the first N primes
      - `constexpr std::uint32_t hash32(std::string_view s)`: 32-bit FNV-1a (start `2166136261u`, for each byte `h ^= byte; h *= 16777619u;`)

      Both must work at compile time: the tests use them inside `static_assert`.
    seed: |
      #include <array>
      #include <cstddef>
      #include <cstdint>
      #include <string_view>

      template <std::size_t N>
      constexpr std::array<int, N> first_primes() {

      }

      constexpr std::uint32_t hash32(std::string_view s) {

      }
    solution: |
      #include <array>
      #include <cstddef>
      #include <cstdint>
      #include <string_view>

      template <std::size_t N>
      constexpr std::array<int, N> first_primes() {
          std::array<int, N> out{};
          std::size_t found = 0;
          for (int n = 2; found < N; n++) {
              bool prime = true;
              for (int d = 2; d * d <= n; d++) {
                  if (n % d == 0) {
                      prime = false;
                      break;
                  }
              }
              if (prime) out[found++] = n;
          }
          return out;
      }

      constexpr std::uint32_t hash32(std::string_view s) {
          std::uint32_t h = 2166136261u;
          for (char c : s) {
              h ^= static_cast<unsigned char>(c);
              h *= 16777619u;
          }
          return h;
      }
    harness: |
      int main() {
          constexpr auto p = first_primes<10>();
          static_assert(p[0] == 2 && p[9] == 29, "computed at compile time");
          CHECK_EQ("5th prime", p[4], 11);
          CHECK_EQ("last of 10", p[9], 29);
          static_assert(first_primes<100>()[99] == 541, "100th prime is 541");
          static_assert(hash32("") == 2166136261u, "empty string");
          static_assert(hash32("a") == 0xe40c292cu, "FNV-1a of a");
          CHECK("different strings differ", hash32("dust2") != hash32("mirage"));
          constexpr std::uint32_t h = hash32("inferno");
          CHECK("usable as a compile-time constant", h == hash32(std::string_view("inferno")));
      }
    hints:
      - "first_primes: fill a `std::array<int, N> out{}` by testing n = 2, 3, 4, ... for divisors up to sqrt(n)."
      - "hash32: `std::uint32_t h = 2166136261u;` then for each char `h ^= static_cast<unsigned char>(c); h *= 16777619u;`."
