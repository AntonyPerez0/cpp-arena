id: cpp-generic
title: Variadic templates and type traits
lang: cpp
phase: "C++: Professional C++"
summary: Generic code at library level. Parameter packs and fold expressions, perfect forwarding, type traits, writing your own trait, constraining templates with concepts, and compile-time computation.
steps:
  - title: Parameter packs and fold expressions
    id: cpp-generic-1
    text: |
      Some functions naturally take **any number** of arguments: `std::make_unique<T>(args...)` forwards however many the constructor needs, `std::format` takes a value for every `{}`. A **variadic template** accepts any number of arguments, of any types, as a **parameter pack**.

      ```cpp run
      #include <iostream>
      #include <string>

      template <typename... Ts>
      auto sum(Ts... xs) {
          return (xs + ...);                     // a fold expression: x1 + (x2 + (x3 + ...))
      }

      template <typename... Ts>
      void print_all(const Ts&... xs) {
          ((std::cout << xs << " "), ...);       // a comma fold: do this for each x, in order
          std::cout << "(" << sizeof...(xs) << " values)\n";
      }

      template <typename... Ts>
      bool any_empty(const Ts&... strs) {
          return (strs.empty() || ...);          // true if at least one is empty
      }

      int main() {
          std::cout << sum(1, 2, 3) << " " << sum(1.5, 2) << "\n";
          print_all("id", 7, 2.5, 'x');
          std::cout << any_empty(std::string("a"), std::string(""), std::string("c")) << "\n";
      }
      ```

      ```output
      6 3.5
      id 7 2.5 x (4 values)
      1
      ```

      ### How it works

      - `typename... Ts` declares a **pack of types**, and `Ts... xs` a matching **pack of values**. For `sum(1, 2, 3)`, `Ts` is `int, int, int`.
      - A pack can't be looped over like a vector. Instead you **expand** it with `...`, and the most useful expansion is a **fold expression**: `(xs + ...)` puts `+` between every element.
      - The pattern before the `...` can be any expression using the pack: `(strs.empty() || ...)` calls `empty()` on each and joins the results with `||`.
      - `((std::cout << xs << " "), ...)` folds over the **comma operator**, which just means "do each of these, left to right". It's the loop-free way to run a statement for every element.
      - `sizeof...(xs)` gives the number of elements.

      ### Your task

      For counting, turn each check into a number and add them: `(int(pred(xs)) + ... + 0)`. The `+ 0` at the end makes the fold work even with **zero** arguments (an empty `+` fold with no starting value doesn't compile). `all_positive` is an `&&` fold of `xs > 0`, which is `true` for an empty pack.

      **Your turn:** write `count_if_all(pred, xs...)`, returning how many of the arguments satisfy `pred`, and `all_positive(xs...)`. Use fold expressions, no loops.
    seed: |
      template <typename Pred, typename... Ts>
      int count_if_all(Pred pred, Ts... xs) {

      }

      template <typename... Ts>
      bool all_positive(Ts... xs) {

      }
    solution: |
      template <typename Pred, typename... Ts>
      int count_if_all(Pred pred, Ts... xs) {
          return (0 + ... + (pred(xs) ? 1 : 0));
      }

      template <typename... Ts>
      bool all_positive(Ts... xs) {
          return ((xs > 0) && ...);
      }
    forbid:
      - pattern: "\\bfor\\b|\\bwhile\\b"
        message: Use fold expressions instead of loops.
    harness: |
      int main() {
          auto even = [](auto x) { return static_cast<long>(x) % 2 == 0; };
          CHECK_EQ("count evens", count_if_all(even, 1, 2, 3, 4, 6), 3);
          CHECK_EQ("mixed types", count_if_all(even, 2, 4L, 7.0), 2);
          CHECK_EQ("all positive", all_positive(1, 2.5, 3L), true);
          CHECK_EQ("one negative", all_positive(1, -2, 3), false);
          CHECK_EQ("empty && fold is true", all_positive(), true);
      }
    hints:
      - "A binary fold with an initial value handles the empty pack: `(0 + ... + expr)`."
      - "For each argument, `expr` can be `(pred(xs) ? 1 : 0)`."
      - "`((xs > 0) && ...)` is true for an empty pack."
    more:
      - task: |
          Write `sum_all(xs...)`, the sum of any number of numbers (0 for none), with a fold expression, and `count_args(xs...)`, how many arguments were passed, using `sizeof...`. No loops.
        seed: |
          #include <cstddef>

          template <typename... Ts>
          auto sum_all(Ts... xs) {

          }

          template <typename... Ts>
          std::size_t count_args(Ts... xs) {

          }
        solution: |
          #include <cstddef>

          template <typename... Ts>
          auto sum_all(Ts... xs) {
              return (0 + ... + xs);
          }

          template <typename... Ts>
          std::size_t count_args(Ts...) {
              return sizeof...(Ts);
          }
        forbid:
          - pattern: "\\bfor\\b|\\bwhile\\b"
            message: Use a fold expression and `sizeof...` instead of loops.
        harness: |
          int main() {
              CHECK_EQ("ints", sum_all(1, 2, 3, 4), 10);
              CHECK("mixed types", sum_all(1, 2.5, 3L) == 6.5);
              CHECK_EQ("no arguments", sum_all(), 0);
              CHECK_EQ("count 3", count_args(1, "two", 3.0), 3u);
              CHECK_EQ("count 0", count_args(), 0u);
          }
        hints:
          - "`(0 + ... + xs)` is a binary fold: the `0` makes it work with no arguments too."
          - "`sizeof...(Ts)` is the number of types in the pack, known at compile time."
      - task: |
          Write `template <typename... Ts> std::string join(const Ts&... xs)` that prints every argument into one string, separated by `", "`. `join(1, "ab", 2.5)` is `"1, ab, 2.5"` and `join()` is `""`. Use an `std::ostringstream` and a fold over the **comma operator**, no loops.
        seed: |
          #include <sstream>
          #include <string>

          template <typename... Ts>
          std::string join(const Ts&... xs) {

          }
        solution: |
          #include <sstream>
          #include <string>

          template <typename... Ts>
          std::string join(const Ts&... xs) {
              std::ostringstream out;
              bool first = true;
              ((out << (first ? "" : ", ") << xs, first = false), ...);
              return out.str();
          }
        forbid:
          - pattern: "\\bfor\\b|\\bwhile\\b"
            message: Use a fold over the comma operator instead of a loop.
        harness: |
          int main() {
              CHECK_EQ("mixed", join(1, "ab", 2.5), std::string("1, ab, 2.5"));
              CHECK_EQ("one", join(std::string("solo")), std::string("solo"));
              CHECK_EQ("none", join(), std::string(""));
              CHECK_EQ("chars", join('a', 'b'), std::string("a, b"));
          }
        hints:
          - "`(expr, ...)` runs `expr` once for each element of the pack, left to right."
          - "Keep a `bool first` so the separator is skipped before the first item: `((out << (first ? \"\" : \", \") << xs, first = false), ...);`"

  - title: Perfect forwarding
    id: cpp-generic-2
    text: |
      A factory like `std::make_unique<T>(args...)` must pass its arguments on to `T`'s constructor **exactly as it received them**: a temporary should stay a temporary (so it can be moved from), and a named variable should stay a named variable (so it's copied, not stolen). Getting that right is called **perfect forwarding**.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <utility>

      struct Tag {
          std::string text;
          Tag(const std::string& t) : text(t) { std::cout << "copied '" << t << "'\n"; }
          Tag(std::string&& t) : text(std::move(t)) { std::cout << "moved '" << text << "'\n"; }
      };

      template <typename T, typename... Args>
      T build(Args&&... args) {
          return T(std::forward<Args>(args)...);
      }

      int main() {
          std::string name = "keep me";
          Tag a = build<Tag>(name);                  // lvalue: must copy
          Tag b = build<Tag>(std::string("temp"));   // rvalue: may move
          std::cout << "name is still '" << name << "'\n";
      }
      ```

      ```output
      copied 'keep me'
      moved 'temp'
      name is still 'keep me'
      ```

      ### How it works

      - In a template, `Args&&` is not a plain rvalue reference. It's a **forwarding reference**: it binds to anything and remembers whether the argument was an lvalue or an rvalue, by encoding it in `Args`.
      - Inside the function, `args` has a name, so it's an lvalue no matter what was passed. Passing it on directly would **always copy**.
      - `std::forward<Args>(args)` restores the original category: lvalue in, lvalue out; rvalue in, rvalue out. With a pack, `std::forward<Args>(args)...` does that for every argument.

      ### Rules of thumb

      - `std::move` means "treat this as an rvalue, always".
      - `std::forward<T>` means "keep whatever it originally was". Use it only on forwarding references, typically exactly once per argument.

      ### Your task

      `v.emplace_back(...)` already takes forwarded arguments and builds the element in place. Forward yours into it, and return `v.back()`, which is a reference to the new element. (Since C++17 `emplace_back` also returns that reference.)

      **Your turn:** write `template <typename T, typename... Args> T& emplace_into(std::vector<T>& v, Args&&... args)` that constructs a T at the end of v from the forwarded arguments (with `emplace_back`) and returns a reference to it.
    seed: |
      #include <utility>
      #include <vector>

      template <typename T, typename... Args>
      T& emplace_into(std::vector<T>& v, Args&&... args) {

      }
    solution: |
      #include <utility>
      #include <vector>

      template <typename T, typename... Args>
      T& emplace_into(std::vector<T>& v, Args&&... args) {
          return v.emplace_back(std::forward<Args>(args)...);
      }
    require:
      - pattern: "std::forward\\s*<\\s*Args\\s*>\\s*\\(\\s*args\\s*\\)\\s*\\.\\.\\."
        message: "Forward the arguments: `std::forward<Args>(args)...`"
    harness: |
      #include <string>
      struct Tracked {
          std::string name;
          int copies = 0;
          Tracked(std::string n, int) : name(std::move(n)) {}
          Tracked(const Tracked& o) : name(o.name), copies(o.copies + 1) {}
          Tracked(Tracked&& o) noexcept : name(std::move(o.name)), copies(o.copies) {}
          Tracked& operator=(const Tracked&) = default;
      };
      int main() {
          std::vector<Tracked> v;
          v.reserve(4);
          Tracked& a = emplace_into(v, std::string("ropz"), 1);
          CHECK_EQ("constructed in place", a.name, std::string("ropz"));
          CHECK_EQ("returns a reference into the vector", &a == &v.back(), true);
          Tracked keep("rain", 2);
          Tracked& b = emplace_into(v, keep);
          CHECK_EQ("lvalue argument is copied", b.copies, 1);
          CHECK_EQ("original untouched", keep.name, std::string("rain"));
          Tracked& c = emplace_into(v, Tracked("broky", 3));
          CHECK_EQ("rvalue argument is moved, not copied", c.copies, 0);
          std::vector<std::string> s;
          emplace_into(s, 3, 'x');
          CHECK_EQ("forwards two arguments to string(count, ch)", s[0], std::string("xxx"));
      }
    hints:
      - "`emplace_back` returns a reference to the new element in C++17 and later."
      - "`return v.emplace_back(std::forward<Args>(args)...);`"
    more:
      - task: |
          Write your own `make<T>(args...)`, a version of `std::make_unique`: it creates a `T` with `new`, passing the arguments on with **perfect forwarding**, and returns it in a `std::unique_ptr<T>`. Don't call `std::make_unique`.
        seed: |
          #include <memory>
          #include <utility>

          template <typename T, typename... Args>
          std::unique_ptr<T> make(Args&&... args) {

          }
        solution: |
          #include <memory>
          #include <utility>

          template <typename T, typename... Args>
          std::unique_ptr<T> make(Args&&... args) {
              return std::unique_ptr<T>(new T(std::forward<Args>(args)...));
          }
        require:
          - pattern: "std::forward\\s*<\\s*Args\\s*>\\s*\\(\\s*args\\s*\\)\\s*\\.\\.\\."
            message: "Forward the arguments: `std::forward<Args>(args)...`"
        forbid:
          - pattern: "make_unique"
            message: "Write it yourself with `new` instead of calling `std::make_unique`."
        harness: |
          struct Tracked {
              std::string name;
              int copies = 0;
              Tracked(std::string n, int) : name(std::move(n)) {}
              Tracked(const Tracked& o) : name(o.name), copies(o.copies + 1) {}
              Tracked(Tracked&& o) noexcept : name(std::move(o.name)), copies(o.copies) {}
          };
          int main() {
              auto a = make<Tracked>(std::string("ropz"), 1);
              CHECK_EQ("constructed from two arguments", a->name, std::string("ropz"));
              Tracked keep("rain", 2);
              auto b = make<Tracked>(keep);
              CHECK_EQ("lvalue copied", b->copies, 1);
              auto c = make<Tracked>(Tracked("broky", 3));
              CHECK_EQ("rvalue moved", c->copies, 0);
              auto s = make<std::string>(3, 'z');
              CHECK_EQ("string(count, ch)", *s, std::string("zzz"));
          }
        hints:
          - "`return std::unique_ptr<T>(new T(std::forward<Args>(args)...));`"
      - task: |
          Write `call_logged(log, name, f, args...)`: it appends `"call NAME"` to `log`, then calls `f` with the arguments **perfectly forwarded** and returns whatever `f` returns. It must work with move-only arguments such as `std::unique_ptr`.
        seed: |
          #include <string>
          #include <utility>
          #include <vector>

          template <typename F, typename... Args>
          auto call_logged(std::vector<std::string>& log, const std::string& name, F&& f, Args&&... args) {

          }
        solution: |
          #include <string>
          #include <utility>
          #include <vector>

          template <typename F, typename... Args>
          auto call_logged(std::vector<std::string>& log, const std::string& name, F&& f, Args&&... args) {
              log.push_back("call " + name);
              return std::forward<F>(f)(std::forward<Args>(args)...);
          }
        require:
          - pattern: "std::forward\\s*<\\s*Args\\s*>\\s*\\(\\s*args\\s*\\)\\s*\\.\\.\\."
            message: "Forward the arguments: `std::forward<Args>(args)...`"
        harness: |
          #include <memory>
          int main() {
              std::vector<std::string> log;
              int sum = call_logged(log, "add", [](int a, int b) { return a + b; }, 2, 3);
              CHECK_EQ("returns the result", sum, 5);
              auto p = std::make_unique<int>(41);
              int got = call_logged(log, "take", [](std::unique_ptr<int> q) { return *q + 1; }, std::move(p));
              CHECK_EQ("move-only argument", got, 42);
              CHECK("the pointer was moved in", p == nullptr);
              std::string s = "gg";
              call_logged(log, "append", [](std::string& t) { t += " wp"; return 0; }, s);
              CHECK_EQ("lvalue passed by reference", s, std::string("gg wp"));
              CHECK_EQ("log", log, (std::vector<std::string>{"call add", "call take", "call append"}));
          }
        hints:
          - "`return std::forward<F>(f)(std::forward<Args>(args)...);`"
          - "Forwarding keeps an lvalue an lvalue (so a `std::string&` parameter binds) and an rvalue an rvalue (so a `unique_ptr` can move in)."

  - title: Type traits
    id: cpp-generic-3
    text: |
      `<type_traits>` is a library of compile-time questions and answers about types. It has two kinds of tools:

      - **Predicates** answer yes/no: `std::is_integral_v<T>`, `std::is_signed_v<T>`, `std::is_floating_point_v<T>`, `std::is_pointer_v<T>`, `std::is_same_v<A, B>`.
      - **Transformations** produce a new type: `std::remove_cvref_t<T>` (strip `const` and references), `std::make_unsigned_t<T>`, `std::add_pointer_t<T>`.

      Combined with `if constexpr`, a single template can handle each kind of type correctly:

      ```cpp run
      #include <iostream>
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string info(const T&) {
          std::string s;
          if constexpr (std::is_integral_v<T>) {
              s = std::is_signed_v<T> ? "signed int" : "unsigned int";
              s += " of " + std::to_string(sizeof(T) * 8) + " bits";
          } else if constexpr (std::is_floating_point_v<T>) {
              s = "floating point";
          } else if constexpr (std::is_same_v<T, std::string>) {
              s = "std::string";
          } else {
              s = "something else";
          }
          return s;
      }

      int main() {
          short a = 1;
          unsigned char b = 2;
          std::cout << info(a) << "\n" << info(b) << "\n" << info(2.5f) << "\n";
          std::cout << info(std::string("x")) << "\n" << info(nullptr) << "\n";
          static_assert(std::is_same_v<std::remove_cvref_t<const int&>, int>);
      }
      ```

      ```output
      signed int of 16 bits
      unsigned int of 8 bits
      floating point
      std::string
      something else
      ```

      ### Traps

      - `bool` and `char` are **integral** types. `std::is_integral_v<bool>` is `true`, so a bool check must come **before** the general integral check.
      - A pointer is not integral and not a class, so `std::is_pointer_v<T>` needs its own branch.
      - The parameter is `const T&`, but `T` itself is deduced without the `const` and `&`, so `std::is_same_v<T, std::string>` works here. When you're unsure, wrap the type in `std::remove_cvref_t` first.
      - The last line shows a transformation checked at compile time: stripping `const` and `&` from `const int&` leaves `int`.

      ### decltype

      `decltype(expr)` is the type of an expression, worked out at compile time without running it. If `a` is an `int` and `b` a `double`, `decltype(a + b)` is `double`. Generic code uses it to name types it can't spell out, like `std::vector<decltype(a + b)>`, and you can declare a variable with exactly another one's type: `decltype(total) copy = 0;`.

      **Your turn:** write `template <typename T> std::string kind_of(const T&)` returning `"bool"` for bool (careful: bool **is** an integral type, so check it first), `"signed"` or `"unsigned"` for other integral types, `"float"` for floating point, `"pointer"` for pointers, and `"other"` otherwise.
    seed: |
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string kind_of(const T&) {

      }
    solution: |
      #include <string>
      #include <type_traits>

      template <typename T>
      std::string kind_of(const T&) {
          if constexpr (std::is_same_v<T, bool>) return "bool";
          else if constexpr (std::is_integral_v<T>) return std::is_signed_v<T> ? "signed" : "unsigned";
          else if constexpr (std::is_floating_point_v<T>) return "float";
          else if constexpr (std::is_pointer_v<T>) return "pointer";
          else return "other";
      }
    harness: |
      int main() {
          int x = 1;
          CHECK_EQ("int", kind_of(-5), std::string("signed"));
          CHECK_EQ("unsigned", kind_of(5u), std::string("unsigned"));
          CHECK_EQ("char is integral", kind_of('c') == "signed" || kind_of('c') == "unsigned", true);
          CHECK_EQ("bool", kind_of(true), std::string("bool"));
          CHECK_EQ("double", kind_of(2.5), std::string("float"));
          CHECK_EQ("pointer", kind_of(&x), std::string("pointer"));
          CHECK_EQ("string", kind_of(std::string("hi")), std::string("other"));
      }
    hints:
      - "Chain `if constexpr ... else if constexpr ...` and check `std::is_same_v<T, bool>` first."
      - "`std::is_signed_v<T>` tells signed from unsigned integral types."
    more:
      - task: |
          Write `template <typename T> std::string describe_ptr(const T&)` returning `"not a pointer"`, `"pointer to const"` or `"pointer"`. Use `std::is_pointer_v<T>`, then look at what it points to with `std::remove_pointer_t<T>` and `std::is_const_v`.
        seed: |
          #include <string>
          #include <type_traits>

          template <typename T>
          std::string describe_ptr(const T&) {

          }
        solution: |
          #include <string>
          #include <type_traits>

          template <typename T>
          std::string describe_ptr(const T&) {
              if constexpr (!std::is_pointer_v<T>) {
                  return "not a pointer";
              } else if constexpr (std::is_const_v<std::remove_pointer_t<T>>) {
                  return "pointer to const";
              } else {
                  return "pointer";
              }
          }
        harness: |
          int main() {
              int x = 1;
              const int y = 2;
              int* p = &x;
              const int* cp = &y;
              CHECK_EQ("int", describe_ptr(x), std::string("not a pointer"));
              CHECK_EQ("int*", describe_ptr(p), std::string("pointer"));
              CHECK_EQ("const int*", describe_ptr(cp), std::string("pointer to const"));
              CHECK_EQ("string literal decays to const char*", describe_ptr((const char*)"hi"), std::string("pointer to const"));
              CHECK_EQ("std::string", describe_ptr(std::string("s")), std::string("not a pointer"));
          }
        hints:
          - "`std::remove_pointer_t<const int*>` is `const int`, which `std::is_const_v` reports as const."
      - task: |
          Cheap types are best passed by value and expensive ones by `const&`. Write the alias `template <typename T> using param_t = ...` that is `T` when `T` is trivially copyable and at most 16 bytes, and `const T&` otherwise. Use `std::conditional_t`.
        seed: |
          #include <type_traits>

          // param_t here
        solution: |
          #include <type_traits>

          // param_t here
          template <typename T>
          using param_t = std::conditional_t<std::is_trivially_copyable_v<T> && sizeof(T) <= 16, T, const T&>;
        require:
          - pattern: "conditional_t"
            message: "Choose between the two types with `std::conditional_t`."
        harness: |
          #include <array>
          #include <type_traits>
          struct Point { double x, y; };
          int main() {
              CHECK("int by value", (std::is_same_v<param_t<int>, int>));
              CHECK("Point (16 bytes) by value", (std::is_same_v<param_t<Point>, Point>));
              CHECK("std::string by const&", (std::is_same_v<param_t<std::string>, const std::string&>));
              CHECK("a 40-byte array by const&", (std::is_same_v<param_t<std::array<int, 10>>, const std::array<int, 10>&>));
              CHECK("vector by const&", (std::is_same_v<param_t<std::vector<int>>, const std::vector<int>&>));
          }
        hints:
          - "`std::conditional_t<condition, A, B>` is `A` when the condition is true, otherwise `B`."
          - "`std::string` isn't trivially copyable, because copying it has to copy the characters."

  - title: Writing your own trait
    id: cpp-generic-4
    text: |
      The standard traits aren't magic. A trait is just a template struct with a `value` member, and **specializations** give different answers for different types. You can write your own in a few lines, exactly the way the standard library does.

      ```cpp run
      #include <iostream>
      #include <map>
      #include <string>
      #include <type_traits>

      template <typename T>
      struct is_map : std::false_type {};                     // general case: no

      template <typename K, typename V, typename C, typename A>
      struct is_map<std::map<K, V, C, A>> : std::true_type {};   // any std::map: yes

      template <typename T>
      inline constexpr bool is_map_v = is_map<T>::value;

      template <typename T>
      std::string show(const T& x) {
          if constexpr (is_map_v<T>) {
              std::string out = "{";
              for (const auto& [k, v] : x) out += k + ":" + std::to_string(v) + " ";
              return out + "}";
          } else {
              return std::to_string(x);
          }
      }

      int main() {
          std::map<std::string, int> ages = {{"ann", 31}, {"bo", 4}};
          std::cout << show(ages) << "\n" << show(42) << "\n";
          std::cout << is_map_v<int> << is_map_v<std::map<int, int>> << "\n";
      }
      ```

      ```output
      {ann:31 bo:4 }
      42
      01
      ```

      ### How it works

      - `std::false_type` and `std::true_type` are tiny structs with `static constexpr bool value = false` (or `true`). Inheriting from them gives your trait its `value`.
      - The second definition is a **partial specialization**: it's still a template (over the key, value, comparator and allocator types), but it only matches `std::map<...>`. The compiler picks it whenever the type is a map, and the general version otherwise.
      - `is_map_v` is the usual `_v` shortcut, a **variable template** that reads `::value` for you.
      - `std::map` really has four template parameters. The last two have defaults, which is why you normally write only two. A specialization must list all of them to match every possible map.

      ### Your task

      `std::vector` has **two** template parameters, the element type and the allocator, so your specialization is over `std::vector<T, A>`. Then `size_of` uses `if constexpr (is_vector_v<T>)` to call `x.size()` only when `x` is a vector.

      **Your turn:** write the `is_vector` trait and `is_vector_v`, then use it in `size_of(const T& x)`: for a vector, return its `size()`; for anything else, return 1.
    seed: |
