        solution: |
          #include <array>
          #include <cstddef>

          template <std::size_t N>
          constexpr std::array<char, N> caesar(const char (&s)[N], int shift) {
              std::array<char, N> out{};
              int k = ((shift % 26) + 26) % 26;
              for (std::size_t i = 0; i < N; i++) {
                  char c = s[i];
                  out[i] = (c >= 'a' && c <= 'z') ? (char)('a' + (c - 'a' + k) % 26) : c;
              }
              return out;
          }
