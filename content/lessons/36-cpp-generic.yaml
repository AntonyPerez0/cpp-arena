      #include <iterator>
      #include <type_traits>
      #include <utility>

      template <typename T, typename = void>
      struct has_begin : std::false_type {};

      template <typename T>
      struct has_begin<T, std::void_t<decltype(std::declval<const T&>().begin())>> : std::true_type {};

      template <typename T>
      std::enable_if_t<has_begin<T>::value, std::size_t> count_items(const T& c) {
          return static_cast<std::size_t>(std::distance(c.begin(), c.end()));
      }

