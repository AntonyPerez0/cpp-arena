          int bus_on(Bus *b, int type, Handler h, void *ctx) {
              if (b->count >= MAX_HANDLERS) return -1;
              b->types[b->count] = type;
              b->handlers[b->count] = h;
              b->contexts[b->count] = ctx;
              b->count++;
              return 0;
