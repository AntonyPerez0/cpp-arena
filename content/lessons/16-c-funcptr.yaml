id: c-funcptr
title: Function pointers and callbacks
lang: c
phase: "C: Real-World C"
summary: Treat functions as values. Function pointer syntax, typedefs, dispatch tables, qsort comparators, generic code with void*, and callbacks that carry context.
steps:
  - title: Functions have addresses
    id: c-funcptr-1
    text: |
      Functions live in memory too. The compiled machine code of a function sits at some address, and just as you can store the address of an `int` in a pointer, you can store the address of a function in a **function pointer** and call the function through it later. This lets a program choose **which** function to run while it's running, and it's the foundation of callbacks, plugins and dispatch tables.

      ```c run
      #include <stdio.h>

      double half(double x) { return x / 2; }
      double twice(double x) { return x * 2; }

      int main(void) {
          double (*f)(double) = half;
          printf("%.1f\n", f(9));
          f = twice;
          printf("%.1f\n", f(9));
          double (*pick[2])(double) = {half, twice};
          printf("%.1f\n", pick[1](pick[0](10)));
          return 0;
      }
      ```

      ```output
      4.5
      18.0
      10.0
      ```

      ### Reading the declaration

      `double (*f)(double)` reads from the name outward: `f` is a **pointer** (`*f`, in parentheses) to a **function taking a double** (`(double)`) and **returning a double**. The parentheses around `*f` are essential. Without them, `double *f(double)` declares a *function* named `f` that returns a `double *`.

      ### Using them

      - A function's name used without calling it (`half`, not `half()`) gives its address. You can also write `&half`; it means the same.
      - Call through the pointer exactly like a normal function: `f(9)`. (The old style `(*f)(9)` also works.)
      - The pointer's type must match the function's signature: parameter types and return type.
      - `pick` is an **array** of function pointers, which is the basis of the dispatch tables coming up in step 3.

      **Your turn:** point `op` at `sub` and call it.
    fill: |
      #include <stdio.h>

      int add(int a, int b) { return a + b; }
      int sub(int a, int b) { return a - b; }

      int main(void) {
          int (*op)(int, int) = add;
          printf("%d\n", op(10, 4));
          op = [[sub]];
          printf("%d\n", [[op]](10, 4));
          return 0;
      }
    hints:
      - "A function's name used as a value is its address: `op = sub;`"
      - "Call through the pointer exactly like a function: `op(10, 4)`."
    tests:
      - expect: "14\n6"

  - title: typedef and passing callbacks
    id: c-funcptr-2
    text: |
      Function pointer types are hard to read, so C programmers name them with `typedef`:

      ```c
      typedef int (*BinOp)(int, int);   /* BinOp: pointer to function (int, int) -> int */
      ```

      Now `BinOp` can be used like any type, which makes it easy to write functions that **take behavior as a parameter**. The function you pass in is called a **callback**, because the receiving function "calls back" into your code.

      ```c run
      #include <stdio.h>

      typedef int (*Predicate)(int);

      static int is_even(int x) { return x % 2 == 0; }
      static int is_big(int x) { return x > 100; }

      int count_if(const int *a, int n, Predicate p) {
          int count = 0;
          for (int i = 0; i < n; i++) {
              if (p(a[i])) {
                  count++;
              }
          }
          return count;
      }

      int main(void) {
          int v[] = {4, 150, 7, 200, 10};
          printf("%d even, %d big\n", count_if(v, 5, is_even), count_if(v, 5, is_big));
          return 0;
      }
      ```

      ```output
      4 even, 2 big
      ```

      `count_if` doesn't know or care what it's counting. It walks the array and asks the callback about each element. One loop now serves every counting question you'll ever have.

      ### Fold (also called reduce)

      **Fold** is the same idea for combining values: keep an accumulator, starting at some initial value, and for each element replace it with `f(accumulator, element)`. With addition and 0 you get a sum; with multiplication and 1 a product; with a "bigger of two" function, a maximum. It's one of the most general loops there is, and languages like C++, Python and JavaScript have it built in (`std::accumulate`, `reduce`).

      (`static` on the helper functions just keeps them private to this file, which is covered in the last module of this section.)

      **Your turn:** write `fold`. It starts with `init` and combines it with each element in order: `acc = f(acc, a[i])`.
    seed: |
      typedef int (*BinOp)(int, int);

      int fold(const int *a, int n, int init, BinOp f) {

      }
    solution: |
      typedef int (*BinOp)(int, int);

      int fold(const int *a, int n, int init, BinOp f) {
          int acc = init;
          for (int i = 0; i < n; i++) acc = f(acc, a[i]);
          return acc;
      }
    harness: |
      static int add(int a, int b) { return a + b; }
      static int mul(int a, int b) { return a * b; }
      static int maxi(int a, int b) { return a > b ? a : b; }
      static int minus(int a, int b) { return a - b; }
      int main(void) {
          int a[] = {3, 1, 4, 1, 5};
          CHECK_INT("sum", fold(a, 5, 0, add), 14);
          CHECK_INT("product", fold(a, 5, 1, mul), 60);
          CHECK_INT("max", fold(a, 5, -1000, maxi), 5);
          CHECK_INT("order matters: ((((10-3)-1)-4)-1)-5", fold(a, 5, 10, minus), -4);
          CHECK_INT("empty array gives init", fold(a, 0, 7, add), 7);
          return 0;
      }
    hints:
      - "`int acc = init;` then for each element `acc = f(acc, a[i]);`"

  - title: A dispatch table
    id: c-funcptr-3
    text: |
      When a program must choose between many actions based on a name or number, a long `if`/`else if` chain grows with every new case, and the "what" and the "how" get mixed together. A **dispatch table** separates them: an array of structs, each pairing a key with a function pointer. Finding the right entry is a simple search, and adding a new action is one line in the table.

      ```c run
      #include <stdio.h>
      #include <string.h>

      static void say_hi(void) { printf("hello!\n"); }
      static void say_time(void) { printf("it is 12:00\n"); }
      static void say_help(void) { printf("commands: hi, time, help\n"); }

      typedef struct {
          const char *name;
          void (*run)(void);
      } Command;

      static const Command table[] = {
          {"hi", say_hi},
          {"time", say_time},
          {"help", say_help},
      };

      int main(void) {
          const char *inputs[] = {"time", "dance", "hi"};
          size_t ncmds = sizeof table / sizeof table[0];
          for (int k = 0; k < 3; k++) {
              size_t i = 0;
              while (i < ncmds && strcmp(table[i].name, inputs[k]) != 0) i++;
              if (i < ncmds) table[i].run();
              else printf("unknown: %s\n", inputs[k]);
          }
          return 0;
      }
      ```

      ```output
      it is 12:00
      unknown: dance
      hello!
      ```

      ### The lookup

      Search the table for a matching name. If the loop stops early, `i` is the matching index and you call `table[i].run()`; if `i` reaches the table size, the name wasn't found. The same code handles 3 commands or 300.

      ### Where it's used

      Command-line tools with subcommands (`git commit`, `git push`), interpreters mapping instructions to handlers, network servers mapping message types to handlers, and state machines all use tables like this. `sizeof table / sizeof table[0]` keeps the count right automatically when you add rows.

      **Your turn:** the program reads lines like `add 2 3` until end of input. Look up the command in the table and print the result, or `unknown CMD` if it isn't there. Add a `mul` command to the table as well.
    seed: |
      #include <stdio.h>
      #include <string.h>

      static int add(int a, int b) { return a + b; }
      static int sub(int a, int b) { return a - b; }

      typedef struct {
          const char *name;
          int (*fn)(int, int);
      } Command;

      static const Command commands[] = {
          {"add", add},
          {"sub", sub},
      };
      static const int NCOMMANDS = sizeof commands / sizeof commands[0];

      int main(void) {
          char name[16];
          int a, b;
          while (scanf("%15s %d %d", name, &a, &b) == 3) {
              // find the command and print its result, or "unknown NAME"

          }
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      static int add(int a, int b) { return a + b; }
      static int sub(int a, int b) { return a - b; }
      static int mul(int a, int b) { return a * b; }

      typedef struct {
          const char *name;
          int (*fn)(int, int);
      } Command;

      static const Command commands[] = {
          {"add", add},
          {"sub", sub},
          {"mul", mul},
      };
      static const int NCOMMANDS = sizeof commands / sizeof commands[0];

      int main(void) {
          char name[16];
          int a, b;
          while (scanf("%15s %d %d", name, &a, &b) == 3) {
              // find the command and print its result, or "unknown NAME"
              const Command *found = NULL;
              for (int i = 0; i < NCOMMANDS; i++) {
                  if (strcmp(commands[i].name, name) == 0) found = &commands[i];
              }
              if (found) printf("%d\n", found->fn(a, b));
              else printf("unknown %s\n", name);
          }
          return 0;
      }
    forbid:
      - pattern: "strcmp\\s*\\(\\s*name\\s*,\\s*\"(add|sub|mul)\""
        message: "Look commands up in the table instead of comparing against each name by hand."
    hints:
      - "Write `static int mul(int a, int b)` and add `{\"mul\", mul},` to the table."
      - "Loop over the table; when `strcmp(commands[i].name, name) == 0`, call `commands[i].fn(a, b)`."
      - "Remember whether you found a match, and print `unknown %s` if not."
    tests:
      - stdin: "add 2 3\nsub 10 4\nmul 6 7\n"
      - stdin: "div 8 2\nadd -1 1\n"
      - stdin: "mul 3 -3\npow 2 8\nsub 0 5\n"
        hidden: true

  - title: Sorting with qsort
    id: c-funcptr-4
    text: |
      The standard library's `qsort` sorts **any** array: ints, doubles, structs, strings. It can do that because it doesn't compare elements itself. You give it a **comparator** callback that knows how to compare two elements of your type:

      ```c
      void qsort(void *base, size_t count, size_t size,
                 int (*cmp)(const void *a, const void *b));
      ```

      The comparator gets pointers to two elements, typed as `const void *` (pointer to "something"), and must return negative if `a` should come first, positive if `b` should, and 0 if they're equal. You convert the pointers back to the real type inside.

      ```c run
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>

      typedef struct {
          char name[12];
          double price;
      } Item;

      static int by_price(const void *pa, const void *pb) {
          const Item *a = pa, *b = pb;
          if (a->price != b->price) {
              return (a->price > b->price) - (a->price < b->price);
          }
          return strcmp(a->name, b->name);
      }

      int main(void) {
          Item shop[] = {{"lamp", 20.0}, {"cup", 5.5}, {"book", 20.0}};
          qsort(shop, 3, sizeof shop[0], by_price);
          for (int i = 0; i < 3; i++) printf("%s %.2f\n", shop[i].name, shop[i].price);
          return 0;
      }
      ```

      ```output
      cup 5.50
      book 20.00
      lamp 20.00
      ```

      ### Writing comparators correctly

      - `(a > b) - (a < b)` gives -1, 0 or 1. The shortcut `return a - b;` looks tempting for ints but **overflows** for large values of opposite signs, which is undefined behavior and silently misorders elements.
      - For several sort keys, compare the most important first, and only if it's a tie move on to the next (here, name as a tie-breaker). This gives a stable, predictable order.
      - For descending order, swap the roles of `a` and `b`.

      The pointer conversion `const Item *a = pa;` works without a cast in C, because a `void *` converts to any object pointer automatically.

      **Your turn:** write a comparator `by_score_desc` for `Player` structs: higher score first, and for equal scores, alphabetical by name. Then `sort_players` calls `qsort` with it.
    seed: |
      #include <stdlib.h>
      #include <string.h>

      typedef struct {
          char name[16];
          int score;
      } Player;

      static int by_score_desc(const void *pa, const void *pb) {

      }

      void sort_players(Player *p, size_t n) {

      }
    solution: |
      #include <stdlib.h>
      #include <string.h>

      typedef struct {
          char name[16];
          int score;
      } Player;

      static int by_score_desc(const void *pa, const void *pb) {
          const Player *a = pa, *b = pb;
          if (a->score != b->score) return (b->score > a->score) - (b->score < a->score);
          return strcmp(a->name, b->name);
      }

      void sort_players(Player *p, size_t n) {
          qsort(p, n, sizeof *p, by_score_desc);
      }
    require:
      - pattern: "qsort\\s*\\("
        message: "Sort with the standard `qsort` and your comparator."
    harness: |
      #include <limits.h>
      int main(void) {
          Player p[] = {{"rain", 12}, {"ropz", 25}, {"broky", 12}, {"frozen", 30}, {"karrigan", -3}};
          sort_players(p, 5);
          CHECK_STR("1st", p[0].name, "frozen");
          CHECK_STR("2nd", p[1].name, "ropz");
          CHECK_STR("tie broken by name: 3rd", p[2].name, "broky");
          CHECK_STR("tie broken by name: 4th", p[3].name, "rain");
          CHECK_STR("last", p[4].name, "karrigan");
          Player q[] = {{"lo", INT_MIN}, {"hi", INT_MAX}};
          sort_players(q, 2);
          CHECK_STR("no overflow with extreme scores", q[0].name, "hi");
          return 0;
      }
    hints:
      - "Inside the comparator, convert: `const Player *a = pa, *b = pb;`"
      - "Higher score first means comparing b to a: `(b->score > a->score) - (b->score < a->score)`."
      - "If the scores are equal, `return strcmp(a->name, b->name);`"
      - "`qsort(p, n, sizeof *p, by_score_desc);`"

  - title: Generic code with void *
    id: c-funcptr-5
    text: |
      How can `qsort` work with any element type when C has no generics? It treats the array as **raw bytes**:

      - `base` is a `void *`: the address of the first element, type unknown.
      - `size` says how many bytes one element takes.
      - Element `i` therefore starts at byte offset `i * size`.

      To do that byte arithmetic you convert to `char *`, because `char` is exactly one byte and C doesn't allow arithmetic on `void *` in standard code.

      ```c run
      #include <stdio.h>
      #include <stddef.h>

      size_t count_matching(const void *base, size_t n, size_t size, int (*pred)(const void *)) {
          const char *bytes = base;
          size_t count = 0;
          for (size_t i = 0; i < n; i++) {
              if (pred(bytes + i * size)) {
                  count++;
              }
          }
          return count;
      }

      static int is_negative_double(const void *p) {
          return *(const double *)p < 0;
      }

      static int starts_with_a(const void *p) {
          const char *const *s = p;
          return (*s)[0] == 'a';
      }

      int main(void) {
          double d[] = {1.5, -2.0, -0.5, 3.0};
          const char *words[] = {"apple", "pear", "avocado"};
          printf("%zu %zu\n", count_matching(d, 4, sizeof d[0], is_negative_double),
                 count_matching(words, 3, sizeof words[0], starts_with_a));
          return 0;
      }
      ```

      ```output
      2 2
      ```

      ### Who knows the type?

      The generic function only moves bytes around. The **callback** knows the real type and casts the `const void *` back: `*(const double *)p`. For the array of strings, each element is a `const char *`, so the callback receives a pointer **to** a pointer and must dereference twice. Getting this cast wrong compiles fine and reads garbage, which is the price of `void *` genericity. C++ templates, later in the course, solve the same problem with full type checking.

      ### Returning a pointer to an element

      A generic search returns a `const void *` pointing into the array (or `NULL`). The caller casts it back to the element type.

      **Your turn:** write `find_first`, which returns a pointer to the first element for which `pred` returns nonzero, or `NULL`.
    seed: |
      #include <stddef.h>

      const void *find_first(const void *base, size_t n, size_t size, int (*pred)(const void *)) {

      }
    solution: |
      #include <stddef.h>

      const void *find_first(const void *base, size_t n, size_t size, int (*pred)(const void *)) {
          const char *bytes = base;
          for (size_t i = 0; i < n; i++) {
              const void *elem = bytes + i * size;
              if (pred(elem)) return elem;
          }
          return NULL;
      }
    harness: |
      static int is_negative(const void *p) { return *(const int *)p < 0; }
      typedef struct { char name[8]; double price; } Item;
      static int pricey(const void *p) { return ((const Item *)p)->price > 1000.0; }
      int main(void) {
          int a[] = {4, 8, -15, 16, -23};
          const int *hit = find_first(a, 5, sizeof a[0], is_negative);
          CHECK("first negative int is a[2]", hit == &a[2]);
          CHECK("none in the first two", find_first(a, 2, sizeof a[0], is_negative) == NULL);
          Item items[] = {{"mp9", 1250}, {"awp", 4750}, {"p250", 300}};
          const Item *it = find_first(items + 2, 1, sizeof items[0], pricey);
          CHECK("p250 is cheap", it == NULL);
          it = find_first(items, 3, sizeof items[0], pricey);
          CHECK_STR("first pricey item", it ? it->name : "(none)", "mp9");
          return 0;
      }
    hints:
      - "Convert once: `const char *bytes = base;` Then element i is at `bytes + i * size`."
      - "Call `pred(elem)` and return elem on the first nonzero result. After the loop, `return NULL;`"

  - title: "Challenge: an event bus"
    id: c-funcptr-6
    text: |
      A plain function pointer has a limitation: the function it points at can only use its parameters and global variables. What if the callback needs to update **your** data, like a counter in `main` or a particular window in a GUI?

      C's answer is the **context pointer**. Alongside the function pointer, you register a `void *ctx`, which can point at anything. Whoever calls the callback passes that `ctx` back unchanged. The callback casts it to the type it expects and uses it.

      ```c run
      #include <stdio.h>

      typedef void (*Visitor)(int value, void *ctx);

      void for_each(const int *a, int n, Visitor v, void *ctx) {
          for (int i = 0; i < n; i++) {
              v(a[i], ctx);
          }
      }

      typedef struct {
          int sum;
          int count;
      } Stats;

      static void add_to_stats(int value, void *ctx) {
          Stats *s = ctx;
          s->sum += value;
          s->count++;
      }

      static void track_max(int value, void *ctx) {
          int *best = ctx;
          if (value > *best) *best = value;
      }

      int main(void) {
          int data[] = {4, 9, 2};
          Stats st = {0, 0};
          int best = 0;
          for_each(data, 3, add_to_stats, &st);
          for_each(data, 3, track_max, &best);
          printf("sum %d count %d max %d\n", st.sum, st.count, best);
          return 0;
      }
      ```

      ```output
      sum 15 count 3 max 9
      ```

      The same `for_each` drives two completely different callbacks, each with its own kind of context. This "function pointer plus `void *` user data" pattern appears throughout real C APIs: `pthread_create`, `qsort_r`, event loops, GUI toolkits and audio libraries.

      ### An event bus

      An event bus stores several handler and context **pairs**. Emitting an event calls every registered handler, in order, each with **its own** context. Store the pairs in parallel arrays (or an array of structs), guard against overflowing the fixed capacity, and loop over them on emit.

      **Your turn:** build a tiny event bus that stores up to 8 handler/context pairs.

      - `int bus_on(Bus *b, Handler h, void *ctx)`: register; returns 0, or -1 when full
      - `void bus_emit(Bus *b, int event)`: calls every handler in registration order with the event and **its own** ctx
    seed: |
      #include <stddef.h>

      typedef void (*Handler)(int event, void *ctx);

      #define MAX_HANDLERS 8

      typedef struct {
          Handler handlers[MAX_HANDLERS];
          void *contexts[MAX_HANDLERS];
          int count;
      } Bus;

      int bus_on(Bus *b, Handler h, void *ctx) {

      }

      void bus_emit(Bus *b, int event) {

      }
    solution: |
      #include <stddef.h>

      typedef void (*Handler)(int event, void *ctx);

      #define MAX_HANDLERS 8

      typedef struct {
          Handler handlers[MAX_HANDLERS];
          void *contexts[MAX_HANDLERS];
          int count;
      } Bus;

      int bus_on(Bus *b, Handler h, void *ctx) {
          if (b->count >= MAX_HANDLERS) return -1;
          b->handlers[b->count] = h;
          b->contexts[b->count] = ctx;
          b->count++;
          return 0;
      }

      void bus_emit(Bus *b, int event) {
          for (int i = 0; i < b->count; i++) b->handlers[i](event, b->contexts[i]);
      }
    harness: |
      static void add_to(int event, void *ctx) { *(int *)ctx += event; }
      typedef struct { int last; int calls; } Log;
      static void remember(int event, void *ctx) {
          Log *l = ctx;
          l->last = event;
          l->calls++;
      }
      int main(void) {
          Bus b = {0};
          int total_a = 0, total_b = 100;
          Log log = {0, 0};
          CHECK_INT("register first", bus_on(&b, add_to, &total_a), 0);
          bus_on(&b, add_to, &total_b);
          bus_on(&b, remember, &log);
          bus_emit(&b, 5);
          bus_emit(&b, 7);
          CHECK_INT("handler 1 has its own total", total_a, 12);
          CHECK_INT("handler 2 has its own total", total_b, 112);
          CHECK_INT("log saw the last event", log.last, 7);
          CHECK_INT("log counted two calls", log.calls, 2);
          Bus full = {0};
          int sink = 0;
          for (int i = 0; i < 8; i++) bus_on(&full, add_to, &sink);
          CHECK_INT("ninth registration fails", bus_on(&full, add_to, &sink), -1);
          bus_emit(&full, 1);
          CHECK_INT("all eight ran", sink, 8);
          return 0;
      }
    hints:
      - "bus_on: if `b->count >= MAX_HANDLERS` return -1. Otherwise store h and ctx at index count, then count++."
      - "bus_emit: for each i, `b->handlers[i](event, b->contexts[i]);`"
