          typedef struct {
              const char *name;
              int (*fn)(int);
          } Unary;

          static const Unary commands[] = {
              {"neg", neg},
          };
          static const int NCOMMANDS = sizeof commands / sizeof commands[0];

          int main(void) {
              char name[16];
              int x;
              while (scanf("%15s %d", name, &x) == 2) {
                  // find the command and print its result, or "unknown NAME"

              }
              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <string.h>

          static int neg(int x) { return -x; }
          static int sq(int x) { return x * x; }
          static int absval(int x) { return x < 0 ? -x : x; }

          typedef struct {
              const char *name;
              int (*fn)(int);
          } Unary;

          static const Unary commands[] = {
              {"neg", neg},
              {"sq", sq},
              {"abs", absval},
          };
          static const int NCOMMANDS = sizeof commands / sizeof commands[0];

          int main(void) {
              char name[16];
              int x;
              while (scanf("%15s %d", name, &x) == 2) {
                  // find the command and print its result, or "unknown NAME"
                  const Unary *found = NULL;
                  for (int i = 0; i < NCOMMANDS; i++) {
                      if (strcmp(commands[i].name, name) == 0) found = &commands[i];
                  }
                  if (found) printf("%d\n", found->fn(x));
                  else printf("unknown %s\n", name);
              }
              return 0;
          }
        forbid:
