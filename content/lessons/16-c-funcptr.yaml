id: c-funcptr
title: Function pointers and callbacks
lang: c
phase: "C: Real-World C"
summary: Treat functions as values. Function pointer syntax, typedefs, dispatch tables, qsort comparators, generic code with void*, and callbacks that carry context.
steps:
  - title: Functions have addresses
    id: c-funcptr-1
    text: |
      Functions live in memory too. The compiled machine code of a function sits at some address, and just as you can store the address of an `int` in a pointer, you can store the address of a function in a **function pointer** and call the function through it later. This lets a program choose **which** function to run while it's running, and it's the foundation of callbacks, plugins and dispatch tables.

      ```c run
      #include <stdio.h>

      double half(double x) { return x / 2; }
      double twice(double x) { return x * 2; }

      int main(void) {
          double (*f)(double) = half;
          printf("%.1f\n", f(9));
          f = twice;
          printf("%.1f\n", f(9));
          double (*pick[2])(double) = {half, twice};
          printf("%.1f\n", pick[1](pick[0](10)));
          return 0;
      }
      ```

      ```output
      4.5
      18.0
      10.0
      ```

      ### Reading the declaration

      `double (*f)(double)` reads from the name outward: `f` is a **pointer** (`*f`, in parentheses) to a **function taking a double** (`(double)`) and **returning a double**. The parentheses around `*f` are essential. Without them, `double *f(double)` declares a *function* named `f` that returns a `double *`.

      ### Using them

      - A function's name used without calling it (`half`, not `half()`) gives its address. You can also write `&half`; it means the same.
      - Call through the pointer exactly like a normal function: `f(9)`. (The old style `(*f)(9)` also works.)
      - The pointer's type must match the function's signature: parameter types and return type.
      - `pick` is an **array** of function pointers, which is the basis of the dispatch tables coming up in step 3.

      **Your turn:** point `op` at `sub` and call it.
    fill: |
      #include <stdio.h>

      int add(int a, int b) { return a + b; }
      int sub(int a, int b) { return a - b; }

      int main(void) {
          int (*op)(int, int) = add;
          printf("%d\n", op(10, 4));
          op = [[sub]];
          printf("%d\n", [[op]](10, 4));
          return 0;
      }
    hints:
      - "A function's name used as a value is its address: `op = sub;`"
      - "Call through the pointer exactly like a function: `op(10, 4)`."
    tests:
      - expect: "14\n6"
    more:
      - task: |
          An array can hold function pointers too. Fill the table with `add` and `mul`, so the loop prints `7` and then `12`.
        fill: |
          #include <stdio.h>

          int add(int a, int b) { return a + b; }
          int mul(int a, int b) { return a * b; }

          int main(void) {
              int (*ops[2])(int, int) = {[[add]], [[mul]]};
              for (int i = 0; i < 2; i++) {
                  printf("%d\n", [[ops]][i](3, 4));
              }
              return 0;
          }
        hints:
          - A function's name, without `()`, is its address.
          - "`ops[i]` is the i-th function pointer in the table named `ops`, and you call it like a function: `ops[i](3, 4)`."
        tests:
          - expect: "7\n12"
      - task: |
          Write `int twice(int (*f)(int), int x)` that applies `f` to `x` two times, `f(f(x))`. With the functions below, the program prints `7` (5 plus 1, plus 1) and `81` (3 squared, squared).
        seed: |
          #include <stdio.h>

          int inc(int x) { return x + 1; }
          int square(int x) { return x * x; }

          // write twice here

          int main(void) {
              printf("%d\n", twice(inc, 5));
              printf("%d\n", twice(square, 3));
              return 0;
          }
        solution: |
          #include <stdio.h>

          int inc(int x) { return x + 1; }
          int square(int x) { return x * x; }

          // write twice here
          int twice(int (*f)(int), int x) {
              return f(f(x));
          }

          int main(void) {
              printf("%d\n", twice(inc, 5));
              printf("%d\n", twice(square, 3));
              return 0;
          }
        hints:
          - "The parameter `int (*f)(int)` is a pointer to a function that takes an int and returns an int."
          - Call it like any function, `f(x)`, and pass that result to `f` again.
        tests:
          - expect: "7\n81"

  - title: typedef and passing callbacks
    id: c-funcptr-2
    text: |
      Function pointer types are hard to read, so C programmers name them with `typedef`:

      ```c
      typedef int (*BinOp)(int, int);   /* BinOp: pointer to function (int, int) -> int */
      ```

      Now `BinOp` can be used like any type, which makes it easy to write functions that **take behavior as a parameter**. The function you pass in is called a **callback**, because the receiving function "calls back" into your code.

      ```c run
      #include <stdio.h>

      typedef int (*Predicate)(int);

      static int is_even(int x) { return x % 2 == 0; }
      static int is_big(int x) { return x > 100; }

      int count_if(const int *a, int n, Predicate p) {
          int count = 0;
          for (int i = 0; i < n; i++) {
              if (p(a[i])) {
                  count++;
              }
          }
          return count;
      }

      int main(void) {
          int v[] = {4, 150, 7, 200, 10};
          printf("%d even, %d big\n", count_if(v, 5, is_even), count_if(v, 5, is_big));
          return 0;
      }
      ```

      ```output
      4 even, 2 big
      ```

      `count_if` doesn't know or care what it's counting. It walks the array and asks the callback about each element. One loop now serves every counting question you'll ever have.

      ### Fold (also called reduce)

      **Fold** is the same idea for combining values: keep an accumulator, starting at some initial value, and for each element replace it with `f(accumulator, element)`. With addition and 0 you get a sum; with multiplication and 1 a product; with a "bigger of two" function, a maximum. It's one of the most general loops there is, and languages like C++, Python and JavaScript have it built in (`std::accumulate`, `reduce`).

      (`static` on the helper functions just keeps them private to this file, which is covered in the last module of this section.)

      **Your turn:** write `fold`. It starts with `init` and combines it with each element in order: `acc = f(acc, a[i])`.
    seed: |
      typedef int (*BinOp)(int, int);

      int fold(const int *a, int n, int init, BinOp f) {

      }
    solution: |
      typedef int (*BinOp)(int, int);

      int fold(const int *a, int n, int init, BinOp f) {
          int acc = init;
          for (int i = 0; i < n; i++) acc = f(acc, a[i]);
          return acc;
      }
    harness: |
      static int add(int a, int b) { return a + b; }
      static int mul(int a, int b) { return a * b; }
      static int maxi(int a, int b) { return a > b ? a : b; }
      static int minus(int a, int b) { return a - b; }
      int main(void) {
          int a[] = {3, 1, 4, 1, 5};
          CHECK_INT("sum", fold(a, 5, 0, add), 14);
          CHECK_INT("product", fold(a, 5, 1, mul), 60);
          CHECK_INT("max", fold(a, 5, -1000, maxi), 5);
          CHECK_INT("order matters: ((((10-3)-1)-4)-1)-5", fold(a, 5, 10, minus), -4);
          CHECK_INT("empty array gives init", fold(a, 0, 7, add), 7);
          return 0;
      }
    hints:
      - "`int acc = init;` then for each element `acc = f(acc, a[i]);`"
    more:
      - task: |
          Write `void map_inplace(int *a, int n, IntFn f)` that replaces every element with `f` applied to it.
        seed: |
          typedef int (*IntFn)(int);

          void map_inplace(int *a, int n, IntFn f) {

          }
        solution: |
          typedef int (*IntFn)(int);

          void map_inplace(int *a, int n, IntFn f) {
              for (int i = 0; i < n; i++) a[i] = f(a[i]);
          }
        harness: |
          static int dbl(int x) { return x * 2; }
          static int neg(int x) { return -x; }
          int main(void) {
              int a[] = {1, -2, 3};
              map_inplace(a, 3, dbl);
              CHECK("doubled", a[0] == 2 && a[1] == -4 && a[2] == 6);
              map_inplace(a, 3, neg);
              CHECK("then negated", a[0] == -2 && a[1] == 4 && a[2] == -6);
              map_inplace(a, 1, dbl);
              CHECK("only the first element", a[0] == -4 && a[1] == 4);
              return 0;
          }
        hints:
          - "`a[i] = f(a[i]);` for every index."
        tests: []
      - task: |
          Write `int count_if(const int *a, int n, Pred p)`, which counts the elements for which `p` returns nonzero, and `int all_of(const int *a, int n, Pred p)`, which returns 1 if `p` is true for **every** element (and for an empty array).
        seed: |
          typedef int (*Pred)(int);

          int count_if(const int *a, int n, Pred p) {

          }

          int all_of(const int *a, int n, Pred p) {

          }
        solution: |
          typedef int (*Pred)(int);

          int count_if(const int *a, int n, Pred p) {
              int count = 0;
              for (int i = 0; i < n; i++) {
                  if (p(a[i])) count++;
              }
              return count;
          }

          int all_of(const int *a, int n, Pred p) {
              for (int i = 0; i < n; i++) {
                  if (!p(a[i])) return 0;
              }
              return 1;
          }
        harness: |
          static int is_even(int x) { return x % 2 == 0; }
          static int is_positive(int x) { return x > 0; }
          int main(void) {
              int a[] = {4, 7, 10, -2, 3};
              CHECK_INT("even count", count_if(a, 5, is_even), 3);
              CHECK_INT("positive count", count_if(a, 5, is_positive), 4);
              CHECK_INT("not all positive", all_of(a, 5, is_positive), 0);
              CHECK_INT("first three are positive", all_of(a, 3, is_positive), 1);
              CHECK_INT("all of an empty array", all_of(a, 0, is_even), 1);
              CHECK_INT("count in an empty array", count_if(a, 0, is_even), 0);
              return 0;
          }
        hints:
          - "`count_if` is a loop that adds 1 whenever `p(a[i])` is true."
          - "`all_of` can stop at the first element where `p` is false. If none is, the answer is 1."
        tests: []

  - title: A dispatch table
    id: c-funcptr-3
    text: |
      When a program must choose between many actions based on a name or number, a long `if`/`else if` chain grows with every new case, and the "what" and the "how" get mixed together. A **dispatch table** separates them: an array of structs, each pairing a key with a function pointer. Finding the right entry is a simple search, and adding a new action is one line in the table.

      ```c run
      #include <stdio.h>
      #include <string.h>

      static void say_hi(void) { printf("hello!\n"); }
      static void say_time(void) { printf("it is 12:00\n"); }
      static void say_help(void) { printf("commands: hi, time, help\n"); }

      typedef struct {
          const char *name;
          void (*run)(void);
      } Command;

      static const Command table[] = {
          {"hi", say_hi},
          {"time", say_time},
          {"help", say_help},
      };

      int main(void) {
          const char *inputs[] = {"time", "dance", "hi"};
          size_t ncmds = sizeof table / sizeof table[0];
          for (int k = 0; k < 3; k++) {
              size_t i = 0;
              while (i < ncmds && strcmp(table[i].name, inputs[k]) != 0) i++;
              if (i < ncmds) table[i].run();
              else printf("unknown: %s\n", inputs[k]);
          }
          return 0;
      }
      ```

      ```output
      it is 12:00
      unknown: dance
      hello!
      ```

      ### The lookup

      Search the table for a matching name. If the loop stops early, `i` is the matching index and you call `table[i].run()`; if `i` reaches the table size, the name wasn't found. The same code handles 3 commands or 300.

      ### Where it's used

      Command-line tools with subcommands (`git commit`, `git push`), interpreters mapping instructions to handlers, network servers mapping message types to handlers, and state machines all use tables like this. `sizeof table / sizeof table[0]` keeps the count right automatically when you add rows.

      **Your turn:** the program reads lines like `add 2 3` until end of input. Look up the command in the table and print the result, or `unknown CMD` if it isn't there. Add a `mul` command to the table as well.
    seed: |
      #include <stdio.h>
      #include <string.h>

      static int add(int a, int b) { return a + b; }
      static int sub(int a, int b) { return a - b; }

      typedef struct {
          const char *name;
          int (*fn)(int, int);
      } Command;

      static const Command commands[] = {
          {"add", add},
          {"sub", sub},
      };
      static const int NCOMMANDS = sizeof commands / sizeof commands[0];

      int main(void) {
          char name[16];
          int a, b;
          while (scanf("%15s %d %d", name, &a, &b) == 3) {
              // find the command and print its result, or "unknown NAME"

          }
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      static int add(int a, int b) { return a + b; }
      static int sub(int a, int b) { return a - b; }
      static int mul(int a, int b) { return a * b; }

      typedef struct {
          const char *name;
          int (*fn)(int, int);
      } Command;

      static const Command commands[] = {
          {"add", add},
          {"sub", sub},
          {"mul", mul},
      };
      static const int NCOMMANDS = sizeof commands / sizeof commands[0];

      int main(void) {
          char name[16];
          int a, b;
          while (scanf("%15s %d %d", name, &a, &b) == 3) {
              // find the command and print its result, or "unknown NAME"
              const Command *found = NULL;
              for (int i = 0; i < NCOMMANDS; i++) {
                  if (strcmp(commands[i].name, name) == 0) found = &commands[i];
              }
              if (found) printf("%d\n", found->fn(a, b));
              else printf("unknown %s\n", name);
          }
          return 0;
      }
    forbid:
      - pattern: "strcmp\\s*\\(\\s*name\\s*,\\s*\"(add|sub|mul)\""
        message: "Look commands up in the table instead of comparing against each name by hand."
    hints:
      - "Write `static int mul(int a, int b)` and add `{\"mul\", mul},` to the table."
      - "Loop over the table; when `strcmp(commands[i].name, name) == 0`, call `commands[i].fn(a, b)`."
      - "Remember whether you found a match, and print `unknown %s` if not."
    tests:
      - stdin: "add 2 3\nsub 10 4\nmul 6 7\n"
      - stdin: "div 8 2\nadd -1 1\n"
      - stdin: "mul 3 -3\npow 2 8\nsub 0 5\n"
        hidden: true
    more:
