          #include <stddef.h>

          typedef void (*Handler)(int value, void *ctx);

          #define MAX_HANDLERS 8
          #define ANY_TYPE (-1)

          typedef struct {
              int types[MAX_HANDLERS];
              Handler handlers[MAX_HANDLERS];
              void *contexts[MAX_HANDLERS];
              int count;
