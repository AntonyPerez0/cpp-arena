            hidden: true
      - task: |
          A tiny calculator with a running value that starts at 0. Each input line is a command, some with a number: `add N`, `mul N`, `neg` and `reset`. After each line, print the current value, or `unknown CMD` (and leave the value alone). Every command is a function `int f(int value, int arg)` in a table, and commands without a number ignore `arg`.

          Read whole lines with `fgets`, then pull out the name and an optional number with `sscanf`.
        seed: |
          #include <stdio.h>
          #include <string.h>

          typedef int (*Op)(int value, int arg);

          typedef struct {
              const char *name;
              Op fn;
          } Command;

          int main(void) {
              int value = 0;
              char line[64];
              while (fgets(line, sizeof line, stdin) != NULL) {

              }
              return 0;
          }
        solution: |
          #include <stdio.h>
          #include <string.h>

          typedef int (*Op)(int value, int arg);

          typedef struct {
              const char *name;
              Op fn;
          } Command;

          static int op_add(int value, int arg) { return value + arg; }
          static int op_mul(int value, int arg) { return value * arg; }
          static int op_neg(int value, int arg) { (void)arg; return -value; }
          static int op_reset(int value, int arg) { (void)value; (void)arg; return 0; }

          static const Command commands[] = {
              {"add", op_add},
              {"mul", op_mul},
              {"neg", op_neg},
              {"reset", op_reset},
          };
          static const int NCOMMANDS = sizeof commands / sizeof commands[0];

          int main(void) {
              int value = 0;
              char line[64];
              while (fgets(line, sizeof line, stdin) != NULL) {
                  char name[16];
                  int arg = 0;
                  if (sscanf(line, "%15s %d", name, &arg) < 1) continue;
                  const Command *found = NULL;
                  for (int i = 0; i < NCOMMANDS; i++) {
                      if (strcmp(commands[i].name, name) == 0) found = &commands[i];
                  }
                  if (found) {
                      value = found->fn(value, arg);
                      printf("%d\n", value);
                  } else {
                      printf("unknown %s\n", name);
                  }
              }
              return 0;
          }
        forbid:
          - pattern: "strcmp\\s*\\(\\s*name\\s*,"
            message: Look the name up in the table instead of comparing it with each command by hand.
        hints:
          - "`sscanf(line, \"%15s %d\", name, &arg)` returns 1 when there's only a name, and 2 when there's also a number. Start `arg` at 0."
          - A function that doesn't use a parameter can write `(void)arg;` so the compiler doesn't warn about it.
        tests:
          - stdin: "add 5\nmul 3\nneg\nadd 1\n"
          - stdin: "add 2\npow 3\nreset\nadd 9\n"
          - stdin: "mul 4\nadd -3\nneg\nneg\n"
            hidden: true

  - title: Sorting with qsort
    id: c-funcptr-4
    text: |
      The standard library's `qsort` sorts **any** array: ints, doubles, structs, strings. It can do that because it doesn't compare elements itself. You give it a **comparator** callback that knows how to compare two elements of your type:

      ```c
      void qsort(void *base, size_t count, size_t size,
                 int (*cmp)(const void *a, const void *b));
      ```

      The comparator gets pointers to two elements, typed as `const void *` (pointer to "something"), and must return negative if `a` should come first, positive if `b` should, and 0 if they're equal. You convert the pointers back to the real type inside.

      ```c run
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>

      typedef struct {
          char name[12];
          double price;
      } Item;

      static int by_price(const void *pa, const void *pb) {
          const Item *a = pa, *b = pb;
          if (a->price != b->price) {
              return (a->price > b->price) - (a->price < b->price);
          }
          return strcmp(a->name, b->name);
      }

      int main(void) {
          Item shop[] = {{"lamp", 20.0}, {"cup", 5.5}, {"book", 20.0}};
          qsort(shop, 3, sizeof shop[0], by_price);
          for (int i = 0; i < 3; i++) printf("%s %.2f\n", shop[i].name, shop[i].price);
          return 0;
      }
      ```

      ```output
      cup 5.50
      book 20.00
      lamp 20.00
      ```

      ### Writing comparators correctly

      - `(a > b) - (a < b)` gives -1, 0 or 1. The shortcut `return a - b;` looks tempting for ints but **overflows** for large values of opposite signs, which is undefined behavior and silently misorders elements.
      - For several sort keys, compare the most important first, and only if it's a tie move on to the next (here, name as a tie-breaker). This gives a predictable order. It matters because `qsort` is not **stable**: it may put equal elements in any order, so without a tie-breaker, items with the same price could come out differently on different systems.
      - For descending order, swap the roles of `a` and `b`.

      The pointer conversion `const Item *a = pa;` works without a cast in C, because a `void *` converts to any object pointer automatically.

      **Your turn:** write a comparator `by_score_desc` for `Player` structs: higher score first, and for equal scores, alphabetical by name. Then `sort_players` calls `qsort` with it.
    seed: |
      #include <stdlib.h>
      #include <string.h>

      typedef struct {
          char name[16];
          int score;
      } Player;

      static int by_score_desc(const void *pa, const void *pb) {

      }

      void sort_players(Player *p, size_t n) {

      }
    solution: |
      #include <stdlib.h>
      #include <string.h>

      typedef struct {
          char name[16];
          int score;
      } Player;

      static int by_score_desc(const void *pa, const void *pb) {
          const Player *a = pa, *b = pb;
          if (a->score != b->score) return (b->score > a->score) - (b->score < a->score);
          return strcmp(a->name, b->name);
      }

      void sort_players(Player *p, size_t n) {
          qsort(p, n, sizeof *p, by_score_desc);
      }
    require:
      - pattern: "qsort\\s*\\("
        message: "Sort with the standard `qsort` and your comparator."
    harness: |
      #include <limits.h>
      int main(void) {
          Player p[] = {{"rain", 12}, {"ropz", 25}, {"broky", 12}, {"frozen", 30}, {"karrigan", -3}};
          sort_players(p, 5);
          CHECK_STR("1st", p[0].name, "frozen");
          CHECK_STR("2nd", p[1].name, "ropz");
          CHECK_STR("tie broken by name: 3rd", p[2].name, "broky");
          CHECK_STR("tie broken by name: 4th", p[3].name, "rain");
          CHECK_STR("last", p[4].name, "karrigan");
          Player q[] = {{"lo", INT_MIN}, {"hi", INT_MAX}};
          sort_players(q, 2);
          CHECK_STR("no overflow with extreme scores", q[0].name, "hi");
          return 0;
      }
    hints:
      - "Inside the comparator, convert: `const Player *a = pa, *b = pb;`"
      - "Higher score first means comparing b to a: `(b->score > a->score) - (b->score < a->score)`."
      - "If the scores are equal, `return strcmp(a->name, b->name);`"
      - "`qsort(p, n, sizeof *p, by_score_desc);`"
