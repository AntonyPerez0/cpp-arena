id: cpp-refs
title: References and functions
lang: cpp
phase: "C++: A Better C"
summary: References as safer aliases, const& for cheap read-only parameters, overloading and default arguments.
steps:
  - title: References are aliases
    id: cpp-refs-1
    text: |
      A **reference** is another name (an **alias**) for an existing variable. It isn't a copy and it isn't a separate box: using the reference **is** using the original.

      ```cpp run
      #include <iostream>

      int main() {
          int score = 10;
          int& s = score;
          s += 5;
          std::cout << score << "\n";
          score = 100;
          std::cout << s << "\n";
          int other = 7;
          s = other;
          std::cout << score << "\n";
      }
      ```

      ```output
      15
      100
      7
      ```

      ### Declaring one

      Put `&` after the type: `int& s = score;` makes `s` refer to `score`. From then on, `s` and `score` are two names for the same int.

      ### How references differ from pointers

      A reference does the same job as a pointer in many situations (reaching another variable), with fewer ways to go wrong:

      | Property | Pointer | Reference |
      |---|---|---|
      | Must be initialized | no | **yes** |
      | Can be null | yes | **no** |
      | Can be changed to refer elsewhere | yes | **no** |
      | Syntax to use the target | `*p`, `p->x` | just the name |

      Look at the last part of the example carefully: `s = other;` does **not** make `s` refer to `other`. A reference is bound once, forever. The assignment copies `other`'s **value** (7) into the variable `s` refers to, which is `score`.

      The `&` symbol is overloaded again: in a declaration after a type (`int&`) it means "reference"; in an expression before a variable (`&x`) it still means "address of".

      **Your turn:** make `alias` a reference to `money`, then spend 800 through it.
    fill: |
      #include <iostream>

      int main() {
          int money = 4750;
          int[[&]] alias = money;
          alias [[-=]] 800;
          std::cout << money << "\n";
      }
    hints:
      - "A reference to int is written `int&`."
    tests:
      - expect: "3950"
    more:
      - task: |
          A reference can also name a field of a struct. Make `hp` a reference to the player's `hp` field and take 27 damage through it, so the program prints `73`.
        fill: |
          #include <iostream>

          struct Player {
              int hp;
          };

          int main() {
              Player p{100};
              int[[&]] hp = p.[[hp]];
              hp [[-=]] 27;
              std::cout << p.hp << "\n";
          }
        hints:
          - "`int& hp = p.hp;` makes `hp` another name for the field, not a copy of it."
        tests:
          - expect: "73"
      - task: |
          Read two ints `a` and `b`. Make a reference named `bigger` to whichever one is larger (`a` on a tie), double it **through the reference**, and print `a b`. Input `3 9` prints `3 18`.
        seed: |
          #include <iostream>

          int main() {
              int a, b;
              std::cin >> a >> b;

              std::cout << a << " " << b << "\n";
          }
        solution: |
          #include <iostream>

          int main() {
              int a, b;
              std::cin >> a >> b;
              int& bigger = (b > a) ? b : a;
              bigger *= 2;
              std::cout << a << " " << b << "\n";
          }
        require:
          - pattern: "int\\s*&\\s*bigger"
            message: "Declare the reference as `int& bigger = ...;`."
          - pattern: "bigger\\s*(\\*=|=\\s*bigger\\s*\\*)"
            message: Double the value through `bigger`.
        hints:
          - "When both sides of `?:` are variables of the same type, the result is itself a variable you can bind a reference to: `int& bigger = (b > a) ? b : a;`."
        tests:
          - stdin: "3 9\n"
          - stdin: "10 4\n"
          - stdin: "5 5\n"
            hidden: true

  - title: Pass by reference
    id: cpp-refs-2
    text: |
      References shine as function parameters. A **reference parameter** is bound to the caller's variable, so the function can change it, without any of C's pointer syntax:

      ```cpp run
      #include <iostream>
      #include <string>

      void add_suffix(std::string& s, int n) {
          s += "#" + std::to_string(n);
      }

      void split_minutes(int total, int& minutes, int& seconds) {
          minutes = total / 60;
          seconds = total % 60;
      }

      int main() {
          std::string name = "player";
          add_suffix(name, 7);
          int m, s;
          split_minutes(135, m, s);
          std::cout << name << " " << m << ":" << s << "\n";
      }
      ```

      ```output
      player#7 2:15
      ```

      ### Compared with C

      In C you'd write `void add_suffix(char *s, ...)`, call it as `add_suffix(&name, 7)`, and use `*s` inside. With references:

      - The parameter is declared `std::string& s`.
      - The call site passes the variable plainly: `add_suffix(name, 7)`.
      - Inside, `s` is used like a normal variable.

      `split_minutes` shows **out parameters** with references: the function fills in `minutes` and `seconds` for the caller.

      ### The downside

      At the call site, `add_suffix(name, 7)` doesn't show that `name` might change. Good names (and `const&` for parameters that don't change, next step) make intent clear. Many teams also prefer returning values (possibly a struct) over out parameters when practical.

      `std::to_string(n)` converts a number to a `std::string`.

      **Your turn:** write `void swap_values(int& a, int& b)`.
    seed: |
      void swap_values(int& a, int& b) {

      }
    solution: |
      void swap_values(int& a, int& b) {
          int tmp = a;
          a = b;
          b = tmp;
      }
    harness: |
      int main() {
          int x = 3, y = 9;
          swap_values(x, y);
          CHECK_EQ("x", x, 9);
          CHECK_EQ("y", y, 3);
      }
    hints:
      - Same as the pointer version but without `*`. Use a temporary.
    more:
      - task: |
          Write `void record_kill(int& kills, int& money)` that adds 1 to the kills and 300 to the money of the caller's variables.
        seed: |
          void record_kill(int& kills, int& money) {

          }
        solution: |
          void record_kill(int& kills, int& money) {
              kills++;
              money += 300;
          }
        harness: |
          int main() {
              int kills = 0, money = 800;
              record_kill(kills, money);
              record_kill(kills, money);
              CHECK_EQ("kills after 2", kills, 2);
              CHECK_EQ("money after 2", money, 1400);
          }
        hints:
          - Reference parameters are the caller's variables, so changing them changes the originals. No `*` needed.
        tests: []
      - task: |
          Write `void sort3(int& a, int& b, int& c)` that puts the three values in ascending order, so afterwards `a <= b <= c`.
        seed: |
          void sort3(int& a, int& b, int& c) {

          }
        solution: |
          #include <utility>

          void sort3(int& a, int& b, int& c) {
              if (a > b) std::swap(a, b);
              if (b > c) std::swap(b, c);
              if (a > b) std::swap(a, b);
          }
        harness: |
          int main() {
              int x = 3, y = 1, z = 2;
              sort3(x, y, z);
              CHECK("3,1,2 becomes 1,2,3", x == 1 && y == 2 && z == 3);
              int p = 9, q = 8, r = 7;
              sort3(p, q, r);
              CHECK("9,8,7 becomes 7,8,9", p == 7 && q == 8 && r == 9);
              int s = 4, t = 4, u = -1;
              sort3(s, t, u);
              CHECK("4,4,-1 becomes -1,4,4", s == -1 && t == 4 && u == 4);
          }
        hints:
          - "`std::swap(a, b)` from `<utility>` exchanges two variables."
          - "Three compare-and-swaps are enough: first `a,b`, then `b,c` (the largest ends up in `c`), then `a,b` again."
        tests: []

  - title: const references
    id: cpp-refs-3
    text: |
      Passing a `std::string`, a vector, or any large object **by value** copies the whole thing: every character, every element. For a function that only reads its argument, that copy is wasted work. Passing by reference avoids it, and adding `const` promises (and enforces) that the function won't modify the argument:

      ```cpp run
      #include <iostream>
      #include <string>

      bool ends_with(const std::string& s, const std::string& suffix) {
          if (suffix.size() > s.size()) {
              return false;
          }
          size_t start = s.size() - suffix.size();
          for (size_t i = 0; i < suffix.size(); i++) {
              if (s[start + i] != suffix[i]) {
                  return false;
              }
          }
          return true;
      }

      int main() {
          std::cout << ends_with("report.pdf", ".pdf") << ends_with("a.txt", ".pdf") << ends_with("x", "long") << "\n";
      }
      ```

      ```output
      100
      ```

      ### The everyday rule

      - **Small, cheap types** (`int`, `double`, `char`, `bool`, pointers): pass by value.
      - **Anything bigger** (`std::string`, containers, your classes): pass by `const&` when the function only reads.
      - Pass by non-const `&` only when the function is meant to modify the argument.

      A `const&` parameter can also bind to **temporaries** and literals: `ends_with("report.pdf", ".pdf")` works because C++ creates temporary strings for the call. A non-const `&` can't bind to a temporary.

      ### Size checks first

      `ends_with` checks lengths before indexing. `s.size() - suffix.size()` on unsigned sizes would wrap around to a huge number if the suffix were longer, and the loop would read out of bounds. Guard clauses like this prevent exactly the kind of bug you saw in the integer types module.

      **Your turn:** write `bool starts_with(const std::string& s, const std::string& prefix)` without using any library `starts_with`.
    seed: |
      #include <string>

      bool starts_with(const std::string& s, const std::string& prefix) {

      }
    solution: |
      #include <string>

      bool starts_with(const std::string& s, const std::string& prefix) {
          if (prefix.size() > s.size()) return false;
          for (std::size_t i = 0; i < prefix.size(); i++) {
              if (s[i] != prefix[i]) return false;
          }
          return true;
      }
    forbid:
      - pattern: "\\.starts_with\\s*\\(|\\.rfind\\s*\\(|\\.compare\\s*\\(|\\.substr\\s*\\("
        message: Compare the characters yourself on this step.
    harness: |
      int main() {
          CHECK_EQ("de_dust2 / de_", starts_with("de_dust2", "de_"), true);
          CHECK_EQ("cs_office / de_", starts_with("cs_office", "de_"), false);
          CHECK_EQ("empty prefix", starts_with("abc", ""), true);
          CHECK_EQ("prefix longer", starts_with("ab", "abc"), false);
          CHECK_EQ("equal", starts_with("nuke", "nuke"), true);
      }
    hints:
      - If the prefix is longer than s, it can't match.
      - Compare `s[i]` and `prefix[i]` for every i below `prefix.size()`.
    more:
      - task: |
          Write `bool ends_with(const std::string& s, const std::string& suffix)` without any library `ends_with`, `rfind`, `compare` or `substr`.
        seed: |
          #include <string>

          bool ends_with(const std::string& s, const std::string& suffix) {

          }
        solution: |
          #include <string>

          bool ends_with(const std::string& s, const std::string& suffix) {
              if (suffix.size() > s.size()) return false;
              std::size_t start = s.size() - suffix.size();
              for (std::size_t i = 0; i < suffix.size(); i++) {
                  if (s[start + i] != suffix[i]) return false;
              }
              return true;
          }
        harness: |
          int main() {
              CHECK_EQ("de_dust2 / dust2", ends_with("de_dust2", "dust2"), true);
              CHECK_EQ("de_nuke / dust2", ends_with("de_nuke", "dust2"), false);
              CHECK_EQ("empty suffix", ends_with("abc", ""), true);
              CHECK_EQ("suffix longer", ends_with("bc", "abc"), false);
              CHECK_EQ("equal", ends_with("nuke", "nuke"), true);
          }
        forbid:
          - pattern: "\\.ends_with\\s*\\(|\\.rfind\\s*\\(|\\.compare\\s*\\(|\\.substr\\s*\\("
            message: Compare the characters yourself instead of using a library helper.
        hints:
          - The suffix has to line up with the **end** of `s`, starting at index `s.size() - suffix.size()`.
          - Check that the suffix isn't longer than `s` first, because that subtraction on `size_t` would wrap around.
        tests: []
      - task: |
          Write `int count_occurrences(const std::string& text, const std::string& word)` that counts how many times `word` appears in `text`, **including overlapping matches**: `"aaa"` contains `"aa"` twice. An empty `word` counts as 0. Use `text.find(word, from)` in a loop.
        seed: |
          #include <string>

          int count_occurrences(const std::string& text, const std::string& word) {

          }
        solution: |
          #include <string>

          int count_occurrences(const std::string& text, const std::string& word) {
              if (word.empty()) return 0;
              int count = 0;
              std::size_t pos = text.find(word);
              while (pos != std::string::npos) {
                  count++;
                  pos = text.find(word, pos + 1);
              }
              return count;
          }
        harness: |
          int main() {
              CHECK_EQ("\"gg\" in \"gg wp gg\"", count_occurrences("gg wp gg", "gg"), 2);
              CHECK_EQ("overlapping \"aa\" in \"aaa\"", count_occurrences("aaa", "aa"), 2);
              CHECK_EQ("no match", count_occurrences("dust2", "nuke"), 0);
              CHECK_EQ("empty word", count_occurrences("abc", ""), 0);
              CHECK_EQ("longer word than text", count_occurrences("ab", "abc"), 0);
          }
        hints:
          - "`find` returns `std::string::npos` when there's no match."
          - To count overlapping matches, search again starting one character after the last match, `pos + 1`.
        tests: []

  - title: Overloading
    id: cpp-refs-4
    text: |
      In C, every function needs a unique name, which leads to families like `abs`, `labs`, `fabs`. C++ allows **overloading**: several functions can share a name as long as their **parameter lists differ** (in number or types). The compiler picks the right one from the arguments at each call.

      ```cpp run
      #include <iostream>
      #include <string>

      std::string describe(bool b) { return b ? "yes" : "no"; }
      std::string describe(double d) { return "about " + std::to_string((int)d); }
      std::string describe(const std::string& s) { return "'" + s + "'"; }
      std::string describe(int a, int b) { return std::to_string(a) + ".." + std::to_string(b); }

      int main() {
          std::cout << describe(true) << "\n";
          std::cout << describe(9.7) << "\n";
          std::cout << describe(std::string("hi")) << "\n";
          std::cout << describe(1, 5) << "\n";
      }
      ```

      ```output
      yes
      about 9
      'hi'
      1..5
      ```

      ### How the compiler chooses

      This is called **overload resolution**. The compiler looks at the argument types and picks the best match: an exact match beats one that needs a conversion. If two candidates are equally good, the call is **ambiguous** and doesn't compile, and if none fits, you get "no matching function".

      ### Rules

      - The return type alone can't distinguish overloads; the parameters must differ.
      - Overloads should do **the same kind of thing** for different types. If they do unrelated things, give them different names.
      - Beware literals: `describe("hi")` would pick the `bool` overload here, because a string literal converts to a pointer and a pointer converts to `bool` more directly than to `std::string`. That's why the example passes `std::string("hi")`.

      `std::to_string` itself is an overloaded function: it has versions for `int`, `long`, `double` and more.

      **Your turn:** write two overloads of `describe`: one taking an `int` that returns `"int N"`, and one taking a `std::string` that returns `"string S"`. Use `std::to_string(n)` to turn a number into a string.
    seed: |
      #include <string>

      // write both overloads here
    solution: |
      #include <string>

      // write both overloads here
      std::string describe(int n) {
          return "int " + std::to_string(n);
      }

      std::string describe(const std::string& s) {
          return "string " + s;
      }
    harness: |
      int main() {
          CHECK_EQ("describe(42)", describe(42), std::string("int 42"));
          CHECK_EQ("describe(\"ace\")", describe(std::string("ace")), std::string("string ace"));
          CHECK_EQ("describe(-1)", describe(-1), std::string("int -1"));
      }
    hints:
      - "Two functions, both named `describe`, one with `(int n)` and one with `(const std::string& s)`. Both return `std::string`."
      - "`\"int \" + std::to_string(n)`"
    more:
      - task: |
          Write three overloads of `max_of`: for two `int`s, for two `double`s, and for two `std::string`s (the **longer** string, or the first one on a tie).
        seed: |
          #include <string>

          // write the three overloads here
        solution: |
          #include <string>

          // write the three overloads here
          int max_of(int a, int b) {
              return a > b ? a : b;
          }

          double max_of(double a, double b) {
              return a > b ? a : b;
          }

          std::string max_of(const std::string& a, const std::string& b) {
              return b.size() > a.size() ? b : a;
          }
        harness: |
          int main() {
              CHECK_EQ("max_of(3, 7)", max_of(3, 7), 7);
              CHECK_EQ("max_of(2.5, 1.5)", max_of(2.5, 1.5), 2.5);
              CHECK_EQ("longer string", max_of(std::string("nuke"), std::string("inferno")), std::string("inferno"));
              CHECK_EQ("tie keeps the first", max_of(std::string("abc"), std::string("xyz")), std::string("abc"));
          }
        hints:
          - Overloads share a name but have different parameter types. The compiler picks the one that matches the arguments.
        tests: []
      - task: |
          Write two overloads of `repeat`: `std::string repeat(char c, int n)` returns `c` repeated `n` times, and `std::string repeat(const std::string& s, int n)` returns `s` repeated `n` times. `n` of 0 or less gives an empty string.
        seed: |
          #include <string>

          // write both overloads here
        solution: |
          #include <string>

          // write both overloads here
          std::string repeat(char c, int n) {
              std::string out;
              for (int i = 0; i < n; i++) out += c;
              return out;
          }

          std::string repeat(const std::string& s, int n) {
              std::string out;
              for (int i = 0; i < n; i++) out += s;
              return out;
          }
        harness: |
          int main() {
              CHECK_EQ("repeat('x', 3)", repeat('x', 3), std::string("xxx"));
              CHECK_EQ("repeat(\"ab\", 2)", repeat(std::string("ab"), 2), std::string("abab"));
              CHECK_EQ("repeat('-', 0)", repeat('-', 0), std::string(""));
              CHECK_EQ("negative count", repeat(std::string("gg"), -1), std::string(""));
          }
        hints:
          - "`out += c;` and `out += s;` both work on a `std::string`, for a single character or a whole string."
        tests: []

  - title: Default arguments
    id: cpp-refs-5
    text: |
      A parameter can have a **default value** that's used when the caller leaves the argument out:

      ```cpp run
      #include <iostream>
      #include <string>

      std::string repeat(const std::string& s, int times = 2, const std::string& sep = " ") {
          std::string out;
          for (int i = 0; i < times; i++) {
              if (i > 0) out += sep;
              out += s;
          }
          return out;
      }

      int main() {
          std::cout << repeat("go") << "\n";
          std::cout << repeat("go", 3) << "\n";
          std::cout << repeat("go", 3, "-") << "\n";
      }
      ```

      ```output
      go go
      go go go
      go-go-go
      ```

      ### Rules

      - Defaults must be at the **end** of the parameter list. Once one parameter has a default, all the ones after it need defaults too, because arguments are matched left to right: you can't skip the middle one.
      - Put the default in the **declaration** (usually the header), not repeated in the definition.
      - Defaults are filled in at the call site, so `repeat("go")` is compiled as `repeat("go", 2, " ")`.

      Defaults are a lightweight alternative to writing several overloads when the extra parameters are just options with sensible standard values.

      ### Building a string

      `std::string out;` starts empty, and `+=` appends. For padding, `std::string(n, c)` creates a string of `n` copies of the character `c`, which you can then join with `+`. Always handle the case where nothing needs to be added (the input is already long enough).

      **Your turn:** write `std::string pad(const std::string& s, int width, char fill = ' ')` that adds `fill` characters on the **left** until the string is `width` long. Strings already that long are returned unchanged.
    seed: |
      #include <string>

      std::string pad(const std::string& s, int width, char fill = ' ') {

      }
    solution: |
      #include <string>

      std::string pad(const std::string& s, int width, char fill = ' ') {
          std::string out = s;
          while ((int)out.size() < width) {
              out = fill + out;
          }
          return out;
      }
    harness: |
      int main() {
          CHECK_EQ("pad(\"7\", 3, '0')", pad("7", 3, '0'), std::string("007"));
          CHECK_EQ("pad(\"ab\", 5)", pad("ab", 5), std::string("   ab"));
          CHECK_EQ("already wide", pad("hello", 3), std::string("hello"));
          CHECK_EQ("exact width", pad("abc", 3, '*'), std::string("abc"));
      }
    hints:
      - Copy s, then keep adding `fill` to the front while it's shorter than width.
      - "`std::string(count, ch)` builds a string of repeated chars, which is another option."
    more:
      - task: |
          Write `std::string format_money(int amount, char currency = '$')` that puts the currency sign in front: `format_money(800)` is `"$800"` and `format_money(50, 'E')` is `"E50"`.
        seed: |
          #include <string>

          // write format_money here
        solution: |
          #include <string>

          // write format_money here
          std::string format_money(int amount, char currency = '$') {
              return currency + std::to_string(amount);
          }
        harness: |
          int main() {
              CHECK_EQ("format_money(800)", format_money(800), std::string("$800"));
              CHECK_EQ("format_money(50, 'E')", format_money(50, 'E'), std::string("E50"));
              CHECK_EQ("format_money(0)", format_money(0), std::string("$0"));
          }
        hints:
          - The default value goes in the parameter list, `char currency = '$'`.
          - "`currency + std::to_string(amount)` works: a `char` plus a `std::string` makes a new string."
        tests: []
      - task: |
          Write `std::string bar(int value, int max, int width = 10, char full = '#', char empty = '.')` that draws a progress bar `width` characters long. The number of `full` characters is `value * width / max` (rounded down); the rest are `empty`. A value below 0 counts as 0, and above `max` counts as `max`.
        seed: |
          #include <string>

          // write bar here
        solution: |
          #include <string>

          // write bar here
          std::string bar(int value, int max, int width = 10, char full = '#', char empty = '.') {
              if (value < 0) value = 0;
              if (value > max) value = max;
              int filled = value * width / max;
              return std::string(filled, full) + std::string(width - filled, empty);
          }
        harness: |
          int main() {
              CHECK_EQ("bar(50, 100)", bar(50, 100), std::string("#####....."));
              CHECK_EQ("bar(3, 4, 8)", bar(3, 4, 8), std::string("######.."));
              CHECK_EQ("bar(1, 3, 6, '=', '-')", bar(1, 3, 6, '=', '-'), std::string("==----"));
              CHECK_EQ("over max is full", bar(150, 100, 4), std::string("####"));
              CHECK_EQ("negative is empty", bar(-5, 100, 4), std::string("...."));
          }
        hints:
          - Defaults can only be on the last parameters, and callers can leave off any number of them from the right.
          - "`std::string(n, c)` makes a string of `n` copies of `c`."
        tests: []
