id: c-files
title: Files
lang: c
phase: "C: Real-World C"
summary: Read and write real files. fopen modes, fprintf and fscanf, reading lines with fgets, handling errors, appending, safe formatting with snprintf, and a CSV report.
steps:
  - title: Write a file, read it back
    id: c-files-1
    text: |
      Everything a program keeps in variables disappears when it exits. To keep data between runs, or to read data someone else produced, programs use **files**. C's file functions live in `<stdio.h>`, the same header as `printf`.

      The workflow is always the same: **open**, **read or write**, **close**.

      ```c run
      #include <stdio.h>

      int main(void) {
          FILE *f = fopen("todo.txt", "w");
          if (f == NULL) return 1;
          fprintf(f, "buy milk\n");
          fprintf(f, "call %s at %d\n", "Ada", 5);
          fclose(f);

          f = fopen("todo.txt", "r");
          if (f == NULL) return 1;
          int c, lines = 0;
          while ((c = fgetc(f)) != EOF) {
              if (c == '\n') lines++;
          }
          fclose(f);
          printf("%d lines saved\n", lines);
          return 0;
      }
      ```

      ```output
      2 lines saved
      ```

      ### The pieces

      - `fopen(name, mode)` opens a file and returns a `FILE *`, a handle you pass to the other functions. It returns `NULL` if it fails.
      - The **mode** says what you intend: `"r"` read (the file must exist), `"w"` write (creates the file, or **erases** it if it already exists), `"a"` append (adds to the end).
      - `fprintf(f, ...)` works exactly like `printf`, but writes to the file. `fscanf(f, ...)` is `scanf` for files, and `fgetc(f)` reads one character (or returns `EOF` at the end).
      - `fclose(f)` closes the file. Writes are **buffered** (collected in memory and written in chunks for speed), and closing flushes the buffer to disk. Until then, the last writes may still be sitting in memory, so reading the file back before closing it, or a crash, can lose the end of your output. Close every file when you're done with it.

      In fact `printf` is just `fprintf(stdout, ...)`: the screen is treated as a file called `stdout`.

      On this site, each run gets its own private, empty folder, so your program can create and read files freely.

      **Your turn:** open `scores.txt` for writing, then for reading.
    fill: |
      #include <stdio.h>

      int main(void) {
          FILE *out = fopen("scores.txt", [["w"]]);
          fprintf(out, "ace %d\n", 5);
          fprintf(out, "clutch %d\n", 3);
          fclose(out);

          FILE *in = fopen("scores.txt", [["r"]]);
          char word[32];
          int n;
          while (fscanf(in, "%31s %d", word, &n) == 2) {
              printf("%s=%d\n", word, n);
          }
          fclose(in);
          return 0;
      }
    hints:
      - "Writing mode is `\"w\"` and reading mode is `\"r\"`. Include the double quotes: they're strings."
    tests:
      - expect: "ace=5\nclutch=3"

  - title: Reading lines with fgets
    id: c-files-2
    text: |
      Text files are usually processed **line by line**. The safe way to read a line is `fgets`:

      ```c
      char line[256];
      fgets(line, sizeof line, f);
      ```

      It reads characters until the end of the line (and **keeps** the `'\n'`), or until the buffer is full, or until the end of the file. It never writes more than `sizeof line` bytes, so a very long line can't overflow the array; it just arrives in pieces. It returns `NULL` when there's nothing left, which makes it a natural loop condition.

      ```c run
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          FILE *f = fopen("words.txt", "w");
          if (!f) return 1;
          fputs("alpha\nbe\ngamma ray\n", f);
          fclose(f);

          f = fopen("words.txt", "r");
          if (!f) return 1;
          char line[64], shortest[64] = "";
          int count = 0;
          while (fgets(line, sizeof line, f) != NULL) {
              line[strcspn(line, "\n")] = '\0';
              count++;
              if (count == 1 || strlen(line) < strlen(shortest)) {
                  strcpy(shortest, line);
              }
          }
          fclose(f);
          printf("%d lines, shortest: %s\n", count, shortest);
          return 0;
      }
      ```

      ```output
      3 lines, shortest: be
      ```

      ### Removing the newline

      Because `fgets` keeps the `'\n'`, you usually want to cut it off before using the line. `strcspn(line, "\n")` returns the position of the first `'\n'`, or the string's length if there isn't one (for example, a last line without a newline), so `line[strcspn(line, "\n")] = '\0';` removes it safely in every case.

      ### Keeping a copy

      `line` is overwritten by every `fgets` call, so to remember a line (like the longest so far), copy it into a separate array with `strcpy`. Storing a pointer to `line` would just point at whatever was read last.

      **Your turn:** the folder contains `maps.txt`. Print how many lines it has and the longest line (the first one, if there's a tie).
    seed: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          FILE *f = fopen("maps.txt", "r");
          if (f == NULL) {
              printf("cannot open maps.txt\n");
              return 1;
          }
          char line[256], longest[256] = "";
          int count = 0;
          // read every line here

          fclose(f);
          printf("%d lines, longest: %s\n", count, longest);
          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          FILE *f = fopen("maps.txt", "r");
          if (f == NULL) {
              printf("cannot open maps.txt\n");
              return 1;
          }
          char line[256], longest[256] = "";
          int count = 0;
          // read every line here
          while (fgets(line, sizeof line, f) != NULL) {
              line[strcspn(line, "\n")] = '\0';
              count++;
              if (strlen(line) > strlen(longest)) strcpy(longest, line);
          }
          fclose(f);
          printf("%d lines, longest: %s\n", count, longest);
          return 0;
      }
    require:
      - pattern: "fgets\\s*\\("
        message: "Read the file line by line with `fgets`."
    hints:
      - "`while (fgets(line, sizeof line, f) != NULL)` loops over the lines."
      - "Strip the newline with `line[strcspn(line, \"\\n\")] = '\\0';` before measuring."
      - "Use `>` (not `>=`) so the first of equally long lines wins."
    tests:
      - files:
          maps.txt: "dust2\nmirage\ninferno\nnuke\n"
      - files:
          maps.txt: "ancient\nanubis"
      - files:
          maps.txt: "a\nbb\ncc\n"
        hidden: true

  - title: When fopen fails
    id: c-files-3
    text: |
      Files are the first thing in this course that can fail for reasons outside your program: the file doesn't exist, you don't have permission, the disk is full, another program has it locked. Code that works with files must expect failure.

      `fopen` returns `NULL` when it can't open the file, and on common systems it also sets the global `errno` to a code describing why. `perror(message)` prints your message plus a readable description of `errno` to **stderr** (the error output stream):

      ```c
      FILE *f = fopen("config.txt", "r");
      if (f == NULL) {
          perror("config.txt");   /* config.txt: No such file or directory */
          return -1;
      }
      ```

      ### Return an error code

      A function that works with files usually reports failure through its **return value**, with a value that can't be a real result: `-1` for a count, `NULL` for a pointer. The caller checks it and decides what to do.

      ```c run
      #include <stdio.h>

      long file_size(const char *path) {
          FILE *f = fopen(path, "r");
          if (f == NULL) {
              return -1;
          }
          long n = 0;
          while (fgetc(f) != EOF) {
              n++;
          }
          fclose(f);
          return n;
      }

      int main(void) {
          FILE *f = fopen("note.txt", "w");
          if (!f) return 1;
          fputs("hello\n", f);
          fclose(f);
          printf("%ld %ld\n", file_size("note.txt"), file_size("missing.txt"));
          return 0;
      }
      ```

      ```output
      6 -1
      ```

      ### Close on every path

      Every successful `fopen` needs exactly one `fclose`, including on early returns after later errors. Operating systems limit how many files a program can have open, so leaked handles eventually make `fopen` fail. A tidy structure is: open, check, do the work, close, then return.

      `fgetc` returns an `int`, not a `char`, because it must be able to return every possible byte value **plus** the special `EOF` value. Store it in an `int` before comparing with `EOF`.

      **Your turn:** write `long count_lines(const char *path)` that returns the number of `'\n'` characters in the file, or `-1` if it can't be opened. Read with `fgetc`, which returns one character at a time, or `EOF` at the end.
    seed: |
      #include <stdio.h>

      long count_lines(const char *path) {

      }
    solution: |
      #include <stdio.h>

      long count_lines(const char *path) {
          FILE *f = fopen(path, "r");
          if (f == NULL) return -1;
          long n = 0;
          int c;
          while ((c = fgetc(f)) != EOF) {
              if (c == '\n') n++;
          }
          fclose(f);
          return n;
      }
    harness: |
      int main(void) {
          CHECK_INT("three lines", count_lines("round.log"), 3);
          CHECK_INT("empty file", count_lines("empty.txt"), 0);
          CHECK_INT("missing file", count_lines("nope.txt"), -1);
          CHECK_INT("count again (was the file closed?)", count_lines("round.log"), 3);
          return 0;
      }
    tests:
      - files:
          round.log: "freeze time\nbuy\nlive\n"
          empty.txt: ""
    hints:
      - "Open with `fopen(path, \"r\")` and return -1 if it's NULL."
      - "Store fgetc's result in an **int**, not a char, so EOF can be told apart from a real byte: `int c; while ((c = fgetc(f)) != EOF)`."
      - "Don't forget `fclose(f);` before returning the count."

  - title: Loading records
    id: c-files-4
    text: |
      Much of the world's data lives in simple text formats: one **record** per line, with fields separated by spaces or commas. Loading such a file into an array of structs is a very common task.

      `fscanf` reads fields directly into variables, and like `scanf` it **returns how many fields it matched**. Comparing that with the number you asked for tells you when to stop: at the end of the file it returns `EOF`, and on a malformed line it returns fewer.

      ```c run
      #include <stdio.h>

      typedef struct {
          char item[24];
          int qty;
          double price;
      } Line;

      int main(void) {
          FILE *f = fopen("order.txt", "w");
          if (!f) return 1;
          fputs("pen 3 1.50\nnotebook 2 4.25\nstapler 1 9.99\n", f);
          fclose(f);

          Line lines[10];
          int n = 0;
          f = fopen("order.txt", "r");
          if (!f) return 1;
          while (n < 10 && fscanf(f, "%23s %d %lf", lines[n].item, &lines[n].qty, &lines[n].price) == 3) {
              n++;
          }
          fclose(f);
          double total = 0;
          for (int i = 0; i < n; i++) {
              total += lines[i].qty * lines[i].price;
          }
          printf("%d lines, total %.2f\n", n, total);
          return 0;
      }
      ```

      ```output
      3 lines, total 22.99
      ```

      ### Details that make it robust

      - `n < 10 &&` comes **first** in the condition, so the program never reads a record into a slot past the end of the array. (`&&` stops early when the left side is false.)
      - `%23s` limits the name to fit the 24-byte array with its terminator.
      - Only after a successful read (all 3 fields) is `n` incremented, so a bad line doesn't create a half-filled record.
      - Handle an **empty file**: `n` stays 0, and code that divides by `n` or reads `lines[0]` must check first.

      **Your turn:** `roster.txt` holds `name score` pairs. Load them into the array (at most 32) and print the player with the highest score, then the average score with one decimal place.
    seed: |
      #include <stdio.h>

      typedef struct {
          char name[32];
          int score;
      } Player;

      int main(void) {
          Player team[32];
          int n = 0;
          FILE *f = fopen("roster.txt", "r");
          if (f == NULL) return 1;
          // load up to 32 players

          fclose(f);
          if (n == 0) {
              printf("no players\n");
              return 0;
          }
          // print "best NAME SCORE" and "average X.X"

          return 0;
      }
    solution: |
      #include <stdio.h>

      typedef struct {
          char name[32];
          int score;
      } Player;

      int main(void) {
          Player team[32];
          int n = 0;
          FILE *f = fopen("roster.txt", "r");
          if (f == NULL) return 1;
          // load up to 32 players
          while (n < 32 && fscanf(f, "%31s %d", team[n].name, &team[n].score) == 2) n++;
          fclose(f);
          if (n == 0) {
              printf("no players\n");
              return 0;
          }
          // print "best NAME SCORE" and "average X.X"
          int best = 0;
          long total = 0;
          for (int i = 0; i < n; i++) {
              if (team[i].score > team[best].score) best = i;
              total += team[i].score;
          }
          printf("best %s %d\n", team[best].name, team[best].score);
          printf("average %.1f\n", (double)total / n);
          return 0;
      }
    hints:
      - "`while (n < 32 && fscanf(f, \"%31s %d\", team[n].name, &team[n].score) == 2) n++;`"
      - "Track the index of the best player and a running total while looping."
      - "Divide as doubles for the average: `(double)total / n`, printed with `%.1f`."
    tests:
      - files:
          roster.txt: "karrigan 12\nropz 25\nbroky 19\n"
      - files:
          roster.txt: ""
      - files:
          roster.txt: "solo 7\n"
        hidden: true

  - title: Appending
    id: c-files-5
    text: |
      Opening a file with `"w"` erases whatever was in it. When you want to **add** to a file instead, like a log that grows over time, use `"a"` (append): the file is created if it doesn't exist, and every write goes to the end, keeping the existing contents.

      ```c run
      #include <stdio.h>

      int log_event(const char *path, const char *event, int value) {
          FILE *f = fopen(path, "a");
          if (f == NULL) {
              return -1;
          }
          fprintf(f, "%s=%d\n", event, value);
          fclose(f);
          return 0;
      }

      int main(void) {
          log_event("events.log", "start", 1);
          log_event("events.log", "score", 40);
          log_event("events.log", "end", 1);
          FILE *f = fopen("events.log", "r");
          if (!f) return 1;
          char line[64];
          while (fgets(line, sizeof line, f)) {
              fputs(line, stdout);
          }
          fclose(f);
          return 0;
      }
      ```

      ```output
      start=1
      score=40
      end=1
      ```

      Each call opens, appends one line, and closes. Three calls, three lines, none lost. With `"w"` only the last line would survive.

      `fputs(s, f)` writes a string as is (no formatting and no added newline). Writing to `stdout` sends it to the screen.

      ### Other modes

      | Mode | Meaning |
      |---|---|
      | `"r+"` | read and write an existing file |
      | `"w+"` | read and write, creating or emptying the file |
      | `"rb"`, `"wb"`, `"ab"` | binary versions: no newline translation (matters on Windows, and for non-text data) |

      Choosing the wrong mode is a classic data-loss bug: opening an important file with `"w"` "just to read it" empties it instantly.

      **Your turn:** write `int append_line(const char *path, const char *line)` that appends `line` plus a newline. Return 0 on success and -1 if the file can't be opened.
    seed: |
      #include <stdio.h>

      int append_line(const char *path, const char *line) {

      }
    solution: |
      #include <stdio.h>

      int append_line(const char *path, const char *line) {
          FILE *f = fopen(path, "a");
          if (f == NULL) return -1;
          fprintf(f, "%s\n", line);
          fclose(f);
          return 0;
      }
    harness: |
      #include <string.h>
      static void slurp(const char *path, char *buf, size_t size) {
          FILE *f = fopen(path, "r");
          size_t n = f ? fread(buf, 1, size - 1, f) : 0;
          buf[n] = '\0';
          if (f) fclose(f);
      }
      int main(void) {
          char buf[256];
          CHECK_INT("append to existing file", append_line("match.log", "round 2"), 0);
          append_line("match.log", "round 3");
          slurp("match.log", buf, sizeof buf);
          CHECK_STR("old lines kept, new lines at the end", buf, "round 1\nround 2\nround 3\n");
          append_line("new.log", "first");
          slurp("new.log", buf, sizeof buf);
          CHECK_STR("creates a missing file", buf, "first\n");
          CHECK_INT("a folder path can't be opened", append_line("no/such/dir/x.log", "x"), -1);
          return 0;
      }
    tests:
      - files:
          match.log: "round 1\n"
    hints:
      - "Open with mode `\"a\"`, check for NULL, write with `fprintf(f, \"%s\\n\", line);`, then fclose."

  - title: Safe formatting with snprintf
    id: c-files-6
    text: |
      `sprintf(buf, format, ...)` works like `printf` but writes into a char array. The problem: it has no idea how big `buf` is, so a long name or a big number can write past the end. That exact bug has caused countless security holes.

      `snprintf` takes the buffer size as its second argument and **never writes more than that**, always ending with a `'\0'` (as long as the size isn't 0):

      ```c run
      #include <stdio.h>

      int main(void) {
          volatile int score = 12345;
          char small[8];
          int needed = snprintf(small, sizeof small, "score=%d", score);
          printf("[%s] needed %d\n", small, needed);
          char big[32];
          needed = snprintf(big, sizeof big, "score=%d", score);
          printf("[%s] needed %d\n", big, needed);
          return 0;
      }
      ```

      ```output
      [score=1] needed 11
      [score=12345] needed 11
      ```

      (`volatile` just stops the compiler from working out the value in advance and warning about the truncation we're demonstrating on purpose.)

      ### Detecting truncation

      The return value is the length the **full** output would have had (not counting the terminator), whether or not it fit. So:

      - If `needed >= size`, the output was cut off (truncated). In the first call, 11 characters didn't fit in 8 bytes, so only 7 were kept plus the `'\0'`.
      - If `needed < 0`, an encoding error happened (rare).

      A careful function reports truncation to its caller instead of silently producing a clipped string. Since `needed` is an `int` and `size` a `size_t`, compare them as `(size_t)needed >= size` after checking `needed` isn't negative.

      Use `snprintf` for all formatting into buffers; there's no good reason to use `sprintf` in new code.

      **Your turn:** write `int format_kd(char *buf, size_t size, const char *name, int kills, int deaths)` that writes `NAME K/D` (like `ropz 25/12`). Return 0 if it fit, -1 if it was truncated.
    seed: |
      #include <stdio.h>

      int format_kd(char *buf, size_t size, const char *name, int kills, int deaths) {

      }
    solution: |
      #include <stdio.h>

      int format_kd(char *buf, size_t size, const char *name, int kills, int deaths) {
          int needed = snprintf(buf, size, "%s %d/%d", name, kills, deaths);
          if (needed < 0 || (size_t)needed >= size) return -1;
          return 0;
      }
    forbid:
      - pattern: "\\bsprintf\\s*\\("
        message: "Use `snprintf` with the buffer size, never plain `sprintf`."
    harness: |
      int main(void) {
          char buf[16];
          CHECK_INT("fits", format_kd(buf, sizeof buf, "ropz", 25, 12), 0);
          CHECK_STR("text", buf, "ropz 25/12");
          char small[8];
          CHECK_INT("too long is reported", format_kd(small, sizeof small, "karrigan", 3, 20), -1);
          CHECK_STR("truncated but terminated", small, "karriga");
          char exact[11];
          CHECK_INT("exactly fits with the terminator", format_kd(exact, sizeof exact, "ropz", 25, 12), 0);
          return 0;
      }
    hints:
      - "`int needed = snprintf(buf, size, \"%s %d/%d\", name, kills, deaths);`"
      - "It was truncated when `needed >= size` (compare as size_t after checking needed isn't negative)."

  - title: Binary files
    id: c-files-8
    text: |
      So far every file has been **text**: `fprintf(f, "%d", 1234)` writes the characters `1`, `2`, `3`, `4`. A **binary** file stores the raw bytes of values exactly as they sit in memory instead: an `int` is always 4 bytes (on this site), whatever its value. Binary files are smaller, faster to read and write, and let you jump straight to the 1,000th record without reading the 999 before it. Images, audio, databases and save games are binary.

      ```c run
      #include <stdio.h>

      struct Score {
          char name[16];
          int points;
      };

      int main(void) {
          struct Score out[3] = {{"ada", 90}, {"linus", 75}, {"grace", 88}};
          FILE *f = fopen("scores.bin", "wb");
          if (f == NULL) return 1;
          size_t written = fwrite(out, sizeof out[0], 3, f);
          fclose(f);

          f = fopen("scores.bin", "rb");
          if (f == NULL) return 1;
          fseek(f, 0, SEEK_END);
          long bytes = ftell(f);                       /* position at the end = the file's size */
          fseek(f, sizeof(struct Score), SEEK_SET);    /* jump straight to record 1 */
          struct Score s;
          size_t got = fread(&s, sizeof s, 1, f);
          fclose(f);

          printf("wrote %zu records, %ld bytes\n", written, bytes);
          printf("record 1: %s %d (read %zu)\n", s.name, s.points, got);
          return 0;
      }
      ```

      ```output
      wrote 3 records, 60 bytes
      record 1: linus 75 (read 1)
      ```

      ### How it works

      - The modes `"wb"` and `"rb"` add `b` for binary. On Linux and macOS it makes no difference, but on Windows text mode translates line endings, which would corrupt binary data, so always include it for binary files.
      - `fwrite(pointer, size, count, f)` writes `count` items of `size` bytes each, starting at `pointer`, and returns how many items it wrote. Here that's 3 records of 20 bytes, 60 bytes in total.
      - `fread(pointer, size, count, f)` is the reverse. It returns how many **complete** items it read, which is less than `count` at the end of the file or on an error, so check it.
      - `fseek(f, offset, from)` moves the read/write position: from the start (`SEEK_SET`), the current position (`SEEK_CUR`) or the end (`SEEK_END`). `ftell(f)` reports the current position. Seeking to the end and asking `ftell` is a common way to get a file's size.
      - Because every record has the same size, record `i` starts at byte `i * sizeof(struct Score)`. That's **random access**: reading one record costs the same no matter how big the file is.

      ### Raw bytes aren't portable

      Writing a struct's bytes directly is fine for a file your own program reads back on the same machine. It's **not** a safe file format for anything else:

      - Another compiler or machine may lay out the struct differently (**padding** between members), use a different size for `int`, or store multi-byte numbers in the opposite byte order (**endianness**).
      - Never write pointers. An address means nothing in another run of the program.

      Real file formats (PNG, ZIP, databases) define the exact size, order and byte order of every field, and programs write them field by field using fixed-size types like `uint32_t` (from `<stdint.h>`, covered in the integer types module).

      **Your turn:** write three functions for a file of raw `int`s. `save_ints` writes `n` values and returns 0, or -1 if the file can't be opened or not everything was written. `load_ints` reads up to `max` values into `out` and returns how many it read, or -1 if the file can't be opened. `read_at` reads the value at position `index` into `*out` and returns 1, returns 0 if there's no value there, or -1 if the file can't be opened.
    seed: |
      #include <stdio.h>

      int save_ints(const char *path, const int *a, int n) {

      }

      int load_ints(const char *path, int *out, int max) {

      }

      int read_at(const char *path, int index, int *out) {

      }
    solution: |
      #include <stdio.h>

      int save_ints(const char *path, const int *a, int n) {
          FILE *f = fopen(path, "wb");
          if (f == NULL) return -1;
          size_t written = fwrite(a, sizeof a[0], (size_t)n, f);
          fclose(f);
          return written == (size_t)n ? 0 : -1;
      }

      int load_ints(const char *path, int *out, int max) {
          FILE *f = fopen(path, "rb");
          if (f == NULL) return -1;
          size_t got = fread(out, sizeof out[0], (size_t)max, f);
          fclose(f);
          return (int)got;
      }

      int read_at(const char *path, int index, int *out) {
          FILE *f = fopen(path, "rb");
          if (f == NULL) return -1;
          int ok = fseek(f, (long)index * (long)sizeof(int), SEEK_SET) == 0 && fread(out, sizeof *out, 1, f) == 1;
          fclose(f);
          return ok ? 1 : 0;
      }
    require:
      - pattern: "fwrite"
        message: Write the values with fwrite, as raw bytes.
      - pattern: "fread"
        message: Read the values back with fread.
      - pattern: "fseek"
        message: read_at should jump straight to the value with fseek instead of reading everything before it.
    harness: |
      int main(void) {
          int a[4] = {5, -2, 99, 7};
          CHECK_INT("save 4 values", save_ints("nums.bin", a, 4), 0);
          int out[10] = {0};
          CHECK_INT("load reads all 4", load_ints("nums.bin", out, 10), 4);
          CHECK("values come back unchanged", out[0] == 5 && out[1] == -2 && out[2] == 99 && out[3] == 7);
          int two[2] = {0};
          CHECK_INT("load stops at max", load_ints("nums.bin", two, 2), 2);
          CHECK_INT("load of a missing file", load_ints("missing.bin", out, 10), -1);
          int v = 0;
          CHECK_INT("read_at 2 finds a value", read_at("nums.bin", 2, &v), 1);
          CHECK_INT("read_at 2 is 99", v, 99);
          CHECK_INT("read_at 3 is the last one", read_at("nums.bin", 3, &v) == 1 && v == 7, 1);
          CHECK_INT("read_at past the end", read_at("nums.bin", 4, &v), 0);
          CHECK_INT("read_at on a missing file", read_at("missing.bin", 0, &v), -1);
          return 0;
      }
    hints:
      - "save_ints: open with `\"wb\"`, `fwrite(a, sizeof a[0], n, f)`, close, and return 0 only if fwrite reported all `n` items."
      - "load_ints: open with `\"rb\"`, and fread's return value is exactly the count to return."
      - "read_at: `fseek(f, (long)index * sizeof(int), SEEK_SET)`, then `fread(out, sizeof *out, 1, f) == 1` tells you whether a value was there."

  - title: "Challenge: a CSV report"
    id: c-files-7
    text: |
      This challenge is a realistic batch job: read a data file, aggregate it, write a report file. It combines files, strings, arrays of structs and parsing.

      ### CSV

      A **CSV** (comma-separated values) file stores a table as text: one row per line, fields separated by commas, often with a header line naming the columns. Spreadsheets and databases export it everywhere.

      ### Parsing a line with sscanf

      `sscanf` is `scanf` reading from a **string** instead of input, perfect for parsing a line you already read with `fgets`. The format `%15[^,]` is a **scan set**: it reads up to 15 characters that are **not** commas, which is how you grab a text field that ends at a comma.

      ```c run
      #include <stdio.h>

      int main(void) {
          const char *rows[] = {"apples,12", "pears,7", "bad row"};
          for (int i = 0; i < 3; i++) {
              char name[16];
              int count;
              if (sscanf(rows[i], "%15[^,],%d", name, &count) == 2) {
                  printf("%s -> %d\n", name, count);
              } else {
                  printf("skipped: %s\n", rows[i]);
              }
          }
          return 0;
      }
      ```

      ```output
      apples -> 12
      pears -> 7
      skipped: bad row
      ```

      ### Aggregating by key

      To total amounts per region, keep an array of `{name, total}` structs and a count. For each row, search the array for the region with `strcmp`; if it's there, add to its total; if not, append a new entry. Appending new keys at the end keeps them in the order they first appeared.

      ### Plan it

      1. Open the input; skip the header with one `fgets`.
      2. For each line: parse, find or add the region, add the amount.
      3. Open `report.txt` for writing, write one line per region, close it.
      4. Reopen it for reading and print each line.

      Check every `fopen`, and close every file.

      **Your turn:**

      `sales.csv` starts with a header line, then `region,amount` rows (amounts are whole dollars).

      1. Skip the header, then total the amounts per region (at most 10 regions, names up to 15 characters), keeping regions in the order they first appear.
      2. Write `report.txt` with one `REGION TOTAL` line per region.
      3. Then read `report.txt` back and print it, so the test can see what you wrote.

      Tip: `sscanf(line, "%15[^,],%d", region, &amount)` reads everything up to the comma as the region, then the number.
    seed: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {

          return 0;
      }
    solution: |
      #include <stdio.h>
      #include <string.h>

      int main(void) {
          char names[10][16];
          long totals[10];
          int n = 0;
          FILE *in = fopen("sales.csv", "r");
          if (in == NULL) {
              printf("cannot open sales.csv\n");
              return 1;
          }
          char line[128];
          fgets(line, sizeof line, in); /* header */
          while (fgets(line, sizeof line, in) != NULL) {
              char region[16];
              int amount;
              if (sscanf(line, "%15[^,],%d", region, &amount) != 2) continue;
              int i = 0;
              while (i < n && strcmp(names[i], region) != 0) i++;
              if (i == n) {
                  if (n == 10) continue;
                  strcpy(names[n], region);
                  totals[n] = 0;
                  n++;
              }
              totals[i] += amount;
          }
          fclose(in);

          FILE *out = fopen("report.txt", "w");
          if (out == NULL) return 1;
          for (int i = 0; i < n; i++) fprintf(out, "%s %ld\n", names[i], totals[i]);
          fclose(out);

          FILE *back = fopen("report.txt", "r");
          if (back == NULL) return 1;
          while (fgets(line, sizeof line, back) != NULL) fputs(line, stdout);
          fclose(back);
          return 0;
      }
    require:
      - pattern: "fopen[\\s\\S]*fopen[\\s\\S]*fopen"
        message: "Write the results to `report.txt` (opened with mode \"w\"), then read that file back to print it."
    hints:
      - "Keep two parallel arrays: `char names[10][16]` and `long totals[10]`, plus a count."
      - "For each row, search names for the region. If it's new, add it with a total of 0. Then add the amount."
      - "Read the header once with `fgets` before the loop so it isn't counted."
      - "After writing and closing report.txt, reopen it with \"r\" and copy each line to stdout with `fputs`."
    tests:
      - files:
          sales.csv: "region,amount

            eu,100

            na,250

            eu,40

            asia,75

            na,5\n"
      - files:
          sales.csv: "region,amount\n"
        allowEmpty: true
      - files:
          sales.csv: "region,amount

            cis,1

            cis,2

            cis,3

            br,10\n"
        hidden: true
