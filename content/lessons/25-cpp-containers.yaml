id: cpp-containers
title: map, set and friends
lang: cpp
phase: "C++: Standard Library"
summary: Associative containers (map, set, unordered_map), pairs, and the stack and queue adapters.
steps:
  - title: std::map
    id: cpp-containers-1
    text: |
      A vector finds things by **position**: element 0, element 1, and so on. Often you want to find things by a **name** instead: the score for "ropz", the price of "awp", the phone number for "Ada". That's what a **map** is for. `std::map<Key, Value>` stores key/value pairs, keeps them **sorted by key**, and never holds the same key twice.

      ```cpp run
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, int> stock;
          stock["apple"] = 5;
          stock["pear"] = 2;
          stock["apple"] += 3;        // the key exists, so this updates it
          stock["kiwi"]++;            // the key is new, so it starts at 0, then becomes 1
          std::cout << stock.size() << " kinds\n";
          for (const auto& [fruit, n] : stock) {
              std::cout << fruit << ": " << n << "\n";
          }
      }
      ```

      ```output
      3 kinds
      apple: 8
      kiwi: 1
      pear: 2
      ```

      ### How it works

      - `m[key]` gives you a **reference** to the value for `key`. If the key isn't there yet, `[]` first inserts it with a default value: `0` for numbers, `""` for strings. That's why `stock["kiwi"]++` works on a brand new key.
      - Looping over a map visits the entries **in key order** (alphabetical for strings, ascending for numbers), no matter what order you inserted them in.
      - Each entry is a `std::pair<const Key, Value>`. `const auto& [fruit, n]` is a **structured binding**: it unpacks the pair into two named variables. Without it you'd write `entry.first` and `entry.second`.
      - A map is a balanced binary search tree inside, so insert and lookup take O(log n) steps.

      ### The counting pattern

      "How many times does each thing appear?" is one of the most common jobs in programming, and a map makes it one line: `count[thing]++`. Missing keys start at 0 automatically.

      ### Common mistakes

      - Writing `for (auto [k, v] : m)` copies every entry. Use `const auto&` to read without copying.
      - Forgetting that a map keeps only one value per key. Assigning to an existing key replaces the old value.

      **Your turn:** count how many times each word appears in the input and print `word count` lines in alphabetical order.
    seed: |
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, int> count;
          std::string w;
          while (std::cin >> w) {

          }

      }
    solution: |
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, int> count;
          std::string w;
          while (std::cin >> w) {
              count[w]++;
          }
          for (const auto& [word, n] : count) {
              std::cout << word << " " << n << "\n";
          }
      }
    hints:
      - "Inside the loop: `count[w]++;`"
      - "After the loop, iterate with `for (const auto& [word, n] : count)` and print."
    tests:
      - stdin: "rush b rush a b b\n"
      - stdin: "solo\n"
      - stdin: "eco force eco full full full eco\n"
        hidden: true

  - title: Look up without inserting
    id: cpp-containers-2
    text: |
      There's a trap in `m[key]`: it **inserts** the key when it's missing. If you only wanted to *check* a price, you've just added a bogus item with price 0. For a pure lookup, use `find` or `contains`.

      ```cpp run
      #include <iostream>
      #include <map>
      #include <string>

      int main() {
          std::map<std::string, std::string> capital = {{"France", "Paris"}, {"Japan", "Tokyo"}};

          auto it = capital.find("Japan");
          if (it != capital.end()) {
              std::cout << it->first << " -> " << it->second << "\n";
          }
          if (!capital.contains("Peru")) {
              std::cout << "no entry for Peru\n";
          }
          std::cout << capital.size() << " entries\n";

          std::string oops = capital["Chile"];    // inserts "Chile" with an empty string
          std::cout << capital.size() << " entries after using []\n";
      }
      ```

      ```output
      Japan -> Tokyo
      no entry for Peru
      2 entries
      3 entries after using []
      ```

      ### How it works

      - `m.find(key)` returns an **iterator** to the entry, or `m.end()` if the key isn't there. Always compare with `end()` before using the result.
      - The iterator points at a pair: `it->first` is the key, `it->second` is the value.
      - `m.contains(key)` (C++20) just answers yes or no. Use it when you don't need the value.
      - `m.count(key)` returns 0 or 1 for a map and works in older C++ too.

      ### Why const matters here

      When a function takes `const std::map<...>&`, it promises not to change the map. Since `[]` might insert, the compiler **won't let you** call it on a const map. That's a helpful error: it forces you to use `find`.

      ### Common mistakes

      - Using `it->second` without checking `it != m.end()`. Dereferencing `end()` is undefined behavior.
      - Using `m[key]` in an `if` to test whether something exists. The test itself creates the entry.

      **Your turn:** write `int price_of(const std::map<std::string, int>& prices, const std::string& item)` that returns the price, or `-1` if the item isn't in the map. (The map is `const`, so `[]` isn't even allowed.)
    seed: |
      #include <map>
      #include <string>

      int price_of(const std::map<std::string, int>& prices, const std::string& item) {

      }
    solution: |
      #include <map>
      #include <string>

      int price_of(const std::map<std::string, int>& prices, const std::string& item) {
          auto it = prices.find(item);
          if (it == prices.end()) return -1;
          return it->second;
      }
    harness: |
      int main() {
          std::map<std::string, int> p = {{"ak47", 2700}, {"awp", 4750}, {"deagle", 700}};
          CHECK_EQ("awp", price_of(p, "awp"), 4750);
          CHECK_EQ("deagle", price_of(p, "deagle"), 700);
          CHECK_EQ("missing", price_of(p, "negev"), -1);
          CHECK_EQ("map unchanged", p.size(), 3);
      }
    hints:
      - "`auto it = prices.find(item);`"
      - "`it == prices.end()` means not found. Otherwise the value is `it->second`."

  - title: std::set
    id: cpp-containers-3
    text: |
      A **set** is a map with keys but no values. `std::set<T>` holds **unique** values in **sorted** order. Inserting something that's already there does nothing, which makes a set the natural tool for "remove duplicates" and "have I seen this before?".

      ```cpp run
      #include <iostream>
      #include <set>
      #include <vector>

      int main() {
          std::vector<int> rolls = {4, 2, 6, 2, 4, 4, 1};
          std::set<int> seen(rolls.begin(), rolls.end());   // build from a range
          seen.insert(6);                                    // already there: no change
          seen.insert(3);

          for (int x : seen) std::cout << x << " ";
          std::cout << "\n" << seen.size() << " distinct, has 5? " << seen.contains(5) << "\n";

          std::vector<int> back(seen.begin(), seen.end());  // and back to a vector
          std::cout << "smallest " << back.front() << ", largest " << back.back() << "\n";
      }
      ```

      ```output
      1 2 3 4 6 
      5 distinct, has 5? 0
      smallest 1, largest 6
      ```

      ### How it works

      - Containers can be built from **any range** given as two iterators: `std::set<int> s(v.begin(), v.end())` inserts every element of `v`. The same trick turns a set back into a vector.
      - Iterating a set always goes in sorted order.
      - `insert` returns a pair whose `.second` is `true` if the value was new. That lets you detect duplicates as you go:

      ```cpp
      if (!seen.insert(x).second) { /* x was a duplicate */ }
      ```

      - Like `map`, a set is a balanced tree: insert, erase and lookup are O(log n).

      ### Common mistakes

      - Trying to change an element in place. Set elements are `const`, because changing one could break the sorted order. Erase it and insert the new value instead.
      - Using a set when you need to keep duplicates. That's `std::multiset`, or just a sorted vector.

      **Your turn:** write `std::vector<std::string> unique_sorted(const std::vector<std::string>& v)` that returns the distinct strings in sorted order.
    seed: |
      #include <set>
      #include <string>
      #include <vector>

      std::vector<std::string> unique_sorted(const std::vector<std::string>& v) {

      }
    solution: |
      #include <set>
      #include <string>
      #include <vector>

      std::vector<std::string> unique_sorted(const std::vector<std::string>& v) {
          std::set<std::string> s(v.begin(), v.end());
          return std::vector<std::string>(s.begin(), s.end());
      }
    harness: |
      int main() {
          using V = std::vector<std::string>;
          CHECK_EQ("maps", unique_sorted({"nuke", "inferno", "nuke", "ancient", "inferno"}), V{"ancient", "inferno", "nuke"});
          CHECK_EQ("empty", unique_sorted({}), V{});
          CHECK_EQ("one", unique_sorted({"x"}), V{"x"});
      }
    hints:
      - Construct a set from the vector's range to deduplicate and sort.
      - "Then build a vector from the set's range: `std::vector<std::string>(s.begin(), s.end())`."

  - title: unordered_map
    id: cpp-containers-4
    text: |
      `std::unordered_map` has the same interface as `std::map` (`[]`, `find`, `contains`, `insert`, `erase`), but it's built on a **hash table** instead of a tree. The trade:

      | Property | `std::map` | `std::unordered_map` |
      |---|---|---|
      | Order when looping | sorted by key | no useful order |
      | Lookup cost | O(log n) | O(1) on average |
      | Key needs | `<` comparison | a hash function |

      When you don't care about order, `unordered_map` is usually faster. The classic use is **remembering what you've seen** so you don't have to search again.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <unordered_map>
      #include <vector>

      // Index of the first repeated word, or -1.
      int first_repeat(const std::vector<std::string>& words) {
          std::unordered_map<std::string, int> first_seen;   // word -> index where it appeared
          for (int i = 0; i < (int)words.size(); i++) {
              auto it = first_seen.find(words[i]);
              if (it != first_seen.end()) {
                  std::cout << "'" << words[i] << "' first seen at " << it->second << "\n";
                  return i;
              }
              first_seen[words[i]] = i;
          }
          return -1;
      }

      int main() {
          std::cout << first_repeat({"red", "green", "blue", "green", "red"}) << "\n";
          std::cout << first_repeat({"a", "b", "c"}) << "\n";
      }
      ```

      ```output
      'green' first seen at 1
      3
      -1
      ```

      ### Why this is fast

      The naive way to find a repeat compares every pair of words: about n * n / 2 comparisons. With a hash map, each word is checked and stored once, so the whole scan is O(n). Trading a little memory for a lot of speed is one of the most important ideas in algorithms, and the "one pass with a hash map" pattern solves a huge number of interview problems.

      ### The order of the check matters

      Notice the loop **looks up first, then inserts**. If it inserted first, every word would immediately "find itself". The same care applies to your exercise: check for the partner before storing the current element, so an element is never paired with itself.

      **Your turn:** write `std::pair<int, int> two_sum(const std::vector<int>& v, int target)` that returns the indexes `{i, j}` (with `i < j`) of two numbers adding up to `target`, or `{-1, -1}`. Do it in one pass: for each element, check whether `target - v[j]` was seen before.
    seed: |
      #include <unordered_map>
      #include <utility>
      #include <vector>

      std::pair<int, int> two_sum(const std::vector<int>& v, int target) {

      }
    solution: |
      #include <unordered_map>
      #include <utility>
      #include <vector>

      std::pair<int, int> two_sum(const std::vector<int>& v, int target) {
          std::unordered_map<int, int> seen;
          for (int j = 0; j < (int)v.size(); j++) {
              auto it = seen.find(target - v[j]);
              if (it != seen.end()) return {it->second, j};
              seen[v[j]] = j;
          }
          return {-1, -1};
      }
    harness: |
      int main() {
          auto a = two_sum({2, 7, 11, 15}, 9);
          CHECK("2+7=9 -> {0,1}", a.first == 0 && a.second == 1);
          auto b = two_sum({3, 2, 4}, 6);
          CHECK("2+4=6 -> {1,2}", b.first == 1 && b.second == 2);
          auto c = two_sum({1, 2, 3}, 100);
          CHECK("none -> {-1,-1}", c.first == -1 && c.second == -1);
          auto d = two_sum({5, 5}, 10);
          CHECK("5+5 -> {0,1}", d.first == 0 && d.second == 1);
      }
    hints:
      - Map each value to its index as you go.
      - "Before storing v[j], check `seen.find(target - v[j])`. If found, return `{that index, j}`."

  - title: pair and tuple
    id: cpp-containers-5
    text: |
      Sometimes a function needs to return two things, like a minimum and a maximum, or a name and a score. You could make a struct, but for quick jobs the standard library has ready-made ones:

      - `std::pair<A, B>` holds two values, called `.first` and `.second`.
      - `std::tuple<A, B, C, ...>` holds any number of values. You get element `i` with `std::get<i>(t)`.

      **Structured bindings** unpack either one into named variables in a single line.

      ```cpp run
      #include <iostream>
      #include <string>
      #include <tuple>
      #include <utility>

      std::pair<int, int> div_mod(int a, int b) {
          return {a / b, a % b};          // braces build the pair
      }

      std::tuple<std::string, int, double> profile() {
          return {"ada", 36, 1.65};
      }

      int main() {
          auto [q, r] = div_mod(17, 5);
          std::cout << q << " remainder " << r << "\n";

          std::pair<std::string, int> item = {"shield", 1000};
          item.second -= 250;
          std::cout << item.first << " costs " << item.second << "\n";

          auto [name, age, height] = profile();
          std::cout << name << " " << age << " " << height << "\n";
          std::cout << std::get<1>(profile()) << "\n";
      }
      ```

      ```output
      3 remainder 2
      shield costs 750
      ada 36 1.65
      36
      ```

      ### How it works

      - `return {a / b, a % b};` builds the return type from the braces, so you don't have to repeat `std::pair<int, int>`.
      - `auto [q, r] = ...;` declares two new variables. You must use `auto` here: structured bindings can't name the types one by one.
      - The number of names must match the number of elements exactly.

      ### When to use a struct instead

      `.first` and `.second` say nothing about what the values mean. If a pair travels far through your code, a small `struct` with real field names (`name`, `score`) is easier to read. Pairs and tuples are best for short-lived results that get unpacked right away.

      **Your turn:** fill in the blanks.
    fill: |
      #include <iostream>
      #include <string>
      #include <utility>

      std::pair<int, int> minmax_of(int a, int b) {
          if (a < b) return {a, b};
          return {b, a};
      }

      int main() {
          [[auto]] [lo, hi] = minmax_of(9, 4);
          std::pair<std::string, int> p = {"awp", 4750};
          std::cout << lo << " " << hi << " " << p.[[first]] << " " << p.[[second]] << "\n";
      }
    hints:
      - Structured bindings start with `auto`.
      - A pair's members are `first` and `second`.
    tests:
      - expect: "4 9 awp 4750"

  - title: "Challenge: balanced brackets"
    id: cpp-containers-6
    text: |
      Besides the main containers, the standard library has **adapters**: `std::stack`, `std::queue` and `std::priority_queue`. They wrap another container and allow only a few operations, which makes your intent clear.

      A **stack** is last in, first out, like a pile of plates: you only touch the top.

      | Operation | Meaning |
      |---|---|
      | `push(x)` | put `x` on top |
      | `top()` | look at the top element |
      | `pop()` | remove the top element (returns nothing) |
      | `empty()`, `size()` | as usual |

      Here a stack evaluates arithmetic written in **postfix** (reverse Polish) notation, where `3 4 + 2 *` means `(3 + 4) * 2`:

      ```cpp run
      #include <iostream>
      #include <sstream>
      #include <stack>
      #include <string>

      int eval_postfix(const std::string& expr) {
          std::stack<int> st;
          std::istringstream in(expr);
          std::string tok;
          while (in >> tok) {
              if (tok == "+" || tok == "-" || tok == "*") {
                  int b = st.top(); st.pop();     // the right operand is on top
                  int a = st.top(); st.pop();
                  if (tok == "+") st.push(a + b);
                  else if (tok == "-") st.push(a - b);
                  else st.push(a * b);
              } else {
                  st.push(std::stoi(tok));
              }
          }
          return st.top();
      }

      int main() {
          std::cout << eval_postfix("3 4 + 2 *") << "\n";
          std::cout << eval_postfix("10 2 3 * -") << "\n";
      }
      ```

      ```output
      14
      4
      ```

      (`std::istringstream` splits the text into words the way `std::cin` would; the next module covers it properly. `std::stoi` converts a string like `"42"` into the int 42.)

      ### Why a stack fits brackets

      Brackets have the same shape as this problem: the most recent thing you opened is the first thing that must close. So:

      1. For an opening bracket, push it.
      2. For a closing bracket, the stack must not be empty, and its top must be the matching opener. Pop it.
      3. At the end, the stack must be empty, or some opener was never closed.

      ### Common mistakes

      - Calling `top()` or `pop()` on an empty stack. That's undefined behavior, so check `empty()` first. The string `")"` must return `false`, not crash.
      - Forgetting step 3: `"(("` has no mismatches but isn't balanced.
      - Expecting `pop()` to return the value. Read `top()` first, then `pop()`.

      **Your turn:** write `bool balanced(const std::string& s)` for `()`, `[]` and `{}`. Other characters are ignored.
    seed: |
      #include <stack>
      #include <string>

      bool balanced(const std::string& s) {

      }
    solution: |
      #include <stack>
      #include <string>

      bool balanced(const std::string& s) {
          std::stack<char> st;
          for (char c : s) {
              if (c == '(' || c == '[' || c == '{') {
                  st.push(c);
              } else if (c == ')' || c == ']' || c == '}') {
                  if (st.empty()) return false;
                  char open = st.top();
                  st.pop();
                  if ((c == ')' && open != '(') || (c == ']' && open != '[') || (c == '}' && open != '{')) return false;
              }
          }
          return st.empty();
      }
    harness: |
      int main() {
          CHECK_EQ("()", balanced("()"), true);
          CHECK_EQ("([]{})", balanced("([]{})"), true);
          CHECK_EQ("(]", balanced("(]"), false);
          CHECK_EQ("((", balanced("(("), false);
          CHECK_EQ("))", balanced("))"), false);
          CHECK_EQ("code", balanced("int main() { return v[0]; }"), true);
          CHECK_EQ("empty", balanced(""), true);
          CHECK_EQ("([)]", balanced("([)]"), false);
      }
    hints:
      - Push opening brackets.
      - On a closing bracket, the stack must be non-empty and its top must be the matching opener. Pop it.
      - At the end, the stack must be empty.
