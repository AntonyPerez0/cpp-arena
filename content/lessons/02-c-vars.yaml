id: c-vars
title: Variables and types
lang: c
phase: "C: Foundations"
summary: Store values in named boxes. int, double and char, printing them with format specifiers, and constants.
steps:
  - title: Your first variable
    id: c-vars-1
    text: |
      So far the program only printed fixed text. Real programs work with **data** that changes: scores, prices, names. To keep a piece of data around, you store it in a **variable**.

      A variable is a named box in the computer's memory. In C, every box has a **type** that says what kind of value it can hold, and the type never changes. You create (declare) a variable by writing the type, then the name:

      ```c
      int kills = 25;
      ```

      - `int` is the type: a whole number (an **int**eger) such as `-3`, `0` or `25`.
      - `kills` is the name you'll use to refer to the box.
      - `= 25` puts a starting value in it. This is called **initializing** the variable.

      ### Printing a variable

      `printf` can't print a number directly inside the quotes, because the text in quotes is fixed. Instead you put a **format specifier** where the value should appear, and give the value after the string. For an `int` the specifier is `%d` (for **d**ecimal):

      ```c run
      #include <stdio.h>

      int main(void) {
          int kills = 25;
          int rounds = 16;
          printf("Kills: %d\n", kills);
          printf("Rounds played: %d\n", rounds);
          return 0;
      }
      ```

      ```output
      Kills: 25
      Rounds played: 16
      ```

      ### Naming rules

      Names can use letters, digits and underscores, but can't start with a digit, and can't be a C keyword like `int` or `return`. Names are case sensitive: `score` and `Score` are different variables. Pick names that say what the value means: `total_price` beats `x`.

      ### Common mistakes

      - **Using a variable before declaring it:** the compiler says `'score' undeclared`.
      - **Forgetting to initialize:** a variable declared inside a function with no value, like `int score;`, holds garbage (whatever was in that memory before) until you assign one. Using it before then is a bug the compiler often warns about. Always give variables a starting value.

      **Your turn:** declare an `int` named `score` with the value `42`.
    fill: |
      #include <stdio.h>

      int main(void) {
          [[int]] score = [[42]];
          printf("Score: %d\n", score);
          return 0;
      }
    hints:
      - The type for whole numbers is `int`.
    tests:
      - expect: "Score: 42"
    more:
      - task: |
          Declare two `int` variables: `kills` with the value `17` and `deaths` with the value `9`. The program should print `Kills: 17 Deaths: 9`.
        fill: |
          #include <stdio.h>

          int main(void) {
              [[int]] kills = [[17]];
              [[int]] deaths = [[9]];
              printf("Kills: %d Deaths: %d\n", kills, deaths);
              return 0;
          }
        hints:
          - Each declaration is the type, the name, `=`, then the value.
        tests:
          - expect: "Kills: 17 Deaths: 9"
      - task: |
          The `printf` is already written, but the variables it uses don't exist yet. Declare `level` (value `7`) and `xp` (value `1250`) as `int` so the program prints `Level 7, XP 1250`.
        seed: |
          #include <stdio.h>

          int main(void) {
              // declare level and xp here

              printf("Level %d, XP %d\n", level, xp);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              // declare level and xp here
              int level = 7;
              int xp = 1250;
              printf("Level %d, XP %d\n", level, xp);
              return 0;
          }
        require:
          - pattern: "int\\s+level\\s*="
            message: Declare an `int` named `level`.
          - pattern: "int\\s+xp\\s*="
            message: Declare an `int` named `xp`.
        hints:
          - A variable must be declared before the line that uses it.
          - "`int level = 7;` declares the first one."
        tests:
          - expect: "Level 7, XP 1250"

  - title: Printing values with %d
    id: c-vars-2
    text: |
      One `printf` call can print several values. It works through the format string from left to right, and each `%d` is replaced by the **next** value in the list after the string, in order.

      ```c run
      #include <stdio.h>

      int main(void) {
          int wins = 7;
          int losses = 3;
          printf("Record: %d-%d\n", wins, losses);
          printf("%d games played\n", wins + losses);
          return 0;
      }
      ```

      ```output
      Record: 7-3
      10 games played
      ```

      Notice that the thing after the comma doesn't have to be a single variable: `wins + losses` is an **expression**, and C works out its value (10) before printing it.

      ### The list must match

      `printf` trusts you. It doesn't check that the number of `%d`s matches the number of values, or that the values really are `int`s. If they don't match, the output is garbage or the program misbehaves. The compiler usually warns about it (for example `more '%' conversions than data arguments`), which is one reason to always read warnings.

      - Two `%d` need two values, in the order you want them to appear.
      - Swapping the values swaps the output: `printf("%d-%d\n", losses, wins)` prints `3-7`.

      Everything in the format string that isn't a `%` code is printed as is, including spaces, slashes and punctuation.

      **Your turn:** complete the `printf` so it prints `K/D: 20/5`.
    fill: |
      #include <stdio.h>

      int main(void) {
          int kills = 20;
          int deaths = 5;
          printf("K/D: [[%d]]/[[%d]]\n", [[kills]], [[deaths]]);
          return 0;
      }
    hints:
      - Put a `%d` for each number, then list the variables after the string in the same order.
    tests:
      - expect: "K/D: 20/5"
    more:
      - task: |
          The variables are declared in a different order than they are printed. Complete the `printf` so the program prints `Round 3 of 30`.
        fill: |
          #include <stdio.h>

          int main(void) {
              int total = 30;
              int round = 3;
              printf("Round [[%d]] of [[%d]]\n", [[round]], [[total]]);
              return 0;
          }
        hints:
          - The values after the string fill the `%d` slots from left to right. The first `%d` should be the round.
        tests:
          - expect: "Round 3 of 30"
      - task: |
          Print all three variables on one line, exactly like this:

          ```
          HP 100 | Armor 50 | $800
          ```

          Use a `%d` for each number instead of typing the numbers into the string.
        seed: |
          #include <stdio.h>

          int main(void) {
              int hp = 100;
              int armor = 50;
              int money = 800;
              printf("HP | Armor | $\n");
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int hp = 100;
              int armor = 50;
              int money = 800;
              printf("HP %d | Armor %d | $%d\n", hp, armor, money);
              return 0;
          }
        require:
          - pattern: "hp\\s*,\\s*armor\\s*,\\s*money"
            message: Print the numbers with `%d` and pass `hp, armor, money` to printf, not by typing them into the string.
        hints:
          - Put `%d` right where each number should appear, for example `HP %d`.
          - "After the string, list `hp, armor, money` in that order."
        tests:
          - expect: "HP 100 | Armor 50 | $800"

  - title: Changing a variable
    id: c-vars-3
    text: |
      Variables are called variables because they can **vary**: you can store a new value in one at any time with `=`. The old value is thrown away and replaced.

      ```c run
      #include <stdio.h>

      int main(void) {
          int hp = 100;
          printf("Start: %d\n", hp);
          hp = hp - 27;
          printf("After a hit: %d\n", hp);
          hp = 100;
          printf("Healed: %d\n", hp);
          return 0;
      }
      ```

      ```output
      Start: 100
      After a hit: 73
      Healed: 100
      ```

      ### `=` is not "equals"

      In math, `hp = hp - 27` would be impossible. In C, `=` means **assign**: "work out the value on the right, then store it in the box on the left". So `hp = hp - 27` runs in two stages:

      1. Read the current value of `hp` (100) and subtract 27, giving 73.
      2. Store 73 into `hp`, replacing 100.

      The right side is always worked out completely before anything is stored, which is why a variable can appear on both sides.

      ### Declaring vs assigning

      `int hp = 100;` **creates** the box (with its type) and fills it. Later lines just write `hp = ...;` without `int`. Writing `int hp` again in the same place would try to create a second box with the same name, and the compiler reports `redefinition of 'hp'`.

      **Your turn:** the player has `3200` money and buys a rifle for `2700`. Subtract the price from `money` so the program prints `Money left: 500`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int money = 3200;
          // subtract the rifle price (2700) from money

          printf("Money left: %d\n", money);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int money = 3200;
          // subtract the rifle price (2700) from money
          money = money - 2700;
          printf("Money left: %d\n", money);
          return 0;
      }
    require:
      - pattern: "money\\s*(=\\s*money\\s*-|-=)"
        message: Change `money` itself by subtracting 2700 from it (don't just print 500).
    hints:
      - "Write `money = money - 2700;` on the empty line."
    tests:
      - expect: "Money left: 500"
    more:
      - task: |
          The player starts with `100` HP, takes `27` damage, then picks up a medkit that heals `15`. Change `hp` for each event so the program prints `HP: 88`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int hp = 100;
              // take 27 damage

              // heal 15

              printf("HP: %d\n", hp);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int hp = 100;
              // take 27 damage
              hp = hp - 27;
              // heal 15
              hp = hp + 15;
              printf("HP: %d\n", hp);
              return 0;
          }
        require:
          - pattern: "hp\\s*(=\\s*hp\\s*-|-=)"
            message: Subtract the damage from `hp` itself.
          - pattern: "hp\\s*(=\\s*hp\\s*\\+|\\+=)"
            message: Add the healing to `hp` itself.
        hints:
          - "`hp = hp - 27;` takes the damage."
          - "`hp = hp + 15;` heals."
        tests:
          - expect: "HP: 88"
      - task: |
          The same variable changes three times, and the program prints it after each change. Starting from `800`, add the round win reward of `3250`, then buy a rifle for `2700`, then buy armor for `650`. The output should be:

          ```
          After win: 4050
          After rifle: 1350
          After armor: 700
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int money = 800;
              // add the round win reward (3250)

              printf("After win: %d\n", money);
              // buy a rifle (2700)

              printf("After rifle: %d\n", money);
              // buy armor (650)

              printf("After armor: %d\n", money);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int money = 800;
              // add the round win reward (3250)
              money = money + 3250;
              printf("After win: %d\n", money);
              // buy a rifle (2700)
              money = money - 2700;
              printf("After rifle: %d\n", money);
              // buy armor (650)
              money = money - 650;
              printf("After armor: %d\n", money);
              return 0;
          }
        require:
          - pattern: "money\\s*(=\\s*money\\s*\\+|\\+=)"
            message: Add the reward to `money` itself.
          - pattern: "money\\s*(=\\s*money\\s*-|-=)"
            message: Subtract each price from `money` itself.
        hints:
          - Each line after a comment changes `money`, and the printf below it shows the new value.
          - "`money = money + 3250;` then `money = money - 2700;` and so on."
        tests:
          - expect: "After win: 4050\nAfter rifle: 1350\nAfter armor: 700"

  - title: Decimals with double
    id: c-vars-4
    text: |
      An `int` can only hold whole numbers. If you need a fraction, like an accuracy of 0.625 or a price of 19.99, use the type `double` (short for "double-precision floating point"). Print a `double` with `%f`.

      ```c run
      #include <stdio.h>

      int main(void) {
          double accuracy = 0.625;
          double price = 19.5;
          printf("%f\n", accuracy);
          printf("%.2f\n", accuracy);
          printf("%.1f\n", price);
          return 0;
      }
      ```

      ```output
      0.625000
      0.62
      19.5
      ```

      ### Controlling decimals

      Plain `%f` always shows six digits after the decimal point. Put `.N` between the `%` and the `f` to choose how many: `%.2f` shows two, `%.0f` shows none. The value is **rounded** for printing; the variable itself isn't changed. 0.625 is exactly halfway between 0.62 and 0.63, and for exact ties like this `printf` rounds to the **even** last digit, so it prints 0.62 (and `%.0f` prints 2.5 as 2 but 3.5 as 4). Values that aren't exact ties round the way you'd expect.

      ### How exact are doubles?

      A `double` stores about 15 to 16 significant digits, which is plenty for most things, but it stores numbers in binary, so many decimal fractions (like 0.1) are tiny approximations. That's why you should never use `double` for money in real software: store cents in an integer instead. For scores, ratios and measurements, `double` is the right choice.

      ### Common mistakes

      - Printing a `double` with `%d` (or an `int` with `%f`) prints nonsense. The specifier must match the type.
      - Writing `double x = 7 / 2;` still gives 3.0, because `7 / 2` is worked out with ints first. You'll dig into that in the next module.

      **Your turn:** store `1.25` in a `double` named `rating` and print it with exactly two decimals so the output is `Rating: 1.25`.
    fill: |
      #include <stdio.h>

      int main(void) {
          [[double]] rating = 1.25;
          printf("Rating: [[%.2f]]\n", rating);
          return 0;
      }
    hints:
      - The type is `double`. The format for two decimals is `%.2f`.
    tests:
      - expect: "Rating: 1.25"
    more:
      - task: |
          Store `45.678` in a `double` named `accuracy` and print it rounded to **one** decimal, so the output is `Accuracy: 45.7`.
        fill: |
          #include <stdio.h>

          int main(void) {
              [[double]] accuracy = [[45.678]];
              printf("Accuracy: [[%.1f]]\n", accuracy);
              return 0;
          }
        hints:
          - The number after the dot in `%.2f` is how many decimals are printed. You want one.
        tests:
          - expect: "Accuracy: 45.7"
      - task: |
          A player's **eDPI** is their mouse sensitivity times their mouse DPI. Declare a `double` named `sens` equal to `1.75` and an `int` named `dpi` equal to `400`, compute the eDPI into a `double`, and print:

          ```
          Sensitivity: 1.75
          eDPI: 700.00
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              // declare sens and dpi, compute the eDPI, print both lines

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              // declare sens and dpi, compute the eDPI, print both lines
              double sens = 1.75;
              int dpi = 400;
              double edpi = sens * dpi;
              printf("Sensitivity: %.2f\n", sens);
              printf("eDPI: %.2f\n", edpi);
              return 0;
          }
        require:
          - pattern: "double\\s+sens\\s*="
            message: Declare a `double` named `sens`.
          - pattern: "int\\s+dpi\\s*="
            message: Declare an `int` named `dpi`.
          - pattern: "sens\\s*\\*\\s*dpi|dpi\\s*\\*\\s*sens"
            message: Compute the eDPI by multiplying `sens` by `dpi`.
        forbid:
          - pattern: "700"
            message: Compute the eDPI by multiplying `sens` by `dpi` instead of typing 700.
        hints:
          - "`double edpi = sens * dpi;` multiplies them. The int is converted to a double automatically."
          - Both lines use `%.2f` to print two decimals.
        tests:
          - expect: "Sensitivity: 1.75\neDPI: 700.00"

  - title: Characters with char
    id: c-vars-5
    text: |
      A `char` holds a **single character**, such as a letter, digit or symbol. Character values are written in **single** quotes: `'A'`, `'7'`, `'?'`. Double quotes mean something different: `"A"` is a *string* (text that can have many characters), which you'll meet properly later.

      Print a `char` with `%c`:

      ```c run
      #include <stdio.h>

      int main(void) {
          char grade = 'B';
          char next = grade + 1;
          printf("Grade: %c\n", grade);
          printf("Next: %c\n", next);
          printf("As a number: %d\n", grade);
          return 0;
      }
      ```

      ```output
      Grade: B
      Next: C
      As a number: 66
      ```

      ### Characters are numbers

      Computers only store numbers, so every character has a numeric code. The standard table is called **ASCII**: `'A'` is 65, `'B'` is 66, `'a'` is 97, `'0'` is 48, and a space is 32. A `char` is really a small integer (one byte), and C lets you do arithmetic on it, which is why `grade + 1` gives `'C'`.

      What you see depends on how you print it: `%c` shows the character, `%d` shows its code. It's the same value either way.

      ### Common mistakes

      - `char c = "A";` (double quotes) is an error: that's a string, not a character.
      - `'AB'` isn't one character. A `char` holds exactly one.
      - `'7'` (the character, code 55) is not the number `7`.

      **Your turn:** write a program that stores the letter `T` in a `char` named `team`, then prints two lines:

      ```
      Team: T
      Code: 84
      ```
    seed: |
      #include <stdio.h>

      int main(void) {
          // declare the char here

          // print it with %c, then with %d

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          // declare the char here
          char team = 'T';
          // print it with %c, then with %d
          printf("Team: %c\n", team);
          printf("Code: %d\n", team);
          return 0;
      }
    require:
      - pattern: "char\\s+team\\s*="
        message: "Declare a variable named `team` of type `char`."
    hints:
      - "`char team = 'T';` declares it."
      - "Use `%c` for the letter and `%d` for its number code."
    tests:
      - expect: "Team: T\nCode: 84"
    more:
      - task: |
          Store the letter `A` in a `char` named `grade` and print it as a letter, so the output is `Grade: A`.
        fill: |
          #include <stdio.h>

          int main(void) {
              [[char]] grade = [['A']];
              printf("Grade: [[%c]]\n", grade);
              return 0;
          }
        hints:
          - A single character goes in single quotes, like `'A'`.
          - The format for printing a char as a letter is `%c`.
        tests:
          - expect: "Grade: A"
      - task: |
          Characters are small numbers, so you can do arithmetic on them. Store `'a'` in a `char` named `key`, then print the key and the letter that comes after it by adding 1:

          ```
          Key: a
          Next: b
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              // declare key, then print it and key + 1 as letters

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              // declare key, then print it and key + 1 as letters
              char key = 'a';
              printf("Key: %c\n", key);
              printf("Next: %c\n", key + 1);
              return 0;
          }
        require:
          - pattern: "char\\s+key\\s*="
            message: Declare a `char` named `key`.
          - pattern: "key\\s*\\+\\s*1"
            message: Compute the next letter with `key + 1` instead of typing `b`.
        hints:
          - "`'a'` is 97, so `key + 1` is 98, which is the code for `'b'`."
          - Print `key + 1` with `%c` to see it as a letter.
        tests:
          - expect: "Key: a\nNext: b"

  - title: Constants and sizeof
    id: c-vars-6
    text: |
      ### Constants

      Some values should never change while the program runs: the number of players on a team, the length of a round, a tax rate. Put `const` in front of the declaration to make the variable **read-only**:

      ```c
      const int MAX_PLAYERS = 10;
      MAX_PLAYERS = 12;   // error: cannot assign to variable 'MAX_PLAYERS' with const-qualified type 'const int'
      ```

      If any later line tries to change it, the program doesn't compile. That turns a silent bug into an error you see immediately. It also documents your intent: a reader knows this value is fixed. Many programmers write constant names in `UPPER_CASE` so they stand out.

      ### sizeof

      Every type takes up a fixed number of **bytes** of memory. The `sizeof` operator tells you how many:

      ```c run
      #include <stdio.h>

      int main(void) {
          printf("char: %zu\n", sizeof(char));
          printf("double: %zu\n", sizeof(double));
          printf("long long: %zu\n", sizeof(long long));
          return 0;
      }
      ```

      ```output
      char: 1
      double: 8
      long long: 8
      ```

      `sizeof` gives a value of a special unsigned type called `size_t`, and the matching `printf` specifier is `%zu`. A `char` is 1 byte by definition. The others depend on the machine, but on this site and on almost every modern computer an `int` is 4 bytes (so it can hold values up to about 2.1 billion) and a `double` is 8.

      Knowing sizes matters once you work with memory directly, which you'll do with arrays and pointers.

      **Your turn:** declare a constant `int` named `ROUND_TIME` equal to `115`, and print:

      ```
      Round time: 115
      int bytes: 4
      ```
    fill: |
      #include <stdio.h>

      int main(void) {
          [[const]] int ROUND_TIME = 115;
          printf("Round time: %d\n", ROUND_TIME);
          printf("int bytes: %zu\n", [[sizeof(int)]]);
          return 0;
      }
    hints:
      - The keyword that makes a variable read-only is `const`.
      - "`sizeof(int)` gives the size of an int in bytes."
    tests:
      - expect: "Round time: 115\nint bytes: 4"
    more:
      - task: |
          Make `MAX_PLAYERS` a constant and print the size of a `double`. The output should be:

          ```
          Max players: 10
          double bytes: 8
          ```
        fill: |
          #include <stdio.h>

          int main(void) {
              [[const]] int MAX_PLAYERS = 10;
              printf("Max players: %d\n", MAX_PLAYERS);
              printf("double bytes: %zu\n", [[sizeof(double)]]);
              return 0;
          }
        hints:
          - "`const` goes before the type to make the variable read-only."
          - "`sizeof(double)` is the size of a double in bytes."
        tests:
          - expect: "Max players: 10\ndouble bytes: 8"
      - task: |
          Use `sizeof` to print the size of three types, one per line, and don't type the numbers yourself:

          ```
          char: 1
          int: 4
          double: 8
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              // print the size of char, int and double with sizeof and %zu

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              // print the size of char, int and double with sizeof and %zu
              printf("char: %zu\n", sizeof(char));
              printf("int: %zu\n", sizeof(int));
              printf("double: %zu\n", sizeof(double));
              return 0;
          }
        require:
          - pattern: "sizeof\\s*\\(\\s*char\\s*\\)"
            message: Use `sizeof(char)` for the first line.
          - pattern: "sizeof\\s*\\(\\s*int\\s*\\)"
            message: Use `sizeof(int)` for the second line.
          - pattern: "sizeof\\s*\\(\\s*double\\s*\\)"
            message: Use `sizeof(double)` for the third line.
        hints:
          - "sizeof gives a `size_t`, which is printed with `%zu`."
          - "`printf(\"char: %zu\\n\", sizeof(char));` is the first line."
        tests:
          - expect: "char: 1\nint: 4\ndouble: 8"
