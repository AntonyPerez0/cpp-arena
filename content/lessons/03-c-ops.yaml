id: c-ops
title: Operators and math
lang: c
phase: "C: Foundations"
summary: Arithmetic, the integer-division trap, the % remainder operator, precedence, shorthand operators and casts.
steps:
  - title: Arithmetic
    id: c-ops-1
    text: |
      C has the arithmetic operators you know: `+` (add), `-` (subtract), `*` (multiply) and `/` (divide). An **expression** combines values, variables and operators, and C works out (**evaluates**) its value.

      ```c run
      #include <stdio.h>

      int main(void) {
          int a = 12 * 3 + 4;
          int b = 12 * (3 + 4);
          int c = 20 - 5 - 3;
          printf("%d %d %d\n", a, b, c);
          return 0;
      }
      ```

      ```output
      40 84 12
      ```

      ### Order of operations

      C follows the same rules as school math. This order is called **precedence**:

      1. Parentheses first.
      2. Then `*`, `/` and `%` (which you'll meet soon).
      3. Then `+` and `-`.

      When operators have the same precedence, they go **left to right**: `20 - 5 - 3` is `(20 - 5) - 3`, which is 12, not `20 - (5 - 3)`.

      So `12 * 3 + 4` multiplies first (36) and then adds (40). If you want the addition first, add parentheses. When you're not sure, add parentheses anyway: they cost nothing and make the intent obvious to the next reader.

      ### Using variables in expressions

      Expressions can mix numbers and variables. `price * quantity + shipping` reads the current values of the variables at the moment the line runs.

      **Your turn:** make the program print `Damage: 96` by filling in the operators. Base damage is 30, the multiplier is 4, armor absorbs 24.
    fill: |
      #include <stdio.h>

      int main(void) {
          int base = 30;
          int multiplier = 4;
          int armor = 24;
          int damage = base [[*]] multiplier [[-]] armor;
          printf("Damage: %d\n", damage);
          return 0;
      }
    hints:
      - 30 times 4 is 120, and 120 minus 24 is 96.
    tests:
      - expect: "Damage: 96"
    more:
      - task: |
          Every round a player earns a base of `20` points plus a bonus of `5`, and they played `3` rounds. Fill in the operators and the parentheses so the program prints `Total: 75`. Without parentheses, `*` happens before `+` and you get the wrong answer.
        fill: |
          #include <stdio.h>

          int main(void) {
              int base = 20;
              int bonus = 5;
              int rounds = 3;
              int total = [[(]]base [[+]] bonus[[)]] [[*]] rounds;
              printf("Total: %d\n", total);
              return 0;
          }
        hints:
          - First add base and bonus (25 per round), then multiply by the rounds.
          - Parentheses make the addition happen first, `(base + bonus) * rounds`.
        tests:
          - expect: "Total: 75"
      - task: |
          Work out the player's money at the end of the round from the variables: they started with `start`, got `kill_reward` for each of their `kills`, got the `win_bonus`, and bought `grenades` grenades at `grenade_price` each. Print `Money: 4550` by computing it, not by typing the number.
        seed: |
          #include <stdio.h>

          int main(void) {
              int start = 1000;
              int kills = 3;
              int kill_reward = 300;
              int win_bonus = 3250;
              int grenades = 2;
              int grenade_price = 300;
              // compute the money and print it

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int start = 1000;
              int kills = 3;
              int kill_reward = 300;
              int win_bonus = 3250;
              int grenades = 2;
              int grenade_price = 300;
              // compute the money and print it
              int money = start + kills * kill_reward + win_bonus - grenades * grenade_price;
              printf("Money: %d\n", money);
              return 0;
          }
        forbid:
          - pattern: "4550"
            message: Compute the money from the variables instead of typing the answer.
        hints:
          - Money earned from kills is `kills * kill_reward`. The grenades cost `grenades * grenade_price`.
          - "`*` happens before `+` and `-`, so you don't need parentheses here."
        tests:
          - expect: "Money: 4550"

  - title: The integer division trap
    id: c-ops-2
    text: |
      This is one of the most famous traps in C. When **both** sides of `/` are integers, C does **integer division**: it divides and throws the fractional part away. It doesn't round; it just cuts it off (truncates toward zero).

      ```c run
      #include <stdio.h>

      int main(void) {
          printf("%d\n", 7 / 2);
          printf("%d\n", 99 / 100);
          printf("%f\n", 7.0 / 2);
          printf("%f\n", (double)7 / 2);
          return 0;
      }
      ```

      ```output
      3
      0
      3.500000
      3.500000
      ```

      ### Why storing into a double doesn't help

      ```c
      double avg = 7 / 2;   // avg is 3.0, not 3.5
      ```

      C works out the right side **first**, using only what's on the right. `7 / 2` is int divided by int, so it becomes 3. Only then is 3 converted to a `double` and stored. The destination's type is never considered while the expression is being evaluated.

      ### How to get a real division

      If **either** side of `/` is a `double`, C converts the other side too and does a real division. You can:

      - write a decimal literal: `7.0 / 2`
      - **cast** a variable, which means converting its value to another type for this expression: `(double)kills / rounds`

      A cast is written as the type in parentheses before the value. `(double)kills` doesn't change the variable `kills`; it produces a `double` copy of its value for this calculation.

      Put the cast on one of the operands, not around the whole division: `(double)(kills / rounds)` still does the integer division first, and then converts the already-truncated answer.

      **Your turn:** 25 kills over 10 rounds should print `Kills per round: 2.50`. Right now it prints `2.00`. Fix the calculation of `kpr` so it does a real division.
    seed: |
      #include <stdio.h>

      int main(void) {
          int kills = 25;
          int rounds = 10;
          double kpr = kills / rounds;
          printf("Kills per round: %.2f\n", kpr);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int kills = 25;
          int rounds = 10;
          double kpr = (double)kills / rounds;
          printf("Kills per round: %.2f\n", kpr);
          return 0;
      }
    hints:
      - "`kills / rounds` is computed as int / int (giving 2) *before* it's stored in the double."
      - Turn one side into a double first. Write `(double)kills / rounds`. That `(double)` is called a *cast*.
    tests:
      - expect: "Kills per round: 2.50"
    more:
      - task: |
          The average of `7`, `8` and `8` should print `Average: 7.67`, but it prints `7.00`. Fix the division so it keeps the decimals.
        seed: |
          #include <stdio.h>

          int main(void) {
              int a = 7;
              int b = 8;
              int c = 8;
              double avg = (a + b + c) / 3;
              printf("Average: %.2f\n", avg);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int a = 7;
              int b = 8;
              int c = 8;
              double avg = (a + b + c) / 3.0;
              printf("Average: %.2f\n", avg);
              return 0;
          }
        hints:
          - The sum is an int and 3 is an int, so the division throws the decimals away.
          - Divide by `3.0` (a double) or cast the sum with `(double)`.
        tests:
          - expect: "Average: 7.67"
      - task: |
          A player hit `13` headshots out of `20` kills. The headshot rate in percent should print `Headshot rate: 65.0 percent`, but it prints `0.0`. Fix the calculation of `rate`. Be careful: `(double)(headshots / kills)` is still wrong, because the int division already happened inside the parentheses.
        seed: |
          #include <stdio.h>

          int main(void) {
              int headshots = 13;
              int kills = 20;
              double rate = headshots / kills * 100;
              printf("Headshot rate: %.1f percent\n", rate);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int headshots = 13;
              int kills = 20;
              double rate = (double)headshots / kills * 100;
              printf("Headshot rate: %.1f percent\n", rate);
              return 0;
          }
        hints:
          - "`13 / 20` in int math is 0, and 0 times 100 is still 0."
          - Cast before dividing, `(double)headshots / kills * 100`.
        tests:
          - expect: "Headshot rate: 65.0 percent"

  - title: Remainder with %
    id: c-ops-3
    text: |
      The `%` operator (called **modulo** or remainder) gives what's **left over** after an integer division.

      ```c run
      #include <stdio.h>

      int main(void) {
          printf("%d %d\n", 17 / 5, 17 % 5);
          printf("%d %d\n", 20 / 5, 20 % 5);
          printf("%d\n", 9 % 2);
          return 0;
      }
      ```

      ```output
      3 2
      4 0
      1
      ```

      17 divided by 5 is 3 with 2 left over (3 times 5 is 15, and 17 minus 15 is 2). `/` gives the 3 and `%` gives the 2. Together they always satisfy `(a / b) * b + a % b == a`.

      ### What it's good for

      - **Even or odd:** `n % 2` is 0 for even numbers and 1 for odd ones.
      - **Every Nth time:** `i % 10 == 0` is true for 0, 10, 20 and so on.
      - **Wrapping around:** `(hour + 5) % 24` keeps a clock hour between 0 and 23.
      - **Splitting units:** 135 cents is `135 / 100` dollars and `135 % 100` cents. The same trick splits seconds into hours, minutes and seconds.

      `%` only works on integers. For doubles there's a library function called `fmod`, but you'll rarely need it.

      **Your turn:** a match lasted `754` seconds. Print it as minutes and seconds: `12 min 34 sec`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int total = 754;
          int minutes = 0; // fix me
          int seconds = 0; // fix me
          printf("%d min %d sec\n", minutes, seconds);
          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int total = 754;
          int minutes = total / 60;
          int seconds = total % 60;
          printf("%d min %d sec\n", minutes, seconds);
          return 0;
      }
    require:
      - pattern: "total\\s*%\\s*60"
        message: Use the `%` operator on `total` to get the seconds.
    hints:
      - Minutes are how many whole 60s fit into total, so `total / 60`.
      - Seconds are what's left over, so `total % 60`.
    tests:
      - expect: "12 min 34 sec"
    more:
      - task: |
          There are `23` players and each team has `5` players. Compute how many full teams you can make and how many players are left over, and print `4 full teams, 3 left over`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int players = 23;
              int teams = 0; // fix me
              int left = 0;  // fix me
              printf("%d full teams, %d left over\n", teams, left);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int players = 23;
              int teams = players / 5;
              int left = players % 5;
              printf("%d full teams, %d left over\n", teams, left);
              return 0;
          }
        require:
          - pattern: "players\\s*%\\s*5"
            message: Use `%` on `players` to get the players left over.
        hints:
          - Full teams are how many 5s fit into 23, `players / 5`.
          - The leftovers are the remainder, `players % 5`.
        tests:
          - expect: "4 full teams, 3 left over"
      - task: |
          A long match lasted `3725` seconds. Print it as hours, minutes and seconds: `1 h 2 min 5 sec`. You'll need both `/` and `%`, more than once.
        seed: |
          #include <stdio.h>

          int main(void) {
              int total = 3725;
              int hours = 0;   // fix me
              int minutes = 0; // fix me
              int seconds = 0; // fix me
              printf("%d h %d min %d sec\n", hours, minutes, seconds);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int total = 3725;
              int hours = total / 3600;
              int minutes = total % 3600 / 60;
              int seconds = total % 60;
              printf("%d h %d min %d sec\n", hours, minutes, seconds);
              return 0;
          }
        require:
          - pattern: "%\\s*60\\b"
            message: Use `% 60` to get the seconds.
          - pattern: "/\\s*3600"
            message: Use `/ 3600` to get the hours (an hour is 3600 seconds).
        hints:
          - An hour is 3600 seconds, so the hours are `total / 3600`.
          - The seconds left after the hours are `total % 3600`. Divide that by 60 for the minutes.
          - The seconds are `total % 60`.
        tests:
          - expect: "1 h 2 min 5 sec"

  - title: Shorthand operators
    id: c-ops-4
    text: |
      Changing a variable based on its own value is so common that C has shortcuts for it. These **compound assignment** operators do the math and store the result in one step:

      | Shorthand | Means |
      |---|---|
      | `x += 5;` | `x = x + 5;` |
      | `x -= 5;` | `x = x - 5;` |
      | `x *= 2;` | `x = x * 2;` |
      | `x /= 2;` | `x = x / 2;` |
      | `x %= 3;` | `x = x % 3;` |
      | `x++;` | `x = x + 1;` (increment) |
      | `x--;` | `x = x - 1;` (decrement) |

      ```c run
      #include <stdio.h>

      int main(void) {
          int gold = 10;
          gold += 15;
          printf("%d\n", gold);
          gold /= 5;
          printf("%d\n", gold);
          gold--;
          printf("%d\n", gold);
          return 0;
      }
      ```

      ```output
      25
      5
      4
      ```

      The shorthand means exactly the same as the long form; it's just shorter and harder to mistype (you don't have to repeat a long variable name). `++` and `--` are everywhere in C, especially for counting in loops, which is where the name C++ comes from: "C, plus one".

      ### Common mistakes

      - `x =+ 5;` (the characters swapped) is valid C, but it means `x = +5;`, which sets `x` to 5. The operator is `+=`.
      - There's no `**` power operator. For powers you multiply, or use the `pow` function from `<math.h>`.

      **Your turn:** fill in the shorthand operators so the program prints `Streak: 12`.
    fill: |
      #include <stdio.h>

      int main(void) {
          int streak = 5;
          streak [[+=]] 1;      // add 1 -> 6
          streak [[*=]] 2;      // double it -> 12
          streak[[++]];         // add 1 -> 13
          streak[[--]];         // subtract 1 -> 12
          printf("Streak: %d\n", streak);
          return 0;
      }
    hints:
      - "The comments say what each line should do: add 1, double, add 1, subtract 1."
    tests:
      - expect: "Streak: 12"
    more:
      - task: |
          Fill in the shorthand operators so the program prints `Money: 100`. Follow the comments.
        fill: |
          #include <stdio.h>

          int main(void) {
              int money = 1000;
              money [[-=]] 200;    // subtract 200 -> 800
              money [[/=]] 2;      // halve it -> 400
              money [[%=]] 150;    // keep the remainder after dividing by 150 -> 100
              printf("Money: %d\n", money);
              return 0;
          }
        hints:
          - Every shorthand is an operator followed by `=`, like `+=`.
          - The remainder operator is `%`, so its shorthand is `%=`.
        tests:
          - expect: "Money: 100"
      - task: |
          This program already prints `Score: 42`, but it uses the long form everywhere. Rewrite each of the four lines with the shortest operator: `+=`, `*=`, `-=` and `++`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int score = 5;
              score = score + 10;
              score = score * 3;
              score = score - 4;
              score = score + 1;
              printf("Score: %d\n", score);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int score = 5;
              score += 10;
              score *= 3;
              score -= 4;
              score++;
              printf("Score: %d\n", score);
              return 0;
          }
        require:
          - pattern: "\\+="
            message: Use `+=` for adding 10.
          - pattern: "\\*="
            message: Use `*=` for multiplying by 3.
          - pattern: "-="
            message: Use `-=` for subtracting 4.
          - pattern: "\\+\\+"
            message: Use `++` for adding 1.
        forbid:
          - pattern: "score\\s*=\\s*score"
            message: Replace every `score = score ...` line with a shorthand operator.
        hints:
          - "`score = score + 10;` becomes `score += 10;`."
          - "Adding exactly 1 is `score++;`."
        tests:
          - expect: "Score: 42"

  - title: Prefix vs postfix ++
    id: c-ops-5
    text: |
      Used on a line by itself, `x++;` and `++x;` do the same thing: add 1 to `x`. They only differ when the result is **used inside a bigger expression**, because the expression gets a value from them:

      - `x++` (**postfix**) gives the **old** value of `x`, then increments it.
      - `++x` (**prefix**) increments `x` first, then gives the **new** value.

      ```c run
      #include <stdio.h>

      int main(void) {
          int n = 10;
          int first = n++;
          printf("first=%d n=%d\n", first, n);
          int second = ++n;
          printf("second=%d n=%d\n", second, n);
          return 0;
      }
      ```

      ```output
      first=10 n=11
      second=12 n=12
      ```

      Walk through it: `first = n++` copies the old value (10) into `first`, then `n` becomes 11. `second = ++n` bumps `n` to 12 first, then copies 12 into `second`.

      ### Keep it simple

      This rule matters for reading other people's code, but in your own code prefer to keep `++` on its own line. Expressions that change a variable and also use it again, like `n = n++ + 1` or `printf("%d %d", n, n++)`, are **undefined behavior** in C: the language doesn't say what happens, and different compilers give different results. The safe rule: if a statement changes a variable, don't use that same variable anywhere else in the statement. (`printf("%d %d", n, n++)` changes `n` only once, but it also reads `n` elsewhere, and that's already undefined.)

      **Your turn:** make the program print `5 7 7` by choosing prefix or postfix for each blank. The variable `a` starts at 5.
    fill: |
      #include <stdio.h>

      int main(void) {
          int a = 5;
          int b = [[a++]];
          int c = [[++a]];
          printf("%d %d %d\n", b, c, a);
          return 0;
      }
    hints:
      - "`b` must get the old value 5, so use postfix: `a++`. After that, `a` is 6."
      - "`c` must be 7 and `a` must also be 7, so increment first: `++a`."
    tests:
      - expect: "5 7 7"
    more:
      - task: |
          Now with `--`. The variable `x` starts at 10. Choose prefix or postfix for each blank so the program prints `10 8 8`.
        fill: |
          #include <stdio.h>

          int main(void) {
              int x = 10;
              int y = [[x--]];
              int z = [[--x]];
              printf("%d %d %d\n", y, z, x);
              return 0;
          }
        hints:
          - "`y` must get the old value 10, so decrement after reading: `x--`. Then `x` is 9."
          - "`z` must be 8, so decrement first: `--x`."
        tests:
          - expect: "10 8 8"
      - task: |
          The magazine holds `30` bullets. Replace each `0` so that `before` gets the ammo count and **then** the ammo goes down by one, all in one expression, and `after` gets the ammo count **after** it goes down by one more. The program should print `30 28 28`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int ammo = 30;
              int before = 0; // read ammo, then decrease it
              int after = 0;  // decrease ammo, then read it
              printf("%d %d %d\n", before, after, ammo);
              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int ammo = 30;
              int before = ammo--; // read ammo, then decrease it
              int after = --ammo;  // decrease ammo, then read it
              printf("%d %d %d\n", before, after, ammo);
              return 0;
          }
        require:
          - pattern: "ammo--"
            message: Use postfix `ammo--` for `before`.
          - pattern: "--ammo"
            message: Use prefix `--ammo` for `after`.
        hints:
          - Postfix (`ammo--`) gives the old value. Prefix (`--ammo`) gives the new value.
        tests:
          - expect: "30 28 28"

  - title: Put it together
    id: c-ops-6
    text: |
      Time to put the module together and write a calculation from scratch. Here's how to approach a small task like this, which is the same process you'll use for much bigger ones:

      1. **Read what the output must be**, character by character.
      2. **Name the values you need.** What goes into the answer? Give each intermediate result its own variable with a clear name.
      3. **Choose types.** Counts and sums of whole numbers are `int`. Averages and ratios are usually `double`.
      4. **Watch for integer division.** If you divide two ints and want decimals, cast one side.
      5. **Print with the right specifiers:** `%d` for `int`, `%.2f` for a `double` with two decimals.

      Here's a similar calculation, fully worked:

      ```c run
      #include <stdio.h>

      int main(void) {
          int quiz1 = 18;
          int quiz2 = 15;
          int quiz3 = 19;
          int quizzes = 3;
          int total = quiz1 + quiz2 + quiz3;
          double average = (double)total / quizzes;
          printf("Total points: %d\n", total);
          printf("Average: %.2f\n", average);
          return 0;
      }
      ```

      ```output
      Total points: 52
      Average: 17.33
      ```

      Notice `total` is computed once and then reused for both lines. Storing intermediate results in well-named variables makes code easier to read and to check.

      **Your turn:** a player's **ADR** (average damage per round) is total damage divided by rounds played. Given the variables below, print:

      ```
      Total damage: 2090
      ADR: 83.60
      ```

      Total damage is the sum of the three halves' damage (it's a long match: first half, second half, overtime).
    seed: |
      #include <stdio.h>

      int main(void) {
          int first_half = 1020;
          int second_half = 870;
          int overtime = 200;
          int rounds = 25;
          // compute total damage and ADR, then print both lines

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int first_half = 1020;
          int second_half = 870;
          int overtime = 200;
          int rounds = 25;
          // compute total damage and ADR, then print both lines
          int total = first_half + second_half + overtime;
          double adr = (double)total / rounds;
          printf("Total damage: %d\n", total);
          printf("ADR: %.2f\n", adr);
          return 0;
      }
    forbid:
      - pattern: "2090|83\\.6"
        message: Compute the numbers from the variables instead of typing the answers.
    hints:
      - Add the three variables into an `int total`.
      - "Watch out for integer division: `(double)total / rounds`."
      - "Print with `%d` for the total and `%.2f` for the ADR."
    tests:
      - expect: "Total damage: 2090\nADR: 83.60"
    more:
      - task: |
          A player got `36` kills and `16` deaths over `24` rounds. Compute their **K/D** (kills divided by deaths) and **KPR** (kills per round) and print:

          ```
          K/D: 2.25
          KPR: 1.50
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int kills = 36;
              int deaths = 16;
              int rounds = 24;
              // compute K/D and KPR as doubles, then print both lines

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int kills = 36;
              int deaths = 16;
              int rounds = 24;
              // compute K/D and KPR as doubles, then print both lines
              double kd = (double)kills / deaths;
              double kpr = (double)kills / rounds;
              printf("K/D: %.2f\n", kd);
              printf("KPR: %.2f\n", kpr);
              return 0;
          }
        forbid:
          - pattern: "2\\.25|1\\.5"
            message: Compute the numbers from the variables instead of typing the answers.
        hints:
          - Both are divisions of ints, so cast one side, `(double)kills / deaths`.
          - Print each with `%.2f`.
        tests:
          - expect: "K/D: 2.25\nKPR: 1.50"
      - task: |
          The match had `24` rounds lasting `97` seconds each on average, and the team spent `61200` money in total. Print the total match time in minutes and seconds, and the money spent per round with two decimals:

          ```
          Match time: 38 min 48 sec
          Spent per round: 2550.00
          ```
        seed: |
          #include <stdio.h>

          int main(void) {
              int rounds = 24;
