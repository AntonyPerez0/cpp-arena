      - "height is 1 + the larger of the two subtree heights; sum is the value plus both subtree sums."
      - "Use `.get()` to pass a child's raw pointer without giving up ownership."

  - title: Binary search trees
    id: dsa-trees-2
    text: |
      A **binary search tree** (BST) adds one rule to a binary tree: everything in a node's left subtree is **smaller** than the node, and everything in its right subtree is **larger**. That rule makes searching fast: at each node, you know which side the key must be on, so you walk **one path** from the root and ignore the rest.

      ```
              8
             / \
            3   10
           / \    \
          1   6    14
      ```

      To find 6: 6 < 8, go left; 6 > 3, go right; found. Three steps instead of checking all six nodes.

      ```cpp run
      #include <iostream>
      #include <memory>

      struct Node {
          int key;
          std::unique_ptr<Node> left, right;
          explicit Node(int k) : key(k) {}
      };

      void insert(std::unique_ptr<Node>& root, int key) {
          std::unique_ptr<Node>* slot = &root;          // a pointer to "the link we might fill"
          while (*slot) {
              slot = key < (*slot)->key ? &(*slot)->left : &(*slot)->right;
          }
          *slot = std::make_unique<Node>(key);          // fill the empty link
      }

      int depth_of(const Node* n, int key) {
          int depth = 0;
          while (n) {
              if (key == n->key) return depth;
              n = key < n->key ? n->left.get() : n->right.get();
              depth++;
          }
          return -1;
      }

      int main() {
          std::unique_ptr<Node> root;
          for (int k : {8, 3, 10, 1, 6, 14}) insert(root, k);
          std::cout << depth_of(root.get(), 6) << " " << depth_of(root.get(), 14) << " " << depth_of(root.get(), 5) << "\n";
      }
      ```

      ```output
      2 2 -1
      ```

      ### How insertion works

      A new key always goes into an **empty spot** at the bottom: walk down as if searching, and when you reach a null link, put the new node there. The trick is `slot`: a pointer to the `unique_ptr` link itself, not to a node. Following it down the tree, you end up pointing at exactly the link to fill, whether that's `root` or some node's `left` or `right`.

      ### Balance

      On a **balanced** tree, each step discards about half the nodes, so search and insert are O(log n). But insert the keys in sorted order (1, 2, 3, 4, ...) and every node goes to the right: the "tree" becomes a linked list, and operations become O(n). `std::map` and `std::set` are **self-balancing** BSTs (red-black trees) that rotate nodes to keep the height O(log n) no matter the insertion order.

      ### Your task

      `insert` is the loop above, plus a duplicate check (if the key equals the node's key, return `false`) and `size_++` on success. `contains` walks down the same way with a plain `const Node*`.

      **Your turn:** write `Bst::insert` (returns false for duplicates) and `Bst::contains`, both iterative.
    seed: |
      #include <memory>

      class Bst {
      public:
          bool insert(int key);
          bool contains(int key) const;
          int size() const { return size_; }

      private:
          struct Node {
              int key;
              std::unique_ptr<Node> left, right;
              explicit Node(int k) : key(k) {}
          };
          std::unique_ptr<Node> root_;
          int size_ = 0;
      };
    solution: |
      #include <memory>

      class Bst {
      public:
          bool insert(int key);
          bool contains(int key) const;
          int size() const { return size_; }

      private:
          struct Node {
              int key;
              std::unique_ptr<Node> left, right;
              explicit Node(int k) : key(k) {}
          };
          std::unique_ptr<Node> root_;
          int size_ = 0;
      };

      bool Bst::insert(int key) {
          std::unique_ptr<Node>* slot = &root_;
          while (*slot) {
              if (key == (*slot)->key) return false;
              slot = key < (*slot)->key ? &(*slot)->left : &(*slot)->right;
          }
          *slot = std::make_unique<Node>(key);
          size_++;
          return true;
      }

      bool Bst::contains(int key) const {
          const Node* n = root_.get();
          while (n) {
              if (key == n->key) return true;
              n = key < n->key ? n->left.get() : n->right.get();
          }
          return false;
      }
    harness: |
      int main() {
          Bst t;
          for (int k : {50, 30, 70, 20, 40, 60, 80}) t.insert(k);
          CHECK_EQ("size", t.size(), 7);
          CHECK_EQ("duplicate refused", t.insert(40), false);
          CHECK_EQ("contains 60", t.contains(60), true);
          CHECK_EQ("contains 20", t.contains(20), true);
          CHECK_EQ("missing 65", t.contains(65), false);
          Bst big;
          unsigned x = 7;
          int inserted = 0;
          for (int i = 0; i < 100000; i++) {
              x = x * 1103515245u + 12345u;
              inserted += big.insert(static_cast<int>(x >> 8));
          }
          CHECK_EQ("100,000 random keys", big.size(), inserted);
      }
    hints:
      - "Walk a pointer-to-slot down from `&root_`; stop at an empty slot."
      - "Go left when `key < (*slot)->key`, right when greater, and return false on equality."
      - "contains is the same walk with a plain `const Node*`."

  - title: Traversals and validation
    id: dsa-trees-3
    text: |
      To visit every node of a tree, you choose an **order**. The three classic depth-first orders differ only in **when** the node itself is handled relative to its subtrees:

      - **pre-order**: node, left, right (copying a tree, serializing it)
      - **in-order**: left, node, right (a BST comes out **sorted**)
      - **post-order**: left, right, node (deleting a tree, evaluating an expression tree)

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>

      struct Node {
          std::string v;
          std::unique_ptr<Node> left, right;
      };

      std::unique_ptr<Node> mk(std::string v, std::unique_ptr<Node> l = nullptr, std::unique_ptr<Node> r = nullptr) {
          return std::make_unique<Node>(Node{std::move(v), std::move(l), std::move(r)});
      }

      void pre(const Node* n)  { if (!n) return; std::cout << n->v << " "; pre(n->left.get()); pre(n->right.get()); }
      void in(const Node* n)   { if (!n) return; in(n->left.get()); std::cout << n->v << " "; in(n->right.get()); }
      void post(const Node* n) { if (!n) return; post(n->left.get()); post(n->right.get()); std::cout << n->v << " "; }

      int main() {
          /* The expression (2 + 3) * 4 as a tree:  *
                                                   / \
                                                  +   4
                                                 / \
                                                2   3     */
          auto root = mk("*", mk("+", mk("2"), mk("3")), mk("4"));
          std::cout << "pre:  "; pre(root.get());  std::cout << "\n";
          std::cout << "in:   "; in(root.get());   std::cout << "\n";
          std::cout << "post: "; post(root.get()); std::cout << "\n";
      }
      ```

      ```output
      pre:  * + 2 3 4 
      in:   2 + 3 * 4 
      post: 2 3 + 4 * 
      ```

      The three functions are identical except for where the `std::cout` line sits. Post-order gives **reverse Polish notation**, the order a calculator (or your stack evaluator from the containers module) needs: both operands before the operator.

      ### Checking that a tree is a valid BST

      A tempting check is "each left child is smaller than its parent and each right child is larger". It's a classic **wrong answer**:

      ```
            10
           /  \
          5    15
              /
             6        6 is left of 15 (fine locally), but it's in 10's RIGHT subtree, so it must be > 10
      ```

      The correct check passes an allowed **range** down the tree. The root may be anything. Going left, the node's key becomes the new upper limit; going right, it becomes the new lower limit. Every node must lie strictly inside the range it inherited from **all** its ancestors:

      ```
      is_bst(n, lo, hi):
          if n is empty: true
          if not (lo < n.key < hi): false
          return is_bst(n.left, lo, n.key) and is_bst(n.right, n.key, hi)
      ```

      The limits are `long` so that `LONG_MIN` and `LONG_MAX` can stand for "no limit" without clashing with any `int` key.

      **Your turn:** write `void in_order(const Node* n, std::vector<int>& out)` and `bool is_bst(const Node* n, long lo, long hi)` that checks all keys lie strictly between lo and hi (the test calls it with `LONG_MIN`, `LONG_MAX`).
    seed: |
      #include <climits>
      #include <memory>
      #include <vector>

      struct Node {
          int key;
          std::unique_ptr<Node> left, right;
      };

      void in_order(const Node* n, std::vector<int>& out) {

      }

      bool is_bst(const Node* n, long lo, long hi) {

      }
    solution: |
      #include <climits>
      #include <memory>
      #include <vector>

      struct Node {
          int key;
          std::unique_ptr<Node> left, right;
      };

      void in_order(const Node* n, std::vector<int>& out) {
          if (!n) return;
          in_order(n->left.get(), out);
          out.push_back(n->key);
          in_order(n->right.get(), out);
      }

      bool is_bst(const Node* n, long lo, long hi) {
          if (!n) return true;
          if (n->key <= lo || n->key >= hi) return false;
          return is_bst(n->left.get(), lo, n->key) && is_bst(n->right.get(), n->key, hi);
      }
    harness: |
      static std::unique_ptr<Node> mk(int k) { return std::unique_ptr<Node>(new Node{k, nullptr, nullptr}); }
      int main() {
          auto good = mk(8);
          good->left = mk(3);
          good->right = mk(10);
          good->left->left = mk(1);
          good->left->right = mk(6);
          std::vector<int> v;
          in_order(good.get(), v);
          CHECK_EQ("in-order is sorted", v, (std::vector<int>{1, 3, 6, 8, 10}));
          CHECK_EQ("valid BST", is_bst(good.get(), LONG_MIN, LONG_MAX), true);
          auto sneaky = mk(8);
          sneaky->left = mk(3);
          sneaky->left->right = mk(9);
          CHECK_EQ("9 is right of 3 but bigger than 8", is_bst(sneaky.get(), LONG_MIN, LONG_MAX), false);
          CHECK_EQ("empty tree is a BST", is_bst(nullptr, LONG_MIN, LONG_MAX), true);
      }
    hints:
      - "in_order: recurse left, push the key, recurse right."
      - "is_bst: an empty subtree is fine. Otherwise the key must satisfy lo < key < hi."
      - "Going left tightens the upper bound to the key; going right tightens the lower bound."

  - title: Level order with a queue
    id: dsa-trees-4
    text: |
      Depth-first orders dive down one branch before trying the next. **Breadth-first** traversal instead visits a tree **level by level**: the root, then all its children, then all their children. Instead of recursion it uses a **queue**:

      1. Put the root in the queue.
      2. Take the node at the front, handle it, and push its children to the back.
      3. Repeat until the queue is empty.

      Because children join at the **back**, every node of one level is handled before any node of the next.

      To separate the levels, process the queue in **batches**: at the start of each round, the queue holds exactly one level's nodes, so remember `q.size()` and pop exactly that many.

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <queue>
      #include <string>
      #include <vector>

      struct Emp {
          std::string name;
          std::vector<std::unique_ptr<Emp>> reports;    // any number of children
      };

      std::unique_ptr<Emp> emp(std::string n) { return std::make_unique<Emp>(Emp{std::move(n), {}}); }

      int main() {
          auto ceo = emp("Ava");
          ceo->reports.push_back(emp("Ben"));
          ceo->reports.push_back(emp("Cy"));
          ceo->reports[0]->reports.push_back(emp("Dee"));
          ceo->reports[1]->reports.push_back(emp("Eli"));
          ceo->reports[1]->reports.push_back(emp("Fay"));

          std::queue<const Emp*> q;
          q.push(ceo.get());
          int level = 0;
          while (!q.empty()) {
              std::size_t n = q.size();                  // everyone on this level
              std::cout << "level " << level++ << ":";
              for (std::size_t i = 0; i < n; i++) {
                  const Emp* e = q.front();
                  q.pop();
                  std::cout << " " << e->name;
                  for (const auto& r : e->reports) q.push(r.get());
              }
              std::cout << "\n";
          }
      }
      ```

      ```output
      level 0: Ava
      level 1: Ben Cy
      level 2: Dee Eli Fay
      ```

      ### Details

      - The queue holds plain `const Emp*` pointers. It doesn't own anything; the tree does.
      - Children are pushed while the current level is being processed, but they sit **behind** the current level's nodes, and the saved count `n` stops the inner loop before reaching them.
      - An empty tree (a null root) should return an empty result, so check before pushing it.

      The same technique finds **shortest paths** in graphs, as you'll see in the next module: breadth-first order reaches every node by the fewest possible steps.

      **Your turn:** write `std::vector<std::vector<int>> levels(const Node* root)`.
    seed: |
      #include <memory>
      #include <queue>
      #include <vector>

      struct Node {
          int key;
          std::unique_ptr<Node> left, right;
      };

      std::vector<std::vector<int>> levels(const Node* root) {

      }
    solution: |
      #include <memory>
      #include <queue>
      #include <vector>

      struct Node {
          int key;
          std::unique_ptr<Node> left, right;
      };

      std::vector<std::vector<int>> levels(const Node* root) {
          std::vector<std::vector<int>> out;
          if (!root) return out;
          std::queue<const Node*> q;
          q.push(root);
          while (!q.empty()) {
              std::size_t n = q.size();
              std::vector<int> level;
              for (std::size_t i = 0; i < n; i++) {
                  const Node* cur = q.front();
                  q.pop();
                  level.push_back(cur->key);
                  if (cur->left) q.push(cur->left.get());
                  if (cur->right) q.push(cur->right.get());
              }
              out.push_back(level);
          }
          return out;
      }
    harness: |
      static std::unique_ptr<Node> mk(int k) { return std::unique_ptr<Node>(new Node{k, nullptr, nullptr}); }
      int main() {
          auto r = mk(1);
          r->left = mk(2);
          r->right = mk(3);
          r->left->left = mk(4);
          r->right->left = mk(5);
          r->right->right = mk(6);
          auto lv = levels(r.get());
          CHECK_EQ("number of levels", lv.size(), 3u);
          CHECK_EQ("level 0", lv[0], (std::vector<int>{1}));
          CHECK_EQ("level 1", lv[1], (std::vector<int>{2, 3}));
          CHECK_EQ("level 2", lv[2], (std::vector<int>{4, 5, 6}));
          CHECK("empty tree", levels(nullptr).empty());
      }
    hints:
      - "Use `std::queue<const Node*>` starting with the root."
      - "Each round, read `q.size()` first, then pop exactly that many nodes into one level vector, pushing their children."

  - title: A binary heap by hand
    id: dsa-trees-5
    text: |
      A **binary heap** is a tree with a clever trick: it's stored in a plain array, with no pointers at all. The tree is always **complete** (every level full except possibly the last, which fills from the left), so the nodes can be numbered level by level, and the parent/child links are just arithmetic:

      ```
      index:    0   1   2   3   4   5
      parent(i) = (i - 1) / 2      children(i) = 2i + 1, 2i + 2
      ```

      ```
                 2                a = [2, 5, 3, 9, 6, 4]
               /   \
              5     3             children of index 1 (the 5): indexes 3 and 4 (9 and 6)
             / \   /              parent of index 5 (the 4): index 2 (the 3)
            9   6 4
      ```

      In a **min-heap**, every parent is ≤ its children, so the minimum is always at index 0. (The tree is not sorted beyond that: 9 and 4 are on different branches, in no particular order.)

      - **push**: append at the end, then **sift up**: swap with the parent while smaller.
      - **pop**: move the last element to the root, then **sift down**: swap with the smaller child while larger.

      Here's sift up, printed step by step:

      ```cpp run
      #include <iostream>
      #include <utility>
      #include <vector>

      void print(const std::vector<int>& a) {
          for (int x : a) std::cout << x << " ";
          std::cout << "\n";
      }

      int main() {
          std::vector<int> a = {2, 5, 3, 9, 6, 4};
          a.push_back(1);                             // new element at index 6
          print(a);
          std::size_t i = a.size() - 1;
          while (i > 0 && a[i] < a[(i - 1) / 2]) {    // smaller than its parent?
              std::swap(a[i], a[(i - 1) / 2]);
              i = (i - 1) / 2;
              print(a);
          }
          std::cout << "min is " << a[0] << "\n";
      }
      ```

      ```output
      2 5 3 9 6 4 1 
      2 5 1 9 6 4 3 
      1 5 2 9 6 4 3 
      min is 1
      ```

      ### Why it's O(log n)

      A complete tree with n nodes has about log₂ n levels. Sift up moves one level per swap, and so does sift down, so both operations do at most log n swaps. This is exactly what's inside `std::priority_queue`.

      ### Sift down for pop

      After moving the last element to index 0 (and removing the last slot), repeat: find the **smaller** of the node's children (check that each child index is `< size`); if it's smaller than the node, swap and continue from there; otherwise stop. Swapping with the smaller child is what keeps the heap rule true for both branches.

      **Your turn:** implement `MinHeap::push`, `MinHeap::pop` (assume non-empty) and `top`.
    seed: |
      #include <utility>
      #include <vector>

      class MinHeap {
      public:
          void push(int v);
          void pop();
          int top() const;
          bool empty() const { return a_.empty(); }
          std::size_t size() const { return a_.size(); }

      private:
          std::vector<int> a_;
      };
    solution: |
      #include <utility>
      #include <vector>

      class MinHeap {
      public:
          void push(int v);
          void pop();
          int top() const;
          bool empty() const { return a_.empty(); }
          std::size_t size() const { return a_.size(); }

      private:
          std::vector<int> a_;
      };

      void MinHeap::push(int v) {
          a_.push_back(v);
          std::size_t i = a_.size() - 1;
          while (i > 0) {
              std::size_t parent = (i - 1) / 2;
              if (a_[parent] <= a_[i]) break;
              std::swap(a_[parent], a_[i]);
              i = parent;
          }
      }

      void MinHeap::pop() {
          a_[0] = a_.back();
          a_.pop_back();
          std::size_t i = 0, n = a_.size();
          while (true) {
              std::size_t l = 2 * i + 1, r = 2 * i + 2, smallest = i;
              if (l < n && a_[l] < a_[smallest]) smallest = l;
              if (r < n && a_[r] < a_[smallest]) smallest = r;
              if (smallest == i) break;
              std::swap(a_[i], a_[smallest]);
              i = smallest;
          }
      }

      int MinHeap::top() const { return a_[0]; }
    forbid:
