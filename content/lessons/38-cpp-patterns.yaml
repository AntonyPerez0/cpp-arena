              CHECK("coin", t.handle(Event::Coin));
              CHECK("unlocked", t.state() == State::Unlocked);
              CHECK("extra coin accepted", t.handle(Event::Coin));
              CHECK("push", t.handle(Event::Push));
              CHECK("locked again", t.state() == State::Locked);
              CHECK_EQ("two coins", t.coins(), 2);
          }
