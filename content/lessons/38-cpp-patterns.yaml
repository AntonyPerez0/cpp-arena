id: cpp-patterns
title: Design patterns in modern C++
lang: cpp
phase: "C++: Professional C++"
summary: The patterns you'll meet in every large C++ codebase, written the modern way. Strategies as closures, a factory registry, observers with weak_ptr, pimpl, RAII wrappers for C libraries, and a table-driven state machine.
steps:
  - title: Strategies as closures
    id: cpp-patterns-1
    text: |
      A **design pattern** is a named, well-tested solution to a problem that keeps coming up. Knowing the names helps you recognize them in large codebases and talk about designs with other programmers. This module shows the ones you'll meet most, written the modern C++ way.

      The **Strategy** pattern swaps an algorithm at run time: how to sort, how to price, how to compress. The textbook version uses an abstract base class with one subclass per strategy. When a strategy is a single function, modern C++ just uses `std::function`, and a **function that returns a lambda** builds configured strategies:

      ```cpp run
      #include <functional>
      #include <iostream>
      #include <string>
      #include <vector>

      using Shipping = std::function<double(double weight_kg)>;

      Shipping flat_rate(double price) {
          return [price](double) { return price; };
      }

      Shipping per_kg(double rate, double minimum) {
          return [rate, minimum](double kg) {
              double cost = kg * rate;
              return cost < minimum ? minimum : cost;
          };
      }

      int main() {
          std::vector<std::pair<std::string, Shipping>> options = {
              {"standard", per_kg(1.5, 4.0)},
              {"express", flat_rate(12.0)},
          };
          for (double kg : {1.0, 10.0}) {
              for (const auto& [name, cost] : options) {
                  std::cout << kg << "kg " << name << ": " << cost(kg) << "\n";
              }
          }
      }
      ```

      ```output
      1kg standard: 4
      1kg express: 12
      10kg standard: 15
      10kg express: 12
      ```

      ### Closures

      Each lambda **captures** its settings (`price`, or `rate` and `minimum`), so every returned strategy remembers its own configuration after the factory function has returned. A lambda together with its captured values is called a **closure**. `per_kg(1.5, 4.0)` and `per_kg(2.0, 5.0)` are two independent strategies made by the same code.

      ### Your task

      - `percent_off(pct)` returns a lambda capturing `pct` that takes cents and subtracts `cents * pct / 100`.
      - `flat_off(amount)` subtracts `amount` but never goes below 0.
      - `Cart::total()` adds up `prices` and then calls `discount(sum)` **once** on the total.

      **Your turn:** write the strategy factories `percent_off(pct)` and `flat_off(amount)` (never below 0), and `Cart::total()`, which sums the prices and applies the cart's discount strategy once to the sum.
    seed: |
      #include <functional>
      #include <vector>

      using Discount = std::function<long(long)>;

      Discount percent_off(int pct) {

      }

      Discount flat_off(long amount) {

      }

      struct Cart {
          std::vector<long> prices;
          Discount discount = [](long cents) { return cents; };
          long total() const;
      };

      long Cart::total() const {

      }
    solution: |
      #include <functional>
      #include <vector>

      using Discount = std::function<long(long)>;

      Discount percent_off(int pct) {
          return [pct](long cents) { return cents - cents * pct / 100; };
      }

      Discount flat_off(long amount) {
          return [amount](long cents) { return cents > amount ? cents - amount : 0; };
      }

      struct Cart {
          std::vector<long> prices;
          Discount discount = [](long cents) { return cents; };
          long total() const;
      };

      long Cart::total() const {
          long sum = 0;
          for (long p : prices) sum += p;
          return discount(sum);
      }
    harness: |
      int main() {
          Cart c;
          c.prices = {2700, 1000, 300};
          CHECK_EQ("no discount", c.total(), 4000L);
          c.discount = percent_off(25);
          CHECK_EQ("25% off", c.total(), 3000L);
          c.discount = flat_off(500);
          CHECK_EQ("flat 500 off", c.total(), 3500L);
          c.discount = flat_off(9999);
          CHECK_EQ("never below 0", c.total(), 0L);
          auto ten = percent_off(10), half = percent_off(50);
          CHECK("each closure keeps its own pct", ten(1000) == 900 && half(1000) == 500);
      }
    hints:
      - "`return [pct](long cents) { return cents - cents * pct / 100; };`"
      - "flat_off: return 0 when the amount is bigger than the total."
      - "total(): sum the prices, then `return discount(sum);`"

  - title: A factory registry
    id: cpp-patterns-2
    text: |
      A **factory** creates objects by **name**: the name comes from a config file, a network message or a command line, and the result is returned through a base-class pointer. The naive version is a giant `if`/`else` chain that must be edited for every new type. Large codebases use a **registry** instead: a map from name to a **creator function**. Adding a type means registering one more entry, and the factory itself never changes.

      ```cpp run
      #include <functional>
      #include <iostream>
      #include <map>
      #include <memory>
      #include <string>

      struct Codec {
          virtual ~Codec() = default;
          virtual std::string encode(const std::string& s) const = 0;
      };

      struct Upper : Codec {
          std::string encode(const std::string& s) const override {
              std::string r = s;
              for (char& c : r) if (c >= 'a' && c <= 'z') c = char(c - 32);
              return r;
          }
      };

      struct Reverse : Codec {
          std::string encode(const std::string& s) const override { return {s.rbegin(), s.rend()}; }
      };

      int main() {
          std::map<std::string, std::function<std::unique_ptr<Codec>()>> registry;
          registry["upper"] = [] { return std::make_unique<Upper>(); };
          registry["reverse"] = [] { return std::make_unique<Reverse>(); };

          for (const char* name : {"reverse", "rot13", "upper"}) {
              auto it = registry.find(name);
              if (it == registry.end()) {
                  std::cout << name << ": unknown codec\n";
                  continue;
              }
              std::unique_ptr<Codec> c = it->second();       // call the creator
              std::cout << name << ": " << c->encode("hello") << "\n";
          }
      }
      ```

      ```output
      reverse: olleh
      rot13: unknown codec
      upper: HELLO
      ```

      ### How it works

      - Each map value is a function that takes nothing and returns a `std::unique_ptr<Codec>`. A capture-less lambda `[] { return std::make_unique<Upper>(); }` fits, because `unique_ptr<Upper>` converts to `unique_ptr<Codec>`.
      - `it->second()` calls the stored creator and gets a brand new object. The caller owns it, which the `unique_ptr` return type makes obvious.
      - Unknown names are looked up with `find`, never `[]`, which would insert an empty function.

      ### Your task

      - `add`: if `creators_` already contains the name, return `false`; otherwise store it (move the `std::function` in) and return `true`.
      - `create`: `find` the name; return `nullptr` if missing, otherwise call the creator.
      - `names`: a `std::map` is already sorted by key, so loop over it and collect the keys.

      **Your turn:** implement `Factory::add` (returns false if the name is already registered), `Factory::create` (returns `nullptr` for unknown names) and `Factory::names` (sorted).
    seed: |
      #include <functional>
      #include <map>
      #include <memory>
      #include <string>
      #include <vector>

      struct Weapon {
          virtual ~Weapon() = default;
          virtual int damage() const = 0;
      };

      class Factory {
      public:
          using Creator = std::function<std::unique_ptr<Weapon>()>;
          bool add(const std::string& name, Creator make);
          std::unique_ptr<Weapon> create(const std::string& name) const;
          std::vector<std::string> names() const;

      private:
          std::map<std::string, Creator> creators_;
      };
    solution: |
      #include <functional>
      #include <map>
      #include <memory>
      #include <string>
      #include <vector>

      struct Weapon {
          virtual ~Weapon() = default;
          virtual int damage() const = 0;
      };

      class Factory {
      public:
          using Creator = std::function<std::unique_ptr<Weapon>()>;
          bool add(const std::string& name, Creator make);
          std::unique_ptr<Weapon> create(const std::string& name) const;
          std::vector<std::string> names() const;

      private:
          std::map<std::string, Creator> creators_;
      };

      bool Factory::add(const std::string& name, Creator make) {
          return creators_.emplace(name, std::move(make)).second;
      }

      std::unique_ptr<Weapon> Factory::create(const std::string& name) const {
          auto it = creators_.find(name);
          if (it == creators_.end()) return nullptr;
          return it->second();
      }

      std::vector<std::string> Factory::names() const {
          std::vector<std::string> out;
          for (const auto& [name, make] : creators_) out.push_back(name);
          return out;
      }
    harness: |
      struct Ak : Weapon { int damage() const override { return 36; } };
      struct Awp : Weapon { int damage() const override { return 115; } };
      int main() {
          Factory f;
          CHECK_EQ("add ak", f.add("ak47", [] { return std::make_unique<Ak>(); }), true);
          f.add("awp", [] { return std::make_unique<Awp>(); });
          CHECK_EQ("duplicate name refused", f.add("awp", [] { return std::make_unique<Ak>(); }), false);
          auto w = f.create("awp");
          CHECK("created an awp", w && w->damage() == 115);
          CHECK("unknown gives nullptr", f.create("negev") == nullptr);
          CHECK_EQ("names sorted", f.names(), (std::vector<std::string>{"ak47", "awp"}));
          auto a = f.create("ak47"), b = f.create("ak47");
          CHECK("each create makes a new object", a && b && a.get() != b.get());
      }
    hints:
      - "`creators_.emplace(name, std::move(make)).second` is false when the key already existed."
      - "create: `find` the name; if missing return nullptr, otherwise call the creator: `it->second()`."
      - "std::map is already sorted by key, so names() just collects the keys."

  - title: Observers with weak_ptr
    id: cpp-patterns-3
    text: |
      In the **Observer** pattern, a subject (a stock ticker, a button, a scoreboard) notifies a list of listeners when something happens. The hard part in C++ is **lifetime**: if a listener is destroyed while the subject still holds a raw pointer to it, the next notification uses a dangling pointer and the program crashes, or worse.

      Storing `std::weak_ptr` solves it. The subject doesn't keep listeners alive, and `lock()` tells it whether each one still exists.

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>
      #include <vector>

      struct Screen {
          std::string name;
          void show(double price) const { std::cout << name << " shows " << price << "\n"; }
      };

      class Ticker {
      public:
          void attach(const std::shared_ptr<Screen>& s) { screens_.push_back(s); }
          void update(double price) {
              for (const auto& w : screens_) {
                  if (auto s = w.lock()) s->show(price);      // alive: notify
              }
          }
          std::size_t attached() const { return screens_.size(); }

      private:
          std::vector<std::weak_ptr<Screen>> screens_;
      };

      int main() {
          Ticker t;
          auto lobby = std::make_shared<Screen>(Screen{"lobby"});
          t.attach(lobby);
          {
              auto phone = std::make_shared<Screen>(Screen{"phone"});
              t.attach(phone);
              t.update(101.5);
          }                                 // phone is destroyed here
          t.update(99.0);                   // skipped safely: lock() returns empty
          std::cout << t.attached() << " entries still stored\n";
      }
      ```

      ```output
      lobby shows 101.5
      phone shows 101.5
      lobby shows 99
      2 entries still stored
      ```

      ### How it works

      - The owners (`main` here) hold `shared_ptr`s. The ticker only holds `weak_ptr`s, so it never keeps a screen alive.
      - `lock()` returns a `shared_ptr` that keeps the object alive **during** the call, or an empty one if it's already gone.

      ### The leftover entry

      Notice the ticker still stores 2 entries after `phone` died. The dead `weak_ptr` is harmless, but over time a long-running subject would collect thousands of them. Your task fixes this: remove expired entries while publishing. `std::erase_if(listeners_, [](const auto& w) { return w.expired(); })` does it in one call, or you can build a new vector of the live ones as you notify.

      **Your turn:** implement `Scoreboard::subscribe` and `Scoreboard::publish`. `publish` notifies every living listener in subscription order, **removes** expired ones, and returns how many were notified.
    seed: |
      #include <memory>
      #include <string>
      #include <vector>

      struct Listener {
          virtual ~Listener() = default;
          virtual void on_score(const std::string& team, int score) = 0;
      };

      class Scoreboard {
      public:
          void subscribe(const std::shared_ptr<Listener>& l);
          int publish(const std::string& team, int score);
          std::size_t listener_count() const { return listeners_.size(); }

      private:
          std::vector<std::weak_ptr<Listener>> listeners_;
      };
    solution: |
      #include <memory>
      #include <string>
      #include <vector>

      struct Listener {
          virtual ~Listener() = default;
          virtual void on_score(const std::string& team, int score) = 0;
      };

      class Scoreboard {
      public:
          void subscribe(const std::shared_ptr<Listener>& l);
          int publish(const std::string& team, int score);
          std::size_t listener_count() const { return listeners_.size(); }

      private:
          std::vector<std::weak_ptr<Listener>> listeners_;
      };

      void Scoreboard::subscribe(const std::shared_ptr<Listener>& l) {
          listeners_.push_back(l);
      }

      int Scoreboard::publish(const std::string& team, int score) {
          int notified = 0;
          for (auto it = listeners_.begin(); it != listeners_.end();) {
              if (auto l = it->lock()) {
                  l->on_score(team, score);
                  notified++;
                  ++it;
              } else {
                  it = listeners_.erase(it);
              }
          }
          return notified;
      }
    harness: |
      struct Log : Listener {
          std::string text;
          void on_score(const std::string& team, int score) override { text += team + ":" + std::to_string(score) + " "; }
      };
      int main() {
          Scoreboard sb;
          auto a = std::make_shared<Log>();
          auto b = std::make_shared<Log>();
          sb.subscribe(a);
          sb.subscribe(b);
          CHECK_EQ("two notified", sb.publish("navi", 1), 2);
          CHECK("scoreboard does not keep listeners alive", a.use_count() == 1);
          b.reset();
          CHECK_EQ("destroyed listener skipped", sb.publish("faze", 2), 1);
          CHECK_EQ("expired entry removed", sb.listener_count(), 1u);
          CHECK_EQ("a saw both", a->text, std::string("navi:1 faze:2 "));
      }
    hints:
      - "subscribe: `listeners_.push_back(l);` converts the shared_ptr to a weak_ptr."
      - "publish: loop with an iterator; `if (auto l = it->lock())` notify and advance, else `it = listeners_.erase(it);`"

  - title: Pimpl
    id: cpp-patterns-4
    text: |
      In a big codebase, a header is included by hundreds of files. Changing a class's **private members** changes its header, so every one of those files must recompile, and in a shared library it breaks binary compatibility with programs built against the old version. The **pimpl** idiom ("pointer to implementation") hides the private data behind a pointer to a struct that the header only **declares**.

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>
      #include <vector>

      // ---- counter.h: what users see ----
      class WordCounter {
      public:
          WordCounter();
          ~WordCounter();
          void add(const std::string& w);
          int distinct() const;

      private:
          struct Impl;                         // declared, not defined: "incomplete"
          std::unique_ptr<Impl> impl_;
      };

      // ---- counter.cpp: private details, free to change ----
      struct WordCounter::Impl {
          std::vector<std::string> seen;
      };

      WordCounter::WordCounter() : impl_(std::make_unique<Impl>()) {}
      WordCounter::~WordCounter() = default;   // Impl is complete here

      void WordCounter::add(const std::string& w) {
          for (const auto& s : impl_->seen) if (s == w) return;
          impl_->seen.push_back(w);
      }

      int WordCounter::distinct() const { return (int)impl_->seen.size(); }

      int main() {
          WordCounter c;
          for (const char* w : {"to", "be", "or", "not", "to", "be"}) c.add(w);
          std::cout << c.distinct() << "\n";
      }
      ```

      ```output
      4
      ```

      ### How it works

      - The header only says `struct Impl;` and holds a `std::unique_ptr<Impl>`. Users of the class can't see or depend on what's inside `Impl`.
      - The `.cpp` file defines `Impl` and every member function. You can now change the private data (switch the vector to a set, add a cache) without touching the header.
      - Every member function reaches the data through `impl_->...`.

      ### The destructor trap

      `unique_ptr<Impl>` must know `Impl`'s full definition to delete it. If you let the compiler generate the destructor **in the header**, it's generated where `Impl` is incomplete, and you get a confusing error about `sizeof` of an incomplete type. The fix is to **declare** the destructor in the header and **define** it (even as `= default`) in the `.cpp` file, after `Impl`. The same applies to the move constructor and move assignment.

      ### Your task

      Define `struct Roster::Impl` with a `std::vector<std::string>`, then the constructor (create the Impl with `make_unique`), `Roster::~Roster() = default;`, `Roster::Roster(Roster&&) noexcept = default;`, and `add` and `count` working through `impl_`.

      **Your turn:** the "header" part is written. Write the "source file" part: define `Impl` (holding a `std::vector<std::string>` of names), the constructor, destructor, move constructor, `add` and `count`.
    seed: |
      #include <memory>
      #include <string>
      #include <vector>

      // ---- roster.h ----
      class Roster {
      public:
          Roster();
          ~Roster();
          Roster(Roster&&) noexcept;
          void add(const std::string& name);
          int count() const;

      private:
          struct Impl;
          std::unique_ptr<Impl> impl_;
      };

      // ---- roster.cpp ----
    solution: |
      #include <memory>
      #include <string>
      #include <vector>

      // ---- roster.h ----
      class Roster {
      public:
          Roster();
          ~Roster();
          Roster(Roster&&) noexcept;
          void add(const std::string& name);
          int count() const;

      private:
          struct Impl;
          std::unique_ptr<Impl> impl_;
      };

      // ---- roster.cpp ----
      struct Roster::Impl {
          std::vector<std::string> names;
      };

      Roster::Roster() : impl_(std::make_unique<Impl>()) {}
      Roster::~Roster() = default;
      Roster::Roster(Roster&&) noexcept = default;

      void Roster::add(const std::string& name) { impl_->names.push_back(name); }
      int Roster::count() const { return static_cast<int>(impl_->names.size()); }
    harness: |
      #include <type_traits>
      int main() {
          Roster r;
          r.add("karrigan");
          r.add("ropz");
          CHECK_EQ("count", r.count(), 2);
          Roster moved(std::move(r));
          CHECK_EQ("moved roster keeps the data", moved.count(), 2);
          CHECK("still not copyable (unique_ptr member)", !std::is_copy_constructible_v<Roster>);
          CHECK_EQ("public size is one pointer", sizeof(Roster), sizeof(void*));
      }
    hints:
      - "`struct Roster::Impl { std::vector<std::string> names; };`"
      - "`Roster::Roster() : impl_(std::make_unique<Impl>()) {}`, and `Roster::~Roster() = default;` after Impl is defined."
      - "`Roster::Roster(Roster&&) noexcept = default;` also needs Impl complete, so it goes here too."

  - title: RAII wrappers for C libraries
    id: cpp-patterns-5
    text: |
      Professional C++ constantly calls **C libraries**: OS APIs, databases, compression, crypto. They hand out raw handles that you must release with a specific function: `FILE*` with `fclose`, `sqlite3*` with `sqlite3_close`, and so on. Forgetting, or releasing twice, is the same class of bug as `malloc`/`free`.

      The fix is to wrap each handle **immediately** in a `std::unique_ptr` with a **custom deleter**: a small type whose `operator()` releases the handle. Then it's released on every path, exactly once, automatically.

      ```cpp run
      #include <cstdio>
      #include <iostream>
      #include <memory>

      struct FileCloser {
          void operator()(std::FILE* f) const {
              if (f) {
                  std::fclose(f);
                  std::cout << "(closed)\n";
              }
          }
      };
      using File = std::unique_ptr<std::FILE, FileCloser>;

      int count_lines(const char* path) {
          File f(std::fopen(path, "r"));
          if (!f) return -1;                    // nothing to close; early return is safe
          int n = 0;
          for (int c; (c = std::fgetc(f.get())) != EOF; ) {
              if (c == '\n') n++;
          }
          return n;                             // f closes itself here
      }

      int main() {
          {
              File out(std::fopen("data.txt", "w"));
              std::fputs("one\ntwo\nthree\n", out.get());
          }                                     // closed (and flushed) here
          std::cout << count_lines("data.txt") << " lines\n";
          std::cout << count_lines("missing.txt") << "\n";
      }
      ```

      ```output
      (closed)
      (closed)
      3 lines
      -1
      ```

      ### How it works

      - `std::unique_ptr<std::FILE, FileCloser>` is a unique_ptr whose second template argument says **how** to delete. Instead of `delete`, it calls `FileCloser{}(ptr)`.
      - `f.get()` gives the raw `FILE*` for the C functions.
      - An empty `unique_ptr` never calls the deleter, so a failed `fopen` (null) needs no special handling. The `if (f)` check inside the deleter is extra safety.
      - The `File` alias keeps the long type readable.

      ### extern "C": calling between C and C++

      C++ encodes each function's parameter types into its name in the compiled code (**name mangling**, which is how overloading works), and C doesn't. So when C++ code calls a function that was compiled as C, it has to be told, or the linker looks for the wrong name and reports `undefined reference`. C libraries' headers do this themselves:

      ```cpp
      #ifdef __cplusplus
      extern "C" {
      #endif
      int sqlite3_close(sqlite3 *db);
      #ifdef __cplusplus
      }
      #endif
      ```

      `__cplusplus` is only defined by C++ compilers, so C sees a plain declaration and C++ sees it inside `extern "C"`. The same keyword works in the other direction: an `extern "C"` function written in C++ can be called from C, and from Python, Rust or any other language that can call C, as long as its parameters and return type are plain C types. The standard C headers (`<cstdio>` and friends) already handle this, which is why the example above calls `std::fopen` directly.

      ### Your task

      - `open_file(path, mode)` returns `File(std::fopen(path.c_str(), mode.c_str()))` (or with whatever parameter types you choose).
      - `first_line` opens the file, returns `std::nullopt` if that fails, then reads characters with `fgetc` until `'\n'` or `EOF`. If nothing at all was read (an empty file), return `std::nullopt`.

      **Your turn:** write the `FileCloser`, the `File` alias, `File open_file(path, mode)`, and `std::optional<std::string> first_line(path)`, which returns the file's first line (without the newline) or `std::nullopt` if it can't be opened or is empty. No manual `fclose` in `first_line`.
    seed: |
      #include <cstdio>
      #include <memory>
      #include <optional>
      #include <string>

      // FileCloser, File and open_file here

      std::optional<std::string> first_line(const std::string& path) {

      }
    solution: |
      #include <cstdio>
      #include <memory>
      #include <optional>
      #include <string>

      // FileCloser, File and open_file here
      struct FileCloser {
          void operator()(std::FILE* f) const {
              if (f) std::fclose(f);
          }
      };
      using File = std::unique_ptr<std::FILE, FileCloser>;

      File open_file(const std::string& path, const char* mode) {
          return File(std::fopen(path.c_str(), mode));
      }

      std::optional<std::string> first_line(const std::string& path) {
          File f = open_file(path, "r");
          if (!f) return std::nullopt;
          char buf[256];
          if (!std::fgets(buf, sizeof buf, f.get())) return std::nullopt;
          std::string line(buf);
          if (!line.empty() && line.back() == '\n') line.pop_back();
          return line;
      }
    forbid:
      - pattern: "first_line[\\s\\S]*fclose\\s*\\(\\s*f"
        message: "Let the File's deleter close the handle; don't call fclose by hand in first_line."
    harness: |
      int main() {
          CHECK_EQ("first line", first_line("maps.txt").value_or("?"), std::string("de_dust2"));
          CHECK("missing file", !first_line("missing.txt"));
          CHECK("empty file", !first_line("empty.txt"));
          {
              File w = open_file("out.txt", "w");
              CHECK("opened for writing", w != nullptr);
              std::fputs("written\n", w.get());
          }
          CHECK_EQ("closed (and flushed) at end of scope", first_line("out.txt").value_or("?"), std::string("written"));
          CHECK_EQ("File is one pointer wide", sizeof(File), sizeof(std::FILE*));
      }
    tests:
      - files:
