      - task: |
          Write a general cleanup guard: `template <typename F> class ScopeExit` that runs its function when it's destroyed, unless `dismiss()` was called. It must be move-only: moving hands the job over, so the function runs **once**.
        seed: |
          #include <utility>

          template <typename F>
          class ScopeExit {
          public:
              explicit ScopeExit(F f) : f_(std::move(f)) {}

          private:
              F f_;
          };
        solution: |
          #include <utility>

          template <typename F>
          class ScopeExit {
          public:
              explicit ScopeExit(F f) : f_(std::move(f)) {}
              ~ScopeExit() {
                  if (active_) f_();
              }
              ScopeExit(ScopeExit&& o) noexcept : f_(std::move(o.f_)), active_(std::exchange(o.active_, false)) {}
              ScopeExit(const ScopeExit&) = delete;
              ScopeExit& operator=(const ScopeExit&) = delete;
              ScopeExit& operator=(ScopeExit&&) = delete;
              void dismiss() { active_ = false; }

          private:
              F f_;
              bool active_ = true;
          };
        harness: |
          #include <type_traits>
          template <typename F>
          ScopeExit<F> make_guard(F f) { return ScopeExit<F>(std::move(f)); }
