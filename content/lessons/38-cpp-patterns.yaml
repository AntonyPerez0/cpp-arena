        solution: |
          #include <map>
          #include <utility>

          enum class State { Locked, Unlocked };
          enum class Event { Coin, Push };

          class Turnstile {
          public:
              bool handle(Event e) {
                  static const std::map<std::pair<State, Event>, State> table = {
                      {{State::Locked, Event::Coin}, State::Unlocked},
                      {{State::Unlocked, Event::Push}, State::Locked},
                      {{State::Unlocked, Event::Coin}, State::Unlocked},
                  };
                  auto it = table.find({state_, e});
                  if (it == table.end()) return false;
                  if (e == Event::Coin) coins_++;
                  state_ = it->second;
                  return true;
              }
              State state() const { return state_; }
              int coins() const { return coins_; }

          private:
              State state_ = State::Locked;
              int coins_ = 0;
          };
