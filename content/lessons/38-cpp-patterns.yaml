          Write a turnstile as a **table**: a `std::map` from `{State, Event}` pairs to the next state. A coin unlocks a locked turnstile, a push locks an unlocked one, and a coin while unlocked keeps it unlocked. A push while locked isn't in the table, so `handle` returns false. `coins()` counts accepted coins.
