          #include <string>
          #include <vector>

          struct Listener {
              virtual ~Listener() = default;
              virtual void on_score(const std::string& team, int score) = 0;
          };

          class Scoreboard {
          public:
              void subscribe(const std::shared_ptr<Listener>& l, const std::string& team = "");
              int publish(const std::string& team, int score);
              std::size_t listener_count() const;

          private:

          };
        solution: |
          #include <memory>
          #include <string>
          #include <vector>

          struct Listener {
              virtual ~Listener() = default;
              virtual void on_score(const std::string& team, int score) = 0;
          };

          class Scoreboard {
          public:
              void subscribe(const std::shared_ptr<Listener>& l, const std::string& team = "") { subs_.push_back({l, team}); }
              int publish(const std::string& team, int score) {
                  int n = 0;
                  std::vector<Sub> alive;
                  for (auto& s : subs_) {
                      auto l = s.listener.lock();
                      if (!l) continue;
                      if (s.team.empty() || s.team == team) {
                          l->on_score(team, score);
                          n++;
                      }
                      alive.push_back(s);
                  }
                  subs_ = std::move(alive);
                  return n;
              }
              std::size_t listener_count() const { return subs_.size(); }

          private:
              struct Sub {
                  std::weak_ptr<Listener> listener;
                  std::string team;
              };
              std::vector<Sub> subs_;
          };
