        solution: |
          #include <functional>
          #include <map>
          #include <memory>
          #include <string>
          #include <vector>

          struct Weapon {
              virtual ~Weapon() = default;
              virtual int damage() const = 0;
          };

          class Factory {
          public:
              using Creator = std::function<std::unique_ptr<Weapon>()>;
              bool add(const std::string& name, Creator make) { return creators_.emplace(name, std::move(make)).second; }
              std::unique_ptr<Weapon> create(const std::string& name) const {
                  auto it = creators_.find(name);
                  return it == creators_.end() ? nullptr : it->second();
              }

          private:
              std::map<std::string, Creator> creators_;
          };

          // register_type and create_all here
          template <typename T>
          bool register_type(Factory& f, const std::string& name) {
              return f.add(name, [] { return std::make_unique<T>(); });
          }

          std::vector<std::unique_ptr<Weapon>> create_all(const Factory& f, const std::vector<std::string>& names) {
              std::vector<std::unique_ptr<Weapon>> out;
              for (const auto& n : names) {
                  if (auto w = f.create(n)) out.push_back(std::move(w));
              }
              return out;
          }
        harness: |
          struct Ak : Weapon { int damage() const override { return 36; } };
          struct Awp : Weapon { int damage() const override { return 115; } };
          int main() {
              Factory f;
              CHECK("register Ak", register_type<Ak>(f, "ak47"));
              CHECK("register Awp", register_type<Awp>(f, "awp"));
              CHECK("name taken", !register_type<Ak>(f, "awp"));
              auto ws = create_all(f, {"awp", "negev", "ak47", "awp"});
              CHECK_EQ("unknown skipped", ws.size(), 3u);
              int total = 0;
              for (const auto& w : ws) total += w->damage();
              CHECK_EQ("total damage", total, 115 + 36 + 115);
          }
        hints:
          - "The lambda needs no captures: `[] { return std::make_unique<T>(); }`, where `T` comes from the template."

  - title: Observers with weak_ptr
    id: cpp-patterns-3
    text: |
      In the **Observer** pattern, a subject (a stock ticker, a button, a scoreboard) notifies a list of listeners when something happens. The hard part in C++ is **lifetime**: if a listener is destroyed while the subject still holds a raw pointer to it, the next notification uses a dangling pointer and the program crashes, or worse.

      Storing `std::weak_ptr` solves it. The subject doesn't keep listeners alive, and `lock()` tells it whether each one still exists.

      ```cpp run
      #include <iostream>
      #include <memory>
      #include <string>
      #include <vector>

      struct Screen {
          std::string name;
          void show(double price) const { std::cout << name << " shows " << price << "\n"; }
      };

      class Ticker {
      public:
          void attach(const std::shared_ptr<Screen>& s) { screens_.push_back(s); }
          void update(double price) {
              for (const auto& w : screens_) {
                  if (auto s = w.lock()) s->show(price);      // alive: notify
              }
          }
          std::size_t attached() const { return screens_.size(); }

      private:
          std::vector<std::weak_ptr<Screen>> screens_;
      };

      int main() {
          Ticker t;
          auto lobby = std::make_shared<Screen>(Screen{"lobby"});
          t.attach(lobby);
          {
              auto phone = std::make_shared<Screen>(Screen{"phone"});
              t.attach(phone);
              t.update(101.5);
          }                                 // phone is destroyed here
          t.update(99.0);                   // skipped safely: lock() returns empty
          std::cout << t.attached() << " entries still stored\n";
      }
      ```

      ```output
      lobby shows 101.5
      phone shows 101.5
      lobby shows 99
      2 entries still stored
      ```

      ### How it works

      - The owners (`main` here) hold `shared_ptr`s. The ticker only holds `weak_ptr`s, so it never keeps a screen alive.
      - `lock()` returns a `shared_ptr` that keeps the object alive **during** the call, or an empty one if it's already gone.

      ### The leftover entry

      Notice the ticker still stores 2 entries after `phone` died. The dead `weak_ptr` is harmless, but over time a long-running subject would collect thousands of them. Your task fixes this: remove expired entries while publishing. `std::erase_if(listeners_, [](const auto& w) { return w.expired(); })` does it in one call, or you can build a new vector of the live ones as you notify.

      **Your turn:** implement `Scoreboard::subscribe` and `Scoreboard::publish`. `publish` notifies every living listener in subscription order, **removes** expired ones, and returns how many were notified.
    seed: |
      #include <memory>
      #include <string>
      #include <vector>

      struct Listener {
          virtual ~Listener() = default;
          virtual void on_score(const std::string& team, int score) = 0;
      };

      class Scoreboard {
      public:
          void subscribe(const std::shared_ptr<Listener>& l);
          int publish(const std::string& team, int score);
          std::size_t listener_count() const { return listeners_.size(); }

      private:
          std::vector<std::weak_ptr<Listener>> listeners_;
      };
    solution: |
      #include <memory>
      #include <string>
      #include <vector>

      struct Listener {
          virtual ~Listener() = default;
          virtual void on_score(const std::string& team, int score) = 0;
      };

      class Scoreboard {
      public:
          void subscribe(const std::shared_ptr<Listener>& l);
          int publish(const std::string& team, int score);
          std::size_t listener_count() const { return listeners_.size(); }

      private:
          std::vector<std::weak_ptr<Listener>> listeners_;
      };

      void Scoreboard::subscribe(const std::shared_ptr<Listener>& l) {
          listeners_.push_back(l);
      }

      int Scoreboard::publish(const std::string& team, int score) {
          int notified = 0;
          for (auto it = listeners_.begin(); it != listeners_.end();) {
              if (auto l = it->lock()) {
                  l->on_score(team, score);
                  notified++;
                  ++it;
              } else {
                  it = listeners_.erase(it);
              }
          }
          return notified;
      }
    harness: |
      struct Log : Listener {
          std::string text;
          void on_score(const std::string& team, int score) override { text += team + ":" + std::to_string(score) + " "; }
      };
      int main() {
          Scoreboard sb;
          auto a = std::make_shared<Log>();
          auto b = std::make_shared<Log>();
          sb.subscribe(a);
          sb.subscribe(b);
          CHECK_EQ("two notified", sb.publish("navi", 1), 2);
          CHECK("scoreboard does not keep listeners alive", a.use_count() == 1);
          b.reset();
          CHECK_EQ("destroyed listener skipped", sb.publish("faze", 2), 1);
          CHECK_EQ("expired entry removed", sb.listener_count(), 1u);
          CHECK_EQ("a saw both", a->text, std::string("navi:1 faze:2 "));
      }
    hints:
      - "subscribe: `listeners_.push_back(l);` converts the shared_ptr to a weak_ptr."
      - "publish: loop with an iterator; `if (auto l = it->lock())` notify and advance, else `it = listeners_.erase(it);`"
    more:
      - task: |
          Unsubscribing by hand is easy to forget, so hand out an RAII `Subscription`. `Signal::connect(fn)` stores the callback under a new id and returns a `Subscription`; destroying the subscription removes the callback. `emit(v)` calls every connected callback, and `size()` counts them. `Subscription` is move-only.
        seed: |
          #include <functional>
          #include <map>
          #include <utility>

          class Signal;

          class Subscription {
          public:
              Subscription(Signal* s, int id) : signal_(s), id_(id) {}
              // destructor and move operations here

          private:
              Signal* signal_;
              int id_;
          };

          class Signal {
          public:
              Subscription connect(std::function<void(int)> fn);
              void emit(int v) const;
              int size() const;
              void disconnect(int id);

          private:
              std::map<int, std::function<void(int)>> slots_;
              int next_id_ = 0;
          };
        solution: |
          #include <functional>
          #include <map>
          #include <utility>

          class Signal;

          class Subscription {
          public:
              Subscription(Signal* s, int id) : signal_(s), id_(id) {}
              // destructor and move operations here
              ~Subscription();
              Subscription(Subscription&& o) noexcept : signal_(std::exchange(o.signal_, nullptr)), id_(o.id_) {}
              Subscription& operator=(Subscription&& o) noexcept;
              Subscription(const Subscription&) = delete;
              Subscription& operator=(const Subscription&) = delete;

          private:
              Signal* signal_;
              int id_;
          };

          class Signal {
          public:
              Subscription connect(std::function<void(int)> fn) {
                  int id = next_id_++;
                  slots_[id] = std::move(fn);
                  return Subscription(this, id);
              }
              void emit(int v) const {
                  for (const auto& [id, fn] : slots_) fn(v);
              }
              int size() const { return (int)slots_.size(); }
              void disconnect(int id) { slots_.erase(id); }

          private:
              std::map<int, std::function<void(int)>> slots_;
              int next_id_ = 0;
          };

          Subscription::~Subscription() {
              if (signal_) signal_->disconnect(id_);
          }

          Subscription& Subscription::operator=(Subscription&& o) noexcept {
              if (this != &o) {
                  if (signal_) signal_->disconnect(id_);
                  signal_ = std::exchange(o.signal_, nullptr);
                  id_ = o.id_;
              }
              return *this;
          }
        harness: |
          #include <type_traits>
          int main() {
              Signal s;
              int a = 0, b = 0;
              auto sub_a = s.connect([&](int v) { a += v; });
              {
                  auto sub_b = s.connect([&](int v) { b += v; });
                  s.emit(5);
                  CHECK_EQ("two connected", s.size(), 2);
              }
              CHECK_EQ("b unsubscribed at the end of its scope", s.size(), 1);
              s.emit(1);
              CHECK("a got both, b only the first", a == 6 && b == 5);
              Subscription moved = std::move(sub_a);
              CHECK_EQ("moving doesn't disconnect", s.size(), 1);
              moved = s.connect([&](int v) { b += 100 * v; });
              CHECK_EQ("assigning over it disconnects the old one", s.size(), 1);
              s.emit(1);
              CHECK("only the new callback ran", a == 6 && b == 105);
              CHECK("not copyable", !std::is_copy_constructible_v<Subscription>);
          }
        hints:
          - "The move constructor takes the signal pointer and leaves `nullptr` behind, so the moved-from destructor does nothing."
          - "`~Subscription` needs `Signal` to be complete, so define it after the `Signal` class."
      - task: |
          Listeners can now subscribe to **one team** or to all of them (an empty team string). `publish(team, score)` notifies the living listeners interested in that team, in subscription order, removes expired ones, and returns how many it notified. The scoreboard must not keep listeners alive.
