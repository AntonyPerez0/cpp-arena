      - task: |
          Recognise numbers like `-12.5` with an explicit state machine: an optional sign, one or more digits, then optionally a `.` followed by one or more digits. Write `bool is_number(std::string_view s)` with an `enum class` of states and a loop that moves between them one character at a time. Only some states accept at the end.
        seed: |
          #include <string_view>

          bool is_number(std::string_view s) {

          }
        solution: |
          #include <string_view>

          bool is_number(std::string_view s) {
              enum class St { Start, Sign, Int, Dot, Frac, Fail };
              St st = St::Start;
              for (char c : s) {
                  bool digit = c >= '0' && c <= '9';
                  switch (st) {
                      case St::Start: st = (c == '-' || c == '+') ? St::Sign : digit ? St::Int : St::Fail; break;
                      case St::Sign: st = digit ? St::Int : St::Fail; break;
                      case St::Int: st = digit ? St::Int : c == '.' ? St::Dot : St::Fail; break;
                      case St::Dot: st = digit ? St::Frac : St::Fail; break;
                      case St::Frac: st = digit ? St::Frac : St::Fail; break;
                      case St::Fail: return false;
                  }
              }
              return st == St::Int || st == St::Frac;
          }
        require:
          - pattern: "enum\\s+class"
            message: "Name the states with an `enum class`."
        harness: |
          int main() {
              CHECK("-12.5", is_number("-12.5"));
              CHECK("42", is_number("42"));
              CHECK("+7", is_number("+7"));
              CHECK("0.25", is_number("0.25"));
              CHECK("12. has no fraction digits", !is_number("12."));
              CHECK(".5 has no integer digits", !is_number(".5"));
              CHECK("just a sign", !is_number("-"));
              CHECK("two dots", !is_number("1.2.3"));
              CHECK("letters", !is_number("1e5"));
              CHECK("empty", !is_number(""));
          }
        hints:
          - "States such as Start, Sign, Int, Dot, Frac and Fail. Each character moves you to a new state."
          - "At the end, accept only if you stopped in Int or Frac."
