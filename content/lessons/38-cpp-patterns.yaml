        solution: |
          #include <functional>
          #include <map>
          #include <memory>
          #include <string>

          struct Unit {
              virtual ~Unit() = default;
              virtual int hp() const = 0;
          };

          class UnitFactory {
          public:
              using Creator = std::function<std::unique_ptr<Unit>(int level)>;
              bool add(const std::string& name, Creator make) { return creators_.emplace(name, std::move(make)).second; }
              std::unique_ptr<Unit> create(const std::string& name, int level) const {
                  auto it = creators_.find(name);
                  return it == creators_.end() ? nullptr : it->second(level);
              }
              bool remove(const std::string& name) { return creators_.erase(name) > 0; }

          private:
              std::map<std::string, Creator> creators_;
          };
        harness: |
          struct Grunt : Unit {
              int level;
              explicit Grunt(int l) : level(l) {}
              int hp() const override { return 50 + 10 * level; }
          };
          int main() {
              UnitFactory f;
              CHECK("add grunt", f.add("grunt", [](int l) { return std::make_unique<Grunt>(l); }));
              CHECK("name taken", !f.add("grunt", [](int l) { return std::make_unique<Grunt>(l + 1); }));
              auto g = f.create("grunt", 3);
              CHECK("level passed on", g && g->hp() == 80);
              CHECK("unknown", f.create("dragon", 1) == nullptr);
              CHECK("remove", f.remove("grunt"));
              CHECK("remove again", !f.remove("grunt"));
              CHECK("gone", f.create("grunt", 1) == nullptr);
          }
