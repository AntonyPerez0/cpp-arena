              auto all = std::make_shared<Log>();
              auto navi_fan = std::make_shared<Log>();
              auto faze_fan = std::make_shared<Log>();
              sb.subscribe(all);
              sb.subscribe(navi_fan, "navi");
              sb.subscribe(faze_fan, "faze");
              CHECK_EQ("navi scores", sb.publish("navi", 1), 2);
              CHECK_EQ("faze scores", sb.publish("faze", 1), 2);
              CHECK("listeners aren't kept alive", all.use_count() == 1);
              CHECK_EQ("all saw both", all->text, std::string("navi:1 faze:1 "));
              CHECK_EQ("navi fan saw navi only", navi_fan->text, std::string("navi:1 "));
              faze_fan.reset();
              CHECK_EQ("expired listener skipped", sb.publish("faze", 2), 1);
              CHECK_EQ("and removed", sb.listener_count(), 2u);
          }
