  - title: "Challenge: a table-driven state machine"
    id: cpp-patterns-6
    text: |
      Protocols, UI flows, order pipelines and game rounds are **state machines**: the thing is always in exactly one **state**, and **events** move it to another state, but only along legal paths. An order can go from Paid to Shipped, never from Shipped back to Cart.

      Encoding the legal transitions in a **table**, instead of nested `if`s scattered through the code, makes them easy to review (the table **is** the specification), test and extend.

      ```cpp run
      #include <iostream>
      #include <optional>

      enum class Door { Closed, Open, Locked };
      enum class Action { Open, Close, Lock, Unlock };

      struct Transition {
          Door from;
          Action on;
          Door to;
      };

      constexpr Transition rules[] = {
          {Door::Closed, Action::Open, Door::Open},
          {Door::Open, Action::Close, Door::Closed},
          {Door::Closed, Action::Lock, Door::Locked},
          {Door::Locked, Action::Unlock, Door::Closed},
      };

      std::optional<Door> next(Door d, Action a) {
          for (const auto& r : rules) {
              if (r.from == d && r.on == a) return r.to;
          }
          return std::nullopt;                  // not in the table: illegal
      }

      const char* name(Door d) {
          switch (d) {
              case Door::Closed: return "closed";
              case Door::Open: return "open";
              case Door::Locked: return "locked";
          }
          return "?";
      }

      int main() {
          Door d = Door::Closed;
          for (Action a : {Action::Lock, Action::Open, Action::Unlock, Action::Open}) {
              if (auto n = next(d, a)) {
                  d = *n;
                  std::cout << "-> " << name(d) << "\n";
              } else {
                  std::cout << "rejected, still " << name(d) << "\n";
              }
          }
      }
      ```

      ```output
      -> locked
      rejected, still locked
      -> closed
      -> open
      ```

      ### How it works

      - Each row of `rules` is one legal move: from this state, on this event, go to that state. Anything not listed is illegal.
      - `next` searches the table and returns the new state, or `std::nullopt` for an illegal event. With a handful of rules, a linear search is perfectly fast.
      - The caller changes state **only** when `next` succeeds, so an illegal event leaves everything as it was.
      - Adding a new rule is one more line in the table. No logic changes.

      ### Your task

      Write the six transitions from the table below as a `constexpr Transition` array, and `next` as above. In `Match::handle`, call `next(state_, e)`; on success, update `state_`, increment `accepted_` and return `true`; otherwise return `false` without changing anything.

      **Your turn:** implement a match lifecycle with these transitions:

      | From | Event | To |
      |---|---|---|
      | Idle | Start | Warmup |
      | Warmup | GoLive | Live |
      | Live | Pause | Paused |
      | Paused | Resume | Live |
      | Live | End | Over |
      | Paused | End | Over |

      Write `std::optional<State> next(State s, Event e)` using a table, and class `Match` whose `bool handle(Event e)` applies a legal event (returning true) or rejects an illegal one (returning false, state unchanged). `state()` returns the current state and `history()` the number of accepted events.
    seed: |
      #include <optional>

      enum class State { Idle, Warmup, Live, Paused, Over };
      enum class Event { Start, GoLive, Pause, Resume, End };

      std::optional<State> next(State s, Event e) {

      }

      class Match {
      public:
          bool handle(Event e);
          State state() const { return state_; }
          int history() const { return accepted_; }

      private:
          State state_ = State::Idle;
          int accepted_ = 0;
      };
    solution: |
      #include <optional>

      enum class State { Idle, Warmup, Live, Paused, Over };
      enum class Event { Start, GoLive, Pause, Resume, End };

      struct Transition {
          State from;
          Event on;
          State to;
      };

      constexpr Transition kTable[] = {
          {State::Idle, Event::Start, State::Warmup},
          {State::Warmup, Event::GoLive, State::Live},
          {State::Live, Event::Pause, State::Paused},
          {State::Paused, Event::Resume, State::Live},
          {State::Live, Event::End, State::Over},
          {State::Paused, Event::End, State::Over},
      };

      std::optional<State> next(State s, Event e) {
          for (const auto& t : kTable) {
              if (t.from == s && t.on == e) return t.to;
          }
          return std::nullopt;
      }

      class Match {
      public:
          bool handle(Event e);
          State state() const { return state_; }
          int history() const { return accepted_; }

      private:
          State state_ = State::Idle;
          int accepted_ = 0;
      };

      bool Match::handle(Event e) {
          auto to = next(state_, e);
          if (!to) return false;
          state_ = *to;
          accepted_++;
          return true;
      }
    harness: |
      int main() {
          Match m;
          CHECK_EQ("can't go live from idle", m.handle(Event::GoLive), false);
          CHECK("still idle", m.state() == State::Idle);
          CHECK_EQ("start", m.handle(Event::Start), true);
          CHECK_EQ("go live", m.handle(Event::GoLive), true);
          CHECK_EQ("pause", m.handle(Event::Pause), true);
          CHECK_EQ("can't pause twice", m.handle(Event::Pause), false);
          CHECK_EQ("resume", m.handle(Event::Resume), true);
          CHECK_EQ("end", m.handle(Event::End), true);
          CHECK("over", m.state() == State::Over);
          CHECK_EQ("over is final", m.handle(Event::Start), false);
          CHECK_EQ("accepted events", m.history(), 5);
          CHECK("end from paused", next(State::Paused, Event::End) == State::Over);
          CHECK("no resume from live", !next(State::Live, Event::Resume));
      }
    hints:
      - "Define `struct Transition { State from; Event on; State to; };` and a `constexpr Transition kTable[]` with the six rows."
      - "next: loop over the table and return `t.to` on a match; otherwise `std::nullopt`."
      - "handle: ask next(); if it's empty return false, otherwise update the state and count."
