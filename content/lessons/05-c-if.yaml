        hints:
          - Comparing for equality uses two equals signs, `==`. A single `=` would change `ammo`.
          - The part that runs when the condition is false starts with `else`.
        tests:
          - stdin: "0\n"
          - stdin: "12\n"
          - stdin: "1\n"
            hidden: true
      - task: |
          Read a player's HP and the damage they are about to take. If they still have more than 0 HP afterwards, print `survived with N` (N is the HP left). Otherwise print `eliminated`. Input `100 27` prints `survived with 73`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int hp, damage;
              scanf("%d %d", &hp, &damage);
              // decide and print

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int hp, damage;
              scanf("%d %d", &hp, &damage);
              // decide and print
              int left = hp - damage;
              if (left > 0) {
                  printf("survived with %d\n", left);
              } else {
                  printf("eliminated\n");
              }
              return 0;
          }
        hints:
