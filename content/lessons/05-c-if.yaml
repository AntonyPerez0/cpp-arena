        fill: |
          #include <stdio.h>

          int main(void) {
              int score;
              scanf("%d", &score);
              printf("%s\n", score [[>=]] 13 [[?]] "win" [[:]] "keep playing");
              return 0;
          }
        hints:
          - The shape is `condition ? value_if_true : value_if_false`.
          - "13 or more is `>= 13`."
        tests:
          - stdin: "13\n"
          - stdin: "7\n"
          - stdin: "16\n"
            hidden: true
      - task: |
          Read a player's kills and deaths and print them with the right plural for **both**, using two ternaries and no `if`. Input `1 3` prints `1 kill, 3 deaths`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int k, d;
              scanf("%d %d", &k, &d);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int k, d;
              scanf("%d %d", &k, &d);
              printf("%d %s, %d %s\n", k, k == 1 ? "kill" : "kills", d, d == 1 ? "death" : "deaths");
              return 0;
          }
        forbid:
          - pattern: "\\bif\\b"
            message: Use the ternary operator `? :` instead of `if`.
        hints:
          - One printf with four values works, `"%d %s, %d %s\n"`.
          - "Each `%s` gets a ternary, like `k == 1 ? \"kill\" : \"kills\"`."
        tests:
          - stdin: "1 3\n"
          - stdin: "2 1\n"
          - stdin: "0 0\n"
          - stdin: "1 1\n"
            hidden: true

  - title: "Challenge: leap years"
    id: c-if-6
    text: |
      This challenge is about translating an English rule into a precise condition, which is a big part of programming.

      The leap year rule, as a sentence: a year is a leap year if it's divisible by 4, **except** years divisible by 100, which are **not** leap years, **unless** they're also divisible by 400.

      ### Break it down

      "Divisible by N" means the remainder is zero: `year % N == 0`. Then work through the cases:

      | Year | div by 4 | div by 100 | div by 400 | Leap? |
      |---|---|---|---|---|
      | 2023 | no | no | no | no |
      | 2024 | yes | no | no | yes |
      | 1900 | yes | yes | no | no |
      | 2000 | yes | yes | yes | yes |

      A table like this is a great tool: it lists the tricky cases, and you can use it to test your condition afterwards. The same approach works for any rule.

      ### Two ways to write it

      You can write one combined condition with `&&`, `||` and parentheses, or a chain of `if`/`else if` that checks the most specific rule first. Here's the chain style on a different rule (a number is "fizz" if divisible by 3, "buzz" if by 5, "fizzbuzz" if both):

      ```c run
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          if (n % 15 == 0) {
              printf("fizzbuzz\n");
          } else if (n % 3 == 0) {
              printf("fizz\n");
          } else if (n % 5 == 0) {
              printf("buzz\n");
          } else {
              printf("%d\n", n);
          }
          return 0;
      }
      ```

      ```input
      30
      ```

      ```output
      fizzbuzz
      ```

      The most specific case (divisible by both) had to come first, or 30 would stop at "fizz".

      **Your turn:** read a year and print `leap` or `common`.
    seed: |
      #include <stdio.h>

      int main(void) {
          int y;
          scanf("%d", &y);

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(void) {
          int y;
          scanf("%d", &y);
          if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) {
              printf("leap\n");
          } else {
              printf("common\n");
          }
