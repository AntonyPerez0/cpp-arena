          int main(void) {
              int m;
              scanf("%d", &m);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int m;
              scanf("%d", &m);
              if (m < 1 || m > 12) {
                  printf("invalid\n");
              } else if (m == 2) {
                  printf("28\n");
              } else if (m == 4 || m == 6 || m == 9 || m == 11) {
                  printf("30\n");
              } else {
                  printf("31\n");
              }
              return 0;
          }
        hints:
