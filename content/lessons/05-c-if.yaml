      - task: |
          Read two ints: `planted` (1 if the bomb is planted, 0 if not) and `seconds` left on the clock. Print:

          - `CT win` if the bomb is **not** planted and the time is 0
          - `T win` if the bomb is planted and the time is 0
          - `playing` otherwise

          Use the `!` (not) operator for "not planted".
        seed: |
          #include <stdio.h>

          int main(void) {
              int planted, seconds;
              scanf("%d %d", &planted, &seconds);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int planted, seconds;
              scanf("%d %d", &planted, &seconds);
              if (!planted && seconds == 0) {
                  printf("CT win\n");
              } else if (planted && seconds == 0) {
                  printf("T win\n");
              } else {
                  printf("playing\n");
              }
              return 0;
          }
