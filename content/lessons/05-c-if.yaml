  - title: switch
    id: c-if-4
    text: |
      When one value is compared against a list of **constant** possibilities, `switch` is often clearer than a long `else if` chain:

      ```c run
      #include <stdio.h>

      int main(void) {
          int day;
          scanf("%d", &day);
          switch (day) {
              case 6:
              case 7:
                  printf("weekend\n");
                  break;
              case 5:
                  printf("almost weekend\n");
                  break;
              default:
                  printf("weekday\n");
          }
          return 0;
      }
      ```

      ```input
      7
      ```

      ```output
      weekend
      ```

      ### How it works

      `switch` evaluates the value in parentheses once, then **jumps** to the `case` label with the matching constant. From there, it runs statements **downward** until it hits a `break` (which leaves the `switch`) or the end. If no case matches, it jumps to `default`, or does nothing if there's no `default`.

      ### Fall-through

      Because execution continues until a `break`, forgetting one makes the program **fall through** into the next case and run its code too. That's a very common bug. It's also occasionally useful on purpose, as with `case 6:` and `case 7:` above sharing the same code.

      ### Limits

      `case` labels must be constant integer values, which includes characters like `'q'`. You can't use ranges, strings or variables as labels; use `if`/`else if` for those.

      **Your turn:** read a char and print the direction for `w`, `a`, `s`, `d` (`forward`, `left`, `back`, `right`), or `unknown` for anything else.
    fill: |
      #include <stdio.h>

      int main(void) {
          char key;
          scanf(" %c", &key);
          [[switch]] (key) {
              case 'w': printf("forward\n"); [[break]];
              case 'a': printf("left\n"); break;
              [[case]] 's': printf("back\n"); break;
              case 'd': printf("right\n"); break;
              [[default]]: printf("unknown\n");
          }
          return 0;
      }
    hints:
      - "Keywords used here: `switch`, `break`, `case`, `default`."
      - Without the `break` after forward, pressing w would also print left.
    tests:
      - stdin: "w\n"
      - stdin: "a\n"
      - stdin: "s\n"
      - stdin: "q\n"
      - stdin: "d\n"
        hidden: true
    more:
      - task: |
          Read a weapon slot number and print what's in it: `1` is `rifle`, `2` is `pistol`, `3` is `knife`, `4` is `grenade`, and anything else is `empty`.
        fill: |
          #include <stdio.h>

          int main(void) {
              int slot;
              scanf("%d", &slot);
              switch ([[slot]]) {
                  case 1: printf("rifle\n"); [[break]];
                  case 2: printf("pistol\n"); break;
                  case 3: printf("knife\n"); break;
                  case 4: printf("grenade\n"); break;
                  [[default]]: printf("empty\n");
              }
              return 0;
          }
        hints:
          - The switch looks at the variable you read, `slot`.
          - Without `break`, case 1 would fall through into case 2 and print both.
          - The case for "anything else" is called `default`.
        tests:
          - stdin: "1\n"
          - stdin: "3\n"
          - stdin: "9\n"
          - stdin: "2\n"
            hidden: true
          - stdin: "4\n"
            hidden: true
      - task: |
          Read a single letter and print the map it stands for. Both lowercase and uppercase must work: `d` or `D` is `Dust II`, `m` or `M` is `Mirage`, `i` or `I` is `Inferno`. Anything else prints `unknown map`. Use a `switch` and let two cases share the same code.
        seed: |
          #include <stdio.h>

          int main(void) {
              char c;
              scanf(" %c", &c);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              char c;
              scanf(" %c", &c);
              switch (c) {
                  case 'd':
                  case 'D':
                      printf("Dust II\n");
                      break;
                  case 'm':
                  case 'M':
                      printf("Mirage\n");
                      break;
                  case 'i':
                  case 'I':
                      printf("Inferno\n");
                      break;
                  default:
                      printf("unknown map\n");
              }
              return 0;
          }
        require:
          - pattern: "switch\\s*\\("
            message: Use a `switch`.
        hints:
          - "Two cases can share code by putting one right under the other with nothing between them: `case 'd': case 'D':`."
          - Put the `break` after the shared printf, not between the two cases.
        tests:
          - stdin: "d\n"
          - stdin: "M\n"
          - stdin: "i\n"
          - stdin: "x\n"
          - stdin: "D\n"
            hidden: true
          - stdin: "I\n"
            hidden: true

  - title: The ternary operator
    id: c-if-5
    text: |
      The **ternary operator** `condition ? a : b` is a compact if/else that produces a **value**: `a` if the condition is true, `b` otherwise. Because it's an expression, you can use it right inside an assignment or a `printf` argument, where an `if` statement can't go.

      ```c run
      #include <stdio.h>

      int main(void) {
          int x = 7, y = 12;
          int bigger = (x > y) ? x : y;
          printf("bigger: %d\n", bigger);
          int items = 3;
          printf("%d %s\n", items, items == 1 ? "item" : "items");
          return 0;
      }
      ```

      ```output
      bigger: 12
      3 items
      ```

      It reads like a question: "is `x > y`? if so `x`, else `y`".

      ### `%s` and strings

      The second example prints a word with `%s`, the format specifier for **strings** (text). `"item"` and `"items"` are both strings, so whichever one the ternary picks is printed. You'll learn more about strings in their own module.

      ### When to use it

      Use the ternary for small, simple choices between two values. For anything with side effects or longer logic, a normal `if`/`else` is easier to read. Nesting ternaries (`a ? b : c ? d : e`) is legal but quickly becomes hard to follow.

      **Your turn:** read an int `n` and print `n kill` or `n kills` with the correct plural (1 is singular, everything else plural).
    fill: |
      #include <stdio.h>

      int main(void) {
          int n;
          scanf("%d", &n);
          printf("%d %s\n", n, n [[==]] 1 [[?]] "kill" [[:]] "kills");
          return 0;
      }
    hints:
      - "The pattern is `condition ? value_if_true : value_if_false`."
    tests:
      - stdin: "1\n"
      - stdin: "4\n"
      - stdin: "0\n"
        hidden: true
    more:
