      - task: |
          Now read a month **and** a year and print the number of days, so February has 29 days in leap years. Invalid months still print `invalid`. Input `2 2024` prints `29`.
        seed: |
          #include <stdio.h>

          int main(void) {
              int m, y;
              scanf("%d %d", &m, &y);

              return 0;
          }
        solution: |
          #include <stdio.h>

          int main(void) {
              int m, y;
              scanf("%d %d", &m, &y);
              int leap = (y % 4 == 0 && y % 100 != 0) || y % 400 == 0;
              if (m < 1 || m > 12) {
                  printf("invalid\n");
              } else if (m == 2) {
                  printf("%d\n", leap ? 29 : 28);
              } else if (m == 4 || m == 6 || m == 9 || m == 11) {
                  printf("30\n");
              } else {
                  printf("31\n");
              }
              return 0;
          }
