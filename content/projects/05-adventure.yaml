id: adventure
title: Text adventure
lang: c
level: Intermediate
after: c-structs
summary: Explore a tiny map with typed commands. Rooms as structs, movement, items, an inventory and a win condition.
seed: |
  #include <stdio.h>
  #include <string.h>

  enum { NORTH, EAST, SOUTH, WEST };

