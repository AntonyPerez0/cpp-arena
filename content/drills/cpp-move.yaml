topic: cpp-move
lang: cpp
drills:
  - type: predict
    pre: |
      struct T {
          T() {}
          T(const T&) { std::cout << "copy "; }
          T(T&&) noexcept { std::cout << "move "; }
      };
    body: |
      T a;
      T b = a;
      T c = std::move(a);
      std::cout << "\n";
    why: A named object copies; std::move turns it into an rvalue so the move constructor runs.
  - type: predict
    pre: |
      struct T {
          T() {}
          T(const T&) { std::cout << "copy "; }
          T(T&&) noexcept { std::cout << "move "; }
      };
      T make() { return T(); }
    body: |
      T x = make();
      std::cout << "done\n";
    why: Returning a temporary is guaranteed copy elision in C++17. Nothing is copied or moved.
  - type: predict
    pre: |
      void f(int&) { std::cout << "lvalue "; }
      void f(int&&) { std::cout << "rvalue "; }
    body: |
      int x = 1;
      f(x);
      f(2);
      f(std::move(x));
      std::cout << "\n";
    why: Named variables are lvalues; literals and std::move results are rvalues.
  - type: predict
    body: |
      std::vector<int> a = {1, 2, 3};
      std::vector<int> b = std::move(a);
      std::cout << b.size() << "\n";
    why: b took over a's elements.
  - type: fill
    prompt: The parameter type of a move constructor.
    pre: |
      struct Buf {
          int* p = nullptr;
          Buf() = default;
          Buf(Buf[[&&]] o) noexcept : p(o.p) { o.p = nullptr; }
      };
    body: |
      Buf a;
      Buf b(std::move(a));
      std::cout << (b.p == nullptr) << "\n";
    why: "`T&&` is an rvalue reference, which binds to things you're allowed to steal from."
  - type: bug
    pre: |
      struct Buf {
          int* p;
          Buf() : p(new int[8]()) {}
          ~Buf() { delete[] p; }
          Buf(Buf&& o) noexcept : p(o.p) {} // BUG
      };
    body: |
      {
          Buf a;
          Buf b(std::move(a));
      }
      std::cout << "ok\n";
    fix: "Buf(Buf&& o) noexcept : p(o.p) { o.p = nullptr; }"
    ub: true
    why: The source still holds the pointer, so both destructors delete it (double free). Null it out.
  - type: compiles
    pre: |
      struct OnlyMove {
          OnlyMove() = default;
          OnlyMove(const OnlyMove&) = delete;
          OnlyMove(OnlyMove&&) = default;
      };
    body: |
      OnlyMove a;
      OnlyMove b = std::move(a);
      std::cout << "ok\n";
    why: Moving is allowed even though copying is deleted.
  - type: compiles
    pre: |
      struct OnlyMove {
          OnlyMove() = default;
          OnlyMove(const OnlyMove&) = delete;
          OnlyMove(OnlyMove&&) = default;
      };
    body: |
      OnlyMove a;
      OnlyMove b = a;
    why: a is an lvalue, so this needs the deleted copy constructor.
  - type: boss
    prompt: |
      Write a move-only class `Token` holding a `std::string` id. It must be movable (the id moves across and the source's id becomes empty) and not copyable. Give it `explicit Token(std::string id)` and `const std::string& id() const`.
    seed: |
      #include <string>

      class Token {
      public:

      private:
          std::string id_;
      };
    solution: |
      #include <string>
      #include <utility>

      class Token {
      public:
          explicit Token(std::string id) : id_(std::move(id)) {}
          Token(const Token&) = delete;
          Token& operator=(const Token&) = delete;
          Token(Token&& o) noexcept : id_(std::move(o.id_)) { o.id_.clear(); }
          Token& operator=(Token&& o) noexcept {
              id_ = std::move(o.id_);
              o.id_.clear();
              return *this;
          }
          const std::string& id() const { return id_; }

      private:
          std::string id_;
      };
    harness: |
      #include <type_traits>
      #include <utility>
      int main() {
          CHECK("not copyable", !std::is_copy_constructible_v<Token>);
          Token a("abc");
          Token b(std::move(a));
          CHECK_EQ("moved id", b.id(), std::string("abc"));
          CHECK_EQ("source emptied", a.id(), std::string(""));
          Token c("x");
          c = std::move(b);
          CHECK_EQ("move assigned", c.id(), std::string("abc"));
      }
    hints:
      - "Delete the two copy operations; write the move constructor and move assignment."
      - "In both moves, clear the source's string afterwards."
    why: Rule of five in miniature. Moves transfer, copies are forbidden.

  - type: predict
    body: |
      std::vector<int> a = {1, 2, 3};
      std::vector<int> b = std::move(a);
      a.clear();
      a.push_back(9);
      std::cout << a.size() << " " << b.size() << "\n";
    why: After clear(), a moved-from vector is in a known state and can be reused.
  - type: predict
    body: |
      std::string s = "ace";
      std::string old = std::exchange(s, "clutch");
      std::cout << old << " " << s << "\n";
    why: std::exchange stores the new value and returns the old one.
  - type: fill
    prompt: Build the element in place inside the vector.
    pre: |
      struct P {
          std::string name;
          int kills;
          P(std::string n, int k) : name(std::move(n)), kills(k) {}
      };
    body: |
      std::vector<P> v;
      v.[[emplace_back]]("jks", 21);
      std::cout << v[0].name << " " << v[0].kills << "\n";
    why: emplace_back forwards its arguments to P's constructor. push_back("jks", 21) wouldn't compile.
  - type: compiles
    body: |
      std::unique_ptr<int> a = std::make_unique<int>(5);
      std::vector<std::unique_ptr<int>> v;
      v.push_back(a);
    why: unique_ptr can't be copied; push_back(std::move(a)) is required.
  - type: bug
    pre: |
      class Name {
      public:
          explicit Name(std::string s) : s_(s) {} // BUG
          const std::string& get() const { return s_; }
      private:
          std::string s_;
      };
    body: |
      std::string big(64, 'z');
      const char* before = big.data();
      Name n(std::move(big));
      std::cout << (n.get().data() == before ? "moved" : "copied") << "\n";
    fix: "explicit Name(std::string s) : s_(std::move(s)) {}"
    why: The sink parameter s is a named variable, so `s_(s)` copies. Move it into the member.
  - type: predict
    body: |
      std::string a = "x";
      std::string b = a;
      std::string c = std::move(b);
      std::cout << a << c << "\n";
    why: a was copied, so it's untouched. c took b's value.
