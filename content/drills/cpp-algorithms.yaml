  - type: boss
    prompt: |
      Write `std::vector<std::string> by_length(std::vector<std::string> words)` that returns the words sorted by length, and alphabetically among equal lengths. Use std::sort with a lambda.
    seed: |
      #include <algorithm>
      #include <string>
      #include <vector>

      std::vector<std::string> by_length(std::vector<std::string> words) {

      }
    solution: |
      #include <algorithm>
      #include <string>
      #include <vector>

      std::vector<std::string> by_length(std::vector<std::string> words) {
          std::sort(words.begin(), words.end(), [](const std::string& a, const std::string& b) {
              if (a.size() != b.size()) return a.size() < b.size();
              return a < b;
          });
          return words;
      }
    harness: |
      int main() {
          using V = std::vector<std::string>;
          CHECK_EQ("maps", by_length({"nuke", "inferno", "dust2", "cache", "ancient"}), V{"nuke", "cache", "dust2", "ancient", "inferno"});
          CHECK_EQ("empty", by_length({}), V{});
      }
    hints:
      - Compare sizes first, then the strings themselves.
    why: A two-level comparison in one lambda.
