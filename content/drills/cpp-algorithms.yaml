  - type: bug
    body: |
      std::vector<int> v = {1, 2, 3, 4};
      std::remove_if(v.begin(), v.end(), [](int x) { return x % 2 == 0; }); // BUG
      std::cout << v.size() << "\n";
    fix: "std::erase_if(v, [](int x) { return x % 2 == 0; });"
    why: remove_if only shuffles elements; it doesn't shrink the vector. Use erase_if (or erase + remove_if).
