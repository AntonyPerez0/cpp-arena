topic: c-program
lang: c
drills:
  - type: predict
    pre: |
      int counter(void) {
          static int n = 0;
          return ++n;
      }
    body: |
      counter();
      counter();
      printf("%d\n", counter());
    why: A static local keeps its value between calls and is initialized only once.
  - type: predict
    pre: |
      int counter(void) {
          int n = 0;
          return ++n;
      }
    body: |
      counter();
      counter();
      printf("%d\n", counter());
    why: A normal local is created fresh on every call.
  - type: compiles
    pre: |
      typedef struct { int x; } P;
      typedef struct { int x; } P;
    body: |
      P p = {1};
      printf("%d\n", p.x);
    why: "C11 allows repeating an identical typedef, but the two anonymous structs are different types, so this is a conflicting redefinition. Include guards prevent exactly this."
  - type: fill
    prompt: Make this helper private to its file.
    pre: |
      [[static]] int clamp100(int v) { return v > 100 ? 100 : v; }
    body: |
      printf("%d\n", clamp100(250));
    why: static at file scope gives internal linkage, so no other file can see or clash with the name.
  - type: fill
    prompt: Declare a global that's defined further down (or in another file).
    pre: |
      [[extern]] int rounds;
      int half(void) { return rounds / 2; }
      int rounds = 30;
    body: |
      printf("%d\n", half());
    why: extern declares without defining; the single definition comes later.
  - type: compiles
    pre: |
      int total(int *a, int n) {
          int s = 0;
          for (int i = 0; i < n; i++) s += a[i];
          return s;
      }
    body: |
      const int v[] = {1, 2, 3};
      printf("%d\n", total(v, 3));
    answer: "yes"
    why: "C requires a diagnostic here, but GCC and Clang only warn about discarding const, so it compiles. total only reads a, so its parameter should be `const int *`."
  - type: predict
    pre: |
      int main2(int argc, char **argv) {
          return argc > 1 ? (int)strlen(argv[1]) : -1;
      }
    body: |
      char *args[] = {"prog", "dust2", NULL};
      printf("%d %d\n", main2(2, args), main2(1, args));
    why: argv[0] is the program name; argv[1] is the first real argument.
  - type: predict
    body: |
      char *end;
      long v = strtol("42abc", &end, 10);
      printf("%ld %s\n", v, end);
    why: strtol stops at the first character that isn't part of the number and points end at it.
  - type: boss
    why: Usage errors go to stderr with a nonzero exit code so scripts can detect them.
    prompt: |
      This program is run as `./greet NAME` (the tests pass arguments). With exactly one argument, print `hello NAME` and exit 0. Otherwise print `usage: greet NAME` to **stderr** and exit with code 2.
    seed: |
      #include <stdio.h>

      int main(int argc, char **argv) {

          return 0;
      }
    solution: |
      #include <stdio.h>

      int main(int argc, char **argv) {
          if (argc != 2) {
              fprintf(stderr, "usage: greet NAME\n");
              return 2;
          }
          printf("hello %s\n", argv[1]);
          return 0;
      }
    require:
      - pattern: "stderr"
        message: The usage message goes to stderr.
    tests:
      - args: ["ropz"]
      - args: []
        exit: 2
        allowEmpty: true
      - args: ["a", "b"]
        exit: 2
        allowEmpty: true
    hints:
      - "Check `argc != 2` first; print the usage with `fprintf(stderr, ...)` and `return 2;`"
  - type: predict
    pre: |
      #include <stdarg.h>
      int sum(int count, ...) {
          va_list args;
          va_start(args, count);
          int s = 0;
          for (int i = 0; i < count; i++) s += va_arg(args, int);
          va_end(args);
          return s;
      }
    body: |
      printf("%d %d\n", sum(3, 1, 2, 3), sum(0));
    why: The first argument says how many extras follow. With a count of 0, va_arg is never called and the sum stays 0.
  - type: choice
    prompt: A variadic function is passed a `float`. How must it read it?
    choices:
      - "`va_arg(args, double)`, because a float passed through `...` is promoted to double"
      - "`va_arg(args, float)`"
      - "`va_arg(args, int)`"
      - It can't receive floats at all
    answer: 1
    why: Extra arguments go through the default promotions (char and short become int, float becomes double). Reading one as the wrong type is undefined behavior.
