  - type: boss
    prompt: |
      Write `int digit_sum(int n)` returning the sum of the decimal digits of a non-negative number. `digit_sum(4721)` is 14.
    seed: |
      int digit_sum(int n) {

      }
    solution: |
      int digit_sum(int n) {
          int s = 0;
          while (n > 0) {
              s += n % 10;
              n /= 10;
          }
          return s;
      }
    harness: |
      int main(void) {
          CHECK_INT("4721", digit_sum(4721), 14);
          CHECK_INT("0", digit_sum(0), 0);
          CHECK_INT("9", digit_sum(9), 9);
          CHECK_INT("1000000", digit_sum(1000000), 1);
          return 0;
      }
    hints:
      - "`n % 10` is the last digit, `n / 10` drops it."
    why: Peel digits off the end with % 10 and / 10 until n is 0.
  - type: boss
    prompt: |
      Write `int count_multiples(int limit, int k)` that returns how many numbers from 1 to `limit` (inclusive) are divisible by `k`.
    seed: |
      int count_multiples(int limit, int k) {

      }
    solution: |
      int count_multiples(int limit, int k) {
          int c = 0;
          for (int i = 1; i <= limit; i++)
              if (i % k == 0) c++;
          return c;
      }
    harness: |
      int main(void) {
          CHECK_INT("10, 3", count_multiples(10, 3), 3);
          CHECK_INT("10, 1", count_multiples(10, 1), 10);
          CHECK_INT("5, 7", count_multiples(5, 7), 0);
          CHECK_INT("100, 25", count_multiples(100, 25), 4);
          return 0;
      }
    hints:
      - Loop 1..limit and count `i % k == 0`.
    why: Loop over the range and count the ones with no remainder (or just return limit / k).
  - type: predict
    stdin: "ab\ncd\n"
    body: |
      int c, n = 0;
      while ((c = getchar()) != EOF) {
          if (c != '\n') n++;
      }
      printf("%d\n", n);
    why: getchar returns every character of the input, newlines included, until EOF. Skipping the two newlines leaves 4 letters.
  - type: choice
    prompt: Why must the variable that receives `getchar()` be an `int`, not a `char`?
    choices:
      - getchar can return every byte value plus EOF, one more value than a char can hold
      - A char is too slow in loops
      - getchar only returns digits
      - It doesn't matter; a char works the same
    answer: 1
    why: With a char, either EOF is never recognized (where char can't be negative) or a real byte with value 255 is mistaken for EOF.
