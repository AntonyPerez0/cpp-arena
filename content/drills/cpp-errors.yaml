topic: cpp-errors
lang: cpp
drills:
  - type: predict
    pre: |
      bool div(int a, int b, int& out) {
          if (b == 0) return false;
          out = a / b;
          return true;
      }
    body: |
      int r = -1;
      bool ok1 = div(9, 3, r);
      bool ok2 = div(1, 0, r);
      std::cout << ok1 << ok2 << r << "\n";
    why: The failed call leaves r untouched at 3.
  - type: predict
    pre: |
      std::optional<int> parse(const std::string& s) {
          if (s.empty()) return std::nullopt;
          return (int)s.size();
      }
    body: |
      std::cout << parse("").value_or(-1) << " " << parse("abc").value_or(-1) << "\n";
    why: value_or supplies a default for the empty case.
  - type: fill
    prompt: The header for assert.
    body: |
      int hp = 50;
      assert(hp > 0);
      std::cout << "alive\n";
    pre: |
      #include <[[cassert]]>
    why: assert lives in <cassert>.
  - type: compiles
    body: |
      throw 5;
    why: This site's WebAssembly compiler has exceptions disabled (-fno-exceptions), so throw is rejected.
  - type: compiles
    pre: |
      [[nodiscard]] int status() { return 0; }
    body: |
      int s = status();
      std::cout << s << "\n";
    why: The result is used, so [[nodiscard]] is satisfied.
  - type: predict
    pre: |
      struct Result { std::optional<int> value; std::string error; };
      Result half(int x) {
          if (x % 2) return {std::nullopt, "odd"};
          return {x / 2, ""};
      }
    body: |
      auto a = half(8), b = half(7);
      std::cout << *a.value << " " << b.error << "\n";
    why: The Result carries either a value or an error message.

  - type: predict
    pre: |
      std::optional<int> half(int x) {
          if (x % 2) return std::nullopt;
          return x / 2;
      }
      std::optional<int> quarter(int x) {
          auto h = half(x);
          if (!h) return std::nullopt;
          return half(*h);
      }
    body: |
      std::cout << quarter(12).value_or(-1) << " " << quarter(6).value_or(-1) << "\n";
    why: 12 halves twice to 3. 6 halves to 3, which is odd, so the failure passes up.
  - type: fill
    prompt: Pass the failure up to the caller.
    pre: |
      std::optional<int> parse(std::string_view s) {
          if (s.empty()) return std::nullopt;
          int v = 0;
          for (char c : s) {
              if (c < '0' || c > '9') return std::nullopt;
              v = v * 10 + (c - '0');
          }
          return v;
      }
      std::optional<int> add(std::string_view a, std::string_view b) {
          auto x = parse(a), y = parse(b);
          if (!x || !y) return [[std::nullopt]];
          return *x + *y;
      }
    body: |
      std::cout << add("2", "40").value_or(-1) << " " << add("2", "z").value_or(-1) << "\n";
    why: Returning std::nullopt reports the failure instead of inventing a number.
  - type: bug
    pre: |
      std::optional<int> parse(std::string_view s) {
          if (s.empty()) return std::nullopt;
          int v = 0;
          for (char c : s) {
              if (c < '0' || c > '9') return std::nullopt;
              v = v * 10 + (c - '0');
          }
          return v;
      }
      std::optional<int> sum2(std::string_view a, std::string_view b) {
          auto x = parse(a);
          auto y = parse(b);
          if (!x) return std::nullopt; // BUG
          return *x + *y;
      }
    body: |
      std::cout << sum2("4", "q").has_value() << "\n";
    fix: "if (!x || !y) return std::nullopt;"
    ub: true
    why: Only the first failure is passed up. When b fails, *y reads an empty optional, which is undefined behavior.
  - type: predict
    body: |
      std::istringstream in("a=1\n#skip\n\nb=2\n");
      std::string line;
      int n = 0, kept = 0;
      while (std::getline(in, line)) {
          n++;
          if (line.empty() || line[0] == '#') continue;
          kept++;
      }
      std::cout << n << " " << kept << "\n";
    why: getline sees four lines; the comment and blank line are skipped.
  - type: compiles
    body: |
      std::optional<int> o = 5;
      int x = o;
      std::cout << x << "\n";
    why: An optional doesn't silently convert to its value. Use *o or o.value().
