      g[1][2] = 5;
      std::cout << g[1][2] << "\n";
    why: A vector of vectors makes a 2D grid.
  - type: boss
    prompt: |
      Write `std::vector<int> evens(const std::vector<int>& v)` returning only the even numbers, in order.
    seed: |
      #include <vector>

      std::vector<int> evens(const std::vector<int>& v) {

      }
    solution: |
      #include <vector>

      std::vector<int> evens(const std::vector<int>& v) {
          std::vector<int> out;
          for (int x : v)
              if (x % 2 == 0) out.push_back(x);
          return out;
      }
    harness: |
      int main() {
          CHECK_EQ("mixed", evens({1, 2, 3, 4, 6}), std::vector<int>{2, 4, 6});
          CHECK_EQ("none", evens({1, 3}), std::vector<int>{});
          CHECK_EQ("negatives", evens({-2, -1, 0}), std::vector<int>{-2, 0});
      }
    hints:
      - Loop and push_back the ones with x % 2 == 0.
    why: Build a fresh vector with push_back.
  - type: boss
    prompt: |
      Write `std::string join(const std::vector<std::string>& parts, const std::string& sep)`. `join({"a", "b", "c"}, ", ")` is `"a, b, c"`.
    seed: |
      #include <string>
      #include <vector>

      std::string join(const std::vector<std::string>& parts, const std::string& sep) {

      }
    solution: |
      #include <string>
      #include <vector>

      std::string join(const std::vector<std::string>& parts, const std::string& sep) {
          std::string out;
          for (std::size_t i = 0; i < parts.size(); i++) {
              if (i) out += sep;
              out += parts[i];
          }
          return out;
      }
    harness: |
      int main() {
          CHECK_EQ("a, b, c", join({"a", "b", "c"}, ", "), std::string("a, b, c"));
          CHECK_EQ("single", join({"x"}, "-"), std::string("x"));
          CHECK_EQ("empty", join({}, "-"), std::string(""));
      }
    hints:
      - Add the separator before every element except the first.
    why: Putting the separator before all but the first avoids a trailing separator.
