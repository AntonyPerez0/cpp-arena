topic: c-bits
lang: c
drills:
  - type: predict
    body: |
      printf("%d\n", 6 & 3);
    why: 110 & 011 = 010, which is 2.
  - type: predict
    body: |
      printf("%d\n", 6 | 3);
    why: 110 | 011 = 111, which is 7.
  - type: predict
    body: |
      printf("%d\n", 6 ^ 3);
    why: 110 ^ 011 = 101, which is 5.
  - type: predict
    body: |
      printf("%d\n", 1 << 4);
    why: Shifting 1 left by 4 gives 2 to the power 4.
  - type: predict
    body: |
      printf("%d\n", 40 >> 2);
    why: Shifting right by 2 divides by 4 (for non-negative numbers).
  - type: predict
    pre: |
      #define SQUARE(x) x * x
    body: |
      printf("%d\n", SQUARE(1 + 2));
    why: "Text replacement gives 1 + 2 * 1 + 2 = 5. Parenthesize macro arguments!"
  - type: predict
    pre: |
      #define SQUARE(x) ((x) * (x))
    body: |
      printf("%d\n", SQUARE(1 + 2));
    why: With parentheses it expands to ((1 + 2) * (1 + 2)) = 9.
  - type: predict
    body: |
      unsigned flags = 0;
      flags |= 1u << 2;
      flags |= 1u << 0;
      printf("%u\n", flags);
    why: Bits 2 and 0 set gives 4 + 1 = 5.
  - type: fill
    prompt: Turn the flag off.
    body: |
      unsigned s = 7;
      s [[&=]] ~2u;
      printf("%u\n", s);
    why: "`s &= ~FLAG` clears that bit."
  - type: fill
    prompt: Test whether bit 3 is set.
    body: |
      unsigned s = 9;
      printf("%d\n", (s [[&]] (1u << 3)) != 0);
    why: AND with the mask isolates the bit.
  - type: bug
    pre: |
      #define DOUBLE(x) (x) + (x) // BUG
    body: |
      printf("%d\n", DOUBLE(3) * 2);
    fix: "#define DOUBLE(x) ((x) + (x))"
    why: The whole body needs outer parentheses too, otherwise `* 2` only binds to the second (x).
  - type: compiles
    pre: |
      #define MAX 10;
    body: |
      int a[MAX];
      printf("%zu\n", sizeof(a));
    why: "The `;` in the #define gets pasted in, giving `int a[10;];`."
  - type: boss
    prompt: |
      Write `unsigned set_bit(unsigned x, int n, int on)` that returns `x` with bit `n` set to 1 if `on` is non-zero, or cleared to 0 otherwise.
    seed: |
      unsigned set_bit(unsigned x, int n, int on) {

      }
    solution: |
      unsigned set_bit(unsigned x, int n, int on) {
          if (on) return x | (1u << n);
          return x & ~(1u << n);
      }
    harness: |
      int main(void) {
          CHECK_INT("set bit 0 of 0", set_bit(0, 0, 1), 1);
          CHECK_INT("set bit 3 of 1", set_bit(1, 3, 1), 9);
          CHECK_INT("clear bit 0 of 7", set_bit(7, 0, 0), 6);
          CHECK_INT("clear unset bit", set_bit(8, 1, 0), 8);
          return 0;
      }
    hints:
      - "Set with `x | (1u << n)`, clear with `x & ~(1u << n)`."
    why: OR sets a bit, AND with the inverted mask clears it.
