  - type: bug
    pre: |
      #include <stdlib.h>
      struct Node { int v; struct Node *next; };
      int free_all(struct Node *h) {
          int n = 0;
          while (h) {
              struct Node *next = h->next;
              free(h);
              h = h->next; // BUG
              n++;
          }
          return n;
      }
    body: |
      struct Node *b = malloc(sizeof *b); b->v = 2; b->next = NULL;
      struct Node *a = malloc(sizeof *a); a->v = 1; a->next = b;
      printf("%d\n", free_all(a));
    fix: "h = next;"
    ub: true
    why: Reading h->next after free(h) is use-after-free. That's why next was saved before freeing.
