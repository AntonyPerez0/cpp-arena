  - type: boss
    prompt: |
      Write `int list_max(const struct Node *h)` returning the largest value in a non-empty list.
    seed: |
      struct Node {
          int v;
          struct Node *next;
      };

      int list_max(const struct Node *h) {

      }
    solution: |
      struct Node {
          int v;
          struct Node *next;
      };

      int list_max(const struct Node *h) {
          int m = h->v;
          for (const struct Node *p = h->next; p; p = p->next)
              if (p->v > m) m = p->v;
          return m;
      }
    harness: |
      #include <stddef.h>
      int main(void) {
          struct Node c = {4, NULL}, b = {9, &c}, a = {-1, &b};
          CHECK_INT("max of -1,9,4", list_max(&a), 9);
          CHECK_INT("single", list_max(&c), 4);
          return 0;
      }
    hints:
      - Start with the head's value and walk the rest.
    why: A walk that keeps the best value seen so far.
