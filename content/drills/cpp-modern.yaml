      template <std::integral T>
      T twice(T x) { return x * 2; }
    body: |
      std::cout << twice(1.5) << "\n";
    why: double doesn't satisfy std::integral.
  - type: compiles
    body: |
      std::optional<std::string> o = "gg";
      std::cout << o->size() << "\n";
    why: optional supports -> to reach the contained object.
  - type: boss
    prompt: |
      Write `std::optional<std::pair<int, int>> find_pair(const std::vector<int>& v, int target)` returning the first pair of **values** `{a, b}` (a before b in the vector) that sums to `target`, or `std::nullopt`.
    seed: |
      #include <optional>
      #include <utility>
      #include <vector>

      std::optional<std::pair<int, int>> find_pair(const std::vector<int>& v, int target) {

      }
    solution: |
      #include <optional>
      #include <utility>
      #include <vector>

      std::optional<std::pair<int, int>> find_pair(const std::vector<int>& v, int target) {
          for (std::size_t i = 0; i < v.size(); i++)
              for (std::size_t j = i + 1; j < v.size(); j++)
                  if (v[i] + v[j] == target) return std::pair{v[i], v[j]};
          return std::nullopt;
      }
    harness: |
      int main() {
          auto a = find_pair({1, 4, 6, 9}, 10);
          CHECK("found", a.has_value());
          CHECK("1 + 9", a->first == 1 && a->second == 9);
          CHECK("none", !find_pair({1, 2}, 10));
      }
    hints:
      - Two nested loops, j starting after i.
    why: optional carries "found or not" in the type.
