  - type: predict
    body: |
      std::vector<int> v = {1, 2, 3};
      for (int x : v | std::views::transform([](int x) { return x * x; }) | std::views::reverse) std::cout << x;
      std::cout << "\n";
    why: Squares 1, 4, 9, then reversed.
  - type: predict
    body: |
