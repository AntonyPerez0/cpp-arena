      int s = 0;
      for (const auto& [k, v] : m) s += v;
      std::cout << s << "\n";
    why: Structured bindings unpack each pair.
  - type: predict
    body: |
      std::variant<int, std::string> v = 42;
      v = std::string("hs");
      std::cout << v.index() << std::holds_alternative<std::string>(v) << "\n";
    why: index() is the position of the held type in the list (string is 1).
  - type: predict
    body: |
      std::string_view sv = "de_mirage";
      std::cout << sv.substr(3) << " " << sv.size() << "\n";
    why: A view's substr is another view, no copy.
  - type: predict
    body: |
      std::vector<int> v = {1, 2, 3, 4, 5, 6};
      int s = 0;
      for (int x : v | std::views::filter([](int x) { return x % 2 == 0; })) s += x;
