  - type: bug
    pre: |
      std::string_view first_word(const std::string& s) {
          return std::string_view(s).substr(0, s.find(' '));
      }
    body: |
      std::string_view w = first_word(std::string("rush b")); // BUG
      std::cout << w << "\n";
    fix: 'std::string owner = "rush b"; std::string_view w = first_word(owner);'
    ub: true
    why: The temporary string dies at the end of the statement, leaving the view dangling.
  - type: compiles
