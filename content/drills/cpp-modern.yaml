      std::cout << a << b << c << "\n";
    why: Structured bindings work on tuples too.
  - type: fill
    prompt: Signal "no result".
    pre: |
      std::optional<int> find(const std::vector<int>& v, int x) {
          for (int i = 0; i < (int)v.size(); i++) if (v[i] == x) return i;
          return std::[[nullopt]];
      }
    body: |
      std::cout << find({4, 5}, 9).has_value() << "\n";
    why: std::nullopt is the empty optional.
  - type: fill
    prompt: Constrain T to integer types.
