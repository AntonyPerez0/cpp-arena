  - type: bug
    body: |
      int a[5] = {1, 2, 3, 4, 5};
      int s = 0;
      for (int i = 0; i <= 5; i++) s += a[i]; // BUG
      printf("%d\n", s);
    fix: "for (int i = 0; i < 5; i++) s += a[i];"
    why: "`<= 5` reads a[5], one past the end. Off-by-one."
    ub: true
  - type: compiles
    body: |
      int a[3] = {1, 2, 3};
      int b[3];
      b = a;
      printf("%d\n", b[0]);
    why: Arrays can't be assigned as a whole in C. Copy element by element (or memcpy).
  - type: compiles
    body: |
      int n = 3;
      int a[n];
      a[0] = 7;
      printf("%d\n", a[0]);
    why: C99 allows variable-length arrays on the stack.
  - type: compiles
    body: |
      int a[2] = {1, 2, 3};
      printf("%d\n", a[0]);
    answer: "yes"
    why: The C standard forbids extra initializers, but GCC and Clang (this site's compiler) only warn and drop the extra values, so it compiles. It's still a bug, and in C++ it's an error.
  - type: boss
    prompt: |
      Write `int count_above(const int a[], int n, int limit)` returning how many elements are strictly greater than `limit`.
    seed: |
      int count_above(const int a[], int n, int limit) {

      }
    solution: |
      int count_above(const int a[], int n, int limit) {
          int c = 0;
          for (int i = 0; i < n; i++)
              if (a[i] > limit) c++;
          return c;
      }
    harness: |
      int main(void) {
          int a[] = {5, 10, 15, 20};
          CHECK_INT("> 10", count_above(a, 4, 10), 2);
          CHECK_INT("> 100", count_above(a, 4, 100), 0);
          CHECK_INT("> -1", count_above(a, 4, -1), 4);
          CHECK_INT("empty", count_above(a, 0, 0), 0);
          return 0;
      }
    hints:
      - Loop and count.
    why: A counting loop over the array.
  - type: boss
    prompt: |
      Write `void rotate_left(int a[], int n)` that moves every element one place left and puts the first element at the end. `{1, 2, 3, 4}` becomes `{2, 3, 4, 1}`.
    seed: |
      void rotate_left(int a[], int n) {

      }
    solution: |
      void rotate_left(int a[], int n) {
          if (n < 2) return;
          int first = a[0];
          for (int i = 0; i < n - 1; i++) a[i] = a[i + 1];
          a[n - 1] = first;
      }
    harness: |
      int main(void) {
          int a[] = {1, 2, 3, 4};
          rotate_left(a, 4);
          CHECK("{1,2,3,4} -> {2,3,4,1}", a[0] == 2 && a[1] == 3 && a[2] == 4 && a[3] == 1);
          int b[] = {9};
          rotate_left(b, 1);
          CHECK("single element", b[0] == 9);
          return 0;
      }
    hints:
      - Save a[0], shift everything left, then put the saved value at the end.
    why: Save the first element before overwriting it, shift, then place it last.
  - type: predict
    body: |
      srand(7);
      int a = rand();
      srand(7);
      int b = rand();
      printf("%d\n", a == b);
    why: The same seed restarts the same sequence, so both calls return the same number, whatever formula the C library uses.
  - type: choice
    prompt: A game calls `srand(time(NULL))` right before every `rand()`. What goes wrong?
    choices:
      - Within the same second the generator restarts at the same point, so it returns the same number again and again
      - Nothing; reseeding makes the numbers more random
      - rand() stops working after the second srand
      - time(NULL) is always 0
    answer: 1
    why: Seed once, at the start of the program. Each srand restarts the sequence, and time(NULL) only changes once per second.
