topic: cpp-classes
lang: cpp
drills:
  - type: predict
    pre: |
      struct Gun {
          int ammo = 30;
          void fire() { ammo -= 3; }
      };
    body: |
      Gun g;
      g.fire();
      g.fire();
      std::cout << g.ammo << "\n";
    why: Each fire() removes 3 from this object's ammo.
  - type: predict
    pre: |
      struct P {
          int x;
          P(int v) : x(v * 2) {}
      };
    body: |
      P p(5);
      std::cout << p.x << "\n";
    why: The initializer list sets x to v * 2.
  - type: predict
    pre: |
      class C {
      public:
          C() { n++; }
          static int n;
      };
      int C::n = 0;
    body: |
      C a, b, c;
      std::cout << C::n << "\n";
    why: The static counter is shared by all objects.
  - type: predict
    pre: |
      struct A {
          int v = 1;
          A() { v = 2; }
      };
    body: |
      A a;
      std::cout << a.v << "\n";
    why: The default member value is applied first, then the constructor body overwrites it.
  - type: fill
    prompt: Members after this label are only accessible inside the class.
    pre: |
      class Bank {
      public:
          int get() const { return money_; }
      [[private]]:
          int money_ = 800;
      };
    body: |
      Bank b;
      std::cout << b.get() << "\n";
    why: private members are hidden from outside code.
  - type: fill
    prompt: This method must be callable on a const object.
    pre: |
      struct P {
          int hp = 100;
          int get() [[const]] { return hp; }
      };
    body: |
      const P p;
      std::cout << p.get() << "\n";
    why: Only const member functions can be called on const objects.
  - type: bug
    pre: |
      class Score {
      public:
          Score(int t, int ct) : t_(ct), ct_(ct) {} // BUG
          int t() const { return t_; }
      private:
          int t_, ct_;
      };
    body: |
      Score s(13, 7);
      std::cout << s.t() << "\n";
