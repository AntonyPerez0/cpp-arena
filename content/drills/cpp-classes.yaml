  - type: boss
    prompt: |
      Write a class `Counter` with `void add(int n)`, `void reset()`, `int value() const` and `int max_seen() const` (the highest value ever reached, surviving resets).
    seed: |
      class Counter {
      public:

      };
    solution: |
      class Counter {
      public:
          void add(int n) {
              value_ += n;
              if (value_ > max_) max_ = value_;
          }
          void reset() { value_ = 0; }
          int value() const { return value_; }
          int max_seen() const { return max_; }

      private:
          int value_ = 0;
          int max_ = 0;
      };
    harness: |
      int main() {
          Counter c;
          c.add(5);
          c.add(3);
          CHECK_EQ("value 8", c.value(), 8);
          c.reset();
          c.add(2);
          CHECK_EQ("value after reset", c.value(), 2);
          CHECK_EQ("max survives reset", c.max_seen(), 8);
          const Counter& r = c;
          CHECK_EQ("const access", r.value(), 2);
      }
    hints:
      - Two private ints. Update the max inside add().
    why: The class keeps its own invariant (max never decreases) behind private members.
