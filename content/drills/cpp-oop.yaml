  - type: bug
    pre: |
      struct Shape {
          virtual ~Shape() = default;
          virtual double area() const { return 0; }
      };
      struct Square : Shape {
          double s = 2;
          double area() { return s * s; } // BUG
      };
    body: |
      Square sq;
      const Shape& sh = sq;
      std::cout << sh.area() << "\n";
    fix: "double area() const override { return s * s; }"
    why: Without const it's a different function that hides the base one instead of overriding it. `override` would have caught this.
  - type: predict
    pre: |
      struct Clock {
          virtual ~Clock() = default;
          virtual long now() const = 0;
      };
      struct Fake : Clock {
          long t = 42;
          long now() const override { return t; }
      };
      long twice(const Clock& c) { return c.now() * 2; }
    body: |
      Fake f;
      f.t = 10;
      std::cout << twice(f) << "\n";
    why: twice depends only on the Clock interface, so a test can hand it a fake with a chosen time.
