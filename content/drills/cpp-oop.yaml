  - type: boss
    prompt: |
      Make `Circle` and `Square` implement `Shape` (`double area() const`, `std::string name() const`). Then write `std::string largest(const std::vector<std::unique_ptr<Shape>>& v)` returning the name of the biggest shape (assume non-empty). Use `3.14159` for pi.
    seed: |
      #include <memory>
      #include <string>
      #include <vector>

      struct Shape {
          virtual double area() const = 0;
          virtual std::string name() const = 0;
          virtual ~Shape() = default;
      };

      struct Circle : Shape {
          double r;
          explicit Circle(double r) : r(r) {}

      };

      struct Square : Shape {
          double s;
          explicit Square(double s) : s(s) {}

      };

      std::string largest(const std::vector<std::unique_ptr<Shape>>& v) {

      }
    solution: |
      #include <memory>
      #include <string>
      #include <vector>

      struct Shape {
          virtual double area() const = 0;
          virtual std::string name() const = 0;
          virtual ~Shape() = default;
      };

      struct Circle : Shape {
          double r;
          explicit Circle(double r) : r(r) {}
          double area() const override { return 3.14159 * r * r; }
          std::string name() const override { return "circle"; }
      };

      struct Square : Shape {
          double s;
          explicit Square(double s) : s(s) {}
          double area() const override { return s * s; }
          std::string name() const override { return "square"; }
      };

      std::string largest(const std::vector<std::unique_ptr<Shape>>& v) {
          const Shape* best = v[0].get();
          for (const auto& p : v)
              if (p->area() > best->area()) best = p.get();
          return best->name();
      }
    harness: |
      int main() {
          std::vector<std::unique_ptr<Shape>> v;
          v.push_back(std::make_unique<Square>(3));
          v.push_back(std::make_unique<Circle>(2));
          CHECK_EQ("circle r=2 beats square 3", largest(v), std::string("circle"));
          v.push_back(std::make_unique<Square>(4));
          CHECK_EQ("square 4 wins", largest(v), std::string("square"));
      }
    hints:
      - Each shape overrides both functions.
      - Track a `const Shape*` to the best so far (`p.get()`).
    why: Virtual calls through unique_ptr<Shape> pick each concrete area().

  - type: predict
    pre: |
      struct Base {
          virtual ~Base() = default;
          virtual std::string who() const { return "base"; }
      };
      struct Derived : Base {
          std::string who() const override { return Base::who() + "+derived"; }
      };
    body: |
      Derived d;
      const Base& b = d;
      std::cout << b.who() << "\n";
    why: The virtual call reaches Derived::who, which extends the base version.
  - type: compiles
    pre: |
      class A {
      protected:
          int secret = 7;
      };
      class B : public A {
      public:
          int peek() const { return secret; }
      };
    body: |
      B b;
      std::cout << b.peek() << "\n";
