topic: c-memory
lang: c
drills:
  - type: predict
    body: |
      int *p = malloc(3 * sizeof(int));
      p[0] = 1; p[1] = 2; p[2] = 3;
      printf("%d\n", p[0] + p[2]);
      free(p);
    why: Heap memory is used just like an array.
  - type: predict
    body: |
      int *p = calloc(4, sizeof(int));
      printf("%d %d\n", p[0], p[3]);
      free(p);
    why: calloc zeroes the memory.
  - type: predict
    body: |
      int *p = malloc(2 * sizeof(int));
      p[0] = 5; p[1] = 6;
      p = realloc(p, 4 * sizeof(int));
      p[3] = 9;
      printf("%d %d\n", p[1], p[3]);
      free(p);
    why: realloc keeps the old contents when it grows the block.
  - type: predict
    body: |
      char *s = malloc(strlen("gg") + 1);
      strcpy(s, "gg");
      printf("%zu\n", strlen(s));
      free(s);
    why: The +1 is room for '\0'; the length is still 2.
  - type: fill
    prompt: Allocate room for 10 doubles.
    body: |
      double *d = malloc(10 * [[sizeof(double)]]);
      d[9] = 1.5;
      printf("%.1f\n", d[9]);
      free(d);
    why: Multiply the count by the size of one element.
  - type: fill
    prompt: Release the memory.
    body: |
      int *p = malloc(sizeof(int));
      *p = 3;
      printf("%d\n", *p);
      [[free]](p);
    why: Every malloc needs a matching free.
  - type: fill
    prompt: Leave room for the terminator.
    body: |
      const char *src = "clutch";
      char *copy = malloc(strlen(src) [[+ 1]]);
      strcpy(copy, src);
      printf("%s\n", copy);
      free(copy);
    why: The copy needs strlen + 1 bytes for the '\0'.
  - type: bug
    pre: |
      int *make(void) {
          int local[3] = {1, 2, 3}; // BUG
          int *p = local;
          return p;
      }
    body: |
      int *a = make();
      printf("%d\n", a[1]);
    fix: "static int local[3] = {1, 2, 3};"
    why: A local array dies when the function returns. (Making it static, or using malloc, keeps it alive.)
    ub: true
  - type: bug
    body: |
      int *p = malloc(2 * sizeof(int));
      p[0] = 1;
      realloc(p, 4 * sizeof(int)); // BUG
      p[3] = 4;
      printf("%d %d\n", p[0], p[3]);
      free(p);
    fix: "p = realloc(p, 4 * sizeof(int));"
    why: realloc may move the block. You must use the pointer it returns; the old one may already be freed.
    ub: true
  - type: compiles
    body: |
      int *p = malloc(4 * sizeof(int));
      p[0] = 1;
      free(p);
      free(NULL);
      printf("ok\n");
    why: free(NULL) is allowed and does nothing.
  - type: boss
    prompt: |
      Write `int *repeat(int value, int n)` that returns a new heap array of `n` copies of `value`.
    seed: |
      #include <stdlib.h>

      int *repeat(int value, int n) {

      }
    solution: |
      #include <stdlib.h>

      int *repeat(int value, int n) {
          int *a = malloc(n * sizeof(int));
          if (!a) return NULL;
          for (int i = 0; i < n; i++) a[i] = value;
          return a;
      }
    harness: |
      int main(void) {
          int *a = repeat(7, 4);
          CHECK("not NULL", a != NULL);
          CHECK("all 7", a[0] == 7 && a[1] == 7 && a[2] == 7 && a[3] == 7);
          free(a);
          int *b = repeat(-1, 1000);
          CHECK_INT("b[999]", b[999], -1);
          free(b);
          return 0;
      }
    hints:
      - malloc n ints, fill them, return the pointer.
    why: Heap memory outlives the function, so it can be returned.

  - type: predict
    body: |
      int **g = malloc(2 * sizeof *g);
      g[0] = calloc(3, sizeof *g[0]);
      g[1] = calloc(3, sizeof *g[1]);
      g[1][2] = 7;
      printf("%d %d\n", g[0][2], g[1][2]);
      free(g[0]); free(g[1]); free(g);
    why: calloc zeroes each row, and only g[1][2] was set.
  - type: bug
    pre: |
      void free_grid(int **g, int rows) {
          for (int r = 0; r < rows; r++) free(g[r]);
          free(g[0]); // BUG
      }
    body: |
      int **g = malloc(2 * sizeof *g);
      g[0] = malloc(sizeof(int));
      g[1] = malloc(sizeof(int));
      free_grid(g, 2);
      printf("freed\n");
    fix: "free(g);"
    ub: true
    why: The rows are already freed, so free(g[0]) is a double free, and the pointer array g itself leaks.
  - type: fill
    prompt: Allocate the array of row pointers so it stays correct if the type changes.
    body: |
      int **g = malloc(4 * sizeof [[*g‖(*g)‖(int *)‖(int*)]]);
      printf("%d\n", (int)(sizeof *g == sizeof(int *)));
      free(g);
    why: "`sizeof *g` is the size of what g points at (an `int *`), whatever that type becomes."
  - type: predict
    body: |
      char *a = malloc(4);
      strcpy(a, "abc");
      char *b = a;
      free(a);
      a = NULL;
      printf("%d %d\n", a == NULL, b == NULL);
    why: Nulling a doesn't touch b. b is now a dangling pointer, which is why ownership must be clear.
  - type: bug
    body: |
      int *a = malloc(2 * sizeof(int));
      a[0] = 1; a[1] = 2;
      a = realloc(a, 4 * sizeof(int)); // BUG
      a[2] = 3;
      printf("%d\n", a[0] + a[2]);
      free(a);
    fix: "int *tmp = realloc(a, 4 * sizeof(int)); if (tmp == NULL) { free(a); return 1; } a = tmp;"
    ub: true
    why: If realloc fails it returns NULL and the old block leaks, because a was overwritten. Always realloc into a temporary.
  - type: compiles
    body: |
      char *s = malloc(8);
      const char *view = s;
      view[0] = 'x';
      free(s);
    why: Writing through a `const char *` is rejected, even though the memory itself is writable.
  - type: choice
    prompt: Where does the text of a string literal like `"Game over"` usually live?
    choices:
      - In a read-only data section (.rodata), for the whole run of the program
      - On the stack of the function that uses it
      - On the heap, allocated when the line runs
      - In a CPU register
    answer: 1
    why: "Literals are baked into the executable and mapped read-only. That's why returning one from a function is safe, and why writing to one usually crashes."
  - type: predict
    pre: |
      int next_ticket(void) {
          static int ticket = 100;
          return ++ticket;
      }
    body: |
      next_ticket();
      next_ticket();
      printf("%d\n", next_ticket());
    why: A static local is created once, before main, in the data section. It keeps its value between calls, so the third call returns 103.
  - type: choice
    prompt: "A global `int scores[100000];` with no initializer. Where does it live, and what's in it at startup?"
    choices:
      - In .bss, all zeros; it takes no space in the executable file
      - On the stack, garbage
      - On the heap, garbage
      - In .data, and the 400 KB of zeros are stored in the executable
    answer: 1
    why: The file only records how big .bss is. The loader hands the program zero-filled pages for it, so zero-initialized globals are free on disk.
  - type: bug
    body: |
      char *name = "hero"; // BUG
      name[0] = 'H';
      printf("%s\n", name);
    fix: 'char name[] = "hero";'
    why: "name points into read-only memory, so writing to it is undefined behavior (usually a crash). char name[] = \"hero\" makes a writable array copy on the stack."
    ub: true
