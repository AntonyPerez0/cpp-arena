name: Build, verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (also copies the Clang toolchain into public/toolchain)
        run: npm ci

      - name: Compile and run every lesson, drill and project with real GCC/G++
        run: npm run content -- --no-cache

      - name: Type-check and build the site (plus one pre-rendered page per route, sitemap.xml)
        run: npm run build
        env:
          # Real paths (/<repo>/learn/...) need the repository name, and canonical
          # links need the full site address.
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests, including accessibility (axe, WCAG 2.2 AA) and SEO checks
        run: npm run test:e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
