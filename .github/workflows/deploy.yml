name: Build, verify and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The site's own domain (also set under Settings > Pages > Custom domain).
  # Leave it empty to publish at https://<owner>.github.io/<repo>/ instead.
  CUSTOM_DOMAIN: cpparena.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (also copies the Clang toolchain into public/toolchain)
        run: npm ci

      - name: Work out the site address
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Install gdb (records the step-by-step visualizations)
        run: sudo apt-get update && sudo apt-get install -y gdb

      - name: Compile and run every lesson, drill and project with real GCC/G++
        run: npm run content -- --no-cache

      - name: Type-check and build the site (plus one pre-rendered page per route, sitemap.xml)
        run: npm run build
        env:
          # Optional: a Cloudflare Web Analytics token, set under Settings > Secrets and variables > Actions > Variables.
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser tests, including accessibility (axe, WCAG 2.2 AA) and SEO checks
        run: npm run test:e2e

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
